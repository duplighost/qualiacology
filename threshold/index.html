  --ink: #eadcf0;
  --face: "Fraunces", Georgia, "Times New Roman", serif;

#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; cursor: pointer; }
#safe { position: fixed; left: 0; top: 0; width: 0; height: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }

<body>
<canvas id="game" aria-label="THRESHOLD. Tap to release."></canvas>

<noscript>THRESHOLD needs JavaScript.</noscript>
<script>
(() => {
'use strict';

/* ======================= tuning ======================= */
const CFG = {
  burst: 5,          // wisps per tap
  poolMax: 6,        // vesicles in the terminal
  regen: 0.42,       // seconds to refill one vesicle
  drag: 1.25,
  grav: 520,
  jitter: 260,
  rest: 0.38,        // bounce off the membrane
  wispLife: 2.1,
  afterLand: 0.7,    // how long a wisp lingers once it lands on the membrane
  hitstop: 0.075,
  fireHold: 0.34,
  transDur: 0.95,
};

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeIO = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function mulberry(seed) { let a = seed | 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

const FONT = '"Fraunces", Georgia, "Times New Roman", serif';
const CALM = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);   // no shake, softer flash
const DEBUG = /[?&]debug\b/.test(location.search);
const D0 = DEBUG ? Math.max(1, parseInt((location.search.match(/[?&]d=(\d+)/) || [])[1] || '1', 10)) : 1;

/* ======================= canvas & layout ======================= */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d', { alpha: false });
const safeEl = document.getElementById('safe');
const W = 400;                 // logical width of the play column
let H = 800, scale = 1, offX = 0, dpr = 1, safeTop = 0, safeBot = 0;
let memY = 640, termY = 180;   // postsynaptic membrane, presynaptic edge
let BG = null;

const S = {
  mode: 'play', depth: 1, score: 0, best: 0, newBest: false, t: 0,
  syn: null, next: null, wisps: [], parts: [], falling: [], bolts: [],
  pool: CFG.poolMax, shake: 0, flash: 0, hitstop: 0,
  fireT: 0, transT: 0, camY: 0, dieT: 0, overT: 0, outI: 0,
  titleA: 1, started: false, beat: 0, heartT: 0,
  hops: [], hopI: -1, spark: null,
};

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = Math.max(1, window.innerWidth), ch = Math.max(1, window.innerHeight);
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  const colW = Math.min(cw, ch * 0.62);
  scale = colW / W;
  H = ch / scale;
  offX = (cw - colW) / 2;
  const cs = getComputedStyle(safeEl);
  safeTop = (parseFloat(cs.paddingTop) || 0) / scale;
  safeBot = (parseFloat(cs.paddingBottom) || 0) / scale;
  memY = H - (clamp(H * 0.2, 138, 200) + safeBot * 0.6);
  termY = Math.max(memY - clamp(H * 0.56, 330, 470), 112 + safeTop * 0.6);
  BG = null;
  if (S.syn) spritesFor(S.syn);
  if (S.next) spritesFor(S.next);
}

/* ======================= glow sprites ======================= */
const GLOW = {};
function makeGlow(name, r, g, b) {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, `rgba(${r},${g},${b},1)`);
  grd.addColorStop(0.2, `rgba(${r},${g},${b},0.55)`);
  grd.addColorStop(0.5, `rgba(${r},${g},${b},0.16)`);
  grd.addColorStop(1, `rgba(${r},${g},${b},0)`);
  x.fillStyle = grd; x.fillRect(0, 0, 128, 128);
  GLOW[name] = c;
}
makeGlow('mint', 140, 255, 190);
makeGlow('orange', 255, 132, 34);
makeGlow('ember', 255, 196, 96);
makeGlow('violet', 186, 110, 255);
makeGlow('blue', 90, 190, 255);
makeGlow('white', 255, 248, 240);
makeGlow('pale', 205, 218, 255);
function glow(name, x, y, r, a) {
  if (a <= 0.004) return;
  ctx.globalAlpha = a > 1 ? 1 : a;
  ctx.drawImage(GLOW[name], x - r, y - r, r * 2, r * 2);
  ctx.globalAlpha = 1;
}

function loadBest() { try { return parseInt(localStorage.getItem('threshold.best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest() { try { localStorage.setItem('threshold.best', String(S.best)); } catch (e) { /* private window */ } }

/* ======================= geometry ======================= */
function termAt(syn, x) {
  const u = (x - W / 2) / (W / 2);
  return termY + 24 * (1 - u * u) + 4.5 * Math.sin(x * 0.021 + syn.ph1) + 2.2 * Math.sin(x * 0.057 + syn.ph2);
}
function memAt(syn, x) {
  return memY + 3.5 * Math.sin(x * 0.026 + syn.ph3) + 1.8 * Math.sin(x * 0.071 + syn.ph4) + 1.2 * Math.sin(S.t * 1.4 + x * 0.018);
}
function neckY() { return Math.max(-6, termY - 150); }
function pumpkinCY(syn, p) { return memAt(syn, p.x) - p.h * 0.5 + 3; }
function ghostY(g) { return lerp(termY + 52, memY - 76, g.lane) + Math.sin(g.ph) * g.bob; }
function litCount(syn) { let n = 0; for (const p of syn.pumpkins) if (!p.blue && p.lit > 0) n++; return n; }
function axonNodesUp() { const a = []; for (let y = neckY() - 6; y > -70; y -= 52) a.push(y); return a.reverse(); }
function axonNodesDown() { const a = []; for (let y = memY + 74; y < H + 70; y += 52) a.push(y); return a; }
function vesicleX(syn, i) { return W / 2 + (i - (syn.poolMax - 1) / 2) * 25; }
function vesicleY(syn, i) { return termAt(syn, vesicleX(syn, i)) - 17; }

/* ======================= poisons & synapses ======================= */
// Each poison does at the synapse what it does in a body.
const POISON = {
  nightshade: ['nightshade', 'atropine'],        // receptor antagonist: berries sit in the receptors
  calabar: ['calabar bean', 'physostigmine'],    // cholinesterase inhibitor: the ghosts stop eating
  widow: ['black widow', 'α-latrotoxin'],        // forces vesicles to empty on their own
  agaric: ['fly agaric', 'muscimol'],            // GABA-A agonist: cold blue receptors hold the neuron down
  wolfsbane: ['wolfsbane', 'aconitine'],         // sodium channels stuck open: closer to firing, less time
};
const KINDS = Object.keys(POISON);
const FIRST = { 5: 'nightshade', 7: 'calabar', 9: 'widow', 11: 'agaric', 13: 'wolfsbane' };
let lastKey = '';
function pickPoisons(depth) {
  if (FIRST[depth]) return [FIRST[depth]];
  if (depth < 14) return [];
  for (let tries = 0; tries < 24; tries++) {
    const r = Math.random();
    let out;
    if (r < 0.3) out = [];
    else if (depth >= 18 && r > 0.8) {
      const a = KINDS[(Math.random() * KINDS.length) | 0], b = KINDS[(Math.random() * KINDS.length) | 0];
      if (a === b || (a === 'agaric' && b === 'wolfsbane') || (a === 'wolfsbane' && b === 'agaric')) continue;
      out = [a, b];
    } else out = [KINDS[(Math.random() * KINDS.length) | 0]];
    const key = out.slice().sort().join('+');
    if (key && key === lastKey) continue;
    lastKey = key;
    return out;
  }
  return [];
}

function makeSynapse(depth) {
  const poisons = pickPoisons(depth);
  const has = k => poisons.includes(k);
  const syn = {
    depth, poisons, has,
    ph1: rand(0, TAU), ph2: rand(0, TAU), ph3: rand(0, TAU), ph4: rand(0, TAU),
    pumpkins: [], ghosts: [], decor: [], spider: null,
    mito: [[rand(0.26, 0.34), rand(38, 58), rand(-0.5, 0.5)], [rand(0.64, 0.72), rand(48, 72), rand(-0.5, 0.5)]],
    need: 1, blue: 0, window: Infinity, winMax: Infinity,
    litDur: Math.max(0.95, 2.0 - 0.05 * (depth - 1)),
    lifeMul: 1, landMul: 1, poolMax: CFG.poolMax,
    berryT: rand(2.4, 3.2), spontT: 0.5, labelT: 0, root: 293.66,
  };
  let off = (depth - 1) % 12; if (off > 6) off -= 12;
  syn.root = 293.66 * Math.pow(2, off / 12);

  let n = depth === 1 ? 3 : depth === 2 ? 4 : depth < 6 ? 5 : depth < 12 ? (Math.random() < 0.5 ? 5 : 6) : (Math.random() < 0.45 ? 6 : 7);
  const blue = has('agaric') ? (depth < 16 ? 1 : 2) : 0;
  if (blue) n = Math.min(7, Math.max(n, 5 + blue));
  let need = depth === 1 ? 1 : Math.min(2 + Math.floor((depth - 2) / 4), depth >= 30 ? 6 : 5);
  if (has('wolfsbane')) need = Math.max(1, need - 1);
  while (need > 1 && need + blue > n - blue - 1) need--;
  syn.need = need; syn.blue = blue;

  if (depth > 1) {
    let w = Math.max(4.2, 11 - 0.22 * (depth - 2));
    if (has('wolfsbane')) w *= 0.62;
    syn.window = syn.winMax = w;
  }
  if (has('calabar')) { syn.litDur *= 1.4; syn.lifeMul = 2; syn.landMul = 2.2; }

  const margin = 30, span = W - margin * 2, slot = span / n;
  const pw = Math.min(58, slot * 0.86);
  const blueIdx = new Set();
  while (blueIdx.size < blue) blueIdx.add(1 + ((Math.random() * (n - 2)) | 0));
  const degrees = [0, 3, 5, 7, 10, 12, 15];   // minor pentatonic, left to right
  let k = 0;
  for (let i = 0; i < n; i++) {
    const isBlue = blueIdx.has(i);
    const w = pw * rand(0.94, 1.06);
    syn.pumpkins.push({
      x: margin + slot * (i + 0.5) + rand(-0.12, 0.12) * slot,
      w, h: w * rand(0.74, 0.82),
      vx: depth >= 6 && !isBlue ? rand(-1, 1) * Math.min(6 + depth * 0.9, 34) : 0,
      face: (Math.random() * 4) | 0, lean: rand(-0.06, 0.06), flick: rand(0, TAU),
      lit: 0, popT: 9, cap: 0, capJig: 0, perch: false, blue: isBlue,
      note: isBlue ? syn.root / 2 : syn.root * Math.pow(2, degrees[Math.min(k, 6)] / 12),
      spr: null,
    });
    if (!isBlue) k++;
  }
  if (has('nightshade')) {
    const c = shuffle(syn.pumpkins.filter(p => !p.blue));
    const caps = depth < 10 ? 1 : 2;
    for (let i = 0; i < caps && i < c.length - 1; i++) c[i].cap = 3;
  }
  const g = depth < 3 ? 0 : depth < 6 ? 1 : depth < 9 ? 2 : depth < 15 ? 3 : depth < 22 ? 4 : 5;
  for (let i = 0; i < g; i++) {
    const r = rand(17, 23);
    const gh = {
      x: rand(r + 10, W - r - 10), lane: ((i + 0.5) / g) * 0.62 + 0.16 + rand(-0.04, 0.04), r,
      vx: (Math.random() < 0.5 ? -1 : 1) * Math.min(42 + depth * 3, 130) * rand(0.8, 1.15),
      ph: rand(0, TAU), bob: rand(5, 11), eat: 0, lx: 0, ly: 0, y: 0, frozen: has('calabar'), wob: rand(0, TAU),
    };
    gh.y = ghostY(gh);
    syn.ghosts.push(gh);
  }
  if (has('widow')) { const sx = Math.random() < 0.5 ? rand(44, 92) : rand(308, 356); syn.spider = { x: sx, tx: sx, len: 0, target: rand(40, 64), ph: rand(0, TAU), twitch: 0 }; }
  makeDecor(syn);
  spritesFor(syn);
  return syn;
}

function makeDecor(syn) {
  const d = [];
  const xs = syn.pumpkins.map(p => p.x).sort((a, b) => a - b);
  const gaps = [];
  for (let i = 0; i < xs.length - 1; i++) gaps.push((xs[i] + xs[i + 1]) / 2);
  gaps.push(Math.max(12, xs[0] - 36), Math.min(W - 12, xs[xs.length - 1] + 36));
  if (syn.has('nightshade')) for (const x of [rand(36, 100), rand(150, 250), rand(300, 364)]) d.push({ k: 'vine', x, len: rand(14, 30), n: 2 + ((Math.random() * 3) | 0), ph: rand(0, TAU) });
  if (syn.has('calabar')) for (const x of shuffle(gaps.slice()).slice(0, 3)) d.push({ k: 'bean', x, rot: rand(-0.4, 0.4), s: rand(0.85, 1.1) });
  if (syn.has('agaric')) for (const p of syn.pumpkins) if (p.blue) { d.push({ k: 'shroom', p, off: -p.w * 0.7, s: rand(1.05, 1.3) }); d.push({ k: 'shroom', p, off: p.w * 0.66, s: rand(0.75, 0.95) }); }
  if (syn.has('wolfsbane')) for (const x of shuffle(gaps.slice()).slice(0, 4)) d.push({ k: 'monk', x, h: rand(22, 34), ph: rand(0, TAU) });
  syn.decor = d;
}

/* ======================= pumpkin sprites ======================= */
function spritesFor(syn) {
  for (const p of syn.pumpkins) {
    p.spr = p.blue ? { blue: pumpkinSprite(p, 'blue') } : { dark: pumpkinSprite(p, 'dark'), lit: pumpkinSprite(p, 'lit') };
  }
}
function pumpkinSprite(p, state) {
  const s = scale * dpr, padX = 8, padTop = 16, padBot = 6;
  const wL = p.w + padX * 2, hL = p.h + padTop + padBot;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(wL * s)); c.height = Math.max(1, Math.ceil(hL * s));
  const g = c.getContext('2d');
  g.scale(s, s);
  g.translate(padX + p.w / 2, padTop + p.h / 2);
  drawPumpkin(g, p, state, s);
  return { c, ox: padX + p.w / 2, oy: padTop + p.h / 2, wL, hL };
}
function drawPumpkin(g, p, state, s) {
  const w = p.w, h = p.h;
  const pal = state === 'lit' ? ['#ffb760', '#f0731c', '#a63c08', '#6a2405']
    : state === 'blue' ? ['#64bad8', '#2b7596', '#174b64', '#0b2a3a']
    : ['#5c3419', '#3c1f0f', '#25120a', '#120803'];
  const lobes = [[-0.3, 0.4, 0.93], [0.3, 0.4, 0.93], [-0.16, 0.5, 0.98], [0.16, 0.5, 0.98], [0, 0.56, 1]];
  for (const [lx, lw, lh] of lobes) {
    const cx = lx * w, rx = lw * w * 0.5 + 1, ry = h * 0.5 * lh;
    const grd = g.createRadialGradient(cx - rx * 0.3, -ry * 0.4, 1, cx, 0, Math.max(rx, ry) * 1.2);
    grd.addColorStop(0, pal[0]); grd.addColorStop(0.55, pal[1]); grd.addColorStop(1, pal[2]);
    g.beginPath(); g.ellipse(cx, h * 0.5 - ry, rx, ry, 0, 0, TAU);
    g.fillStyle = grd; g.fill();
    g.lineWidth = 1.1; g.strokeStyle = pal[3]; g.stroke();
  }
  g.globalAlpha = state === 'dark' ? 0.07 : 0.2;
  g.beginPath(); g.ellipse(-w * 0.1, -h * 0.27, w * 0.13, h * 0.07, -0.35, 0, TAU);
  g.fillStyle = '#ffffff'; g.fill();
  g.globalAlpha = 1;
  g.beginPath();
  g.moveTo(-w * 0.04, -h * 0.44);
  g.quadraticCurveTo(-w * 0.02, -h * 0.62, w * 0.06, -h * 0.68);
  g.lineTo(w * 0.085, -h * 0.62);
  g.quadraticCurveTo(w * 0.03, -h * 0.58, w * 0.045, -h * 0.44);
  g.closePath();
  g.fillStyle = state === 'dark' ? '#2a2c14' : state === 'blue' ? '#1d3a2a' : '#4f5d1f';
  g.fill();
  carveFace(g, p, state, s);
}
function carveFace(g, p, state, s) {
  const w = p.w, h = p.h;
  g.save();
  if (state === 'dark') g.fillStyle = '#0b0403';
  else {
    const grd = g.createRadialGradient(0, h * 0.05, 1, 0, h * 0.05, w * 0.42);
    if (state === 'lit') { grd.addColorStop(0, '#fffbe0'); grd.addColorStop(0.45, '#ffd863'); grd.addColorStop(1, '#ff9d22'); g.shadowColor = 'rgba(255,200,80,0.95)'; }
    else { grd.addColorStop(0, '#f2ffff'); grd.addColorStop(0.45, '#a6ecff'); grd.addColorStop(1, '#3fb4e6'); g.shadowColor = 'rgba(130,225,255,0.95)'; }
    g.fillStyle = grd; g.shadowBlur = 7 * s;
  }
  const P = pts => { g.beginPath(); g.moveTo(pts[0] * w, pts[1] * h); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i] * w, pts[i + 1] * h); g.closePath(); g.fill(); };
  const E = (x, y, rx, ry, a0, a1) => { g.beginPath(); g.ellipse(x * w, y * h, rx * w, ry * h, 0, a0 || 0, a1 || TAU); g.closePath(); g.fill(); };
  switch (p.face) {
    case 0: // the classic
      P([-0.21, -0.03, -0.07, -0.03, -0.14, -0.24]);
      P([0.07, -0.03, 0.21, -0.03, 0.14, -0.24]);
      P([-0.035, 0.07, 0.035, 0.07, 0, -0.01]);
      g.beginPath();
      g.moveTo(-0.27 * w, 0.12 * h);
      g.quadraticCurveTo(0, 0.24 * h, 0.27 * w, 0.12 * h);
      g.quadraticCurveTo(0, 0.44 * h, -0.27 * w, 0.12 * h);
      g.closePath(); g.fill();
      break;
    case 1: // startled
      E(-0.14, -0.1, 0.07, 0.1); E(0.14, -0.1, 0.07, 0.1);
      E(0, 0.22, 0.075, 0.1);
      break;
    case 2: // mean
      P([-0.23, -0.17, -0.05, -0.05, -0.2, -0.01]);
      P([0.23, -0.17, 0.05, -0.05, 0.2, -0.01]);
      P([-0.03, 0.04, 0.03, 0.04, 0, 0.1]);
      P([-0.29, 0.1, -0.2, 0.2, -0.12, 0.13, -0.04, 0.24, 0.04, 0.14, 0.12, 0.24, 0.2, 0.13, 0.29, 0.1, 0.18, 0.33, 0, 0.38, -0.18, 0.33]);
      break;
    default: // sleepy grin
      E(-0.14, -0.04, 0.075, 0.08, Math.PI, TAU); E(0.14, -0.04, 0.075, 0.08, Math.PI, TAU);
      E(0, 0.13, 0.23, 0.17, 0, Math.PI);
  }
  g.restore();
  if (p.face === 0) { // uncut teeth
    g.fillStyle = state === 'dark' ? '#3b1e0e' : state === 'lit' ? '#ea6a1c' : '#2a7393';
    g.fillRect(-0.1 * w, 0.17 * h, 0.06 * w, 0.065 * h);
    g.fillRect(0.05 * w, 0.175 * h, 0.06 * w, 0.06 * h);
  }
}

/* ======================= sound ======================= */
const A = { c: null, master: null, noise: null, drone: [], last: {} };
function audioOn() {
  if (!A.c) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    try { A.c = new C(); } catch (e) { return; }
    const c = A.c;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.22;
    A.master = c.createGain(); A.master.gain.value = 0.8;
    A.master.connect(comp); comp.connect(c.destination);

function stepWisps(dt) {

      w.vx = w.vx * dk + (Math.random() * 2 - 1) * CFG.jitter * h;
      w.vy = w.vy * dk + CFG.grav * h + (Math.random() * 2 - 1) * CFG.jitter * h;
      w.x += w.vx * h; w.y += w.vy * h;

}

  S.camY = easeIO(T) * H;
  const f = T * (S.hops.length - 1);
  const i = Math.min(S.hops.length - 2, Math.floor(f)), u = f - i;
