<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NO FIXED POINTS — QA</title><style>html,body{margin:0;background:#050407;color:#ddd;font:14px system-ui}#load{position:fixed;inset:0;display:grid;place-items:center;letter-spacing:.18em;text-align:center}small{opacity:.55;display:block;margin-top:12px}pre{white-space:pre-wrap;padding:30px}</style><div id="load">MATERIALIZING THE BLACK CATHEDRAL<small>VISUAL QA BUILD</small></div><script>(async()=>{try{const base='https://raw.githubusercontent.com/duplighost/qualiacology/ai/no-fixed-points-reforged-qa/nfp-qa/';const names=['payload-00.txt','payload-01.txt','payload-02.txt',...Array.from({length:9},(_,i)=>`tail-${String(i).padStart(2,'0')}.txt`)];const parts=await Promise.all(names.map(name=>fetch(base+name,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status+' '+r.url);return r.text()})));const shot=new URLSearchParams(location.hash.slice(1)).get('shot');if(shot)history.replaceState(null,'',location.pathname+'?shot='+encodeURIComponent(shot)+location.hash);const bytes=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const response=new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')));const html=await response.text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre>'+String(e.stack||e)+'</pre>'}})()</script>
