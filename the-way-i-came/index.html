// Where things stand along the river. P = PROPS (put(type, s, n, opts)).
const TREE_TINTS = {
  maple: [[0.92, 0.26, 0.10], [0.95, 0.45, 0.10], [0.80, 0.16, 0.08], [0.98, 0.60, 0.14]],
  birch: [[1.0, 0.80, 0.22], [0.92, 0.70, 0.18], [0.98, 0.88, 0.36], [0.85, 0.62, 0.16]],
  oak: [[0.62, 0.46, 0.18], [0.52, 0.44, 0.20], [0.70, 0.52, 0.20]],
  willow: [[0.75, 0.74, 0.30], [0.66, 0.68, 0.28], [0.85, 0.76, 0.32]],
  spruce: [[0.22, 0.32, 0.20], [0.26, 0.36, 0.22], [0.20, 0.30, 0.22]],
  larch: [[0.95, 0.70, 0.22], [0.88, 0.62, 0.18], [0.98, 0.78, 0.30]],
  green: [[0.40, 0.48, 0.20], [0.46, 0.52, 0.22]],
};
function placeScenery(P, R) {
  const rnd = mulberry32(4242);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const ground = (s, n) => TERRAIN.heightAt(s, n);
  const slope = (s, n) => { const e = 0.8; return Math.hypot(ground(s, n + e) - ground(s, n - e), ground(s + e, n) - ground(s - e, n)) / (2 * e); };
  const tree = (kind, s, n, scale = 1, sway = 1) => {
    const v = Math.floor(rnd() * 3);
    const type = kind === 'larch' ? 'spruce' + v : kind === 'oak' ? 'maple' + v : kind === 'green' ? 'maple' + v : kind + v;
    P.put(type, s, n, { scale: scale * (0.8 + rnd() * 0.45), tint: pick(TREE_TINTS[kind]), sway, dy: -0.1 });
  };
  const reachAt = (s) => { let r = REACH[0].name; for (const q of REACH) if (s >= q.s) r = q.name; return r; };
  const edge = (s) => { const r = clamp(R.rowOf(s), 0, R.NS - 1); return { c: R.P.c[r], hw: R.P.hw[r] }; };
  const town = (s) => s > 135 && s < 470;
  const nearBridge = (s) => Math.abs(s - LANDMARK.bridge) < 7 || Math.abs(s - LANDMARK.footbridge) < 3;

  // ---- vegetation, walking out from each bank
  for (let s = 2; s < R.L - 2; s += 2.2) {
    const reach = reachAt(s);
    const e = edge(s);
    const eta = R.etaAt(s);
    for (const side of [-1, 1]) {
      const bank = e.c + side * e.hw;
      // grass tufts and reeds at the margin
      for (let k = 0; k < 3; k++) {
        const n = bank + side * (rnd() * 4.5 - 1.2);
        const ss = s + rnd() * 2.2;
        const g = ground(ss, n);
        const above = g - eta;
        if (reach === 'town') continue;
        if (above > -0.25 && above < 0.25 && rnd() < (reach === 'meadow' ? 0.75 : reach === 'forest' ? 0.35 : reach === 'mouth' ? 0.0 : 0.25)) P.put('reed' + (k % 2), ss, n, { tint: [0.62, 0.58, 0.30], scale: 0.8 + rnd() * 0.5, sway: 0.6 });
        else if (above > 0.05 && slope(ss, n) < 0.9) P.put('tuft' + (k % 3), ss, n, { tint: reach === 'mouth' ? [0.75, 0.70, 0.45] : reach === 'forest' ? [0.55, 0.50, 0.25] : reach === 'source' ? [0.85, 0.72, 0.38] : [0.62, 0.62, 0.30], scale: 0.8 + rnd() * 0.6, sway: 0.5 });
      }
      // trees
      const maxOut = reach === 'town' ? 0 : 230;
      let out = 0.5 + rnd() * 2;
      while (out < maxOut) {
        const n = bank + side * out;
        const ss = s + rnd() * 2.2;
        if (Math.abs(n) > 460) break;
        const g = ground(ss, n);
        const sl = slope(ss, n);
        const dry = g - eta > 0.35;
        let dens = 0, kinds = null, scale = 1;
        if (reach === 'mouth') { dens = out > 40 ? 0.05 : 0; kinds = ['spruce']; }
        else if (reach === 'meadow') { dens = out < 6 ? 0.30 : out < 60 ? 0.02 : 0.05; kinds = out < 8 ? ['willow', 'willow', 'birch'] : ['oak', 'maple', 'birch']; }
        else if (reach === 'mill') { dens = out < 8 ? 0.2 : 0.05; kinds = ['oak', 'maple', 'willow', 'birch']; }
        else if (reach === 'forest') { dens = out < 4 ? 0.55 : 0.4; kinds = ['maple', 'maple', 'birch', 'birch', 'spruce', 'oak']; scale = 1.15; }
        else if (reach === 'gorge') { dens = sl > 1.2 ? 0.04 : 0.45; kinds = ['spruce', 'spruce', 'birch', 'maple']; scale = 1.1; }
        else if (reach === 'falls') { dens = sl > 1.2 ? 0.03 : 0.35; kinds = ['spruce', 'spruce', 'birch']; scale = 1.15; }
        else if (reach === 'source') { dens = out < 10 ? 0.12 : 0.06; kinds = ['larch', 'larch', 'spruce', 'birch']; }
        if (dry && kinds && rnd() < dens && sl < 1.6) tree(pick(kinds), ss, n, scale, out < 6 ? 1 : 0.7);
        out += 2.5 + rnd() * (out < 20 ? 3 : out < 80 ? 6 : 12);
      }
      // the odd rock on the bank
      if (rnd() < (reach === 'gorge' || reach === 'falls' ? 0.45 : reach === 'source' ? 0.25 : 0.08)) {
        const n = bank + side * (0.5 + rnd() * 6), ss = s + rnd() * 2;
        P.put('rock' + Math.floor(rnd() * 4), ss, n, { scale: 0.5 + rnd() * 1.2, tint: pick([[0.50, 0.49, 0.46], [0.44, 0.43, 0.41], [0.56, 0.54, 0.50]]), dy: -0.25, sway: 0 });
      }
      if (reach === 'forest' && rnd() < 0.18) {
        const n = bank + side * (2 + rnd() * 20), ss = s + rnd() * 2;
        if (ground(ss, n) - eta > 0.4) P.put('fern' + Math.floor(rnd() * 2), ss, n, { tint: rnd() < 0.5 ? [0.75, 0.55, 0.20] : [0.45, 0.52, 0.22], scale: 1 + rnd(), sway: 0.6 });
      }
    }
  }

  // ---- the mouth: the light on the jetty, a boat at the net, the net's floats
  P.put('lighthouse', 58, -19.5, { yaw: 0, sway: 0, dy: 0 });
  P.put('boat0', 22, 9, { y: 0.0, yaw: 0.6, riverYaw: true, sway: 0 });
  for (const [s, n] of [[16, 5], [41, -6], [66, 11]]) P.put('box', s, n, { y: -0.05, sx: 0.5, sy: 0.5, sz: 0.5, tint: [0.85, 0.25, 0.12], sway: 0, yaw: 0 });
  P.put('boat1', 96, 16.6, { y: 0.0, yaw: 1.4, riverYaw: true, sway: 0 });
  for (let n = 15.5; n > -1.5; n -= 1.5) P.put('box', 95 + Math.sin(n) * 0.3, n, { y: 0.05, sx: 0.32, sy: 0.22, sz: 0.32, tint: [0.95, 0.42, 0.12], sway: 0, yaw: 0 });

  // ---- the town: houses in rows behind both quays, lamps, street trees, moored boats, the bridge, people
  for (const side of [-1, 1]) {
    for (let s = 140; s < 460; s += 0) {
      const w = 7 + rnd() * 4;
      const sc = s + w / 2;

        if (rnd() < 0.7) { const n2 = side * (e.hw + 20 + rnd() * 6); P.put('house' + Math.floor(rnd() * 4), sc + rnd() * 3, n2, { yaw: rnd() * 0.3 + (side > 0 ? Math.PI / 2 : -Math.PI / 2), riverYaw: true, sx: w / 8, sy: 0.8 + rnd() * 0.8, tint: pick([[0.9, 0.86, 0.78], [0.82, 0.78, 0.72], [0.88, 0.8, 0.68]]), sway: 0, dy: 0 }); }
      }

    }
    for (let s = 150; s < 450; s += 16) {
      if (nearBridge(s)) continue;
      const e = edge(s);
      P.put('lamp', s, side * (e.hw + 1.2), { sway: 0, yaw: 0 });
      if (rnd() < 0.8) P.put('maple' + Math.floor(rnd() * 3), s + 8, side * (e.hw + 3.5), { scale: 0.7, tint: pick(TREE_TINTS.maple), sway: 0.8 });
    }
    for (let s = 230; s < 440; s += 9 + rnd() * 14) {
      if (nearBridge(s)) continue;
      const e = edge(s);
      if (rnd() < 0.55) P.put('boat' + Math.floor(rnd() * 2), s, side * (e.hw - 1.4), { y: R.etaAt(s) - 0.05, yaw: 0, riverYaw: true, sway: 0 });
    }
  }
  P.bridgeMesh = { s: LANDMARK.bridge, n0: -12, n1: 12, piers: [-3.6, 3.6], w: 6.2 };
  // people on the bridge and the quay; the kid in the red coat on the bridge
  const bd = R.etaAt(LANDMARK.bridge) + 4.6;
  P.put('person', LANDMARK.bridge - 2.2, -6, { y: bd, yaw: Math.PI, riverYaw: true, sway: 0, tint: [0.32, 0.35, 0.42] });
  P.put('person', LANDMARK.bridge + 2.3, 2, { y: bd, yaw: 0.2, riverYaw: true, sway: 0, tint: [0.45, 0.38, 0.30] });
  P.put('kid', LANDMARK.bridge - 2.6, 1.2, { y: bd, yaw: Math.PI, riverYaw: true, sway: 0, tint: [1, 1, 1] });
  P.put('person', LANDMARK.bridge - 2.6, 2.0, { y: bd, yaw: Math.PI + 0.3, riverYaw: true, sway: 0, tint: [0.25, 0.30, 0.28] });
  for (const [s, n] of [[384, 11.6], [402, 11.8], [421, 11.4]]) P.put('person', s, n, { yaw: -Math.PI / 2, riverYaw: true, sway: 0, tint: pick([[0.30, 0.38, 0.28], [0.40, 0.34, 0.26], [0.26, 0.28, 0.34]]) });
  // the footbridge: a plank deck and rails across
  {
    const s = LANDMARK.footbridge, y = R.etaAt(s) + 3.2;
    P.put('woodbox', s, 0, { y, yaw: 0, riverYaw: true, sx: 26, sy: 0.25, sz: 2.2, tint: [0.42, 0.32, 0.22], sway: 0 });
    for (const off of [-1, 1]) P.put('woodbox', s + off * 1.0, 0, { y: y + 1.0, yaw: 0, riverYaw: true, sx: 26, sy: 0.08, sz: 0.08, tint: [0.3, 0.24, 0.18], sway: 0 });
  }

  // ---- meadows: fence lines; the mill
  for (let s = 480; s < 750; s += 3.2) {
    const e = edge(s);
    if (Math.floor(s / 90) % 2 === 0) P.put('woodbox', s, -(e.hw + 14 + Math.sin(s * 0.03) * 4), { yaw: 0, sx: 0.16, sy: 1.2, sz: 0.16, tint: [0.45, 0.38, 0.30], sway: 0 });

}

// A pool-and-weir fish ladder in a walled channel from s0 (bottom) to s1 (top): weir crests step down from top
// (relative to the river's bank toe at relAt) by stepH; each pool floor sits under the weir that holds it.
function ladder(F, s0, s1, n0, n1, steps, top, stepH, relAt) {
  const len = (s1 - s0) / steps;
  for (let j = 0; j <= steps; j++) {
    const s = s0 + j * len, crest = top - (steps - j) * stepH;
    const notchN = j % 2 ? n0 + 0.9 : n1 - 0.9;
    F.push({ t: 'ridge', s, n0, n1, th: 0.5, rel: crest, relAt, notches: [{ n: notchN, w: 1.0, d: 0.22 }], set: true });
    if (j < steps) F.push({ t: 'cut', s0: s + 0.22, s1: s + len - 0.22, n0, n1, relZ: crest - 0.85, relAt });
  }
  // a wide pool at the foot, open to the river along its side, that the ladder's water pours into
  F.push({ t: 'cut', s0: s0 - 12, s1: s0 - 0.22, n0, n1: n1 + 2.5, relZ: top - steps * stepH - 1.1, relAt, natural: true });
}
function ladderOld(F, s0, s1, n0, n1, steps) {
  const L = s1 - s0, len = L / steps;
  for (let k = 0; k < steps; k++) {
    const a = s0 + k * len, b = a + len;
    // floor rises with each pool (relative to the river at the top, which is 2.4 m above the bottom)
    F.push({ t: 'cut', s0: a, s1: b + 0.01, n0, n1, relZ: -1.55 - 2.4 + (2.4 * (k + 0.5)) / steps, relAt: s1 + 2 });
    // weir at the top end of each pool, with a notch alternating sides
    const notchN = k % 2 ? n0 + 0.9 : n1 - 0.9;
    F.push({ t: 'ridge', s: b, n0, n1, th: 0.5, rel: -1.0 - 2.4 + (2.4 * (k + 1)) / steps, relAt: s1 + 2, notches: [{ n: notchN, w: 0.9, d: 0.25 }], masonry: true });
  }
}

// Logs across the channel, lying in the water, with two ways through.
function logjam(F, s) {
  const logs = [[s - 1.5, -11, -6.8, 0.35], [s, -6.2, 1.6, 0.4], [s + 1.2, 4.6, 11, 0.4], [s - 2.5, -1, 6, 0.3], [s + 2.8, -9, -2.5, 0.3]];
  for (const [ls, n0, n1, rad] of logs) F.push({ t: 'log', s: ls, n0, n1, r: rad, rel: 0.25, relAt: s });
}

// ---- 30-sim.js ----
// Shallow-water simulation on the GPU, in river coordinates, over a window of NL rows that slides along the river.
// State texture (NW x NL, rgba32f): r = depth h at the cell centre, g = velocity across (n) on the cell's +n face,
// b = velocity along (s) on the cell's +s face (negative = downstream), a = foam.
// Staggered grid, MacCormack semi-Lagrangian momentum, upwind mass flux scaled so no cell ever goes negative,
// Manning friction, critical-velocity clamp where water pours over an edge, sponges at both window ends.
const SIM_DT = 1 / 120;

const SIM_GLSL = `
uniform sampler2D uS;
uniform sampler2D uBed;
uniform sampler2D uRef;
uniform ivec2 uN;
uniform int uJ0;
uniform int uNS;
uniform int uRefW;
uniform float uDt;
uniform float uDx;
const float G = 9.81;
const float EPS = 0.003;
vec4 S(ivec2 c) { return texelFetch(uS, clamp(c, ivec2(0), uN - 1), 0); }
float B(ivec2 c) { int r = clamp(c.y + uJ0, 0, uNS - 1); return texelFetch(uBed, ivec2(clamp(c.x, 0, uN.x - 1), r), 0).r; }
vec4 REF4(int row) { row = clamp(row, 0, uNS - 1); return texelFetch(uRef, ivec2(row % uRefW, row / uRefW), 0); }
vec2 REF(int row) { return REF4(row).rg; }
uniform sampler2D uSteady;   // settled coarse run: (water surface, velocity across, velocity along, -) per coarse cell
uniform float uSteadyOn;
uniform float uSdx;
uniform vec2 uSN;
vec4 SD(ivec2 q) { return texelFetch(uSteady, clamp(q, ivec2(0), ivec2(uSN) - 1), 0); }
vec4 steadyAt(ivec2 c) {
  vec2 p = (vec2(c) + vec2(0.0, float(uJ0)) + 0.5) * uDx / uSdx - 0.5;
  vec2 f = floor(p); ivec2 i0 = ivec2(f); vec2 t = p - f;
  return mix(mix(SD(i0), SD(i0 + ivec2(1, 0)), t.x), mix(SD(i0 + ivec2(0, 1)), SD(i0 + ivec2(1, 1)), t.x), t.y);
}
float hRef(ivec2 c) {
  if (uSteadyOn > 0.5) return max(0.0, steadyAt(c).r - B(c));
  return max(0.0, REF(c.y + uJ0).r - B(c));
}
float vRef(ivec2 c) {
  if (uSteadyOn > 0.5) { vec4 q = steadyAt(c); return max(0.0, q.r - B(c)) > EPS ? q.b : 0.0; }
  float h = hRef(c); return -REF(c.y + uJ0).g * pow(h, 0.6667);
}
float sponge(int j) {
  float a = float(j) / 14.0, b = float(uN.y - 1 - j) / 14.0;
  float w = 1.0 - clamp(min(a, b), 0.0, 1.0);
  return w * w * 0.2;
}
`;

const SIM_FS = {
  init: `out vec4 o;
void main(){ ivec2 c = ivec2(gl_FragCoord.xy); float h = hRef(c); o = vec4(h, 0.0, h > EPS ? vRef(c) : 0.0, 0.0); }`,

  shift: `uniform int uShift; out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  ivec2 src = c + ivec2(0, uShift);
  if (src.y >= 0 && src.y < uN.y) { o = texelFetch(uS, src, 0); return; }
  float h = hRef(c); o = vec4(h, 0.0, h > EPS ? vRef(c) : 0.0, 0.0);
}`,

  // forward semi-Lagrangian step of u, v, foam (h copied)
  advect: `out vec4 o;
float bil(vec2 p, vec4 m) {
  vec2 f = floor(p); ivec2 i0 = ivec2(f); vec2 t = p - f;
  float a = dot(S(i0), m), b = dot(S(i0 + ivec2(1, 0)), m), c = dot(S(i0 + ivec2(0, 1)), m), d = dot(S(i0 + ivec2(1, 1)), m);
  return mix(mix(a, b, t.x), mix(c, d, t.x), t.y);
}
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s0 = S(c);
  float k = uDt / uDx;
  float vU = 0.25 * (s0.b + S(c + ivec2(1, 0)).b + S(c + ivec2(0, -1)).b + S(c + ivec2(1, -1)).b);
  vec2 pU = vec2(c) + vec2(1.0, 0.5) - k * vec2(s0.g, vU);
  float u = bil(pU - vec2(1.0, 0.5), vec4(0, 1, 0, 0));
  float uV = 0.25 * (s0.g + S(c + ivec2(-1, 0)).g + S(c + ivec2(0, 1)).g + S(c + ivec2(-1, 1)).g);
  vec2 pV = vec2(c) + vec2(0.5, 1.0) - k * vec2(uV, s0.b);
  float v = bil(pV - vec2(0.5, 1.0), vec4(0, 0, 1, 0));
  vec2 vc = vec2(0.5 * (s0.g + S(c - ivec2(1, 0)).g), 0.5 * (s0.b + S(c - ivec2(0, 1)).b));
  vec2 pC = vec2(c) + 0.5 - k * vc;
  float f = bil(pC - 0.5, vec4(0, 0, 0, 1));
  o = vec4(s0.r, u, v, f);
}`,

  // MacCormack correction with the forward result in uF, clamped to the backtraced stencil
  maccormack: `uniform sampler2D uF; out vec4 o;
vec4 F(ivec2 c) { return texelFetch(uF, clamp(c, ivec2(0), uN - 1), 0); }
float bilF(vec2 p, vec4 m) {
  vec2 f = floor(p); ivec2 i0 = ivec2(f); vec2 t = p - f;
  float a = dot(F(i0), m), b = dot(F(i0 + ivec2(1, 0)), m), c = dot(F(i0 + ivec2(0, 1)), m), d = dot(F(i0 + ivec2(1, 1)), m);
  return mix(mix(a, b, t.x), mix(c, d, t.x), t.y);
}
vec2 mm(vec2 p, vec4 m) {
  ivec2 i0 = ivec2(floor(p));
  float a = dot(S(i0), m), b = dot(S(i0 + ivec2(1, 0)), m), c = dot(S(i0 + ivec2(0, 1)), m), d = dot(S(i0 + ivec2(1, 1)), m);
  return vec2(min(min(a, b), min(c, d)), max(max(a, b), max(c, d)));
}
float corr(vec2 pos, vec2 vel, vec2 off, vec4 m, float phiHat, float phi0) {
  float k = uDt / uDx;
  float fwd = bilF(pos + k * vel - off, m);
  float r = phiHat + 0.5 * (phi0 - fwd);
  vec2 lim = mm(pos - k * vel - off, m);
  return clamp(r, lim.x, lim.y);
}
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s0 = S(c), fh = F(c);
  float vU = 0.25 * (s0.b + S(c + ivec2(1, 0)).b + S(c + ivec2(0, -1)).b + S(c + ivec2(1, -1)).b);
  float u = corr(vec2(c) + vec2(1.0, 0.5), vec2(s0.g, vU), vec2(1.0, 0.5), vec4(0, 1, 0, 0), fh.g, s0.g);
  float uV = 0.25 * (s0.g + S(c + ivec2(-1, 0)).g + S(c + ivec2(0, 1)).g + S(c + ivec2(-1, 1)).g);
  float v = corr(vec2(c) + vec2(0.5, 1.0), vec2(uV, s0.b), vec2(0.5, 1.0), vec4(0, 0, 1, 0), fh.b, s0.b);
  vec2 vc = vec2(0.5 * (s0.g + S(c - ivec2(1, 0)).g), 0.5 * (s0.b + S(c - ivec2(0, 1)).b));
  float f = corr(vec2(c) + 0.5, vc, vec2(0.5), vec4(0, 0, 0, 1), fh.a, s0.a);
  o = vec4(s0.r, u, v, f);
}`,

  // outflow limiter: fraction of each cell's outgoing flux it can actually supply this step
  limit: `out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s = S(c);
  float uw = c.x > 0 ? S(c - ivec2(1, 0)).g : 0.0;
  float vs = S(c - ivec2(0, 1)).b;
  float outv = uDt / uDx * s.r * (max(s.g, 0.0) + max(-uw, 0.0) + max(s.b, 0.0) + max(-vs, 0.0));
  o = vec4(outv > s.r && outv > 0.0 ? s.r / outv : 1.0, 0.0, 0.0, 0.0);
}`,

  height: `uniform sampler2D uK; out vec4 o;
float K(ivec2 c) { return texelFetch(uK, clamp(c, ivec2(0), uN - 1), 0).r; }
float flux(float u, float hA, float kA, float hB, float kB) { return u > 0.0 ? u * hA * kA : u * hB * kB; }
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  vec4 s = S(c); float k0 = K(c);
  ivec2 ex = ivec2(1, 0), ny = ivec2(0, 1);
  vec4 sw = S(c - ex), ss = S(c - ny);
  float Fe = c.x < uN.x - 1 ? flux(s.g, s.r, k0, S(c + ex).r, K(c + ex)) : 0.0;
  float Fw = c.x > 0 ? flux(sw.g, sw.r, K(c - ex), s.r, k0) : 0.0;
  float Gn = flux(s.b, s.r, k0, S(c + ny).r, K(c + ny));
  float Gs = flux(ss.b, ss.r, K(c - ny), s.r, k0);
  float h = max(0.0, s.r - uDt / uDx * (Fe - Fw + Gn - Gs));
  if (h > EPS) h += uDt * REF4(c.y + uJ0).b;
  float w = sponge(c.y);
  if (w > 0.0) h = mix(h, hRef(c), w);
  o = vec4(h, s.g, s.b, s.a);
}`,

  velocity: `uniform float uN2; out vec4 o;
float face(float u, float hA, float bA, float hB, float bB, float vt) {
  float eA = hA + bA, eB = hB + bB;
  if (hA < EPS && hB < EPS) return 0.0;
  if (hA < EPS && bA > eB) return 0.0;
  if (hB < EPS && bB > eA) return 0.0;
  u -= G * uDt / uDx * (eB - eA);
  float hUp = u > 0.0 ? hA : hB;
  if (hUp < EPS) return 0.0;
  bool pour = u > 0.0 ? (eB < bA) : (eA < bB);
  if (pour) { float vcr = 1.15 * sqrt(G * hUp); u = clamp(u, -vcr, vcr); }
  float hf = max(0.5 * (hA + hB), 0.03);
  float sp = sqrt(u * u + vt * vt);
  u /= 1.0 + uDt * G * uN2 * sp / pow(hf, 1.3333);
  float um = 0.4 * uDx / uDt;
  return clamp(u, -um, um);
}
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  ivec2 ex = ivec2(1, 0), ny = ivec2(0, 1);
  vec4 s = S(c), e = S(c + ex), n = S(c + ny);
  float b0 = B(c), be = B(c + ex), bn = B(c + ny);
  float vAtE = 0.25 * (s.b + e.b + S(c - ny).b + S(c + ex - ny).b);
  float uAtN = 0.25 * (s.g + n.g + S(c - ex).g + S(c - ex + ny).g);
  float u = c.x < uN.x - 1 ? face(s.g, s.r, b0, e.r, be, vAtE) : 0.0;
  float v = face(s.b, s.r, b0, n.r, bn, uAtN);
  float w = sponge(c.y);
  if (w > 0.0) {
    float hr = hRef(c);
    u = mix(u, 0.0, w);
    v = mix(v, hr > EPS ? vRef(c) : 0.0, w);
  }
  if (c.y == uN.y - 1) { float hr = hRef(c); v = hr > EPS ? vRef(c) : 0.0; }
  o = vec4(s.r, u, v, s.a);
}`,

  // foam: made where water converges, runs fast and shallow, or pours over steep bed; carried by the flow, fades
  foam: `out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy);
  ivec2 ex = ivec2(1, 0), ny = ivec2(0, 1);
  vec4 s = S(c);
  float uw = S(c - ex).g, vs = S(c - ny).b;
  vec2 v = vec2(0.5 * (s.g + uw), 0.5 * (s.b + vs));
  float div = (s.g - uw + s.b - vs) / uDx;
  float sp = length(v);
  float bx = B(c + ex) - B(c - ex), by = B(c + ny) - B(c - ny);
  float slope = length(vec2(bx, by)) / (2.0 * uDx);
  // vorticity from the face velocities around the cell
  float curl = ((S(c + ex).b + S(c + ex - ny).b) - (S(c - ex).b + S(c - ex - ny).b)) / (4.0 * uDx)
             - ((S(c + ny).g + S(c + ny - ex).g) - (S(c - ny).g + S(c - ny - ex).g)) / (4.0 * uDx);
  float src = 0.0;
  src += max(0.0, -div - 0.6) * 0.7 * smoothstep(0.1, 0.3, s.r) * smoothstep(0.2, 0.6, sp);
  src += max(0.0, sp - 2.2) * 0.35 * smoothstep(0.5, 0.15, s.r);
  // water running down steep bed (over a lip, down a chute), not water lapping a sloping shore
  float downhill = sp > 0.05 ? -dot(v / sp, vec2(bx, by) / (2.0 * uDx)) : 0.0;

  float stepUp = max(B(c + ny * 2), B(c + ny * 3)) - B(c);
  if (stepUp > 0.45 && s.r > 0.3) src += clamp(stepUp - 0.45, 0.0, 1.5) * 1.8 * smoothstep(0.2, 1.0, sp);

  // splashes and wakes: add water/velocity around up to 8 points (s-row, col units)
  splat: `uniform vec4 uSp[8]; uniform vec4 uSv[8]; uniform int uNsp; out vec4 o;

  ivec2 c = ivec2(gl_FragCoord.xy);

    vec4 sv = uSv[i]; // x vel n, y vel s, z foam, w unused

  // for drawing the water per pixel: gaussian-weighted slopes (across, along), foam and speed over 5 x 5 cells,

  look: `uniform sampler2D uSurf;
layout(location = 0) out vec4 o;
layout(location = 1) out vec4 o2;   // smoothed velocity (across, along) at the cell centre
vec4 SF(ivec2 c) { return texelFetch(uSurf, clamp(c, ivec2(0), uN - 1), 0); }

}`,
  // coarse average for the CPU (4x4 cells): h, u, v at centres, eta
  gather: `out vec4 o;
void main(){
  ivec2 c = ivec2(gl_FragCoord.xy) * 4;
  vec4 acc = vec4(0.0); float wet = 0.0;
  for (int dy = 0; dy < 4; dy++) for (int dx = 0; dx < 4; dx++) {

  o = vec4(h, wet > 1e-4 ? acc.y / wet : 0.0, wet > 1e-4 ? acc.z / wet : 0.0, acc.w / 16.0);
}`,
};

const SIM = {
  j0: 0, // first river row in the window
  steps: 0,
  init(river) {
    this.river = river;
    const NS = river.NS;
    const bm = new Float32Array(NW * NS * 2);
    for (let k = 0; k < NW * NS; k++) { bm[k * 2] = river.bed[k]; bm[k * 2 + 1] = river.mat[k]; }

  },
  common() {
    return { uBed: this.bedTex, uRef: this.refTex, uN: [NW, NL], uJ0: this.j0, uNS: this.river.NS, uRefW: this.refW, uDt: SIM_DT, uDx: DX,
      uSteady: this.steadyTex || this.refTex, uSteadyOn: this.steadyTex ? 1 : 0, uSdx: this.SDX || 1, uSN: this.SN || [1, 1] };
  },
  // Settle the whole river once at load, on a coarse grid (cells of SDX m), so every window starts from water that
  // already found its way over weirs, down ladders and side channels.
  settle(river, seconds) {

    const CW = NW / k, CS = Math.floor(river.NS / k);

    for (let r = 0; r < CS; r++) for (let i = 0; i < CW; i++) {
      let mx = -1e9, sum = 0, built = false;
      for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) { const kk = (r * k + a) * NW + i * k + b, v = river.bed[kk]; mx = Math.max(mx, v); sum += v; if (river.mat[kk] === 2 || river.mat[kk] === 4) built = true; }

    for (let r = 0; r < CS; r++) { const fr = Math.min(river.NS - 1, r * k + Math.floor(k / 2)); ref[r * 4] = river.eta[fr]; ref[r * 4 + 1] = river.cvel[fr]; ref[r * 4 + 2] = river.qlat[fr]; }
    const bedT = glTex(CW, CS, 'rg32f', { data: bed }), refT = glTex(refW, refH, 'rgba32f', { data: ref });
    const tex = [0, 1, 2].map(() => glTex(CW, CS, 'rgba32f')), fbo = tex.map((t) => glFbo(t));

    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

      for (let r = 0; r < CS; r++) { const c0 = Math.round((river.P.c[Math.min(river.NS - 1, r * k)] + HALFW) / SDX); for (let i = Math.max(0, c0 - 3); i <= Math.min(CW - 1, c0 + 3); i++) { const kk = r * CW + i; if (wet(kk) && !seen[kk]) { seen[kk] = 1; q[qt++] = kk; } } }

      let removed = 0;
      for (let kk = 0; kk < CW * CS; kk++) if (wet(kk) && !seen[kk]) { buf[kk * 4] = -1e3; buf[kk * 4 + 1] = 0; buf[kk * 4 + 2] = 0; buf[kk * 4 + 3] = 0; removed++; }
      glTexUpdate(this.steadyTex, 0, 0, CW, CS, buf);

    }
    this.steadyCPU = buf;
    for (const t of [...tex, kT, bedT, refT]) gl.deleteTexture(t);

  },
  // settled water at (s, n): { eta, vn, vs, h } from the CPU copy
  steadyAt(s, n) {

  run(name, srcIdx, dstIdx, extra) {
    const vals = Object.assign(this.common(), { uS: this.tex[srcIdx] }, extra || {});

  reset(j0) {
    this.j0 = j0;
    gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND);

  },
  // slide the window so that river row `j0` is the first
  slideTo(j0) {
    j0 = clamp(Math.round(j0), 0, Math.max(0, this.river.NS - NL));
    const d = j0 - this.j0;
    if (!d) return;

  step() {

      const t = this.tex[a]; this.tex[a] = this.tex[c]; this.tex[c] = t;

  },
};

// ---- 35-terrain.js ----
// The land: a ribbon mesh along the whole river, out to 450 m each side, in river coordinates. Near the water it uses
// the river's own centreline (so it meets the simulated strip exactly); far away it follows a heavily smoothed one
// (so bends never fold the land over itself). Where the simulated window is, its own bed covers the ribbon.
const FAR_N0 = 34, FAR_N1 = 130;
const TERRAIN = {
  init(river) {
    this.river = river;
    const NS = river.NS, CL = river.CL;

// Procedural meshes for everything that is not water or ground. A builder collects vertices with:
// position, normal, uv, colour (rgb + sway weight), material id. Materials:
//   0 bark/wood   1 leaf card (atlas)   2 stone   3 plaster wall (windows)   4 roof   5 paint/metal   6 lamp/window glow   7 grass card (atlas)
class MB {
  constructor() { this.P = []; this.N = []; this.U = []; this.C = []; this.M = []; this.I = []; }

// Scenery: trees, grass, reeds, rocks, houses, the bridge, boats, the mill, people. Instanced by mesh type, culled
// by distance along the river, lit with the same sun and shadows as everything else, swaying in the wind.
const PROP_VS = `
in vec3 aPos; in vec3 aNor; in vec2 aUv; in vec4 aCol; in float aMat;
in vec4 iA; in vec4 iB; in vec4 iC;   // (x,y,z,yaw) (sx,sy,sz,seed) (tint rgb, sway)
uniform mat4 uVP; uniform float uTime; uniform float uSpin; uniform float uWind;
out vec3 vW; out vec3 vN; out vec2 vUv; out vec4 vCol; out float vMat; out vec3 vTint; out float vSeed;
void main(){
  vec3 p = aPos;
  vec3 n = aNor;
  if (uSpin != 0.0) { float a = uTime * uSpin; float c = cos(a), s = sin(a); p = vec3(p.x, p.y * c - p.z * s, p.y * s + p.z * c); n = vec3(n.x, n.y * c - n.z * s, n.y * s + n.z * c); }
  p *= iB.xyz;
  float cy = cos(iA.w), sy = sin(iA.w);
  p = vec3(p.x * cy + p.z * sy, p.y, -p.x * sy + p.z * cy);
  n = normalize(vec3(n.x * cy + n.z * sy, n.y, -n.x * sy + n.z * cy) / max(iB.xyz, vec3(0.01)));
  vec3 w = p + iA.xyz;
  // wind: whole crowns lean and sway, leaf cards flutter
  float sw = aCol.a * iC.a * uWind;
  float ph = uTime * 1.3 + iB.w * 6.0 + w.x * 0.05 + w.z * 0.04;
  w.x += sw * (sin(ph) * 0.18 + sin(ph * 2.7 + aPos.y) * 0.05) * (0.3 + p.y * 0.07);
  w.z += sw * (cos(ph * 0.8) * 0.14 + cos(ph * 3.1 + aPos.x) * 0.05) * (0.3 + p.y * 0.07);
  if (aMat > 0.5 && aMat < 1.5) w.y += sw * sin(ph * 3.7 + aPos.x * 3.0) * 0.06;
  vW = w; vN = n; vUv = aUv; vCol = aCol; vMat = aMat; vTint = iC.rgb; vSeed = iB.w;
  gl_Position = uVP * vec4(w, 1.0);
}`;
const PROP_FS = LIGHT_GLSL + SHADOW_GLSL + `
uniform sampler2D uAtlas; uniform vec3 uEye; uniform float uShadowPass; uniform float uTime; uniform vec3 uFocus;
uniform float uFadePass; // 0: solid (what is not faded), 1: see-through (only what is faded)
uniform float uA2C;      // 1 when foliage edges go through the multisampling
in vec3 vW; in vec3 vN; in vec2 vUv; in vec4 vCol; in float vMat; in vec3 vTint; in float vSeed; out vec4 o;
float alphaOut;
void main(){
  int m = int(vMat + 0.5);
  vec4 at = vec4(1.0);
  alphaOut = 1.0;
  if (m == 1 || m == 7) {
    at = texture(uAtlas, vUv);
    float aa = clamp((at.a - 0.5) / max(fwidth(at.a), 1e-4) + 0.5, 0.0, 1.0);
    if (uShadowPass > 0.5 || uA2C < 0.5) { if (aa < 0.5) discard; }
    else { if (aa < 0.02) discard; alphaOut = aa; }
  }
  if (uShadowPass > 0.5) { o = vec4(0.0); return; }
  // what stands between the camera and the fish, and what is right against the camera, is seen through
  float fade;
  {
    vec3 dv = uFocus - uEye; float L2 = dot(dv, dv);
    float t = clamp(dot(vW - uEye, dv) / max(L2, 1e-3), 0.0, 1.0);
    float d = length(vW - (uEye + dv * t));
    float block = (1.0 - smoothstep(1.3, 3.4, d)) * smoothstep(0.03, 0.08, t) * (1.0 - smoothstep(0.86, 0.93, t));
    float near = 1.0 - smoothstep(1.4, 3.6, length(vW - uEye));
    fade = max(block * 0.72, near);
  }
  if (uFadePass < 0.5) { if (fade > 0.01) discard; }
  else { if (fade <= 0.01) discard; alphaOut *= 1.0 - fade; }
  vec3 N = normalize(vN);
  vec3 V = normalize(uEye - vW);
  vec3 alb = vCol.rgb;
  float sh = shadowAt(vW, N);
  float sun = max(dot(N, uSunDir), 0.0);
  vec3 emit = vec3(0.0);
  float fine = texture(uNoise, vW.xz * 0.7 + vW.y * 0.3).b;
  if (m == 0) { // bark
    float g = texture(uNoise, vec2(vUv.x * 0.5, vUv.y * 0.6)).r;
    alb *= 0.7 + 0.6 * g;
    float birch = smoothstep(0.55, 0.7, vCol.r);
    float marks = smoothstep(0.62, 0.7, texture(uNoise, vec2(vUv.x * 0.9 + vSeed, vUv.y * 3.1)).r) + smoothstep(0.75, 0.8, texture(uNoise, vec2(vUv.x * 2.3, vUv.y * 0.9 + vSeed)).g);
    alb = mix(alb, vec3(0.08, 0.07, 0.06), clamp(marks, 0.0, 1.0) * birch * 0.85);
  } else if (m == 1) { // leaves: translucent, glowing when the sun is behind them
    vec3 tint = vTint;
    if (uSpring > 0.0 && vTint.r > vTint.g * 0.95) tint = mix(vTint, vec3(0.40, 0.62, 0.20) * (0.85 + 0.3 * fract(vSeed * 7.7)), uSpring);
    alb = at.rgb * vCol.rgb * tint;
    float wrap = clamp((dot(N, uSunDir) + 0.45) / 1.45, 0.0, 1.0);
    float back = pow(max(dot(-V, uSunDir), 0.0), 3.0) * 0.9;
    vec3 col = alb * (uSunCol * (wrap * 0.9 + back) * sh + uAmb * (0.55 + 0.45 * N.y));
    col = fogApply(col, vW, uEye);
    o = vec4(col, alphaOut); return;
  } else if (m == 7) { // grass and reeds
    alb = at.rgb * vCol.rgb * vTint;
    float wrap = 0.55 + 0.45 * max(uSunDir.y, 0.0);
    vec3 col = alb * mix(0.45, 1.0, vCol.a) * (uSunCol * wrap * sh + uAmb * 0.9);
    o = vec4(fogApply(col, vW, uEye), alphaOut); return;
  } else if (m == 2) { // stone
    alb *= vTint * (0.75 + 0.5 * fine) * (0.85 + 0.3 * texture(uNoise, vW.xz * 0.2 + vW.y * 0.17).r);
  } else if (m == 3) { // plaster walls with windows
    alb *= vTint;
    vec2 q = vUv / vec2(2.6, 3.0);
    vec2 f = fract(q), id = floor(q);
    float win = step(0.3, f.x) * step(f.x, 0.72) * step(0.35, f.y) * step(f.y, 0.85) * step(0.5, id.y) * step(0.12, hash12(id + vSeed));
    vec3 glass = vec3(0.10, 0.12, 0.14);
    alb = mix(alb * (0.9 + 0.2 * fine), glass, win);
    float lit = step(0.45, hash12(id * 1.7 + vSeed + 3.0));
    emit = win * lit * vec3(1.0, 0.72, 0.38) * 1.6 * uNight;
  } else if (m == 4) { // roof tiles
    alb *= vTint;
    float rows = fract(vUv.y * 3.5);
    alb *= 0.75 + 0.35 * smoothstep(0.0, 0.25, rows) * (0.8 + 0.4 * hash12(floor(vec2(vUv.x * 4.0, vUv.y * 3.5))));
  } else if (m == 5) { // paint, metal, cloth
    alb *= vTint;
  } else if (m == 6) { // lamps and the lighthouse lantern
    emit = vec3(1.0, 0.82, 0.5) * (0.2 + 3.0 * uNight);
  }
  vec3 col = alb * (uSunCol * sun * sh + uAmb * (0.5 + 0.5 * N.y)) + emit;
  vec3 R = reflect(-V, N);
  col += uSunCol * pow(max(dot(R, uSunDir), 0.0), 30.0) * 0.06 * sh * float(m == 5);
  o = vec4(fogApply(col, vW, uEye), alphaOut);
}`;

// The leaf and grass atlas: a 4 x 2 grid of 256px cells drawn with canvas (grey albedo + alpha; colour comes from tints).
//   0 maple cluster  1 small-leaf cluster  2 fir frond (stem along x)  3 grass  4 reeds  5 fern frond  6 one maple leaf  7 one small leaf
function makeLeafAtlas() {
  const C = 256, W = C * 4, H = C * 2;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const rnd = mulberry32(99);
  const O = (k) => [(k % 4) * C, Math.floor(k / 4) * C];
  const grey = (v, al = 1) => { v = Math.max(0, Math.min(255, Math.round(v))); return 'rgba(' + v + ',' + v + ',' + v + ',' + al + ')'; };
  const maple = (x, y, sz, ang, v) => {
    g.save(); g.translate(x, y); g.rotate(ang);
    g.fillStyle = grey(v);
    g.beginPath();
    for (let k = 0; k <= 60; k++) {
      const t = (k / 60) * TAU;
      const lobe = Math.pow(Math.abs(Math.cos(t * 2.5)), 0.55);
      const r = sz * (0.42 + 0.58 * lobe) * (t > Math.PI * 0.75 && t < Math.PI * 1.25 ? 0.7 : 1);
      g.lineTo(Math.sin(t) * r, -Math.cos(t) * r);
    }
    g.fill();
    g.strokeStyle = grey(v * 0.7); g.lineWidth = Math.max(1, sz * 0.05);
    for (const t of [0, 1.1, -1.1, 2.2, -2.2]) { g.beginPath(); g.moveTo(0, sz * 0.15); g.lineTo(Math.sin(t) * sz * 0.8, -Math.cos(t) * sz * 0.8); g.stroke(); }
    g.beginPath(); g.moveTo(0, sz * 0.15); g.lineTo(0, sz * 0.75); g.stroke();
    g.restore();
  };
  const oval = (x, y, sz, ang, v) => {
    g.save(); g.translate(x, y); g.rotate(ang);
    g.fillStyle = grey(v); g.beginPath(); g.moveTo(0, -sz); g.quadraticCurveTo(sz * 0.75, -sz * 0.2, 0, sz); g.quadraticCurveTo(-sz * 0.75, -sz * 0.2, 0, -sz); g.fill();
    g.strokeStyle = grey(v * 0.72); g.lineWidth = 1; g.beginPath(); g.moveTo(0, -sz * 0.9); g.lineTo(0, sz * 0.95); g.stroke();
    g.restore();
  };
  // 0: maple cluster
  {
    const [ox, oy] = O(0);
    g.strokeStyle = 'rgb(70,56,42)'; g.lineWidth = 3;
    for (let k = 0; k < 9; k++) { const a2 = rnd() * TAU; g.beginPath(); g.moveTo(ox + 128, oy + 128); g.lineTo(ox + 128 + Math.cos(a2) * 95, oy + 128 + Math.sin(a2) * 95); g.stroke(); }
    for (let k = 0; k < 58; k++) {
      const a2 = rnd() * TAU, r = Math.pow(rnd(), 0.65) * 98;
      maple(ox + 128 + Math.cos(a2) * r, oy + 128 + Math.sin(a2) * r, 20 + rnd() * 13, rnd() * TAU, 120 + 135 * (r / 98) * (0.7 + 0.3 * rnd()));
    }
  }
  // 1: small leaves
  {
    const [ox, oy] = O(1);
    g.strokeStyle = 'rgb(80,64,48)'; g.lineWidth = 2;
    for (let k = 0; k < 12; k++) { const a2 = rnd() * TAU; g.beginPath(); g.moveTo(ox + 128, oy + 128); g.lineTo(ox + 128 + Math.cos(a2) * 100, oy + 128 + Math.sin(a2) * 100); g.stroke(); }
    for (let k = 0; k < 150; k++) {
      const a2 = rnd() * TAU, r = Math.pow(rnd(), 0.6) * 104;
      oval(ox + 128 + Math.cos(a2) * r, oy + 128 + Math.sin(a2) * r, 9 + rnd() * 6, rnd() * TAU, 120 + 135 * (r / 104) * (0.7 + 0.3 * rnd()));
    }
  }
  // 2: fir frond, stem left to right, a feather of needle sprigs
  {
    const [ox, oy] = O(2);
    for (let pass = 0; pass < 2; pass++) for (let k = 0; k < 520; k++) {
      const t = rnd(), x = ox + 8 + t * 240;
      const half = (1 - t * 0.78) * 92 * (0.6 + 0.4 * rnd());
      const side = rnd() < 0.5 ? -1 : 1;
      const len = half * (0.4 + 0.6 * rnd());
      const y = oy + 128 + side * rnd() * half * 0.25;
      g.strokeStyle = grey(110 + 120 * rnd() + pass * 20); g.lineWidth = pass ? 2 : 4;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + len * 0.45, y + side * len); g.stroke();
    }
    g.strokeStyle = 'rgb(90,74,56)'; g.lineWidth = 4; g.beginPath(); g.moveTo(ox + 4, oy + 128); g.quadraticCurveTo(ox + 128, oy + 120, ox + 252, oy + 128); g.stroke();
  }
  // 3: grass blades from the bottom
  {
    const [ox, oy] = O(3);
    for (let k = 0; k < 85; k++) {
      const x = ox + 16 + rnd() * 224, h = 110 + rnd() * 140, bend = (rnd() - 0.5) * 80, w = 3 + rnd() * 4;
      g.fillStyle = grey(130 + rnd() * 125);
      g.beginPath(); g.moveTo(x - w, oy + 256); g.quadraticCurveTo(x + bend * 0.3, oy + 256 - h * 0.5, x + bend, oy + 256 - h); g.quadraticCurveTo(x + bend * 0.3 + 1, oy + 256 - h * 0.5, x + w, oy + 256); g.fill();
    }
  }
  // 4: reeds with a few cattails
  {
    const [ox, oy] = O(4);
    for (let k = 0; k < 40; k++) {
      const x = ox + 20 + rnd() * 216, h = 170 + rnd() * 85, bend = (rnd() - 0.5) * 40, w = 2 + rnd() * 3;
      g.fillStyle = grey(140 + rnd() * 115);
      g.beginPath(); g.moveTo(x - w, oy + 256); g.quadraticCurveTo(x + bend * 0.2, oy + 256 - h * 0.6, x + bend, oy + 256 - h); g.lineTo(x + w, oy + 256); g.fill();
      if (k % 6 === 0) { g.fillStyle = 'rgb(70,48,30)'; g.fillRect(x + bend * 0.85 - 4, oy + 256 - h + 6, 8, 30); }
    }
  }
  // 5: fern frond
  {
    const [ox, oy] = O(5);
    g.strokeStyle = grey(150); g.lineWidth = 3; g.beginPath(); g.moveTo(ox + 4, oy + 128); g.lineTo(ox + 252, oy + 124); g.stroke();
    for (let k = 0; k < 26; k++) {
      const t = k / 26, x = ox + 12 + t * 236, len = (1 - t * 0.85) * 70;
      for (const side of [-1, 1]) {
        g.save(); g.translate(x, oy + 127); g.rotate(side * 1.15);
        for (let q = 0; q < 6; q++) { g.fillStyle = grey(140 + rnd() * 100); g.beginPath(); g.ellipse(q * len / 6 + 5, 0, len / 9, 5, 0, 0, TAU); g.fill(); }
        g.restore();
      }
    }
  }
  // 6: one maple leaf; 7: one small leaf (for the water)
  { const [ox, oy] = O(6); maple(ox + 128, oy + 128, 108, 0, 235); }
  { const [ox, oy] = O(7); oval(ox + 128, oy + 128, 110, 0, 235); }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

const PROPS = {
  types: {},   // name -> { mesh, inst: [{s, n, a:[x,y,z,yaw], b:[sx,sy,sz,seed], c:[r,g,b,sway]}], spin, buf }
  init(river) {
    this.river = river;
    this.P = glProgram('props', PROP_VS, PROP_FS);
    this.atlas = makeLeafAtlas();
    const add = (name, built, opts = {}) => {
      const mesh = glMesh(this.P, { aPos: [built.pos, 3], aNor: [built.nor, 3], aUv: [built.uv, 2], aCol: [built.col, 4], aMat: [built.mat, 1] }, built.idx,

  over: null, // an override day position (s) for the ending and the spring after

// Salmon: a procedural body and fins, swum in the vertex shader (a travelling wave that grows toward the tail),
// bent when turning, coiled before a leap. Drawn instanced: the player and every other fish in one call.
// Fish space: +z forward (nose at about +0.37), +y up, +x right. Length about 0.75 m at scale 1.
function buildSalmonMesh() {
  const pos = [], nor = [], uv = [], fin = [];
  const idx = [];
  const NOSE = 0.37, TAILEND = -0.30; // body ends at the caudal peduncle; the tail fin continues
  const RING = 14;

    [0.0, 0.004, 0.003, -0.006], [0.025, 0.028, 0.020, -0.004], [0.06, 0.046, 0.032, 0.0], [0.12, 0.062, 0.043, 0.004],
    [0.2, 0.074, 0.050, 0.006], [0.3, 0.083, 0.054, 0.008], [0.4, 0.084, 0.053, 0.007], [0.5, 0.078, 0.049, 0.005],
    [0.6, 0.068, 0.043, 0.003], [0.7, 0.054, 0.034, 0.002], [0.8, 0.040, 0.024, 0.002], [0.9, 0.030, 0.016, 0.002], [1.0, 0.026, 0.012, 0.002],
  ];

    let k = 0; while (k < prof.length - 2 && prof[k + 1][0] < u) k++;
    const a = prof[k], b = prof[k + 1], t = (u - a[0]) / (b[0] - a[0]);

  };

  const zOf = (u) => NOSE + (TAILEND - NOSE) * u;
  // body rings
  for (let si = 0; si <= SEG; si++) {
    const u = si / SEG;
    const [hh, hw, cy] = at(u);
    for (let ri = 0; ri < RING; ri++) {
      const a = (ri / RING) * TAU;
      const ca = Math.cos(a), sa = Math.sin(a);
      // slightly flattened belly, keel-like back
      const y = cy + hh * ca * (ca > 0 ? 1.0 : 0.92);
      const x = hw * sa * (1 - 0.12 * Math.max(0, ca) * Math.max(0, ca));
      pos.push(x, y, zOf(u));

      const nx = sa / Math.max(hw, 1e-3), ny = ca / Math.max(hh, 1e-3);

  for (let ri = 0; ri < RING; ri++) idx.push(capN, ri, (ri + 1) % RING);

  const finTri = (pts, nrm) => {
    const base = pos.length / 3;
    for (const p of pts) { pos.push(p[0], p[1], p[2]); nor.push(nrm[0], nrm[1], nrm[2]); uv.push((NOSE - p[2]) / (NOSE - TAILEND), 0.5); fin.push(1); }
    for (let k = 1; k < pts.length - 1; k++) idx.push(base, base + k, base + k + 1, base, base + k + 1, base + k);
  };
  const zU = (u) => zOf(u);
  // caudal fin: forked
  finTri([[0, 0.026, zU(0.97)], [0, 0.098, zU(1.25)], [0, 0.04, zU(1.165)], [0, 0.0, zU(1.12)], [0, -0.04, zU(1.165)], [0, -0.094, zU(1.24)], [0, -0.022, zU(0.97)]], [1, 0, 0]);
  // dorsal
  finTri([[0, 0.085, zU(0.30)], [0, 0.155, zU(0.40)], [0, 0.15, zU(0.44)], [0, 0.078, zU(0.47)]], [1, 0, 0]);
  // adipose
  finTri([[0, 0.048, zU(0.74)], [0, 0.072, zU(0.79)], [0, 0.04, zU(0.82)]], [1, 0, 0]);
  // anal
  finTri([[0, -0.06, zU(0.62)], [0, -0.115, zU(0.70)], [0, -0.105, zU(0.74)], [0, -0.045, zU(0.74)]], [1, 0, 0]);

  for (const sd of [-1, 1]) {
    // swept back along the belly, small: from above they barely show past the body
    finTri([[sd * 0.036, -0.05, zU(0.20)], [sd * 0.066, -0.082, zU(0.33)], [sd * 0.052, -0.086, zU(0.36)], [sd * 0.03, -0.062, zU(0.26)]], [0, 1, 0]);

  }

// ---- 71-life.js ----
// What else lives along the river. Each creature has a tell before it strikes:
//   seal (mouth) chases, but will not follow into shallow water        net (mouth) holds whatever swims into it
//   lures (town) swing through the water on lines; hooked, swim hard away to snap the line
//   herons (meadows) draw the neck back before they strike, and only reach into shallow water
//   the eagle (forest) cries, and its shadow grows on the water as it falls
//   bears (falls) watch the leaps and lunge at what comes close; while one eats, it does not fish
// and some things only react: gulls, ducks that burst off the water, a beaver that slaps its tail, cows.
const FISH_TARGETS = () => {
  const t = [];
  if (!PLAYER.dead) t.push({ f: PLAYER, player: true });
  for (const f of SCHOOL.fish) if (f.alive) t.push({ f, player: false });
  return t;
};
// where a fish is in the world
const fishWorld = (f) => RIVER.toWorld(f.s, f.n, f.y);
// take a fish: the player dies (held by the predator), a school fish is carried off
const TAKEN = {};
function takeFish(tg, holder, cause) {
  if (tg.player) { PLAYER.caught(holder, cause); return; }
  TAKEN[cause] = (TAKEN[cause] || 0) + 1;
  const f = tg.f;
  f.alive = false; f.shown = true; f.flash = 0;
  f.taken = (ff, dt) => { const h = holder(); if (!h) { ff.shown = false; ff.taken = null; return; } const w = h.p; const sn = toRiverApprox(w, ff.s); ff.s = sn[0]; ff.n = sn[1]; ff.y = w[1]; ff.phase += 25 * dt; ff.amp = 0.16; ff.pitch = h.pitch || 0; ff.yawOverride = h.yaw; };
  if (LIFE.onTaken) LIFE.onTaken(cause, f);
}
// world point -> river coords, searching near a guess along s (good enough for things close to the river)
function toRiverApprox(w, sGuess) {
  let best = sGuess, bd = 1e9;
  for (let ds = -6; ds <= 6; ds += 0.5) {
    const fr = RIVER.frame(sGuess + ds);
    const dx = w[0] - fr.x, dz = w[2] - fr.z;
    const along = dx * fr.tx + dz * fr.tz;
    if (Math.abs(along) < bd) { bd = Math.abs(along); best = sGuess + ds + along; }
  }
  const fr = RIVER.frame(best);
  const n = (w[0] - fr.x) * -fr.tz + (w[2] - fr.z) * fr.tx;
  return [best, n];
}

const COL = { bear: [0.22, 0.15, 0.09, 0], bearSnout: [0.40, 0.30, 0.20, 0], dark: [0.04, 0.03, 0.03, 0], heron: [0.52, 0.55, 0.58, 1], heronDark: [0.15, 0.16, 0.18, 1], beak: [0.85, 0.65, 0.2, 3],
  eagle: [0.22, 0.14, 0.08, 1], white: [0.92, 0.90, 0.86, 1], seal: [0.28, 0.28, 0.27, 2], gull: [0.93, 0.93, 0.91, 1], gullWing: [0.62, 0.64, 0.66, 1], duck: [0.36, 0.28, 0.20, 1], duckHead: [0.12, 0.35, 0.18, 1],
  cow: [0.42, 0.26, 0.16, 0], cowWhite: [0.88, 0.86, 0.82, 0], beaver: [0.30, 0.20, 0.12, 2], rod: [0.12, 0.10, 0.08, 3], line: [0.85, 0.85, 0.85, 3], lure: [0.9, 0.85, 0.6, 5], float: [0.95, 0.42, 0.12, 3], net: [0.75, 0.72, 0.6, 4] };

// ---------------------------------------------------------------- bear
function makeBear(s, n, opts) {
  const ground = opts.y !== undefined ? opts.y : TERRAIN.heightAt(s, n);
  const fr = RIVER.frame(s);
  const yaw = Math.atan2(fr.tx, fr.tz) + Math.PI + (opts.turn || 0); // faces downstream
  return {
    kind: 'bear', s, n, y: ground, yaw, mode: 'watch', t: 0, look: [0, 0, 0], lean: 0, reach: opts.reach || 2.3, paw: 0, catchWater: opts.water || false, held: null, breath: Math.random() * 10,
    head() { const m = MAT4.trs(RIVER.toWorld(this.s, this.n, this.y), this.yaw, 0, 0); return MAT4.pt(m, 0, 1.08 + this.lean * 0.15, 1.15 + this.lean * 0.6); },
    update(dt) {
      this.t += dt; this.breath += dt;
      const head = this.head();
      if (this.mode === 'eat') {
        this.lean = lerp(this.lean, -0.3, dt * 2);
        if (this.t > 9) { this.mode = 'watch'; this.held = null; }
        return;
      }
      // watch the nearest fish; lunge at one that comes into reach
      let best = null, bd = 1e9;
      for (const tg of FISH_TARGETS()) {
        const w = fishWorld(tg.f);

        const inReach = tg.f.air || (this.catchWater && (tg.f.flow ? tg.f.flow.h < 0.7 : true));
        if (d < bd && d < 9) { bd = d; best = { tg, w, inReach }; }
      }
      if (best) this.look = v3.lerp(this.look, best.w, Math.min(1, dt * 6));
      if (this.mode === 'watch') {
        this.lean = lerp(this.lean, 0, dt * 3);
        if (best && best.inReach && bd < this.reach) { this.mode = 'lunge'; this.t = 0; this.target = best.tg; if (LIFE.onLunge) LIFE.onLunge(this); }
      } else if (this.mode === 'lunge') {
        this.lean = lerp(this.lean, 1, dt * 14); this.paw = Math.min(1, this.t / 0.2);
        if (this.t > 0.22) {
          const w = fishWorld(this.target.f);
          if (v3.len(v3.sub(w, this.head())) < 1.25 && !this.target.f.dead) {
            const me = this;
            takeFish(this.target, () => ({ p: me.head(), yaw: me.yaw + Math.PI / 2, pitch: 0 }), 'bear');
            this.mode = 'eat'; this.t = 0; this.held = this.target;
            if (LIFE.onCatch) LIFE.onCatch(this);
          } else { this.mode = 'watch'; this.t = 0; this.paw = 0; }
        }
      }
      this.paw = Math.max(0, this.paw - dt * 2);
    },
    draw() {
      const base = RIVER.toWorld(this.s, this.n, this.y);
      const B = MAT4.trs(base, this.yaw, 0, 0);
      const P = (x, y, z) => MAT4.pt(B, x, y, z);
      const L = this.lean, br = Math.sin(this.breath * 1.3) * 0.02;
      RIG.part('sphere', MAT4.trs(P(0, 0.78, -0.55), this.yaw, 0, 0, [0.6, 0.62 + br, 0.66]), COL.bear);
      RIG.part('sphere', MAT4.trs(P(0, 0.82 + L * 0.05, 0.1 + L * 0.2), this.yaw, -L * 0.15, 0, [0.62, 0.64 + br, 0.9]), COL.bear);
      RIG.part('sphere', MAT4.trs(P(0, 1.12 + L * 0.05, 0.45 + L * 0.25), this.yaw, 0, 0, [0.45, 0.38, 0.5]), COL.bear);
      // head looks at what it watches
      const hp = P(0, 1.08 + L * 0.15, 1.15 + L * 0.6);
      let dir = v3.norm(v3.sub(this.look, hp));
      const fwd = [Math.sin(this.yaw), 0, Math.cos(this.yaw)];
      if (v3.dot(dir, fwd) < 0.3 || !isFinite(dir[0])) dir = v3.norm(v3.add(fwd, [0, -0.3 - (this.mode === 'eat' ? 0.6 : 0), 0]));
      const H = lookFrame(hp, dir, [1, 1, 1]);
      const Q = (x, y, z) => MAT4.pt(H, x, y, z);

      RIG.part('sphere', MAT4.trs(hp, hy, hpch, 0, [0.31, 0.29, 0.34]), COL.bear);
      RIG.part('sphere', MAT4.trs(Q(0, -0.07, 0.3), hy, hpch, 0, [0.15, 0.13, 0.22]), COL.bearSnout);
      RIG.part('sphere', MAT4.trs(Q(0, -0.03, 0.5), hy, hpch, 0, [0.055, 0.045, 0.04]), COL.dark);
      for (const sx of [-1, 1]) {

        RIG.part('sphere', MAT4.trs(Q(sx * 0.13, 0.08, 0.27), hy, 0, 0, [0.025, 0.025, 0.02]), COL.dark);

// cylinder part from a to b with radius r (the unit cylinder runs along +y)
function cylBetween(a, b, r, r2) {

  m[8] = z[0] * (r2 || r); m[9] = z[1] * (r2 || r); m[10] = z[2] * (r2 || r);

// ---------------------------------------------------------------- heron
function makeHeron(s, n) {
  const yaw0 = Math.random() * TAU;
  return {
    kind: 'heron', s, n, yaw: yaw0, mode: 'stand', t: 0, neck: 0, strike: [0, 0, 0], cool: 0, gone: false, fly: 0,
    base() { return RIVER.toWorld(this.s, this.n, TERRAIN.heightAt(this.s, this.n)); },
    headPos() {
      const b = this.base(), fy = [Math.sin(this.yaw), 0, Math.cos(this.yaw)];
      if (this.mode === 'strike') return v3.lerp(v3.add(b, [fy[0] * 0.35, 1.25, fy[2] * 0.35]), this.strike, smooth01(clamp(this.t / 0.13, 0, 1)));
      const pull = this.mode === 'aim' ? smooth01(clamp(this.t / 0.35, 0, 1)) : 0;
      return v3.add(b, [fy[0] * (0.35 - pull * 0.25), 1.32 - pull * 0.12, fy[2] * (0.35 - pull * 0.25)]);
    },
    update(dt) {
      if (this.gone) return;
      this.t += dt; this.cool = Math.max(0, this.cool - dt);
      if (this.mode === 'fly') { this.fly += dt; return; }
      if (this.mode === 'swallow') { if (this.t > 5) { this.mode = 'fly'; this.fly = 0; } return; }
      const b = this.base();
      let best = null, bd = 1e9;
      for (const tg of FISH_TARGETS()) {
        if (tg.f.air || !tg.f.flow || tg.f.flow.h > 0.75) continue;
        const w = fishWorld(tg.f), d = Math.hypot(w[0] - b[0], w[2] - b[2]);
        if (d < bd) { bd = d; best = { tg, w }; }
      }
      if (this.mode === 'stand') {
        if (best && bd < 2.3 && this.cool <= 0) {
          this.mode = 'aim'; this.t = 0; this.target = best.tg;
          this.yaw = Math.atan2(best.w[0] - b[0], best.w[2] - b[2]);
          if (LIFE.onAim) LIFE.onAim(this);
        } else if (best && bd < 7) this.yaw = lerp(this.yaw, Math.atan2(best.w[0] - b[0], best.w[2] - b[2]), dt * 0.8);
      } else if (this.mode === 'aim') {
        const w = fishWorld(this.target.f);
        this.yaw = lerp(this.yaw, Math.atan2(w[0] - b[0], w[2] - b[2]), dt * 4);
        if (this.t > 0.38) {
          // strike where the fish is about to be
          const f = this.target.f;
          const lead = 0.12;
          this.strike = RIVER.toWorld(f.s + f.vs * lead, f.n + f.vn * lead, f.y + 0.05);
          const d = Math.hypot(this.strike[0] - b[0], this.strike[2] - b[2]);
          if (d > 2.4) { const k = 2.4 / d; this.strike = [b[0] + (this.strike[0] - b[0]) * k, this.strike[1], b[2] + (this.strike[2] - b[2]) * k]; }

          if (LIFE.onStrike) LIFE.onStrike(this);
        }
      } else if (this.mode === 'strike') {
        if (this.t > 0.13 && !this.done) {
          this.done = true;
          const w = fishWorld(this.target.f);
          if (v3.len(v3.sub(w, this.strike)) < 0.5 && !this.target.f.air && !this.target.f.dead) {
            const me = this;
            takeFish(this.target, () => ({ p: me.headPos(), yaw: me.yaw + Math.PI / 2, pitch: 0 }), 'heron');
            SIM.splash(this.target.f.s, this.target.f.n, 0.4, -0.03, 0, 0, 0.5);
            this.mode = 'swallow'; this.t = 0;
          } else { SIM.splash(this.target.f.s, this.target.f.n, 0.3, -0.02, 0, 0, 0.3); if (LIFE.onMiss) LIFE.onMiss(this); }
        }

      }

      let bodyY = 0.78;
      if (this.mode === 'fly') { b = v3.add(b, [fy[0] * this.fly * 6, this.fly * 3.5, fy[2] * this.fly * 6]); if (this.fly > 12) this.gone = true; }

        for (const sx of [-1, 1]) RIG.part('wing', MAT4.trs(v3.add(body, [0, 0.08, 0]), this.yaw + (sx > 0 ? 0 : Math.PI), 0, sx * flap, [0.85, 1, 0.5]), COL.heron);

      }

      const sh = v3.add(body, [fy[0] * 0.28, 0.12, fy[2] * 0.28]);
      const mid = v3.add(v3.lerp(sh, head, 0.5), [-fy[0] * 0.12, 0.05, -fy[2] * 0.12]);

    },
  };
}
