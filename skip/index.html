<script>
'use strict';
// SKIP — the world: the route, where the water's edges are, what floats in it, and how each stretch is lit.

// The words scratched on the stones that come back. They are Alex's own lines, from his other games.
const LINES = [
  'nothing here can be hurt',
  "the music only lives while the ball's in the air",
  'turn every collision into music',
  'hold your nerve in the dark',
  'opening your hand is still the hard part',
];
// One for each stretch of the way round, on the stone that comes back from it.
const GATE_LINES = [
  null,
  'the route seals behind you',
  'the house remembers what you touch',
  "the only way up a dark tower is other people's hands",
  "they warned you about the moon. you didn't listen.",
  "there's no road until you throw one",
  'a boomerang is fun because it comes back',
];
const HOME_LINE = "i'll be back by morning. promise.";

// ---------- small maths ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function gauss() { return Math.sqrt(-2 * Math.log(Math.random() + 1e-9)) * Math.cos(TAU * Math.random()); }

// ---------- the feel of the stone (unchanged from the bay he played) ----------
const G = 14;                       // gravity, a little heavy so the arcs snap
const PERF = 0.065, GOOD = 0.13;    // timing windows, seconds either side of the touch
let LAT = 0.015;                    // what the screen is behind the hand; a touch screen is further behind, so main.js raises it there
const VY_SINK = 0.95;
const RMIN = [60, 140, 220, 300, 360];   // in the bay: get a stone this far and it comes back

// ---------- the route, once round ----------
// 0 bay · 1 marsh creek and woods · 2 the town · 3 the cathedral · 4 the ice · 5 the open sea · 6 the creek home
const GATE_Z = [0, 400, 858, 1300, 1700, 2250, 2850];
const LAP = 3150;
const LAMP = { x: 52, y: 15.3, z: 232 };
const BEAM_T = 9;
const regionAt = z => { let r = 0; for (let i = 1; i < GATE_Z.length; i++) if (z >= GATE_Z[i]) r = i; return r; };

// half the width of the water at z (999 = open). The shader's banks are drawn from the same numbers; the far shore of the bay is a funnel into the creek.
const BANK = [[0, 999], [344, 999], [345, 30], [397.5, 8], [1270, 8], [1298, 5.4], [1300, 5.4], [1306, 7], [1684, 7], [1698, 5.4], [1703, 5.4], [1706, 7.6], [1740, 34], [1741, 999], [2799, 999], [2800, 34], [2900, 9], [3096, 9], [3116, 26], [3117, 999]];
function bankHW(z) { for (let i = 1; i < BANK.length; i++) if (z < BANK[i][0]) { const a = BANK[i - 1], b = BANK[i]; return lerp(a[1], b[1], (z - a[0]) / (b[0] - a[0])); } return 999; }
const laneHW = z => Math.min(34, bankHW(z)) - 0.45;
// the beach at home, where the way round ends: rings of standing stones, and the middle is what you aim for
const BEACH = { z: 3116, k: 0.012, cx: 0, cz: 3134, rings: [3.2, 6.4, 9.6, 12.8, 16] };
const beachZ = x => BEACH.z + BEACH.k * x * x;

function swellAmp(z) { return 0.16 * sstep(265, 300, z) * (1 - sstep(350, 372, z)) + 0.15 * sstep(2280, 2380, z) * (1 - sstep(2780, 2850, z)); }
function swell(x, z, t) {
  const a = swellAmp(z); if (a <= 0) return 0;
  return a * (0.6 * Math.sin(0.45 * z + 0.9 * t + 0.6 * Math.sin(0.05 * x)) + 0.4 * Math.sin(0.27 * z + 0.11 * x + 0.6 * t));
}
const fogAt = z => sstep(262, 298, z) * (1 - sstep(352, 378, z));

// ---------- what floats ----------
// kind: 'hz' ends the throw, 'hop' and 'bell' lift it, null is only there to be looked at
const OBJ = [];
(function build() {
  const r = rng(7);
  const add = (type, kind, x, z, rad, h, extra) => { const o = Object.assign({ type, kind, x, z, r: rad, h, seed: Math.floor(r() * 1e6), hit: -9 }, extra || {}); OBJ.push(o); return o; };
  const hump = (o, n, lo, hi) => { o.pts = []; for (let i = 0; i <= n; i++) { const a = Math.PI * (1 - i / n); o.pts.push([Math.cos(a) * (0.9 + r() * 0.14), Math.sin(a) * (lo + r() * (hi - lo)) + (i > 0 && i < n ? 0.12 : 0)]); } };
  // a ragged ridge line: heights wander instead of alternating
  const crag = (o, n) => { o.pts = []; let pk = 0.6 + r() * 0.4; for (let i = 0; i <= n; i++) { const u = -1 + 2 * i / n; pk = clamp(pk + (r() - 0.5) * 0.62, 0.42, 1.15); o.pts.push([u * (0.96 + r() * 0.08) + (i > 0 && i < n ? (r() - 0.5) * 0.07 : 0), i > 0 && i < n ? Math.pow(1 - u * u, 0.5) * pk + 0.06 : 0]); } return o; };
  const rock = (x, z, rad, style) => crag(add('rock', 'hz', x, z, rad, rad * 0.7, { style: style || 0 }), 12);
  const bay = dz => {            // the bay; built twice, the second time as what you see coming home
    const k = dz ? null : 1, K = v => k ? v : null;
    [[-11, 6], [-11.6, 11], [-12.1, 16], [-12.8, 21], [-13.3, 26], [16, 30]].forEach(p => add('post', K('hz'), p[0], p[1] + dz, 0.3, 1.3 + r() * 0.9));
    [[4, 34], [-5, 48], [10, 82], [-9, 104], [3, 128], [13, 150], [-3, 262], [6, 300], [-8, 338], [2, 368], [-6, 382]].forEach((p, i) => add('float', K('hop'), p[0], p[1] + dz, 0.85, 0.8, { hue: i % 3 }));
    [[-5, 60, 293.7, 0], [8, 160, 220, 1], [-4, 280, 185, 0]].forEach(p => add('bell', K('bell'), p[0], p[1] + dz, 1.5, 2.6, { f: p[2], red: p[3], swing: 0, next: 1 + r() * 3 }));
    [[15, 92, 0.5], [-16, 88, -0.4], [-19, 140, 0.2]].forEach(p => add('boat', K('hz'), p[0], p[1] + dz, 1.7, 0.7, { yaw: p[2] }));
    [[-18, 118, 2.0], [20, 132, 2.4], [-15, 176, 2.4], [0, 188, 1.7], [17, 196, 2.8], [7, 212, 1.9], [-11, 220, 2.5], [-24, 206, 3.0], [21, 232, 2.3], [-3, 238, 1.6], [11, 248, 2.0], [-17, 246, 2.2], [9, 305, 2.0], [-13, 322, 2.4], [2, 342, 1.7], [-9, 358, 2.0]]
      .forEach(p => { const o = rock(p[0], p[1] + dz, p[2]); if (!k) o.kind = null; });
    crag(add('isle', null, LAMP.x, LAMP.z + dz, 7.5, 2.6), 18);
    hump(add('dune', null, -36, 421 + dz, 27, 2.6), 14, 0.55, 1.0);
    hump(add('dune', null, 36, 421 + dz, 27, 2.6), 14, 0.55, 1.0);
    add('lamp', null, -8.9, 399.5 + dz, 0.2, 2.6); add('lamp', null, 8.9, 399.5 + dz, 0.2, 2.6);
  };
  bay(0); bay(LAP);

  // 1 · the marsh creek, then the woods
  [[-3, 440], [4, 470], [-5, 505], [2, 548], [5, 590], [-4, 665], [3, 745], [-2, 795]].forEach((p, i) => add('pad', 'hop', p[0], p[1], 0.95, 0.5, { style: p[1] > 620 ? 1 : 0 }));
  [[3, 455, 1.1], [-4, 488, 1.2], [-2, 562, 1.0], [4.5, 605, 1.2], [-5, 655, 1.2], [4, 722, 1.0], [-3, 803, 1.2], [5, 822, 1.0]].forEach(p => rock(p[0], p[1], p[2]));
  add('foot', null, 0, 530, 9, 2.4); add('post', 'hz', 0, 530, 0.3, 2.4);
  add('bellpost', 'bell', -1, 578, 1.0, 2.4, { f: 261.6, swing: 0 }); add('bellpost', 'bell', 2, 735, 1.0, 2.4, { f: 233.1, swing: 0 });
  add('boat', 'hz', 5.6, 640, 1.6, 0.7, { yaw: 0.1 });
  const log = (x0, x1, z) => { add('log', null, (x0 + x1) / 2, z, Math.abs(x1 - x0) / 2, 0.6, { x0, x1 }); for (let x = Math.min(x0, x1) + 0.5; x < Math.max(x0, x1); x += 1.0) add('none', 'hz', x, z, 0.62, 0.7); };
  log(-8.5, 1.2, 690); log(-1.2, 8.5, 772);
  add('lamp', null, -8.6, 844, 0.2, 2.6); add('lamp', null, 8.6, 844, 0.2, 2.6);

  // 2 · the town on Halloween
  [[-4, 885], [3, 912], [0, 960], [-5, 1034], [5, 1062], [-2, 1122], [4, 1150], [1, 1232], [-4, 1262]].forEach(p => add('pumpkin', 'hop', p[0], p[1], 0.85, 0.8));
  [[5.6, 935, 0.1], [-5.6, 988, -0.1], [5.4, 1096, 0.05], [-5.6, 1206, -0.05]].forEach(p => add('boat', 'hz', p[0], p[1], 1.6, 0.7, { yaw: p[2] }));
  [[-2.5, 1052], [2.5, 1136], [0, 1274]].forEach(p => add('post', 'hz', p[0], p[1], 0.3, 1.5 + r() * 0.6));
  add('bellpost', 'bell', -1, 976, 1.0, 2.4, { f: 220, swing: 0 }); add('bellpost', 'bell', 2, 1196, 1.0, 2.4, { f: 196, swing: 0 });
  add('duck', 'hop', 3.5, 1242, 0.8, 0.7);

  // 3 · the cathedral, flooded
  [[-3, 1335], [3, 1366], [0, 1402], [-4, 1442], [4, 1470], [-2, 1562], [2, 1602], [0, 1652]].forEach(p => add('candle', 'hop', p[0], p[1], 0.8, 0.8));
  [[4, 1350, 1.2], [-4, 1386, 1.3], [2, 1426, 1.1], [-1.5, 1462, 1.0], [4.6, 1500, 1.2], [-4.6, 1542, 1.3], [3, 1582, 1.1], [-3, 1626, 1.2], [1, 1668, 1.0]].forEach(p => rock(p[0], p[1], p[2], 1));
  add('greatbell', 'bell', 0, 1520, 1.9, 3.6, { f: 110, swing: 0 });

  // 4 · the ice
  [[-12, 1790, 4], [9, 1822, 3], [-3, 1862, 2.5], [18, 1880, 5], [-20, 1902, 5], [4, 1932, 3], [-8, 1966, 3.5], [14, 1992, 3], [0, 2032, 2.5], [-15, 2062, 4.5], [8, 2086, 3.5], [-5, 2122, 3], [20, 2142, 5], [-22, 2172, 4], [3, 2192, 3], [-10, 2216, 3]]
    .forEach(p => crag(add('berg', 'hz', p[0], p[1], p[2], p[2] * 1.15), 9));
  [[2, 1775], [-6, 1842], [10, 1906], [-2, 1950], [6, 2010], [-9, 2100], [12, 2160], [0, 2232]].forEach(p => add('pad', 'hop', p[0], p[1], 1.1, 0.5, { style: 2 }));
  add('bell', 'bell', -2, 2000, 1.5, 2.6, { f: 246.9, red: 0, swing: 0, next: 2, ice: 1 }); add('bell', 'bell', 6, 2204, 1.5, 2.6, { f: 196, red: 1, swing: 0, next: 3, ice: 1 });

  // 5 · the open sea, and the sun coming up
  [[3, 2300], [-6, 2382], [8, 2462], [-2, 2542], [5, 2622], [-8, 2702], [0, 2782]].forEach((p, i) => add('float', 'hop', p[0], p[1], 0.85, 0.8, { hue: i % 3 }));
  [[-5, 2422, 329.6, 0], [6, 2602, 246.9, 1], [-3, 2762, 220, 0]].forEach(p => add('bell', 'bell', p[0], p[1], 1.5, 2.6, { f: p[2], red: p[3], swing: 0, next: 1 + r() * 3 }));
  [[12, 2342, 2.2], [-14, 2502, 2.4], [10, 2662, 2.0], [-10, 2742, 2.2]].forEach(p => rock(p[0], p[1], p[2]));
  add('whale', null, -46, 2520, 6, 4, { t0: -99 }); add('whale', null, 52, 2690, 6, 4, { t0: -99 });

  // 6 · the creek behind your own beach
  [[6.5, 2874, 1.8], [-8, 2888, 1.7], [-3, 2932, 1.0], [4, 2966, 1.1], [0, 3002, 0.9], [-4, 3042, 1.0], [3.5, 3078, 1.1]].forEach(p => rock(p[0], p[1], p[2]));
  [[2, 2916], [-4, 2986], [4, 3026], [-1, 3092]].forEach((p, i) => add('float', 'hop', p[0], p[1], 0.85, 0.8, { hue: i % 3 }));
  add('bellpost', 'bell', 0, 2952, 1.0, 2.4, { f: 293.7, swing: 0 });
  add('foot', null, 0, 3056, 10, 2.2, { board: 1 });
  BEACH.rings.forEach((rad, i) => {
    const n = 8 + i * 4;
    for (let k = 0; k < n; k++) { const a = (k + 0.5) / n * TAU, x = rad * Math.sin(a); if (Math.abs(x) > 0.9) add('rcairn', null, x, BEACH.cz - rad * Math.cos(a), 0.4, 1.5, { ring: i, sc: 1.0 - 0.13 * i }); }
  });
  add('gcairn', null, 0, BEACH.cz + 5.2, 1, 6, { ring: -1, sc: 2.6 });      // the tall one in the middle: what you aim at from the creek

  // the narrow places are marked the way a harbour marks a channel: red to one side, green to the other
  const mark = (x, z) => { add('mark', null, -x, z, 0.2, 2.0, { red: 1 }); add('mark', null, x, z, 0.2, 2.0, { red: 0 }); };
  [[17, 328], [14, 346], [11.5, 362], [9.8, 378]].forEach(p => mark(p[0], p[1]));
  [[25, 2710], [21, 2745], [17.5, 2778], [29, 2812], [22.5, 2842], [16, 2868], [10.5, 2892]].forEach(p => mark(p[0], p[1]));
  [[0, 1246], [-1.5, 1268], [1.5, 1287]].forEach(p => add('candle', 'hop', p[0], p[1], 0.8, 0.8));      // candles set afloat lead to the church door

  OBJ.sort((a, b) => b.z - a.z);
})();

// ---------- how each stretch is lit ----------
// A "look" is everything the sky and water need. They are keyed along the route and blended between.
const V3 = ['zen', 'mid', 'hor', 'glow', 'line', 'orbC', 'cloudL', 'cloudD', 'fogC', 'deep', 'shal', 'glit', 'rim', 'sand', 'sil'];
const N1 = ['glowAz', 'orbEl', 'orbR', 'halo', 'stars', 'cloud', 'aurora', 'fogD', 'fogMix', 'skyFog', 'hills', 'peaks', 'wave', 'leaf'];
const mix3 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function mixLook(a, b, t) { const o = {}; for (const k of V3) o[k] = mix3(a[k], b[k], t); for (const k of N1) o[k] = lerp(a[k], b[k], t); return o; }
const NIGHT = { // the marsh under the moon: the base the darker stretches are cut from
  zen: [0.006, 0.012, 0.04], mid: [0.028, 0.05, 0.115], hor: [0.10, 0.135, 0.23], glow: [0, 0, 0], line: [0.03, 0.035, 0.05], orbC: [0.95, 0.95, 0.85],
  cloudL: [0.06, 0.08, 0.14], cloudD: [0.03, 0.04, 0.09], fogC: [0.045, 0.07, 0.095], deep: [0.005, 0.018, 0.03], shal: [0.02, 0.05, 0.05], glit: [1.6, 1.5, 1.2],
  rim: [0.75, 0.85, 1.0], sand: [0.035, 0.045, 0.04], sil: [0.012, 0.02, 0.03],
  glowAz: 0, orbEl: 0.1589, orbR: 1, halo: 0.9, stars: 1, cloud: 0.6, aurora: 0, fogD: 0.007, fogMix: 0.85, skyFog: 0.3, hills: 0.4, peaks: 0, wave: 0.7, leaf: 0,
};
const MORNING = {
  zen: [0.20, 0.38, 0.70], mid: [0.55, 0.62, 0.80], hor: [1.0, 0.82, 0.62], glow: [0.3, 0.2, 0.05], line: [0.25, 0.2, 0.14], orbC: [1.6, 1.45, 1.1],
  cloudL: [1.1, 0.95, 0.85], cloudD: [0.55, 0.5, 0.62], fogC: [0.85, 0.8, 0.75], deep: [0.035, 0.12, 0.17], shal: [0.22, 0.40, 0.38], glit: [2.0, 1.8, 1.3],
  rim: [1.0, 0.92, 0.75], sand: [0.62, 0.52, 0.40], sil: [0.07, 0.08, 0.10],
  glowAz: 0, orbEl: 0.13, orbR: 1.3, halo: 0.9, stars: 0, cloud: 0.8, aurora: 0, fogD: 0.0024, fogMix: 0.25, skyFog: 0, hills: 1, peaks: 0, wave: 0.8, leaf: 0,
};
function bayLook(n, fog) {   // the bay he played: dusk sliding to night, with the fog bank out past the ledge
  const m = (a, b) => mix3(a, b, n), f = fog || 0;
  return {
    zen: m([0.05, 0.07, 0.22], [0.008, 0.012, 0.045]), mid: m([0.36, 0.24, 0.50], [0.035, 0.045, 0.13]), hor: m([1.0, 0.55, 0.36], [0.12, 0.12, 0.26]),
    glow: [0.3 * (1 - n), 0.048 * (1 - n), 0.024 * (1 - n)], line: [0.2 * (1 - 0.7 * n), 0.15 * (1 - 0.7 * n), 0.1 * (1 - 0.7 * n)], orbC: [1.0, 0.93, 0.76],
    cloudL: mix3([1.05, 0.50, 0.38], [0.05, 0.06, 0.12], 0.85 * n), cloudD: mix3([0.16, 0.12, 0.24], [0.05, 0.06, 0.12], 0.85 * n),
    fogC: m([0.30, 0.25, 0.36], [0.055, 0.06, 0.115]), deep: m([0.022, 0.065, 0.10], [0.008, 0.022, 0.05]), shal: m([0.10, 0.17, 0.17], [0.03, 0.06, 0.08]),
    glit: [0.9 + 0.9 * n, 0.81 + 0.81 * n, 0.63 + 0.63 * n].map(v => v * (1 - 0.85 * f)), rim: [1.0, 0.9, 0.75], sand: m([0.12, 0.10, 0.095], [0.075, 0.08, 0.105]), sil: [0.027, 0.031, 0.059],
    glowAz: -0.6, orbEl: 0.1589, orbR: 1, halo: 0.55 + 0.45 * n, stars: 0.115 + 0.885 * n, cloud: 1, aurora: 0, fogD: lerp(0.0026, 0.021, f), fogMix: 0.9 * f, skyFog: f, hills: 1, peaks: 0, wave: 1, leaf: 0,
  };
}
const from = (base, o) => Object.assign({}, base, o);
const L_WOODS = from(NIGHT, { fogC: [0.05, 0.06, 0.08], fogD: 0.011, leaf: 1, wave: 0.55, hills: 0, rim: [0.9, 0.85, 0.8] });
const L_TOWN = from(NIGHT, {

bool scenery(vec3 ro,vec3 rd,float tMax,out vec3 col,out float tHit){

// ---------------- the ground beside the water ----------------
float beachZ(float x){ return 3116.0+0.012*x*x; }
bool isLand(vec2 q){
  if(q.y<shoreZ(q.x)) return true;
  if(q.y>345.0&&q.y<3116.0&&abs(q.x)>bankE(q.y)) return true;
  if(q.y>=beachZ(q.x)&&q.y-3150.0<shoreZ(q.x)) return true;        // the beach at home, between the lagoon and the bay
  return false; }
vec3 land(vec3 p,vec3 rd,float t){

  base=mix(base,mix(vec3(0.045,0.045,0.055),vec3(0.36,0.35,0.35),hash(ci+4.4))*(0.85+1.3*(pf.x*0.6+pf.y*0.8))*(0.55+1.3*length(uSand)),peb);

    float dC=length(p.xz-vec2(0.0,3134.0)),in1=smoothstep(18.5,16.5,dC);
    base*=1.0+0.10*in1*sin(dC*7.854);

  col+=vec3(0.72,0.76,0.82)*smoothstep(0.22,0.02,edge)*(0.5+0.5*noise(vec2(p.x*3.0,uTime*0.6)))*0.32;

vec3 under(vec2 uv){
  vec3 c=mix(vec3(0.0,0.02,0.04),vec3(0.03,0.16,0.20),pow(uv.y,1.5));
  float ray=sin(uv.x*14.0+uTime*0.7+sin(uv.y*5.0+uTime))*0.5+0.5;
