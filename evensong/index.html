<style>
  html, body { margin: 0; height: 100%; background: #07070c; overflow: hidden; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  /* 100dvh, not 100vh: on iOS Safari 100vh is the LARGE viewport while the parent
     resolves to the visible one, so the canvas overflowed and the votive row and
     tutorial line were clipped off both ends in landscape. */
  canvas { max-width: 100vw; max-height: 100dvh; aspect-ratio: 16/9; cursor: none;
    touch-action: none; }

  /* A phone opens in portrait, where 16/9 collapses to a ~390x219 strip: 12px
     strings against a 40px thumb, and instructions at 5px. Landscape is the only
     honest way to play this, and iOS cannot be told to rotate — so ask. */
  /* Only for screens actually too narrow to play: a phone in portrait collapses
     16/9 to a ~390x219 strip. An iPad in portrait is 768 wide, which gives a
     768x432 canvas and 31px between strings — perfectly playable, so it must not
     be blocked. Hence the max-width bound alongside the orientation test. */
  #rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) and (max-width: 600px) {
    #wrap { display: none; }
    #rotate {
      display: flex; position: fixed; inset: 0; z-index: 600;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 0 10vw; text-align: center; background: #07070c;
      color: rgba(232, 220, 192, .82);
      font: 400 15px/1.9 system-ui, -apple-system, sans-serif;
      letter-spacing: .18em; text-transform: lowercase;
    }
    #rotate .glyph {
      width: 46px; height: 74px; border: 2px solid rgba(240, 201, 106, .55);
      border-radius: 7px; animation: tip 2.6s ease-in-out infinite;
    }
    #rotate .quiet { font-size: 12px; color: rgba(232, 220, 192, .42); letter-spacing: .2em; }
    @keyframes tip { 0%, 34% { transform: rotate(0deg); } 62%, 100% { transform: rotate(-90deg); } }
  }
  @media (prefers-reduced-motion: reduce) { #rotate .glyph { animation: none; } }

  /* qualiacology hub shell */
  .home-link { position: fixed; right: 14px; top: 14px; z-index: 500; color: rgba(232,220,192,.85); text-decoration: none;
    font: 800 11px/1.2 system-ui,-apple-system,sans-serif; letter-spacing: .16em; text-transform: uppercase; padding: 8px 12px;
    border-radius: 999px; background: rgba(10,10,18,.62); border: 1px solid rgba(240,201,106,.32); backdrop-filter: blur(8px); transition: opacity .4s ease; }
  .home-link:hover, .home-link:focus-visible { color: #fff; border-color: rgba(240,201,106,.7); outline: 0; }
  body.playing .home-link { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<a class="home-link" href="/">Qualiacology</a>
<div id="rotate">
  <div class="glyph"></div>
  <div>turn your phone sideways</div>
  <div class="quiet">headphones recommended</div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/theory.js"></script>
<script src="js/score.js"></script>
<script src="js/audio.js"></script>
<script src="js/world.js"></script>
<script src="js/game.js"></script>
<script>
  // Last-resort audio unlock: `click` is activation-triggering on every device, and
  // iOS can suspend the context long after the first press (a call, a route change).
  document.addEventListener('click', function () {
    try { var A = window.__evensong && window.__evensong.A; if (A && A.unlock) A.unlock(); } catch (e) {}
  }, true);
  // hub shell: the pill stays for the title and the endcard, and leaves you alone while you sing.
  setInterval(function () {
    try {
      var s = window.__evensong && window.__evensong.G.scene;
      document.body.classList.toggle('playing', !!s && s !== 'title' && s !== 'endcard');
    } catch (e) {}
  }, 250);
</script>
</body>
