<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a0c14" />
<meta name="description" content="SKYSHARD — an open-world FPS. Five lands, strange doors, and the things that wait behind them." />
<title>SKYSHARD</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: #0a0c14;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  /* ---------- overlays ---------- */
  .overlay {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 20;
    transition: opacity 600ms ease; pointer-events: none; opacity: 0;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  #loading { background: #0a0c14; z-index: 40; transition-duration: 900ms; }
  #loading .bar { width: 180px; height: 2px; background: #1c2233; margin-top: 26px; overflow: hidden; }
  #loading .bar > div { height: 100%; width: 0%; background: #9fd4ff; transition: width 200ms ease; }

  #title { background: transparent; z-index: 30; }
  #title .card { text-align: center; padding-bottom: 8vh; }
  h1 {
    font-size: clamp(44px, 9vw, 96px); font-weight: 200; letter-spacing: 0.42em;
    margin-right: -0.42em; color: #eaf4ff;
    text-shadow: 0 0 34px rgba(120, 190, 255, 0.55), 0 2px 8px rgba(0,0,0,0.8);
  }
  .sub {
    margin-top: 14px; font-size: 13px; letter-spacing: 0.34em; margin-right: -0.34em;
    color: rgba(200, 220, 245, 0.66); text-transform: uppercase; font-weight: 300;
  }
  .begin {
    margin-top: 7vh; font-size: 14px; letter-spacing: 0.3em; margin-right: -0.3em;
    color: rgba(235, 245, 255, 0.9); text-transform: uppercase;
    animation: breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }

  /* ---- on-screen controls (touch only) ---- */
  #touch { position: fixed; inset: 0; z-index: 8; pointer-events: none;
           touch-action: none; -webkit-user-select: none; user-select: none; }
  #touch[hidden] { display: none; }
  #tstick { position: absolute; width: 116px; height: 116px; margin: -58px 0 0 -58px;
            border: 1px solid rgba(220,238,255,.30); border-radius: 50%;
            background: rgba(6,10,18,.16); opacity: 0; transition: opacity .16s ease; }
  #tnub { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
          margin: -22px 0 0 -22px; border-radius: 50%;
          background: rgba(220,238,255,.24); border: 1px solid rgba(220,238,255,.42); }
  .tbtn { position: absolute; pointer-events: auto; display: flex;
          align-items: center; justify-content: center; border-radius: 50%;
          font: 700 13px/1 system-ui, -apple-system, sans-serif; letter-spacing: .12em;
          color: rgba(235,245,255,.86); background: rgba(6,10,18,.34);
          border: 1px solid rgba(220,238,255,.34); backdrop-filter: blur(3px);
          width: 86px; height: 86px; }
  .tbtn.small { width: 62px; height: 62px; font-size: 11px; }
  .tbtn.on { background: rgba(120,190,255,.30); border-color: rgba(180,220,255,.8); }
  .tbtn[hidden] { display: none; }
  /* Thumb-reachable corner cluster; safe-area aware for notched phones. */
  #t-fire { right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); }
  #t-jump { right: calc(116px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); }
  #t-dash { right: calc(22px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); }
  #t-slam { right: calc(92px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); }
  #t-grap { right: calc(162px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); }
  #t-seek { right: calc(232px + env(safe-area-inset-right)); bottom: calc(114px + env(safe-area-inset-bottom)); }
  /* Short landscape phones have no room for a second row above the main pads. */
  @media (max-height: 400px) {
    .tbtn { width: 72px; height: 72px; }
    .tbtn.small { width: 54px; height: 54px; }
    #t-jump { right: calc(100px + env(safe-area-inset-right)); }
    #t-dash, #t-slam, #t-grap, #t-seek { bottom: calc(98px + env(safe-area-inset-bottom)); }
    #t-slam { right: calc(82px + env(safe-area-inset-right)); }
    #t-grap { right: calc(142px + env(safe-area-inset-right)); }
    #t-seek { right: calc(202px + env(safe-area-inset-right)); }
  }
  /* Shown only on devices without Pointer Lock (every phone). The title overlay is
     transparent over the live world, so this needs its own backing to stay legible. */
  /* display:inline-block outranks the UA stylesheet's [hidden]{display:none}, so
     without this the note showed on desktop from page load. Keep it above the
     display rule's specificity, not merely before it. */
  #desktop-note[hidden] { display: none; }
  #desktop-note {
    display: inline-block; margin: 3.4vh auto 0; max-width: 78vw; line-height: 1.7;
    font-size: 12px; letter-spacing: 0.28em; text-indent: 0.28em;
    color: #eaf4ff; text-transform: uppercase; font-weight: 300;
    background: rgba(6, 10, 18, 0.74); padding: 11px 17px; border-radius: 4px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  }
  #title.unsupported .begin { animation: none; opacity: 0.4; }

  #pause { background: rgba(6, 8, 14, 0.55); backdrop-filter: blur(6px); }
  #pause .begin { animation-duration: 2s; }
  #pause .keys {
    margin-top: 30px; font-size: 12px; line-height: 2.1; letter-spacing: 0.14em;
    color: rgba(190, 205, 230, 0.55); text-align: center; font-weight: 300;
  }
  #pause .keys b { color: rgba(235, 245, 255, 0.85); font-weight: 500; }

  /* ---------- transitions & damage ---------- */
  #fader { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 15; transition: opacity 380ms ease; }
  #hurt {
    position: fixed; inset: 0; pointer-events: none; z-index: 10; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 52%, rgba(200, 30, 40, 0.55) 100%);
  }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 12; opacity: 0; transition: opacity 500ms ease; }
  #hud.show { opacity: 1; }

  #cross { position: fixed; left: 50%; top: 50%; width: 0; height: 0; }
  #cross .dot {
    position: absolute; left: -2px; top: -2px; width: 4px; height: 4px; border-radius: 50%;
    background: rgba(240, 250, 255, 0.9); box-shadow: 0 0 5px rgba(140, 200, 255, 0.8);
    transition: transform 80ms ease;
  }
  #cross .pip {
    position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255, 235, 170, 0.95); opacity: 0; transform: scale(0.4);
  }
  #cross.hit .pip { animation: hitpip 240ms ease-out; }
  @keyframes hitpip { 0% { opacity: 0.95; transform: scale(0.42); } 100% { opacity: 0; transform: scale(1.05); } }

  #pips { position: fixed; left: 26px; bottom: 24px; display: flex; gap: 7px; }
  #pips .pip {
    width: 15px; height: 15px; transform: rotate(45deg); border: 1.5px solid rgba(190, 230, 255, 0.85);
    background: rgba(140, 215, 255, 0.9); box-shadow: 0 0 9px rgba(120, 200, 255, 0.55);
    transition: background 220ms ease, box-shadow 220ms ease;
  }
  #pips .pip.empty { background: transparent; box-shadow: none; border-color: rgba(160, 190, 220, 0.35); }

  #verbs { position: fixed; right: 26px; bottom: 24px; display: flex; gap: 10px; }
  .verb {
    width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid rgba(190, 220, 250, 0.5);
    display: none; align-items: center; justify-content: center;
    background: rgba(14, 20, 34, 0.55); position: relative; overflow: hidden;
  }
  .verb.owned { display: flex; }
  .verb svg { width: 20px; height: 20px; opacity: 0.92; }
  .verb .cool { position: absolute; left: 0; bottom: 0; width: 100%; background: rgba(120, 190, 255, 0.28); height: 0%; }
  .verb.ready { border-color: rgba(160, 225, 255, 0.9); box-shadow: 0 0 10px rgba(110, 190, 255, 0.35); }

  #whisper {
    position: fixed; left: 50%; bottom: 15vh; transform: translateX(-50%);
    font-size: 14px; letter-spacing: 0.26em; margin-right: -0.26em; text-transform: uppercase;
    color: rgba(230, 242, 255, 0.92); text-shadow: 0 1px 10px rgba(0,0,0,0.9);
    opacity: 0; transition: opacity 700ms ease; white-space: nowrap; font-weight: 300;
  }

  #bossbar {
    position: fixed; top: 34px; left: 50%; transform: translateX(-50%); width: min(460px, 60vw);
    opacity: 0; transition: opacity 500ms ease;
  }
  #bossbar .name {
    text-align: center; font-size: 12px; letter-spacing: 0.4em; margin-right: -0.4em;
    text-transform: uppercase; color: rgba(240, 230, 255, 0.9); margin-bottom: 8px; font-weight: 300;
  }
  #bossbar .rail { height: 3px; background: rgba(120, 130, 160, 0.25); }
  #bossbar .fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffd9a0, #ff9bb0); transition: width 160ms ease; box-shadow: 0 0 12px rgba(255, 170, 150, 0.5); }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(4, 6, 12, 0.42) 100%);
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>

  <meta property="og:site_name" content="Qualiacology" />
  <meta property="og:title" content="Skyshard | Qualiacology" />
  <meta property="og:description" content="An open-world FPS across five small lands under one strange sky — and every boss you beat teaches your body a new move." />
  <meta property="og:url" content="https://qualiacology.com/skyshard/" />
  <meta property="og:image" content="https://qualiacology.com/skyshard/assets/card.jpg" />
  <meta property="og:image:alt" content="Skyshard — open-world FPS" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Skyshard | Qualiacology" />

  <meta name="twitter:image" content="https://qualiacology.com/skyshard/assets/card.jpg" />
  <link rel="canonical" href="https://qualiacology.com/skyshard/" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%230a0c14'/><path d='M32 12 L42 34 L32 52 L22 34 Z' fill='%23eaf4ff' fill-opacity='0.92'/></svg>">

<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hurt"></div>
<div id="fader"></div>

<div id="hud">
  <div id="cross"><div class="dot"></div><div class="pip"></div></div>
  <div id="pips"></div>
  <div id="verbs"></div>
  <div id="whisper"></div>
  <div id="bossbar"><div class="name"></div><div class="rail"><div class="fill"></div></div></div>
</div>

<div id="title" class="overlay">
  <div class="card">
    <h1>SKYSHARD</h1>
    <div class="sub">five lands &middot; strange doors</div>
    <div class="begin">click to wake</div>
    <div id="desktop-note" hidden>Desktop with a mouse &amp; keyboard required.</div>
  </div>
</div>

<!-- On-screen controls. Hidden until a coarse pointer is confirmed, and the
     ability pads only appear once the world has granted that ability. -->
<div id="touch" hidden>
  <div id="tstick"><div id="tnub"></div></div>
  <div class="tbtn" id="t-fire">FIRE</div>
  <div class="tbtn" id="t-jump">JUMP</div>
  <div class="tbtn small" id="t-dash" hidden>DASH</div>
  <div class="tbtn small" id="t-slam" hidden>SLAM</div>
  <div class="tbtn small" id="t-grap" hidden>HOOK</div>
  <div class="tbtn small" id="t-seek" hidden>SEEK</div>
</div>

<div id="pause" class="overlay">
  <div class="begin">click to return</div>
  <div class="keys">
    <b>WASD</b> move &nbsp;&middot;&nbsp; <b>mouse</b> look &nbsp;&middot;&nbsp; <b>click</b> fire<br/>
    everything else, the world will teach you
  </div>
</div>

<div id="loading" class="overlay show">
  <h1 style="font-size:28px;">SKYSHARD</h1>
  <div class="bar"><div id="loadfill"></div></div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
