<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; cursor:none; }
  /* qualiacology hub shell */
  .home-link{position:fixed;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:20;
    color:rgba(232,232,224,.85);text-decoration:none;cursor:pointer;font:bold 12px/1.2 'Courier New',monospace;
    letter-spacing:.18em;text-transform:uppercase;padding:8px 12px;border-radius:999px;background:rgba(3,5,10,.6);
    border:1px solid rgba(232,232,224,.28);backdrop-filter:blur(6px);transition:opacity .3s ease;
    text-shadow:1px 0 rgba(255,60,60,.45),-1px 0 rgba(60,120,255,.45);}
  .home-link:hover,.home-link:focus-visible{color:#fff;border-color:rgba(232,232,224,.7);outline:0;}
  body.playing .home-link{opacity:0;pointer-events:none;}
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  /* ---- camcorder OSD (positioned into the 4:3 frame by JS) ---- */
  #osd {
    position:fixed; pointer-events:none; font-family:'Courier New', monospace;
    font-weight:bold; color:#e8e8e0; z-index:5; display:none;
    text-shadow: 1px 0 rgba(255,60,60,.55), -1px 0 rgba(60,120,255,.55), 0 0 6px rgba(0,0,0,.9);
    filter: blur(.3px);
  }
  .osd-el { position:absolute; letter-spacing:2px; font-size:20px; white-space:pre; }
  #osd-rec   { top:4%;  left:5%; }
  #osd-rec .dot { color:#ff3b30; }
  #osd-mode  { top:4%;  right:5%; text-align:right; }
  #osd-batt  { top:10%; right:5%; text-align:right; font-size:16px; }
  #osd-count { top:15%; right:5%; text-align:right; font-size:15px; letter-spacing:3px; color:#c8c8be; }
  #osd-date  { bottom:10%; left:5%; }
  #osd-time  { bottom:4%;  left:5%; }
  #osd-warn  { bottom:4%; right:5%; text-align:right; color:#ffd23e; display:none; }
  /* ---- overlays ---- */
  .full { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; background:#000; padding:0 4vw;
    font-family:'Courier New', monospace; color:#d8d8d0; text-align:center; }
  #title h1 {
    /* floor low enough that the tracked monospace title still fits a 390px phone;
       the negative margin cancels the trailing letter-space so it stays centred. */
    font-size: clamp(24px, 7vw, 84px); letter-spacing:.18em; margin:0 -0.18em 10px 0; font-weight:bold;
    color:#e6e6de; text-shadow: 2px 0 rgba(255,60,60,.5), -2px 0 rgba(60,120,255,.5), 0 0 24px rgba(255,255,255,.12);
    animation: jitter 4s infinite steps(1);
  }
  @keyframes jitter {
    0%,93%,100% { transform:translate(0,0) skewX(0deg); }
    94% { transform:translate(-3px,1px) skewX(2deg); }
    95% { transform:translate(2px,-1px) skewX(-1deg); }
    96% { transform:translate(0,0) skewX(0); }
  }
  #title .tag { font-size: clamp(14px,2vw,20px); letter-spacing:.12em; color:#9a9a90; margin-bottom:48px; }
  #title .go  { font-size: clamp(16px,2.4vw,24px); letter-spacing:.2em; color:#e8e8e0; animation: blink 1.4s infinite steps(1); }
  #title .go .dot { color:#ff3b30; }
  @keyframes blink { 0%,60% {opacity:1;} 61%,100% {opacity:.25;} }
  #title .keys { position:absolute; bottom:6%; font-size:14px; letter-spacing:.18em; color:#6f6f66; }
  /* Shown only on devices without Pointer Lock (every phone). The keyboard hint
     line is meaningless there, and its &nbsp;-joined copy cannot wrap, so drop it. */
  #title #desktop-note { margin-top:34px; max-width:80vw; text-align:center; line-height:1.7;
    font-size:14px; letter-spacing:.18em; color:#c9c9bf; }
  #title.unsupported .keys { display:none; }
  #title.unsupported .go { animation:none; opacity:.35; }
  #title .trackbar { position:absolute; left:0; right:0; height:3px; background:rgba(255,255,255,.06); animation: roll 7s linear infinite; }
  @keyframes roll { from { top:110%; } to { top:-5%; } }
  #paused { display:none; background:rgba(0,0,0,.72); }
  #paused .p1 { font-size: clamp(24px,4vw,48px); letter-spacing:.3em; }
  #paused .p2 { font-size: 15px; letter-spacing:.18em; color:#8a8a80; margin-top:18px; }
  #err { display:none; }
  #err .p1 { font-size:20px; letter-spacing:.1em; color:#ff6b5e; }
</style>

<body>
<a class="home-link" href="/">Qualiacology</a>
<canvas id="c"></canvas>

<div id="osd">
  <div class="osd-el" id="osd-rec"><span class="dot">&#9679;</span> REC</div>
  <div class="osd-el" id="osd-mode">SP</div>
  <div class="osd-el" id="osd-batt">&#9646;&#9646;&#9646;&#9647;</div>
  <div class="osd-el" id="osd-count">0000</div>
  <div class="osd-el" id="osd-date">OCT  4 1996</div>
  <div class="osd-el" id="osd-time">3:12:00 AM</div>
  <div class="osd-el" id="osd-warn">DEW</div>
</div>

<div class="full" id="title">
  <div class="trackbar"></div>
  <h1>THE EATEN PATH</h1>
  <div class="tag">every path you take eats itself</div>
  <div class="go">CLICK TO RECORD <span class="dot">&#9679;</span></div>
  <div id="desktop-note" hidden>Desktop with a mouse &amp; keyboard required.</div>
  <div class="keys">WASD&nbsp;WALK&nbsp;&nbsp;&middot;&nbsp;&nbsp;MOUSE&nbsp;LOOK&nbsp;&nbsp;&middot;&nbsp;&nbsp;SHIFT&nbsp;HURRY&nbsp;&nbsp;&middot;&nbsp;&nbsp;HEADPHONES&nbsp;ON</div>
</div>

<div class="full" id="paused">
  <div class="p1">&#10074;&#10074; PAUSE</div>
  <div class="p2">CLICK TO RESUME RECORDING</div>
</div>

<div class="full" id="err">
  <div class="p1">NO SIGNAL &mdash; WEBGL UNAVAILABLE</div>
</div>

<script>
/* hub shell: the pill leaves when the camcorder takes the pointer, comes back on pause. */
document.addEventListener('pointerlockchange', function () {
  document.body.classList.toggle('playing', !!document.pointerLockElement);
});
</script>
</body>
