<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  :root {
    --void:#05060B; --sky:#131A3A; --danger:#FF2D6F; --amber:#FFB020;
    --mine:#5FF7FF; --mineB:#B8FFEA; --gold:#FFD166; --hud:#FFFFFF;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#000; overflow:hidden; }
  body { font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif; color:var(--hud);
    display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1280px; height:720px; transform-origin:center center; }
  canvas { display:block; cursor:none; touch-action:none; background:var(--void);
    box-shadow:0 14px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(95,247,255,0.07); }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:16px; text-align:center;
    background:radial-gradient(ellipse at 50% 45%, rgba(19,26,58,0.86), rgba(5,6,11,0.97));
    opacity:0; pointer-events:none; visibility:hidden; transition:opacity .45s, visibility .45s; }
  .screen.on { opacity:1; pointer-events:auto; visibility:visible; }

  h1 { font-size:118px; letter-spacing:0.40em; text-indent:0.40em; font-weight:700;
    color:#FFFFFF; text-shadow:0 0 46px rgba(95,247,255,0.45), 0 0 90px rgba(255,45,111,0.25); }
  .sub { font-size:19px; letter-spacing:0.10em; color:rgba(255,255,255,0.68); margin-top:-10px; }
  .btn { font-family:inherit; font-size:17px; letter-spacing:0.22em; text-transform:uppercase;
    background:transparent; color:var(--mine); border:1px solid rgba(95,247,255,0.5);
    padding:13px 46px; cursor:pointer; transition:transform .12s, background .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-2px); background:rgba(95,247,255,0.09);
    box-shadow:0 0 26px rgba(95,247,255,0.28); }
  .row { display:flex; gap:14px; margin-top:6px; }
  .big { font-size:34px; font-weight:600; letter-spacing:0.03em; max-width:820px; line-height:1.35; }
  .fine { font-size:13px; letter-spacing:0.12em; color:rgba(255,255,255,0.5); }
  .best { font-size:14px; letter-spacing:0.14em; color:rgba(255,255,255,0.6);
    font-variant-numeric:tabular-nums; }
  .foot { position:absolute; bottom:26px; font-size:12px; letter-spacing:0.13em;
    color:rgba(255,255,255,0.40); }
  .keys { display:flex; gap:26px; margin-top:10px; font-size:12px; letter-spacing:0.12em;
    color:rgba(255,255,255,0.52); }
  .keys b { color:var(--mine); font-weight:600; }
  #vic-title { color:var(--gold); text-shadow:0 0 34px rgba(255,209,102,0.35); }
  .mark { position:absolute; top:calc(50% - 156px); right:calc(50% - 268px);
    width:13px; height:13px; border-radius:50%; background:var(--danger);
    box-shadow:0 0 26px var(--danger); }
</style>

  <title>FINALE | Qualiacology</title>
  <meta name="description" content="FINALE is a browser bullet hell about beating a firework to its own explosion — kill a shell in its fuse window and its volley blooms in your colour.">
  <meta name="theme-color" content="#05060b">
  <link rel="canonical" href="https://qualiacology.com/finale/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <meta property="og:site_name" content="Qualiacology">
  <meta property="og:type" content="website">
  <meta property="og:title" content="FINALE | Qualiacology">
  <meta property="og:description" content="Every enemy is a firework shell. Kill one while its fuse is lit and the volley it was about to fire blooms in your colour instead.">
  <meta property="og:url" content="https://qualiacology.com/finale/">
  <meta property="og:image" content="https://qualiacology.com/assets/games/finale-card-clean.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FINALE | Qualiacology">
  <meta name="twitter:description" content="Every enemy is a firework shell. Kill one while its fuse is lit and the volley it was about to fire blooms in your colour instead.">
  <meta name="twitter:image" content="https://qualiacology.com/assets/games/finale-card-clean.jpg">
</head>
<body>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="scr-title" class="screen on">
    <div class="mark"></div>
    <h1>FINALE</h1>
    <div class="sub">Beat the shell to its own explosion.</div>
    <button id="btn-begin" class="btn">Begin</button>
    <div class="keys">
      <span><b>WASD</b> / mouse — fly</span>
      <span><b>SHIFT</b> — focus</span>
      <span><b>E</b> — flare</span>
      <span><b>SPACE</b> — misfire</span>
    </div>
    <div id="best" class="best"></div>
    <div class="foot">a qualiacology game · the gun is an igniter, not a weapon · sound on</div>
  </div>

  <div id="scr-over" class="screen">
    <div class="big">The show went on without you.</div>
    <div class="row">
      <button id="btn-again" class="btn">Again</button>
      <button id="btn-leave" class="btn">Leave</button>
    </div>
    <div class="fine">Waves buy boss power. Enter loud.</div>
  </div>

  <div id="scr-victory" class="screen">
    <div id="vic-title" class="big">Every window in the city is lit.</div>
    <div id="vic-score" class="best">Score  0</div>
    <div class="row">
      <button id="vic-again" class="btn">Again</button>
      <button id="vic-leave" class="btn">Leave</button>
    </div>
  </div>
</div>

<script>
  (function fit(){ var s=document.getElementById('stage');
    function r(){ var k=Math.min(window.innerWidth/1280, window.innerHeight/720);
      s.style.transform='scale('+k+')'; }
    window.addEventListener('resize', r); r();
  })();
</script>

<!-- Load order matters: each module reads globals defined by the ones above it. -->
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/pool.js"></script>
<script src="js/atlas.js"></script>
<script src="js/input.js"></script>
<script src="js/emitters.js"></script>
<script src="js/enemies.js"></script>
<script src="js/beams.js"></script>
<script src="js/fuse.js"></script>
<script src="js/player.js"></script>
<script src="js/fx.js"></script>
<script src="js/skyline.js"></script>
<script src="js/hud.js"></script>
<script src="js/waves.js"></script>
<script src="js/boss.js"></script>
<script src="js/bosses/romancandle.js"></script>
<script src="js/bosses/catherine.js"></script>
<script src="js/bosses/kamuro.js"></script>
<script src="js/bosses/showrunner.js"></script>
<script src="js/director.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>
  Game.boot();
  window.__FINALE = Game.API;
  try {
    var b = localStorage.getItem('finale_best');
    if (b) document.getElementById('best').textContent = 'Best  ' + Number(b).toLocaleString();
  } catch(e){}
  // URL params for the headless harness: ?act=2&slot=boss&phase=1&seed=7&god=1&nomusic=1
  (function params(){
    var q = new URLSearchParams(location.search);
    if (q.get('nomusic')) Game.API.audio(false);
    if (q.get('seed')) Game.API.seed(Number(q.get('seed')));
    if (q.get('god')) Game.API.godmode(true);
    if (q.has('act')) {
      Game.API.load(Number(q.get('act')) || 0, q.get('slot') || 0, Number(q.get('phase')) || 0);
    }
  })();
</script>

<style>
  .qc-home-link{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:2147483000;
    color:rgba(255,255,255,.82);text-decoration:none;font:700 10px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.16em;
    text-transform:uppercase;padding:7px 11px;border-radius:999px;background:rgba(8,8,14,.62);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(8px);transition:opacity .25s ease,color .25s ease}
  .qc-home-link:hover,.qc-home-link:focus-visible{color:#fff;border-color:rgba(255,255,255,.45)}
  body:has(canvas:fullscreen) .qc-home-link{opacity:0;pointer-events:none}
</style>
<a class="qc-home-link" href="/">Qualiacology</a>
<script>
  // hide the pill while the game holds pointer lock, so it never sits over a locked cursor
  document.addEventListener('pointerlockchange',function(){
    var a=document.querySelector('.qc-home-link'); if(!a) return;
    var locked=!!document.pointerLockElement; a.style.opacity=locked?'0':''; a.style.pointerEvents=locked?'none':'';
  });
</script>
</body>
</html>
