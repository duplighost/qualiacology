<link rel="stylesheet" href="style.css">
<style>
  /* site home pill */
  .home-link { position: fixed; z-index: 300;
    left: max(14px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top));
    font: 400 11px/1 Georgia, "Times New Roman", serif;
    letter-spacing: .26em; text-transform: uppercase; text-decoration: none;
    color: #e8c07a; opacity: .34; padding: 8px 12px;
    border: 1px solid rgba(125, 47, 66, .55); border-radius: 999px;
    background: rgba(5, 3, 8, .62); transition: opacity .2s ease; }
  .home-link:hover, .home-link:focus-visible { opacity: .9; }
  .home-link:focus-visible { outline: 2px solid #d44a61; outline-offset: 2px; }
  /* The pause button lives in the top-right, so the pill never covers a control.
     It hides while a run is going and comes back on the title and on pause. */
  body.playing .home-link { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <a class="home-link" href="/">Qualiacology</a>
  <main id="game-shell" aria-label="HELLSPINDLE game canvas">
    <canvas id="game" width="1600" height="900"></canvas>
    <div id="rotate-note">ROTATE TO LANDSCAPE<br><small>THE WHEEL REQUIRES ELBOW ROOM</small></div>
  </main>
  <script src="game.js"></script>
  <script>
    // Fade the home pill out while a run is going and back in on the title or
    // a pause, so it is always reachable but never sits over the play area.
    (() => {
      const body = document.body;
      const tick = () => {
        const hs = window.__HELLSPINDLE__;
        if (hs) {
          const s = hs.snapshot();
          const busy = (s.state === 'playing' || s.state === 'dead') && !s.paused && !s.relicsOpen;
          body.classList.toggle('playing', busy);
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    })();
  </script>
</body>
