    <style>
      .home-link {
        position: fixed;
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 2147483647;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 34px;
        padding: 0 13px;
        color: rgba(239, 226, 193, .9);
        text-decoration: none;
        font: 700 10px/1.2 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        letter-spacing: .2em;
        text-transform: uppercase;
        border: 1px solid rgba(206, 166, 102, .28);
        border-radius: 999px;
        background: rgba(7, 7, 7, .62);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        opacity: .3;
        transition: opacity .18s ease, border-color .18s ease, box-shadow .18s ease;
      }
      .home-link:hover,
      .home-link:focus-visible {
        opacity: 1;
        border-color: #d8b677;
        outline: 0;
      }
      .home-link:focus-visible { box-shadow: 0 0 0 2px rgba(216, 182, 119, .34); }
      .home-link[hidden] { display: none !important; }
      @media (pointer: coarse) { .home-link { opacity: .24; } }
      @media (max-width: 600px) {
        .home-link {
          left: 50%;
          top: max(12px, env(safe-area-inset-top));
          bottom: auto;
          transform: translateX(-50%);
          width: 40px;
          height: 40px;
          padding: 0;
          display: grid;
          place-items: center;
          font-size: 0;
        }
        .home-link::after {
          content: "Q.";
          color: #efe2c1;
          font: 700 13px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
          letter-spacing: .02em;
        }
        .home-link > span { display: none; }
      }
    </style>
  </head>
  <body>
    <nav aria-label="Qualiacology"><a class="home-link" href="/" title="Return to Qualiacology"><span aria-hidden="true">&#8592;</span><span>Qualiacology</span></a></nav>
    <main id="game" aria-label="The Last Room game">
      <canvas id="scene" aria-label="First-person haunted mansion"></canvas>
      <div id="grade" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>
      <div id="reticle" aria-hidden="true"><i></i></div>
      <div id="hand" aria-live="polite"></div>
      <div id="room-name" aria-live="polite"></div>
      <div id="marrow-counter" aria-live="polite" aria-label="The hidden bone tally has not changed"><i aria-hidden="true"></i><span>⌁ ··· ⊚</span></div>
      <div id="touch-ui" aria-label="Touch controls">
        <div class="touch-zone" id="move-zone"><b></b></div>
        <div class="touch-zone" id="look-zone"><b></b></div>
        <button class="touch-action" id="touch-crouch" type="button" aria-label="Toggle crouch">DUCK</button>
        <button class="touch-action" id="touch-throw" type="button" aria-label="Throw held object">THROW</button>
        <button class="touch-action" id="touch-jump" type="button" aria-label="Jump">HOP</button>
        <button class="touch-action" id="touch-pause" type="button" aria-label="Pause game">PAUSE</button>
      </div>
      <section id="veil">
        <div class="title-lockup">
          <p class="eyebrow">AN ENDLESS HOUSE</p>
          <h1>THE LAST<br />ROOM</h1>
          <p class="invitation">The house remembers what you touch.</p>
          <button id="enter" type="button">ENTER</button>
          <p class="controls">WASD · LOOK · E / CLICK TO TOUCH · F TO THROW</p>
        </div>
      </section>
      <aside id="pause" hidden>
        <p>THE HOUSE IS WAITING</p>
        <button id="resume" type="button">RETURN</button>
        <button id="new-house" type="button">NEW HOUSE</button>
      </aside>
      <div id="curtain" aria-hidden="true"></div>
      <div id="announce" aria-live="assertive"></div>
    </main>
    <script>
      const scene = document.querySelector('#scene');
      const homeLink = document.querySelector('.home-link');
      function syncHomeLink() {
        if (homeLink) homeLink.hidden = document.pointerLockElement === scene;
      }
      document.addEventListener('pointerlockchange', syncHomeLink);
      syncHomeLink();
    </script>
  </body>
