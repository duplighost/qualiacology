    .home-link{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:2147483647;color:rgba(244,242,250,.84);text-decoration:none;font:800 11px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:8px 10px;border-radius:999px;background:rgba(8,8,20,.52);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px);transition:opacity .16s ease,transform .16s ease,visibility 0s linear 0s}
    .home-link:hover,.home-link:focus-visible{color:#fff;border-color:rgba(255,210,122,.55);outline:0}

    @media(max-width:600px){.home-link{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:0}.home-link::after{content:'Q.';font:900 13px/1 system-ui,sans-serif;letter-spacing:.04em;color:#5df7ff}}

<body>
  <a class="home-link" href="/" onclick="event.stopPropagation()" aria-label="Return to Qualiacology" title="Return to Qualiacology">Qualiacology</a>
  <canvas id="game"></canvas>
  <div id="hud"></div>
  <noscript>This game requires JavaScript and WebGL2.</noscript>
  <script type="module">
    const showBootError = (error) => {
      console.error(error);
      const hud = document.getElementById('hud');
      if (!hud || window.__RE?.ready) return;
      const message = error?.message || String(error || 'Unknown startup error');
      const safe = message.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));
      hud.innerHTML = `<div class="boot-error"><div><h1>RELAY//ECLIPSE COULD NOT OPEN</h1><p>${safe}</p><small>WebGL2 and an HTTP server are required.</small></div></div>`;
    };
    window.addEventListener('error', (event) => showBootError(event.error || event.message), { once: true });
    window.addEventListener('unhandledrejection', (event) => showBootError(event.reason), { once: true });
    const gameCanvas = document.getElementById('game');
    const syncHomeLink = () => {
      document.documentElement.classList.toggle('pointer-locked', document.pointerLockElement === gameCanvas);
    };
    document.addEventListener('pointerlockchange', syncHomeLink);
    window.addEventListener('pageshow', syncHomeLink);
    syncHomeLink();
    import('./src/main.js').catch(showBootError);
  </script>
</body>
