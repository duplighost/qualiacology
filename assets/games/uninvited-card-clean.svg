<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="UNINVITED">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="0.55" stop-color="#05070c"/>
      <stop offset="1" stop-color="#020306"/>
    </linearGradient>
    <radialGradient id="doorGlow" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#f0c088"/>
      <stop offset="0.4" stop-color="#c98a48"/>
      <stop offset="1" stop-color="#3a2410"/>
    </radialGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e6b271" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#e6b271" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.78"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- floor perspective, very faint -->
  <g stroke="#1a2130" stroke-width="1.5" opacity="0.5">
    <path d="M0 560 L1280 512"/>
    <path d="M0 620 L1280 556"/>
    <path d="M0 690 L1280 612"/>
  </g>

  <!-- light spilling from the doorway across the floor -->
  <ellipse cx="905" cy="560" rx="360" ry="150" fill="url(#spill)"/>

  <!-- the open doorway, warm-lit -->
  <g>
    <rect x="836" y="120" width="234" height="470" rx="4" fill="#120c08"/>
    <rect x="852" y="134" width="202" height="442" rx="2" fill="url(#doorGlow)"/>
    <!-- a faint standing figure in the light -->
    <g fill="#0c0b0e" opacity="0.92">
      <ellipse cx="953" cy="250" rx="26" ry="30"/>
      <path d="M927 288 q26 -20 52 0 l10 150 q-36 16 -72 0 z"/>
    </g>
    <!-- door frame -->
    <rect x="828" y="112" width="250" height="14" fill="#0b0906"/>
    <rect x="824" y="112" width="14" height="484" fill="#0b0906"/>
    <rect x="1068" y="112" width="14" height="484" fill="#0b0906"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="366" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="118" font-weight="700"
        letter-spacing="18" fill="#e7e3da" style="text-shadow:0 0 30px rgba(70,90,130,.4)">UNINVITED</text>
  <text x="100" y="418" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="400"
        letter-spacing="5" fill="#8b93a2">a quiet night · a big empty house · easy money</text>

  <rect width="1280" height="720" fill="url(#vig)"/>
</svg>
