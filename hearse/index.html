<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;left:0;top:0;right:0;bottom:0}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* the stage is the picture. the room sits on it at --rx,--ry and is --rw by --rh; with a mouse the room is the whole stage. */
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;color:#e9e2cf;font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#stage div{position:absolute;pointer-events:none;transition:opacity .35s;opacity:0;text-shadow:0 0 .6em rgba(0,0,0,.9)}
#score{left:50%;top:calc(var(--ry,0px) + var(--rh,100%)*.062);transform:translateX(-50%);font-size:1.25em;letter-spacing:.14em;font-variant-numeric:tabular-nums}
#mult{left:50%;top:calc(var(--ry,0px) + var(--rh,100%)*.096);transform:translateX(-50%);font-size:.85em;letter-spacing:.1em;color:#f1c96b}
#mult.pop{animation:pop .35s}
@keyframes pop{0%{transform:translateX(-50%) scale(1.7)}100%{transform:translateX(-50%) scale(1)}}
#stage #word{transform:translate(-50%,0);font-size:.95em;font-style:italic;letter-spacing:.06em;color:#f6d27a;white-space:nowrap;transition:none;text-shadow:0 0 .25em #000,0 0 .6em #000,0 0 1em #000}
#stage #title{left:calc(var(--rx,0px) + var(--rw,100%)*.065);top:calc(var(--ry,0px) + var(--rh,100%)*.81);font-size:2.3em;letter-spacing:.62em;transition:opacity 1.2s;white-space:nowrap}
#go{left:calc(var(--rx,0px) + var(--rw,100%)*.07);top:calc(var(--ry,0px) + var(--rh,100%)*.915);transform:none}
#stage #card{left:calc(var(--rx,0px) + var(--rw,100%)*.065);top:calc(var(--ry,0px) + var(--rh,100%)*.77);text-align:left;transition:opacity 1s}
#card div{position:static;opacity:1}
#cs{font-size:2.6em;letter-spacing:.12em;font-variant-numeric:tabular-nums}
#card #cb{font-size:.8em;letter-spacing:.2em;opacity:.7;margin-top:.3em}
#pause{left:50%;top:45%;transform:translateX(-50%);font-size:1em;letter-spacing:.5em;font-style:italic;text-align:center;line-height:2}
#pause .k{letter-spacing:0;font-style:normal}
#stage #err{left:6%;top:40%;right:6%;opacity:1;color:#e9e2cf;font:italic 16px/1.5 Georgia,serif;text-align:center;white-space:pre-wrap}
.hint{transform:translate(-50%,-100%);text-align:center;line-height:1}
.hint div,.hint span{position:static!important;opacity:1!important}
.k{display:inline-block;min-width:1.5em;height:1.5em;line-height:1.5em;margin:.06em;padding:0 .2em;box-sizing:border-box;border:1px solid rgba(233,226,207,.6);border-radius:.28em;font:600 .5em/1.5 system-ui,sans-serif;text-align:center;background:rgba(0,0,0,.35)}
.mouse,.hint .mouse{display:inline-block;position:relative!important;width:.9em;height:1.4em;border:1.5px solid rgba(233,226,207,.75);border-radius:.45em;background:rgba(0,0,0,.35)}
.mouse i{position:absolute;left:0;top:0;width:50%;height:42%;border-radius:.4em 0 0 0;background:#e9e2cf;animation:hold 1.3s infinite}
.mouse.tap i{animation:tap 1.1s infinite}
@keyframes hold{0%,8%{opacity:.15}16%,74%{opacity:1}86%,100%{opacity:.15}}
@keyframes tap{0%,50%{opacity:.15}60%,80%{opacity:1}100%{opacity:.15}}
#hh{transform:translate(-50%,-50%)}
/* thumbs' glyphs: a ring and a dot. tap; drag; and press, slide, let go. */
.tp,.drag,.aim{display:none;position:relative;border:1.5px solid rgba(233,226,207,.6);border-radius:50%;background:rgba(0,0,0,.3);vertical-align:middle;box-sizing:border-box}
.hint .tp,.hint .drag,.hint .aim{position:relative!important}

.drag,.aim,#hl .tp{width:2.8em;height:2.8em}
.tp i,.drag i,.aim i{position:absolute;left:50%;top:50%;border-radius:50%;background:#e9e2cf}
.tp i{width:.6em;height:.6em;margin:-.3em 0 0 -.3em;animation:tap 1.1s infinite}

@keyframes drag{0%,100%{transform:translateX(-.75em)}50%{transform:translateX(.75em)}}
@keyframes aim{0%,6%{transform:translate(0,0) scale(.35);opacity:.25}16%{transform:translate(0,0) scale(1);opacity:1}55%,68%{transform:translate(.7em,-.5em) scale(1);opacity:1}84%,100%{transform:translate(.7em,-.5em) scale(2);opacity:0}}
.touch #go .mouse,.touch #pause .k{display:none}

#hr{left:min(93%,calc(100% - var(--rx,0px)*.5))}
#hl.d .drag,#hl.t .tp,#hr .aim{display:inline-block}
#hl.t{top:40%}
/* thumbs get larger letters, so the count at the end sits a little higher to clear the tap under it */
.touch #stage #card{top:calc(var(--ry,0px) + var(--rh,100%)*.7)}
.stick,.knob{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s;z-index:5}
.stick{width:92px;height:92px;margin:-46px 0 0 -46px;border:1.5px solid rgba(233,226,207,.5);box-sizing:border-box}
.knob{width:34px;height:34px;margin:-17px 0 0 -17px;background:rgba(233,226,207,.55)}

body.turned:not(.playing) #stage #turn{opacity:.8}

<script>
/* HEARSE renderer. WebGL2, no dependencies.
   One stone floor, lit sprites on top, two lights that cast shadows (the top and the candles), bloom, and a post pass.
   The room is 1600 x 1000, y down. A desk sees exactly the room. A phone sees the room with more wall either side,
   so the picture fills its wider screen; `view` is the piece of the world on screen. */
(function () {
'use strict';
const W = 1600, H = 1000, NL = 16, MAXI = 6000, STRIDE = 15;
const R = window.R = { W, H };
R.S = { SHADOW: 0, GLOW: 1, RING: 2, STREAK: 3, PILLAR: 4, PLAYER: 5, TOP: 6, MOTH: 7, SPIDER: 8, BELL: 9,
  CANDLE: 10, HEARSE: 11, SHARD: 12, ROSE: 13, DART: 14, PUFF: 15, RETICLE: 16 };

let gl, cv, safe = null, hdr = true, rw = 2, rh = 2;
let view = [0, 0, W, H], viewKey = '', stW = 1, stH = 1, stL = 0, stT = 0, winW = 1, matDirty = true;
R.wide = false; R.turned = false; R.scale = 1; R.lost = false;
let pBake, pFloor, pSpr, pShadow, pBlur, pDown, pUp, pPost;
let fbMat, fbScene, fbSh, fbShB, bloom = [];
let vaoSpr, bufSpr, vaoSh, bufSh, vaoTri;
const inst = new Float32Array(MAXI * STRIDE); let ni = 0;
const lpos = new Float32Array(NL * 4), lcol = new Float32Array(NL * 3); let nl = 2;
const occ = []; const shv = new Float32Array(128 * 2 * 12); let sh0 = 0, sh1 = 0;
const rip = new Float32Array(16); let nr = 0;
const bell = new Float32Array(16);

const COMMON = `
precision highp float;
const float W=1600., H=1000.;
float ss(float a,float b,float x){ float t=clamp((x-a)/(b-a),0.,1.); return t*t*(3.-2.*t); }
uniform vec2 uRes; uniform vec4 uView; uniform float uTime; uniform float uHue; uniform vec3 uAmb;
uniform vec4 uLPos[${NL}]; uniform vec3 uLCol[${NL}]; uniform int uLN;
uniform sampler2D uShadow;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash2(vec2 p){ return vec2(hash(p), hash(p+17.17)); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x), mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*noise(p); p=p*2.03+7.1; a*=.5; } return s; }
vec3 hueRot(vec3 c,float a){ const vec3 k=vec3(0.57735); float ca=cos(a), sa=sin(a); return c*ca+cross(k,c)*sa+k*dot(k,c)*(1.-ca); }
vec3 glassPal(float h){ h=fract(h);
  vec3 c = h<.22? vec3(.04,.16,.9) : h<.44? vec3(.85,.04,.07) : h<.62? vec3(1.,.62,.07) : h<.8? vec3(.04,.6,.28) : vec3(.5,.1,.75);
  return max(hueRot(c,uHue),0.); }
vec3 voro(vec2 p){ vec2 n=floor(p), f=fract(p); float md=8., md2=8.; vec2 mg=vec2(0.);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(float(i),float(j)); vec2 o=hash2(n+g); vec2 r=g+o-f; float d=dot(r,r);
    if(d<md){ md2=md; md=d; mg=g; } else if(d<md2){ md2=d; } }
  return vec3(hash(n+mg+3.7), sqrt(md2)-sqrt(md), sqrt(md)); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float legD(vec2 p, vec2 a, vec2 b, float r0, float r1){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(r0,r1,h); }
vec3 lighting(vec2 wp, float wz, vec3 n, vec3 alb, float gloss, float spec){
  vec2 sh=textureLod(uShadow, gl_FragCoord.xy/uRes, 0.).rg;
  vec3 acc=vec3(0.);
  for(int i=0;i<${NL};i++){ if(i>=uLN) break;
    vec3 L=vec3(uLPos[i].xy-wp, uLPos[i].z-wz); float d=length(L); L/=max(d,1e-3);
    float Rr=uLPos[i].w; float f=clamp(1.-d/Rr,0.,1.); float att=f*f/(1.+(d*d)/(Rr*Rr*.06));
    float s = i==0? sh.r : (i==1? sh.g : 1.);
    float ndl=max(dot(n,L),0.);
    vec3 hv=normalize(L+vec3(0.,0.,1.));
    float sp=pow(max(dot(n,hv),0.),gloss)*spec;
    acc+=uLCol[i]*(att*s)*(alb*ndl+sp);
  }
  return acc; }
// The rose window. p in the unit disc. Returns colour (0 = lead) and alpha (0 = nothing there).
vec4 rose(vec2 p, float mask){
  float r=length(p); if(r>1.) return vec4(0.);
  float sec=atan(p.y,p.x)/6.2831853*12.; float k=mod(floor(sec)+12.,12.); float fa=fract(sec);
  vec3 col=vec3(0.); float al=1.; float pane=1.;
  if(r<.24){ col=glassPal(.5)*1.1; pane=ss(.24,.215,r); }
  else if(r<.5){ float ca=(k+.5)/12.*6.2831853; vec2 cc=vec2(cos(ca),sin(ca))*.37; float d=length(p-cc);
    pane=ss(.088,.072,d); col=glassPal(k*.618+.1); }
  else { float alive=mod(floor(mask/exp2(k)),2.);
    float edgeA=min(fa,1.-fa)*r*.5236; float tipR=.98-.10*pow(abs(fa-.5)*2.,2.);
    float inP=ss(.012,.03,edgeA)*ss(tipR,tipR-.02,r)*ss(.5,.53,r);
    vec3 v=voro(vec2(fa*1.6+k*3.1, r*7.)+13.);
    col=glassPal(k*.381+v.x*.22); pane=inP*ss(.03,.09,v.y);
    if(alive<.5){ al=(1.-inP)*step(r,.985); pane=0.; }
    else al=step(r,tipR+.012); }
  return vec4(col*pane, al); }
`;

const VS_TRI = `#version 300 es
void main(){ gl_Position=vec4(vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2))*2.-1., 0., 1.); }`;

// The stone of the floor and the walls never changes, so it is worked out once for each picture size and kept in three
// small pictures: A = colour (square-rooted, to keep the darks) and shine; B = which way the surface leans, how tight the
// shine is, and how much a wall's inner edge catches the light; C = the window light lying on it (before the hue of the
// glass is turned) and what it is: 0 floor, .5 wall, up to 1 the wall beyond what a desk can see.
const FS_BAKE = `#version 300 es
${COMMON}
uniform vec4 uBell[4];
layout(location=0) out vec4 oA; layout(location=1) out vec4 oB; layout(location=2) out vec4 oC;
const vec2 DM=vec2(.37987,.92504);
void main(){
  vec2 wp=uView.xy+vec2(gl_FragCoord.x/uRes.x,1.-gl_FragCoord.y/uRes.y)*uView.zw;
  // the floor, everywhere (so its slope is defined right up to the walls)
  vec2 c=wp-vec2(800.,500.); float rc=length(c);
  vec2 q=mat2(.7071,.7071,-.7071,.7071)*wp/92.; vec2 id=floor(q), f=fract(q);
  float chk=mod(id.x+id.y,2.); float tr=hash(id);
  float edge=min(min(f.x,1.-f.x),min(f.y,1.-f.y));
  float grout=ss(0.,.03,edge);
  float mar=fbm(wp*.018+tr*13.);
  vec3 alb=mix(vec3(.085,.09,.105), vec3(.33,.31,.28), chk)*(.78+.44*tr);
  alb*=.8+.4*mar;
  float vein=ss(.035,0.,abs(fbm(wp*.011+tr*5.+3.)-.5));
  alb+=vein*mix(.10,.05,chk);
  alb*=mix(.35,1.,grout);
  float h=grout*.8+fbm(wp*.22)*.35+(f.x-.5)*(tr-.5)*.6;
  float wet=ss(.3,.7,fbm(wp*.006+11.));
  float spec=mix(.05,.2,wet)*grout, gloss=mix(28.,90.,wet);
  vec3 brass=vec3(.55,.39,.14);
  if(rc>88.&&rc<300.){
    float t=(rc-95.)/17.9; float fr=abs(fract(t)-.5); float ri=floor(t);
    float line=ss(.40,.46,fr)*step(95.,rc)*step(rc,292.);
    float ang=atan(c.y,c.x);
    float a4=fract(ang/6.2831853*4.+mod(ri,2.)*.5); line*=ss(.05,.08,abs(a4-.5));
    float da=abs(mod(ang+.7854,1.5708)-.7854);
    float rad=ss(2.8,1.4,da*rc)*step(mod(ri,2.),.5)*step(95.,rc)*step(rc,292.);
    float lab=max(line,rad);
    alb=mix(alb,brass,lab); spec=mix(spec,.85,lab); gloss=mix(gloss,60.,lab); h+=lab*.5;
  }
  for(int i=0;i<4;i++){ float d=length(wp-uBell[i].xy);
    float rg=clamp(ss(3.,1.2,abs(d-58.))+ss(2.2,.9,abs(d-47.)),0.,1.);
    alb=mix(alb,brass,rg); spec=mix(spec,.85,rg); h+=rg*.5;
    alb*=mix(1.,.62,ss(47.,44.,d)); }
  vec3 n=normalize(vec3(-dFdx(h)*uRes.x/uView.z, dFdy(h)*uRes.y/uView.w, .45));
  vec3 pool=vec3(0.); vec2 PM=vec2(-DM.y,DM.x);
  for(int k=0;k<5;k++){ vec2 d=wp-vec2(230.+float(k)*285.,50.); float al=dot(d,DM), ac=dot(d,PM);
    float wE = al<300.? 46. : 46.*sqrt(max(0.,1.-pow((al-300.)/70.,2.)));
    float m=ss(0.,16.,al-22.)*ss(0.,9.,wE-abs(ac))*step(al,370.);
    if(m>.001){ vec3 v=voro(vec2(al/36.,ac/27.)+float(k)*7.3);
      float lead=ss(.03,.11,v.y)*ss(1.2,3.6,abs(ac))*ss(.02,.06,abs(fract(al/82.)-.5));
      pool+=glassPal(v.x*7.13+float(k)*.37)*lead*m; } }
  vec2 rp=(wp-vec2(1320.,765.))/132.; if(dot(rp,rp)<1.){ pool+=rose(rp,4095.).rgb*1.25; }
  pool*=.7+.55*fbm(wp*.012+3.);
  float flag=0., bev=1.;
  // the walls
  float dl=50.-wp.x, dr=wp.x-1550., dt=50.-wp.y, db=wp.y-950.;
  float dOut=max(max(dl,dr),max(dt,db));
  if(dOut>0.){
    vec2 dirOut = dOut==dl? vec2(-1.,0.) : dOut==dr? vec2(1.,0.) : dOut==dt? vec2(0.,-1.) : vec2(0.,1.);
    float st=fbm(wp*.05); bev=ss(16.,0.,dOut);
    alb=vec3(.26,.24,.22)*(.6+.6*st)*mix(.2,1.,bev);
    n=normalize(vec3(-dirOut*1.6*bev, .3+.7*(1.-bev)));
    spec=.06; gloss=20.; pool=vec3(0.);
    if(dt>0.){ for(int k=0;k<5;k++){ float dx=(wp.x-230.-float(k)*285.)/26.;
      pool+=glassPal(float(k)*.23+.07)*exp(-dx*dx)*exp(-dt/15.); } }
    // past the edge of what a desk sees: the wall carries on as coursed stone under a little moonlight
    float far=max(max(-wp.x,wp.x-1600.),max(-wp.y,wp.y-1000.)); float k=ss(0.,70.,far);
    if(k>0.){ vec2 bq=vec2(wp.x/72.,wp.y/42.); bq.x+=mod(floor(bq.y),2.)*.5; vec2 bf=fract(bq);
      float be=min(min(bf.x,1.-bf.x)*72.,min(bf.y,1.-bf.y)*42.); float bt=hash(floor(bq)+3.1);
      alb=mix(alb, vec3(.30,.29,.28)*(.5+.6*bt)*(.6+.5*st)*mix(.35,1.,ss(0.,2.4,be)), k); }
    flag=.5+.5*k;
  }
  oA=vec4(sqrt(clamp(alb,0.,1.)), spec);
  oB=vec4(n.xy*.5+.5, gloss/128., bev);
  oC=vec4(pool*.5, flag);
}`;

const FS_FLOOR = `#version 300 es
${COMMON}
uniform sampler2D uMatA, uMatB, uMatC;
uniform float uRose, uPool; uniform vec4 uBell[4];
out vec4 o;
void main(){

function mkProg(vs, fs) {
  const p = gl.createProgram();
  for (const [t, s] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const sh = gl.createShader(t); gl.shaderSource(sh, s); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error('shader: ' + gl.getShaderInfoLog(sh));
    gl.attachShader(p, sh);
  }
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name.replace(/\[0\]$/, '')] = gl.getUniformLocation(p, info.name); }
  return { p, u };
}
function mkFbo(w, h, fl) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  if (fl) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  return { f, t, w, h };
