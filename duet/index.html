<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0A0E1A">
<title>DUET | Qualiacology</title>
<meta name="description" content="DUET is a browser bullet-dance: a wordless duel with one partner where grazing enemy fire is the only way to raise the meter that runs the whole game.">
<link rel="canonical" href="https://qualiacology.com/duet/">
<meta property="og:site_name" content="Qualiacology">
<meta property="og:type" content="website">
<meta property="og:title" content="DUET | Qualiacology">
<meta property="og:description" content="A duel with one partner. The meter that runs the whole game only fills while you fly close enough to be killed.">
<meta property="og:url" content="https://qualiacology.com/duet/">
<meta property="og:image" content="https://qualiacology.com/assets/games/duet-card-clean.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="DUET | Qualiacology">
<meta name="twitter:description" content="A duel with one partner. Fly close.">
<meta name="twitter:image" content="https://qualiacology.com/assets/games/duet-card-clean.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230A0E1A'/%3E%3Ccircle cx='44' cy='22' r='7' fill='%23FF5C8A'/%3E%3Ccircle cx='24' cy='42' r='6' fill='%235CFAFF'/%3E%3C/svg%3E">
<style>
  :root {
    --void:#0A0E1A; --ash:#1C2740; --core:#5CFAFF; --halo:#2BB8D6; --fire:#3FE0C8;
    --rose:#FF5C8A; --body:#FF7AA8; --gold:#FFC46B; --hud:#8FE9F2;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#05070d; overflow:hidden; }
  body { font-family:Georgia,'Palatino Linotype','Book Antiqua',serif; color:var(--hud);
    display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; width:1280px; height:720px; transform-origin:center center; }
  canvas { display:block; cursor:none; touch-action:none; background:var(--void);
    box-shadow:0 12px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(92,250,255,0.06); }

  .screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(ellipse at 50% 42%, rgba(20,26,46,0.82), rgba(5,7,13,0.96));
    opacity:0; pointer-events:none; visibility:hidden; transition:opacity .55s, visibility .55s; text-align:center; }
  .screen.on { opacity:1; pointer-events:auto; visibility:visible; }

  #scr-title h1 { font-size:118px; letter-spacing:0.42em; text-indent:0.42em; font-weight:400;
    color:var(--core); text-shadow:0 0 40px rgba(92,250,255,0.35); }
  .sub { font-size:19px; font-style:italic; letter-spacing:0.06em; color:rgba(143,233,242,0.72); margin-top:-6px; }
  .rose-mark { position:absolute; top:calc(50% - 150px); right:calc(50% - 260px); width:14px; height:14px; border-radius:50%;
    background:var(--rose); box-shadow:0 0 24px var(--rose); }
  .btn { font-family:inherit; font-size:18px; letter-spacing:0.22em; text-transform:uppercase;
    background:transparent; color:var(--core); border:1px solid rgba(92,250,255,0.5); padding:12px 44px; cursor:pointer;
    transition:transform .12s, background .2s, box-shadow .2s; }
  .btn:hover { transform:translateY(-2px); background:rgba(92,250,255,0.08); box-shadow:0 0 24px rgba(92,250,255,0.25); }
  .row { display:flex; gap:14px; margin-top:6px; }
  .best { font-size:14px; letter-spacing:0.14em; color:rgba(143,233,242,0.55); margin-top:4px; }
  .foot { position:absolute; bottom:26px; font-size:12px; letter-spacing:0.14em; color:rgba(143,233,242,0.42); }
  .big { font-size:34px; font-weight:400; letter-spacing:0.04em; color:var(--hud); max-width:760px; line-height:1.35; }
  .fine { font-size:13px; letter-spacing:0.12em; color:rgba(143,233,242,0.5); }
  #vic-title { color:var(--gold); text-shadow:0 0 30px rgba(255,196,107,0.3); }
  #vic-score, #cont-hint { font-variant-numeric:tabular-nums; }

  /* qualiacology hub shell */
  .home-link { position:fixed; right:14px; top:14px; z-index:500; color:rgba(143,233,242,.9); text-decoration:none;
    font:800 11px/1.2 system-ui,-apple-system,sans-serif; letter-spacing:.16em; text-transform:uppercase; padding:8px 12px;
    border-radius:999px; background:rgba(10,14,26,.62); border:1px solid rgba(92,250,255,.34); backdrop-filter:blur(8px); transition:opacity .3s ease; }
  .home-link:hover, .home-link:focus-visible { color:#fff; border-color:rgba(92,250,255,.75); outline:0; }
  body.playing .home-link { width:44px; height:44px; box-sizing:border-box; display:grid; place-items:center; padding:0; font-size:0; }
  body.playing .home-link::after { content:"Q."; font:800 11px/1.2 system-ui,-apple-system,sans-serif; letter-spacing:.1em; }
</style>
</head>
<body>
<a class="home-link" href="/">Qualiacology</a>
<div id="stage">
  <canvas id="game" width="1280" height="720"></canvas>

  <div id="scr-title" class="screen on">
    <div class="rose-mark"></div>
    <h1>DUET</h1>
    <div class="sub">A duel with one partner. Fly close.</div>
    <button id="btn-begin" class="btn">Begin</button>
    <div id="best" class="best"></div>
    <div class="foot">a qualiacology game · keyboard or mouse · graze the lace to keep the song alive · sound on</div>
  </div>

  <div id="scr-pause" class="screen">
    <div class="big">Paused</div>
    <div class="fine">Esc or P to resume</div>
  </div>

  <div id="scr-continue" class="screen">
    <div class="big">The song stopped. Again?</div>
    <div class="row">
      <button id="btn-again" class="btn">Again</button>
      <button id="btn-leave" class="btn">Leave</button>
    </div>
    <div id="cont-hint" class="fine">Clean clears only count from a full run.</div>
  </div>

  <div id="scr-victory" class="screen">
    <div id="vic-title" class="big">You stayed close enough. The song finished.</div>
    <div id="vic-score" class="best">Score  0</div>
    <div class="row">
      <button id="vic-again" class="btn">Again</button>
      <button id="vic-leave" class="btn">Leave</button>
    </div>
  </div>
</div>

<script>
  (function fit(){ var s=document.getElementById('stage');
    function r(){ var k=Math.min(window.innerWidth/1280, window.innerHeight/720); s.style.transform='scale('+k+')'; }
    window.addEventListener('resize', r); r();
  })();
</script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/input.js"></script>
<script src="js/entities.js"></script>
<script src="js/patterns.js"></script>
<script src="js/conductor.js"></script>
<script src="js/fx.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
<script>
  Game.boot();
  window.__shmup = Game;
  // restore best score if any
  try { var b = localStorage.getItem('duet_best'); if (b) document.getElementById('best').textContent = 'Best  ' + Number(b).toLocaleString(); } catch(e){}
  // Hub shell: collapse the home link to a compact, reachable Q during a run.
  setInterval(function(){ try { document.body.classList.toggle('playing', !!(window.__shmup && __shmup.getState().mode === 'run')); } catch(e){} }, 250);
</script>
</body>
</html>
