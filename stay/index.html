<style>
  /* Self-hosted, matching the rest of the site — no game here reaches out to a

  @font-face{

    src:url('/assets/fonts/archivo-black-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Fraunces';font-style:italic;font-weight:300 700;font-display:swap;
    src:url('/assets/fonts/fraunces-italic-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  :root{
    --ink:#0a0a12;
    --deep:#141026;
    --porch:#ffb545;
    --cream:#f6e7c8;
    --pink:#ff4f8b;
    --ice:#8fe8ff;
    --acid:#ffe14d;
    --orchid:#e8b6ff;
    --moss:#7bd389;

    --disp:'Archivo Black','Arial Black',Impact,sans-serif;
    --mono:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden;background:var(--ink);}
  body{
    font-family:var(--mono);
    color:var(--cream);

  #wrap{position:absolute;inset:0;}

  /* ---- atmosphere ---- */
  #vig{position:absolute;inset:0;pointer-events:none;z-index:5;opacity:.78;

  #grain{position:absolute;inset:-50%;pointer-events:none;z-index:6;opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    animation:grainmove 1.1s steps(3) infinite;}
  @keyframes grainmove{0%{transform:translate(0,0)}33%{transform:translate(-3%,2%)}66%{transform:translate(2%,-3%)}100%{transform:translate(0,0)}}

  /* ---- HUD ---- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:10;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0 18px;
    display:flex;align-items:flex-start;justify-content:space-between;opacity:0;transition:opacity .5s;}
  #hud.on{opacity:1}
  .hlabel{font-size:9px;letter-spacing:.22em;font-weight:500;color:rgba(246,231,200,.38);margin-bottom:3px}

  #end .rank{margin-top:16px;font-family:var(--disp);font-size:15px;letter-spacing:.14em;color:var(--porch)}

    background:rgba(255,181,69,.07);color:var(--porch);font-family:var(--mono);font-weight:700;

  @media (prefers-reduced-motion: reduce){
    #grain{animation:none}
    .begin,#hint.on,#lastcall.on{animation:none;opacity:.65}
  }

  /* Home pill. This game listens for pointerdown on the whole window, so the
     link has to stop the press reaching the game or clicking it would also
     start a hold. Handled in JS below; the pill just needs to sit on top and

  .home-link{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));
    z-index:2147483647;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;
    color:rgba(246,231,200,.9);text-decoration:none;font:500 10px/1.2 var(--mono);letter-spacing:.2em;
    text-transform:uppercase;border:1px solid rgba(246,231,200,.22);border-radius:2px;
    background:rgba(10,10,18,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:.34;transition:opacity .18s ease,border-color .18s ease;pointer-events:auto;}
  .home-link:hover,.home-link:focus-visible{opacity:1;border-color:var(--porch);outline:0}
  .home-link:focus-visible{box-shadow:0 0 0 2px rgba(255,181,69,.35)}
  @media (pointer:coarse){.home-link{opacity:.28}}
  @media (max-width:600px){
    .home-link{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:0}
    .home-link::after{content:'Q.';font:700 13px/1 var(--mono);letter-spacing:.02em;color:var(--cream)}
  }

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="grain"></div>

  <div id="hud">
    <div><div class="hlabel">TIME</div><div id="clock">9:00 PM</div></div>
    <div id="hright"><div class="hlabel">HELD</div><div id="score">0</div></div>
  </div>
  <div id="guests"></div>

  <div id="inter"><div class="ep" id="epline"></div></div>
  <div id="hint">HOLD</div>
  <div id="lastcall">LAST CALL &middot; NOBODY ELSE IS COMING</div>

  <a class="home-link" href="/" aria-label="Return to Qualiacology" title="Return to Qualiacology"><span aria-hidden="true">&#8592;</span> <span>Qualiacology</span></a>

  <div class="screen" id="title">
    <h1>STAY</h1>
    <div class="sub">Gravity never stops pulling.<br>It only gets quieter.</div>
    <div class="sig">ONE BUTTON &middot; NO TUTORIAL</div>
    <div class="best" id="besttxt"></div>
    <div class="begin">TOUCH AND HOLD TO BEGIN</div>
  </div>

  <div class="screen hidden" id="end">
    <div class="kicker">THE NIGHT ENDED AT</div>
    <h2 id="endtime">3:47 AM</h2>
    <div class="rank" id="endrank">CLOSING TIME</div>
    <div class="ledger" id="ledger"></div>
    <div class="ep" id="endep"></div>
    <button class="btn" id="again">STAY UP LATER</button>
  </div>
</div>
<script>
"use strict";
/* ============================================================
   STAY — orbital retention arcade
   Two ways to lose somebody: let them go, or hold them too tight.
   ============================================================ */

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: false });
const $ = id => document.getElementById(id);
const elClock = $('clock'), elScore = $('score'), elGuests = $('guests');
const elHud = $('hud'), elHint = $('hint'), elInter = $('inter'), elEp = $('epline');
const elLast = $('lastcall'), elVig = $('vig');
const scTitle = $('title'), scEnd = $('end');

let W = 0, H = 0, CX = 0, CY = 0, DPR = 1, R_OUT = 200, R_ROOM = 140;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  CX = W / 2; CY = H / 2 + Math.min(14, H * 0.02);
  R_OUT = Math.min(W * 0.47, H * 0.40);
  R_ROOM = R_OUT * 0.60;
  recomputeK();
  ctx.fillStyle = '#0a0a12'; ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 220));

/* ---------------- physics constants ---------------- */
const MASS_MAX = 3.8;
const MASS_RISE = 3.2;      // per second toward max while holding
const MASS_FALL = 5.5;      // opening your hand is instant. closing it is a decision.
const MIN_PER_SEC = 2.25;   // in-game minutes per real second
const NIGHT_END = 540;      // 9:00 PM + 540min = 6:00 AM
const LAST_CALL = 450;      // 4:30 AM — nobody else is coming
let K = 1;                  // G*M0, recomputed on resize
let DRIFT = 5;              // the night always pulls outward. doing nothing is a choice.
let EPS = 26, EPS2 = 676;   // you are not a point. you are a room.

function recomputeK() {
  const vesc = R_OUT * 0.86;
  K = 0.5 * vesc * vesc * R_OUT;
  DRIFT = R_OUT * 0.030;
  EPS = R_OUT * 0.15; EPS2 = EPS * EPS;
  R_DOOR = R_OUT * 1.06; E_DOOR = doorEnergy(1);
}
// softened potential — no singularity, no numerical miracles at the centre
function phi(r2) { return -K / Math.sqrt(r2 + EPS2); }
let R_DOOR = 200, E_DOOR = 0;
// total specific energy, including the outward pull of the night
function energyOf(b, r, mass) { return 0.5 * (b.vx * b.vx + b.vy * b.vy) + mass * phi(r * r) - DRIFT * r; }
function doorEnergy(mass) { return mass * phi(R_DOOR * R_DOOR) - DRIFT * R_DOOR; }

/* ---------------- guests ---------------- */
const TYPES = {
  regular: { name: 'REGULAR', col: '#f6e7c8', rgb: '246,231,200', value: 1, rad: 9, frag: 1.00, spd: [1.02, 1.13], weight: 30, notes: [220, 261.63, 293.66] },
  popinjay: { name: 'POPINJAY', col: '#ff4f8b', rgb: '255,79,139', value: 3, rad: 7, frag: 0.85, spd: [1.30, 1.52], weight: 20, notes: [329.63, 392.00, 440.00] },
  milksop: { name: 'MILKSOP', col: '#8fe8ff', rgb: '143,232,255', value: 2, rad: 11, frag: 1.85, spd: [1.00, 1.09], weight: 15, notes: [523.25, 587.33] },
  ninnyhammer: { name: 'NINNYHAMMER', col: '#ffe14d', rgb: '255,225,77', value: 2, rad: 10, frag: 1.00, spd: [1.01, 1.09], weight: 15, notes: [110.00, 130.81], dives: true },
  traggot: { name: 'TRAGGOT', col: '#7bd389', rgb: '123,211,137', value: 0, rad: 10, frag: 1.30, spd: [1.06, 1.18], weight: 9, notes: [233.08], repels: true },
  spiggot: { name: 'SPIGGOT', col: '#e8b6ff', rgb: '232,182,255', value: 7, rad: 8, frag: 1.15, spd: [1.18, 1.36], weight: 5, notes: [659.25], jitters: true },
};
const TYPE_KEYS = Object.keys(TYPES);

function pickType(mins) {
  // early night: friendly. late night: the difficult ones.
  const late = Math.min(1, mins / 420);
  const bag = [];
  for (const k of TYPE_KEYS) {
    const t = TYPES[k];
    let w = t.weight;
    if (k === 'regular') w *= (1 - late * 0.62);
    if (k === 'popinjay') w *= (0.55 + late * 1.05);
    if (k === 'spiggot') w *= (0.25 + late * 1.9);
    if (k === 'traggot') w *= (0.30 + late * 1.5);
    if (k === 'milksop') w *= (0.75 + late * 0.55);
    bag.push([k, Math.max(0.4, w)]);
  }
  let tot = 0; for (const b of bag) tot += b[1];
  let r = Math.random() * tot;
  for (const b of bag) { r -= b[1]; if (r <= 0) return b[0]; }
  return 'regular';
}

/* ---------------- audio: the room is a chord ---------------- */
const Audio_ = {
  ac: null, master: null, drone: null, droneGain: null, ready: false, muted: false,
  init() {
    if (this.ac) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ac = new AC();
      const comp = this.ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 8; comp.attack.value = 0.004; comp.release.value = 0.18;
      this.master = this.ac.createGain();
      this.master.gain.value = 0.0;
      this.master.connect(comp); comp.connect(this.ac.destination);
      this.master.gain.linearRampToValueAtTime(0.55, this.ac.currentTime + 1.4);

      // low pull-drone, rises with how hard you're holding
      this.drone = this.ac.createOscillator(); this.drone.type = 'sine'; this.drone.frequency.value = 55;
      const d2 = this.ac.createOscillator(); d2.type = 'sine'; d2.frequency.value = 55.4;
      this.droneGain = this.ac.createGain(); this.droneGain.gain.value = 0.0;
      this.drone.connect(this.droneGain); d2.connect(this.droneGain); this.droneGain.connect(this.master);
      this.drone.start(); d2.start();
      this.ready = true;
    } catch (e) { this.ready = false; }
  },
  resume() { if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  setPull(v) {
    if (!this.ready) return;
    try { this.droneGain.gain.setTargetAtTime(0.05 + v * 0.16, this.ac.currentTime, 0.09); } catch (e) { }
  },
  // a sustained voice per guest — fades in while they're in the room
  voice(freq, type) {
    if (!this.ready) return null;
    try {
      const o = this.ac.createOscillator(), o2 = this.ac.createOscillator();
      const g = this.ac.createGain(), f = this.ac.createBiquadFilter();
      o.type = type || 'triangle'; o2.type = 'sine';
      o.frequency.value = freq; o2.frequency.value = freq * 1.004;
      f.type = 'lowpass'; f.frequency.value = Math.max(700, freq * 5); f.Q.value = 0.7;
      g.gain.value = 0.0001;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(this.master);
      o.start(); o2.start();
      return { o, o2, g, f };
    } catch (e) { return null; }
  },
  setVoice(v, amt) {
    if (!v || !this.ready) return;
    try { v.g.gain.setTargetAtTime(Math.max(0.0001, amt * 0.075), this.ac.currentTime, 0.14); } catch (e) { }
  },
  killVoice(v, glide) {
    if (!v || !this.ready) return;
    const t = this.ac.currentTime;
    try {
      v.g.gain.cancelScheduledValues(t);
      v.g.gain.setValueAtTime(Math.max(0.0001, v.g.gain.value), t);
      v.g.gain.exponentialRampToValueAtTime(0.0001, t + (glide ? 0.85 : 0.16));
      if (glide) {
        v.o.frequency.setValueAtTime(v.o.frequency.value, t);
        v.o.frequency.exponentialRampToValueAtTime(Math.max(30, v.o.frequency.value * 0.42), t + 0.85);
        v.o2.frequency.setValueAtTime(v.o2.frequency.value, t);
        v.o2.frequency.exponentialRampToValueAtTime(Math.max(30, v.o2.frequency.value * 0.42), t + 0.85);
      }
      v.o.stop(t + (glide ? 0.95 : 0.24)); v.o2.stop(t + (glide ? 0.95 : 0.24));
    } catch (e) { }
  },
  blip(freq, dur, type, vol) {
    if (!this.ready) return;
    try {
      const t = this.ac.currentTime;
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + (dur || 0.2) + 0.03);
    } catch (e) { }
  },
  crunch() {
    if (!this.ready) return;
    try {
      const t = this.ac.currentTime, len = Math.floor(this.ac.sampleRate * 0.34);
      const buf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      const s = this.ac.createBufferSource(); s.buffer = buf;
      const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 420; f.Q.value = 0.9;
      const g = this.ac.createGain(); g.gain.value = 0.30;
      s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
      this.blip(92, 0.30, 'sawtooth', 0.16);
    } catch (e) { }
  },
  chime() { this.blip(880, 0.16, 'triangle', 0.09); setTimeout(() => this.blip(1318.5, 0.20, 'sine', 0.06), 55); },
  bell(f) { this.blip(f, 0.9, 'sine', 0.10); }
};
/* ---------------- state ---------------- */
const G = {
  mode: 'title',       // title | play | end
  bodies: [], parts: [], labels: [],
  mass: 1, holding: false, everHeld: false,
  mins: 0, score: 0, emptyT: 0, nextIn: 0.7,
  lost: 0, broken: 0, kept: 0,
  bestStay: null, lastHour: 21,
  shake: 0, flash: 0, t: 0, hintT: 0, alone: 0, endLock: 0,
  interT: 0, best: 0
};

const EPITAPHS = [
  'The most common fate of three bodies is two, and one gone forever.',
  'It does not eat you. If you get close enough, it pulls you apart.',
  'There is no closed form past three. You can only live it and find out.',
  'Every stable thing is stable because everything unstable already left.',
  'Nothing here is blocked by distance. It only gets quieter.',
  'You can be the reason someone stays and the reason they break.',
  'An orbit is just a fall that keeps missing.',
  'Whatever is still here at sunrise was never captured. It chose the arc.',
  'You did not throw anyone. You only ever adjusted how hard you wanted them.',
  'The room is a chord. Every voice in it is on loan.'
];

const RANKS = [
  [60, 'MILKSOP'], [120, 'NINNYHAMMER'], [180, 'POPINJAY'], [240, 'HOUSE GUEST'],
  [300, 'LAST CALL'], [360, 'CLOSING TIME'], [420, 'LOAD-BEARING'],
  [480, 'THE ONE WHO STAYS'], [539, 'STILL HERE'], [9999, 'SUNRISE']
];
function rankFor(m) { for (const r of RANKS) if (m < r[0]) return r[1]; return 'SUNRISE'; }

function fmtClock(mins) {
  let tot = (21 * 60 + Math.floor(mins)) % 1440;
  let h = Math.floor(tot / 60), m = tot % 60;
  const ap = h >= 12 ? 'PM' : 'AM';
  let hh = h % 12; if (hh === 0) hh = 12;
  return hh + ':' + String(m).padStart(2, '0') + ' ' + ap;
}
function fmtDur(mins) {
  const h = Math.floor(mins / 60), m = Math.floor(mins % 60);
  return h > 0 ? (h + 'h ' + m + 'm') : (m + 'm');
}

/* ---------------- spawning ---------------- */
function arrivalInterval(mins) {
  if (mins >= LAST_CALL) return Infinity;
  const p = Math.min(1, mins / LAST_CALL);
  return 2.35 + p * p * 7.2;             // 2.0s at dusk -> ~9.4s before last call
}

function spawn() {
  const key = pickType(G.mins);
  const T = TYPES[key];
  const ang = Math.random() * Math.PI * 2;
  const R = R_OUT * 1.05;
  const x = CX + Math.cos(ang) * R, y = CY + Math.sin(ang) * R;

  const vesc = Math.sqrt(-2 * phi(R * R));
  const f = T.spd[0] + Math.random() * (T.spd[1] - T.spd[0]);
  const speed = vesc * f;

  // aim at a point offset from centre — the impact parameter decides the arc
  let bmax = T.dives ? R_OUT * 0.10 : R_OUT * (0.30 + Math.random() * 0.36);
  const side = Math.random() < 0.5 ? -1 : 1;
  const b = side * bmax * (T.dives ? Math.random() : 1);
  const tx = CX + Math.cos(ang + Math.PI / 2) * b;
  const ty = CY + Math.sin(ang + Math.PI / 2) * b;
  let dx = tx - x, dy = ty - y; const dl = Math.hypot(dx, dy) || 1;

  G.bodies.push({
    key, T, x, y, vx: dx / dl * speed, vy: dy / dl * speed,
    r: T.rad, stress: 0, held: 0, life: 0, age: 0,
    warmth: 0, jitT: 0, wasIn: false, everIn: false, bound: false, tether: false, gone: false,
    trail: [],
    voice: Audio_.voice(T.notes[(Math.random() * T.notes.length) | 0], key === 'traggot' ? 'sawtooth' : 'triangle')
  });
  Audio_.blip(T.notes[0] * 2, 0.09, 'sine', 0.05);
}

/* ---------------- floating labels ---------------- */
function label(x, y, text, col) {
  x = Math.max(52, Math.min(W - 52, x));
  y = Math.max(120, Math.min(H - 70, y));
  G.labels.push({ x, y, text, col, life: 1.15, max: 1.15 });
  if (G.labels.length > 8) G.labels.shift();
}

/* ---------------- particles ---------------- */
function burst(x, y, rgb, n, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = spd * (0.25 + Math.random() * 0.95);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, rgb, life: life || 0.7, max: life || 0.7, r: 1 + Math.random() * 2.2 });
  }
}

/* ---------------- one guest leaves ---------------- */
function depart(b, how) {
  b.gone = true;
  if (how === 'broke') {
    G.broken++;
    label(b.x, b.y, 'TOO TIGHT', '#ff3b30');
    burst(b.x, b.y, b.T.rgb, 26, 190, 0.8);
    Audio_.crunch(); Audio_.killVoice(b.voice, false);
    G.shake = Math.max(G.shake, 13); G.flash = 0.55;
  } else {
    G.lost++;
    label(b.x, b.y, how === 'shooed' ? 'GOOD RIDDANCE' : 'GONE', how === 'shooed' ? '#7bd389' : 'rgba(246,231,200,.7)');
    burst(b.x, b.y, b.T.rgb, 9, 60, 1.1);
    Audio_.killVoice(b.voice, true);
  }
  if (b.held > 0 && (!G.bestStay || b.held > G.bestStay.held)) {
    G.bestStay = { name: b.T.name, held: b.held, col: b.T.col, how };
  }
}

/* ---------------- simulation ---------------- */
function step(dt) {
  G.t += dt;

  // your mass: rises fast when you hold, sheds slow. holding makes you heavy.
  if (G.holding) G.mass += (MASS_MAX - G.mass) * Math.min(1, MASS_RISE * dt);
  else G.mass = 1 + (G.mass - 1) * Math.exp(-MASS_FALL * dt);
  const pull = (G.mass - 1) / (MASS_MAX - 1);
  Audio_.setPull(pull);
  elVig.style.opacity = (0.78 + pull * 0.22).toFixed(3);

  // clock
  const before = G.mins;
  G.mins += MIN_PER_SEC * dt;
  const hourNow = 21 + Math.floor(G.mins / 60);
  if (Math.floor(G.mins / 60) !== Math.floor(before / 60) && G.mins > 45) {
    showEpitaph();
    Audio_.bell(146.83 * (1 + ((hourNow % 3) * 0.12)));
  }
  if (G.mins >= LAST_CALL) elLast.classList.add('on');

  // arrivals
  G.nextIn -= dt;
  if (G.nextIn <= 0 && G.mins < LAST_CALL && G.bodies.length < 11) {
    spawn();
    G.nextIn = arrivalInterval(G.mins) * (0.75 + Math.random() * 0.5);
  }

  const GM = K * G.mass;
  const sub = 4, sdt = dt / sub;

  for (let s = 0; s < sub; s++) {
    for (const b of G.bodies) {
      if (b.gone) continue;
      let dx = CX - b.x, dy = CY - b.y;
      let r2 = dx * dx + dy * dy; let r = Math.sqrt(r2) || 0.001;
      const soft = Math.pow(r2 + EPS2, 1.5);
      const a = GM * r / soft - DRIFT;   // the room pulls in; the night pulls out
      b.vx += (dx / r) * a * sdt;
      b.vy += (dy / r) * a * sdt;

      // traggots push everyone else away — the guest who clears a room
      for (const o of G.bodies) {
        if (o === b || o.gone || !o.T.repels) continue;
        let ox = b.x - o.x, oy = b.y - o.y;
        let od2 = ox * ox + oy * oy;
        if (od2 < 12100) {
          const od = Math.sqrt(od2) || 1;
          const rep = Math.min(2600, 260000 / Math.max(od2, 420));
          b.vx += (ox / od) * rep * sdt; b.vy += (oy / od) * rep * sdt;
        }
      }
      b.x += b.vx * sdt; b.y += b.vy * sdt;
    }
  }

  // per-guest bookkeeping
  let inRoom = 0, company = 0;
  for (const b of G.bodies) {
    if (b.gone) continue;
    b.age += dt;
    const dx = b.x - CX, dy = b.y - CY, r = Math.hypot(dx, dy) || 1;

    if (b.T.jitters) {
      b.jitT -= dt;
      if (b.jitT <= 0) { b.jitT = 0.9 + Math.random() * 0.9; const a = Math.random() * Math.PI * 2; const s = 26 + Math.random() * 26; b.vx += Math.cos(a) * s; b.vy += Math.sin(a) * s; }
    }

    // trail
    b.trail.push(b.x, b.y);
    if (b.trail.length > 84) b.trail.splice(0, 2);

    // tidal stress: too close, for too long, while you are too heavy
    const sr = (3 + 70 * (G.mass - 1) / (MASS_MAX - 1)) * b.T.frag + b.r * 0.6;
    if (r < sr) {
      b.stress += dt * 2.15 * (1 - r / sr) * (0.6 + 0.9 * ((G.mass - 1) / (MASS_MAX - 1)));
      if (Math.random() < dt * 22 * b.stress) burst(b.x, b.y, b.T.rgb, 1, 40, 0.4);
    } else b.stress = Math.max(0, b.stress - dt * 0.62);
    if (b.stress >= 1) { depart(b, 'broke'); continue; }

    // Two different things, and the whole game lives in the gap between them.
    // TETHERED: they are only here because you are pulling.
    // BOUND:    they would still be here if you opened your hand right now.
    const inside = r < R_OUT * 1.02;
    b.bound = inside && energyOf(b, r, 1) < E_DOOR;
    b.tether = inside && !b.bound && energyOf(b, r, G.mass) < doorEnergy(G.mass);

    // deep in the room, radial motion damps — left alone, an orbit settles
    if (r < R_ROOM && !G.holding && b.bound) {
      const ux = dx / r, uy = dy / r;
      const vr = b.vx * ux + b.vy * uy;
      const q = 1 - r / R_ROOM;
      const k = 0.85 * q * q * dt;
      b.vx -= vr * k * ux; b.vy -= vr * k * uy;
    }

    company++;   // anybody still inside the door counts as somebody being here
    if (b.bound) {
      inRoom++;
      b.held += MIN_PER_SEC * dt;
      b.warmth = Math.min(1, b.warmth + dt * 2.2);
      if (!b.everIn) { Audio_.chime(); G.kept++; b.everIn = true; label(b.x, b.y, 'STAYED', b.T.col); }
      b.wasIn = true;
    } else {
      b.warmth = Math.max(0, b.warmth - dt * 1.5);
      b.wasIn = false;
    }
    Audio_.setVoice(b.voice, b.warmth * (0.55 + 0.45 * Math.min(1, b.held / 40)));

    // the door
    if (r > R_DOOR) {
      depart(b, b.T.repels ? 'shooed' : 'gone');
      if (b.T.repels) { G.score += 240; burst(b.x, b.y, b.T.rgb, 14, 120, 0.6); Audio_.blip(196, 0.2, 'square', 0.1); }
      continue;
    }
  }

  // score: the room pays by the size of the room
  if (inRoom > 0) {
    let s = 0;
    for (const b of G.bodies) if (!b.gone && b.bound) s += b.T.value * (0.5 + Math.min(1.5, b.held / 30));
    G.score += s * inRoom * 8 * dt;
  }

  G.bodies = G.bodies.filter(b => !b.gone);

  // particles
  for (const p of G.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.965; p.vy *= 0.965; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const l of G.labels) { l.life -= dt; l.y -= dt * 16; }
  G.labels = G.labels.filter(l => l.life > 0);

  // decay
  G.shake *= Math.pow(0.0016, dt); G.flash = Math.max(0, G.flash - dt * 2.4);
  if (G.interT > 0) { G.interT -= dt; if (G.interT <= 0) elInter.style.opacity = '0'; }

  // the hint. shown once, to nobody who already knows.
  if (!G.everHeld) { G.hintT += dt; if (G.hintT > 1.6) { elHint.textContent = 'HOLD'; elHint.classList.add('on'); } }
  else if (G.emptyT > 1.3) { elHint.textContent = 'NOBODY IS HERE'; elHint.classList.add('on'); }
  else if (elHint.textContent === 'NOBODY IS HERE') elHint.classList.remove('on');

  // sunrise
  if (G.mins >= NIGHT_END) { endNight(true); return; }

  // an empty room ends the night
  if (company === 0) {
    G.emptyT += dt;
    const grace = G.mins >= LAST_CALL ? 3.0 : 5.0;
    G.alone = Math.min(1, G.emptyT / grace);
    if (G.emptyT > grace && G.t > 9) { endNight(false); return; }
  } else { G.emptyT = 0; G.alone = 0; }
}

function showEpitaph() {
  elEp.textContent = EPITAPHS[(Math.random() * EPITAPHS.length) | 0];
  elInter.style.opacity = '1'; G.interT = 3.4;
}
/* ---------------- render ---------------- */
let bgGrad = null, bgKey = '';
function ensureBG() {
  const k = W + 'x' + H;
  if (k === bgKey && bgGrad) return;
  bgKey = k;
  bgGrad = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.72);
  bgGrad.addColorStop(0, '#15112a');
  bgGrad.addColorStop(0.45, '#0d0b1b');
  bgGrad.addColorStop(1, '#08070f');
}

function draw() {
  ensureBG();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);

  const sh = G.shake;
  if (sh > 0.4) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

  const pull = (G.mass - 1) / (MASS_MAX - 1);

  // ---- the door (outer) ----
  ctx.save();
  ctx.setLineDash([3, 11]); ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(246,231,200,.13)';
  ctx.beginPath(); ctx.arc(CX, CY, R_OUT, 0, 6.2832); ctx.stroke();
  ctx.restore();

  // ---- the room ----
  ctx.save();
  const inRoomN = G.bodies.reduce((a, b) => a + (Math.hypot(b.x - CX, b.y - CY) < R_ROOM ? 1 : 0), 0);
  const warm = Math.min(0.30, 0.06 + inRoomN * 0.035);
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = 'rgba(255,181,69,' + warm.toFixed(3) + ')';
  ctx.beginPath(); ctx.arc(CX, CY, R_ROOM, 0, 6.2832); ctx.stroke();
  ctx.restore();

  // ---- trails ----
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const b of G.bodies) {
    const tr = b.trail; const n = tr.length / 2;
    if (n < 3) continue;
    for (let i = 1; i < n; i++) {
      const a = (i / n) * 0.30 * (0.35 + 0.65 * b.warmth);
      ctx.strokeStyle = 'rgba(' + b.T.rgb + ',' + a.toFixed(3) + ')';
      ctx.lineWidth = 0.6 + (i / n) * (b.r * 0.30);
      ctx.beginPath(); ctx.moveTo(tr[(i - 1) * 2], tr[(i - 1) * 2 + 1]); ctx.lineTo(tr[i * 2], tr[i * 2 + 1]); ctx.stroke();
    }
  }
  ctx.restore();

  // ---- particles ----
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of G.parts) {
    const a = Math.max(0, p.life / p.max);
    ctx.fillStyle = 'rgba(' + p.rgb + ',' + (a * 0.85).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a, 0, 6.2832); ctx.fill();
  }
  ctx.restore();

  // ---- you ----
  if (G.mode !== 'play') { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); return; }
  const coreR = 11 + pull * 7;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const gl = ctx.createRadialGradient(CX, CY, 0, CX, CY, 82 + pull * 60);
  gl.addColorStop(0, 'rgba(255,181,69,' + (0.44 + pull * 0.34).toFixed(3) + ')');
  gl.addColorStop(0.35, 'rgba(255,120,60,' + (0.12 + pull * 0.16).toFixed(3) + ')');
  gl.addColorStop(1, 'rgba(255,120,60,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(CX, CY, 82 + pull * 60, 0, 6.2832); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#fff3d8';
  ctx.beginPath(); ctx.arc(CX, CY, coreR, 0, 6.2832); ctx.fill();

  // tidal ring — everything inside this is being taken apart
  if (pull > 0.03) {
    const sr = (3 + 70 * pull) * 1.0 + 6;
    ctx.save();
    ctx.setLineDash([2, 7]); ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,59,48,' + (0.16 + pull * 0.42).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(CX, CY, sr, 0, 6.2832); ctx.stroke();
    ctx.restore();
  }

  // ---- guests ----
  for (const b of G.bodies) {
    const dx = b.x - CX, dy = b.y - CY, r = Math.hypot(dx, dy) || 1;
    const ux = dx / r, uy = dy / r;
    const st = b.stress;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g2 = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * (3.4 + b.warmth * 2.4));
    g2.addColorStop(0, 'rgba(' + b.T.rgb + ',' + (0.36 + b.warmth * 0.34).toFixed(3) + ')');
    g2.addColorStop(1, 'rgba(' + b.T.rgb + ',0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (3.4 + b.warmth * 2.4), 0, 6.2832); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(uy, ux));
    ctx.scale(1 + st * 0.85, Math.max(0.28, 1 - st * 0.5));   // tidal stretch: pulled apart, not eaten
    ctx.globalAlpha = 0.40 + 0.60 * b.warmth;
    ctx.fillStyle = st > 0.5 ? '#fff' : b.T.col;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    if (st > 0.3) {
      ctx.strokeStyle = 'rgba(10,10,18,.85)'; ctx.lineWidth = 1.3;
      for (let i = 0; i < 3; i++) {
        const a = (i / 3) * 6.2832 + b.age;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * b.r, Math.sin(a) * b.r);
        ctx.lineTo(Math.cos(a + 1.7) * b.r * 0.2, Math.sin(a + 1.7) * b.r * 0.2);
        ctx.stroke();
      }
    }
    ctx.restore();

    if (b.warmth > 0.15) {   // in the room
      ctx.strokeStyle = 'rgba(' + b.T.rgb + ',' + (b.warmth * 0.5).toFixed(3) + ')';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 4.5 + Math.sin(G.t * 2.4 + b.age) * 1.1, 0, 6.2832); ctx.stroke();
    }

    if (r > R_OUT * 0.90) {  // heading for the door
      const bl = 0.35 + 0.45 * Math.abs(Math.sin(G.t * 7));
      ctx.save();
      ctx.translate(CX + ux * (R_OUT * 1.06), CY + uy * (R_OUT * 1.06));
      ctx.rotate(Math.atan2(uy, ux));
      ctx.strokeStyle = 'rgba(' + b.T.rgb + ',' + bl.toFixed(2) + ')';
      ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-5, -6); ctx.lineTo(3, 0); ctx.lineTo(-5, 6); ctx.stroke();
      ctx.restore();
    }
  }

  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '700 10px ui-monospace, "JetBrains Mono", monospace';
  for (const l of G.labels) {
    const a = Math.min(1, l.life / l.max * 1.9);
    ctx.globalAlpha = a;
    ctx.fillStyle = l.col;
    ctx.fillText(l.text, l.x, l.y - 16);
  }
  ctx.restore();

  if (G.flash > 0) {
    ctx.fillStyle = 'rgba(255,59,48,' + (G.flash * 0.18).toFixed(3) + ')';
    ctx.fillRect(-40, -40, W + 80, H + 80);
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

/* ---------------- hud ---------------- */
let dotPool = [];
function drawHUD() {
  elClock.textContent = fmtClock(G.mins);
  elScore.textContent = Math.floor(G.score).toLocaleString();
  const n = G.bodies.length;
  while (dotPool.length < n) { const d = document.createElement('div'); d.className = 'gdot'; elGuests.appendChild(d); dotPool.push(d); }
  for (let i = 0; i < dotPool.length; i++) {
    const d = dotPool[i];
    if (i < n) {
      const b = G.bodies[i];
      d.style.display = 'block';
      d.style.background = b.T.col;
      d.style.opacity = String(0.22 + b.warmth * 0.78);
      d.style.boxShadow = b.warmth > 0.4 ? '0 0 8px ' + b.T.col : 'none';
    } else d.style.display = 'none';
  }
}

/* ---------------- screens ---------------- */
function start() {
  for (const b of G.bodies) Audio_.killVoice(b.voice, false);
  G.mode = 'play'; G.bodies = []; G.parts = []; G.labels = [];
  G.mass = 1; G.mins = 0; G.score = 0; G.emptyT = 0; G.nextIn = 0.7;
  G.lost = 0; G.broken = 0; G.kept = 0; G.bestStay = null; G.shake = 0; G.flash = 0;
  G.t = 0; G.hintT = 0; G.everHeld = false; G.interT = 0;
  dotPool.forEach(d => d.remove()); dotPool = [];
  scTitle.classList.add('hidden'); scEnd.classList.add('hidden');
  elHud.classList.add('on'); elLast.classList.remove('on');
  elInter.style.opacity = '0'; elHint.classList.remove('on');
}

function endNight(sunrise) {
  G.mode = 'end';
  for (const b of G.bodies) {
    if (b.held > 0 && (!G.bestStay || b.held > G.bestStay.held)) G.bestStay = { name: b.T.name, held: b.held, col: b.T.col, how: 'stayed' };
    Audio_.killVoice(b.voice, false);
  }
  Audio_.setPull(0);
  const stillHere = G.bodies.length;
  G.bodies = [];
  elHud.classList.remove('on'); elHint.classList.remove('on'); elLast.classList.remove('on');
  elInter.style.opacity = '0'; elVig.style.opacity = '0.78';

  $('endtime').textContent = sunrise ? 'SUNRISE' : fmtClock(G.mins);
  $('endrank').textContent = sunrise ? 'YOU HELD THE WHOLE NIGHT' : rankFor(G.mins);

  const rows = [
    ['HELD', Math.floor(G.score).toLocaleString()],
    ['MADE IT IN', String(G.kept)],
    ['LET GO', String(G.lost)],
    ['HELD TOO TIGHT', String(G.broken)],
  ];
  if (sunrise) rows.push(['STILL HERE AT DAWN', String(stillHere)]);
  let html = rows.map(r => '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');
  if (G.bestStay) {
    html += '<div class="row stack"><span class="k">LONGEST STAY</span><span class="v" style="color:' + G.bestStay.col + '">' +
      G.bestStay.name + ' &middot; ' + fmtDur(G.bestStay.held) + '</span></div>';
  }
  $('ledger').innerHTML = html;

  let ep;
  if (sunrise) ep = 'Whatever is still here at sunrise was never captured. It chose the arc.';
  else if (G.broken > G.lost) ep = 'You did not lose them to the dark. You closed your hand.';
  else if (G.lost > 6 && G.broken === 0) ep = 'You never broke anybody. You also never quite kept one.';
  else ep = EPITAPHS[(Math.random() * EPITAPHS.length) | 0];
  $('endep').textContent = ep;

  G.endLock = performance.now() + 900;
  scEnd.classList.remove('hidden');
  Audio_.blip(196, 1.1, 'sine', 0.09); setTimeout(() => Audio_.blip(146.83, 1.4, 'sine', 0.08), 220);

  if (G.score > G.best) { G.best = Math.floor(G.score); saveBest(G.best); }
  paintBest();
}

function paintBest() {
  $('besttxt').textContent = G.best > 0 ? ('BEST NIGHT — ' + G.best.toLocaleString()) : '';
}
// localStorage, not window.storage. The original used a sandbox-only API that
// does not exist in a browser, so the guard swallowed it and the best night was
// never actually kept. Still guarded: private mode and disabled storage throw.
function saveBest(v) {
  try { localStorage.setItem('stay:best', String(v)); } catch (e) { }
}
function loadBest() {
  try {
    const r = localStorage.getItem('stay:best');
    if (r) { G.best = parseInt(r, 10) || 0; paintBest(); }
  } catch (e) { }
}

/* ---------------- input: one button, everywhere ---------------- */
// The site's home pill lives inside the same window that listens for every
// pointerdown, so without this, clicking it would also begin a hold — and on
// the title screen it would start a night you are about to navigate away from.
// Keyboard is guarded too: Space and Enter activate a focused link natively.
function fromChrome(e) {
  const t = e && e.target;
  return !!(t && t.closest && t.closest('.home-link'));
}
function press(e) {
  if (fromChrome(e)) return;
  Audio_.init(); Audio_.resume();
  if (G.mode === 'title') { start(); G.holding = true; G.everHeld = true; return; }
  if (G.mode === 'end') {
    if (performance.now() > G.endLock) { start(); G.holding = true; G.everHeld = true; }
    return;
  }
  G.holding = true;
  if (!G.everHeld) { G.everHeld = true; elHint.classList.remove('on'); }
}
function release() { G.holding = false; }

window.addEventListener('pointerdown', press);
window.addEventListener('pointerup', release);
window.addEventListener('pointercancel', release);
window.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (fromChrome(e)) return;
  if (e.code === 'Space' || e.code === 'Enter') { if (!e.repeat) { e.preventDefault(); press(e); } }
});
window.addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });
window.addEventListener('blur', release);
document.addEventListener('visibilitychange', () => { if (document.hidden) release(); });

$('again').addEventListener('click', () => { if (G.mode === 'end' && performance.now() > G.endLock) start(); });

/* ---------------- loop ---------------- */
let last = 0;
function frame(ts) {
  const dt = Math.min(0.045, last ? (ts - last) / 1000 : 0.016);
  last = ts;
  if (G.mode === 'play') { step(dt); drawHUD(); }
  draw();
  requestAnimationFrame(frame);
}

resize(); recomputeK();
window.addEventListener('resize', recomputeK);
loadBest();
requestAnimationFrame(frame);

</script>
</body>
</html>
