<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172e34">
  <meta name="description" content="All 32 original Super Mario Bros. stages and Second Quest 1-1 rebuilt from photographic spaghetti, with connected routes, secret rooms, the final Princess rescue, the original-style opening screen, level selection, and alternating two-player play.">
  <title>Spaghetti Mario | Qualiacology</title>
  <link rel="stylesheet" href="style.css">
<link rel="canonical" href="https://qualiacology.com/pasta/games/spaghetti-mario/"><link rel="icon" href="/assets/favicon.svg"><meta property="og:title" content="Spaghetti Mario | Qualiacology"><meta property="og:type" content="website"><meta property="og:url" content="https://qualiacology.com/pasta/games/spaghetti-mario/"><meta property="og:image" content="https://qualiacology.com/assets/games/pasta-card-v20261028.jpg"><meta name="twitter:card" content="summary_large_image"></head>
<body>
  <main id="game" aria-label="Spaghetti Mario, complete eight-world campaign and Second Quest 1-1">
    <canvas id="canvas" tabindex="0" role="img" aria-label="Super Mario Bros. made from spaghetti. Choose one or two players, then a world. Arrows select and Enter starts. During play: arrows or A/D move, Space/Z jump or swim, Shift/X run, Up/Down climb a vine, Down enters a pipe, Escape pauses."></canvas>
    <div id="loading" class="sr-only" role="status">Loading photographic spaghetti.</div>
    <div id="menu" class="accessible-controls" aria-label="Game menu">
      <button id="one-player" hidden aria-label="1 player game">1 player game</button>
      <button id="two-player" hidden aria-label="2 player game">2 player game</button>
      <button id="world-1-1" hidden aria-label="Start World 1-1">World 1-1</button>
      <button id="world-1-2" hidden aria-label="Start World 1-2">World 1-2</button>
      <button id="world-1-3" hidden aria-label="Start World 1-3">World 1-3</button>
      <button id="world-1-4" hidden aria-label="Start World 1-4">World 1-4</button>
      <button id="world-2-1" hidden aria-label="Start World 2-1">World 2-1</button>
      <button id="world-2-2" hidden aria-label="Start World 2-2">World 2-2</button>
      <button id="world-2-3" hidden aria-label="Start World 2-3">World 2-3</button>
      <button id="world-2-4" hidden aria-label="Start World 2-4">World 2-4</button>
      <button id="world-3-1" hidden aria-label="Start World 3-1">World 3-1</button>
      <button id="world-3-2" hidden aria-label="Start World 3-2">World 3-2</button>

      <button id="world-4-1" hidden aria-label="Start World 4-1">World 4-1</button>
      <button id="world-4-2" hidden aria-label="Start World 4-2">World 4-2</button>
      <button id="world-4-3" hidden aria-label="Start World 4-3">World 4-3</button>
      <button id="world-4-4" hidden aria-label="Start World 4-4">World 4-4</button>
      <button id="world-5-1" hidden aria-label="Start World 5-1">World 5-1</button>
      <button id="world-5-2" hidden aria-label="Start World 5-2">World 5-2</button>
      <button id="world-5-3" hidden aria-label="Start World 5-3">World 5-3</button>
      <button id="world-5-4" hidden aria-label="Start World 5-4">World 5-4</button>
      <button id="world-6-1" hidden aria-label="Start World 6-1">World 6-1</button>

      <button id="next-player" hidden aria-label="Next player">Next player</button>
      <button id="new-quest" hidden aria-label="Start the second quest">New quest</button>
      <button id="return-warp" hidden aria-label="Return to warp zone">Return to warp zone</button>
    </div>
    <div id="toolbar" hidden>
      <button id="sound" aria-label="Turn sound off" title="Sound (M)"></button>
      <button id="pause" aria-label="Pause game" title="Pause (Escape)"></button>
      <button id="fullscreen" aria-label="Full screen" title="Full screen (F)"></button>
    </div>
    <div id="touch" hidden aria-label="Touch controls">
      <button data-key="left" aria-label="Move left"></button>
      <button data-key="right" aria-label="Move right"></button>
      <button id="touch-up" data-key="up" hidden aria-label="Climb up"></button>
      <button data-key="down" aria-label="Crouch, climb down, or enter pipe"></button>
      <button data-key="run" aria-label="Run or throw spaghetti"></button>
      <button id="touch-jump" data-key="jump" aria-label="Jump"></button>
    </div>
    <div class="sr-only" id="announcer" aria-live="polite"></div>

  <script type="module" src="render.js"></script>
