      const oy = P.y < e.y + 2 * R - 0.1 && P.y + PCFG.h > e.y + 0.3;
      if (ox && oy) {
        if (P.vy < 0 && P.prevY >= e.y + R * 1.05) stompEnemy(e);
        else hurtPlayer(e);
      }
    }
  }
}

function enemyTargets(e) {
  const pool = POOLS.s32, C = 32, R = ECFG.r;
  const c = Math.cos(e.roll), s = Math.sin(e.roll);
  for (let j = 0; j < e.n * C; j++) {
    if (e.kind[j] !== 0) continue;
    const x = e.rest[j * 3], y = e.rest[j * 3 + 1], z = e.rest[j * 3 + 2];
    const q = (e.s0 * C + j) * 3;
    pool.tgt[q] = e.x + x * c - y * s;
    pool.tgt[q + 1] = e.y + R + x * s + y * c;
    pool.tgt[q + 2] = z;
  }
}

// Let go of the shape: the strands drop and spread where they land.
function splatEnemy(e, pop) {
  const pool = POOLS.s32, C = 32;
  e.state = 'splat'; e.t = 0;
  for (let j = 0; j < e.n * C; j++) {
    const p = e.s0 * C + j, o = p * 4, q = p * 3;
    pool.tk[p] = 0;
    const dx = pool.pos[o] - e.x, dz = pool.pos[o + 2];
    const vx = dx * 55 + e.vx * 0.3, vy = pop ? 55 + Math.random() * 40 : -50 - Math.random() * 30, vz = dz * 45;
    pool.prev[q] = pool.pos[o] - vx * DT; pool.prev[q + 1] = pool.pos[o + 1] - vy * DT; pool.prev[q + 2] = pool.pos[o + 2] - vz * DT;
  }
  e.body.keep = false; e.body.fric = 0.75; e.body.wake(); e.body.setKick(true);
}

function stompEnemy(e) {
  const P = PLAYER;
  splatEnemy(e, false);
  P.vy = keyJump() ? PCFG.jumpV * 0.96 : PCFG.bounceV;
  P.jumping = keyJump();
  P.y = Math.max(P.y, e.y + ECFG.r * 1.4);
  P.sy = 1.12; P.sv = 0;
  SND.splat(e.x);
  GAME.hitstop = 0.045;
  CAM.shake = Math.max(CAM.shake, 0.3);
}

// ---- 60-items.js ----
// Loops (spinach spaghetti tied in a ring), bundles that burst, rods laid across gaps,
// and strands hanging from above that you push through.

const LOOPS = [];
const BRIDGES = [];
const HANGERS = [];

// ---- loops ----
function makeLoop(rng, x, y, z) {
  const pool = POOLS.s32, C = 32, s = pool.alloc(1);
  const pts = new Float32Array(C * 3), R = 1.3, ph = rng.range(0, TAU);
  for (let i = 0; i < C; i++) {
    const a = (i / C) * TAU + ph;
    const w = 1 + 0.06 * Math.sin(a * 3 + ph);
    pts[i * 3] = x + Math.cos(a) * R * w; pts[i * 3 + 1] = y + 0.1 + Math.sin(a * 2 + ph) * 0.03; pts[i * 3 + 2] = z + Math.sin(a) * R * w;
  }
  putStrand(pool, s, pts, C, 0.1, 2, rng() * 100, F_CLOSED);
  const L = { s, x, y, z, state: 'free', t: 0, phase: rng.range(0, TAU), tilt: rng.range(-0.12, 0.12), hidden: false };
  L.body = new Body(pool, s, 1, { sim: true, targets: true, iters: 3, grav: 1, damp: 0.99, fric: 0.6, bend: 0.3, owner: L, kick: true, hitMin: 40 });
  L.body.onHit = (b, s2, i, speed, px) => { if (i === 0) SND.pat(px, speed * 0.4); };
  LOOPS.push(L);
  return L;
}

function initLoops() {
  const rng = makeRng(5150);
  for (const spec of LEVEL.loops) {
    const x = spec.i * TILE + 1.5;
    let r = spec.r + 1;
    while (r < 13 && !solidAt(spec.i, r)) r++;
    const ch = tileCh(spec.i, r);
    const y = rowY(r) + TILE + (ch === '#' ? 0.04 : 0.06);
    makeLoop(rng, x, y, rng.range(-0.6, 0.6));
  }
  for (const b of LEVEL.blocks) {
    if (b.t !== 'R') continue;
    b.loops = [];
    for (let k = 0; k < 4; k++) {
      const L = makeLoop(rng, b.i * TILE + 1.5, rowY(b.r) + 1.2, 0);
      L.hidden = true; L.state = 'hidden';
      POOLS.s32.setCount(L.s, 0);
      L.body.measure();
      b.loops.push(L);
    }
  }
}

function loopCenter(L) {
  const pool = POOLS.s32, base = L.s * 32;
  let x = 0, y = 0, z = 0;
  for (let i = 0; i < 32; i++) { const o = (base + i) * 4; x += pool.pos[o]; y += pool.pos[o + 1]; z += pool.pos[o + 2]; }
  return [x / 32, y / 32, z / 32];
}

function setLoopPull(L, k) { const base = L.s * 32; for (let i = 0; i < 32; i++) POOLS.s32.tk[base + i] = k; }

function collectLoop(L) {
  const P = PLAYER;
  P.chain++; P.chainT = 1.2;
  SND.slurp(P.x, P.chain);
  if (P.rings.length >= MAX_RINGS) { // full: it is pulled in and gone
    L.state = 'gone';
    POOLS.s32.setCount(L.s, 0); L.body.sleep(); L.body.measure(); L.body.touch();
    return;
  }
  L.state = 'worn';
  L.phase = Math.random() * TAU; L.tilt = (Math.random() - 0.5) * 0.25;
  P.rings.push(L);
  L.body.keep = true; L.body.cgroup = PLAYER; L.body.wake();
}

function flingLoop(L, vx, vy, vz) {
  const pool = POOLS.s32, base = L.s * 32;
  setLoopPull(L, 0);
  for (let i = 0; i < 32; i++) {
    const o = (base + i) * 4, q = (base + i) * 3;
    pool.prev[q] = pool.pos[o] - vx * DT; pool.prev[q + 1] = pool.pos[o + 1] - vy * DT; pool.prev[q + 2] = pool.pos[o + 2] - vz * DT;
  }
  L.state = 'flung'; L.t = 0;
  L.body.keep = false; L.body.cgroup = null; L.body.wake();
}

function loopsStep(dt) {
  const P = PLAYER;
  const cx = P.x, cy = P.y + 1.9;
  for (const L of LOOPS) {
    if (L.state === 'flung') { L.t += dt; if (L.t > 0.9) L.state = 'free'; continue; }
    if (L.state !== 'free' || !P.alive || GAME.mode !== 'play') continue;
    const b = L.body;
    if (b.x1 < cx - 2.5 || b.x0 > cx + 2.5 || b.y1 < P.y - 0.5 || b.y0 > P.y + PCFG.h + 0.6) continue;
    const c = loopCenter(L);
    const dx = c[0] - cx, dy = c[1] - cy;
    if (Math.abs(dx) < 2.1 && Math.abs(dy) < 2.6 && Math.abs(c[2]) < 3) collectLoop(L);
  }
}

// ---- bundles ----
function bumpTile(i, r) {
  const blk = LEVEL.blocks.find((b) => b.i === i && b.r === r && !b.broken);
  if (!blk) { SND.bump((i + 0.5) * TILE); return; }
  breakBlock(blk);
}

function breakBlock(blk) {
  blk.broken = true;
  setTile(blk.i, blk.r, ' ');
  blk.box.on = false;
  const b = blk.rods, pool = b.pool;
  b.onHit = rodHit;
  b.setKick(true);
  b.wake();
  const rnd = Math.random;
  for (let s = b.s0; s < b.s0 + blk.nRods; s++) {
    const o0 = s * 2 * 4, o1 = o0 + 4, q0 = s * 2 * 3, q1 = q0 + 3;
    const mx = (pool.pos[o0] + pool.pos[o1]) * 0.5 - blk.cx, my = (pool.pos[o0 + 1] + pool.pos[o1 + 1]) * 0.5 - blk.cy;
    const vx = mx * 13 + (rnd() - 0.5) * 16, vy = 14 + rnd() * 38 + my * 9, vz = 6 + (rnd() - 0.4) * 22;
    const sx = (rnd() - 0.5) * 55, sy = (rnd() - 0.5) * 55;
    pool.prev[q0] = pool.pos[o0] - (vx + sx) * DT; pool.prev[q0 + 1] = pool.pos[o0 + 1] - (vy + sy) * DT; pool.prev[q0 + 2] = pool.pos[o0 + 2] - vz * DT;
    pool.prev[q1] = pool.pos[o1] - (vx - sx) * DT; pool.prev[q1 + 1] = pool.pos[o1 + 1] - (vy - sy) * DT; pool.prev[q1 + 2] = pool.pos[o1 + 2] - vz * DT;
  }
  // Dry spaghetti rarely breaks in two: a good share snap at once, some into three.
  const snaps = Math.round(blk.nRods * 0.3);
  for (let k = 0; k < snaps; k++) splitRod(b, b.s0 + Math.floor(rnd() * blk.nRods), true);
  // With nothing on them, the stilts tip over.
  if (blk.stilts) {
    const lean = rnd() < 0.5 ? -1 : 1;
    for (const sb of blk.stilts) {
      sb.onHit = rodHit; sb.setKick(true); sb.wake();
      const sp = sb.pool;
      for (let s = sb.s0; s < sb.s0 + sb.n; s++) {
        const top = sp.pos[s * 8 + 1] > sp.pos[s * 8 + 5] ? 0 : 1, q = (s * 2 + top) * 3;
        sp.prev[q] -= lean * (8 + rnd() * 6) * DT; sp.prev[q + 2] += (2 + rnd() * 4) * DT;
      }
    }
  }
  blk.tie.setKick(true);
  blk.tie.wake();
  const tp = blk.tie.pool, tb = blk.tie.s0 * 64;
  for (let i = 0; i < 64; i++) { const q = (tb + i) * 3; tp.prev[q + 1] -= 30 * DT; }
  if (blk.loops) {
    for (let k = 0; k < blk.loops.length; k++) {
      const L = blk.loops[k];
      POOLS.s32.setCount(L.s, 32);
      L.hidden = false;
      const ang = -0.9 + (k / 3) * 1.8;
      flingLoop(L, Math.sin(ang) * 30, 70 + rnd() * 25, 6 + rnd() * 8);
      L.t = 0.55;
    }
  }
  SND.snap(blk.cx, 5 + Math.floor(rnd() * 3), 1);
  CAM.shake = Math.max(CAM.shake, 0.45);
  GAME.hitstop = Math.max(GAME.hitstop, 0.03);
  for (const e of ENEMIES) {
    if (e.state === 'walk' && Math.abs(e.x - blk.cx) < TILE && Math.abs(e.y - (blk.cy + blk.hs)) < 0.8) { splatEnemy(e, true); SND.splat(e.x); }
  }
}

let rodTicks = 0;
function rodHit(b, s, i, speed, x) {
  SND.tick(x, speed);
  if (speed > 80 && b.spares && b.spares.length && Math.random() < 0.22) splitRod(b, s, false);
}

// Snap a two-point rod somewhere along its length; the far piece goes into a spare slot.
function splitRod(b, s, fresh) {
  const pool = b.pool;
  if (!b.spares || !b.spares.length || (pool.meta[s * 4 + 3] | 0) < 2) return;
  const o0 = s * 2 * 4, o1 = o0 + 4, q0 = s * 2 * 3, q1 = q0 + 3;
  const L = Math.hypot(pool.pos[o1] - pool.pos[o0], pool.pos[o1 + 1] - pool.pos[o0 + 1], pool.pos[o1 + 2] - pool.pos[o0 + 2]);
  if (L < 0.9) return;
  const t = 0.25 + Math.random() * 0.5;
  const s2 = b.spares.pop();
  const p0 = s2 * 2 * 4, p1 = p0 + 4, r0 = s2 * 2 * 3, r1 = r0 + 3;
  for (let a = 0; a < 3; a++) {
    const m = lerp(pool.pos[o0 + a], pool.pos[o1 + a], t), mp = lerp(pool.prev[q0 + a], pool.prev[q1 + a], t);
    pool.pos[p1 + a] = pool.pos[o1 + a]; pool.prev[r1 + a] = pool.prev[q1 + a];
    pool.pos[p0 + a] = m; pool.prev[r0 + a] = mp;
    pool.pos[o1 + a] = m; pool.prev[q1 + a] = mp;
  }
  pool.pos[p0 + 3] = pool.pos[p1 + 3] = pool.pos[o0 + 3];
  // the snap kicks the two pieces apart
  const kick = (fresh ? 25 : 35) * DT;
  pool.prev[q1 + 1] += kick; pool.prev[r0 + 1] += kick;
  pool.prev[q1] += (Math.random() - 0.5) * kick; pool.prev[r0] -= (Math.random() - 0.5) * kick;
  pool.seg[s] = L * t; pool.seg[s2] = L * (1 - t);
  pool.setMeta(s2, pool.meta[s * 4], Math.random() * 100, F_FLAT, 2);
  if (!fresh) SND.snap(pool.pos[o0], 1, 0.35);
}

// ---- rods across a gap ----
function bridgeSurface(br, x) {
  if (br.sag <= 0) return br.y;
  const half = (br.x1 - br.x0) / 2 + 2;
  const d = (x - br.loadX) / half;
  return br.y - br.sag * Math.max(0, 1 - d * d);
}

function initBridges() {
  const rng = makeRng(3131);
  for (const spec of LEVEL.bridges) {
    const pool = POOLS.s32, n = 7, C = 12;
    const s0 = pool.alloc(n * 3);
    const br = { spec, x0: spec.a * TILE, x1: (spec.b + 1) * TILE, y: 0.22, hold: spec.hold, intact: true, loaded: false, loadT: 0, sag: 0, loadX: 0, creakT: 0, s0, n, C, rest: [] };
    const pts = new Float32Array(C * 3);
    for (let k = 0; k < n; k++) {
      const z = -1.15 + (k / (n - 1)) * 2.3 + rng.range(-0.05, 0.05);
      const xa = br.x0 - rng.range(2.0, 3.2), xb = br.x1 + rng.range(2.0, 3.2);
      const y = 0.11 + (k % 2) * 0.02;
      for (let i = 0; i < C; i++) { const t = i / (C - 1); pts[i * 3] = lerp(xa, xb, t); pts[i * 3 + 1] = y + Math.sin(t * Math.PI) * 0.03; pts[i * 3 + 2] = z + (t - 0.5) * rng.range(-0.1, 0.1); }
      br.rest.push(pts.slice());
      putStrand(pool, s0 + k, pts, C, ROD_R, 1, rng() * 100, F_FLAT);
    }
    for (let k = n; k < 3 * n; k++) { putStrand(pool, s0 + k, pts, 2, ROD_R, 1, rng() * 100, F_FLAT); pool.setCount(s0 + k, 0); }
    br.body = new Body(pool, s0, 3 * n, { sim: true, grav: 1, iters: 4, bend: 0.9, bendLen: 1.0, fric: 0.3, rest: 0.2, damp: 0.998, owner: br });
    br.body.spares = [];
    for (let k = n; k < 3 * n; k++) br.body.spares.push(s0 + k);
    BRIDGES.push(br);
  }
}

function bridgesStep(dt) {
  for (const br of BRIDGES) {
    if (!br.intact) continue;
    if (br.loaded) br.loadT += dt; else br.loadT = Math.max(0, br.loadT - dt * 0.6);
    br.loaded = false;
    const sag = smoothstep(0, br.hold, br.loadT) * 0.75;
    if (Math.abs(sag - br.sag) > 0.002) {
      br.sag = sag;
      const pool = POOLS.s32, C = br.C;
      for (let k = 0; k < br.n; k++) {
        const rest = br.rest[k], base = (br.s0 + k) * 32;
        for (let i = 0; i < C; i++) {
          const o = (base + i) * 4;
          pool.pos[o + 1] = rest[i * 3 + 1] - (br.y - bridgeSurface(br, rest[i * 3])) * (0.9 + k * 0.03);
        }
      }
      br.body.touch();
    }
    if (br.loadT > 0.05) {
      br.creakT -= dt;
      if (br.creakT <= 0) { SND.creak((br.x0 + br.x1) / 2, br.loadT / br.hold); br.creakT = lerp(0.11, 0.025, br.loadT / br.hold) * (0.6 + Math.random() * 0.8); }
    }
    if (br.loadT >= br.hold) breakBridge(br);
  }
}

function breakBridge(br) {
  br.intact = false;
  const pool = POOLS.s32, b = br.body;
  for (let k = 0; k < br.n; k++) {
    const s = br.s0 + k;
    // break near the load, once or twice
    let c = pool.meta[s * 4 + 3] | 0;
    const breaks = Math.random() < 0.5 ? 2 : 1;
    let cur = s;
    for (let m = 0; m < breaks; m++) {
      const base = cur * 32;
      let best = 1, bd = 1e9;
      for (let i = 1; i < c - 1; i++) { const d = Math.abs(pool.pos[(base + i) * 4] - (br.loadX + (Math.random() - 0.5) * 4)); if (d < bd) { bd = d; best = i; } }
      if (!b.spares.length || best < 1 || best > c - 2) break;
      const s2 = b.spares.pop();
      const nb = s2 * 32;
      const cnt2 = c - best;
      for (let i = 0; i < cnt2; i++) {
        const src = base + best + i, dst = nb + i;
        for (let a = 0; a < 4; a++) pool.pos[dst * 4 + a] = pool.pos[src * 4 + a];
        for (let a = 0; a < 3; a++) pool.prev[dst * 3 + a] = pool.prev[src * 3 + a];
        pool.inv[dst] = 1; pool.tk[dst] = 0;
      }
      pool.setMeta(s2, 1, Math.random() * 100, F_FLAT, cnt2);
      pool.seg[s2] = pool.seg[cur];
      pool.setMeta(cur, 1, pool.meta[cur * 4 + 1], F_FLAT, best + 1);
      if (m === 0 && breaks === 2) { cur = s2; c = cnt2; }
    }
  }
  // everything drops, the halves turning about the supports
  for (let s = br.s0; s < br.s0 + br.n * 3; s++) {
    const c = pool.meta[s * 4 + 3] | 0;
    for (let i = 0; i < c; i++) {
      const o = (s * 32 + i) * 4, q = (s * 32 + i) * 3;
      const near = 1 - Math.min(1, Math.abs(pool.pos[o] - br.loadX) / 10);
      pool.prev[q + 1] = pool.pos[o + 1] + (10 + near * 40) * DT;
    }
  }
  b.wake();
  b.onHit = (bb, s, i, speed, x) => SND.tick(x, speed);
  SND.snap(br.loadX, 7, 1.1);
  CAM.shake = Math.max(CAM.shake, 0.4);
}

// ---- strands hanging from above ----
function initHangers() {
  const rng = makeRng(9090);
  for (const h of LEVEL.hangs) {
    const pool = POOLS.s64, C = 64, n = 14;
    const s0 = pool.alloc(n);
    let r = 12;
    while (r > 0 && solidAt(h.a, r)) r--;
    const floorY = rowY(r);
    const pts = new Float32Array(C * 3);
    for (let k = 0; k < n; k++) {
      const x = rng.range(h.a * TILE, (h.b + 1) * TILE), z = rng.range(-1.3, 1.3);
      const yEnd = floorY + rng.range(2.4, 5.2), L = 30, top = yEnd + L;
      const ph = rng.range(0, TAU), sw = rng.range(0.2, 0.5), curl = rng.range(0.5, 1.2) * rng.sign();
      for (let i = 0; i < C; i++) {
        const t = i / (C - 1);
        const c = Math.max(0, (t - 0.88) / 0.12);
        pts[i * 3] = x + Math.sin(t * 5 + ph) * sw * t + curl * c * c;
        pts[i * 3 + 1] = top - t * L + Math.abs(curl) * c * c * 0.6;
        pts[i * 3 + 2] = z + Math.cos(t * 4 + ph) * sw * 0.6 * t;
      }
      putStrand(pool, s0 + k, pts, C, 0.1, 0, rng() * 100, 0);
      pool.inv[(s0 + k) * C] = 0;
    }
    const b = new Body(pool, s0, n, { sim: true, kick: true, iters: 3, grav: 1, damp: 0.985, fric: 0.25, bend: 0.04 });
    b.tether = true;
    HANGERS.push(b);
  }
}

function itemsStep(dt) {
  loopsStep(dt);
  bridgesStep(dt);
}

// ---- 70-audio.js ----
// Sounds, all made here from noise and a few sine waves: dry spaghetti cracking (and the pieces
// ticking down), cooked spaghetti squelching, a slurp when a loop goes on. Quiet, and panned to where it happened.

const SFX = { ctx: null, master: null, white: null, brown: null, muted: false, last: {} };

function audioInit() {
  if (SFX.ctx) { if (SFX.ctx.state === 'suspended') SFX.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const ctx = new AC();
  SFX.ctx = ctx;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 10; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.2;
  const master = ctx.createGain();
  master.gain.value = SFX.muted ? 0 : 0.9;
  master.connect(comp); comp.connect(ctx.destination);
  SFX.master = master;
  const len = Math.floor(ctx.sampleRate * 2);
  const wb = ctx.createBuffer(1, len, ctx.sampleRate), w = wb.getChannelData(0);
  for (let i = 0; i < len; i++) w[i] = Math.random() * 2 - 1;
  const bb = ctx.createBuffer(1, len, ctx.sampleRate), b = bb.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; b[i] = last * 3.5; }
  SFX.white = wb; SFX.brown = bb;
  // the room: barely there
  const src = ctx.createBufferSource(); src.buffer = bb; src.loop = true;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
  const g = ctx.createGain(); g.gain.value = 0.018;
  src.connect(f); f.connect(g); g.connect(master); src.start();
}

function setMuted(m) { SFX.muted = m; if (SFX.master) SFX.master.gain.setTargetAtTime(m ? 0 : 0.9, SFX.ctx.currentTime, 0.02); }
function sfxPan(x) { return clamp((x - CAM.x) / 32, -0.85, 0.85); }
function sfxGap(key, ms) { const now = performance.now(); if (now - (SFX.last[key] || 0) < ms) return false; SFX.last[key] = now; return true; }

function burst(o) {
  const ctx = SFX.ctx;
  if (!ctx || SFX.muted) return;
  const t0 = ctx.currentTime + 0.005 + (o.t || 0);
  const src = ctx.createBufferSource();
  src.buffer = o.buf || SFX.white;
  src.playbackRate.value = o.rate || 1;
  const f = ctx.createBiquadFilter();
  f.type = o.type || 'bandpass'; f.Q.value = o.q ?? 1;
  f.frequency.setValueAtTime(o.f, t0);
  if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(o.gain, t0 + (o.att || 0.002));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  src.connect(f); f.connect(g);
  let out = g;
  if (o.pan !== undefined && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; g.connect(p); out = p; }
  if (o.am) { // a fast flutter, for wet sounds
    const lfo = ctx.createOscillator(), lg = ctx.createGain(), mg = ctx.createGain();
    lfo.frequency.value = o.am; lg.gain.value = 0.5; mg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(mg.gain); out.connect(mg); out = mg;
    lfo.start(t0); lfo.stop(t0 + o.dur + 0.05);
  }
  out.connect(SFX.master);
  src.start(t0, Math.random() * 1.6);
  src.stop(t0 + o.dur + 0.05);
}

function tone(o) {
  const ctx = SFX.ctx;
  if (!ctx || SFX.muted) return;
  const t0 = ctx.currentTime + 0.005 + (o.t || 0);
  const osc = ctx.createOscillator();
  osc.type = o.type || 'sine';
  osc.frequency.setValueAtTime(o.f, t0);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + o.dur);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(o.gain, t0 + (o.att || 0.005));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + o.dur);
  osc.connect(g);
  let out = g;
  if (o.pan !== undefined && ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = o.pan; g.connect(p); out = p; }
  out.connect(SFX.master);
  osc.start(t0); osc.stop(t0 + o.dur + 0.05);
}

const SND = {
  step(x, ch) {
    if (!sfxGap('step', 45)) return;
    const pan = sfxPan(x), r = Math.random();
    if (ch === '#') {
      burst({ f: 900 + r * 400, f2: 450, q: 1.3, dur: 0.055, gain: 0.022, pan });
      burst({ buf: SFX.brown, type: 'lowpass', f: 240, dur: 0.05, gain: 0.03, pan });
    } else {
      burst({ f: 3400 + r * 1800, q: 4, dur: 0.016, gain: 0.02, att: 0.0005, pan });
    }
  },
  jump(x) { burst({ f: 520, f2: 2100, q: 0.9, dur: 0.1, gain: 0.02, att: 0.012, pan: sfxPan(x) }); },
  land(x, v, ch) {
    const k = clamp(v / 160, 0.25, 1), pan = sfxPan(x);
    if (ch === '#') {
      burst({ f: 850, f2: 320, q: 1, dur: 0.09, gain: 0.05 * k, pan, am: 38 });
      burst({ buf: SFX.brown, type: 'lowpass', f: 170, dur: 0.12, gain: 0.1 * k, pan });
    } else {
      burst({ f: 2600, q: 3, dur: 0.03, gain: 0.04 * k, att: 0.0008, pan });
      burst({ buf: SFX.brown, type: 'lowpass', f: 220, dur: 0.08, gain: 0.06 * k, pan });
    }
  },
  // Dry spaghetti: a sharp crack and the ring of the rod, n times in quick succession.
  snap(x, n, loud) {
    const pan = sfxPan(x);
    let t = 0;
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      burst({ t, type: 'highpass', f: 1400 + r * 1600, q: 0.7, dur: 0.012 + r * 0.01, gain: 0.16 * loud, att: 0.0004, pan });
      burst({ t, f: 2100 + Math.random() * 3200, q: 8, dur: 0.04, gain: 0.05 * loud, att: 0.0005, pan });
      t += 0.003 + Math.random() * 0.028;
    }
  },
  tick(x, speed) {
    if (!sfxGap('tick', 14)) return;
    const k = clamp(speed / 220, 0.12, 1);
    burst({ f: 2800 + Math.random() * 4200, q: 5, dur: 0.012, gain: 0.05 * k, att: 0.0003, pan: sfxPan(x) });
  },
  pat(x, v) {
    if (!sfxGap('pat', 30)) return;
    const k = clamp(v / 120, 0.15, 1);
    burst({ f: 700, f2: 280, q: 1.1, dur: 0.05, gain: 0.03 * k, pan: sfxPan(x) });
  },
  slurp(x, chain) {
    const up = 1 + Math.min(chain - 1, 8) * 0.07, pan = sfxPan(x);
    burst({ f: 320 * up, f2: 1500 * up, q: 4, dur: 0.17, gain: 0.07, att: 0.02, pan, am: 34 });
    tone({ t: 0.15, f: 640 * up, f2: 900 * up, dur: 0.05, gain: 0.025, pan });
  },
  splat(x) {
    const pan = sfxPan(x);
    burst({ type: 'lowpass', f: 2400, f2: 260, q: 1.2, dur: 0.16, gain: 0.15, pan, am: 30 });
    tone({ f: 120, f2: 55, dur: 0.14, gain: 0.1, pan });
    burst({ t: 0.03, f: 1500, f2: 650, q: 2, dur: 0.07, gain: 0.04, pan });
  },
  unravel(x) {
    const pan = sfxPan(x);
    burst({ f: 2600, f2: 420, q: 2.4, dur: 0.3, gain: 0.07, pan, am: 22 });
    for (let i = 0; i < 4; i++) burst({ t: 0.08 + i * 0.07 + Math.random() * 0.03, f: 700, f2: 300, q: 1, dur: 0.05, gain: 0.025, pan });
  },
  creak(x, k) {
    burst({ f: 700 + Math.random() * 900, q: 9, dur: 0.02, gain: 0.02 + 0.05 * k, att: 0.0006, pan: sfxPan(x) });
  },
  bump(x) {
    const pan = sfxPan(x);
    burst({ buf: SFX.brown, type: 'lowpass', f: 380, dur: 0.07, gain: 0.08, pan });
    burst({ f: 1300, q: 2, dur: 0.03, gain: 0.03, pan });
  },
  die(x, why) {
    const pan = sfxPan(x);
    burst({ f: 2200, f2: 300, q: 2, dur: 0.5, gain: 0.06, pan, am: 18 });
    tone({ type: 'triangle', f: 220, f2: 70, dur: 0.7, gain: 0.035, pan });
    for (let i = 0; i < 6; i++) burst({ t: 0.2 + i * 0.09 + Math.random() * 0.04, f: 650, f2: 260, q: 1, dur: 0.05, gain: 0.025, pan });
  },
  win(x) {
    const pan = sfxPan(x);
    for (let i = 0; i < 9; i++) burst({ t: i * 0.11 + Math.random() * 0.05, f: 760 - i * 30, f2: 300, q: 1, dur: 0.06, gain: 0.03, pan });
    tone({ t: 0.4, f: 196, dur: 3.2, gain: 0.03, att: 0.6 });
    tone({ t: 0.7, f: 294, dur: 3.0, gain: 0.022, att: 0.7 });
    tone({ t: 1.0, f: 392, dur: 2.6, gain: 0.014, att: 0.8 });
  },
};

// ---- 80-camera.js ----
// A long lens close to the table, a little above it, following the twirl. Out of focus before
// you start and when paused; it pulls focus when you play.

const CAM = {
  x: 30, y: 9.5, z: 0, fov: (qnum('fov', 27) * Math.PI) / 180, elev: qnum('elev', 0.3), baseElev: qnum('elev', 0.3), dist: 60, baseDist: qnum('dist', 60), dy: qnum('dy', 0), dx: qnum('dx', 0),
  look: 0, shake: 0, shakeX: 0, shakeY: 0,
  defocus: 1, defocusTarget: 1, fade: 1, fadeTarget: 1, exposure: 1,
};
const CAM_BASE_Y = 9.6;

function camHalfWidth() { return CAM.baseDist * Math.tan(CAM.fov / 2) * (REN.cw / REN.ch); }

function camUpdate(dt, snap) {
  const P = PLAYER;
  CAM.look = damp(CAM.look, clamp(P.vx * 0.2, -5, 5), 1.8, dt);
  const hw = camHalfWidth();
  let tx = clamp(P.x + CAM.look, hw, LEVEL_X1 - hw) + CAM.dx;
  let ty = CAM_BASE_Y + Math.max(0, P.y - 7) * 0.8 + CAM.dy;
  let dist = CAM.baseDist, elev = CAM.baseElev;
  if (GAME.mode === 'win') {
    const k = smoothstep(0.4, 5, GAME.winT);
    tx = LEVEL.nest.cx; ty = lerp(CAM_BASE_Y - 3, 1.5, k); dist = lerp(60, 30, k); elev = lerp(CAM.baseElev, 0.85, k);
  }
  CAM.elev = snap ? elev : damp(CAM.elev, elev, 1.2, dt);
  if (GAME.mode === 'dead' && P.y < 0) ty = CAM.y;
  if (snap) { CAM.x = tx; CAM.y = ty; CAM.dist = dist; }
  else {
    CAM.x = damp(CAM.x, tx, 6.5, dt);
    CAM.y = damp(CAM.y, ty, 2.6, dt);
    CAM.dist = damp(CAM.dist, dist, 0.8, dt);
  }
  CAM.shake = Math.max(0, CAM.shake - dt * 2.8);
  const s = CAM.shake * CAM.shake * 0.22;
  CAM.shakeX = (Math.random() - 0.5) * s;
  CAM.shakeY = (Math.random() - 0.5) * s;
  CAM.defocus = snap ? CAM.defocusTarget : damp(CAM.defocus, CAM.defocusTarget, 3.2, dt);
  CAM.fade = snap ? CAM.fadeTarget : damp(CAM.fade, CAM.fadeTarget, 3.5, dt);
}

// ---- 90-main.js ----
// Boot, input, the fixed-step loop, and what happens when you fall, get caught, or reach the nest.

const GAME = { mode: 'boot', t: 0, hitstop: 0, deadT: 0, winT: 0, checkpoint: null, gridStart: null };
const INPUT = { keys: new Set() };
const JUMP_CODES = new Set(['Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK']);
const veil = document.getElementById('veil');
const TIMESCALE = qnum('speed', 1);

function begin() {
  audioInit();
  veil.classList.add('gone');
  document.body.classList.add('play');
  CAM.defocusTarget = 0;
  if (GAME.mode === 'title' || GAME.mode === 'paused') GAME.mode = GAME.resume || 'play';
}
function pause() {
  if (GAME.mode !== 'play') return;
  GAME.resume = 'play';
  GAME.mode = 'paused';
  CAM.defocusTarget = 1;
  veil.classList.remove('gone');
  document.body.classList.remove('play');
  INPUT.keys.clear();
}

window.addEventListener('keydown', (e) => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (GAME.mode === 'boot') return;
  if (GAME.mode === 'title' || GAME.mode === 'paused') { if (e.code !== 'Escape') begin(); return; }
  if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
  INPUT.keys.add(e.code);
  if (JUMP_CODES.has(e.code)) PLAYER.jumpBuf = PCFG.buffer;
  if (e.code === 'KeyM') setMuted(!SFX.muted);
  if (e.code === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(() => {}); }
  if (e.code === 'Escape') pause();
});
window.addEventListener('keyup', (e) => INPUT.keys.delete(e.code));
window.addEventListener('blur', () => { INPUT.keys.clear(); pause(); });
veil.addEventListener('pointerdown', () => { if (GAME.mode === 'title' || GAME.mode === 'paused') begin(); });
window.addEventListener('resize', () => resizeRender(false));

function startPoint() {
  const c = GAME.checkpoint || LEVEL.start;
  return [c.i * TILE + 1.5, 0];
}

function resetWorld() {
  for (const P of POOL_LIST) P.restore();
  for (const b of BODIES) {
    b.awake = false; b.calm = 0;
    b.kick = b.init.kick; b.keep = b.init.keep; b.onHit = b.init.onHit; b.cgroup = b.init.cgroup; b.fric = b.init.fric;
    if (b.init.spares) b.spares = b.init.spares.slice();
    b.measure();
  }
  AWAKE.clear();
  for (let r = 0; r < LH; r++) LEVEL.grid[r] = GAME.gridStart[r].slice();
  for (const bx of WORLD.boxes) bx.on = true;
  for (const blk of LEVEL.blocks) blk.broken = false;
  for (const L of LOOPS) { L.state = L.hidden0 ? 'hidden' : 'free'; L.hidden = L.hidden0; L.t = 0; }
  for (const br of BRIDGES) { br.intact = true; br.loadT = 0; br.sag = 0; br.loaded = false; }
  for (const e of ENEMIES) placeEnemy(e);
  for (const b of BODIES) if (b.kick && !b.listed) { KICKABLE.push(b); b.listed = true; }
  const [x, y] = startPoint();
  placePlayer(x, y);
  PLAYER.body.fric = 0.45;
}

function gameStep(dt) {
  if (GAME.hitstop > 0) { GAME.hitstop -= dt; return; }
  GAME.t += dt;
  COLLIDERS.length = 0;
  playerStep(dt);
  enemiesStep(dt);
  itemsStep(dt);
  simulate(dt);
  for (const c of LEVEL.checkpoints) if (PLAYER.alive && PLAYER.x > c.i * TILE && GAME.checkpoint !== c) GAME.checkpoint = c;
  const N = LEVEL.nest;
  if (GAME.mode === 'play' && PLAYER.alive && Math.abs(PLAYER.x - N.cx) < N.R - N.r && PLAYER.y < 3) win();
  if (GAME.mode === 'dead') {
    GAME.deadT += dt;
    if (GAME.deadT > 0.5) CAM.defocusTarget = 0.45;
    if (GAME.deadT > 1.5) CAM.fadeTarget = 0;
    if (GAME.deadT > 2.1) { resetWorld(); GAME.mode = 'play'; CAM.fadeTarget = 1; CAM.defocusTarget = 0; camUpdate(0, true); CAM.fade = 0; }
  }
  if (GAME.mode === 'win') {
    GAME.winT += dt;
    winStep();
    if (GAME.winT > 7.5) CAM.fadeTarget = 0;
    if (GAME.winT > 8.6) { GAME.checkpoint = null; resetWorld(); GAME.mode = 'play'; CAM.fadeTarget = 1; CAM.defocusTarget = 0; camUpdate(0, true); CAM.fade = 0; }
  }
}

// In the nest the twirl lets go slowly: its shape fades over a couple of seconds and it slumps in.
function win() {
  const P = PLAYER;
  GAME.mode = 'win';
  GAME.winT = 0;
  P.alive = false;
  P.vx *= 0.3;
  P.body.fric = 0.7;
  SND.win(P.x);
}
function winStep() {
  const P = PLAYER, pool = POOLS.s64, C = TWIRL.C, base = P.body.s0 * C;
  const k = 0.24 * (1 - smoothstep(0.2, 2.6, GAME.winT));
  P.sy = lerp(P.sy, 0.75, 0.01);
  if (k > 0) twirlTargets();
  for (let j = 0; j < TWIRL.n * C; j++) if (TWIRL.kind[j] === 0) pool.tk[base + j] = k;
}

let lastFrame = 0, acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dtMs = lastFrame ? now - lastFrame : 16.7;
  lastFrame = now;
  const dt = Math.min(dtMs / 1000, 0.1);
  if (GAME.mode !== 'paused') {
    acc += dt * TIMESCALE;
    let n = 0;
    while (acc >= DT && n < 5) { gameStep(DT); acc -= DT; n++; }
    if (n === 5) acc = 0;
  }
  camUpdate(dt, false);
  flushBodies();
  renderFrame(now / 1000);
  if (GAME.mode === 'play' || GAME.mode === 'title') adaptScale(dtMs, now);
}

function boot() {
  const t0 = performance.now();
  makeLevel();
  GAME.gridStart = LEVEL.grid.map((r) => r.slice());
  makePools();
  initPlayer();
  initHangers();
  initEnemies();
  initLoops();
  initBridges();
  const t1 = performance.now();
  buildStatic();
  const t2 = performance.now();
  finishWorld();
  for (const P of POOL_LIST) for (const layer in P.bodies) P.bodies[layer].sort((a, b) => a.s0 - b.s0);
  for (const b of BODIES) b.init = { kick: b.kick, keep: b.keep, onHit: b.onHit, cgroup: b.cgroup || null, fric: b.fric, spares: b.spares ? b.spares.slice() : null };
  for (const L of LOOPS) L.hidden0 = L.hidden;
  for (const e of ENEMIES) placeEnemy(e);
  for (const P of POOL_LIST) { P.snapshot(); P.uploadAll(); }
  initRender();
  const sx = qnum('x', -1);
  if (sx >= 0) GAME.checkpoint = { i: sx };
  resetWorld();
  if (sx >= 0) GAME.checkpoint = null;
  camUpdate(0, true);
  const counts = POOL_LIST.map((p) => `${p.name}:${p.used}`).join(' ');
  window.SPAG.boot = { level: Math.round(t1 - t0), build: Math.round(t2 - t1), total: Math.round(performance.now() - t0), strands: counts };
  if (qflag('auto')) { GAME.mode = 'play'; veil.classList.add('gone'); CAM.defocusTarget = 0; CAM.defocus = 0; audioInit(); }
  else GAME.mode = 'title';
  window.SPAG.ready = true;
  requestAnimationFrame(frame);
}

window.SPAG = {
  ready: false,
  boot: null,
  state() {
    const P = PLAYER;
    return { mode: GAME.mode, x: +P.x.toFixed(2), y: +P.y.toFixed(2), vx: +P.vx.toFixed(1), vy: +P.vy.toFixed(1), ground: P.ground, rings: P.rings.length,
      scale: +REN.scale.toFixed(2), ms: +REN.frameMs.toFixed(1), gpu: +PROF.ms.toFixed(2), tris: Math.round(STATS.tris), draws: STATS.draws, awake: AWAKE.size, W: REN.W, H: REN.H };
  },
  hold(code, on) { if (on) { INPUT.keys.add(code); if (JUMP_CODES.has(code)) PLAYER.jumpBuf = PCFG.buffer; } else INPUT.keys.delete(code); },
  warp(i) { GAME.checkpoint = { i }; resetWorld(); camUpdate(0, true); },
  look: LOOK, cam: CAM, game: GAME, player: PLAYER,
  scale(s) { REN.scale = s; resizeRender(true); },
};

setTimeout(() => { try { boot(); } catch (e) { errBox.textContent += (e && e.stack) || String(e); } }, 30);

</script>
