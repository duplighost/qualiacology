const note = (msg) => { const n = document.getElementById('note'); n.textContent = msg; n.style.display = 'block'; };
const glc = document.getElementById('gl');
let renderer = null;

function boot() {
// ------------------------------------------------------------------ renderer, scene, camera
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.75);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();

const HOR = new CL(FOG_HEX);                 // linear
const ZEN = new CL(0x02040a);
const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.08, 5000);
camera.rotation.order = 'YXZ';
const clock = { t: 0 };
const timeU = { value: 0 };

// ------------------------------------------------------------------ textures (all painted here)

  float h13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
  float vn(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(h12(i), h12(i + vec2(1.0, 0.0)), u.x), mix(h12(i + vec2(0.0, 1.0)), h12(i + vec2(1.0, 1.0)), u.x), u.y); }
  float fbm2(vec2 p){ float f = 0.0, a = 0.5; for (int i = 0; i < 5; i++){ f += a * vn(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return f; }`;

  uniform vec3 uMoonDir; uniform vec3 uZen; uniform vec3 uHor; uniform float uTime; uniform float uFull;
  varying vec3 vDir;
  #include <fog_pars_fragment>
  ${noiseGLSL}
  void main(){
    vec3 d = normalize(vDir);
    float h = d.y;
    vec3 col = mix(uHor, uZen, pow(clamp(h, 0.0, 1.0), 0.42));
    float ang = acos(clamp(dot(d, uMoonDir), -1.0, 1.0));
    vec3 glowC = vec3(0.30, 0.36, 0.47);
    col += glowC * (0.03 * exp(-ang * 2.6) + 0.05 * exp(-ang * 12.0) + 0.16 * exp(-ang * 50.0));
    float cloud = 0.0;
    if (h > 0.0) {
      vec2 cp = d.xz / (h + 0.1) * 0.9 + vec2(uTime * 0.0035, uTime * 0.0012);
      float n = fbm2(cp * 1.3);
      cloud = smoothstep(0.6, 0.88, n) * smoothstep(0.02, 0.2, h) * 0.5;
    }
    vec3 cloudCol = uHor * 1.1 + glowC * (0.012 + 0.32 * exp(-ang * 3.4));
    if (uFull > 0.5 && h > 0.0) {
      vec3 sp = d * 300.0; vec3 cell = floor(sp);
      float r = h13(cell);
      if (r > 0.9968) {
        vec3 c = cell + 0.5 + (vec3(h13(cell + 1.1), h13(cell + 2.3), h13(cell + 3.7)) - 0.5) * 0.5;
        float dd = length(sp - c);
        float b = pow(h13(cell + 5.9), 3.0) * 1.7 + 0.08;
        float tw = 0.8 + 0.2 * sin(uTime * (1.0 + 3.0 * h13(cell + 8.1)) + r * 50.0);
        float s = exp(-dd * dd * 9.0) * b * tw * smoothstep(0.03, 0.3, h) * smoothstep(0.1, 0.5, ang) * (1.0 - cloud);
        col += vec3(0.8, 0.86, 1.0) * s * 0.3;
      }
    }
    if (uFull > 0.5 && ang < 0.03) {
      vec3 ax = normalize(cross(uMoonDir, vec3(0.0, 1.0, 0.0)));
      vec3 ay = cross(ax, uMoonDir);
      float R = 0.0105;
      vec2 q = vec2(dot(d, ax), dot(d, ay)) / R;
      float rr = length(q);
      float aa = fwidth(rr) * 1.5 + 0.02;
      float disc = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, rr);
      float mu = sqrt(max(0.0, 1.0 - rr * rr));
      float maria = smoothstep(0.46, 0.7, fbm2(q * 1.3 + vec2(3.1, 1.7)));

    gl_FragColor = vec4(col, 1.0);
    #include <tonemapping_fragment>
    #include <colorspace_fragment>
    #ifdef USE_FOG
      gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColor, 1.0 - smoothstep(0.0, 0.16, h));
    #endif
  }`;

  if (!player.onPier && Math.abs(p.x) < 1.2 && p.z > 0.05 && p.z < 1.2 && prev.z <= 0.3) player.onPier = true;
  if (player.onPier) {
    if (p.z < 0) { player.onPier = false; }
    else {
      const a = clampRect(p, -0.84, 0.84, 0, HEAD_Z + 0.55), b = clampRect(p, -3.03, 3.03, HEAD_Z + 0.55, 85.3);
      const da = (a.x - p.x) ** 2 + (a.z - p.z) ** 2, db = (b.x - p.x) ** 2 + (b.z - p.z) ** 2, c = da <= db ? a : b;
      p.x = c.x; p.z = c.z;
      for (const [x0, x1, z0, z1] of [[-3.3, -2.6, 80.4, 82.8], [2.85, 3.35, 85.0, 85.6]]) {
        const cx = clamp(p.x, x0, x1), cz = clamp(p.z, z0, z1), dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
        if (d2 < R * R) { if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x += dx * (R - d) / d; p.z += dz * (R - d) / d; } else p.x = x1 + R; }
      }
      return;
    }
  }
  if (p.z < 0) { p.x = clamp(p.x, -24, 24); p.z = Math.max(p.z, -115); }
  else {
    p.x = clamp(p.x, -55, 55);
    const lim = shoreZ(p.x) + 0.9; if (p.z > lim) p.z = lim;
    if (p.z > 0.25 && Math.abs(p.x) < 1.45 + R) p.x = p.x < 0 ? Math.min(p.x, -(1.45 + R)) : Math.max(p.x, 1.45 + R);

}
function place(x, z, yaw, pitch, onPier) {
  player.x = x; player.z = z; player.yaw = yaw ?? player.yaw; player.pitch = pitch ?? 0; player.onPier = !!onPier; player.vx = player.vz = 0;
  player.foot = footY(x, z); player.eyeY = player.foot + 1.62;
}
function updatePlayer(dt) {
  const fw = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
  const st = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const turn = (keys.ArrowLeft ? 1 : 0) - (keys.ArrowRight ? 1 : 0);
  if (dragging && dragging.touch && !touchWalk && performance.now() - dragging.t0 > 260 && dragging.moved < 14) touchWalk = true;
  player.yaw += turn * 1.7 * dt;
  const run = keys.ShiftLeft || keys.ShiftRight, speed = run ? 3.3 : 1.85;
  const sy = Math.sin(player.yaw), cy = Math.cos(player.yaw);
  let tx = 0, tz = 0; const f2 = touchWalk ? 1 : fw;
  tx += -sy * f2 + cy * st; tz += -cy * f2 - sy * st;
  const tl = Math.hypot(tx, tz); if (tl > 0) { tx = tx / tl * speed; tz = tz / tl * speed; }
  const k = 1 - Math.exp(-dt * (tl > 0 ? 7 : 9));
  player.vx = lerp(player.vx, tx, k); player.vz = lerp(player.vz, tz, k);
  const prev = { x: player.x, z: player.z }, p = { x: player.x + player.vx * dt, z: player.z + player.vz * dt };
  constrain(p, prev);
  const moved = Math.hypot(p.x - prev.x, p.z - prev.z);
  if (dt > 0) { player.vx = (p.x - prev.x) / dt; player.vz = (p.z - prev.z) / dt; }
  player.x = p.x; player.z = p.z;
  const fy = footY(player.x, player.z);
  player.foot = lerp(player.foot, fy, 1 - Math.exp(-dt * 14));
  const sp = moved / Math.max(dt, 1e-4), stride = run ? 1.05 : 0.76;
  player.stepAcc += moved; player.bob += moved / stride * Math.PI;
  if (player.stepAcc >= stride) { player.stepAcc -= stride; audio.step(surfaceAt(player.x, player.z), (run ? 0.95 : 0.75) * clamp(sp / 1.6, 0.5, 1.1)); }
  if (moved < 1e-4) player.stepAcc = Math.min(player.stepAcc, stride * 0.6);
  const bobA = clamp(sp / 2, 0, 1) * 0.022;
  player.eyeY = player.foot + 1.62 + Math.sin(player.bob) * bobA;
  camera.position.set(player.x, player.eyeY, player.z);
  camera.rotation.set(player.pitch, player.yaw, 0);
}

// input
let touchWalk = false;
const anyInput = () => { lastInput = clock.t; audio.start(); };
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code !== 'Escape') anyInput();
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; touchWalk = false; });
function requestLock() {
  if (!glc.requestPointerLock) return;
  try { const r = glc.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) { /* no lock; drag still works */ }
}
glc.addEventListener('click', () => { anyInput(); if (!locked) requestLock(); });
document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === glc; document.body.classList.toggle('locked', locked); if (locked) everLocked = true; });
document.addEventListener('pointerlockerror', () => {});
document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  const mx = clamp(e.movementX || 0, -160, 160), my = clamp(e.movementY || 0, -160, 160);
  player.yaw -= mx * 0.0022; player.pitch = clamp(player.pitch - my * 0.0022, -1.45, 1.45);
});
glc.addEventListener('pointerdown', (e) => { anyInput(); if (e.pointerType === 'touch' || !glc.requestPointerLock) { dragging = { id: e.pointerId, x: e.clientX, y: e.clientY, t0: performance.now(), moved: 0, touch: e.pointerType === 'touch' }; glc.setPointerCapture?.(e.pointerId); } });
glc.addEventListener('pointermove', (e) => {
  if (!dragging || dragging.id !== e.pointerId) return;
  const dx = e.clientX - dragging.x, dy = e.clientY - dragging.y; dragging.x = e.clientX; dragging.y = e.clientY; dragging.moved += Math.abs(dx) + Math.abs(dy);
  player.yaw -= dx * 0.005; player.pitch = clamp(player.pitch - dy * 0.005, -1.45, 1.45);
});
const endDrag = (e) => { if (dragging && dragging.id === e.pointerId) { dragging = null; touchWalk = false; } };
glc.addEventListener('pointerup', endDrag); glc.addEventListener('pointercancel', endDrag);
document.addEventListener('visibilitychange', () => { if (!audio.ctx) return; if (document.hidden) audio.ctx.suspend().catch(() => {}); else audio.ctx.resume().catch(() => {}); });

// ------------------------------------------------------------------ title and hint, drawn in the face above
const tc = document.getElementById('type'), tctx = tc.getContext('2d');
let tDPR = 1;
function sizeType() { tDPR = Math.min(window.devicePixelRatio || 1, 2); tc.width = Math.round(innerWidth * tDPR); tc.height = Math.round(innerHeight * tDPR); }
function drawGlyph(g, x, y, sc, frac) {
  let total = 0; for (const s of g.s) for (let k = 1; k < s.length; k++) total += Math.hypot(s[k][0] - s[k - 1][0], s[k][1] - s[k - 1][1]);
  let budget = total * frac + 1e-6;
  tctx.beginPath();
  for (const s of g.s) {
    if (budget <= 0) break;
    tctx.moveTo(x + s[0][0] * sc, y - s[0][1] * sc);
    for (let k = 1; k < s.length; k++) {
      const seg = Math.hypot(s[k][0] - s[k - 1][0], s[k][1] - s[k - 1][1]);
      if (budget >= seg) { tctx.lineTo(x + s[k][0] * sc, y - s[k][1] * sc); budget -= seg; }
      else { const t = budget / seg; tctx.lineTo(x + lerp(s[k - 1][0], s[k][0], t) * sc, y - lerp(s[k - 1][1], s[k][1], t) * sc); budget = 0; break; }
    }
  }
  tctx.stroke();
}
function drawText(str, cx, baseY, sc, track, prog) {
  let x = cx - textWidth(str, sc, track) / 2; const n = str.length;
  for (let i = 0; i < n; i++) { const g = FONT[str[i]], local = clamp(prog * (n * 0.5 + 1) - i * 0.5, 0, 1); if (local > 0 && g.s.length) drawGlyph(g, x, baseY, sc, local); x += g.w * sc + track; }
}
let titleStart = -1, titleOut = -1, overlayDone = false, hintA = 0;
function drawOverlay(t, dt) {
  if (overlayDone && hintA <= 0.001 && (everLocked || !glc.requestPointerLock)) return;
  const W = innerWidth, Hh = innerHeight;
  tctx.setTransform(tDPR, 0, 0, tDPR, 0, 0); tctx.clearRect(0, 0, W, Hh);
  tctx.lineCap = 'round'; tctx.lineJoin = 'round';
  if (!overlayDone) {
    const lt = t - titleStart;
    if (titleOut < 0 && (lt > 4.6 || (lastInput > titleStart + 0.9))) titleOut = t;
    const fade = titleOut < 0 ? 1 : 1 - clamp((t - titleOut) / 1.3, 0, 1);
    if (fade <= 0) overlayDone = true;
    const cap = clamp(Math.min(W * 0.055, Hh * 0.09), 26, 64), sc = cap / 7;
    tctx.strokeStyle = `rgba(232,237,244,${0.92 * fade})`; tctx.lineWidth = Math.max(1.4, cap * 0.05);
    tctx.shadowColor = `rgba(170,190,225,${0.5 * fade})`; tctx.shadowBlur = cap * 0.35;
    drawText('NIANTIC', W / 2, Hh * 0.43, sc, cap * 0.62, clamp(lt / 1.9, 0, 1));
    const sc2 = sc * 0.3;
    tctx.lineWidth = Math.max(1.1, cap * 0.028); tctx.strokeStyle = `rgba(200,210,226,${0.72 * fade})`; tctx.shadowBlur = cap * 0.15;
    drawText('after midnight', W / 2, Hh * 0.43 + cap * 1.05, sc2, cap * 0.16, clamp((lt - 1.0) / 1.6, 0, 1));
    tctx.shadowBlur = 0;
  }
  const want = overlayDone && !everLocked && glc.requestPointerLock && !dragging && t - titleOut > 1.2 ? 1 : 0;
  hintA = lerp(hintA, want, 1 - Math.exp(-dt * (want ? 1.5 : 6)));
  if (hintA > 0.01) {
    tctx.strokeStyle = `rgba(210,218,230,${0.5 * hintA})`; tctx.lineWidth = 1.2;
    drawText('click to look', W / 2, Hh - 34, 1.55, 3.6, 1);
  }
}

// ------------------------------------------------------------------ loop
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  sizeType();
}
addEventListener('resize', resize);
resize();
place(player.x, player.z, player.yaw, 0.02, false);
updatePlayer(0);
renderer.compile(scene, camera);
renderer.shadowMap.needsUpdate = true;

const stats = { acc: 0, n: 0, slow: 0 };
function updateBoat(dt) {
  if (boatState.wait > 0) { boatState.wait -= dt; boat.visible = false; waterLP[BOAT_I].w = 0; return; }
  boat.visible = true;
  boatState.x += boatState.dir * 4.6 * dt;
  if (Math.abs(boatState.x) > 1300) { boatState.dir = -boatState.dir; boatState.wait = 40; }
  const z = 470 + 30 * Math.sin(boatState.x * 0.002), y = 2.2 + Math.sin(clock.t * 0.7) * 0.15;
  boat.position.set(boatState.x, y, z);
  const d = boat.position.distanceTo(camera.position); boat.scale.setScalar(d * 0.0075);
  boat.material.opacity = 0.95 * Math.exp(-d * 0.0009) * (0.9 + 0.1 * Math.sin(clock.t * 3.1));
  waterLP[BOAT_I].set(boat.position.x, boat.position.y, boat.position.z, boat.visible ? 1 : 0);
}
let last = performance.now(), started = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  clock.t += dt; timeU.value = clock.t;
  updatePlayer(dt);
  updateBoat(dt);
  sky.position.copy(camera.position);
  audio.update(clock.t, camera.position, player.yaw, { onPier: player.onPier, overWater: player.onPier && player.z > shoreZ(player.x) });
  renderer.render(scene, camera);
  if (!started) { started = true; titleStart = clock.t; document.getElementById('veil').classList.add('lift'); }
  drawOverlay(clock.t, dt);
  // keep the frame rate honest on slower machines
  if (clock.t > 4) { stats.acc += dt; stats.n++; }
  if (stats.acc > 2.5) {
    const avg = stats.acc / stats.n; stats.slow = avg > 0.045 ? stats.slow + 1 : 0;
    if (stats.slow >= 2 && pixelRatio > 0.8) { pixelRatio = Math.max(0.75, pixelRatio - 0.35); renderer.setPixelRatio(pixelRatio); resize(); stats.slow = 0; }
    stats.acc = 0; stats.n = 0;
  }
}
requestAnimationFrame(frame);

window.__niantic = {
  place: (x, z, yaw, pitch, onPier) => { place(x, z, yaw, pitch, onPier); updatePlayer(0); },
  state: () => ({ x: player.x, z: player.z, y: player.eyeY, yaw: player.yaw, onPier: player.onPier, surface: surfaceAt(player.x, player.z), pr: pixelRatio, t: clock.t, audio: audio.ctx ? audio.ctx.state : 'none' }),
  ready: true,
};
}
</script>
