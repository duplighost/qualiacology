          g.lineTo(r * 0.32, r * 0.6); g.lineTo(-r * 0.30, r * 0.6); g.closePath(); g.fill();  // shoulders
        } else {

      function render(g) {

        if (landed < 0) {

          g.drawImage(TABLE, 0, 0);

          drawCoin(g, coin.x, coin.y, COIN_R, coin.flying ? coin.spin : IDLE_RX * 0.01, rest);

            g.moveTo(CX - 15, coin.y - COIN_R - 78 + bob); g.lineTo(CX, coin.y - COIN_R - 98 + bob);
            g.lineTo(CX + 15, coin.y - COIN_R - 78 + bob); g.stroke();

            g.font = '700 15px "Segoe UI",system-ui,sans-serif';

            g.fillText('harder', CX, coin.y + COIN_R + 40);
          }

          /* ---------- the smash cut: it is in the food ---------- */
          g.drawImage(FOODBG, 0, 0);

          const sink = clamp((t - landed) * 3, 0, 1);

          g.fillStyle = 'rgba(0,0,0,0.35)';
          g.beginPath(); g.ellipse(0, COIN_R * 0.1, COIN_R * 0.9, COIN_R * 0.3, 0, 0, TAU); g.fill();
          g.rotate(0.22);

          gr.addColorStop(0, COPPER_HI); gr.addColorStop(1, COPPER_LO);
          g.fillStyle = gr;

          g.restore();

            g.fillStyle = food.c;

          }
          g.globalAlpha = 1;

             It used to print at H*0.22 in cream — which is the exact spot the shell stamps
             its verdict, and cream is invisible on half these foods (mashed potatoes are
             #efe6d2). The reveal IS this cartridge; it does not get to be covered or to
             disappear into the dish. So: below the coin, clear of the stamp, on a dark plate
             that reads over all twelve surfaces. */
          const a = clamp((t - landed) * 7, 0, 1);
          const PY = H * 0.68, PW = W - 56, PH = 128;
          g.textAlign = 'center';
          g.globalAlpha = a;
          g.fillStyle = 'rgba(11,13,18,0.80)';
          g.fillRect(28, PY - PH * 0.62, PW, PH);
          g.strokeStyle = food.c; g.lineWidth = 3;
          g.strokeRect(28, PY - PH * 0.62, PW, PH);
          g.save(); g.translate(CX, PY - 22); g.scale(0.78 + 0.22 * a, 0.78 + 0.22 * a);
          g.font = '900 52px "Arial Black","Segoe UI Black",sans-serif';
          g.fillStyle = '#fff8ea'; g.fillText('Neither.', 0, 0);
          g.restore();
          g.font = '700 24px Georgia,"Times New Roman",serif';
          g.fillStyle = food.c; g.fillText(food.name, CX, PY + 14);
          g.font = 'italic 600 15px Georgia,"Times New Roman",serif';
          g.fillStyle = 'rgba(255,248,234,0.78)'; g.fillText(food.line, CX, PY + 38);
          g.globalAlpha = 1;
          if (landed > 0 && t - landed < 0.05) sNeither();
        }
        g.restore();
        if (flash > 0.01) { g.fillStyle = 'rgba(255,255,255,' + (flash * 0.5).toFixed(2) + ')'; g.fillRect(0, 0, W, H); }
      }

      return {
        step, render,
        result: () => done,
        /* You cannot lose this by being bad at it — only by never flicking at all. It is the
           breather; the reel needs somewhere to put your shoulders down. */
        timeout: () => (done !== 'pending' ? done : everFlicked ? 'won' : 'lost'),
        line: () => (everFlicked ? 'IT NEVER LANDED.' : 'THE PENNY WAITED.'),
        hint: () => (done !== 'pending'
          ? { type: 'wait', ms: 150 }
          : { type: 'drag', x: CX, y: TABLE_Y - 10, x2: CX, y2: TABLE_Y - 340, ms: 120 }),
      };
    },
  });
})();

/* DONE-CRITERIA
   - A drag released with upward speed >= MIN_FLICK (300 at difficulty 0; donor's own number is
     360) launches the penny at donor GRAVITY 2450 with a 15-26 rad/s tumble.
   - A softer flick is NOT a loss: the coin settles back on the table, "harder" appears, and you
     flick again. The only way to lose is to let the slot expire without ever launching it.
   - Landing smash-cuts to a drawn food surface, sinks the penny EDGE-ON so neither face is
     readable, and prints "Neither." with the food's name and its one-liner on a dark plate
     BELOW the coin — clear of the shell's verdict stamp, legible over all twelve dishes.
   - The twelve foods, their names, their lines and their splat colours are the donor's verbatim.
   BUG-IS-GAME (do not fix):
   - There is no heads and there is no tails. The coin has two faces, both drawn, and the game
     will never show you which one won. Do not add a 50/50 outcome, a score, or a "call it"
     prompt — the entire piece is a coin flip that refuses to answer.
   - Winning is not skill. Flicking at all is the win. This cartridge exists to be the moment
     in the reel where nothing is being asked of you; giving it a real fail state would delete
     the only rest in twenty-two games.
   - The food is chosen at create() and never re-rolled, so a seed always lands in the same
     dish. That is what makes a run's screenshots reproducible.
*/

(function () {

        }

        env.audio.tone({ f: midi(n) * 0.5, type: 'triangle', dur: 0.14, vol: 0.035 });

        env.audio.noise({ dur: 0.28, vol: 0.09, lp: 540 });

      function finish() {

        deliverySound();

        wasArmed = armed;

        for (let i = 0; i < rain.length; i++) {

          inputFreshT = moved ? 0 : inputFreshT + dt;
          lastPX = inp.x; lastPY = inp.y; pointerWasDown = true; everDown = true;
          const here = Math.atan2((y - CY) / RY, (x - CX) / RX);

          let ahead = finger - here; while (ahead <= 0) ahead += TAU;

        g.fillStyle = '#121d29';

        g.fillStyle = '#243443'; g.fillRect(96, 315, 197, 8);

            halo.addColorStop(0, rgba(PAL.hot, 0.23)); halo.addColorStop(1, rgba(PAL.warm, 0));

          g.fillStyle = awake ? '#7b4d28' : '#02050a'; g.fillRect(w.x + 6.5, w.y, 1, 17);

      }

        g.save(); g.translate(x, y); g.rotate(heading);
        const cone = g.createLinearGradient(7, 0, 76, 0);
        cone.addColorStop(0, rgba(PAL.hot, 0.18 * bright)); cone.addColorStop(1, rgba(PAL.hot, 0));
        g.fillStyle = cone; g.beginPath(); g.moveTo(7, -9); g.lineTo(82, -29); g.lineTo(82, 29); g.lineTo(7, 9); g.closePath(); g.fill();
        g.strokeStyle = '#03060a'; g.lineWidth = 4;

        g.strokeStyle = PAL.cyan; g.lineWidth = 2; g.beginPath(); g.moveTo(-12, 0); g.lineTo(3, -7); g.lineTo(13, 0); g.lineTo(-3, 1); g.closePath(); g.stroke();
        g.beginPath(); g.moveTo(3, -7); g.lineTo(-3, 1); g.lineTo(4, 8); g.stroke();

        sky.addColorStop(0, PAL.void); sky.addColorStop(0.65, PAL.sky); sky.addColorStop(1, '#02050b');
        g.fillStyle = sky; g.fillRect(0, 0, W, H);

/* DONE-CRITERIA

     body's donor range, and its center-to-center ray crosses no authored city door.
   - The safe body is always above y=562 and receives the donor's animated dashed ray, coloured
     target ring, plus the shared cream eighth-note rim for the first 1.5 seconds.
   - Tapping that body starts the donor quadratic transfer with duration clamp(distance/1780,
     0.13, 0.29); reaching it lights and activates the recipient and returns 'won'.
   - Tapping a cracked, drained, door-blocked, active, or empty location rejects with the donor
     105Hz square thunk but does not steal the attempt; the shrinking pilot flame keeps burning.
   - After 5.2/4.8/4.45 beats of armed time by difficulty, the flame snuffs and result becomes
     'lost'; input during count-in cannot produce a loss, and slot timeout also returns 'lost'.
   - All body selection, phases, particles, and layout rotation use env.rng; render uses only a
     deterministic hash for rain and shake and consumes no randomness.
   BUG-IS-GAME (do not fix):
   - A body can remain visibly lit after the spark leaves it. In PILOT LIGHT, lit and controlled
     are different states; the abandoned body is part of the living network, not a dead husk.
   - An invalid explicit transfer simply refuses instead of killing the pilot. The donor's
     attemptTransfer rejects non-candidates; the dying flame is the cost of guessing.

/* STARLING — one committed bank sends the warning through the flock before the falcon lands. */

    create(env) {

      const BANK_PER_PIXEL = 0.011;   // ~84 px of coherent horizontal travel = one committed bank
      const BANK_DECAY = 3.4;         // donor decay: a reversal cancels the warning
      const WAVE_SPEED = 360;         // portrait-scaled donor 780 px/s

      const NIGHT = '#11131c', PALE = '#e8ddd0', WARNING = '#e7b35d';

        const spread = dead ? 0.2 : alarm >= ALARM_ARMED ? 1.05 : 0.58 + Math.sin(t * 11 + x) * 0.18;
        g.strokeStyle = dead ? 'rgba(17,19,28,0.38)' : NIGHT;

              playerRoll += (clamp(rawBank, -1, 1) - playerRoll) * (1 - Math.exp(-12 * dt));

          if (strikeDone && done === 'pending' && env.armed()) done = 'lost';

          for (let i = feathers.length - 1; i >= 0; i--) {
            const f = feathers[i];
            f.life -= dt; f.vy += 120 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
            if (f.life <= 0) feathers.splice(i, 1);

        render(g) {

          let fx = fsx, fy = fsy, fdir = Math.atan2(ty - fsy, tx - fsx);
          if (phase === 'mark') {

          }

          const hy = Math.sin((t * 60 + 9.1) * 78.233) * 43758.5453;
          const sx = shake > 0 ? ((hx - Math.floor(hx)) - 0.5) * shake : 0;
          const sy = shake > 0 ? ((hy - Math.floor(hy)) - 0.5) * shake : 0;

          g.save(); g.translate(sx, sy);
          const sky = g.createLinearGradient(0, 0, 0, H);
          sky.addColorStop(0, SKY0); sky.addColorStop(0.52, SKY1); sky.addColorStop(1, SKY2);
          g.fillStyle = sky; g.fillRect(-30, -30, W + 60, H + 60);
          g.fillStyle = 'rgba(238,189,152,0.10)';
          for (let y = 92; y < 610; y += 46) g.fillRect(0, y + Math.sin(y * 0.03) * 7, W, 1);

          /* The mark is legible without colour: a solid falcon, a dashed dive vector, and
             two breathing impact ovals around the dense patch it is tracking. */
          if (!strikeDone) {
            g.save(); g.setLineDash([7, 9]); g.lineDashOffset = -t * 28;
            g.strokeStyle = 'rgba(232,221,208,0.48)'; g.lineWidth = 2;
            g.beginPath(); g.moveTo(fx, fy); g.lineTo(tx, ty); g.stroke(); g.restore();
            const markPulse = 1 + Math.sin(t * 7) * 0.08;
            g.strokeStyle = 'rgba(17,19,28,0.55)'; g.lineWidth = 2;
            g.beginPath(); g.ellipse(tx, ty, 66 * markPulse, 52 * markPulse, 0, 0, TAU); g.stroke();
            g.setLineDash([3, 7]); g.lineDashOffset = t * 22;
            g.beginPath(); g.ellipse(tx, ty, 78, 61, 0, 0, TAU); g.stroke(); g.setLineDash([]);
          }

          if (wave && !strikeDone) {
            g.strokeStyle = 'rgba(232,221,208,0.17)'; g.lineWidth = WAVE_WIDTH * 1.25;
            g.beginPath(); g.arc(wave.x, wave.y, wave.r, 0, TAU); g.stroke();
            g.strokeStyle = 'rgba(231,179,93,0.82)'; g.lineWidth = 3;
            g.beginPath(); g.arc(wave.x, wave.y, wave.r, 0, TAU); g.stroke();
            g.strokeStyle = 'rgba(17,19,28,0.45)'; g.lineWidth = 1;
            g.beginPath(); g.arc(wave.x, wave.y, Math.max(0, wave.r - 8), 0, TAU); g.stroke();

            const p = birdPos(b);
            let x = p.x, y = p.y;
            if (strikeDone && !b.dead) {
              const a = Math.atan2(p.y - ty, p.x - tx);
              x += Math.cos(a) * resolveAge * 92; y += Math.sin(a) * resolveAge * 58;
            }
            if (strikeDone && b.dead) y += resolveAge * resolveAge * 95;
            const face = b.alarm >= ALARM_ARMED && wave
              ? Math.atan2(p.y - wave.y, p.x - wave.x)
              : -Math.PI / 2 + Math.sin(t * 1.3 + b.phase) * 0.22;
            drawBird(g, x, y, b.size, face, b.alarm, b.dead);
          }

          drawFalcon(g, fx, fy, fdir, phase === 'stoop' ? 1.18 : 1);

          /* The player is one larger bird. Roll and a curved wake make the required bank a
             body motion, while the cream rim is the anthology's shared first-1.5s mark. */
          g.save(); g.translate(playerX, playerY); g.rotate(playerDir); g.scale(1, 1 - Math.abs(playerRoll) * 0.18);
          g.fillStyle = PALE; g.beginPath(); g.ellipse(0, 0, 7, 12, 0, 0, TAU); g.fill();
          g.strokeStyle = NIGHT; g.lineWidth = 4; g.lineCap = 'round';
          g.beginPath(); g.moveTo(-4, 1); g.quadraticCurveTo(-18, 7 + playerRoll * 7, -26, 1);
          g.moveTo(4, 1); g.quadraticCurveTo(18, 7 - playerRoll * 7, 26, 1); g.stroke();
          g.restore();
          if (t < 1.5 && !wave) {
            const p8 = 0.5 + 0.5 * Math.sin(env.beatPhase() * Math.PI * 4);
            g.globalAlpha = 0.28 + p8 * 0.48; g.strokeStyle = env.ink; g.lineWidth = 2;
            g.beginPath(); g.arc(playerX, playerY, 28 + p8 * 4, 0, TAU); g.stroke();
            g.globalAlpha = 1;
            const sgn = targetSide;
            g.strokeStyle = 'rgba(255,243,214,0.48)'; g.lineWidth = 3; g.lineCap = 'round';
            g.beginPath();
            g.arc(playerX, playerY, 45, sgn < 0 ? -0.3 : Math.PI + 0.3, sgn < 0 ? -2.35 : Math.PI + 2.35, sgn < 0);

          }

          for (const f of feathers) {
            g.save(); g.translate(f.x, f.y); g.rotate(f.rot);
            g.globalAlpha = clamp(f.life / f.max, 0, 1);
            g.strokeStyle = strikeDone && done === 'won' ? PALE : NIGHT; g.lineWidth = 1.5;
            g.beginPath(); g.moveTo(-5, 0); g.quadraticCurveTo(0, -2, 7, 0); g.stroke(); g.restore();
          }
          g.restore();

          if (flash > 0) {
            g.fillStyle = done === 'won' ? 'rgba(232,221,208,' + (flash * 0.18).toFixed(3) + ')'
              : 'rgba(17,19,28,' + (flash * 0.30).toFixed(3) + ')';
            g.fillRect(0, 0, W, H);
          }
        },

        result: () => done,
        timeout() {
          if (done === 'pending') {
            done = 'lost'; failMode = wave ? 'late' : 'silent';
            flash = 0.65; shake = 10;
          }
          return done;
        },
        line: () => failMode === 'late' ? 'THE NEWS ARRIVED AFTER DINNER' : 'THE FLOCK MISSED YOUR MEMO',
        hint() {
          if (done !== 'pending' || wave) return { type: 'wait', ms: 160 };
          return {
            type: 'drag',
            x: W * 0.5,
            y: playerY,
            x2: W * 0.5 + targetSide * 128,
            y2: playerY - 34,
            ms: 170,

    },

})();

/* DONE-CRITERIA
   - A coherent horizontal drag of >=84 px crosses the donor BANK_TRIGGER 0.92; reversing back
     across the start cancels the signed bank, while a committed bank emits exactly one wave.
   - The explicit wave front advances 360 px/s with a 42px band; each bird becomes alarmed only
     when that front physically crosses it, and alarmed birds open their wing silhouette and gain
     a pale body dot, so propagation remains readable without hue.
   - The falcon marks for 1.85s, then follows the donor's 1.0s accelerating stoop. At impact every
     target bird below alarm 0.30 dies; zero deaths wins, one or more loses, never while unarmed.
   - The marked flock is cued by density, two animated oval outlines, and a dashed moving dive
     vector from the solid falcon silhouette; the answer is not encoded by colour alone.
   - A win produces an outward flock break, 30 feathers, 10px shake, pale flash and a 392/587/784
     chord; a loss drops calm silhouettes, throws 42 feathers and plays noise plus 180->52Hz fall.
   - hint() performs one 128px committed bank toward the marked side and waits after the wave.
   BUG-IS-GAME (do not fix):
   - The alarm wave is circular even though the player visibly banks left or right. Turning is the
     trigger, not an aimed projectile; the news leaves the bird in every direction, as in STARLING.
   - Alarm decays at only 0.08/s in this cut. A clean warning during the mark stays believed through
     the stoop; the difficulty is committing before impact, not guessing a secret millisecond.
*/

/* ===== carts/39-sumi.js ===== */
/* SUMI — one crisp brush tip, one soft ink stroke, four authored gates down the mountain. */
(function () {
  registerGame({
    id: 'sumi',
    title: 'SUMI',
    command: 'ONE STROKE!',
    family: 'drag',
    slotBeats: 10,
    create(env) {
      const W = env.W, H = env.H, D = env.difficulty | 0, R = env.rng, TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const damp = (a, b, l, dt) => b + (a - b) * Math.exp(-l * dt);
      const PAPER = '#efe6d2', PAPER_HI = '#f8f0df', PAPER_LO = '#d8c8ad';
      const INK = '#1c140e', DRY = '#3a2b22', WASH = '#7f7465', SEAL = '#c1362b';
      const GOLD = '#d9a441';
      const LANE_L = 38, LANE_R = W - 38, BRUSH_Y = 294;
      const SCALE_Y = 0.58, THICK = 54, FINISH = 1080;
      const SPEED = [280, 300, 320][D];
      const GAP = [150, 132, 116][D];
      const TIP_STIFF = [24, 30, 38][D]; // donor: higher heat/tier sharpens the gameplay tip
      const INK_SOFT = 10.5;              // donor cosmetic stroke spring, never the hitbox
      const pattern = R() < 0.5 ? 0 : 1;
      const centers = pattern ? [270, 124, 244, 126] : [120, 266, 148, 268];
      const ats = [180, 430, 680, 930];
      const gates = centers.map((cx, i) => ({
        at: ats[i],
        cx,
        /* The first gate is the donor's generous gate-field teacher at every difficulty.
           Its 180px opening includes the neutral centre even when the authored centre sits
           left or right, so an instinctive first touch can bend into the stroke instead of
           becoming an unrecoverable blot. Later gates carry the real difficulty widths. */
        gap: i === 0 ? 180 : GAP - (i === 3 ? 8 : i === 2 ? 4 : 0),
        passed: false,
        grazed: false,
        seed: R() * 1000,
      }));
      const fibers = [];
      for (let i = 0; i < 42; i++) fibers.push({
        y: R() * H, x: R() * W, len: 28 + R() * 130, a: 0.025 + R() * 0.045,
      });

      let t = 0, dist = 0, done = 'pending', failMode = '';
      let targetX = W * 0.5, tipX = W * 0.5, inkX = W * 0.5;
      let lastInputX = W * 0.5, dragTravel = 0, crossed = 0;
      let heat = 0, grazeGate = -1, grazeSfx = 0;
      let blot = null, stamp = 0, shake = 0, flash = 0;
      const stroke = [{ x: inkX, d: 0, w: 4.2 }];
      const flecks = [];
      let lastSample = 0;

      function addFlecks(x, y, n, vermilion) {
        for (let i = 0; i < n; i++) {
          if (flecks.length >= 80) flecks.shift();
          const a = -Math.PI / 2 + (R() - 0.5) * 2.3, sp = 30 + R() * 130;
          flecks.push({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
            life: 0.35 + R() * 0.42, max: 0.77, r: 0.8 + R() * 1.8,
            c: vermilion ? SEAL : (heat > 2.2 && i % 3 === 0 ? GOLD : INK),
          });
        }
      }

      function lose(kind) {
        if (done !== 'pending' || !env.armed()) return;
        done = 'lost'; failMode = kind;
        blot = { x: tipX, y: BRUSH_Y, r: 34, seed: R() * TAU };
        shake = 13; flash = 0.65;
        addFlecks(tipX, BRUSH_Y, 28, false);
        env.audio.noise({ dur: 0.28, vol: 0.28, lp: 1050 });
        env.audio.tone({ f: 126, f2: 54, type: 'sine', dur: 0.34, vol: 0.18 });
      }

      function win() {
        if (done !== 'pending') return;
        done = 'won'; stamp = 1; shake = 9; flash = 0.52;
        addFlecks(W - 84, 150, 32, true);
        /* The donor's silence-then-hanko sequence compressed into one scheduled impact: the
           result frame already contains the seal, while the ear still gets the held breath. */
        env.audio.noise({ dur: 0.05, vol: 0.035, hp: 2500 });
        env.audio.noise({ dur: 0.16, vol: 0.27, lp: 1500, t: 0.14 });
        env.audio.tone({ f: 196, type: 'triangle', dur: 0.42, vol: 0.17, t: 0.14 });
        env.audio.tone({ f: 294, type: 'triangle', dur: 0.34, vol: 0.11, t: 0.20 });
      }

      function screenY(worldD) { return BRUSH_Y + (worldD - dist) * SCALE_Y; }

      function rockNoise(seed, i) {
        const n = Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      function drawRock(g, x0, x1, y0, y1, seed, side) {
        if (x1 <= x0) return;
        const n = 7;
        g.fillStyle = INK;
        g.beginPath();
        if (side < 0) {
          g.moveTo(x0, y0 - 8); g.lineTo(x1, y0 - 8);
          for (let i = 0; i <= n; i++) {
            const y = y0 + (y1 - y0) * i / n;
            g.lineTo(x1 - rockNoise(seed, i) * 13, y);
          }
          g.lineTo(x0, y1 + 8);
        } else {
          g.moveTo(x1, y0 - 8); g.lineTo(x0, y0 - 8);
          for (let i = 0; i <= n; i++) {
            const y = y0 + (y1 - y0) * i / n;
            g.lineTo(x0 + rockNoise(seed, i) * 13, y);
          }
          g.lineTo(x1, y1 + 8);
        }
        g.closePath(); g.fill();
        g.globalAlpha = 0.22; g.strokeStyle = PAPER_HI; g.lineWidth = 1.2;
        for (let k = 0; k < 3; k++) {
          const yy = y0 + (y1 - y0) * (0.25 + k * 0.24);
          g.beginPath(); g.moveTo(x0 + 5, yy); g.lineTo(x1 - 5, yy + rockNoise(seed + 4, k) * 5 - 2.5); g.stroke();
        }
        g.globalAlpha = 1;
      }

      function drawBlot(g, b) {
        g.fillStyle = INK; g.beginPath();
        for (let i = 0; i <= 18; i++) {
          const a = i / 18 * TAU;
          const rr = b.r * (0.72 + 0.34 * Math.abs(Math.sin(a * 2.3 + b.seed)));
          const x = b.x + Math.cos(a) * rr, y = b.y + Math.sin(a) * rr;
          i ? g.lineTo(x, y) : g.moveTo(x, y);
        }
        g.closePath(); g.fill();
        g.globalAlpha = 0.66;
        for (let i = 0; i < 5; i++) {
          const a = b.seed + i * 1.7;
          g.beginPath(); g.arc(b.x + Math.cos(a) * b.r * 1.65,
            b.y + Math.sin(a) * b.r * 1.35, b.r * 0.12, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
      }

      return {
        step(dt, inp) {
          t += dt;
          shake = Math.max(0, shake - dt * 22);
          flash = Math.max(0, flash - dt * 2.8);
          grazeSfx = Math.max(0, grazeSfx - dt);

          /* A very quick tap can begin and end between fixed simulation steps. Preserve its
             position from the queued edge even when `down` is already false by the next step;
             otherwise a legitimate flick occasionally leaves the brush aimed at the old gate. */
          if (inp.justDown) {
            lastInputX = inp.x;
            if (done === 'pending') targetX = clamp(inp.x, LANE_L + 8, LANE_R - 8);
          }
          if (inp.down && done === 'pending') {
            targetX = clamp(inp.x, LANE_L + 8, LANE_R - 8);
            dragTravel += Math.abs(inp.x - lastInputX);
            lastInputX = inp.x;
          }
          /* The gameplay point is crisp; the calligraphic body remains soft. They may never be
             collapsed to one value: the donor's make-or-break is that beauty cannot add latency. */
          tipX = damp(tipX, targetX, TIP_STIFF, dt);
          inkX = damp(inkX, tipX, INK_SOFT, dt);

          if (done === 'pending' && env.armed()) {
            const speed = SPEED * (1 + clamp(heat / 3, 0, 1) * 0.16);
            dist += speed * dt;
            let grazing = false;

            for (let i = 0; i < gates.length; i++) {
              const q = gates[i];
              const half = q.gap * 0.5;
              const left = q.cx - half, right = q.cx + half;
              const within = Math.abs(dist - q.at) <= THICK * 0.5;
              if (within) {
                if (tipX - 7 < left || tipX + 7 > right) {
                  lose('blot');
                  break;
                }
                const edge = Math.min(tipX - left, right - tipX);
                if (edge < 27) {
                  grazing = true;
                  if (grazeGate !== i) {
                    grazeGate = i; heat = clamp(heat + 0.22, 0, 3);
                    addFlecks(tipX, BRUSH_Y - 8, 7, false);
                    env.audio.tone({ f: 440 + i * 82, type: 'triangle', dur: 0.12, vol: 0.09 });
                  }
                }
              }
              if (!q.passed && dist > q.at + THICK * 0.5) {
                q.passed = true; crossed++;
                env.audio.tone({ f: 294 * Math.pow(2, crossed * 2 / 12), type: 'sine', dur: 0.1, vol: 0.055 });
              }
            }
            if (done === 'pending') {
              heat = clamp(heat + (grazing ? 1.55 : -0.48) * dt, 0, 3);
              if (!grazing) grazeGate = -1;

          }

          if (dist - lastSample >= 5 && stroke.length < 360) {
            const width = 4.2 + clamp(heat / 3, 0, 1) * 8.5;
            stroke.push({ x: inkX, d: dist, w: width });

          }
          for (let i = flecks.length - 1; i >= 0; i--) {

          }
        },

        render(g) {
          const hx = Math.sin((t * 60 + 4.2) * 12.9898) * 43758.5453;
          const hy = Math.sin((t * 60 + 8.7) * 78.233) * 43758.5453;
          const sx = shake ? ((hx - Math.floor(hx)) - 0.5) * shake : 0;
          const sy = shake ? ((hy - Math.floor(hy)) - 0.5) * shake : 0;
          g.save(); g.translate(sx, sy);

          g.fillStyle = PAPER; g.fillRect(-24, -24, W + 48, H + 48);
          const warm = clamp(heat / 3, 0, 1);
          g.fillStyle = 'rgba(208,151,82,' + (warm * 0.075).toFixed(3) + ')';
          g.fillRect(-24, -24, W + 48, H + 48);
          g.fillStyle = PAPER_LO; g.fillRect(0, 0, 22, H); g.fillRect(W - 22, 0, 22, H);
          g.fillStyle = 'rgba(75,56,42,0.16)';
          for (let y = 18; y < H; y += 24) { g.fillRect(0, y, 22, 2); g.fillRect(W - 22, y + 8, 22, 2); }
          for (const f of fibers) {
            g.strokeStyle = 'rgba(58,43,34,' + f.a.toFixed(3) + ')'; g.lineWidth = 1;
            g.beginPath(); g.moveTo(f.x, f.y); g.lineTo(Math.min(W, f.x + f.len), f.y + 1); g.stroke();
          }

          /* A pale mountain wash lives behind the playable ink. */
          g.fillStyle = 'rgba(127,116,101,0.10)';
          g.beginPath(); g.moveTo(22, 214); g.lineTo(112, 92); g.lineTo(180, 178);
          g.lineTo(257, 66); g.lineTo(W - 22, 190); g.lineTo(W - 22, 250); g.lineTo(22, 250); g.closePath(); g.fill();

          /* Finish gate, then rocks, then the player's ink: obstacle ink is dry and opaque;
             the living stroke is wet and translucent at its feathered edge. */
          const finishY = screenY(FINISH);
          if (finishY > -50 && finishY < H + 50) {
            g.strokeStyle = SEAL; g.lineWidth = 4; g.setLineDash([14, 8]);
            g.beginPath(); g.moveTo(LANE_L, finishY); g.lineTo(LANE_R, finishY); g.stroke(); g.setLineDash([]);
          }
          for (let i = 0; i < gates.length; i++) {
            const q = gates[i], yy = screenY(q.at), hh = THICK * SCALE_Y;
            if (yy < -70 || yy > H + 70) continue;
            const left = q.cx - q.gap * 0.5, right = q.cx + q.gap * 0.5;
            drawRock(g, LANE_L, left, yy - hh * 0.5, yy + hh * 0.5, q.seed, -1);
            drawRock(g, right, LANE_R, yy - hh * 0.5, yy + hh * 0.5, q.seed + 19, 1);

              g.strokeStyle = 'rgba(239,230,210,0.13)'; g.lineWidth = Math.max(1, (a.w + b.w) * 0.18);
              g.beginPath(); g.moveTo(a.x - 1, ya); g.lineTo(b.x - 1, yb); g.stroke();
            }
          }
          g.strokeStyle = 'rgba(28,20,14,0.82)'; g.lineWidth = 8 + heat * 2.4; g.lineCap = 'round';
          const last = stroke[stroke.length - 1];
          g.beginPath();
          g.moveTo(last.x, BRUSH_Y - (dist - last.d) * SCALE_Y);
          g.lineTo(inkX, BRUSH_Y); g.lineTo(tipX, BRUSH_Y); g.stroke();

          /* Crisp nib: this, not inkX, is the collision point. */
          g.save(); g.translate(tipX, BRUSH_Y);
          g.fillStyle = INK; g.beginPath(); g.moveTo(0, -10); g.quadraticCurveTo(7, 0, 0, 15);
          g.quadraticCurveTo(-7, 0, 0, -10); g.fill();
          g.fillStyle = 'rgba(255,240,220,0.26)'; g.beginPath(); g.arc(-2, -2, 1.7, 0, TAU); g.fill();
          g.restore();

          if (t < 1.5 && done === 'pending') {
            const p8 = 0.5 + 0.5 * Math.sin(env.beatPhase() * Math.PI * 4);
            g.globalAlpha = 0.28 + p8 * 0.48; g.strokeStyle = env.ink; g.lineWidth = 2;
            g.beginPath(); g.arc(tipX, BRUSH_Y, 24 + p8 * 3, 0, TAU); g.stroke();
            g.globalAlpha = 1;
            const first = gates.find(q => !q.passed) || gates[0];
            g.save(); g.setLineDash([4, 7]); g.strokeStyle = 'rgba(193,54,43,0.42)'; g.lineWidth = 2;
            g.beginPath(); g.moveTo(tipX, BRUSH_Y + 30);
            g.quadraticCurveTo((tipX + first.cx) * 0.5, BRUSH_Y + 58, first.cx, screenY(first.at) - 26);
            g.stroke(); g.restore();
          }

          if (blot) drawBlot(g, blot);
          for (const f of flecks) {
            g.globalAlpha = clamp(f.life / f.max, 0, 1); g.fillStyle = f.c;
            g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill();
          }
          g.globalAlpha = 1;

          /* Four dry marks count the authored gates without a word or a number. */
          for (let i = 0; i < 4; i++) {
            g.strokeStyle = i < crossed ? SEAL : 'rgba(58,43,34,0.25)';
            g.lineWidth = i < crossed ? 4 : 2;
            g.beginPath(); g.moveTo(W * 0.5 - 39 + i * 26, 54); g.lineTo(W * 0.5 - 27 + i * 26, 46); g.stroke();
          }

          if (stamp) {
            const x = W - 82, y = 142, s = 52;
            g.save(); g.translate(x, y); g.rotate(0.07);
            g.strokeStyle = SEAL; g.lineWidth = 5; g.strokeRect(-s * 0.5, -s * 0.5, s, s);
            g.fillStyle = SEAL;
            g.fillRect(-15, -16, 5, 31); g.fillRect(-1, -18, 5, 36); g.fillRect(12, -14, 5, 28);
            g.fillRect(-18, -5, 34, 5); g.fillRect(-14, 10, 30, 5);
            g.restore();
          }
          g.restore();

          if (flash > 0) {
            g.fillStyle = done === 'won' ? 'rgba(193,54,43,' + (flash * 0.16).toFixed(3) + ')'
              : 'rgba(28,20,14,' + (flash * 0.22).toFixed(3) + ')';
            g.fillRect(0, 0, W, H);
          }
        },

        result: () => done,
        timeout() {
          if (done === 'pending') {
            failMode = 'unfinished';
            if (env.armed()) lose('unfinished');
            else done = 'lost';
          }
          return done === 'won' ? 'won' : 'lost';
        },
        line: () => failMode === 'unfinished' ? 'THE SCROLL KEPT GOING WITHOUT YOU' : 'THE BRUSH REMEMBERED THAT ROCK',
        hint() {
          if (done !== 'pending') return { type: 'wait', ms: 180 };
          let next = gates[gates.length - 1];

/* BREAKLINE — identify the owner of the closing bullet wall and break only that source. */
(function () {

        env.audio.tone({ f: 220, type: 'triangle', dur: 0.42, vol: 0.15 });
        env.audio.tone({ f: 330, type: 'triangle', dur: 0.42, vol: 0.14, t: 0.06 });
        env.audio.tone({ f: 440, type: 'triangle', dur: 0.5, vol: 0.13, t: 0.13 });

      function drawGlyph(g, style, x, y, size, fill, dead) {

          g.setLineDash([7, 9]); g.lineDashOffset = -t * 36;
          g.strokeStyle = routeWake ? BLUE : 'rgba(185,228,255,0.18)'; g.lineWidth = routeWake ? 4 : 2;

      const anchor = { x: W * 0.5, y: 538 };

      let t = 0, done = 'pending', failMode = '';
      let dragging = false, dragStart = null, samples = [], everThrown = false;
      let success = false, successAge = 0, reveal = 0, hitstop = 0;
      let shake = 0, flash = 0, weak = 0, wallTone = 0;
      let weakX = ball.x, weakY = ball.y;
      const cooldown = [0, 0, 0];
      const recoil = [{ x: 0, y: 0 }, { x: 0, y: 0 }, { x: 0, y: 0 }];
      const particles = [], trails = [], cracks = [];

      function roundedRectPath(g, x, y, w, h, r) {
        const q = Math.min(r, w * 0.5, h * 0.5);
        g.beginPath();
        g.moveTo(x + q, y); g.arcTo(x + w, y, x + w, y + h, q);
        g.arcTo(x + w, y + h, x, y + h, q);
        g.arcTo(x, y + h, x, y, q); g.arcTo(x, y, x + w, y, q);
        g.closePath();
      }

      function geometry() {
        const wake = [0.48, 0.72, 0.94][D];
        const pDuck = targetIndex === 0 ? Math.sin(t * 3) * 10 * wake : 0;
        const cCrawl = targetIndex === 1 ? Math.sin(t * 1.4) * 28 * wake : 0;
        const vStep = targetIndex === 2 ? Math.sin(t * 2.2) * 19 * wake : 0;
        const portrait = {
          x: 38 + recoil[0].x,
          y: 174 + pDuck + recoil[0].y,
          w: 104,
          h: 138,
          angle: targetIndex === 0 ? -0.055 - wake * 0.025 : 0,
        };
        const chandelier = {
          x: W * 0.5 + cCrawl + recoil[1].x,
          y: 198 + recoil[1].y,
          r: 29,
        };
        const vase = {
          x: 298 + vStep + recoil[2].x,
          y: 397 + recoil[2].y,
          r: 24,
        };
        return {
          portrait,
          chandelier,
          vase,
          pedestal: { x: vase.x - 33, y: 426 + recoil[2].y * 0.2, w: 66, h: FLOOR - 426 },
        };
      }

      function targetCenter(q) {
        if (targetIndex === 0) return { x: q.portrait.x + q.portrait.w * 0.5, y: q.portrait.y + q.portrait.h * 0.5 };
        return targetIndex === 1 ? { x: q.chandelier.x, y: q.chandelier.y } : { x: q.vase.x, y: q.vase.y };
      }

      function circleRect(circle, rect, restitution) {
        const nearestX = clamp(circle.x, rect.x, rect.x + rect.w);
        const nearestY = clamp(circle.y, rect.y, rect.y + rect.h);
        const dx = circle.x - nearestX, dy = circle.y - nearestY;
        const d2 = dx * dx + dy * dy;
        if (d2 >= circle.r * circle.r) return null;
        let nx = 0, ny = -1, distance = Math.sqrt(d2);
        if (distance > 0.001) {
          nx = dx / distance; ny = dy / distance;
        } else {
          const left = Math.abs(circle.x - rect.x);
          const right = Math.abs(rect.x + rect.w - circle.x);
          const top = Math.abs(circle.y - rect.y);
          const bottom = Math.abs(rect.y + rect.h - circle.y);
          const minimum = Math.min(left, right, top, bottom);
          if (minimum === left) { nx = -1; ny = 0; distance = -left; }
          else if (minimum === right) { nx = 1; ny = 0; distance = -right; }
          else if (minimum === bottom) { nx = 0; ny = 1; distance = -bottom; }
          else { nx = 0; ny = -1; distance = -top; }
        }
        const overlap = circle.r - distance + 0.5;
        circle.x += nx * overlap; circle.y += ny * overlap;
        const normalVelocity = circle.vx * nx + circle.vy * ny;
        if (normalVelocity < 0) {
          circle.vx -= (1 + restitution) * normalVelocity * nx;
          circle.vy -= (1 + restitution) * normalVelocity * ny;
        }
        return { x: circle.x - nx * circle.r, y: circle.y - ny * circle.r, nx, ny };
      }

      function circleCircle(circle, target, restitution) {
        const dx = circle.x - target.x, dy = circle.y - target.y;
        const minimum = circle.r + target.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minimum * minimum) return null;
        const distance = Math.max(0.001, Math.sqrt(d2));
        const nx = dx / distance, ny = dy / distance;
        const overlap = minimum - distance + 0.5;
        circle.x += nx * overlap; circle.y += ny * overlap;
        const normalVelocity = circle.vx * nx + circle.vy * ny;
        if (normalVelocity < 0) {
          circle.vx -= (1 + restitution) * normalVelocity * nx;
          circle.vy -= (1 + restitution) * normalVelocity * ny;
        }
        return { x: target.x + nx * target.r, y: target.y + ny * target.r, nx, ny };
      }

      function burst(x, y, color, count, speed) {
        for (let i = 0; i < count && particles.length < 72; i++) {
          const a = R() * TAU, s = (0.32 + R() * 0.68) * speed;
          particles.push({
            x, y,
            vx: Math.cos(a) * s,
            vy: Math.sin(a) * s,
            life: 0.34 + R() * 0.42,
            max: 0.76,
            r: 1.5 + R() * 3.2,
            color,
          });
        }
      }

      function soundImpact(index, strong) {
        const f = TARGET_PITCHES[index];
        env.audio.tone({ f, f2: f * 0.985, type: 'sine', dur: strong ? 0.22 : 0.10, vol: strong ? 0.075 : 0.025 });
      }

      function beginSuccess(index, hit, speed, vx, vy) {
        if (success || done !== 'pending') return;
        success = true; successAge = 0; dragging = false;
        ball.vx = 0; ball.vy = 0;
        const d = Math.max(1, Math.hypot(vx, vy));
        recoil[index].x += vx / d * 18;
        recoil[index].y += vy / d * 18;
        cracks.push({ x: hit.x, y: hit.y, branches: 5, seed: R() * TAU });
        burst(hit.x, hit.y, TARGET_COLORS[index], 32, 180 + Math.min(220, speed * 0.28));
        hitstop = 0.055; shake = 14; flash = 0.62;
        soundImpact(index, true);
        env.audio.noise({ dur: 0.11, vol: 0.10, hp: 1100, lp: 5200 });
        [220, 277.18, 329.63, 440].forEach((f, i) => {
          env.audio.tone({ f, f2: f * 0.985, type: 'sine', dur: 0.46 + i * 0.055, vol: 0.034 - i * 0.003, t: 0.05 + i * 0.035 });
        });
      }

      function objectImpact(index, hit, speed, vx, vy) {
        if (cooldown[index] > 0 || speed < 62) return;
        cooldown[index] = 0.52;  // donor per-object debounce
        if (index === targetIndex && speed >= HARD_SPEED) {
          beginSuccess(index, hit, speed, vx, vy);
          return;
        }
        soundImpact(index, false);
        const d = Math.max(1, speed);
        recoil[index].x += vx / d * 4.5;
        recoil[index].y += vy / d * 4.5;
        if (index === targetIndex) {
          weak = 0.72; weakX = hit.x; weakY = hit.y;
          burst(hit.x, hit.y, TARGET_COLORS[index], 6, 90);
        }
      }

      function pushSample(x, y) {
        const last = samples[samples.length - 1];
        if (!last || Math.hypot(x - last.x, y - last.y) > 0.25) samples.push({ x, y, t });
        while (samples.length > 1 && t - samples[0].t > 0.14) samples.shift();
        while (samples.length > 8) samples.shift();
      }

      function release(inp) {
        ball.x = clamp(inp.x, LEFT + ball.r, RIGHT - ball.r);
        ball.y = clamp(inp.y, CEILING + ball.r, FLOOR - ball.r);
        pushSample(ball.x, ball.y);
        const end = { x: ball.x, y: ball.y, t };
        const oldest = samples[0] || dragStart || end;
        const seconds = Math.max(0.035, end.t - oldest.t);
        let vx = (end.x - oldest.x) / seconds;
        let vy = (end.y - oldest.y) / seconds;
        const totalDx = end.x - dragStart.x, totalDy = end.y - dragStart.y;
        if (Math.hypot(vx, vy) < 132 && Math.hypot(totalDx, totalDy) > 16) {
          vx = totalDx * 4.5; vy = totalDy * 4.5;  // donor's .075 px/frame fallback
        }
        const speed = Math.hypot(vx, vy);
        if (speed > MAX_THROW) { vx = vx / speed * MAX_THROW; vy = vy / speed * MAX_THROW; }
        ball.vx = vx; ball.vy = vy;
        dragging = false; everThrown = true;
        env.audio.tone({ f: 392, f2: 386, type: 'sine', dur: 0.09, vol: 0.022 });
      }

      function updateInput(inp) {
        if (inp.justDown && !success && done === 'pending') {
          const hitRadius = Math.max(54, ball.r * 2.4);
          if (Math.hypot(inp.x - ball.x, inp.y - ball.y) <= hitRadius) {
            dragging = true;
            ball.x = clamp(inp.x, LEFT + ball.r, RIGHT - ball.r);
            ball.y = clamp(inp.y, CEILING + ball.r, FLOOR - ball.r);
            ball.vx = 0; ball.vy = 0;
            dragStart = { x: ball.x, y: ball.y, t };
            samples = [];
            pushSample(ball.x, ball.y);
          }
        }
        if (dragging && inp.down) {
          ball.x = clamp(inp.x, LEFT + ball.r, RIGHT - ball.r);
          ball.y = clamp(inp.y, CEILING + ball.r, FLOOR - ball.r);
          ball.vx = 0; ball.vy = 0;
          pushSample(ball.x, ball.y);
        }
        if (dragging && inp.justUp) release(inp);
      }

      function updatePhysics(dt) {
        if (dragging || success) return;
        const dx = anchor.x - ball.x, dy = anchor.y - ball.y;
        const distance = Math.hypot(dx, dy);
        if (distance > SLACK) {
          const stretch = distance - SLACK;
          ball.vx += dx / distance * stretch * SPRING * dt;
          ball.vy += dy / distance * stretch * SPRING * dt;
        }
        ball.vy += GRAVITY * dt;
        const damping = Math.pow(0.997, dt * 60);
        ball.vx *= damping; ball.vy *= damping;
        const oldX = ball.x, oldY = ball.y;
        ball.x += ball.vx * dt; ball.y += ball.vy * dt;

        if (ball.x - ball.r < LEFT) { ball.x = LEFT + ball.r; ball.vx = Math.abs(ball.vx) * 0.90; }
        if (ball.x + ball.r > RIGHT) { ball.x = RIGHT - ball.r; ball.vx = -Math.abs(ball.vx) * 0.90; }
        if (ball.y + ball.r > FLOOR) {
          ball.y = FLOOR - ball.r; ball.vy = -Math.abs(ball.vy) * 0.82; ball.vx *= 0.985;
        }
        if (ball.y - ball.r < CEILING) {
          ball.y = CEILING + ball.r; ball.vy = Math.abs(ball.vy) * 0.88;
          if (wallTone <= 0) {
            wallTone = 0.12;
            env.audio.tone({ f: 176, f2: 171, type: 'sine', dur: 0.10, vol: 0.024 });
          }
        }

        const q = geometry();
        let vx = ball.vx, vy = ball.vy, speed = Math.hypot(vx, vy);
        let hit = circleRect(ball, q.portrait, 0.86);
        if (hit) objectImpact(0, hit, speed, vx, vy);
        if (!success) {
          vx = ball.vx; vy = ball.vy; speed = Math.hypot(vx, vy);
          hit = circleCircle(ball, q.chandelier, 0.90);
          if (hit) objectImpact(1, hit, speed, vx, vy);
        }
        if (!success) {
          vx = ball.vx; vy = ball.vy; speed = Math.hypot(vx, vy);
          hit = circleCircle(ball, q.vase, 0.90);
          if (hit) objectImpact(2, hit, speed, vx, vy);
        }
        if (!success) circleRect(ball, q.pedestal, 0.82);

        const moved = Math.hypot(ball.x - oldX, ball.y - oldY);
        if (moved > 0.7) {
          trails.push({ x: ball.x, y: ball.y, life: 0.42, max: 0.42, r: ball.r * clamp(speed / 760, 0.3, 0.9) });
          if (trails.length > 26) trails.shift();
        }
      }

      function updateEffects(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) { particles.splice(i, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          const damp = Math.pow(0.97, dt * 60);
          p.vx *= damp; p.vy = p.vy * damp + 90 * dt;
        }
        for (let i = trails.length - 1; i >= 0; i--) {
          trails[i].life -= dt;
          if (trails[i].life <= 0) trails.splice(i, 1);
        }
        const recoilDamp = Math.exp(-8.5 * dt);
        for (const r of recoil) { r.x *= recoilDamp; r.y *= recoilDamp; }
        for (let i = 0; i < cooldown.length; i++) cooldown[i] = Math.max(0, cooldown[i] - dt);
        shake = Math.max(0, shake - dt * 24);
        flash = Math.max(0, flash - dt * 2.1);
        weak = Math.max(0, weak - dt);
        wallTone = Math.max(0, wallTone - dt);
      }

      function drawRoom(g) {
        g.fillStyle = CARD; g.fillRect(-30, -30, W + 60, H + 60);
        g.save();
        g.globalAlpha = 0.5; g.fillStyle = MUTED;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(W * 0.5, 118); g.lineTo(W, 0); g.closePath(); g.fill();
        g.globalAlpha = 0.72; g.fillStyle = BACKGROUND;
        g.beginPath(); g.moveTo(0, 0); g.lineTo(52, FLOOR); g.lineTo(0, H); g.closePath(); g.fill();
        g.beginPath(); g.moveTo(W, 0); g.lineTo(W - 52, FLOOR); g.lineTo(W, H); g.closePath(); g.fill();
        g.restore();

        g.fillStyle = MUTED; g.fillRect(0, FLOOR, W, H - FLOOR);
        g.save(); g.globalAlpha = 0.30; g.strokeStyle = BORDER; g.lineWidth = 1;
        for (let x = -W; x < W * 2; x += 36) {
          g.beginPath(); g.moveTo(W * 0.5, FLOOR); g.lineTo(x, H); g.stroke();
        }
        for (let i = 1; i <= 5; i++) {
          const y = FLOOR + (H - FLOOR) * Math.pow(i / 5, 1.55);
          g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
        }
        g.restore();
        g.strokeStyle = BORDER; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, CEILING); g.lineTo(W, CEILING); g.stroke();
      }

      function drawPortrait(g, p) {
        const awake = targetIndex === 0;
        g.save();
        g.translate(p.x + p.w * 0.5, p.y + p.h * 0.5); g.rotate(p.angle);
        g.globalAlpha = awake ? 1 : 0.44;
        const x = -p.w * 0.5, y = -p.h * 0.5;
        g.fillStyle = BACKGROUND; g.fillRect(x, y, p.w, p.h);
        g.strokeStyle = awake ? PORTRAIT : BORDER; g.lineWidth = 5; g.strokeRect(x, y, p.w, p.h);
        g.save(); g.beginPath(); g.rect(x + 6, y + 6, p.w - 12, p.h - 12); g.clip();
        g.strokeStyle = PORTRAIT; g.lineWidth = 2.2;
        for (let i = 0; i < 4; i++) {
          const yy = y + p.h * (0.34 + i * 0.1);
          g.beginPath(); g.moveTo(x - 8, yy);
          g.bezierCurveTo(x + p.w * 0.25, yy - p.h * 0.22, x + p.w * 0.55, yy + p.h * 0.21, x + p.w + 8, yy - p.h * 0.08);
          g.stroke();
        }
        g.restore(); g.restore();
      }

      function drawChandelier(g, c) {
        const awake = targetIndex === 1;
        g.save(); g.globalAlpha = awake ? 1 : 0.45;
        g.strokeStyle = BORDER; g.lineWidth = 2;
        g.beginPath(); g.moveTo(c.x, 0); g.lineTo(c.x, c.y - c.r); g.stroke();
        g.translate(c.x, c.y);
        g.rotate(Math.sin(t * 4) * 0.06 * (awake ? 2.4 : 0.35));
        g.strokeStyle = CHANDELIER; g.lineWidth = 3;
        g.beginPath(); g.arc(0, 0, c.r * 0.45, 0, TAU);
        for (let i = 0; i < 5; i++) {
          const a = TAU * i / 5 - Math.PI * 0.5;
          g.moveTo(Math.cos(a) * c.r * 0.35, Math.sin(a) * c.r * 0.35);
          g.lineTo(Math.cos(a) * c.r, Math.sin(a) * c.r);
          g.arc(Math.cos(a) * c.r, Math.sin(a) * c.r, 3.2, 0, TAU);
        }
        g.stroke(); g.restore();
      }

      function drawPedestal(g, q) {
        const awake = targetIndex === 2;
        g.save(); g.globalAlpha = awake ? 1 : 0.45;
        g.fillStyle = BACKGROUND; g.strokeStyle = BORDER; g.lineWidth = 2;
        roundedRectPath(g, q.pedestal.x, q.pedestal.y, q.pedestal.w, q.pedestal.h, 5);
        g.fill(); g.stroke();
        g.save(); g.translate(q.vase.x, q.vase.y);
        g.rotate((awake ? 1 : 0.2) * Math.sin(t * 13) * 0.045);
        g.fillStyle = VASE; g.beginPath();
        g.moveTo(-q.vase.r * 0.48, -q.vase.r * 0.76);
        g.bezierCurveTo(-q.vase.r * 1.1, -q.vase.r * 0.05, -q.vase.r * 0.8, q.vase.r * 0.82, 0, q.vase.r);
        g.bezierCurveTo(q.vase.r * 0.8, q.vase.r * 0.82, q.vase.r * 1.1, -q.vase.r * 0.05, q.vase.r * 0.48, -q.vase.r * 0.76);
        g.closePath(); g.fill(); g.restore(); g.restore();
      }

      function drawCracks(g) {
        g.save(); g.strokeStyle = FOREGROUND; g.lineWidth = 1.2; g.globalAlpha = 0.52;
        for (const c of cracks) {
          for (let i = 0; i < c.branches; i++) {
            const a = c.seed + TAU * i / c.branches, len = 12 + ((c.seed * 17 + i * 9) % 13);
            g.beginPath(); g.moveTo(c.x, c.y);
            g.lineTo(c.x + Math.cos(a) * len * 0.46, c.y + Math.sin(a) * len * 0.46);
            g.lineTo(c.x + Math.cos(a + 0.2) * len, c.y + Math.sin(a + 0.2) * len); g.stroke();
          }
        }
        g.restore();
      }

      function drawEffects(g) {
        for (const tr of trails) {
          g.globalAlpha = tr.life / tr.max * 0.20; g.fillStyle = MOON;
          g.beginPath(); g.arc(tr.x, tr.y, tr.r * tr.life / tr.max, 0, TAU); g.fill();
        }
        for (const p of particles) {
          g.globalAlpha = clamp(p.life / p.max, 0, 1); g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r * clamp(p.life / p.max, 0.25, 1), 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
      }

      function drawTether(g, bx, by, alpha) {
        const distance = Math.hypot(bx - anchor.x, by - anchor.y);
        g.save(); g.globalAlpha = alpha * (0.38 + Math.min(0.45, distance / 380));
        g.strokeStyle = TETHER; g.lineWidth = 2.2;
        g.beginPath(); g.moveTo(anchor.x, anchor.y);
        const sag = Math.min(54, distance * 0.17);
        g.quadraticCurveTo((anchor.x + bx) * 0.5 + Math.sin(t * 6) * 4, (anchor.y + by) * 0.5 + sag, bx, by); g.stroke();
        g.fillStyle = TETHER; g.beginPath(); g.arc(anchor.x, anchor.y, 4, 0, TAU); g.fill(); g.restore();
      }

      function drawMoon(g, x, y, r, alpha) {
        g.save(); g.globalAlpha = alpha;
        g.fillStyle = 'rgba(142,216,255,0.08)'; g.beginPath(); g.arc(x, y, r * 2.25, 0, TAU); g.fill();
        g.fillStyle = 'rgba(142,216,255,0.18)'; g.beginPath(); g.arc(x, y, r * 1.55, 0, TAU); g.fill();
        g.fillStyle = FOREGROUND; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.globalAlpha = alpha * 0.22; g.fillStyle = BACKGROUND;
        g.beginPath(); g.arc(x - r * 0.29, y - r * 0.1, r * 0.17, 0, TAU);
        g.arc(x + r * 0.21, y + r * 0.25, r * 0.11, 0, TAU); g.fill(); g.restore();
      }

      function drawTargetCue(g, q) {
        if (success) return;
        const center = targetCenter(q);
        const pulse = 0.5 + 0.5 * Math.sin(env.beatPhase() * Math.PI * 4);
        const early = clamp((1.65 - t) / 0.35, 0, 1);
        g.save();
        g.strokeStyle = t < 1.65 ? env.ink : TARGET_COLORS[targetIndex];
        g.globalAlpha = 0.42 + pulse * 0.38; g.lineWidth = 2.5;
        if (targetIndex === 0) {
          g.strokeRect(q.portrait.x - 9 - pulse * 3, q.portrait.y - 9 - pulse * 3,
            q.portrait.w + 18 + pulse * 6, q.portrait.h + 18 + pulse * 6);
        } else {
          const rr = (targetIndex === 1 ? q.chandelier.r : q.vase.r) + 13 + pulse * 5;
          g.beginPath(); g.arc(center.x, center.y, rr, 0, TAU); g.stroke();
        }
        g.setLineDash([4, 8]); g.lineDashOffset = -t * 22;
        g.globalAlpha = 0.20 + pulse * 0.25;
        g.beginPath(); g.arc(center.x, center.y, 43 + pulse * 10, 0, TAU); g.stroke();
        g.setLineDash([]);

        if (early > 0 && !everThrown) {
          g.globalAlpha = early * 0.46; g.strokeStyle = MOON; g.lineWidth = 2;
          g.setLineDash([5, 8]); g.lineDashOffset = -t * 28;
          g.beginPath(); g.moveTo(ball.x, ball.y);
          g.quadraticCurveTo((ball.x + center.x) * 0.5 + 28, (ball.y + center.y) * 0.5, center.x, center.y); g.stroke();
          g.setLineDash([]);
          g.globalAlpha = early * (0.35 + pulse * 0.45); g.strokeStyle = MOON; g.lineWidth = 2.5;
          g.beginPath(); g.arc(ball.x, ball.y, ball.r + 12 + pulse * 4, 0, TAU); g.stroke();
        }
        g.restore();
      }

      function drawGallery(g) {
        const q = geometry();
        drawRoom(g);
        drawTargetCue(g, q);
        drawPortrait(g, q.portrait);
        drawChandelier(g, q.chandelier);
        drawPedestal(g, q);
        drawCracks(g);
        drawEffects(g);
        drawTether(g, ball.x, ball.y, 1);
        drawMoon(g, ball.x, ball.y, ball.r, 1);
        if (weak > 0) {
          g.globalAlpha = weak * 0.55; g.strokeStyle = TARGET_COLORS[targetIndex]; g.lineWidth = 2;
          g.beginPath(); g.arc(weakX, weakY, 18 + (0.72 - weak) * 40, 0, TAU); g.stroke(); g.globalAlpha = 1;
        }
      }

      function easeInOut(v) {
        return v < 0.5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) * 0.5;
      }

      function drawOuterMuseum(g) {
        const e = easeInOut(reveal), scale = 1 - e * 0.55;
        g.fillStyle = BACKGROUND; g.fillRect(-30, -30, W + 60, H + 60);
        g.globalAlpha = 0.22; g.fillStyle = MUTED;
        g.fillRect(18, 0, 46, H); g.fillRect(W - 64, 0, 46, H); g.fillRect(0, 704, W, 140);
        g.globalAlpha = 1;

        const miniW = W * scale, miniH = H * scale;
        const miniX = (W - miniW) * 0.5, miniY = e * 54;
        g.save(); g.translate(miniX, miniY); g.scale(scale, scale); drawGallery(g); g.restore();

        g.globalAlpha = e;
        g.strokeStyle = BORDER; g.lineWidth = 3;
        g.strokeRect(miniX - 6, miniY - 8, miniW + 12, miniH + 16);
        g.globalAlpha = e * 0.24; g.strokeStyle = FOREGROUND; g.lineWidth = 1;
        g.beginPath(); g.moveTo(miniX + miniW * 0.14, miniY); g.lineTo(miniX + miniW * 0.43, miniY + miniH); g.stroke();
        g.globalAlpha = 1;

        if (reveal > 0.54) {
          const a = clamp((reveal - 0.54) / 0.28, 0, 1);
          const x = 36, y = 602, w = W - 72, h = 88;
          g.globalAlpha = a; g.fillStyle = CARD;
          roundedRectPath(g, x, y, w, h, 6); g.fill();
          g.textAlign = 'center'; g.textBaseline = 'middle';
          g.fillStyle = FOREGROUND; g.font = '700 13px "Segoe UI",system-ui,sans-serif';
          g.fillText('UNTITLED (WITH RETURNING OBJECT)', W * 0.5, y + 30);
          g.fillStyle = MUTED_FG; g.font = '700 11px "Consolas","Courier New",monospace';
          g.fillText('mixed media, recurring', W * 0.5, y + 57); g.globalAlpha = 1;
        }

        if (reveal > 0.62) {
          const escape = clamp((reveal - 0.62) / 0.38, 0, 1);
          const fromX = miniX + ball.x * scale, fromY = miniY + ball.y * scale;
          const toX = W * 0.82, toY = 540;
          const x = fromX + (toX - fromX) * escape;
          const y = fromY + (toY - fromY) * escape - Math.sin(escape * Math.PI) * 76;
          g.globalAlpha = escape * 0.55; g.strokeStyle = TETHER; g.lineWidth = 2;
          g.beginPath(); g.moveTo(fromX, fromY); g.quadraticCurveTo(W * 0.63, 420, x, y); g.stroke();
          g.globalAlpha = 1; drawMoon(g, x, y, ball.r * (0.55 + escape * 0.72), escape);
        }
      }

      function step(dt, inp) {
        t += dt;
        if (hitstop > 0) { hitstop -= dt; return; }
        updateEffects(dt);

        if (success) {
          successAge += dt;
          reveal = clamp(successAge / 0.72, 0, 1);
          if (successAge >= 0.78) done = 'won';
          return;
        }
        if (done !== 'pending') return;
        updateInput(inp);
        updatePhysics(dt);
      }

      function render(g) {
        const hx = Math.sin((t * 60 + 2.7) * 12.9898) * 43758.5453;
        const hy = Math.sin((t * 60 + 8.9) * 78.233) * 43758.5453;
        const sx = shake > 0 ? ((hx - Math.floor(hx)) - 0.5) * shake : 0;
        const sy = shake > 0 ? ((hy - Math.floor(hy)) - 0.5) * shake : 0;
        g.save(); g.translate(sx, sy);
        if (success) drawOuterMuseum(g); else drawGallery(g);
        g.restore();
        if (flash > 0) {
          g.fillStyle = 'rgba(245,243,239,' + (flash * 0.34).toFixed(3) + ')';
          g.fillRect(0, 0, W, H);
        }
      }

      return {
        step,
        render,
        result: () => done,
        timeout() {
          if (success) {
            reveal = 1; done = 'won';
          } else if (done === 'pending') {
            done = 'lost'; failMode = everThrown ? 'window' : 'untouched';
          }
          return done;
        },
        line: () => failMode === 'untouched' ? 'YOU LEFT THE MOON ON DEPOSIT' : 'YOU MISSED THE RETURN WINDOW',
        hint() {
          if (done !== 'pending' || success) return { type: 'wait', ms: 160 };
          const q = geometry(), target = targetCenter(q);
          /* The vase sits on a real collidable plinth. Aim at its upper bowl so the QA sling
             clears that plinth instead of demonstrating the perfectly valid miss first. */
          if (targetIndex === 2) target.y -= q.vase.r * 1.05;
          const dx = target.x - ball.x, dy = target.y - ball.y;
          const distance = Math.max(1, Math.hypot(dx, dy));
          const clearance = targetIndex === 0 ? 88 : (targetIndex === 1 ? q.chandelier.r : q.vase.r) + ball.r + 24;
          const travel = clamp(distance - clearance, 72, 150);
          return {
            type: 'drag',
            x: ball.x,
            y: ball.y,
            x2: clamp(ball.x + dx / distance * travel, LEFT + ball.r, RIGHT - ball.r),
            y2: clamp(ball.y + dy / distance * travel, CEILING + ball.r, FLOOR - ball.r),
            ms: 105,
          };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - Exactly one seeded portrait/chandelier/vase is awake per round; it moves in its donor-specific
     dodge axis, stays above y=430, and carries a persistent non-hue resonance outline.
   - Grabbing within 54px of the moon and releasing derives velocity from the latest <=140ms of
     pointer travel, retains the donor's short-drag fallback, and caps the throw at 900px/s.
   - Only an awake-object collision at 156/186/216px/s on difficulty 0/1/2 begins success; weak
     target hits and all wrong-object hits bounce, sound, and leave result() pending for a retry.
   - A successful resonance produces its 220/277.18/329.63Hz target pitch, 32 capped particles,
     a five-branch crack, recoil, 55ms hitstop, flash/shake, and the donor's four-note chord.
   - Success holds result() pending through a 720ms gallery pullback and escaping-moon reveal,
     then returns 'won'; timeout loses only when no successful resonance has already occurred.
   - hint() drags from the live moon to a release point 24px-plus-radii short of the live target,
     so the same release physics used by a player performs the winning collision.
   BUG-IS-GAME (do not fix):
   - The selected object is already avoiding the moon before the first hit. This slice begins at
     the instant the museum learned prey behavior; making every exhibit inert deletes its premise.
   - The red tether can bend an almost-correct throw back into the room. It is a returned object,
     not a free projectile; do not cut the tether or replace the sling with tap-to-shoot.
*/

/* ===== carts/42-last-party.js ===== */
/* LAST ONE AT THE PARTY — one red survivor, one lime traffic wedge, one committed dash. */
(function () {
  registerGame({
    id: 'last-party',
    title: 'LAST ONE AT THE PARTY',
    command: 'BREAK THROUGH!',
    family: 'tap',
    slotBeats: 6,
    create(env) {
      const W = env.W, H = env.H, R = env.rng, TAU = Math.PI * 2;
      const D = Math.max(0, Math.min(2, env.difficulty | 0));
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const lerp = (a, b, k) => a + (b - a) * k;

      /* Donor palette, quoted from LAST ONE AT THE PARTY. */
      const COL = {
        night: '#0b0714', night2: '#170a2e', pink: '#ff4fa3',
        cyan: '#45e7ff', lime: '#b9ff3d', tang: '#ff9f45',
        lav: '#c79bff', red: '#ff4033', ink: '#f3ecff', deep: '#7a1050',
      };
      const HEAVY = (n) => '900 ' + n + 'px "Arial Black","Segoe UI Black",sans-serif';

      /* tryDash()/update() donor constants. The 0.14 iframe is deliberately a hair shorter
         than the 0.16 dash; the authored geometry puts impact at 0.10-0.13s from frame one. */
      const DASH_TIME = 0.16;
      const DASH_SPEED = 1180;
      const DASH_IFRAME = 0.14;

      const player = {
        x: 88, y: 366, r: 18, dashing: 0, invuln: 0,
        hurt: 0, bob: R() * TAU,
      };
      const wedge = {
        x: 262 + D * 4, y: player.y, r: 24,
        vx: -[102, 124, 146][D], broken: false,
        phase: R() * TAU,
      };

      /* Deterministic donor-style stars. Nothing random happens from render(). */
      const starCols = [COL.pink, COL.cyan, COL.lav, COL.lime, COL.ink];
      const stars = [];
      for (let i = 0; i < 44; i++) {
        stars.push({
          x: R() * W, y: R() * H * 0.78, r: 0.5 + R() * 1.25,
          c: starCols[(R() * starCols.length) | 0], tw: R() * TAU,
          sp: 0.4 + R(),
        });
      }

      let t = 0, armedT = 0, tapped = false;
      let decided = null, announced = 'pending', announceT = 0;
      let hitstop = 0, shake = 0, flash = 0, failKind = 'timeout';
      const trails = [], particles = [], waves = [];

      function makeParticle(x, y, col, speed, life, wedgeBit) {
        const a = R() * TAU;
        return {
          x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
          r: 1.8 + R() * 4.8, life, max: life, col,
          rot: R() * TAU, spin: (R() * 2 - 1) * 12, wedge: !!wedgeBit,
        };
      }
      function burst(x, y, col, n, speed, wedgeBit) {
        for (let i = 0; i < n && particles.length < 100; i++) {
          particles.push(makeParticle(
            x, y, col, speed * (0.3 + R() * 0.7), 0.26 + R() * 0.34, wedgeBit,
          ));
        }
      }

      function dashSound() {
        /* Audio.dash(): noise(.14,.10,900) + sine 300 -> 700 over .14. */
        env.audio.noise({ dur: 0.14, vol: 0.18, hp: 520, lp: 1500 });
        env.audio.tone({ f: 300, f2: 700, type: 'sine', dur: 0.14, vol: 0.17 });
      }
      function impactSound() {
        /* Audio.big() under Audio.kill(): bass collapse plus candy-bright upward chirp. */
        const f = 300 + R() * 220;
        env.audio.tone({ f: 90, f2: 30, type: 'sawtooth', dur: 0.5, vol: 0.22 });
        env.audio.noise({ dur: 0.4, vol: 0.2, hp: 180, lp: 900 });
        env.audio.tone({ f, f2: 620 + R() * 280, type: 'triangle', dur: 0.12, vol: 0.18 });
        env.audio.noise({ dur: 0.05, vol: 0.1, hp: 1800 });
      }
      function hurtSound() {
        /* Audio.hurt(): saw 140 -> 60 plus a 700 Hz band of noise. */
        env.audio.tone({ f: 140, f2: 60, type: 'sawtooth', dur: 0.22, vol: 0.2 });
        env.audio.noise({ dur: 0.14, vol: 0.16, hp: 420, lp: 1050 });
      }

      function beginDash() {
        if (tapped || decided) return;
        tapped = true;
        player.dashing = DASH_TIME;
        player.invuln = Math.max(player.invuln, DASH_IFRAME);
        dashSound();
        shake = Math.max(shake, 4);
        for (let i = 0; i < 10; i++) {
          particles.push(makeParticle(
            player.x, player.y, COL.pink, 60 + R() * 160, 0.35, false,
          ));
        }
      }

      function win() {
        if (decided) return;
        decided = 'won';
        announceT = 0.28;
        hitstop = 0.075;
        shake = 15;
        flash = 0.5;
        wedge.broken = true;
        const ix = (player.x + wedge.x) * 0.5;
        waves.push({ x: ix, y: player.y, r: 8, max: 176, life: 0.42, full: 0.42 });
        burst(ix, player.y, COL.lime, 28, 340, true);
        burst(ix, player.y, COL.lav, 14, 220, false);
        impactSound();
      }

      function lose(kind) {
        if (decided || !env.armed()) return;
        decided = 'lost';
        announceT = 0.24;
        hitstop = 0.07;
        shake = 11;
        flash = 0.34;
        failKind = kind;
        player.hurt = 0.5;
        burst(player.x, player.y, COL.red, 18, 180, false);
        hurtSound();
      }

      function updateFx(dt) {
        shake = Math.max(0, shake - dt * 34);
        flash = Math.max(0, flash - dt * 2.8);
        player.hurt = Math.max(0, player.hurt - dt);
        for (let i = trails.length - 1; i >= 0; i--) {
          trails[i].life -= dt;
          if (trails[i].life <= 0) trails.splice(i, 1);
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
          p.rot += p.spin * dt;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (let i = waves.length - 1; i >= 0; i--) {
          const q = waves[i];
          q.life -= dt;
          q.r = lerp(q.r, q.max, Math.min(1, dt * 9));
          if (q.life <= 0) waves.splice(i, 1);
        }
      }

      function step(dt, inp) {
        t += dt;
        if (env.armed()) armedT += dt;

        if (decided) {
          announceT -= dt;
          if (hitstop > 0) hitstop = Math.max(0, hitstop - dt);
          else updateFx(dt);
          if (announceT <= 0) announced = decided;
          return;
        }

        /* Input is live from frame one. There is no hidden readiness state. */
        if (inp.justDown) beginDash();

        /* Donor update order: decrement dash, move at 1180, decrement iframe, then collide. */
        if (player.dashing > 0) {
          player.dashing = Math.max(0, player.dashing - dt);
          trails.push({ x: player.x, y: player.y, life: 0.30, max: 0.30 });
          if (trails.length > 14) trails.shift();
          player.x += DASH_SPEED * dt;
          for (let i = 0; i < 2 && particles.length < 100; i++) {
            particles.push(makeParticle(
              player.x - player.r, player.y + (R() - 0.5) * player.r,
              COL.lav, 30 + R() * 60, 0.3, false,
            ));
          }
        }
        if (player.invuln > 0) player.invuln = Math.max(0, player.invuln - dt);

        /* Traffic only advances once the shell arms. The command beat is a fair free read. */
        if (env.armed() && !wedge.broken) wedge.x += wedge.vx * dt;

        const touch = !wedge.broken &&
          Math.hypot(player.x - wedge.x, player.y - wedge.y) < player.r + wedge.r;
        if (touch) {
          if (player.dashing > 0 && player.invuln > 0) win();
          else lose('contact');
        }
        if (!wedge.broken && wedge.x < -wedge.r && env.armed()) lose('passed');
        player.x = clamp(player.x, player.r, W - player.r);
        updateFx(dt);
      }

      function blobPath(g, x, y, r, wob, amp) {
        g.beginPath();
        for (let i = 0; i <= 10; i++) {
          const a = i / 10 * TAU;
          const rr = r * (1 + Math.sin(a * 3 + wob) * amp);
          const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
          if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
        }
        g.closePath();
      }
      function wedgePath(g, r) {
        /* drawEnemy('traffic'), verbatim silhouette. */
        g.beginPath();
        g.moveTo(r, 0);
        g.lineTo(-r * 0.7, r * 0.8);
        g.lineTo(-r * 0.4, 0);
        g.lineTo(-r * 0.7, -r * 0.8);
        g.closePath();
      }

      function drawBackground(g) {
        const sky = g.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#0c0716');
        sky.addColorStop(0.55, '#120826');
        sky.addColorStop(1, '#1a0b30');
        g.fillStyle = sky; g.fillRect(0, 0, W, H);

        /* Donor's faint candy grid. */
        g.save();
        g.globalAlpha = 0.05; g.strokeStyle = COL.lav; g.lineWidth = 1;
        for (let x = 0; x < W; x += 64) {
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
        }
        for (let y = 0; y < H; y += 64) {
          g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
        }
        g.restore();

        for (const s of stars) {
          g.globalAlpha = Math.max(0, 0.3 + Math.sin(t * s.sp + s.tw) * 0.3);
          g.fillStyle = s.c;
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;

        /* The moon that isn't there: the donor's empty lavender circle and dark centre. */
        const mx = W * 0.5, my = H * 0.86, mr = Math.min(W, H) * 0.16;
        g.save(); g.globalAlpha = 0.5;
        g.strokeStyle = 'rgba(199,155,255,0.10)'; g.lineWidth = 2;
        g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.stroke();
        const mg = g.createRadialGradient(mx, my, mr * 0.2, mx, my, mr);
        mg.addColorStop(0, 'rgba(0,0,0,0.35)');
        mg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = mg; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
        g.restore();

        const v = g.createRadialGradient(
          W / 2, H / 2, Math.min(W, H) * 0.35,
          W / 2, H / 2, Math.max(W, H) * 0.75,
        );
        v.addColorStop(0, 'rgba(0,0,0,0)');
        v.addColorStop(1, 'rgba(0,0,0,0.55)');
        g.fillStyle = v; g.fillRect(0, 0, W, H);
      }

      function drawLane(g) {
        if (wedge.broken) return;
        const left = Math.min(player.x, wedge.x), right = Math.max(player.x, wedge.x);
        const pulse = 0.5 + 0.5 * Math.sin(t * 9 + wedge.phase);

        /* Shape and motion do the teaching: a striped impact corridor and leftward chevrons. */
        g.globalAlpha = 0.07 + pulse * 0.06;
        g.fillStyle = COL.lime;
        g.fillRect(left, player.y - 48, right - left, 96);
        g.globalAlpha = 0.45 + pulse * 0.25;
        g.strokeStyle = COL.lime; g.lineWidth = 2;
        g.setLineDash([10, 12]); g.lineDashOffset = t * 90;
        g.beginPath(); g.moveTo(player.x + 22, player.y); g.lineTo(wedge.x - 26, wedge.y); g.stroke();
        g.setLineDash([]);
        for (let x = player.x + 58; x < wedge.x - 34; x += 42) {
          g.beginPath();
          g.moveTo(x + 9, player.y - 10); g.lineTo(x - 3, player.y);
          g.lineTo(x + 9, player.y + 10); g.stroke();
        }
        g.globalAlpha = 1;
      }

      function drawTrail(g) {
        for (let i = 0; i < trails.length; i++) {
          const q = trails[i], a = clamp(q.life / q.max, 0, 1) * 0.34;
          g.save(); g.globalAlpha = a; g.translate(q.x, q.y);
          g.scale(0.96, 1.25);
          g.fillStyle = i & 1 ? COL.lav : COL.red;
          blobPath(g, 0, 0, player.r, t * 3 + i * 0.5, 0.14); g.fill();
          g.restore();
        }
      }

      function drawPlayer(g) {
        g.save(); g.translate(player.x, player.y);
        const squash = player.dashing > 0 ? 1.25 : 1;
        /* Donor deformation: scale(1/squash*1.2, squash). */
        if (player.dashing > 0) g.scale(1 / squash * 1.2, squash);
        const flashing = player.hurt > 0 && ((player.hurt * 20) | 0) % 2 === 0;
        const body = flashing ? '#ffffff' : COL.red;

        /* Fake glow with layered blobs; no looped shadowBlur. */
        g.globalAlpha = 0.12; g.fillStyle = COL.red;
        blobPath(g, 0, 0, player.r * 1.62, t * 1.4, 0.10); g.fill();
        g.globalAlpha = 0.22;
        blobPath(g, 0, 0, player.r * 1.3, t * 1.4, 0.12); g.fill();
        g.globalAlpha = 1; g.fillStyle = body;
        blobPath(g, 0, 0, player.r, t * 3 + player.bob, 0.14); g.fill();

        /* Chester-coded ears and eyes, source geometry enlarged only for a phone. */
        g.fillStyle = body;
        g.beginPath(); g.ellipse(-player.r * 0.7, -player.r * 0.5,
          player.r * 0.35, player.r * 0.55, -0.5, 0, TAU); g.fill();
        g.beginPath(); g.ellipse(player.r * 0.7, -player.r * 0.5,
          player.r * 0.35, player.r * 0.55, 0.5, 0, TAU); g.fill();
        g.fillStyle = COL.night;
        g.beginPath(); g.arc(-player.r * 0.32, -player.r * 0.05, player.r * 0.18, 0, TAU); g.fill();
        g.beginPath(); g.arc(player.r * 0.32, -player.r * 0.05, player.r * 0.18, 0, TAU); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(-player.r * 0.27, -player.r * 0.1, player.r * 0.06, 0, TAU); g.fill();
        g.beginPath(); g.arc(player.r * 0.37, -player.r * 0.1, player.r * 0.06, 0, TAU); g.fill();
        g.restore();
      }

      function drawWedge(g) {
        if (wedge.broken) return;
        const pulse = 0.5 + 0.5 * Math.sin(t * 10 + wedge.phase);
        g.save(); g.translate(wedge.x, wedge.y); g.rotate(Math.PI);
        g.globalAlpha = 0.10 + pulse * 0.06; g.fillStyle = COL.lime;
        wedgePath(g, wedge.r * 2.05); g.fill();
        g.globalAlpha = 0.20 + pulse * 0.10;
        wedgePath(g, wedge.r * 1.5); g.fill();
        g.globalAlpha = 1; wedgePath(g, wedge.r); g.fill();

        /* Shared ink mark wraps the actual wedge, not a secret timing window. */
        if (t < 1.5) {
          const e8 = 1 - ((env.beatPhase() * 2) % 1);
          g.globalAlpha = (0.24 + e8 * 0.56) * clamp((1.5 - t) / 0.35, 0, 1);
          g.strokeStyle = env.ink; g.lineWidth = 3;
          wedgePath(g, wedge.r + 8 + e8 * 5); g.stroke();
          g.globalAlpha = 1;
        }
        g.restore();
      }

      function render(g) {
        const sx = shake > 0 ? Math.sin(t * 171 + 0.7) * shake : 0;
        const sy = shake > 0 ? Math.sin(t * 193 + 2.1) * shake : 0;
        g.save(); g.translate(sx, sy);
        drawBackground(g);
        drawLane(g);

        /* The donor's short lime aim ray: there is only one enemy, so it cannot lie. */
        if (!wedge.broken) {
          const a = Math.atan2(wedge.y - player.y, wedge.x - player.x);
          g.globalAlpha = 0.25; g.strokeStyle = COL.lime; g.lineWidth = 2;
          g.beginPath(); g.moveTo(player.x, player.y);
          g.lineTo(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40); g.stroke();
          g.globalAlpha = 1;
        }

        drawTrail(g);
        for (const q of waves) {
          g.globalAlpha = clamp(q.life / q.full, 0, 1) * 0.82;
          g.strokeStyle = COL.lime; g.lineWidth = 6 * q.life / q.full + 1;
          g.beginPath(); g.arc(q.x, q.y, q.r, 0, TAU); g.stroke();
        }
        g.globalAlpha = 1;

        for (const p of particles) {
          const a = clamp(p.life / p.max, 0, 1);
          g.save(); g.globalAlpha = a; g.translate(p.x, p.y); g.rotate(p.rot);
          g.fillStyle = p.col;
          if (p.wedge) {
            g.beginPath(); g.moveTo(p.r * 1.5, 0);
            g.lineTo(-p.r, p.r); g.lineTo(-p.r * 0.5, 0);
            g.lineTo(-p.r, -p.r); g.closePath(); g.fill();
          } else {
            g.beginPath(); g.arc(0, 0, p.r, 0, TAU); g.fill();
          }

})();
