        skull.dmg = 1;
        skull.jaw = 0.5; skull.jawV = 0.8;                 // lolls open
        shake = Math.min(shake + 9, 20);
        sfxMiss();
        judgeLabel = { n: 'MISS', col: '#ff2f87', t: 0 };
        shard(LANE_X[n.lane], RECEPTOR_Y, 'rgba(255,47,135,0.85)', 8, 3.2, 150);
        cracks = Math.max(cracks, appetite < 25 ? 4 : appetite < 45 ? 3 : appetite < 70 ? 2 : 1);
        if (appetite <= 0) { if (env.armed()) die(); else appetite = 1; }
      };
      const pressLane = (ln) => {
        laneGlow[ln] = 1;
        let best = -1, bestD = 1e9;
        for (let i = nextIdx; i < notes.length; i++) {
          const n = notes[i], dtn = n.beat * curBL - curJt;
          if (dtn > W_MISS) break;
          if (n.dead || n.lane !== ln) continue;
          const d = Math.abs(dtn);
          if (d < bestD) { bestD = d; best = i; }
        }
        if (best < 0) {                                    // anti-mash tax: empty column costs appetite
          appetite = Math.max(env.armed() ? 0 : 1, appetite - 1);
          skull.jaw = 0.02; skull.jawV = 0;
          sfxChomp(0.35);
          shard(ln * COL_W + COL_W / 2, RECEPTOR_Y + 30, 'rgba(140,120,130,0.55)', 4, 2.2, 90);
          if (appetite <= 0 && env.armed()) die();
          return;
        }
        notes[best].dead = true;
        applyHit(bestD <= W_PERFECT ? 0 : bestD <= W_GREAT ? 1 : 2, ln);
        while (nextIdx < notes.length && notes[nextIdx].dead) nextIdx++;
      };
      const win = () => {
        done = 'won';
        skull.jaw = 0; skull.jawV = -0.5;                  // final slam
        sfxChomp(1); sfxPing();
        flash = Math.min(1, flash + 0.45);
        shard(SKULL_X, SKULL_Y + 30, '#7bf1a8', 16, 3.0, 240);
        shard(SKULL_X, SKULL_Y + 30, '#fff6e0', 8, 3.0, 180);
      };

      /* ---- drawing ---- */
      const arrowPath = (g, size) => {
        const h = size * 0.5, s = size * 0.23;
        g.beginPath();
        g.moveTo(0, -h); g.lineTo(h, 0); g.lineTo(s, 0);
        g.lineTo(s, h); g.lineTo(-s, h); g.lineTo(-s, 0);
        g.lineTo(-h, 0); g.closePath();
      };
      const drawSkull = (g) => {
        const jaw = skull.jaw, drop = jaw * 44;
        const bob = Math.sin(t * 2.1) * 5;
        const tilt = Math.sin(t * 1.35) * 0.035 + skull.vx * 0.0016;
        const hot = combo >= HOT_AT || done === 'won';
        const eye = hot ? '#7bf1a8' : '#ff2f87';
        g.save();
        g.translate(skull.x, SKULL_Y + bob);
        g.rotate(tilt);
        g.scale(SKULL_SC * (1 + skull.pulse * 0.09), SKULL_SC * (1 + skull.pulse * 0.09));
        /* hunger halo, additive */
        g.save();
        g.globalCompositeOperation = 'lighter';
        const glow = 0.25 + Math.min(combo, 80) / 80 * 0.75;
        const gc = hot ? '123,241,168' : '255,47,135';
        const rg = g.createRadialGradient(0, -20, 20, 0, -20, 215);
        rg.addColorStop(0, 'rgba(' + gc + ',' + (0.18 * glow) + ')');
        rg.addColorStop(1, 'rgba(' + gc + ',0)');
        g.fillStyle = rg;
        g.fillRect(-230, -250, 460, 460);
        g.restore();
        const dmg = skull.dmg;
        const bone = dmg > 0.05 ? 'rgb(255,' + Math.round(220 - dmg * 80) + ',' + Math.round(205 - dmg * 110) + ')' : '#f3e9d2';
        const shade = dmg > 0.05 ? 'rgb(' + Math.round(226 - dmg * 10) + ',' + Math.round(176 - dmg * 70) + ',' + Math.round(150 - dmg * 80) + ')' : '#d9c9a6';
        const boneGrad = (x, y, r) => {
          const bg = g.createRadialGradient(x, y, r * 0.08, x, y, r);
          bg.addColorStop(0, '#fffaf0'); bg.addColorStop(0.55, bone); bg.addColorStop(1, shade);
          return bg;
        };
        /* throat */
        const cavTop = 12, cavBot = 53 + drop + 14;
        const tg = g.createLinearGradient(0, cavTop, 0, cavBot);
        tg.addColorStop(0, hot ? 'rgba(24,10,22,1)' : 'rgba(26,6,20,1)');
        tg.addColorStop(1, 'rgba(6,1,7,1)');
        g.beginPath();
        g.moveTo(-44, cavTop); g.lineTo(44, cavTop); g.lineTo(38, cavBot); g.lineTo(-38, cavBot);
        g.closePath(); g.fillStyle = tg; g.fill();
        /* mandible — it drops, it does not swing */
        g.save();
        g.translate(0, drop);
        g.beginPath();
        g.moveTo(-56, 37); g.lineTo(-52, 66);
        g.bezierCurveTo(-32, 92, 32, 92, 52, 66);
        g.lineTo(56, 37); g.lineTo(42, 50);
        g.bezierCurveTo(22, 72, -22, 72, -42, 50);
        g.closePath();
        g.fillStyle = boneGrad(-40, 30, 120);
        g.strokeStyle = 'rgba(18,6,15,0.55)'; g.lineWidth = 3;
        g.fill(); g.stroke();
        g.fillStyle = '#fff6e0'; g.strokeStyle = 'rgba(18,6,15,0.32)'; g.lineWidth = 1.5;
        for (let i = 0; i < TOOTH_N; i++) {
          const tx = TOOTH_X0 + i * TOOTH_P;
          g.fillRect(tx, 37, TOOTH_W, 15); g.strokeRect(tx, 37, TOOTH_W, 15);
        }
        g.restore();
        /* cranium */
        g.beginPath();
        g.moveTo(-72, 6);
        g.bezierCurveTo(-100, -36, -84, -106, 0, -110);
        g.bezierCurveTo(84, -106, 100, -36, 72, 6);
        g.lineTo(62, 20);
        g.bezierCurveTo(40, 32, -40, 32, -62, 20);
        g.closePath();
        g.fillStyle = boneGrad(-46, -84, 150);
        g.strokeStyle = 'rgba(18,6,15,0.55)'; g.lineWidth = 3;
        g.fill(); g.stroke();
        g.save(); g.clip();
        g.fillStyle = 'rgba(120,88,72,0.22)';
        for (const sx of [-86, 86]) { g.beginPath(); g.ellipse(sx, -22, 26, 44, 0, 0, 6.2832); g.fill(); }
        g.beginPath(); g.ellipse(-8, -98, 86, 27, 0, 0, 6.2832);
        g.fillStyle = 'rgba(255,255,255,0.20)'; g.fill();
        g.restore();
        /* maxilla teeth */
        g.fillStyle = '#fff6e0'; g.strokeStyle = 'rgba(18,6,15,0.32)'; g.lineWidth = 1.5;
        for (let i = 0; i < TOOTH_N; i++) {
          const tx = TOOTH_X0 + i * TOOTH_P;
          g.fillRect(tx, 20, TOOTH_W, 17); g.strokeRect(tx, 20, TOOTH_W, 17);
        }
        /* nasal aperture */
        g.beginPath();
        g.moveTo(0, -10); g.lineTo(-13, 14); g.quadraticCurveTo(0, 20, 13, 14);
        g.closePath(); g.fillStyle = '#140611'; g.fill();
        /* sockets + pupils (the only shadowBlur uses: two per frame) */
        [-34, 34].forEach((ex, i) => {
          g.save();
          g.translate(ex, -36); g.rotate(i ? -0.16 : 0.16);
          g.beginPath(); g.ellipse(0, 0, 27, 31, 0, 0, 6.2832);
          g.fillStyle = '#140611'; g.fill();
          const pr = 9 + Math.sin(t * 6 + i) * 1.4 + Math.min(combo * 3, 100) / 100 * 7;
          g.shadowColor = eye; g.shadowBlur = 22 + Math.min(combo * 3, 100) * 0.25;
          g.fillStyle = eye;
          g.beginPath(); g.arc(0, 4 - jaw * 4, pr, 0, 6.2832); g.fill();
          g.restore();
        });
        /* damage cracks */
        if (cracks > 0) {
          g.strokeStyle = 'rgba(20,6,17,0.7)'; g.lineWidth = 2.4;
          for (let c = 0; c < Math.min(cracks, CRACKS.length); c++) {
            const p = CRACKS[c];
            g.beginPath(); g.moveTo(p[0][0], p[0][1]);
            for (let i = 1; i < p.length; i++) g.lineTo(p[i][0], p[i][1]);
            g.stroke();
          }
        }
        g.restore();
      };

      return {
        step(dt, inp) {
          t += dt;
          curBL = env.beatLen();
          for (let i = 0; i < 4; i++) laneGlow[i] = Math.max(0, laneGlow[i] - dt * 4.2);
          shake = Math.max(0, shake - dt * 42);
          flash = Math.max(0, flash - dt * 3.2);
          kickPulse = Math.max(0, kickPulse - dt * 4.5);
          skull.pulse = Math.max(0, skull.pulse - dt * 3.4);
          skull.dmg = Math.max(0, skull.dmg - dt * 2.2);
          if (judgeLabel) judgeLabel.t += dt;
          for (let i = popups.length - 1; i >= 0; i--) { popups[i].t += dt; if (popups[i].t > 0.9) popups.splice(i, 1); }
          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt;
            p.rot += p.vr * dt; p.life -= p.decay * dt;
            if (p.life <= 0) particles.splice(i, 1);
          }
          if (done !== 'pending') {
            if (done === 'won') {                          // settle home, jaw shut, chewing satisfied
              skull.x += skull.vx; skull.vx += (SKULL_X - skull.x) * 0.16; skull.vx *= 0.78;
              skull.jawV += (0 - skull.jaw) * 340 * dt - skull.jawV * 24 * dt;
              skull.jaw = Math.max(0, Math.min(0.82, skull.jaw + skull.jawV * dt));
            }
            return;
          }
          beatPos += dt / curBL;
          curJt = beatPos * curBL - env.calib;             // judged time: chart clock minus player latency
          const slotI = Math.floor(beatPos * 4);
          while (lastSlot < slotI) { lastSlot++; slotAudio(lastSlot); }
          if (inp.justDown) pressLane(Math.max(0, Math.min(3, Math.floor(inp.x / COL_W))));
          if (done !== 'pending') return;
          while (nextIdx < notes.length) {                 // late notes fly past the mouth and starve it
            const n = notes[nextIdx];
            if (!n.dead && n.beat * curBL >= curJt - W_MISS) break;
            if (!n.dead) missNote(n);
            nextIdx++;
            if (done !== 'pending') return;
          }
          if (nextIdx >= notes.length && appetite > 0) { win(); return; }
          /* jaw anticipation — the skull telegraphs the chart */
          let nearest = 1e9, nearLane = -1;
          const nowS = beatPos * curBL;
          for (let i = nextIdx; i < notes.length; i++) {
            const d = notes[i].beat * curBL - nowS;
            if (d > 0.34) break;
            if (notes[i].dead) continue;
            if (d < nearest && d > -0.05) { nearest = d; nearLane = notes[i].lane; }
          }
          const target = nearest < 0.34 ? 0.13 + (1 - nearest / 0.34) * 0.52 : 0.13;
          skull.jawV += (target - skull.jaw) * 340 * dt - skull.jawV * 24 * dt;
          skull.jaw = Math.max(0, Math.min(0.82, skull.jaw + skull.jawV * dt));
          const homeX = (nearLane >= 0 && nearest < 0.34) ? SKULL_X + (LANE_X[nearLane] - SKULL_X) * 0.30 : SKULL_X;
          skull.x += skull.vx;
          skull.vx += (homeX - skull.x) * 0.10;
          skull.vx *= 0.85;
        },

        render(g) {
          const sx = (hash(t * 7.31) - 0.5) * shake, sy = (hash(t * 11.7) - 0.5) * shake;
          g.save();
          g.translate(sx, sy);
          /* background — gradients are built once and reused; the kick throb is a
             transform + alpha on a cached radial, not a new gradient every frame */
          if (!GRD.bgLin) {
            GRD.bgLin = g.createLinearGradient(0, 0, 0, H);
            GRD.bgLin.addColorStop(0, '#1c0a1e'); GRD.bgLin.addColorStop(0.42, '#12060f'); GRD.bgLin.addColorStop(1, '#07030a');
            GRD.halo = g.createRadialGradient(195, 114, 16, 195, 114, 135);
            GRD.halo.addColorStop(0, 'rgba(74,29,92,1)');
            GRD.halo.addColorStop(1, 'rgba(74,29,92,0)');
            GRD.lane = g.createLinearGradient(0, RECEPTOR_Y, 0, H);
            GRD.lane.addColorStop(0, 'rgba(243,233,210,1)');
            GRD.lane.addColorStop(1, 'rgba(243,233,210,0)');
          }
          g.fillStyle = GRD.bgLin; g.fillRect(-8, -8, W + 16, H + 16);
          g.save();
          g.globalAlpha = 0.5 + kickPulse * 0.3;
          const hs = 1 + kickPulse * 0.38;                 // 135 -> ~186 px radius
          g.translate(195, 114); g.scale(hs, hs); g.translate(-195, -114);
          g.fillStyle = GRD.halo; g.fillRect(-40, -40, W + 80, H + 80);
          g.restore();
          /* ghost combo, behind the lanes — intentional ambience */
          if (combo >= 2) {
            g.globalAlpha = Math.min(0.33, 0.13 + combo * 0.005);
            g.font = '900 146px "Arial Black","Segoe UI Black",sans-serif';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = '#f3e9d2';
            g.fillText(String(combo), 195, 433);
            g.globalAlpha = 1;
          }
          const bp = env.beatPhase();
          const pulse = bp < 0.15 ? 1 - bp / 0.15 : 0;
          if (!exploded) {
            /* lane fields */
            for (let i = 0; i < 4; i++) {
              const x = LANE_X[i] - 32.5;
              const a = 0.045 + Math.min(laneGlow[i], 1) * 0.16 + (bp < 0.12 ? 0.02 : 0);
              /* one cached lane gradient, alpha-modulated per lane (identical result,
                 four fewer gradient allocations every frame) */
              g.globalAlpha = a;
              g.fillStyle = GRD.lane; g.fillRect(x, RECEPTOR_Y, 65, H - RECEPTOR_Y);
              g.globalAlpha = 1;
              g.fillStyle = 'rgba(243,233,210,0.05)';
              g.fillRect(x, RECEPTOR_Y, 1, H - RECEPTOR_Y); g.fillRect(x + 64, RECEPTOR_Y, 1, H - RECEPTOR_Y);
            }
            g.fillStyle = 'rgba(255,47,135,0.32)';
            g.fillRect(20, RECEPTOR_Y - 1, W - 40, 2);
            /* receptors (glow faked with layered fills — no per-lane shadowBlur) */
            for (let i = 0; i < 4; i++) {
              const gl = laneGlow[i];
              g.save();
              g.translate(LANE_X[i], RECEPTOR_Y);
              g.rotate(LANE_ROT[i]);
              const sc = 1 + pulse * 0.05 + gl * 0.16;
              g.scale(sc, sc);
              if (gl > 0.02) {
                arrowPath(g, ARROW * 1.35);
                g.fillStyle = 'rgba(255,47,135,' + Math.min(0.5, gl * 0.28) + ')'; g.fill();
                arrowPath(g, ARROW);
                g.fillStyle = 'rgba(255,47,135,' + Math.min(1, gl * 0.45) + ')'; g.fill();
                g.lineWidth = 3; g.strokeStyle = '#fff6e0'; g.stroke();
              } else {
                arrowPath(g, ARROW);
                g.lineWidth = 3;
                g.strokeStyle = 'rgba(243,233,210,' + (0.30 + pulse * 0.18) + ')'; g.stroke();
              }
              if (t < 1.5) {                               // shared marking: ink rim, 8th-note pulse
                arrowPath(g, ARROW * 1.3);
                g.lineWidth = 2;
                g.globalAlpha = 0.35 + 0.3 * Math.abs(Math.sin(bp * Math.PI * 2));
                g.strokeStyle = env.ink; g.stroke();
                g.globalAlpha = 1;
              }
              g.restore();
            }
            /* arrows (glow faked with an oversize fill) */
            for (let i = nextIdx; i < notes.length; i++) {
              const n = notes[i];
              const dB = n.beat - beatPos;
              if (dB * curBL > 2.2) break;
              if (n.dead) continue;
              const y = RECEPTOR_Y + dB * PPB;
              if (y < -70 || y > H + 70) continue;
              const col = KIND_COL[n.kind];
              g.save();
              g.translate(LANE_X[n.lane], y);
              g.rotate(LANE_ROT[n.lane]);
              arrowPath(g, ARROW * 1.28);
              g.globalAlpha = 0.28; g.fillStyle = col; g.fill(); g.globalAlpha = 1;
              arrowPath(g, ARROW);
              g.fillStyle = col; g.fill();
              g.lineWidth = 2.5; g.strokeStyle = 'rgba(18,6,15,0.85)'; g.stroke();
              g.restore();
            }
            drawSkull(g);
          }
          /* particles: rotating bone shards */
          for (const p of particles) {
            g.save();
            g.translate(p.x, p.y); g.rotate(p.rot);
            g.globalAlpha = Math.max(0, Math.min(1, p.life));
            g.fillStyle = p.col;
            g.fillRect(-p.r / 2, -p.r * 0.35, p.r, p.r * 0.7);
            g.restore();
          }
          g.globalAlpha = 1;
          /* judgment label */
          if (judgeLabel && judgeLabel.t < 0.5) {
            const q = judgeLabel.t;
            const sc = q < 0.12 ? 1.5 - (q / 0.12) * 0.5 : 1;
            g.save();
            g.translate(195, 233); g.scale(sc, sc);
            g.globalAlpha = q < 0.35 ? 1 : Math.max(0, 1 - (q - 0.35) / 0.15);
            g.font = '900 24px "Arial Black","Segoe UI Black",sans-serif';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = judgeLabel.col;
            g.fillText(judgeLabel.n, 0, 0);
            g.restore(); g.globalAlpha = 1;
          }
          /* milestone popups */
          for (const p of popups) {
            g.globalAlpha = Math.max(0, 1 - p.t / 0.9);
            g.font = '900 20px "Arial Black","Segoe UI Black",sans-serif';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = p.col;
            g.fillText(p.txt, 195, 300 - p.t * 36);
            g.globalAlpha = 1;
          }
          /* HUD */
          g.font = '700 12px "Consolas","Courier New",monospace';
          g.textAlign = 'left'; g.textBaseline = 'middle';
          g.fillStyle = '#f3e9d2';
          g.fillText('SCORE ' + String(score).padStart(7, '0'), 12, 30);
          const bx = 237, by = 24, bw = 141, bh = 13;
          g.font = '700 9px "Consolas","Courier New",monospace';
          g.fillText('APPETITE', bx, by - 8);
          g.strokeStyle = '#f3e9d2'; g.lineWidth = 2;
          g.strokeRect(bx, by, bw, bh);
          const ap = Math.max(0, Math.min(1, appetite / 100));
          g.fillStyle = appetite < 25 ? '#ff2f87' : appetite < 55 ? '#ffb340' : '#7bf1a8';
          g.fillRect(bx + 1, by + 1, (bw - 2) * ap, bh - 2);
          if (appetite < 25 && done === 'pending') {
            g.globalAlpha = 0.22 + 0.24 * Math.sin(t * 12);
            g.fillStyle = '#ff2f87'; g.fillRect(bx + 1, by + 1, bw - 2, bh - 2);
            g.globalAlpha = 1;
          }
          g.fillStyle = 'rgba(243,233,210,0.4)';
          for (let q = 1; q < 4; q++) g.fillRect(bx + (bw / 4) * q, by + 2, 1, bh - 4);
          /* tap-zone affordance boxes along the bottom edge */
          for (let i = 0; i < 4; i++) {
            const cx = i * COL_W + COL_W / 2;
            g.strokeStyle = 'rgba(243,233,210,' + (0.12 + Math.min(laneGlow[i], 1) * 0.25) + ')';
            g.lineWidth = 2;
            g.strokeRect(cx - 30.5, H - 74, 61, 58);
            g.save();
            g.translate(cx, H - 45); g.rotate(LANE_ROT[i]);
            arrowPath(g, 20);
            g.strokeStyle = 'rgba(243,233,210,' + (0.18 + Math.min(laneGlow[i], 1) * 0.4) + ')';
            g.lineWidth = 2; g.stroke();
            g.restore();
          }
          /* combo-milestone flash, capped so it stings without blinding */
          if (flash > 0.01) {
            g.fillStyle = 'rgba(255,255,255,' + Math.min(0.22, flash * 0.45) + ')';
            g.fillRect(0, 0, W, H);
          }
          if (done === 'lost') {
            g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(0, 0, W, H);
            g.font = '900 40px "Arial Black","Segoe UI Black",sans-serif';
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillStyle = '#ff2f87';
            g.fillText('STARVED', 195, 320);
            g.font = '700 12px "Consolas","Courier New",monospace';
            g.fillStyle = '#f3e9d2';
            g.fillText('the appetite ran out before the song did', 195, 352);
          }
          g.restore();
          /* CRT: vignette + scanlines, unshaken */
          const vg = g.createRadialGradient(195, 422, 160, 195, 422, 560);
          vg.addColorStop(0, 'rgba(0,0,0,0)');
          vg.addColorStop(1, 'rgba(0,0,0,0.6)');
          g.fillStyle = vg; g.fillRect(0, 0, W, H);
          g.fillStyle = 'rgba(0,0,0,0.20)';
          for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
        },

        result: () => done,
        timeout: () => (appetite > 0 ? 'won' : 'lost'),
        line: () => 'YOU LET THE SKULL SKIP DINNER',
        hint() {
          if (done !== 'pending') return { type: 'wait', ms: 200 };
          for (let i = nextIdx; i < notes.length; i++) {
            const n = notes[i];
            if (n.dead) continue;
            const e = curJt - n.beat * curBL;              // + = late
            if (e >= -0.10) return { type: 'tap', x: n.lane * COL_W + COL_W / 2, y: 640 };
            return { type: 'wait', ms: Math.max(16, Math.min(120, Math.round((-e - 0.10) * 1000))) };
          }
          return { type: 'wait', ms: 100 };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - Arrows land ON beats: every note.beat is an integer multiple of 0.25 on the shell grid and
     its glyph crosses RECEPTOR_Y=205 exactly when beatPos === note.beat (y = 205 + (beat-beatPos)*PPB).
   - Travel time is 2.0 beats from screen bottom (y = H+60) to the receptor row (PPB = (844+60-205)/2).
   - Judgment tiers use donor windows vs judged time (chart clock - env.calib):
     |err| <= 0.045 PERFECT / 0.090 GREAT / 0.135 GOOD; notes later than 0.185s auto-MISS.
   - Appetite starts 55; hit heals +1.9/+1.1/+0.2, MISS -18, empty-column tap -1 (clamped 0..100);
     'lost' fires the same frame appetite hits 0 (skull shatters into 48 shards, shake 22, STARVED).
   - 'won' fires when every chart note is resolved and appetite > 0 (jaw slam + chomp + ping,
     eyes flash green); timeout() returns won iff appetite > 0.
   - Difficulty 0 chart is quarters only (24 notes incl. the last bite); d1 adds pink eighth
     offbeats; d2 adds green sixteenth pickups — kind colors #fff6e0/#ff2f87/#7bf1a8 per donor.
   BUG-IS-GAME (do not fix):
   - Appetite starts at 55, not 100 — half-starved by design; eating builds the safety margin.
   - Tapping an empty column drains appetite (-1) with a weak dry chomp — the anti-mash tax;
     removing it makes mash-all-columns optimal.
   - MISS "heals" -18 through the same heal field as the hits — reads like a typo, is the mechanism.
   - The mandible translates straight down (drop = jaw*44), zero rotation — "it drops, it does
     not swing".
   - kickPulse and the drum synth fire from chart-clock slot crossings in step(), never from
     audio callbacks — visuals and sound stay locked to judged time.
   - The 146px ghost combo number behind the lanes at alpha <= 0.33 is intentional ambience.
   - laneGlow is written as 1.4 on hit — deliberately over 1.0 to overdrive the receptor flare.
   - The first ~2 beats of chart are empty runway — the lanes breathe before the first bite.
*/

/* ===== carts/31-glass.js ===== */
/* SUGARGLASS — the ink diamond throws a string: guard every solid, refuse every hollow */
(function () {
  registerGame({
    id: 'glass',
    title: 'SUGARGLASS',
    command: 'READ IT!',
    family: 'tap',
    slotBeats: 9,
    create(env) {
      var W = env.W, H = env.H;

      /* ---------------- donor palette, verbatim ---------------- */
      var INK = '#150610', ACID = '#F2FF3B', CYAN = '#22F0FF', BONE = '#FFF3E6', GREY = '#7a6a72';
      var VOID = '#12060E';                                   // the donor's body colour, seen through the diamond
      /* the field colour IS the readout. BUBBLEGUM / TANGERINE / VIOLET / SUGARGLASS —
         one step per strike you survive, so the light field means the string is nearly done. */
      var FIELD = [[255, 61, 151], [240, 73, 10], [139, 61, 255], [255, 240, 220]];
      var FGC = [[255, 243, 230], [255, 243, 230], [255, 243, 230], [21, 6, 16]]; // BONE, flipping to INK on the light field

      /* ---------------- donor layout, ported as W/H fractions ----------------
         ONE deviation: the guard line sits at H*0.66 instead of the donor's H*0.72, so the
         whole read — opponent, track, line, bar — lives inside the top two thirds and the
         thumb never covers it. Travel times are scaled by the same 0.88, which keeps every
         strike's on-screen SPEED identical to the donor's. */
      var OY = H * 0.22, GY = H * 0.66, TRACK = GY - OY;
      var BARW = W * 0.62, BARX = W / 2 - BARW / 2;
      var PIPY = 300;                                         // string counter, clear of the guard arc (bottom y 264)

      /* ---------------- tuning ---------------- */
      var diff = Math.max(0, Math.min(2, env.difficulty | 0));
      /* Invisible scaffolding: the window is generous while you are still finding the verb,
         then quietly tightens. Never announced. 180 + [55,25,0], exactly as the donor. */
      var PARRY_WIN = 180 + [55, 25, 0][diff];
      var PERFECT_WIN = 76, RECOVERY = 300, HITSTOP = 95;
      var TYPE = {
        jab: { travel: 414, size: 16 },                       // donor 470 * 0.88
        heavy: { travel: 810, size: 30 },                     // donor 920 * 0.88
        feint: { travel: 739, size: 28 },                     // donor 840 * 0.88
      };

      /* ---------------- the string (every roll at create — deterministic) ----------------
         3-4 strikes down one track. Some are real and must be guarded; some are HOLLOW
         feints and must be let through. Index 0 is never a feint: the first strike teaches
         the verb before the game ever lies to you. */
      var N = [3, 4, 4][diff];
      var NF = diff === 0 ? 1 : diff === 1 ? (env.rng() < 0.5 ? 1 : 2) : 2;
      var SPACE = [640, 520, 460][diff];                      // ms between arrivals
      var bl = env.beatLen() * 1000;
      /* The lead must outlast a reflex tap at the whistle: PARRY_WIN + RECOVERY = 535ms of
         dead thumb, plus the count-in beat, plus slack. Instinct must never cost the run. */
      var LEAD = bl + 950;
      var slots = [];
      for (var q = 1; q < N; q++) slots.push(q);
      for (var q2 = slots.length - 1; q2 > 0; q2--) {
        var j2 = (env.rng() * (q2 + 1)) | 0, sw = slots[q2]; slots[q2] = slots[j2]; slots[j2] = sw;
      }
      var isFeint = {};
      for (var q3 = 0; q3 < NF; q3++) isFeint[slots[q3]] = 1;

      /* fit the string inside (count-in beat + slot), hitstop included; spacing gives first */
      var budget = (1 + 9) * bl - 240;
      var stops = (N - NF) * 130;
      while (SPACE > 380 && LEAD + (N - 1) * SPACE + stops + 200 > budget) SPACE -= 20;

      var plan = [];
      for (var i0 = 0; i0 < N; i0++) {
        var f0 = !!isFeint[i0];
        var kind = f0 ? 'feint'
          : (i0 === 0 && diff === 0) ? 'heavy'                // the teacher: slow, huge, honest
            : (env.rng() < 0.45 ? 'heavy' : 'jab');
        var arrive = LEAD + i0 * SPACE;
        plan.push({
          kind: kind, feint: f0, travel: TYPE[kind].travel, size: TYPE[kind].size,
          arrive: arrive, spawn: arrive - TYPE[kind].travel,
          live: false, done: false, p: 0, wob: env.rng() * 6.283,
        });
      }

      /* ---------------- audio: donor recipes on the shell's sfx bus ---------------- */
      var VS = 3.0;
      function T(o) { o.vol = Math.min(0.34, (o.vol == null ? 0.1 : o.vol) * VS); env.audio.tone(o); }
      function NZ(o) { o.vol = Math.min(0.30, o.vol * VS); env.audio.noise(o); }
      var sfx = {
        /* the pitch IS the type tell — high 880 = fast jab, low 420 = slow heavy */
        tickReal: function (k) { T({ f: k === 'jab' ? 880 : 420, type: 'triangle', dur: 0.05, vol: 0.055, attack: 0.002 }); },
        /* and a feint STUTTERS in the ear before it stutters on the track: two buzzed
           ticks 100ms apart, sliding down. Nothing honest ever double-ticks. */
        tickFeint: function () {
          T({ f: 300, f2: 210, type: 'sawtooth', dur: 0.07, vol: 0.05, attack: 0.002 });
          T({ f: 300, f2: 210, type: 'sawtooth', dur: 0.07, vol: 0.05, attack: 0.002, t: 0.1 });
        },
        raise: function () { T({ f: 620, type: 'triangle', dur: 0.035, vol: 0.07, attack: 0.001 }); },
        parry: function (p) {                                 // a perfect is the same chord a fifth up
          T({ f: p ? 1760 : 1320, type: 'square', dur: 0.09, vol: 0.22, attack: 0.001 });
          T({ f: p ? 2640 : 1980, type: 'square', dur: 0.06, vol: 0.10, attack: 0.001 });
          NZ({ dur: 0.07, vol: 0.18, hp: 2600 });
        },
        held: function () { T({ f: 990, f2: 1320, type: 'sine', dur: 0.09, vol: 0.06, attack: 0.002 }); },
        whiff: function () { T({ f: 150, type: 'sine', dur: 0.05, vol: 0.10, attack: 0.002 }); },
        hurt: function () {
          T({ f: 70, type: 'sine', dur: 0.30, vol: 0.42, attack: 0.002 });
          NZ({ dur: 0.12, vol: 0.14, hp: 300 });
        },
        brk: function () { T({ f: 880, f2: 90, type: 'sawtooth', dur: 0.55, vol: 0.22, attack: 0.01 }); },
        riposte: function () {
          T({ f: 110, type: 'sawtooth', dur: 0.45, vol: 0.4, attack: 0.002 });
          T({ f: 220, type: 'square', dur: 0.3, vol: 0.2, attack: 0.002 });
          NZ({ dur: 0.25, vol: 0.3, hp: 500 });
        },
        win: function () {
          var f = [523, 659, 784, 1046];
          for (var i = 0; i < 4; i++) T({ f: f[i], type: 'triangle', dur: 0.45, vol: 0.2, attack: 0.01, t: 0.12 + i * 0.11 });
        },
      };

      /* ---------------- state ---------------- */
      var gt = 0, rt = 0, freeze = 0;                         // game ms (halts on hitstop) / real ms
      var parryStart = -1e9;
      var done = 'pending', failKind = '', word = '';
      var handled = 0;
      var shake = 0, flash = 0, flashCol = CYAN;
      var sparks = [];
      var fPrev = 0, fCur = 0, fieldK = 1;
      var nudge = 1;
      var hPrev = -1, hWait = 0, hOver = 140;                 // QA-bot poll cadence, learned in hint()

      function guardState() {
        var since = gt - parryStart;
        if (since < PARRY_WIN) return 'active';
        if (since < PARRY_WIN + RECOVERY) return 'recover';
        return 'ready';
      }
      function progressOf(s) {
        var u = (gt - s.spawn) / s.travel;
        if (u < 0) return 0;
        if (!s.feint) return u < 1 ? u : 1;
        /* the donor's stutter curve, verbatim: runs to 0.60, WALKS BACKWARD to 0.42,
           then snaps. Nothing real on this track ever moves up the screen. */
        if (u < 0.42) return 0.60 * u / 0.42;
        if (u < 0.58) return 0.60 - 0.18 * ((u - 0.42) / 0.16);
        var k = (u - 0.58) / 0.42;
        return Math.min(1, 0.42 + 0.58 * (k * k * k * 0.55 + k * 0.45));
      }
      function burst(x, y, n, spd, col, vyk) {
        for (var i = 0; i < n; i++) {
          var a = env.rng() * 6.283, s = spd * (0.4 + env.rng());
          sparks.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * vyk, life: 1, col: col || (i % 2 ? BONE : CYAN) });
        }
        if (sparks.length > 120) sparks.splice(0, sparks.length - 120);
      }
      function step1() {
        handled++;
        fPrev = fCur; fCur = Math.min(3, handled); fieldK = 0;
        nudge = 0;
        if (handled >= N) win();
      }
      function tap() {
        if (done !== 'pending') return;
        var since = gt - parryStart;
        if (since < PARRY_WIN + RECOVERY) {                   // active or recovering — no double dipping
          if (since >= PARRY_WIN) { sfx.whiff(); shake = Math.max(shake, 2); }
          return;
        }
        parryStart = gt;                                      // raising guard is a commitment; arrival resolves it
        sfx.raise();
      }
      function parry(perfect) {
        parryStart = -1e9;                                    // a clean parry cancels recovery. this is the whole game.
        freeze = perfect ? HITSTOP + 35 : HITSTOP;
        shake = perfect ? 13 : 8;
        flash = 1; flashCol = perfect ? BONE : CYAN;
        sfx.parry(perfect);
        burst(W / 2, GY, perfect ? 22 : 13, perfect ? 4.5 : 3, perfect ? BONE : CYAN, 0.8);
        step1();
      }
      function refuse() {
        shake = Math.max(shake, 3);
        flash = Math.max(flash, 0.35); flashCol = BONE;
        sfx.held();
        burst(W / 2, GY, 9, 2.2, BONE, 0.6);
        step1();
      }
      function lose(kind, w) {
        if (!env.armed()) return;                             // unreachable: the first arrival is a beat past the count-in
        done = 'lost'; failKind = kind; word = w;
        freeze = 130; shake = 20; flash = 1; flashCol = ACID;
        sfx.hurt();
        burst(W / 2, GY, 18, 4, ACID, 1);
      }
      function win() {
        done = 'won'; word = 'BREAK';
        freeze = 0; shake = 26; flash = 1; flashCol = CYAN;
        sfx.brk(); sfx.riposte(); sfx.win();
        burst(W / 2, OY, 40, 7, null, 1);
      }
      function land(s) {
        s.done = true;
        var active = guardState() === 'active';
        if (s.feint) { if (active) lose('bait', 'BAITED'); else refuse(); }
        else { if (active) parry(gt - parryStart <= PERFECT_WIN); else lose('landed', 'AGAIN'); }
      }
      function decay(ms, frozen) {
        var f = ms / 16.67;
        shake *= Math.pow(0.86, f);
        flash *= Math.pow(0.80, f);
        if (fieldK < 1) fieldK = Math.min(1, fieldK + ms / 200);
        for (var i = sparks.length - 1; i >= 0; i--) {
          var s = sparks[i];
          if (!frozen) { s.x += s.vx * f; s.y += s.vy * f; s.vy += 0.22 * f; s.life -= 0.028 * f; }
          if (s.life <= 0) sparks.splice(i, 1);
        }
      }

      /* ---------------- drawing ---------------- */
      function rr(g, x, y, w, h, r) {
        g.beginPath();
        g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
        g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
      }
      function mix(a, b, k) {
        return 'rgb(' + Math.round(a[0] + (b[0] - a[0]) * k) + ',' + Math.round(a[1] + (b[1] - a[1]) * k) +
          ',' + Math.round(a[2] + (b[2] - a[2]) * k) + ')';
      }
      function heavyFont(px) { return '900 ' + px + 'px "Arial Black","Segoe UI Black",sans-serif'; }
      /* render must never draw from env.rng — that would let frame count leak into the
         gameplay stream. Screenshake jitters off a hash of the real clock instead. */
      function hash(n) { var v = Math.sin(n) * 43758.5453; return v - Math.floor(v); }

      function drawOpponent(g, fg, airborne) {
        var sz = 46 + Math.sin(rt / 620) * 4 + (airborne ? 3 : 0);
        var frac = Math.max(0, 1 - handled / N);
        g.lineWidth = 7; g.lineCap = 'round';
        g.globalAlpha = 0.22; g.strokeStyle = fg;
        g.beginPath(); g.arc(W / 2, OY, 78, -Math.PI * 1.35, Math.PI * 0.35); g.stroke();
        g.globalAlpha = 1;
        if (frac > 0) {
          g.strokeStyle = frac < 0.34 ? ACID : fg;
          g.beginPath(); g.arc(W / 2, OY, 78, -Math.PI * 1.35, -Math.PI * 1.35 + Math.PI * 1.7 * frac); g.stroke();
        }
        g.save();
        g.translate(W / 2, OY);
        g.rotate(rt / 2400 + Math.sin(rt / 1100) * 0.12);
        if (done === 'won') { g.globalAlpha = 0.4; g.scale(1.35, 1.35); }   // it gives way
        g.fillStyle = INK;
        g.beginPath();
        g.moveTo(0, -sz); g.lineTo(sz * 0.78, 0); g.lineTo(0, sz); g.lineTo(-sz * 0.78, 0);
        g.closePath(); g.fill();
        /* the donor punches this hole with destination-out, which on its page shows the
           #12060E body behind. Painting that colour is the same picture and cannot eat the
           shell's own frame underneath. */
        g.fillStyle = VOID;
        g.beginPath(); g.arc(0, 0, sz * 0.30 + Math.sin(rt / 430) * 2, 0, 6.283); g.fill();
        g.restore();
        g.globalAlpha = 1;
      }

      function drawStrike(g, s) {
        var x = W / 2, y = OY + TRACK * s.p, sz = s.size;
        if (!s.feint) {
          for (var t = 1; t <= 5; t++) {                      // five solid ACID ghosts
            var tp = Math.max(0, s.p - t * 0.035);
            g.globalAlpha = 0.13 * (1 - t / 6);
            g.fillStyle = ACID;
            g.beginPath(); g.arc(x, OY + TRACK * tp, sz * (1 - t * 0.09), 0, 6.283); g.fill();
          }
          g.globalAlpha = 1;
          g.fillStyle = 'rgba(21,6,16,0.30)';                 // donor shadowBlur, faked flat (perf rule)
          g.beginPath(); g.arc(x + 3, y + 4, sz * 1.06, 0, 6.283); g.fill();
          g.fillStyle = ACID; g.strokeStyle = INK; g.lineWidth = 5; g.lineJoin = 'miter';
          if (s.kind === 'jab') {
            g.beginPath();
            g.moveTo(x, y - sz); g.lineTo(x + sz * 0.62, y); g.lineTo(x, y + sz); g.lineTo(x - sz * 0.62, y);
            g.closePath(); g.fill(); g.stroke();
          } else {
            g.beginPath(); g.arc(x, y, sz, 0, 6.283); g.fill(); g.stroke();
            g.fillStyle = INK;
            g.beginPath(); g.arc(x, y, sz * 0.34, 0, 6.283); g.fill();
          }
          return;
        }
        /* THE HOLLOW. No fill anywhere: the field colour runs straight through it, from the
           frame it spawns. Broken dashed rim, breathing size, a wake of rings instead of
           discs. Every real strike is a solid body you cannot see past. */
        var br = sz + Math.sin(rt / 150 + s.wob) * 2.5;
        for (var t2 = 1; t2 <= 4; t2++) {
          var tp2 = Math.max(0, s.p - t2 * 0.045);
          g.globalAlpha = 0.16 * (1 - t2 / 5);
          g.strokeStyle = ACID; g.lineWidth = 2;
          g.beginPath(); g.arc(x, OY + TRACK * tp2, br * (1 - t2 * 0.05), 0, 6.283); g.stroke();
        }
        g.globalAlpha = 1;
        g.save();
        g.setLineDash([9, 7]);
        g.lineDashOffset = -(rt / 22) % 16;
        g.strokeStyle = INK; g.lineWidth = 8;
        g.beginPath(); g.arc(x, y, br, 0, 6.283); g.stroke();
        g.strokeStyle = ACID; g.lineWidth = 4;
        g.beginPath(); g.arc(x, y, br, 0, 6.283); g.stroke();
        g.restore();
      }

      function drawGuard(g, fg) {
        var st = done === 'won' ? 'active' : guardState();
        var col = st === 'active' ? CYAN : (st === 'recover' ? GREY : fg);
        var thick = st === 'active' ? 11 : 6;
        if (st === 'active') {
          g.globalAlpha = 0.28; g.fillStyle = CYAN;
          rr(g, BARX - 14, GY - 26, BARW + 28, 52, 26); g.fill();
          g.globalAlpha = 1;
        }
        if (done === 'lost') {                                // your line, snapped in two
          g.fillStyle = ACID;
          g.save(); g.translate(BARX + BARW * 0.25, GY); g.rotate(-0.07);
          rr(g, -BARW * 0.25 - 9, -3, BARW * 0.5, 6, 3); g.fill(); g.restore();
          g.save(); g.translate(BARX + BARW * 0.75, GY); g.rotate(0.07);
          rr(g, -BARW * 0.25 + 9, -3, BARW * 0.5, 6, 3); g.fill(); g.restore();
        } else {
          g.fillStyle = col;
          rr(g, BARX, GY - thick / 2, BARW, thick, thick / 2); g.fill();
        }
        g.strokeStyle = col; g.lineWidth = 5; g.lineCap = 'round';
        g.beginPath();
        g.moveTo(BARX, GY - 18); g.lineTo(BARX, GY + 18);
        g.moveTo(BARX + BARW, GY - 18); g.lineTo(BARX + BARW, GY + 18);
        g.stroke();
        if (st === 'recover') {
          var k = 1 - ((gt - parryStart - PARRY_WIN) / RECOVERY);
          g.globalAlpha = 0.5; g.fillStyle = GREY;
          rr(g, BARX, GY - 3, BARW * Math.max(0, k), 6, 3); g.fill();
          g.globalAlpha = 1;
        }
        if (rt < 1500 && done === 'pending') {                // shared marking: cream rim, 8th-note pulse
          var e8 = 1 - ((env.beatPhase() * 2) % 1);
          g.globalAlpha = Math.min(1, (1500 - rt) / 400) * (0.20 + 0.34 * e8);
          g.strokeStyle = env.ink; g.lineWidth = 2;
          rr(g, BARX - 14, GY - 26, BARW + 28, 52, 26); g.stroke();
          g.globalAlpha = 1;
        }
      }

      function drawPips(g, fg) {
        var stride = 22, pw = 14, x0 = W / 2 - ((N - 1) * stride) / 2 - pw / 2;
        for (var i = 0; i < N; i++) {
          var a = i < handled ? 0.92 : 0.22;
          if (i === handled && done === 'pending') a = 0.45 + 0.35 * Math.abs(Math.sin(rt / 260));
          g.globalAlpha = a; g.fillStyle = fg;
          rr(g, x0 + i * stride, PIPY, pw, 5, 2.5); g.fill();
        }
        g.globalAlpha = 1;
      }

      return {
        step(dt, inp) {
          var ms = dt * 1000;
          rt += ms;
          if (done !== 'pending') { decay(ms, false); return; }
          if (inp.justDown) tap();
          var frozen = freeze > 0;
          if (frozen) freeze -= ms; else gt += ms;
          var i;
          for (i = 0; i < plan.length; i++) {
            var sp = plan[i];
            if (!sp.live && !sp.done && gt >= sp.spawn) {
              sp.live = true;
              if (sp.feint) sfx.tickFeint(); else sfx.tickReal(sp.kind);
            }
          }
          for (i = 0; i < plan.length; i++) {
            var s = plan[i];
            if (s.done || !s.live) continue;
            s.p = progressOf(s);
            if (s.p >= 1) { land(s); if (done !== 'pending') break; }
          }
          decay(ms, frozen);
        },

        render(g) {
          var fieldCol = mix(FIELD[fPrev], FIELD[fCur], fieldK);
          var fg = mix(FGC[fPrev], FGC[fCur], fieldK);
          var airborne = false, i;
          for (i = 0; i < plan.length; i++) if (plan[i].live && !plan[i].done) airborne = true;

          g.save();
          if (shake > 0.4) g.translate((hash(rt * 0.731) - 0.5) * shake, (hash(rt * 1.117) - 0.5) * shake);
          g.fillStyle = fieldCol;
          g.fillRect(-40, -40, W + 80, H + 80);              // over-drawn so shake never exposes an edge

          g.globalAlpha = 0.10; g.lineWidth = 2; g.strokeStyle = fg;
          for (var r = 1; r <= 4; r++) {
            g.beginPath(); g.arc(W / 2, OY, 44 * r + Math.sin(rt / 900 + r) * 5, 0, 6.283); g.stroke();
          }
          g.globalAlpha = 1;

          drawOpponent(g, fg, airborne);
          drawPips(g, fg);
          for (i = 0; i < plan.length; i++) if (plan[i].live && !plan[i].done) drawStrike(g, plan[i]);
          drawGuard(g, fg);

          for (i = 0; i < sparks.length; i++) {
            var s = sparks[i];
            g.globalAlpha = Math.max(0, s.life);
            g.fillStyle = s.col;
            g.fillRect(s.x - 2.5, s.y - 2.5, 5, 5);
          }
          g.globalAlpha = 1;

          if (nudge > 0 && done === 'pending') {
            /* deliberately down in thumb country at 0.35-0.65 alpha, half-hidden, and it
               deletes itself the instant you read your first strike right. */
            g.globalAlpha = 0.35 + 0.3 * Math.abs(Math.sin(rt / 420));
            g.fillStyle = fg;
            g.font = heavyFont(14);
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText('SOLID: GUARD IT', W / 2, H * 0.78);
            g.fillText('HOLLOW: LET IT PASS', W / 2, H * 0.815);
            g.globalAlpha = 1;
          }
          g.restore();

          if (flash > 0.01) {                                 // outside the shake, so it never smears
            g.globalAlpha = Math.min(flash * 0.75, 0.75);
            g.fillStyle = flashCol;
            g.fillRect(0, 0, W, H);
            g.globalAlpha = 1;
          }
          if (word) {                                         // the verdict, on top of its own flash
            g.fillStyle = INK;
            g.font = heavyFont(Math.round(Math.min(W * 0.17, 66)));
            g.textAlign = 'center'; g.textBaseline = 'middle';
            g.fillText(word, W / 2, H * 0.46);
          }
        },

        result: function () { return done; },
        timeout: function () { return 'lost'; },
        line: function () {
          if (failKind === 'bait') return 'YOU NEVER LEARNED TO STOP SWINGING';
          if (failKind === 'landed') return 'IT ARRIVED. YOU DID NOT.';
          return 'THE GLASS IS STILL WAITING';
        },
        /* The window is 180-235ms wide and the harness polls slower than that, so the bot
           cannot just "tap when close" — it has to aim. Each call measures how long the
           harness actually took to come back (poll cost + its own sleeps) and schedules the
           NEXT call to land on the middle of the window, minus ~80ms of dispatch lag. */
        hint: function () {
          var TAPPT = { type: 'tap', x: W / 2, y: H * 0.42 };
          if (hPrev >= 0) {
            var o = (gt - hPrev) - hWait;
            if (o > 20 && o < 500) hOver = Math.max(40, Math.min(300, hOver * 0.4 + o * 0.6));
          }
          hPrev = gt; hWait = 0;
          var pend = function (ms) { hWait = ms; return { type: 'wait', ms: ms }; };
          if (done !== 'pending') return pend(200);
          var s = null;
          for (var i = 0; i < plan.length; i++) if (!plan[i].done) { s = plan[i]; break; }
          if (!s) return pend(60);
          /* a feint is answered by doing nothing at all — sit on your hands until it lands */
          if (s.feint) return pend(Math.max(16, Math.min(200, s.arrive - gt + 80)));
          var readyAt = parryStart <= -1e8 ? -1e9 : parryStart + PARRY_WIN + RECOVERY;
          var aim = Math.max(s.arrive - PARRY_WIN * 0.5 - 80, readyAt + 10);
          if (gt >= aim) return TAPPT;
          var w = aim - gt - hOver;
          if (w <= 0) return (aim - gt) <= (gt + hOver - aim) ? TAPPT : pend(16);
          return pend(Math.min(200, w));
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - The string is 3 strikes / <=1 feint at diff 0, 4 / 1-2 at diff 1, 4 / 2 at diff 2, with
     arrivals LEAD + i*SPACE where LEAD = beatLen*1000 + 950 and SPACE = 640/520/460 ms.
     plan[0] is never a feint. Every roll comes from env.rng() at create(), so a seed replays
     the exact same string.
   - A tap opens a window of 235/205/180 ms (diff 0/1/2); a strike resolves ON ARRIVAL, not
     on the tap. Real + window open at arrival = parry (CYAN flash, 13 sparks, 95ms hitstop;
     <=76ms early makes it perfect: BONE flash, 22 sparks, 130ms hitstop, chord a fifth up).
     Real + window shut = 'lost' with the word AGAIN. Feint + window open = 'lost' with the
     word BAITED. Feint + window shut = refused (BONE puff, 9 sparks, rising 990->1320 tick).
   - Handling all N strikes correctly resolves 'won' on the last arrival, in that same frame:
     CYAN flash 0.75, 40 BONE/CYAN sparks off the diamond, shake 26, guard arc empty, diamond
     at 1.35x and 0.4 alpha, and 'BREAK' in INK at H*0.46. A loss paints the same frame ACID
     with the guard bar drawn snapped into two rotated halves. timeout() returns 'lost'.
   - The field colour steps BUBBLEGUM -> TANGERINE -> VIOLET -> SUGARGLASS, one step per
     strike survived (200ms crossfade), and the foreground flips BONE -> INK on the light
     field. N pips at y=300 count the string; the guard arc erodes 1/N per strike.
   - A tap at the whistle costs nothing: PARRY_WIN + RECOVERY = 535ms of lockout ends at
     least 250ms before the first arrival at beatLen*1000 + 950, at every bpm in range.
   - The guard line is H*0.66 and the opponent H*0.22, so the entire read sits in the top
     two thirds; travel times are the donor's scaled by the same 0.88 (414/810/739 ms), so
     on-screen strike speed is unchanged.
   BUG-IS-GAME (do not fix):
   - parryWin secretly adds +55ms at difficulty 0 and +25ms at difficulty 1 and is NEVER
     announced. Do not normalise it to a flat 180.
   - A whiff is asymmetrically brutal — 180+300 = up to 535ms of dead thumb — while a clean
     parry sets parryStart = -1e9 and cancels recovery outright, so a flawless string has
     zero downtime. Do not soften the whiff or add a partial cancel on a hurt.
   - Strikes resolve on ARRIVAL, never on the tap. Tapping only arms a window; the game
     refuses to tell you whether you were right until the thing touches your line.
   - A perfect parry costs one extra hitstop frame and a prettier chord and nothing else.
     There is no score, no combo counter and no rank. Do not add a scoreboard.
   - The nudge draws at H*0.78/0.815, BELOW the guard line and inside thumb-occlusion
     territory, at 0.35-0.65 alpha. It is meant to be half-hidden and it deletes itself the
     moment you read your first strike correctly, forever.
   - The feint's stutter curve walks it BACKWARD up the track between 42% and 58%. It looks
     like a rendering fault the first time. It is the tell.
*/

/* ===== carts/32-breach.js ===== */
/* EVERY WALL IS A DOOR — she runs on her own. You get one verb and 0.18 s of it. */
(function () {
  registerGame({
    id: 'breach', title: 'EVERY WALL IS A DOOR', command: 'BREACH IT!', family: 'tap', slotBeats: 8,
    create(env) {
      /* ======================== DONOR CONSTANTS (quoted) ========================
         From EVERY WALL IS A DOOR v1.0.0 — Player.startBreach, Player.update,
         Game.moveActorX, Map.damage, audio.sfx. The donor hands you FIVE verbs:
         breach, slash, dash, jump, attack. This cartridge keeps exactly one and
         throws the rest away — she runs forward by herself, there is no steering,
         no jump, no blade. One button, and the button is a hole in a wall.        */
      const B_TIME  = 0.18;   // startBreach: this.breachTimer = .18
      const B_COOL  = 0.72;   // startBreach: this.breachCooldown = .72 — the anchor-drop
                              //   branch takes .5 instead, but that branch needs DOWN held
                              //   in mid-air: a second control channel this format lacks.
      const B_POWER = 2;      // this.breachPower = 2
      const RUN     = 310;    // update(): const target = move*310
      const B_SPD   = 620;    // while breachTimer>0: this.vx = this.facing*620
      const REACH   = B_SPD * B_TIME;      // 111.6 px — the WHOLE commitment. At the run
                              //   speed the wall closes that in 0.36 s, so 0.36 s is the
                              //   window, every round, at every bpm. The hand never relearns it.
      const BOUNCE  = -0.18;  // moveActorX: a breach that fails to open the tile -> vx *= -.18
      const SHK_BREACH = 7;   // startBreach: game.addShake(7)
      const SHK_SLAM = 8;     // moveActorX rejection: this.addShake(8)
      const SHK_WALL = 4;     // onWallBroken: addShake(type===TILE_BRICK?7:4)
      const SHK_WIN = 15;     // Pylon death: game.addShake(15)
      const SHK_DECAY = 38;   // Game.update: this.shake = approach(this.shake, 0, 38*dt)

      /* TILE_DEF hp, verbatim: plaster 1, glass 1, neon lattice 2, brick 3.
         damageTiles fires once per tile per breach (breachWallHit is a Set), so at
         breachPower 2 plaster, glass and neon all open in a single pass — and BRICK
         DOES NOT, because 3 > 2. The donor only clears brick once MR. UNDER hands you
         breachPower 3. There is no MR. UNDER in an 8-beat slot, so there is no brick. */
      const MATS = [
        { id: 'plaster', deb: '#fff0c9', hp: 1, glass: false },   // Map.damage spark colour
        { id: 'glass',   deb: '#45e6ff', hp: 1, glass: true  },
        { id: 'neon',    deb: '#ff4fd8', hp: 2, glass: false },
      ];
      /* AFTERIMAGE ARCADE — DISTRICTS[2], 'the walls learned to advertise'.
         sky #1b1238, glow #ff4fd8, accent #54eeff. Night city, neon, verbatim. */
      const SKYC = '#1b1238', VOID = '#050610', GLOW = '#ff4fd8', ACCENT = '#54eeff';
      const CREAM = '#fff7e6', GOLD = '#ffd84d', CYAN = '#45e6ff', HURT = '#ff5c7a';
      const DEEP = '#070914';
      const HEAVY = (n) => '900 ' + n + 'px "Arial Black","Segoe UI Black",sans-serif';

      const W = env.W, H = env.H, TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const diff = env.difficulty | 0, BL = env.beatLen();

      /* ---- stage. Donor art is authored at Player 24x35 and TILE 40; x1.5 so a phone
         can read it. Speeds stay in donor px/s used as SCREEN px/s, so the 0.36 s window
         is exactly the donor's — only the sprites got bigger. ---- */
      const SC = 1.5, TP = 40 * SC, RW = 24 * SC, RH = 35 * SC;
      const GROUND = 500;               // street surface. Everything you must READ is above it.
      const PX = 88;                    // her front shoulder, locked on screen; world slides left
      const WALL_H = TP * 3;            // 180 px — a head and a half taller than she is

      /* ---- the run: how many walls, how far apart ----
         Spacing is not decoration, it IS the cooldown. From the tap that opens wall n the
         cooldown runs 0.72 s, during which she covers REACH + RUN*0.54 = 279 px. So a gap
         wider than 279 + REACH = 390.6 px means the cooldown has always cleared before the
         next window opens (full 0.36 s to work with), and — the whole point — a MASHER whose
         breaches fire every 0.72 s can never have one land on the next wall. Below that, the
         window narrows to (SP - 279 .. REACH) and mashing starts to chain. */
      const WANT  = [2, 3, 4][diff];
      const X1    = [560, 500, 470][diff];
      const SPMAX = [400, 400, 300][diff];
      const SPMIN = 250;
      /* She runs through the count-in beat AND the 8-beat slot: 9*beatLen seconds of road.
         Reserve 0.25 s so a last-instant tap on the final wall still lands inside the slot.
         Each breach already elapsed buys back RUN*B_TIME = 55.8 px. */
      const room = (n) => RUN * (9 * BL - 0.25) + RUN * B_TIME * (n - 1);
      let N = WANT;
      while (N > 2 && X1 + (N - 1) * SPMIN > room(N)) N--;   // 8 beats at 146bpm cannot hold four
      const SP = N > 1 ? Math.min(SPMAX, (room(N) - X1) / (N - 1)) : 0;

      const walls = [];
      {
        let x = X1 + env.rng() * 16;     // jitter forward only — never toward her
        for (let i = 0; i < N; i++) {
          walls.push({ x, m: MATS[(env.rng() * 3) | 0], open: 0, hot: 0, deny: 0, seen: false });
          x += SP + env.rng() * 12;
        }
      }

      /* ---- state ---- */
      let t = 0, rx = 0;                       // t from count-in; rx = her front edge, world px
      let bTimer = 0, bCool = 0, next = 0;
      let gait = 0, hitstop = 0, shake = 0, flash = 0;
      let slamX = 0, slamV = 0, breaches = 0, wasted = 0;
      let decided = null, announced = 'pending', announceT = 0, why = 'timeout';
      const parts = [], ghosts = [];

      /* ---- audio: the donor's sfx() cases, one for one. Its master gain is .23, so the
         volumes are lifted ~3x to sit on the shell's sfx bus. `t` is a RELATIVE DELAY. ---- */
      const A = env.audio;
      const sBreach = () => {                  // 'breach': noise(.15,.07,130); tone(78,.16,'square',.07,.42)
        A.noise({ dur: 0.15, vol: 0.2, hp: 130 });
        A.tone({ f: 78, f2: 78 * 0.42, type: 'square', dur: 0.16, vol: 0.3 });
      };
      const sDeny = () => A.tone({ f: 95, f2: 95 * 0.55, type: 'square', dur: 0.08, vol: 0.13 });  // 'enemy'
      const sArm = () => A.tone({ f: 720, f2: 720 * 1.8, type: 'triangle', dur: 0.12, vol: 0.15 });// 'reflect'
      const sBreak = (m) => m.glass                                                // 'glass' / 'break'
        ? (A.noise({ dur: 0.18, vol: 0.14, hp: 2200 }), A.tone({ f: 980, f2: 980 * 0.55, type: 'sine', dur: 0.12, vol: 0.12 }))
        : (A.noise({ dur: 0.11, vol: 0.18, hp: 240 }), A.tone({ f: 140, f2: 140 * 0.45, type: 'square', dur: 0.08, vol: 0.17 }));
      const sHurt = () => {                    // 'hurt': noise(.12,.055,260); tone(110,.2,'sawtooth',.045,.45)
        A.noise({ dur: 0.12, vol: 0.2, hp: 260 });
        A.tone({ f: 110, f2: 110 * 0.45, type: 'sawtooth', dur: 0.2, vol: 0.26 });
      };
      const sWin = () => [220, 330, 440, 660].forEach((f, i) =>   // 'win', with the donor's i*.11 stagger
        A.tone({ t: i * 0.11, f, type: 'triangle', dur: 0.45, vol: 0.16 }));

      /* ---- particles: donor Particle + radialBurst/spark, capped at 120 ---- */
      function burst(x, y, col, n, spd, grav) {
        for (let i = 0; i < n && parts.length < 120; i++) {
          const a = env.rng() * TAU, s = spd * (0.25 + env.rng() * 0.75);
          const life = 0.35 + env.rng() * 0.65;                  // donor: rand(1,.35)
          parts.push({
            x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, g: grav, life, max: life,
            size: 2 + env.rng() * 8, col, sq: i % 3 !== 0,       // donor: i%3?'rect':'circle'
            rot: env.rng() * TAU, spin: (env.rng() * 2 - 1) * 10,
          });
        }
      }
      function spark(x, y, col, n) {                             // Map.damage's impact grit
        for (let i = 0; i < n && parts.length < 120; i++) {
          const life = 0.25 + env.rng() * 0.4;
          parts.push({
            x, y, vx: env.rng() * 440 - 220, vy: env.rng() * 300 - 260, g: 500, life, max: life,
            size: 2 + env.rng() * 6, col, sq: true, rot: env.rng() * TAU, spin: (env.rng() * 2 - 1) * 10,
          });
        }
      }
      function fxStep(dt) {
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.spin * dt;
          if (p.life <= 0) parts.splice(i, 1);
        }
        for (let i = ghosts.length - 1; i >= 0; i--) { ghosts[i].life -= dt; if (ghosts[i].life <= 0) ghosts.splice(i, 1); }
        shake = Math.max(0, shake - SHK_DECAY * dt);
        flash = Math.max(0, flash - dt);
      }

      /* ---- the three outcomes ---- */
      function openWall(w) {                     // Map.damage -> TILE_AIR -> moveActorX `continue`
        w.open = 1;
        const wy = GROUND - WALL_H * 0.5;
        spark(PX + 10, wy, w.m.deb, 5);                                  // Map.damage spark(...,5)
        burst(PX + 10, wy, w.m.deb, w.m.glass ? 14 : 10, 240, 240);      // onWallBroken radialBurst
        sBreak(w.m); shake = Math.max(shake, SHK_WALL);
        next++;
        if (next >= walls.length) {              // the last one: Pylon-death treatment
          decided = 'won'; announceT = 0.28;
          burst(PX + 10, wy, GOLD, 28, 420, 240); burst(PX + 10, wy, CREAM, 12, 300, 240);
          shake = SHK_WIN; hitstop = 0.10; flash = 0.4;
          sBreach(); sWin();
        }
      }
      function slam(w) {                         // the wall did not open; she is stopped by it
        rx = w.x - 0.01;                         // moveActorX: actor.x = left - actor.w - .01
        slamV = RUN * BOUNCE;                    // ...and the donor's own rejection kick
        why = bCool > 0 ? 'early' : 'late';
        decided = 'lost'; announceT = 0.28;
        shake = SHK_SLAM; hitstop = 0.10; flash = 0.18;
        spark(PX + 6, GROUND - WALL_H * 0.45, w.m.deb, 8);
        burst(PX + 6, GROUND - WALL_H * 0.5, w.m.deb, 12, 220, 500);
        sHurt();
      }

      /* ================================ STEP ================================ */
      function step(dt, inp) {
        t += dt;
        if (decided) {
          announceT -= dt;
          if (hitstop > 0) hitstop -= dt;
          else {
            fxStep(dt);
            if (decided === 'won') { rx += RUN * dt; gait += RUN * dt * 0.035; }
            else { slamX += slamV * dt; slamV *= Math.pow(0.86, dt * 60); }
          }
          if (announceT <= 0) announced = decided;
          return;
        }
        if (hitstop > 0) { hitstop -= dt; return; }

        /* donor update() order: timers down, THEN wasPressed('breach'), THEN move, THEN collide.
           So a tap on the frame the cooldown hits zero counts, and a tap on the frame of
           contact counts. Keep that order — it is the whole feel of the thing. */
        bTimer = Math.max(0, bTimer - dt);
        bCool = Math.max(0, bCool - dt);
        if (inp.justDown) {
          if (bCool > 0) { sDeny(); wasted++; }   // startBreach: `if(this.breachCooldown>0) return;`
          else {
            bTimer = B_TIME; bCool = B_COOL; breaches++;
            shake = Math.max(shake, SHK_BREACH); sBreach();
            for (let i = 0; i < 4; i++) ghosts.push({ x: rx - i * 9, life: 0.22 - i * 0.03, max: 0.22 });
          }
        }

        const v = bTimer > 0 ? B_SPD : RUN;       // breachTimer>0 -> vx = facing*620, else 310
        rx += v * dt;
        gait += v * dt * 0.035;
        fxStep(dt);

        const w = walls[next];
        if (w && rx >= w.x) {
          if (bTimer > 0) openWall(w);
          else if (env.armed()) slam(w);
          else rx = w.x - 0.01;                   // cannot lose during the count-in; she just waits
        }
        if (w && !w.seen && w.x - rx <= REACH) { w.seen = true; if (bCool <= 0) sArm(); }
      }

      /* =============================== WORLD ART =============================
         Static chrome pre-rendered once. The two skyline bands are exactly W wide and
         built on a step that divides W, so blitting each twice at -(scroll % W) tiles
         seamlessly and the whole night city costs five drawImage calls a frame. */
      const SKY = env.layer(W, GROUND, (c) => {
        const gr = c.createLinearGradient(0, 0, 0, GROUND);
        gr.addColorStop(0, SKYC); gr.addColorStop(1, VOID);
        c.fillStyle = gr; c.fillRect(0, 0, W, GROUND);
        c.fillStyle = ACCENT + '33';              // drawBackground: airborne advertising pixels
        for (let i = 0; i < 22; i++) c.fillRect((i * 163) % W, (i * 97) % (GROUND - 40), 2 + (i % 3), 2 + (i % 2));
      });
      const FAR = env.layer(W, 300, (c) => {      // parallax layer 1: rgba(8,10,25,.78)
        c.fillStyle = 'rgba(8,10,25,.78)';
        for (let i = 0; i < 5; i++) { const h = 90 + env.rng() * 150; c.fillRect(i * 78, 300 - h, 70, h); }
      });
      const NEAR = env.layer(W, 250, (c) => {     // parallax layer 2 + its lit windows
        for (let i = 0; i < 6; i++) {
          const h = 70 + env.rng() * 130, x = i * 65;
          c.fillStyle = 'rgba(5,7,18,.96)'; c.fillRect(x, 250 - h, 59, h);
          c.fillStyle = GLOW + '44';              // donor: d.glow+'44', 7x10 panes, every third
          for (let wy = 250 - h + 18; wy < 244; wy += 28)
            for (let wx = x + 12; wx < x + 47; wx += 28) if (((wx + wy + i * 7) | 0) % 3 === 0) c.fillRect(wx, wy, 7, 10);
        }
      });
      const ROAD = env.layer(W, H - GROUND, (c) => {
        c.fillStyle = VOID; c.fillRect(0, 0, W, H - GROUND);
        c.globalAlpha = 0.18; c.strokeStyle = GLOW; c.lineWidth = 2;   // district-2 vanishing grid
        c.beginPath();
        for (let x = -W; x < W * 2; x += 80) { c.moveTo(W / 2, 0); c.lineTo(x, H - GROUND); }
        c.stroke(); c.globalAlpha = 1;
        c.fillStyle = '#121629'; c.fillRect(0, 0, W, 16);              // TILE_STEEL plating
        c.fillStyle = '#5c6387'; c.fillRect(0, 15, W, 1);
      });
      /* one wall column per material, pre-rendered from drawTile's own recipe */
      const ART = {};
      for (const m of MATS) {
        ART[m.id] = env.layer(TP, WALL_H, (c) => {
          c.save(); c.scale(SC, SC);                                   // draw in donor TILE units
          for (let row = 0; row < 3; row++) {
            const y = row * 40;
            if (m.id === 'plaster') {
              c.fillStyle = '#f1dfc4'; c.fillRect(0, y, 40, 40);
              c.fillStyle = (row & 1) ? '#efb58b' : '#e99f88'; c.fillRect(3, y + 3, 34, 34);
              c.strokeStyle = '#30233a'; c.lineWidth = 2;
              c.beginPath(); c.moveTo(6, y + 8); c.lineTo(18, y + 17); c.lineTo(12, y + 29); c.lineTo(30, y + 35); c.stroke();
            } else if (m.id === 'glass') {
              c.fillStyle = 'rgba(69,230,255,.28)'; c.fillRect(0, y, 40, 40);
              c.strokeStyle = '#9af4ff'; c.lineWidth = 2; c.strokeRect(2, y + 2, 36, 36);
              c.beginPath(); c.moveTo(2, y + 2); c.lineTo(38, y + 38); c.moveTo(38, y + 2); c.lineTo(2, y + 38); c.stroke();
              c.fillStyle = 'rgba(255,255,255,.55)'; c.fillRect(7, y + 4, 4, 32);
            } else {
              c.fillStyle = '#21143d'; c.fillRect(0, y, 40, 40);
              c.strokeStyle = '#ff4fd8'; c.lineWidth = 3; c.strokeRect(3, y + 3, 34, 34);
              c.strokeStyle = '#54eeff'; c.lineWidth = 2;
              c.beginPath(); c.moveTo(4, y + 20); c.lineTo(36, y + 20); c.moveTo(20, y + 4); c.lineTo(20, y + 36); c.stroke();
              c.fillStyle = '#fff'; c.beginPath(); c.arc(20, y + 20, 3, 0, TAU); c.fill();
            }
          }
          c.restore();
        });
      }

      /* =============================== RENDER =============================== */
      const sx = (wx) => PX + (wx - rx) + slamX;    // world px -> screen px

      function tile2(g, img, x, y, w, h) { g.drawImage(img, x, y, w, h); }

      function drawBand(g, img, h, speed) {         // two blits, seamless at -(scroll % W)
        const off = -(((rx - slamX) * speed) % W);
        tile2(g, img, off, GROUND - h, W, h);
        tile2(g, img, off + W, GROUND - h, W, h);
      }

      function drawRunner(g) {
        const left = PX + slamX - RW, top = GROUND - RH;
        const bob = decided === 'lost' ? 0 : Math.abs(Math.sin(gait)) * -2.5;
        const fa = decided === 'lost' ? 0 : Math.sin(gait) * 4;
        g.save();
        g.translate(left + 12 * SC, top + 17 * SC + bob);
        g.scale(SC, SC);
        if (decided === 'lost') g.rotate(-0.22);    // she folds against the face of it
        /* drawPlayerShape, donor geometry unchanged */
        g.fillStyle = DEEP;
        g.beginPath(); g.ellipse(0, 2, 12, 17, 0, 0, TAU); g.fill();
        g.strokeStyle = CREAM; g.lineWidth = 3; g.stroke();
        g.fillStyle = CREAM;
        g.beginPath(); g.moveTo(4, -12); g.lineTo(13, -5); g.lineTo(5, -3); g.fill();
        g.fillRect(-10 - fa * 0.6, 13 + Math.abs(fa) * 0.4, 8, 6);
        g.fillRect(3 + fa * 0.6, 13 + Math.abs(fa) * 0.4, 8, 6);
        g.fillStyle = CYAN; g.fillRect(4, -5, 5, 4);                 // the visor
        g.strokeStyle = GOLD; g.lineWidth = 3; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-7, 2); g.lineTo(-15, 10 - fa * 0.5); g.stroke();
        g.lineCap = 'butt';
        g.restore();
        /* Player.draw: three gold speed lines behind her for the whole breachTimer */
        if (bTimer > 0) {
          g.strokeStyle = GOLD; g.lineWidth = 4 * SC; g.globalAlpha = 0.8;
          for (let i = 0; i < 3; i++) {
            const lx = left - (10 + i * 14) * SC, ly = top + (5 + i * 8) * SC;
            g.beginPath(); g.moveTo(lx, ly); g.lineTo(lx - 25 * SC, ly); g.stroke();
          }
          g.globalAlpha = 1;
        }
      }

      function drawWall(g, w, i) {
        if (w.open) return;
        const x = sx(w.x), top = GROUND - WALL_H;
        if (x > W + 40 || x < -TP - 40) return;
        g.drawImage(ART[w.m.id], x, top, TP, WALL_H);
        const d = w.x - rx;
        const live = i === next && d <= REACH && d > 0 && !decided;
        const hot = live && bCool <= 0, deny = live && bCool > 0;
        /* Map.damage's crack overlay (drawTile hp<3 branch) only ever showed on a wall that
           had already been hit. Here it is the tell that the wall is CURRENTLY openable. */
        if (hot || bTimer > 0) {

          g.strokeRect(x - 2, top - 2, TP + 4, WALL_H + 4);
          g.strokeStyle = '#ffe7a1'; g.lineWidth = 3;                // drawTile: #ffe7a1 crack
          g.beginPath();
          g.moveTo(x + TP * 0.5, top + 6); g.lineTo(x + TP * 0.28, top + WALL_H * 0.33);
          g.lineTo(x + TP * 0.62, top + WALL_H * 0.58); g.lineTo(x + TP * 0.34, top + WALL_H - 6);
          g.stroke();
          g.globalAlpha = 0.35 + 0.35 * p;                           // the door that is not there yet
          g.fillStyle = GOLD; g.fillRect(x + TP * 0.5 - 3, top, 6, WALL_H);
          g.globalAlpha = 1;

          g.strokeStyle = HURT; g.lineWidth = 4; g.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(t * 22));

          g.beginPath();
          g.moveTo(x + 6, top + WALL_H * 0.36); g.lineTo(x + TP - 6, top + WALL_H * 0.64);
          g.moveTo(x + TP - 6, top + WALL_H * 0.36); g.lineTo(x + 6, top + WALL_H * 0.64);

        g.fillStyle = col; g.fillRect(x0, GROUND, x1 - x0, 12);

        g.moveTo(x0 + 2, GROUND - 52); g.lineTo(x0 + 16, GROUND - 45); g.lineTo(x0 + 2, GROUND - 38);
        g.fill();

      }

      function render(g) {
        g.fillStyle = VOID; g.fillRect(0, 0, W, H);
        g.save();
        if (shake > 0.01) g.translate(Math.sin(t * 167) * shake, Math.sin(t * 191 + 1.7) * shake);

        g.drawImage(SKY, 0, 0, W, GROUND);
        drawBand(g, FAR, 300, 0.17);
        drawBand(g, NEAR, 250, 0.30);
        g.drawImage(ROAD, 0, GROUND, W, H - GROUND);
        /* the grid rushing at you — the only readout that she is moving at all */
        g.globalAlpha = 0.2; g.strokeStyle = GLOW; g.lineWidth = 2;
        const ph = ((rx - slamX) * 0.0026) % 1;
        for (let i = 1; i <= 11; i++) {
          const u = (i - ph) / 11, y = GROUND + (H - GROUND) * u * u;
          g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();

        g.fillStyle = 'rgba(255,247,230,.30)';

          g.globalAlpha = clamp(q.life / q.max, 0, 1) * 0.4;

          g.restore();

           thumb cannot sit on it: 1 - clamp(breachCooldown/.72, 0, 1), in #ffd84d */
        const rdy = 1 - clamp(bCool / B_COOL, 0, 1);
        const bx = PX + slamX - 50, by = GROUND - RH - 46;
        g.fillStyle = 'rgba(7,9,20,.75)'; g.fillRect(bx, by, 64, 14);
        g.fillStyle = bTimer > 0 ? CREAM : GOLD; g.fillRect(bx, by, 64 * rdy, 14);
        g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1; g.strokeRect(bx + 0.5, by + 0.5, 63, 13);
        g.fillStyle = rdy >= 1 ? '#090b18' : '#fff'; g.font = HEAVY(9); g.textAlign = 'center';
        g.fillText('BREACH', bx + 32, by + 11);

           the only thing worth pointing at */

          const a = 0.55 + 0.45 * Math.abs(Math.sin(t * 8));
          g.globalAlpha = a; g.fillStyle = w.m.deb;
          g.beginPath(); g.moveTo(W - 8, GROUND - 92); g.lineTo(W - 26, GROUND - 104); g.lineTo(W - 26, GROUND - 80); g.fill();
          g.globalAlpha = 1;
        }
        g.restore();

        if (flash > 0) { g.fillStyle = 'rgba(255,255,255,' + clamp(flash * 2.2, 0, 1).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }

        /* the world's own last word — small, low, under where the shell stamps */
        if (decided) {
          g.textAlign = 'center'; g.font = HEAVY(22);
          g.globalAlpha = clamp((0.28 - announceT) * 5, 0, 1);
          if (decided === 'won') {
            g.fillStyle = GLOW; g.fillText('A DOOR', W / 2 + 2, 618);
            g.fillStyle = GOLD; g.fillText('A DOOR', W / 2, 616);
          } else {
            g.fillStyle = HURT; g.fillText('STILL A WALL', W / 2, 616);
          }

        }
      }

      /* ---- QA bot: wait out the cooldown, wait out the road, then tap once at ~74 px of
         gap — the middle of the 111.6 px window, so a poll of harness latency on either
         side still lands inside it. Never taps twice for the same wall. ---- */

      function hint() {
        if (decided) return { type: 'wait', ms: 160 };
        const w = walls[next];
        if (!w) return { type: 'wait', ms: 120 };
        if (bTimer > 0) return { type: 'wait', ms: 30 };
        if (bCool > 0) return { type: 'wait', ms: clamp(bCool * 1000, 16, 70) };
        const d = w.x - rx;
        if (d <= AIM) return { type: 'tap', x: 195, y: 300 };
        return { type: 'wait', ms: clamp((d - AIM) / RUN * 1000, 16, 70) };
      }

      const LINES = {
        early: 'YOU SPENT THE BREACH TOO EARLY.',
        late: 'THE WALL KEPT THE HOLE.',
        timeout: 'THE DOOR WAS RUNNING LATE.',
      };

        step, render,
        result: () => announced,
        timeout: () => decided === 'won' ? 'won' : 'lost',
        line: () => wasted > 3 && why !== 'early' ? 'ONE HAND. ONE HOLE. NOT NINE.' : (LINES[why] || LINES.timeout),

     nothing else (startBreach's first line). She runs 310 px/s, and 620 px/s for the whole
     .18 s, so the breach reaches exactly 111.6 px = 0.36 s of closing wall.
   - Meeting a wall with breachTimer > 0 opens it (breachPower 2 >= plaster 1 / glass 1 /
     neon 2) — 10 or 14 material-coloured chunks at 240 plus 5 sparks, shake 4, and she does
     not slow down. Meeting one with breachTimer == 0 => 'lost': she is stopped at the face,
     kicked back at vx *= -.18, shake 8, 100 ms of freeze, an 18% white slam and the donor's
     'hurt' saw. Both verdicts land inside 300 ms; the win adds shake 15, 28 gold + 12 cream
     chunks at 420, and the 220/330/440/660 chord staggered i*0.11 s.
   - The last wall opening resolves 'won'; a slam or the slot expiring resolves 'lost'.
     Wall count is 2/3/4 by difficulty, first wall at 560/500/470 px, and the gap is 400/400/300
     px clamped to whatever 9*beatLen seconds can actually hold at 250 px minimum.
   - MASHING CANNOT WIN AT DIFFICULTY 0. A gap of 400 px exceeds the 279 px a cooldown eats
     plus the 111.6 px the breach reaches, so a breach fired the instant the cooldown clears
     always expires 9+ px short of the next wall, and the one after it fires 167 px past.
     Verified headless: taps every 70 ms for the whole slot lose 8/8.
   - Three reads, no text: the gold floor strip is exactly REACH wide and lights as she enters
     it; the wall grows a gold rim, a cream crack and a gold seam while the breach is loaded,
     and a pink X instead while it is spent; the BREACH bar over her head is the donor's own
     HUD readiness meter, 1 - breachCooldown/.72.
   BUG-IS-GAME (do not fix):
   - The cooldown is longer than the window is wide (0.72 s vs 0.36 s), so ONE early tap
     is a whole wall lost — there is no second chance at a wall, only at the next one. That
     asymmetry is the donor's, and it is the only thing stopping the button from being free.
   - The breach makes her FASTER. Mistiming early therefore hurries you into the wall you
     just failed to open. Do not decelerate her to be kind.
   - There is no jump, no steer, no brake, and the wall is taller than she is. Five verbs
     went in the bin; the reason the donor is called EVERY WALL IS A DOOR is the one that stayed.
   - Brick is absent on purpose. hp 3 > breachPower 2, and the upgrade that fixes that lives
     eleven screens into a metroidvania. A wall you cannot open is not a microgame.
   - Collision is tested AFTER the move, so at 620 px/s she can be up to 10 px inside a wall

   texture on a wood table over food JPEGs — and this reel is one file with no assets, so the
   photographs become drawn surfaces. Everything else is kept: the twelve foods, their names,
   their one-liners, their splat colours, the flick threshold, and the joke. */
(function () {
  registerGame({
    id: 'neither', title: 'NEITHER', command: 'FLICK IT!', family: 'drag', slotBeats: 6,
    create(env) {
      const W = env.W, H = env.H, D = env.difficulty | 0, TAU = Math.PI * 2, R = env.rng;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

      const IDLE_RX = 16;             // donor IDLE.rx — the rest pose that keeps the face readable

      /* ---- the donor's FOODS, verbatim: name, line, splat. The joke lives in the writing. ---- */
      const FOODS = [
        { name: 'Mashed potatoes', line: 'Still warm.', c: '#efe6d2', paint: 'creamy' },
        { name: 'Tomato soup', line: 'It went under.', c: '#c23b2a', paint: 'liquid' },
        { name: 'Chocolate frosting', line: 'No one asked for this.', c: '#3a2218', paint: 'creamy' },
        { name: 'Macaroni and cheese', line: 'The sauce took it.', c: '#e2b14a', paint: 'chunky' },
        { name: 'Vanilla ice cream', line: 'Already melting.', c: '#f3efe6', paint: 'creamy' },
        { name: 'Peanut butter', line: "It's not coming out.", c: '#c48a3a', paint: 'creamy' },
        { name: 'The syrup', line: 'Breakfast is over.', c: '#8a4a18', paint: 'liquid' },
        { name: 'Guacamole', line: "Someone's going to notice.", c: '#7ea34a', paint: 'chunky' },
        { name: 'The extra cheese', line: 'Molten. Final.', c: '#f0d9a8', paint: 'molten' },
        { name: 'Pumpkin pie', line: 'Seasonal, unfortunately.', c: '#d4843a', paint: 'creamy' },
        { name: 'The ramen', line: 'Lost to the broth.', c: '#d8c4a0', paint: 'noodly' },
        { name: 'Nacho cheese', line: 'A war crime.', c: '#f0c43a', paint: 'molten' },
      ];
      const food = FOODS[(R() * FOODS.length) | 0];

      /* ---- palette: the donor's wood table, and the penny ---- */
      const WOOD = '#6b4526', WOOD2 = '#54341c', WOOD3 = '#7d5730';
      const COPPER = '#b87333', COPPER_HI = '#e5a45c', COPPER_LO = '#7d4a1e', RIM = '#8c5626';

      const CX = W * 0.5, TABLE_Y = H * 0.70;

      const trail = [];                                     // pointer history, for flick velocity

      const sFlick = () => {                                // the ting off a thumbnail
        A.tone({ f: 2100, f2: 2600, type: 'sine', dur: 0.16, vol: 0.20 });
        A.tone({ f: 3150, type: 'triangle', dur: 0.10, vol: 0.10, t: 0.01 });
        A.noise({ dur: 0.04, hp: 4000, vol: 0.09 });
      };
      const sWeak = () => { A.tone({ f: 420, f2: 300, type: 'sine', dur: 0.12, vol: 0.12 }); };
      const sTumble = () => A.tone({ f: 900 + R() * 500, type: 'sine', dur: 0.03, vol: 0.035 });
      const sSplat = () => {                                // wet, low, final

      };

      /* =============================== STEP =============================== */
      function step(dt, inp) {

          if (s.t > s.life) splats.splice(i, 1);

        if (landed >= 0 && done === 'pending' && t - landed > REVEAL_HOLD) done = 'won';
        if (done !== 'pending') return;

        /* ---- the flick: drag the coin, release with enough upward speed ---- */
        if (!coin.flying) {
          if (inp.justDown) { grabbed = true; trail.length = 0; dragStartY = inp.y; sPick(); }
          if (grabbed && inp.down) {
            coin.x += (inp.x - coin.x) * 0.55;
            coin.y += (inp.y - coin.y) * 0.55;
            trail.push({ x: inp.x, y: inp.y, t: t });
            while (trail.length > 8) trail.shift();
          }
          if (grabbed && inp.justUp) {
            grabbed = false;
            /* TWO WAYS TO LAUNCH, because one is not enough.
               VELOCITY — a real flick, measured POINTER to POINTER. (It used to measure the
               coin, which lags the thumb through a 0.55 lerp, so it read every flick as
               slower than it was.)
               TRAVEL — or simply having dragged the coin far enough upward before letting go.
               A slow, deliberate lift is still a flick, and this is the breather: refusing an
               honest attempt would make it the fussiest cartridge in the reel. */
            let vy = 0, vx = 0;
            const last = trail.length ? trail[trail.length - 1] : { x: coin.x, y: coin.y, t: t };
            for (let i = trail.length - 2; i >= 0; i--) {
              const dtq = last.t - trail[i].t;
              if (dtq > 0.012) { vy = (last.y - trail[i].y) / dtq; vx = (last.x - trail[i].x) / dtq; }
              if (dtq > 0.14) break;

          if ((coin.vy > 0 && coin.y > TABLE_Y - COIN_R * 0.2) || coin.y < -240) land();

          splats.push({ x: CX, y: H * 0.52, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,

        for (let y = 0; y < H; y += 9) {                    // grain

          c.fillRect(0, y, W, 4);

          c.strokeStyle = i % 3 ? WOOD2 : WOOD3; c.globalAlpha = 0.5; c.lineWidth = 1 + (i % 3);
          c.beginPath(); c.moveTo(-10, y);
          c.bezierCurveTo(W * 0.3, y + 8, W * 0.7, y - 8, W + 10, y + 3); c.stroke();
        }
        c.globalAlpha = 1;
        const v = c.createRadialGradient(W / 2, H * 0.45, 60, W / 2, H * 0.5, H * 0.72);
        v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.55)');
        c.fillStyle = v; c.fillRect(0, 0, W, H);
      }
      /* the food surfaces the donor photographed, drawn instead */
      function foodLayer(c) {
        c.fillStyle = food.c; c.fillRect(0, 0, W, H);
        const dark = 'rgba(0,0,0,0.20)', lite = 'rgba(255,255,255,0.16)';
        const rr = (n) => ((n * 9301 + 49297) % 233280) / 233280;   // deterministic, seedless

          for (let i = 0; i < 18; i++) {
            const x = rr(i * 23 + 9) * W, y = rr(i * 29 + 11) * H, s = 34 + rr(i * 31) * 90;
            c.fillStyle = i % 2 ? lite : dark;
            c.beginPath();
            for (let k = 0; k <= 12; k++) {

              k ? c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad * 0.7)

        if (rest) { g.beginPath(); g.ellipse(2, r * 0.9, r * 0.95, r * 0.28, 0, 0, TAU); g.fill(); }

        g.beginPath(); g.arc(0, 0, r * 0.94, 0, TAU); g.stroke();

        g.fillStyle = 'rgba(80,42,14,0.55)';

          g.beginPath();
