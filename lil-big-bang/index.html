        /* the aim ray: the exact 12 dashed frames, bounces included. Release-timing game —
           the line is the promise, so it gets brighter the moment it actually connects. */
        if (aiming && !decided) {
          const th = 0.5 + 0.5 * Math.sin(t * 14);
          g.save();
          g.setLineDash([5, 10]);                   // donor's dash pattern
          g.lineWidth = aimHit ? 4 : 2;
          g.strokeStyle = aimHit ? 'rgba(255,0,85,' + (0.45 + 0.3 * th).toFixed(3) + ')' : 'rgba(255,255,255,0.14)';
          g.beginPath(); g.moveTo(aimPts[0], aimPts[1]);
          for (let i = 2; i < aimPts.length; i += 2) g.lineTo(aimPts[i], aimPts[i + 1]);
          g.stroke();
          g.lineWidth = 2;                          // donor's own line, laid over the halo
          g.strokeStyle = aimHit ? WHITE : 'rgba(255,255,255,0.3)';   // donor: rgba(255,255,255,0.3)
          g.stroke();
          g.setLineDash([]);
          /* where you stop, drawn as the ghost of you */
          const ex = aimPts[aimPts.length - 2], ey = aimPts[aimPts.length - 1];
          g.strokeStyle = aimHit ? WHITE : 'rgba(0,255,255,0.45)'; g.lineWidth = 1.5;
          g.setLineDash([3, 4]);
          g.beginPath(); g.arc(ex, ey, R, 0, TAU); g.stroke();
          g.setLineDash([]);
          /* donor's target reticle, at the thumb */
          g.beginPath(); g.arc(aimX, aimY, 8, 0, TAU); g.strokeStyle = WHITE; g.lineWidth = 1.5; g.stroke();
          if (aimHit) {                             // lock: the line crosses it, let go
            g.strokeStyle = 'rgba(255,255,255,' + (0.5 + 0.5 * th).toFixed(3) + ')'; g.lineWidth = 2;
            g.beginPath(); g.arc(e.x, e.y, e.r + 9 + 3 * th, 0, TAU); g.stroke();
          }
          g.restore();
        }

        /* the thing: donor's sharp aggressive arrow, pointing where it walks */
        if (!e.dead) {
          g.save(); g.translate(e.x, e.y); g.rotate(e.ang);
          g.beginPath();
          g.moveTo(e.r, 0); g.lineTo(-e.r, e.r * 0.8); g.lineTo(-e.r * 0.5, 0); g.lineTo(-e.r, -e.r * 0.8);
          g.closePath();
          g.fillStyle = MAG; g.fill();
          if (frames % 20 < 10) { g.strokeStyle = MAG; g.lineWidth = 2; g.stroke(); }   // donor's pulse
          g.restore();
        }

        /* you. Circle at rest, arrowhead along the velocity while dashing; white while aiming.
           Donor uses shadowBlur 20 here — faked with two layered fills instead. */
        if (decided !== 'lost') {
          const col = aiming ? WHITE : CYAN;
          g.fillStyle = 'rgba(0,255,255,0.16)';
          g.beginPath(); g.arc(p.x, p.y, R * 2.6, 0, TAU); g.fill();
          g.fillStyle = 'rgba(0,255,255,0.28)';
          g.beginPath(); g.arc(p.x, p.y, R * 1.7, 0, TAU); g.fill();
          g.beginPath();
          if (p.dashing) {
            const a = Math.atan2(p.vy, p.vx);
            g.moveTo(p.x + Math.cos(a) * R * 2, p.y + Math.sin(a) * R * 2);
            g.lineTo(p.x + Math.cos(a + Math.PI / 2) * R, p.y + Math.sin(a + Math.PI / 2) * R);
            g.lineTo(p.x + Math.cos(a - Math.PI / 2) * R, p.y + Math.sin(a - Math.PI / 2) * R);
          } else {
            g.arc(p.x, p.y, R, 0, TAU);
          }
          g.fillStyle = col; g.fill();
        }

        for (const q of parts) {                    // donor particles: round, alpha = life
          g.globalAlpha = clamp(q.life, 0, 1);
          g.fillStyle = q.col;
          g.beginPath(); g.arc(q.x, q.y, q.size, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
        for (const s of shocks) {
          g.globalAlpha = clamp(s.life, 0, 1);
          g.strokeStyle = WHITE; g.lineWidth = 4 * s.life;
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.stroke();
        }
        g.globalAlpha = 1;
        g.restore();                                // end 'lighter'

        /* ink rim on the thing you must go through — cream, pulsing on 8ths, first ~1.5 s */
        if (t < 1.5 && !decided && !e.dead) {
          const p8 = (env.beatPhase() * 2) % 1;
          g.strokeStyle = env.ink; g.lineWidth = 1.8;
          g.globalAlpha = (0.28 + 0.42 * (1 - p8)) * clamp((1.5 - t) / 0.35, 0, 1);
          g.beginPath(); g.arc(e.x, e.y, e.r + 7 + 3 * (1 - p8), 0, TAU); g.stroke();
          g.globalAlpha = 1;
        }
        g.restore();                                // end shake

        /* the encroaching darkness — donor's vignette formula, verbatim, with W for `width` */
        const dI = clamp(dark / 100, 0, 1);
        const cR = Math.max(0, (W * 0.6) * (1 - dI));
        const oR = Math.max(cR + 10, (W * 0.8) * (1 - dI * 0.5));
        const grad = g.createRadialGradient(W / 2, H / 2, cR, W / 2, H / 2, oR);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, 'rgba(0,0,0,' + (dI * 0.95).toFixed(3) + ')');
        g.fillStyle = grad; g.fillRect(0, 0, W, H);

        /* donor teaches the verb in its own words, then gets out of the way */
        g.textAlign = 'center'; g.textBaseline = 'alphabetic';
        if (t < 1.6 && !decided) {
          g.globalAlpha = 0.75 * clamp((1.6 - t) / 0.45, 0, 1);
          g.font = '700 12px ' + MONO; g.fillStyle = '#aaaaaa';
          spaced(g, 'HOLD. AIM. RELEASE THROUGH IT.', W / 2, 96, 1.6);
          g.globalAlpha = 1;
        }

        /* the brink flash. Donor slams the screen white at 0.8 for the 4 frames where
           hitstop > 2; the hitstop holds flash at 1, then fxStep dumps it in ~6 frames. */
        if (flash > 0) { g.fillStyle = 'rgba(255,255,255,' + (0.8 * flash).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }

        /* the world's own last word, small and low — the shell's stamp lands at y 240 and
           owns the eye; this reads underneath it. */
        if (decided === 'won') {
          g.globalAlpha = clamp((0.34 - announceT) * 6, 0, 1);
          g.font = '700 26px ' + MONO;
          g.fillStyle = MAG; spaced(g, 'BRINK', W / 2 + 2, 471, 6);
          g.fillStyle = CYAN; spaced(g, 'BRINK', W / 2 - 2, 469, 6);
          g.fillStyle = '#ffffff'; spaced(g, 'BRINK', W / 2, 470, 6);
          g.globalAlpha = 1;
        } else if (decided === 'lost') {
          g.globalAlpha = clamp((0.46 - announceT) * 4, 0, 1);
          g.font = '700 26px ' + MONO;
          g.fillStyle = MAG; spaced(g, 'CONSUMED', W / 2, 470, 6);   // donor's own gameOver title
          g.globalAlpha = 1;
        }
      }

      /* ---- QA bot: stay off the glass while it closes (time runs full speed with the finger
         up), then press aimed straight down its throat and let go the moment the simulated
         12 frames connect. Chains down -> up across polls. ---- */
      function hint() {
        if (decided) return { type: 'wait', ms: 200 };
        if (p.dashing || hitstop > 0) return { type: 'wait', ms: 60 };
        if (lastDown && !aiming) return { type: 'up' };   // a stale finger can never open the aim latch
        const dx = e.x - p.x, dy = e.y - p.y, d = Math.hypot(dx, dy) || 1;
        const ax = clamp(p.x + dx / d * 70, 14, W - 14);
        const ay = clamp(p.y + dy / d * 70, TOPB + 4, H - 14);
        const sx = ax - p.x, sy = ay - p.y, sd = Math.hypot(sx, sy) || 1;
        const ok = sd > MIN_AIM && simDash(sx / sd, sy / sd).hit;
        if (!aiming) return ok ? { type: 'down', x: ax, y: ay } : { type: 'wait', ms: 70 };
        return ok ? { type: 'up' } : { type: 'down', x: ax, y: ay };   // re-aim via touchMove
      }

      return {
        step, render,
        result: () => announced,
        timeout: () => decided === 'won' ? 'won' : 'lost',
        line: () => cause === 'touched' ? 'AVOIDANCE IS DEATH. IT SAID SO.'
          : cause === 'dark' ? 'THE DARK GOT TIRED OF WAITING.'
          : dashes > 0 ? "YOU DASHED. IT WASN'T THERE."
          : 'YOU AIMED FOREVER. LOVELY AIM.',
        hint,
      };
    },
  });
})();
/* DONE-CRITERIA
   - Releasing with the aim point > 5 px from the dot fires a dash of exactly 12 frames at
     30 px/frame (360 px, 0.2 s) and the drawn aim ray is that same simulation, bounces included;
     releasing within 5 px fires nothing at all and costs only the darkness spent aiming.
   - Overlapping the arrow WHILE dashing => 'won' with 6 frames of total freeze, screenShake 15,
     a full-screen white slam at 0.8 alpha, 25 magenta + 15 white particles, a shockwave growing
     20 px/frame, the 300/450/600 chord, and darkness -= 15 (the vignette visibly retreats).
     Verdict announced 0.34 s later; timeout() already reports 'won' from the frame of impact.
   - Overlapping the arrow while NOT dashing => 'lost' ('touched'), 50 cyan particles, saw 150->20
     over 1 s, darkness ramps to 100 so the frozen frame is black. Impossible while env.armed()
     is false: the arrow is held at HITR + 10 px and simply looms.
   - darkness starts at 16/28/40 by difficulty, climbs only while armed at 0.04/frame idle and
     0.08/frame aiming (both * timeScale, * 10/13/16), and 100 => 'lost' ('dark'). Never touching
     the glass at difficulty 0 is fatal inside the slot either way: the arrow arrives at ~2.35 s
     of armed time, the dark would finish at ~3.5 s.
   - Holding aim sets timeScale to 0.15 for the whole world — arrow, drift, particles, darkness.
   - Aim ray reads white at 0.3 alpha, dashed [5,10], and flips to a 4 px magenta + solid white
     line plus a pulsing lock ring on the arrow on exactly the frames the simulation connects.
   BUG-IS-GAME (do not fix):
   - The anti-camping rate is inverted. The donor doubles the creep while you hold (0.08 vs 0.04)
     and THEN multiplies by timeScale 0.15, so aiming accrues darkness 3.3x SLOWER per wall-clock
     second than standing still. Camping on the aim is a real reprieve; the slot clock is what
     actually punishes it. Do not "fix" the multiply.
   - Collision tests the gap BEFORE the arrow's move, so contact resolves one frame late. Both
     the live loop and the aim-ray simulation carry the same lag on purpose — they must agree.
   - The aim latch only opens inside a fresh press. Keep your thumb down through a dash and the
     next release does nothing until you lift and press again. Donor input model; do not soften.
   - Invulnerability is ONLY the 12 dash frames. There is no dodge, no block, no grace window —
     "Avoidance is death" is the donor's thesis printed on its own title screen.
   - The bounce is a hard reflect off all four walls at full dash speed, so a dash into a wall
     can ricochet back through the arrow and win. Keep it.
   - The vignette is centred on the SCREEN, not on you, so dashing outward dashes into the dark.
   - No score, no combo, no darkness bar. The closing vignette and the rising 40->80 Hz drone are
     the only readouts the donor ever had.
*/

/* ===== carts/26-swing.js ===== */
/* THURIBLE — "a one-thumb liturgy". A coal on a verlet chain; speed is the only sacrament.
   Physics, thresholds and palette are quoted out of the release build. The donor sizes the
   whole world by unit = clamp(Math.min(W,H)/720, 0.62, 1.5); at 390x844 that evaluates to
   390/720 = 0.5417 and CLAMPS TO THE FLOOR — so unit = 0.62 is the number the donor used on
   every phone it ever ran on, and it is the number used here. Nothing is reskinned: dark
   liturgy, oxblood and ember, chain links, candle flames, the donor's own #heatbar gradient. */
(function () {
  registerGame({
    id: 'swing',
    title: 'THURIBLE',
    command: 'SWING IT!',
    family: 'drag',
    slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, TAU = Math.PI * 2;
      const D = env.difficulty | 0;
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      const rnd = (a, b) => a + env.rng() * (b - a);

      /* ---------------- donor :root palette, verbatim ---------------- */
      const OXBLOOD = '#5c1220', EMBER = '#ff8a2b', GOLD = '#f2c14e',
        BONE = '#efe3cf', SMOKE = '#7b8ba3', HOT = '#fff6e0',
        ASH = '#8c7a63',      // draw(): the coal's fill while hot <= 0.34 — dead charcoal
        SLATE = '#6d7f97',    // the cold trail, and the cold end of #heatbar
        WISP = '#cfd8e6',     // TYPES.milksop.hue
        DIM = '#6f6478';      // #mult, unlit
      /* Cinzel + IBM Plex Mono are web fonts; the contract's canvas stacks stand in. */
      const FS = (px) => '600 ' + px + 'px Georgia,"Times New Roman",serif';
      const FM = (px) => '700 ' + px + 'px "Consolas","Courier New",monospace';

      /* ---------------- donor constants — DO NOT RETUNE ---------------- */
      const unit = 0.62;
      const SEGS = 11;                   // const SEGS = 11
      const segLen = 15 * unit;          // segLen = 15 * unit -> 9.30 px, ~93 px of chain
      const DAMP = 0.992;                // verlet: vx = (p.x - p.px) * 0.992
      const ITER = 5;                    // for (let it = 0; it < 5; it++) relaxation passes
      const KILL = 780 * unit;           // 483.6 px/s — THE GATE. below it the coal only shoves.
      const NUDGE = 340 * unit;          // 210.8 px/s — under this the coal does not even shove
      const WHITE = 2300 * unit;         // 1426 px/s — update(): the coal bites for 3
      const WHITE_DRAW = 1700 * unit;    // 1054 px/s — draw() uses a DIFFERENT white (kept, see below)
      const PR = 13 * unit;              // player.r
      /* Audio_.bell pitches, donor line 321 */
      const SCALE = [196, 233.08, 261.63, 293.66, 349.23, 392, 466.16, 523.25, 587.33, 698.46];

      /* ---------------- the sanctuary ---------------- */
      const ALT = { x: 195, y: 150 };    // the candle rank — the thing the wisps came for
      const BREACH = 32;                 // this close to the rank and the light goes out
      /* Thumb-occlusion law: the thurifer is penned into the upper field so the coal always
         swings in the top 2/3 (y 107..545). The thumb itself is free — input is relative. */
      const HX0 = 56, HX1 = 334, HY0 = 200, HY1 = 452;

      /* milksop: r 13, spd 52, hp 1, score 100, hue #cfd8e6 — the donor's plainest wisp.
         Two deliberate deviations, both because a donor wave runs half a minute and this
         slot runs eight beats: the radius is x1.55 so a 16 px enemy reads at a glance, and
         the approach carries a difficulty multiplier so the rank is actually threatened. */
      const WN = [2, 3, 4][D];
      const WR = 13 * unit * 1.55;                     // 12.49 px
      const WSPD = 52 * unit * [2.32, 3.10, 3.65][D];  // 74.8 / 99.9 / 117.7 px/s
      const SPAWN_R = [480, 452, 428][D];              // reaches the rank in 6.0 / 4.2 / 3.4 s

      /* ---------------- state ---------------- */
      let t = 0, done = 'pending', why = 'bell';
      let hitstop = 0, shake = 0, shX = 0, shY = 0, flash = 0, flashCol = GOLD;
      let heat = 0, live = 0, killChain = 0, kills = 0, shoves = 0, lit = 3;
      let droneT = 0, whooshT = 0, opened = false, wasDown = false;
      let lastPX = 195, lastPY = 500, sweep = 1, botY = 700, flipT = -1;
      const P = { x: 195, y: 330, tx: 195, ty: 330, vx: 0, vy: 0, face: 0 };
      const chain = [], trail = [], puffs = [], parts = [], pops = [], wisps = [];

      for (let i = 0; i < SEGS; i++)     // resetChain(): a straight line, let the solver settle it
        chain.push({ x: P.x + i * segLen, y: P.y, px: P.x + i * segLen, py: P.y });
      const head = () => chain[SEGS - 1];

      /* Wisps condense out of the incense low in the nave, on an arc below the rank, and walk
         straight at it. The arc is deliberately steep (0.30pi..0.70pi) so every one of them
         starts ON screen, below the coal's reach, and has to climb into it. */
      for (let i = 0; i < WN; i++) {
        const a = Math.PI * (0.30 + 0.40 * ((i + 0.5) / WN)) + rnd(-0.05, 0.05);
        wisps.push({
          x: ALT.x + Math.cos(a) * SPAWN_R, y: ALT.y + Math.sin(a) * SPAWN_R,
          vx: 0, vy: 0, r: WR, spd: WSPD, seed: rnd(0, TAU),
          stagger: 0, cold: 0, born: 0,
        });
      }

      /* ---------------- audio: the donor's rig, rebuilt on the sfx bus ---------------- */
      const AU = env.audio;
      /* Audio_.bell is FM (sine carrier, modulator at 2.41x, index freq*1.6 decaying to 1).
         There is no modulator here, so the 2.41 partial is voiced as a second short sine. */
      const bell = (f, dur, vol) => {
        AU.tone({ f, type: 'sine', dur, vol });
        AU.tone({ f: f * 2.41, type: 'sine', dur: dur * 0.28, vol: vol * 0.34 });
      };
      const sOpen = () => AU.tone({ f: 98, type: 'triangle', dur: 1.1, vol: 0.12 });  // startRun()
      const sShove = () => AU.noise({ dur: 0.07, lp: 500, vol: 0.05 });               // 0.2 chance, donor
      const sSnuff = () => {                                                          // die()
        bell(196, 1.2, 0.26);
        AU.tone({ f: 220, f2: 40, type: 'sawtooth', dur: 0.9, vol: 0.14 });
        AU.noise({ dur: 0.5, lp: 1200, vol: 0.2 });
      };
      const sSanctum = () => {   // the wave-clear chord — inside 300 ms, unmistakable
        [261.63, 392, 523.25, 698.46].forEach((f, i) => bell(f, 1.1 - i * 0.14, 0.17 - i * 0.02));
        AU.noise({ dur: 0.42, hp: 700, vol: 0.16 });
        AU.tone({ f: 98, f2: 196, type: 'triangle', dur: 0.5, vol: 0.14 });
      };

      /* ---------------- fx ---------------- */
      function burst(x, y, color, n, spd) {
        for (let i = 0; i < n && parts.length < 120; i++) {
          const a = rnd(0, TAU), s = rnd(0.2, 1) * spd * unit;
          parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.25, 0.7), max: 0.7, color, r: rnd(1.2, 3.2) * unit * 1.5 });
        }
      }
      const pop = (x, y, text, color) => { pops.push({ x, y: Math.min(y, 520), text, color, life: 0.85 }); if (pops.length > 6) pops.shift(); };

      /* point-to-segment: the coal is tested along the segment it swept this frame, not at a
         point. At whip speed the head crosses 25 px per frame and would otherwise tunnel. */
      function segDist(ax, ay, bx, by, px, py) {
        const dx = bx - ax, dy = by - ay, L = dx * dx + dy * dy;
        let u = L > 0 ? ((px - ax) * dx + (py - ay) * dy) / L : 0;
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        return Math.hypot(px - (ax + dx * u), py - (ay + dy * u));
      }

      /* ---------------- the chain, solved exactly as the release build solves it -------- */
      function stepChain(dt) {
        const hand = { x: P.x + Math.cos(P.face) * 6 * unit, y: P.y + Math.sin(P.face) * 6 * unit };
        for (let i = 1; i < SEGS; i++) {
          const p = chain[i];
          const vx = (p.x - p.px) * DAMP, vy = (p.y - p.py) * DAMP;
          p.px = p.x; p.py = p.y;
          p.x += vx; p.y += vy;
        }
        chain[0].x = hand.x; chain[0].y = hand.y; chain[0].px = hand.x; chain[0].py = hand.y;
        for (let it = 0; it < ITER; it++) {
          for (let i = 0; i < SEGS - 1; i++) {
            const a = chain[i], b = chain[i + 1];
            const ax = b.x - a.x, ay = b.y - a.y;
            const d = Math.hypot(ax, ay) || 0.0001;
            const diff = (d - segLen) / d;
            const w = i === 0 ? 0 : 0.5, mv = i === 0 ? 1 : 0.5;   // link 0 is the fist: immovable
            a.x += ax * diff * w; a.y += ay * diff * w;
            b.x -= ax * diff * mv; b.y -= ay * diff * mv;
          }
          chain[0].x = hand.x; chain[0].y = hand.y;
        }
        /* "never park — a still chain is a cold chain": the coal is nudged onto a slow orbit
           whenever it collapses back onto the fist. 26*unit*dt*8 = ~80 px/s, a sixth of KILL. */
        const h = head();
        if (Math.hypot(h.x - hand.x, h.y - hand.y) < segLen * 1.2) {
          const a = t * 3.1;
          h.x += Math.cos(a) * 26 * unit * dt * 8;
          h.y += Math.sin(a) * 26 * unit * dt * 8;
        }
        h.x = clamp(h.x, -30, W + 30); h.y = clamp(h.y, -30, H + 30);
      }

      /* =============================== STEP =============================== */
      function step(dt, inp) {
        t += dt;
        if (!opened) { opened = true; sOpen(); }
        if (hitstop > 0) { hitstop -= dt; return; }     // donor: hitstop freezes update entirely
        const armed = env.armed();

        /* input — the donor's TOUCH branch: the thumb moves the thurifer BY ITS DELTA, so the
           hand never teleports under the finger and the whole read stays out from under it. */
        if (inp.down && done === 'pending') {
          if (!wasDown || inp.justDown) { lastPX = inp.x; lastPY = inp.y; }
          else { P.tx += inp.x - lastPX; P.ty += inp.y - lastPY; lastPX = inp.x; lastPY = inp.y; }
        }
        wasDown = inp.down;
        P.tx = clamp(P.tx, HX0, HX1); P.ty = clamp(P.ty, HY0, HY1);

        const dx = P.tx - P.x, dy = P.ty - P.y;
        const k = 1 - Math.pow(0.0009, dt);             // ~0.14 s of weight in the wrist
        P.vx = dx * k / Math.max(dt, 0.0001); P.vy = dy * k / Math.max(dt, 0.0001);
        P.x += dx * k; P.y += dy * k;
        if (Math.hypot(P.vx, P.vy) > 20) P.face = Math.atan2(P.vy, P.vx);

        stepChain(dt);
        const h = head();
        const spd = Math.hypot(h.x - h.px, h.y - h.py) * 60;      // headSpeed(), px/sec
        const spd01 = clamp((spd - 120) / 1700, 0, 1);            // donor: raw, NOT unit-scaled
        heat += (clamp((spd - KILL) / (WHITE - KILL), 0, 1) * 1.35 - 0.95) * dt;
        heat = clamp(heat, 0, 1);
        /* THE GATE, made visible: `live` snaps up in ~0.08 s the instant the coal can kill and
           bleeds out in ~0.25 s. It drives the swell, the core colour and the rim. The donor
           swells only with `heat`, which needs 1150 px/s — far past the gate — to even rise. */
        live = spd > KILL ? Math.min(1, live + dt * 12) : Math.max(0, live - dt * 4);
        const headR = (19 + heat * 13 + live * 9) * unit;

        /* the donor holds one looping bandpassed noise on a gain; one-shots stand in for it */
        whooshT -= dt;
        if (spd01 > 0.10 && whooshT <= 0) {
          whooshT = 0.09;
          AU.noise({ dur: 0.11, vol: Math.pow(spd01, 1.6) * 0.16, hp: 180 + spd01 * 900, lp: 420 + spd01 * 2800 });
        }
        droneT -= dt;                                    // 55 / 55.6 saws + the 82.5 fifth on heat
        if (droneT <= 0 && done === 'pending') {
          droneT = 0.5;
          AU.tone({ f: 55, type: 'triangle', dur: 0.75, vol: 0.05, attack: 0.3 });
          AU.tone({ f: 55.6, type: 'triangle', dur: 0.75, vol: 0.035, attack: 0.3 });
          if (heat > 0.03) AU.tone({ f: 82.5, type: 'triangle', dur: 0.75, vol: heat * 0.05, attack: 0.3 });
        }

        trail.push({ x: h.x, y: h.y, s: spd01 });
        if (trail.length > 34) trail.shift();
        if (env.rng() < 0.40 && puffs.length < 44) {
          puffs.push({ x: h.x + rnd(-4, 4), y: h.y + rnd(-4, 4), vx: rnd(-14, 14) * unit, vy: rnd(-26, -8) * unit, life: rnd(0.8, 1.8), max: 1.8, r: rnd(6, 16) * unit * 1.4 });
        }

        /* ---- the wisps ---- */
        for (let i = wisps.length - 1; i >= 0; i--) {
          const e = wisps[i];
          e.born = Math.min(1, e.born + dt * 2.9);       // ~0.35 s of condensing out of the smoke
          if (e.cold > 0) e.cold -= dt;
          if (armed && done === 'pending') {
            if (e.stagger > 0) {                          // knocked back: coast, 0.9 per frame
              e.stagger -= dt;
              e.x += e.vx * dt; e.y += e.vy * dt;
              e.vx *= 0.9; e.vy *= 0.9;
            } else {
              const toA = Math.atan2(ALT.y - e.y, ALT.x - e.x);
              const wob = Math.sin(t * 2.4 + e.seed) * 0.5;   // milksop's drunken heading wobble
              e.x += Math.cos(toA + wob) * e.spd * dt;
              e.y += Math.sin(toA + wob) * e.spd * dt;
            }
          }
          if (done !== 'pending') continue;

          /* censer collision — the whole game lives in this branch */
          const d = segDist(h.px, h.py, h.x, h.y, e.x, e.y);
          if (d < e.r + headR && e.born > 0.4) {
            if (spd > KILL) {
              wisps.splice(i, 1);
              kills++; killChain++;
              burst(e.x, e.y, WISP, 16, 300);
              burst(e.x, e.y, spd > WHITE ? HOT : EMBER, 10, 220);
              hitstop = spd > WHITE ? 0.075 : 0.04;
              shake = Math.min(24, shake + 6);
              flash = Math.max(flash, 0.22); flashCol = EMBER;
              bell(SCALE[Math.min(9, killChain)], 0.9, 0.16);
              if (spd > WHITE) bell(SCALE[Math.min(9, killChain)] * 2, 0.5, 0.08);
              if (!wisps.length) {                        // WIN — resolved on the kill itself
                done = 'won';
                flash = 0.62; flashCol = GOLD;
                shake = 26; hitstop = 0.075;
                burst(h.x, h.y, GOLD, 26, 420);
                burst(ALT.x, ALT.y, HOT, 18, 300);
                pop(ALT.x, ALT.y + 62, 'sanctum', GOLD);
                sSanctum();
              }
              continue;   // it is gone; do not let a corpse trip the breach test below
            } else if (spd > NUDGE) {
              /* the shove: a slow coal is a heavy object, nothing more. This is the lesson. */
              const kb = Math.atan2(e.y - h.y, e.x - h.x);
              e.vx = Math.cos(kb) * 170 * unit; e.vy = Math.sin(kb) * 170 * unit;
              e.stagger = 0.18; e.cold = 0.4; shoves++;
              if (env.rng() < 0.2) sShove();
              if (env.rng() < 0.28) pop(e.x, e.y - e.r - 8, 'too slow', SLATE);
              burst(e.x, e.y, SLATE, 4, 110);
            }
          }

          /* the breach: the rank is snuffed, and that is the round */
          if (armed && done === 'pending' && Math.hypot(e.x - ALT.x, e.y - ALT.y) < BREACH + e.r) {
            done = 'lost'; why = 'breach'; lit = 0;
            shake = 22; flash = 0.4; flashCol = OXBLOOD;
            burst(ALT.x, ALT.y, OXBLOOD, 24, 300);
            burst(ALT.x, ALT.y, SMOKE, 18, 180);
            sSnuff();
          }
        }

        /* ---- decay ---- */
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i];
          p.life -= dt;
          if (p.life <= 0) { parts.splice(i, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= 0.94; p.vy = p.vy * 0.94 + 60 * unit * dt;
        }
        for (let i = puffs.length - 1; i >= 0; i--) {
          const p = puffs[i];
          p.life -= dt;
          if (p.life <= 0) { puffs.splice(i, 1); continue; }
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= 0.98; p.vy *= 0.985; p.r += 24 * unit * dt;
        }
        for (let i = pops.length - 1; i >= 0; i--) {
          const p = pops[i]; p.life -= dt; p.y -= 42 * unit * dt;
          if (p.life <= 0) pops.splice(i, 1);
        }
        shake = Math.max(0, shake - dt * 52);
        shX = shake > 0 ? rnd(-shake, shake) * 0.35 : 0;
        shY = shake > 0 ? rnd(-shake, shake) * 0.35 : 0;
        flash = Math.max(0, flash - dt * 2.2);
      }

      /* ============================== RENDER ============================== */
      /* one pre-rendered radial sprite, blitted with 'lighter' — the donor's makeGlow(128).
         Nothing in this cartridge ever touches shadowBlur. */
      const GLOW = env.layer(128, 128, (c) => {
        const gr = c.createRadialGradient(64, 64, 0, 64, 64, 64);
        gr.addColorStop(0, 'rgba(255,255,255,1)');
        gr.addColorStop(0.28, 'rgba(255,255,255,0.42)');
        gr.addColorStop(0.62, 'rgba(255,255,255,0.10)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        c.fillStyle = gr; c.fillRect(0, 0, 128, 128);
      });
      let BG = null, VG = null, MG = null;

      function glow(g, x, y, size, alpha) {
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.globalAlpha = alpha;
        g.drawImage(GLOW, x - size / 2, y - size / 2, size, size);
        g.restore();
      }

      /* the donor's candle: a teardrop of hot -> ember 55% -> oxblood, on the @keyframes
         flick cycle (1.1 s: squat and skew right at 45%, stretch and skew left at 70%) */
      function candle(g, x, footY, bodyH, fh, fw, on, ph) {
        g.globalAlpha = 0.72; g.fillStyle = BONE;
        g.fillRect(x - 5.5, footY - bodyH, 11, bodyH);
        g.globalAlpha = 1; g.fillStyle = 'rgba(10,7,16,0.35)';
        g.fillRect(x + 2, footY - bodyH, 3.5, bodyH);            // wax shadow down one side
        const top = footY - bodyH;
        if (!on) {
          g.globalAlpha = 0.5; g.fillStyle = '#2a2430';
          teardrop(g, x, top, fw * 0.8, fh * 0.55); g.fill();
          g.globalAlpha = 1;
          return;
        }
        const sy = 1 + 0.095 * Math.sin(ph * TAU + 1.2);
        const sk = 0.055 * Math.sin(ph * TAU + 2.6);
        glow(g, x, top - fh * 0.45, fh * 3.4, 0.30);
        g.save();
        g.translate(x, top);
        g.transform(1, 0, sk, sy, 0, 0);
        const fg = g.createLinearGradient(0, -fh, 0, 0);
        fg.addColorStop(0, HOT); fg.addColorStop(0.55, EMBER); fg.addColorStop(1, OXBLOOD);
        g.fillStyle = fg;
        teardrop(g, 0, 0, fw, fh); g.fill();
        g.fillStyle = 'rgba(255,246,224,0.85)';
        teardrop(g, 0, -fh * 0.16, fw * 0.42, fh * 0.42); g.fill();
        g.restore();
      }
      function teardrop(g, x, baseY, w, h) {
        g.beginPath();
        g.moveTo(x, baseY - h);
        g.quadraticCurveTo(x + w * 0.62, baseY - h * 0.5, x + w * 0.5, baseY - h * 0.16);
        g.quadraticCurveTo(x + w * 0.5, baseY + h * 0.06, x, baseY + h * 0.06);
        g.quadraticCurveTo(x - w * 0.5, baseY + h * 0.06, x - w * 0.5, baseY - h * 0.16);
        g.quadraticCurveTo(x - w * 0.62, baseY - h * 0.5, x, baseY - h);
      }

      function render(g) {
        const h = head();
        const spd = Math.hypot(h.x - h.px, h.y - h.py) * 60;
        const headR = (19 + heat * 13 + live * 9) * unit;

        if (!BG) {
          BG = g.createLinearGradient(0, 0, 0, H);
          BG.addColorStop(0, '#120a18'); BG.addColorStop(0.55, '#0a0710'); BG.addColorStop(1, '#160a10');
          VG = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.78);
          VG.addColorStop(0, 'rgba(0,0,0,0)'); VG.addColorStop(1, 'rgba(0,0,0,0.72)');
        }
        g.fillStyle = BG; g.fillRect(0, 0, W, H);

        g.save();
        g.translate(shX, shY);

        /* sanctuary floor: four rings and twelve spokes, R = min(W,H)*0.46 */
        g.save();
        g.globalAlpha = 0.16; g.strokeStyle = '#4a2233'; g.lineWidth = 1;
        const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.46;
        for (let i = 1; i <= 4; i++) { g.beginPath(); g.arc(cx, cy, R * (i / 4), 0, TAU); g.stroke(); }
        g.beginPath();
        for (let i = 0; i < 12; i++) {
          const a = (i / 12) * TAU;
          g.moveTo(cx + Math.cos(a) * R * 0.25, cy + Math.sin(a) * R * 0.25);
          g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
        }
        g.stroke();
        g.restore();

        /* the altar: three candles on a slab, the whole reason you are swinging */
        const ph = (t / 1.1) % 1;
        g.fillStyle = '#160c1c'; g.fillRect(120, 176, 150, 15);
        g.fillStyle = OXBLOOD; g.fillRect(120, 176, 150, 2.5);
        g.fillStyle = 'rgba(92,18,32,0.5)'; g.fillRect(132, 191, 126, 4);
        candle(g, 152, 176, 44, 26, 15, lit > 0, ph);
        candle(g, 195, 176, 54, 30, 17, lit > 0, ph + 0.37);
        candle(g, 238, 176, 44, 26, 15, lit > 0, ph + 0.68);

        /* smoke */
        g.save();
        g.fillStyle = '#8fa2b8';
        for (const p of puffs) {
          g.globalAlpha = (p.life / p.max) * 0.16;
          g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
        }
        g.restore();

        /* the arc the coal cut — slate while it is only theatre, ember once it bites */
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.lineCap = 'round';
        for (let i = 1; i < trail.length; i++) {
          const a0 = trail[i - 1], a1 = trail[i], f = i / trail.length, s = a1.s;
          g.globalAlpha = f * (0.12 + s * 0.5);
          g.strokeStyle = s > 0.72 ? HOT : s > 0.42 ? '#ff9a3c' : SLATE;
          g.lineWidth = (1 + f * 8 * (0.4 + s)) * unit * 1.6;
          g.beginPath(); g.moveTo(a0.x, a0.y); g.lineTo(a1.x, a1.y); g.stroke();
        }
        g.restore();

        /* wisps */
        for (const e of wisps) {
          const col = e.cold > 0 ? SLATE : WISP;
          g.globalAlpha = Math.min(1, e.born);
          glow(g, e.x, e.y, e.r * 5.6, 0.22 * Math.min(1, e.born));
          g.save();
          g.translate(e.x, e.y);
          const wob = Math.sin(t * 3 + e.seed) * 0.16;
          g.strokeStyle = col; g.fillStyle = 'rgba(10,7,16,0.85)'; g.lineWidth = 1.8 * unit * 2.2;
          g.beginPath(); g.ellipse(0, 0, e.r * (1 + wob), e.r * (1 - wob), 0, 0, TAU);
          g.fill(); g.stroke();
          g.fillStyle = e.cold > 0 ? 'rgba(109,127,151,0.22)' : 'rgba(207,216,230,0.16)';
          g.beginPath(); g.ellipse(0, 0, e.r * (1 + wob), e.r * (1 - wob), 0, 0, TAU); g.fill();
          g.globalAlpha = 0.8 * Math.min(1, e.born);
          g.beginPath(); g.moveTo(0, e.r * 0.5); g.lineTo(0, e.r * 1.5); g.stroke();
          if (e.cold > 0) {                       // the shove ring: a cold clank, nothing died
            g.globalAlpha = e.cold * 1.6;
            g.strokeStyle = SLATE; g.lineWidth = 1.6;
            g.beginPath(); g.arc(0, 0, e.r + 6 + (0.4 - e.cold) * 34, 0, TAU); g.stroke();
          }
          g.restore();
          g.globalAlpha = 1;
        }

        /* the chain: eleven links of bone-coloured brass */
        g.strokeStyle = 'rgba(214,203,182,0.55)'; g.lineWidth = 1.6 * unit * 1.6;
        g.beginPath(); g.moveTo(chain[0].x, chain[0].y);
        for (let i = 1; i < SEGS; i++) g.lineTo(chain[i].x, chain[i].y);
        g.stroke();
        g.fillStyle = 'rgba(214,203,182,0.75)';
        for (let i = 1; i < SEGS - 1; i++) { g.beginPath(); g.arc(chain[i].x, chain[i].y, 1.6 * unit * 1.6, 0, TAU); g.fill(); }

        /* the thurifer */
        g.save();
        g.translate(P.x, P.y);
        g.fillStyle = '#241726';
        g.beginPath();
        g.moveTo(0, -PR * 1.5);
        g.quadraticCurveTo(PR * 1.25, -PR * 0.2, PR * 1.05, PR * 1.55);
        g.lineTo(-PR * 1.05, PR * 1.55);
        g.quadraticCurveTo(-PR * 1.25, -PR * 0.2, 0, -PR * 1.5);
        g.fill();
        g.strokeStyle = OXBLOOD; g.lineWidth = 1.6 * unit * 1.6;
        g.beginPath(); g.arc(0, -PR * 0.45, PR * 0.85, Math.PI * 0.08, Math.PI * 0.92, true); g.stroke();
        g.fillStyle = GOLD;
        g.beginPath(); g.arc(-PR * 0.28, -PR * 0.5, 1.5 * unit * 1.6, 0, TAU); g.fill();
        g.beginPath(); g.arc(PR * 0.28, -PR * 0.5, 1.5 * unit * 1.6, 0, TAU); g.fill();
        g.restore();
        glow(g, P.x, P.y, 46 * unit * 1.4, 0.10);

        /* THE COAL. Cold it is charcoal with a dull rim; the instant it passes KILL it swells,
           the core goes cream and the rim lights. That change IS the rule of the game. */
        const hotv = clamp((spd - 200 * unit) / (WHITE_DRAW - 200 * unit), 0, 1);
        glow(g, h.x, h.y, (60 + heat * 90 + hotv * 50 + live * 90) * unit * 1.5, 0.16 + hotv * 0.22 + live * 0.42);
        g.save();
        g.fillStyle = hotv > 0.66 ? HOT : hotv > 0.34 ? '#ffb15c' : ASH;
        g.beginPath(); g.arc(h.x, h.y, headR * 0.55, 0, TAU); g.fill();
        if (live > 0.01) {          // the honest gate paints straight over the flattering one
          g.fillStyle = 'rgba(255,246,224,' + (0.88 * live).toFixed(3) + ')';
          g.beginPath(); g.arc(h.x, h.y, headR * 0.55, 0, TAU); g.fill();
        }
        g.strokeStyle = spd > KILL ? 'rgba(255,246,224,0.85)' : 'rgba(160,146,120,0.6)';
        g.lineWidth = 2 * unit * 1.7;
        g.beginPath(); g.arc(h.x, h.y, headR, 0, TAU); g.stroke();
        g.globalAlpha = 0.7;
        for (let i = 0; i < 5; i++) {                    // five brazier slats, spun by the heat
          const a = (i / 5) * TAU + t * (0.6 + hotv * 3 + live * 4);
          g.beginPath();
          g.moveTo(h.x + Math.cos(a) * headR * 0.5, h.y + Math.sin(a) * headR * 0.5);
          g.lineTo(h.x + Math.cos(a) * headR, h.y + Math.sin(a) * headR);
          g.stroke();
        }
        g.globalAlpha = 1;
        if (live > 0.01) {                               // the live corona: only above the gate
          g.strokeStyle = 'rgba(255,246,224,' + (0.55 * live).toFixed(3) + ')';
          g.lineWidth = 1.6;
          g.beginPath(); g.arc(h.x, h.y, headR + 5 + live * 5, 0, TAU); g.stroke();
        }
        g.restore();

        /* the one shared marking: ink rim on the coal, 8th-note pulse, first ~1.5 s */
        if (t < 1.5) {
          const e8 = 1 - ((env.beatPhase() * 2) % 1);
          g.globalAlpha = (0.25 + 0.5 * e8 * e8) * (1 - t / 1.5);
          g.strokeStyle = env.ink; g.lineWidth = 2.4;
          g.beginPath(); g.arc(h.x, h.y, headR + 9, 0, TAU); g.stroke();
          g.globalAlpha = 1;
        }

        /* particles */
        g.save();
        g.globalCompositeOperation = 'lighter';
        for (const p of parts) {
          g.globalAlpha = clamp(p.life / p.max, 0, 1);
          g.fillStyle = p.color;
          g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill();
        }
        g.restore();

        g.textAlign = 'center';
        for (const p of pops) {
          g.globalAlpha = clamp(p.life / 0.85, 0, 1);
          g.fillStyle = p.color; g.font = FM(12);
          g.fillText(p.text, p.x, p.y);
        }
        g.globalAlpha = 1;
        g.restore();

        g.fillStyle = VG; g.fillRect(0, 0, W, H);

        /* the gate, read out loud — the donor's #heatbar gradient, lifted off the bottom edge
           (where a thumb lives) to the top strip, with the KILL threshold notched */
        const bw = 200, bx = W / 2 - bw / 2, by = 44, bh = 7;
        const f = clamp(spd / WHITE, 0, 1);
        g.fillStyle = 'rgba(239,227,207,0.07)'; g.fillRect(bx, by, bw, bh);
        if (!MG) {
          MG = g.createLinearGradient(bx, 0, bx + bw, 0);
          MG.addColorStop(0, SLATE); MG.addColorStop(0.55, EMBER); MG.addColorStop(1, HOT);
        }
        g.save();
        g.beginPath(); g.rect(bx, by, bw * f, bh); g.clip();
        g.fillStyle = MG; g.fillRect(bx, by, bw, bh);
        g.restore();
        const kx = bx + bw * (KILL / WHITE);
        g.fillStyle = spd > KILL ? HOT : 'rgba(239,227,207,0.45)';
        g.fillRect(kx - 1, by - 4, 2, bh + 8);
        g.font = FM(9);
        g.fillStyle = spd > KILL ? HOT : spd > NUDGE ? EMBER : DIM;
        g.fillText(spd > KILL ? 'B U R N I N G' : spd > NUDGE ? 's h o v i n g' : 'c o l d', W / 2, by + 22);

        if (flash > 0.01) {
          g.globalAlpha = flash * 0.42; g.fillStyle = flashCol;
          g.fillRect(0, 0, W, H); g.globalAlpha = 1;
        }
        if (done === 'won') {
          g.textAlign = 'center'; g.font = FS(21); g.fillStyle = 'rgba(242,193,78,0.95)';
          g.fillText('the smoke went where you sent it', W / 2, 258);
        }
      }

      /* ---------------- verdicts ---------------- */
      function ring() {                    // the bell at the end of an unfinished offering
        if (done !== 'pending') return;
        done = 'lost';
        why = (kills === 0 && shoves > 0) ? 'shove' : 'bell';   // all push, no burn
        shake = 18; flash = 0.32; flashCol = OXBLOOD;
        burst(head().x, head().y, SMOKE, 16, 200);
        sSnuff();
      }
      const LINES = {
        breach: 'THEY BLEW OUT YOUR WHOLE POINT.',
        shove: 'YOU SHOVED THEM. POLITELY.',
        bell: 'YOU HELD IT LIKE A NAPKIN.',
      };

      return {
        step, render,
        result: () => done,
        timeout() {                        // do-the-thing game: an unfinished rank is a loss
          if (done === 'pending') { if (!wisps.length) done = 'won'; else ring(); }
          return done;
        },
        line: () => LINES[why] || LINES.bell,
        /* The bot plays it the way the donor's own title card tells you to: never park. It
           keeps the thumb DOWN and slams it corner to corner — because input is relative, one
           press per poll is one ~300 px throw of the fist, which the k = 1-0.0009^dt chase
           turns into ~1700 px/s of wrist and the chain whips past that again. Between throws
           it drags the whole ping-pong up or down onto whichever wisp is nearest the rank;
           the chain trails at the fist's own height, so matching that y is all the aiming
           there is. The y-steer is proportional and pinned inside the thumb's own travel, so
           it can stall but never run away and never has to let go mid-round.
           It also has to WAIT: the fist is 0.14 s of exponential behind its target, so
           reversing every poll would just jiggle it about the middle at a dead 200 px/s.
           Each throw is held until the fist has actually arrived (or 0.42 s has passed) —
           the same lesson the game teaches a human. Swing wide; do not stir. */
        hint() {
          if (done !== 'pending' || !wisps.length) return { type: 'wait', ms: 120 };
          if (Math.abs(P.x - P.tx) > 46 && t - flipT < 0.42) return { type: 'wait', ms: 55 };
          let tgt = wisps[0], bd = 1e9;
          for (const e of wisps) {
            const d = Math.hypot(e.x - ALT.x, e.y - ALT.y);
            if (d < bd) { bd = d; tgt = e; }
          }
          botY = clamp(botY + clamp((clamp(tgt.y, HY0, HY1) - P.ty) * 0.5, -60, 60), 430, 830);
          flipT = t;
          sweep = -sweep;
          return { type: 'down', x: sweep > 0 ? 346 : 44, y: botY };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - The kill gate is the donor's: headSpeed() = hypot(h.x-h.px, h.y-h.py)*60 must exceed
     KILL = 780*0.62 = 483.6 px/s at the moment of contact. Between NUDGE = 340*0.62 = 210.8
     and KILL the wisp is only knocked back at 170*unit for stagger 0.18 s and SURVIVES, with
     a slate ring, a 4-particle slate puff and (28% of the time) a 'too slow' pop. Under
     NUDGE nothing happens at all. A slow swing visibly fails; that is the whole cartridge.
   - Crossing KILL changes the coal inside one frame: `live` ramps 0->1 in ~0.08 s, the radius
     goes (19 + heat*13 + live*9)*unit, a cream core is painted straight over the ash one, the
     rim flips to rgba(255,246,224,0.85), a corona appears, the glow roughly triples (alpha
     0.16+hotv*0.22+live*0.42 over a 60+..+live*90 sprite), the slats spin up, and the top
     meter's notched KILL tick lights with 'B U R N I N G'. Below NUDGE it reads 'c o l d'.
   - Chain physics are byte-faithful: SEGS 11, segLen 15*unit = 9.30, verlet damping 0.992,
     five relaxation passes with w=0/mv=1 on link 0, the hand offset 6*unit along player.face,
     the fist chased at k = 1 - 0.0009^dt, and the anti-collapse orbit at 26*unit*dt*8 whenever
     the coal falls inside segLen*1.2 of the fist.
   - Clearing the rank (2 / 3 / 4 wisps at difficulty 0 / 1 / 2) resolves 'won' ON the kill:
     flash 0.62 gold, shake 26, hitstop 0.075, a 26-particle gold burst plus 18 cream at the

/* ===== carts/27-kick.js ===== */
/* POCKET MOON — BOON MOOTS · "KICK IT!" · charge the boot, fire the ball through the queue.
   Donor: boon-moots-pocket-moon. A fully-round pocket moon — every position is a unit vector,
   every velocity is parallel-transported along the surface. Sphere math, creature table, kick
   + aim-assist, ball drag, hitstop/shake numbers and palette are quoted from that source.
   Dropped on purpose: the donor's Google font (contract: canvas stacks only; Anton's own
   fallback chain already names Arial Black) and its dedication line (no credits in-game). */
(function () {
  registerGame({
    id: 'kick', title: 'POCKET MOON', command: 'KICK IT!', family: 'release', slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, D = env.difficulty | 0, TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

      /* ---------------- donor constants, quoted from BOON MOOTS ---------------- */
      // R0 = 4.4 and the shrink ray runs Rtarget = max(RMIN 2.5, R * 0.93) once per wave.
      // The cartridge picks a rung of that ladder per difficulty — a smaller moon is a
      // shorter fuse: the same spawn angle is fewer world units of walking.
      const R = D === 0 ? 3.81 : D === 1 ? 3.29 : 2.85;   // 4.4*0.93^2 / ^4 / ^6
      const PLAYER_R = 0.36, BALL_R = 0.27;
      const KILL_SPEED = 2.2;                       // above this the ball flattens; below, it bumps
      const KICK_RANGE = PLAYER_R + BALL_R + 0.6;   // 1.23 — the boot's reach
      const BALL_STAND = 1.3;                       // donor reset: along(player.pos, heading, 1.3)
      const CHARGE_T = 0.55;                        // donor: charge = min(1, charge + dt/0.55)
      const FULL = 0.98;                            // donor: ball.charged = charge >= 0.98
      // donor CT table — every creature used here keeps its own r / hp / speed / colour
      const CT = {
        goblin:  { r: 0.34, hp: 1, speed: 1.35, score: 100, color: '#65f067' },
        gremlin: { r: 0.27, hp: 1, speed: 2.2,  score: 150, color: '#b9ff6a' },
        raccoon: { r: 0.34, hp: 1, speed: 1.7,  score: 200, color: '#a7a3b8' },
        frog:    { r: 0.26, hp: 99, speed: 0,   score: -250, color: '#3ef0c8' },
      };
      // donor :root — void / ink / pink / cyan / yellow / chalk
      const VOID = '#0b0712', INK = '#1f1538', PINK = '#ff3d9a', CYAN = '#45e6ff',
        YELLOW = '#ffd23f', CHALK = '#cfc4e3';
      const INSULTS = ['TRAGGOT', 'SPIGGOT', 'POPINJAY', 'NINNYHAMMER', 'MILKSOP'];
      const CLEAR_SUBS = ['the moon remains round', 'no fence was encountered',
        'the ball did most of the work', 'still round. checked.', 'nobody narrated this'];
      const DISP = '900 ', DISPF = 'px "Arial Black","Segoe UI Black",sans-serif';
      const MONO = 'px "Consolas","Courier New",monospace';

      /* ---- the one microgame retune: the power ramp is the donor's BOON/MOOTS meter ----
         Donor doKick: pw = 6.5 + 17.5 * charge — a floor of 6.5 already flattens anything,
         because the donor teaches its gate over ten waves and we have eight beats. The
         cartridge keeps the donor's ceiling EXACTLY (6.5 + 17.5 = 24.0 at full charge) and
         hinges the ramp on the donor's own two-bar meter: BOON fills 0->.5, MOOTS fills
         .5->1. The BOON half is a nudge that tops out at 2.0 — under KILL_SPEED 2.2, so it
         visibly bumps. Everything lethal lives in the MOOTS half. */
      const kickPower = (c) => c < 0.5 ? 4.0 * c : 2.0 + 44.0 * (c - 0.5);

      /* ---------------- vectors (donor V) ---------------- */
      const V = {
        add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
        sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
        scale: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
        dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
        cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
        len: (a) => Math.hypot(a[0], a[1], a[2]),
        norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]); return l < 1e-9 ? [0, 0, 0] : [a[0] / l, a[1] / l, a[2] / l]; },
        tangent: (v, n) => { const d = V.dot(v, n); return [v[0] - n[0] * d, v[1] - n[1] * d, v[2] - n[2] * d]; },
        // parallel transport of a tangent vector from unit p to unit q along the great circle
        transport: (u, p, q) => {
          const c = V.dot(p, q); if (c < -0.999) return u;
          const k = V.dot(u, q) / (1 + c);
          return [u[0] - k * (p[0] + q[0]), u[1] - k * (p[1] + q[1]), u[2] - k * (p[2] + q[2])];
        },
        angle: (a, b) => Math.acos(clamp(V.dot(a, b), -1, 1)),
      };
      const rndUnit = () => { const z = env.rng() * 2 - 1, a = env.rng() * TAU, r = Math.sqrt(1 - z * z);
        return [r * Math.cos(a), r * Math.sin(a), z]; };

      /* ---------------- camera: you stand on the pole, we look straight down ----------------
         The donor's camera chases a walking player; this Moots is planted, so cam is the
         identity basis for the whole round and the moon plate can be pre-rendered once. */
      const cam = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
      const CX = W / 2, CY = H * 0.43;               // donor CY = H/2; lifted so the whole
      const RPX = Math.min(W * 0.47, H * 0.36);      // disc (183.3px here) clears the thumb
      const polar = (th, b) => [Math.sin(th) * Math.cos(b), Math.sin(th) * Math.sin(b), Math.cos(th)];
      const proj = (q) => ({ x: CX + V.dot(q, cam.x) * RPX, y: CY - V.dot(q, cam.y) * RPX, d: V.dot(q, cam.z) });
      const px = (r) => r / R * RPX;
      const screenAngle = (h) => Math.atan2(-V.dot(h, cam.y), V.dot(h, cam.x));
      // screen bearing of any point — correct even for points behind the horizon, because
      // an orthographic projection only loses the radius, never the compass direction
      const bearingOf = (q) => Math.atan2(V.dot(q, cam.y), V.dot(q, cam.x));

      /* ---------------- sphere helpers (donor) ---------------- */
      function dirTo(a, b) { const t = V.tangent(V.sub(b, a), a); const l = V.len(t); return l < 1e-6 ? [0, 0, 0] : V.scale(t, 1 / l); }
      function along(pos, dir, dist) {
        const t = V.norm(V.tangent(dir, pos)); if (V.len(t) < 0.5) return pos;
        const th = dist / R;
        return V.norm(V.add(V.scale(pos, Math.cos(th)), V.scale(t, Math.sin(th))));
      }
      function moveOnSphere(pos, vel, dt) {
        const sp = V.len(vel); if (sp * dt < 1e-9) return [pos, vel];
        const th = sp * dt / R, d = V.scale(vel, 1 / sp), c = Math.cos(th), s = Math.sin(th);
        const np = V.norm(V.add(V.scale(pos, c), V.scale(d, s)));
        const nd = V.add(V.scale(pos, -s), V.scale(d, c));
        return [np, V.scale(V.tangent(nd, np), sp)];
      }
      function carry(e, np) {   // move an entity and bring its tangent vectors with it
        for (const k of ['vel', 'kb']) if (e[k]) e[k] = V.tangent(V.transport(e[k], e.pos, np), np);
        if (e.face) { const t = V.norm(V.tangent(V.transport(e.face, e.pos, np), np)); if (V.len(t) > 0.5) e.face = t; }
        e.pos = np;
      }
      function nudge(e, dir, dist) { if (!(dist > 0) || !isFinite(dist)) return; carry(e, along(e.pos, dir, dist)); }

      /* ---------------- state ---------------- */
      const player = { pos: [0, 0, 1], heading: [0, 1, 0], lunge: 0, charging: false, charge: 0 };
      const ball = { pos: [0, 0, 1], vel: [0, 0, 0], travel: 0, charged: false, trail: [], spin: 0 };
      let aimA = Math.PI / 2, ballA = Math.PI / 2;   // aim + dribble bearings (screen radians, PI/2 = up)
      let fired = false;                             // false while the boot still owns the ball
      let t = 0, hitstop = 0, shake = 0, flash = 0, flashCol = '255,255,255', glitch = 0;
      let combo = 0, comboTimer = 0, kills = 0, bumpCd = 0, everFired = false, lethalEver = false;
      let decided = null, announced = 'pending', announceT = 0, why = 'timeout';
      const parts = [], texts = [], corpses = [], banners = [];

      /* ---------------- the wave: a queue walking at you down one bearing ----------------
         The donor spawns a whole ring; eight beats only has room for one lane. Front of the
         queue sits on the lane bearing, the rest alternate out from it, so aiming at the
         nearest one also aims at the crowd. */
      const LANE = Math.PI / 2 + (env.rng() - 0.5) * (D === 0 ? 1.2 : D === 1 ? 3.0 : 4.4);
      // diff 0 is a single-file queue — one line, one kick. Higher difficulties fan it out
      // until the far end of the crowd sits outside the ball's c.r + BALL_R = 0.61 corridor.
      const SPREAD = D === 0 ? 0 : D === 1 ? 0.10 : 0.17;
      const ARRIVE = D === 0 ? 2.75 : D === 1 ? 2.5 : 2.3;   // seconds until the front one is on you
      const ROSTER = D === 0 ? ['goblin', 'goblin', 'goblin']
        : D === 1 ? ['goblin', 'goblin', 'raccoon', 'goblin']
          : ['goblin', 'gremlin', 'goblin', 'raccoon', 'gremlin'];
      const TOTAL = ROSTER.length;
      const OFF = [0, -1, 1, -2, 2];

      function makeCreature(type, arriveT, bearing, fixedTh) {
        const c = CT[type];
        const speed = c.speed * (0.88 + env.rng() * 0.24);      // donor makeCreature jitter
        // spawn far enough out that it lands on you at arriveT — the slot clock made spatial
        const th = fixedTh != null ? fixedTh : Math.min(2.2, (arriveT * speed + c.r + PLAYER_R) / R);
        const pos = polar(th, bearing);
        return { type, pos, vel: [0, 0, 0], kb: [0, 0, 0], face: dirTo(pos, player.pos),
          r: c.r, hp: c.hp, speed, color: c.color, t: env.rng() * 10,
          spawnT: 0, iframes: 0, dying: false, hop: 0.5 + env.rng() * 0.6, hopAnim: 0 };
      }
      // 0.5 s of stagger = ~0.68 world units apart, which is exactly two goblins' separation
      // radius, so the queue holds its shape instead of shoving itself sideways
      let creatures = ROSTER.map((ty, i) =>
        makeCreature(ty, ARRIVE + i * 0.5 + env.rng() * 0.12, LANE + OFF[i] * SPREAD + (env.rng() - 0.5) * SPREAD * 0.4));
      // the frog was investigated and cleared: mostly legitimate usage. Parked off the lane,
      // never counts toward the clear (donor: some(c => c.type !== 'frog')), and reflects
      // the ball at 0.6x if you hit him — which is how you lose your only shot.
      if (D >= 1) creatures.push(makeCreature('frog', 0, LANE + (env.rng() < 0.5 ? -1 : 1) * (1.15 + env.rng() * 0.45), 0.85));
      ball.pos = polar(BALL_STAND / R, ballA);

      /* ---------------- sfx (donor AU.sfx recipes on the shell's two primitives;
         the donor's lowpass on tones has no shell equivalent, so band-limited noise
         carries the body instead) ---------------- */
      const sKick = (ch) => {
        env.audio.tone({ f: 170, f2: 60, type: 'triangle', dur: 0.12, vol: 0.25 });
        env.audio.noise({ dur: 0.06, vol: 0.13, hp: 800, lp: 1800 });
        if (ch > 0.95) {   // donor: the fully charged boot gets a second, bigger thump
          env.audio.tone({ f: 70, f2: 38, type: 'sine', dur: 0.3, vol: 0.3 });
          env.audio.noise({ dur: 0.18, vol: 0.15, hp: 260, lp: 900 });
        }
      };
      const sYeet = (n) => { const m = 1 + Math.min(10, n) * 0.07;   // donor pitches the yeet by combo
        env.audio.tone({ f: 420 * m, f2: 1500 * m, type: 'square', dur: 0.16, vol: 0.11 });
        env.audio.noise({ dur: 0.12, vol: 0.10, hp: 2000, lp: 6000 }); };
      const sLunge = () => env.audio.noise({ dur: 0.12, vol: 0.11, hp: 1100, lp: 2600 });
      const sFull = () => { env.audio.tone({ f: 1500, type: 'sine', dur: 0.06, vol: 0.10 });
        env.audio.tone({ f: 2000, type: 'sine', dur: 0.08, vol: 0.10, t: 0.06 }); };
      const sBump = () => { env.audio.tone({ f: 120, f2: 80, type: 'sine', dur: 0.1, vol: 0.09 });
        env.audio.noise({ dur: 0.05, vol: 0.06, hp: 180, lp: 700 }); };
      const sClear = () => { [523, 659, 784, 1046].forEach((f, i) =>   // donor 'clear' + an octave
        env.audio.tone({ f, type: 'square', dur: 0.24, vol: 0.11, t: i * 0.05 }));
        env.audio.tone({ f: 131, type: 'sawtooth', dur: 0.5, vol: 0.12 });
        env.audio.noise({ dur: 0.1, vol: 0.12, hp: 2000 }); };
      const sHurt = () => { env.audio.tone({ f: 140, f2: 70, type: 'sawtooth', dur: 0.28, vol: 0.2 });
        env.audio.noise({ dur: 0.2, vol: 0.15, hp: 140, lp: 700 }); };
      const sDie = () => { env.audio.tone({ f: 300, f2: 40, type: 'sawtooth', dur: 1.0, vol: 0.22 });
        env.audio.noise({ dur: 0.6, vol: 0.16, hp: 180, lp: 900 }); };
      const sFrog = () => { env.audio.tone({ f: 260, f2: 180, type: 'sawtooth', dur: 0.18, vol: 0.13 });
        env.audio.tone({ f: 440, f2: 110, type: 'square', dur: 0.5, vol: 0.08, t: 0.2 }); };

      /* ---------------- fx ---------------- */
      function burst(x, y, color, n, speed) {
        for (let i = 0; i < n && parts.length < 110; i++) {
          const a = env.rng() * TAU, s = (speed || 260) * (0.35 + env.rng());
          parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.35 + env.rng() * 0.35, color, r: 2 + env.rng() * 3 });
        }
      }
      function floatText(x, y, text, color, size, life, display) {
        if (texts.length > 8) texts.shift();
        texts.push({ x, y, text, color: color || '#fff', size: size || 15, t: 0, life: life || 1.1, display: !!display });
      }
      function banner(big, small) { banners.push({ big, small, t: 0, life: 1.9 }); if (banners.length > 1) banners.shift(); }
      function advanceFx(dt) {   // donor advanceFx — fx run on raw dt, they never freeze
        shake *= Math.exp(-9 * dt); flash = Math.max(0, flash - dt * 2.2);
        glitch = Math.max(0, glitch - dt * 1.5); comboTimer -= dt; bumpCd -= dt;
        for (const arr of [texts, banners, corpses, parts])
          for (let i = arr.length - 1; i >= 0; i--) { const o = arr[i]; o.t += dt; if (o.t >= o.life) arr.splice(i, 1); }
        for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-3 * dt); p.vy *= Math.exp(-3 * dt); }
        for (const c of corpses) { c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vr * dt; }
      }

      /* ---------------- the kick (donor doKick, verbatim except the power ramp) --------- */
      function doKick(charge) {
        everFired = true;
        const d = V.angle(player.pos, ball.pos) * R;
        // the donor's own range gate: the boot's reach grows with the wind-up, and the ball
        // parks at 1.3 while KICK_RANGE is 1.23 — so anything under charge 0.234 WHIFFS.
        if (d >= KICK_RANGE + charge * 0.3) {
          player.lunge = 0.13; sLunge();
          const p = proj(player.pos);
          burst(p.x, p.y, PINK, 5, 120); floatText(p.x, p.y - 34, 'whiffed.', CHALK, 13, 0.9, false);
          shake = Math.max(shake, 2.5);

        // away from yourself — the donor never lets you kick a ball back through your shins

        kdir = V.norm(V.tangent(V.transport(kdir, player.pos, ball.pos), ball.pos));

          if (c.dying || c.type === 'frog') continue;
          const dist = V.angle(ball.pos, c.pos) * R; if (dist > 5) continue;

        ball.vel = V.add(V.scale(ball.vel, 0.15), V.scale(kdir, pw));
        ball.travel = 0; ball.charged = charge >= FULL; fired = true;
        if (pw > KILL_SPEED) lethalEver = true;
        const p = proj(ball.pos);
        burst(p.x, p.y, charge >= FULL ? '#ffffff' : YELLOW, charge >= FULL ? 22 : 8, 200 + 300 * charge);
        shake = Math.max(shake, 3 + 8 * charge); hitstop = charge >= FULL ? 0.05 : 0.02;
        if (charge >= FULL) { flash = 0.25; flashCol = '255,61,154'; banner('BOON MOOTS', 'I seent it'); }
        sKick(charge);
      }

      /* ---------------- kills / verdicts ---------------- */
      function killCreature(c, sdir) {
        c.dying = true; kills++; combo++; comboTimer = 2;
        const p = proj(c.pos);
        const pts = CT[c.type].score * combo;
        floatText(p.x, p.y - 22, '+' + pts + (combo > 1 ? '  x' + combo : ''), YELLOW, 15 + Math.min(12, combo * 2), 1.1, false);
        hitstop = Math.min(0.11, 0.05 + combo * 0.01);          // donor: combo buys hitstop
        shake = Math.max(shake, Math.min(14, 5 + combo * 1.5));
        sYeet(combo);
        if (ball.charged) { ball.charged = false; floatText(p.x, p.y - 42, 'CHARGED', CYAN, 13, 1.2, false); }
        const sd = sdir || [0, -1];
        corpses.push({ x: p.x, y: p.y, vx: sd[0] * 520 + (env.rng() - 0.5) * 120, vy: sd[1] * 520 + (env.rng() - 0.5) * 120,
          rot: 0, vr: (env.rng() - 0.5) * 20, t: 0, life: 0.55, color: c.color, r: px(c.r) });
        burst(p.x, p.y, c.color, 14, 260);
      }
      function win() {
        decided = 'won'; announceT = 0.26; why = 'clear';
        hitstop = 0.09; shake = Math.max(shake, 13); flash = 0.6; flashCol = '255,255,255'; glitch = 0.5;
        const p = proj(player.pos);
        burst(p.x, p.y, '#ffffff', 24, 340); burst(p.x, p.y, CYAN, 16, 240);
        banner('CLEARED', CLEAR_SUBS[(env.rng() * CLEAR_SUBS.length) | 0]);

      }
      function lose(cause, c) {
        decided = 'lost'; announceT = 0.3; why = cause;
        hitstop = 0.12; shake = 18; flash = 0.7; flashCol = '255,61,154'; glitch = 0.6;
        const p = proj(player.pos);
        floatText(p.x, p.y - px(PLAYER_R) - 16, INSULTS[(env.rng() * INSULTS.length) | 0], '#fff', 24, 1.3, true);
        burst(p.x, p.y, PINK, 30, 340); burst(p.x, p.y, '#ffffff', 14, 220);
        corpses.push({ x: p.x, y: p.y, vx: (env.rng() - 0.5) * 300, vy: -520, rot: 0, vr: 12, t: 0, life: 1.1, color: PINK, r: px(PLAYER_R) });
        if (c) { const q = dirTo(c.pos, player.pos); c.kb = V.scale(q, -3.5); }

      }

      /* ---------------- simulation ---------------- */
      function updateAim(inp, dt) {
        if (inp.down) {   // aim is the compass bearing from Moots to your thumb
          const dx = inp.x - CX, dy = CY - inp.y;
          if (Math.hypot(dx, dy) > 22) aimA = Math.atan2(dy, dx);   // dead zone keeps the last aim
