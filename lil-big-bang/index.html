<script>
'use strict';
/* ============================================================================
   LIL BIG BANG — a qualiacology microgame reel
   One file. No assets. Every sound is math.
   Shell laws: fixed-timestep accumulator (shell owns the clock), one
   AudioContext, no iframes, cartridges keep their own worlds.
   ========================================================================== */
const VERSION = '0.3.0';
const SAVE_KEY = 'lbb_save_v1';

const CFG = {
  W: 390, H: 844,
  BPM0: 100, BPM_MAX: 146, BPM_STEP: 8,
  WINS_PER_SPEEDUP: 4,
  BOSS_EVERY: 12,
  LIVES: 4,
  STEP: 1 / 60, MAX_STEPS: 4,
};

/* ----------------------------- tiny utilities ---------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t) * (1 - t);
const easeIn = t => t * t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const backOut = t => { const c = 1.70158 + 1; return 1 + c * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };
const TAU = Math.PI * 2;
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const FONT = {
  heavy: (px) => `900 ${px}px "Arial Black","Segoe UI Black","Arial",sans-serif`,
  bold:  (px) => `700 ${px}px "Segoe UI",system-ui,"Arial",sans-serif`,
  mono:  (px) => `700 ${px}px "Consolas","Courier New",monospace`,
  serif: (px) => `600 ${px}px Georgia,"Times New Roman",serif`,
  serifIt: (px) => `italic 600 ${px}px Georgia,"Times New Roman",serif`,
};
const INK = '#fff3d6';
const SHELL = { void:'#14081f', void2:'#1d0d2e', cream:'#fff3d6', pink:'#ff71ce', gold:'#ffd166', cyan:'#7ae7ff', plum:'#9a8fb8' };

/* --------------------------------- save ---------------------------------- */
const Save = (() => {
  let d = { best: 0, bestStreak: 0, plays: 0, calib: 0, sound: 1, curriculum: 0 };
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = Object.assign(d, JSON.parse(raw)); } catch (e) {}
  const flush = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) {} };
  return { d, flush };
})();

/* --------------------------------- audio ---------------------------------
   One AudioContext for the whole shell, created on first tap.
   Engine topology (from HEART OF THE PARTY): master gain -> compressor -> dest,
   separate music/sfx buses, shared noise buffer, 16th-note lookahead scheduler.
--------------------------------------------------------------------------- */
const Audio2 = (() => {
  let ctx = null, master, comp, musicBus, sfxBus, noiseBuf;
  let bpm = CFG.BPM0;
  let nextStepTime = 0, stepIdx = 0, barIdx = 0, running = false;
  let hatMuteUntilBar = -1;
  let layers = 1;                 // instrument layers (grow every 4 wins)
  let schedTimer = 0;
  const listeners = [];           // {step, time} events for the shell
  let silentEl = null;

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = Save.d.sound ? 1 : 0;
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 24; comp.ratio.value = 6;
    master.connect(comp); comp.connect(ctx.destination);
    musicBus = ctx.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1, ctx.sampleRate);
    const ch = noiseBuf.getChannelData(0);
    for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    // iOS silent-switch route: a silent looping media element keeps the
    // playback session alive so WebAudio is audible with the mute switch on.
    try {
      silentEl = document.createElement('audio');
      silentEl.setAttribute('x-webkit-airplay', 'deny');
      silentEl.loop = true; silentEl.volume = 0.01;
      silentEl.src = 'data:audio/mpeg;base64,//uQZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA';
      silentEl.play().catch(() => {});
    } catch (e) {}
    nextStepTime = ctx.currentTime + 0.06;
    stepIdx = 0; barIdx = 0; running = true;
    schedTimer = setInterval(schedule, 25);
    document.addEventListener('visibilitychange', () => {
      if (!ctx) return;
      if (document.visibilityState === 'visible' && ctx.state !== 'running') ctx.resume().catch(() => {});
    });
  }
  const stepLen = () => 15 / bpm;          // 16th note
  const beatLen = () => 60 / bpm;
  function schedule() {
    if (!running || !ctx) return;
    if (ctx.state !== 'running') return;
    while (nextStepTime < ctx.currentTime + 0.12) {
      playStep(stepIdx, nextStepTime);
      for (const fn of listeners) fn(stepIdx, nextStepTime, barIdx);
      stepIdx++;
      if (stepIdx % 16 === 0) barIdx++;
      nextStepTime += stepLen();
    }
  }
  /* instruments (HEART OF THE PARTY recipes) */
  function kick(t, v = 1) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(40, t + 0.12);
    g.gain.setValueAtTime(0.9 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.25);
  }
  function hat(t, v = 1) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.22 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    s.connect(f); f.connect(g); g.connect(musicBus); s.start(t); s.stop(t + 0.06);
  }
  function snare(t, v = 1) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f1 = ctx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 1900;
    const f2 = ctx.createBiquadFilter(); f2.type = 'bandpass'; f2.frequency.value = 2100;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.5 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
    s.connect(f1); f1.connect(f2); f2.connect(g); g.connect(musicBus); s.start(t); s.stop(t + 0.12);
  }
  function bass(t, semis, v = 1) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
    o.type = 'sawtooth'; o.frequency.value = 55 * Math.pow(2, semis / 12);
    g.gain.setValueAtTime(0.34 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
    o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + 0.26);
  }
  function lead(t, semis, v = 1, dur = 0.12) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 2600;
    o.type = 'square'; o.frequency.value = 220 * Math.pow(2, semis / 12);
    g.gain.setValueAtTime(0.13 * v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.02);
  }
  function pad(t, semis, v = 1, dur = 0.5) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 220 * Math.pow(2, semis / 12);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.06 * v, t + dur * .4);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(musicBus); o.start(t); o.stop(t + dur + 0.02);
  }
  /* moon-music bed — the motif slot is pluggable (OPEN: Alex may write it).
     Default motif: a small rising figure in A minor pentatonic. */
  const MOTIF = [0, 3, 5, 7, 10, 7, 5, 3];
  const BASSLINE = [0, 0, -2, -2, 3, 3, -4, -2];
  function playStep(s, t) {
    const q = s % 16;
    if (q % 4 === 0) kick(t);
    if (q % 2 === 0 && barIdx > hatMuteUntilBar) hat(t, q % 4 === 2 ? 1 : 0.6);
    if ((q === 4 || q === 12) && layers >= 2) snare(t, 0.8);
    if (q % 2 === 0) bass(t, BASSLINE[(barIdx * 2 + (q >> 3)) % BASSLINE.length], layers >= 1 ? 0.8 : 0.5);
    if (layers >= 3 && q % 4 === 2) lead(t, MOTIF[(barIdx * 4 + (q >> 2)) % MOTIF.length], 0.5, 0.1);
    if (layers >= 4 && q === 0) pad(t, MOTIF[barIdx % MOTIF.length] + 12, 1, beatLen() * 2);
  }
  /* ------- SFX helpers (cartridges get these; never their own context) ----
     `t` is a RELATIVE DELAY in seconds, not an absolute AudioContext time. It read as
     absolute for a while, which meant a cartridge writing `t: i * 0.04` for an arpeggio
     was naming a moment already in the past — so every staggered figure across twelve
     cartridges collapsed into one simultaneous chord. Relative is what every author
     assumed, and it is the only thing a cartridge can express: they cannot see the clock. */
  function tone(o) {
    if (!ctx) return;
    const t = ctx.currentTime + (o.t || 0);
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(o.f || 440, t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t + (o.dur || 0.1));
    const v = o.vol != null ? o.vol : 0.25;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.001, t + (o.dur || 0.1));
    osc.connect(g); g.connect(sfxBus); osc.start(t); osc.stop(t + (o.dur || 0.1) + 0.03);
  }
  function noise(o) {
    if (!ctx) return;
    const t = ctx.currentTime + (o.t || 0);          // relative delay, as in tone()
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    let node = s;
    if (o.hp) { const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp; node.connect(f); node = f; }
    if (o.lp) { const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; node.connect(f); node = f; }
    const g = ctx.createGain();
    const v = o.vol != null ? o.vol : 0.3;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + (o.dur || 0.15));
    node.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + (o.dur || 0.15) + 0.02);
  }
  /* family motifs — the ear learns the verb (3-channel control language) */
  function announce(family) {
    if (!ctx) return;
    const t = 0;   // t is now a relative delay
    if (family === 'tap') tone({ t, f: 1200, type: 'square', dur: 0.05, vol: 0.3 });
    else if (family === 'hold') tone({ t, f: 160, f2: 420, type: 'sawtooth', dur: 0.38, vol: 0.16 });
    else if (family === 'release') { tone({ t, f: 180, f2: 420, type: 'sawtooth', dur: 0.3, vol: 0.15 }); tone({ t: t + 0.3, f: 500, f2: 1000, type: 'sine', dur: 0.08, vol: 0.3 }); }
    else if (family === 'drag') tone({ t, f: 330, f2: 495, type: 'sine', dur: 0.3, vol: 0.25 });
    else if (family === 'inhibit') { duckMusic(0.55); tone({ t, f: 55, type: 'sine', dur: 0.18, vol: 0.5 }); }
    else if (family === 'mash') { for (let i = 0; i < 4; i++) noise({ t: t + i * 0.05, dur: 0.04, hp: 2000, vol: 0.18 }); }
  }
  function duckMusic(sec) {
    if (!ctx) return;
    /* AudioParam scheduling is absolute even though cartridge SFX delays are relative. */
    const t = ctx.currentTime;
    musicBus.gain.cancelScheduledValues(t);
    musicBus.gain.setValueAtTime(0.12, t);
    musicBus.gain.linearRampToValueAtTime(0.5, t + sec);
  }
  function winSting(streak) {
    if (!ctx) return;
    const t = 0;   // t is now a relative delay
    const deg = [0, 2, 4, 5, 7, 9, 11, 12];
    const s = deg[clamp(streak, 0, 7)];
    tone({ t, f: 440 * Math.pow(2, s / 12), type: 'square', dur: 0.1, vol: 0.22 });
    tone({ t: t + 0.07, f: 554 * Math.pow(2, s / 12), type: 'square', dur: 0.12, vol: 0.2 });
  }
  function loseSting() {
    if (!ctx) return;
    const t = 0;   // t is now a relative delay
    tone({ t, f: 220, f2: 185, type: 'square', dur: 0.28, vol: 0.16 });
    tone({ t, f: 110, type: 'sine', dur: 0.3, vol: 0.3 });
    hatMuteUntilBar = barIdx + 1;                 // the drums feel the miss
  }
  function airhorn() { // mascot ad-lib: portamento square
    if (!ctx) return; const t = 0;
    tone({ t, f: 392, f2: 587, type: 'square', dur: 0.30, vol: 0.2 });
    tone({ t: t + 0.02, f: 392, f2: 587, type: 'square', dur: 0.30, vol: 0.12 });
  }
  /* THE SPEED-UP HOOK — a whole phrase that MEANS faster, not a beep:
     a noise riser sweeping up under an accelerating arpeggio, then a fat stab
     on the downbeat with the airhorn on top. Timed to land inside 3 beats. */
  function speedHook(secPerBeat) {
    if (!ctx) return;
    const t = 0, bar = secPerBeat * 3;
    /* riser: filtered noise climbing, in slices so the filter can sweep */
    for (let i = 0; i < 14; i++) {
      const u = i / 14;
      noise({ t: t + u * bar * 0.72, dur: bar * 0.09, vol: 0.05 + u * 0.16,
              hp: 300 + u * 4200, lp: 1200 + u * 7000 });
    }
    /* an arpeggio that speeds up as it climbs — the acceleration IS the message */
    const scale = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24];
    let at = 0;
    for (let i = 0; i < scale.length; i++) {
      const gap = (bar * 0.085) * (1 - i / (scale.length * 1.5));   // notes crowd together
      tone({ t: t + at, f: 220 * Math.pow(2, scale[i] / 12), type: 'square',
             dur: 0.09, vol: 0.10 + i * 0.006 });
      at += gap;
    }
    /* the landing: sub thump + major stab + airhorn */
    const land = t + bar * 0.74;
    tone({ t: land, f: 150, f2: 44, type: 'sine', dur: 0.34, vol: 0.5 });
    noise({ t: land, dur: 0.16, hp: 1800, vol: 0.26 });
    [0, 4, 7, 12].forEach((s, i) =>
      tone({ t: land + i * 0.012, f: 262 * Math.pow(2, s / 12), type: 'sawtooth', dur: 0.42, vol: 0.11 }));
    tone({ t: land + 0.04, f: 466, f2: 699, type: 'square', dur: 0.34, vol: 0.16 });
    tone({ t: land + 0.06, f: 466, f2: 699, type: 'square', dur: 0.34, vol: 0.10 });
  }
  return {
    speedHook,
    init, tone, noise, announce, winSting, loseSting, airhorn, duckMusic,
    get ctx() { return ctx; },
    now: () => ctx ? ctx.currentTime : performance.now() / 1000,
    outputLatency: () => (ctx && (ctx.outputLatency || ctx.baseLatency)) || 0,
    beatLen, stepLen,
    get bpm() { return bpm; }, set bpm(v) { bpm = clamp(v, 60, 200); },
    get barIdx() { return barIdx; }, get stepIdx() { return stepIdx; },
    set layers(v) { layers = v; }, get layers() { return layers; },
    onStep: (fn) => listeners.push(fn),
    setSound(on) { Save.d.sound = on ? 1 : 0; Save.flush(); if (master) master.gain.value = on ? 1 : 0; },
    /* next beat boundary (audio time) at least `lead` seconds ahead */
    nextBeat(lead = 0.05) {
      if (!ctx) return 0;
      const bl = beatLen();
      const beatsDone = Math.floor(stepIdx / 4);
      let t = nextStepTime - stepLen() * (stepIdx % 4);   // time of current beat start-ish
      while (t < ctx.currentTime + lead) t += bl;
      return t;
    },
  };
})();

/* --------------------------------- input --------------------------------- */
const Input = (() => {
  const s = { down: false, x: 195, y: 500, justDown: false, justUp: false, downX: 0, downY: 0, downAt: 0, upAt: 0 };
  let toLogical = (x, y) => [x, y];
  let lastTouchAt = -1000;
  function bind(el, map) {
    toLogical = map;
    const dn = (e) => {
      const isTouch = !!e.changedTouches;
      if (isTouch) {
        lastTouchAt = performance.now();
        /* A second finger belongs to browser zoom, not the cartridge. Do not cancel it. */
        if (e.touches && e.touches.length > 1) { s.down = false; return; }
      } else if (performance.now() - lastTouchAt < 800) return; // synthetic mouse after touch
      const p = e.changedTouches ? e.changedTouches[0] : e;
      const [x, y] = toLogical(p.clientX, p.clientY);
      s.down = true; s.justDown = true; s.x = x; s.y = y; s.downX = x; s.downY = y; s.downAt = performance.now() / 1000;
      if (!isTouch) e.preventDefault();
    };
    const mv = (e) => {
      const isTouch = !!e.changedTouches;
      if (isTouch) {
        lastTouchAt = performance.now();
        if (e.touches && e.touches.length > 1) { s.down = false; return; }
      } else if (performance.now() - lastTouchAt < 800) return;
      const p = e.changedTouches ? e.changedTouches[0] : e;
      const [x, y] = toLogical(p.clientX, p.clientY);
      s.x = x; s.y = y;
      if (!isTouch) e.preventDefault();
    };
    const up = (e) => {
      const isTouch = !!e.changedTouches;
      if (isTouch) lastTouchAt = performance.now();
      else if (performance.now() - lastTouchAt < 800) return;
      if (e.changedTouches) { const p = e.changedTouches[0]; const [x, y] = toLogical(p.clientX, p.clientY); s.x = x; s.y = y; }
      s.down = false; s.justUp = true; s.upAt = performance.now() / 1000;
      if (!isTouch) e.preventDefault();
    };
    el.addEventListener('touchstart', dn, { passive: false });
    el.addEventListener('touchmove', mv, { passive: false });
    el.addEventListener('touchend', up, { passive: false });

  /* SPEED UP — three beats, and every one of them is doing something. The hook rises,
     the sky goes to warp, he pulls up hyped, and the word SLAMS on the landing. */
  function drawSpeedup() {
    const dur = Audio2.beatLen() * 3;
    const t = clamp(stateT / dur, 0, 1);
    const land = 0.74;                                   // where the hook's stab lands
    const rise = clamp(t / land, 0, 1);
    const post = clamp((t - land) / (1 - land), 0, 1);
    const CX = CFG.W / 2, CY = CFG.H / 2;

    heat.addColorStop(0, `rgba(122,231,255,${0.05 + rise * 0.30})`);
    heat.addColorStop(0.5, `rgba(255,113,206,${0.03 + rise * 0.16})`);
    heat.addColorStop(1, 'rgba(20,8,31,0)');
    g.fillStyle = heat; g.fillRect(0, 0, CFG.W, CFG.H);

    /* A tunnel made from the old tempo: each ring is a beat being overtaken. */
    g.save(); g.translate(CX, CY + 28); g.rotate(stateT * .35);
    for (let i = 0; i < 8; i++) {
      const u = (i / 8 + rise * .48) % 1;
      const rr = 24 + easeIn(u) * 330;
      g.globalAlpha = (1 - u) * .42 + .05;
      g.strokeStyle = i % 2 ? SHELL.pink : SHELL.cyan;
      g.lineWidth = 1 + (1 - u) * 5;
      g.beginPath(); g.arc(0, 0, rr, 0, TAU); g.stroke();
    }
    g.restore(); g.globalAlpha = 1;

    /* WARP: stars stretch from points into long streaks racing outward from centre */
    const warp = easeIn(rise) * 1 + post * 0.35;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const dx = s.x - CX, dy = s.y - CY;
      const d = Math.hypot(dx, dy) || 1;
      const nx = dx / d, ny = dy / d;
      const push = warp * (60 + (d / 420) * 260);
      const len = 4 + warp * (26 + (d / 420) * 150);

      { scale: 1.35 + post * 0.25, pose: 'hype', grill: 0.4 + post * 0.35 });

    /* the word: charges small and tight, then SLAMS wide on the stab */
    g.textAlign = 'center';
    const scaleX = post > 0 ? 1 + backOut(post) * 0.55 : 0.5 + rise * 0.42;
    const scaleY = post > 0 ? 1 + backOut(post) * 0.12 : 0.72 + rise * 0.3;

    g.scale(scaleX, scaleY);

    g.fillStyle = SHELL.cyan; g.fillText('SPEED UP', 7, -4);

    g.fillStyle = SHELL.pink; g.fillText('BOSS', -5, 4);

    for (let i = 0; i < 4; i++) {

  /* LIL BIG BANG himself. The brief: cute proportions with one wrong detail, swagger over
     adorable — never a Nintendo toddler. Snapback cocked and GLUED to the squash, crescent-
     moon grill (it waxes full at BIG BANG ACHIEVED), rings on the one oversized mitten, a
     chain for the drip. He roasts gravity, never the player.
     `scale` sizes him; `grill` 0..1 waxes the moon in his teeth; `pose` picks the attitude. */
  function drawMascot(x, y, a, t, opts) {
    const o = opts || {};
    const S = o.scale || 1, grill = o.grill == null ? 0.35 : o.grill, pose = o.pose || 'idle';
    const beat = Math.sin(t * 4.4);
    const bob = beat * 4 * S;
    const sq = 1 + beat * 0.05;
    const lean = pose === 'hype' ? Math.sin(t * 8) * 0.09 : beat * 0.03;
    g.save();

    g.translate(x, y + bob); g.scale(S, S); g.rotate(lean);
    g.scale(2 - sq, sq);

    const R = 48, rIn = 23;

    halo.addColorStop(0, 'rgba(255,209,102,0.30)');

    /* body: a four-point burst with deeply concave waists — a star with attitude */
    const burst = (rad, waist) => {
      g.beginPath();
      for (let p = 0; p < 4; p++) {
        const a0 = -Math.PI / 2 + p * Math.PI / 2, a1 = a0 + Math.PI / 2, am = (a0 + a1) / 2;
        if (p === 0) g.moveTo(Math.cos(a0) * rad, Math.sin(a0) * rad);
        g.quadraticCurveTo(Math.cos(am) * waist, Math.sin(am) * waist, Math.cos(a1) * rad, Math.sin(a1) * rad);
      }
      g.closePath();
    };
    g.fillStyle = SHELL.pink; burst(R + 3, rIn + 2); g.fill();          // pink rim light
    const grad = g.createRadialGradient(-6, -10, 3, 0, 2, R);
    grad.addColorStop(0, '#fffef4'); grad.addColorStop(0.34, '#fff3c9');
    grad.addColorStop(0.68, SHELL.gold); grad.addColorStop(1, '#ff8ad0');
    g.fillStyle = grad; burst(R, rIn); g.fill();
    /* a hot inner core, offset like a real specular */
    const core = g.createRadialGradient(-7, -12, 1, -7, -12, 22);
    core.addColorStop(0, 'rgba(255,255,255,0.95)'); core.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = core; g.beginPath(); g.arc(-7, -12, 22, 0, TAU); g.fill();

    g.strokeStyle = SHELL.gold; g.lineWidth = 2.4; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-23, 22); g.quadraticCurveTo(0, 40, 23, 22); g.stroke();
    g.fillStyle = '#fff0b8';
    for (let i = -2; i <= 2; i++) {
      const u = (i + 2) / 4, cx2 = -23 + 46 * u, cy2 = 22 + Math.sin(u * Math.PI) * 16;
      g.beginPath(); g.arc(cx2, cy2, 2.0, 0, TAU); g.fill();
    }
    g.fillStyle = SHELL.gold;
    g.beginPath(); g.arc(0, 39, 4.2, 0, TAU); g.fill();
    g.fillStyle = '#fff6dd';
    g.beginPath(); g.arc(-1.2, 37.8, 1.5, 0, TAU); g.fill();

    for (const ex of [-15, 14]) {
      const sgn = ex < 0 ? 1 : -1;
      g.save();
      g.translate(ex, -7);
      g.rotate(sgn * 0.13);                                              // inward tilt = smug
      g.fillStyle = '#160a24';
      g.beginPath(); g.ellipse(0, 0, 6.6, 5.6, 0, 0, TAU); g.fill();
      g.fillStyle = '#ffffff';                                           // catchlight, low
      g.beginPath(); g.arc(sgn * -1.6, 1.6, 1.7, 0, TAU); g.fill();
      g.fillStyle = grad;                                                // the lid
      g.beginPath(); g.moveTo(-8, -7); g.lineTo(8, -7); g.lineTo(8, -0.8); g.lineTo(-8, -2.4); g.closePath(); g.fill();
      g.strokeStyle = '#6b3b18'; g.lineWidth = 1.5; g.lineCap = 'round'; // lash line

      g.restore();
    }

    g.save();
    g.translate(0, 13);
    g.fillStyle = '#160a24';
    g.beginPath(); g.moveTo(-14, -3); g.quadraticCurveTo(0, 12, 14, -3); g.quadraticCurveTo(0, 4, -14, -3); g.fill();
    g.save();                                                            // clip to the mouth
    g.beginPath(); g.moveTo(-14, -3); g.quadraticCurveTo(0, 12, 14, -3); g.quadraticCurveTo(0, 4, -14, -3); g.clip();
    g.fillStyle = '#ffd971';
    /* a crescent: full disc minus an offset disc; offset shrinks as grill -> 1 */
    g.beginPath(); g.arc(0, 1.6, 13, 0, TAU); g.fill();
    g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.arc(-8.5 + 8.5 * grill, -2 + 2 * grill, 11.6, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.strokeStyle = 'rgba(22,10,36,0.8)'; g.lineWidth = 1.6;            // tooth lines
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(i * 6, -4); g.lineTo(i * 6, 10); g.stroke(); }
    g.restore();
    g.restore();

    /* SNAPBACK — boxy crown, hard flat brim thrown out to one side. Not a round hat:
       the flat brim is what makes it read as a snapback instead of a bucket. Glued to the
       squash (it never animates independently). */
    g.save();
    g.translate(-2, -R + 9);
    g.rotate(0.1);
    /* the brim first, so the crown sits on top of it */
    g.fillStyle = '#150a22';
    g.beginPath();
    g.moveTo(4, 1); g.quadraticCurveTo(30, -3, 41, 2);
    g.quadraticCurveTo(30, 8, 4, 7); g.closePath(); g.fill();
    /* crown: a squat rounded box, six-panel seam down the middle */
    g.fillStyle = '#2f1750';
    g.beginPath();
    g.moveTo(-21, 3);
    g.quadraticCurveTo(-21, -17, 0, -17);
    g.quadraticCurveTo(21, -17, 21, 3);
    g.closePath(); g.fill();
    g.fillStyle = '#200f38';                                             // shadowed panel
    g.beginPath();
    g.moveTo(4, -16.2); g.quadraticCurveTo(21, -15, 21, 3); g.lineTo(4, 3); g.closePath(); g.fill();
    g.strokeStyle = '#150a22'; g.lineWidth = 1.4;                        // seam
    g.beginPath(); g.moveTo(2, -16.6); g.lineTo(2, 3); g.stroke();
    g.fillStyle = '#150a22';                                             // sweatband edge
    g.fillRect(-21, 1.5, 42, 3.4);
    g.fillStyle = SHELL.cyan;                                            // front panel patch
    g.beginPath(); g.moveTo(-13, 0); g.lineTo(-1, 0); g.lineTo(-2.5, -10); g.lineTo(-11.5, -10); g.closePath(); g.fill();
    g.fillStyle = '#ff71ce';
    g.beginPath(); g.arc(0, -17, 2.4, 0, TAU); g.fill();                 // button
    g.restore();

    /* the one oversized mitten, ringed, throwing a lazy point */
    g.save();
    const swing = pose === 'hype' ? Math.sin(t * 9) * 0.5 : Math.sin(t * 4.4) * 0.17;
    g.translate(R - 6, 6); g.rotate(-0.45 + swing);
    g.strokeStyle = '#ffeec2'; g.lineWidth = 7; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(22, -12); g.stroke();
    g.fillStyle = '#fff6dd';
    g.beginPath(); g.arc(29, -16, 10.5, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(21, -8, 6, 4.6, 0.7, 0, TAU); g.fill();     // thumb
    g.strokeStyle = SHELL.gold; g.lineWidth = 2.6;                       // rings
    g.beginPath(); g.moveTo(22.5, -21.5); g.lineTo(26.5, -24.5); g.stroke();
    g.beginPath(); g.moveTo(28.5, -24); g.lineTo(32.5, -26.5); g.stroke();
    g.fillStyle = '#fff0b8';
    g.beginPath(); g.arc(34.5, -20, 2.1, 0, TAU); g.fill();
    g.restore();

    g.restore();
  }
  function drawFuse() {
    /* slot timer: a fuse burning right-to-left across the top */
    if (state !== 'play') {
      /* count-in: fuse full, pip pulsing */
      g.fillStyle = 'rgba(255,243,214,.25)'; g.fillRect(16, 14, CFG.W - 32, 3);
      return;
    }
    const slot = cartDef.slotBeats * Audio2.beatLen();
    const f = clamp(1 - stateT / slot, 0, 1);
    g.fillStyle = 'rgba(255,243,214,.25)'; g.fillRect(16, 14, CFG.W - 32, 3);
    g.fillStyle = f < 0.25 ? SHELL.pink : SHELL.gold;
    g.fillRect(16, 14, (CFG.W - 32) * f, 3);
    const sx = 16 + (CFG.W - 32) * f;
    g.fillStyle = '#fffbe9';
    g.beginPath(); g.arc(sx, 15.5, 3 + Math.random() * 1.5, 0, TAU); g.fill();
  }
  const CONSTA = ['MAJOR', 'MINOR', 'BOREALIS', 'PRIME', 'EXPRESS', 'ASCENDANT', 'ETERNAL', 'DELUXE'];
  const RANKS = ['MILKSOP', 'NINNYHAMMER', 'SPIGGOT', 'TRAGGOT', 'POPINJAY', 'LOAD-BEARING BEAR', 'I SEENT IT'];
  function runName() {
    const r = mulberry32(run.seed + run.wins);
    const rank = RANKS[clamp((run.wins / 5) | 0, 0, RANKS.length - 1)];
    return 'THE ' + rank + ' ' + CONSTA[(r() * CONSTA.length) | 0];
  }
  function drawGameover() {
    const t = stateT;
    /* supernova in the first 0.5s */
    if (t < 0.5) {
      g.fillStyle = SHELL.void; g.fillRect(0, 0, CFG.W, CFG.H);
      const r = easeOut(t / 0.5) * CFG.H;
      g.strokeStyle = SHELL.pink; g.lineWidth = 20 * (1 - t * 2);
      g.beginPath(); g.arc(CFG.W / 2, CFG.H / 2, r, 0, TAU); g.stroke();
      g.fillStyle = `rgba(255,251,233,${1 - t * 2})`; g.fillRect(0, 0, CFG.W, CFG.H);
      return;
    }
    /* the album cover: everything you won, drawn as one sky */
    const cx = CFG.W / 2;
    const age = t - 0.5;
    drawStars(t * 0.2, 0);
    /* the blast still cooling behind the card */
    const after = g.createRadialGradient(cx, 360, 20, cx, 360, 420);
    const cool = Math.max(0, 1 - age * 0.5);
    after.addColorStop(0, `rgba(255,113,206,${0.16 * cool})`);
    after.addColorStop(1, 'rgba(20,8,31,0)');
    g.fillStyle = after; g.fillRect(0, 0, CFG.W, CFG.H);

    g.textAlign = 'center';
    g.font = FONT.mono(11); g.fillStyle = SHELL.plum;
    g.fillText('B I G   B A N G   A C H I E V E D', cx, 122);
    g.font = FONT.bold(12); g.fillStyle = 'rgba(154,143,184,.75)';
    g.fillText('(results may vary)', cx, 144);

    /* the four moons, all stolen — the run's story in one row */
    const gap = 30;
    for (let i = 0; i < CFG.LIVES; i++) {
      const mx = cx + (i - (CFG.LIVES - 1) / 2) * gap;
      g.setLineDash([2, 3]); g.strokeStyle = 'rgba(154,143,184,.55)'; g.lineWidth = 1.4;
      g.beginPath(); g.arc(mx, 174, 8, 0, TAU); g.stroke(); g.setLineDash([]);
    }

    /* the constellation: one star per win, traced in over ~1.2s with real glow */
    const rng = mulberry32(run.seed);
    const pts = [];
    const N = Math.min(run.wins, 36);
    for (let i = 0; i < N; i++) {
      /* spiral-ish placement so long runs read as a shape, not confetti */
      const a = i * 2.399 + rng() * 0.5, rr = 26 + Math.sqrt(i + 1) * 46;
      pts.push({ x: clamp(cx + Math.cos(a) * rr, 54, CFG.W - 54), y: clamp(352 + Math.sin(a) * rr * 0.78, 224, 486) });
    }
    const drawn = clamp(age * 9, 0, pts.length);
    /* lines trace between the stars as they appear */
    g.lineWidth = 1.2;
    for (let i = 1; i < Math.floor(drawn); i++) {
      const a = pts[i - 1], b = pts[i], s = run.souvenirs[i] || { hue: 42 };
      g.strokeStyle = `hsla(${s.hue},85%,72%,.36)`;
      g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.stroke();
    }
    for (let i = 0; i < Math.floor(drawn); i++) {
      const p = pts[i], pop = clamp((drawn - i) * 3, 0, 1);
      const last = i === pts.length - 1;
      const rad = (last ? 4.4 : i % 4 === 3 ? 3.4 : 2.4) * (0.6 + 0.4 * pop);
      const s = run.souvenirs[i] || { hue: 42, family: 'tap' };
      const gl = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, rad * 5);
      gl.addColorStop(0, `hsla(${s.hue},90%,72%,${last ? .62 : .38})`);
      gl.addColorStop(1, 'rgba(255,243,214,0)');
      g.fillStyle = gl; g.beginPath(); g.arc(p.x, p.y, rad * 5, 0, TAU); g.fill();
      g.fillStyle = last ? SHELL.gold : `hsl(${s.hue},88%,74%)`;
      g.strokeStyle = g.fillStyle; g.lineWidth = 1.5;
      g.beginPath();
      if (s.family === 'drag') { g.moveTo(p.x, p.y - rad * 1.6); g.lineTo(p.x + rad * 1.4, p.y); g.lineTo(p.x, p.y + rad * 1.6); g.lineTo(p.x - rad * 1.4, p.y); g.closePath(); g.fill(); }
      else if (s.family === 'release') { g.moveTo(p.x, p.y - rad * 1.5); g.lineTo(p.x + rad * 1.4, p.y + rad); g.lineTo(p.x - rad * 1.4, p.y + rad); g.closePath(); g.fill(); }
      else if (s.family === 'hold') { g.rect(p.x - rad, p.y - rad, rad * 2, rad * 2); g.fill(); }
      else if (s.family === 'inhibit') { g.arc(p.x, p.y, rad * 1.25, 0, TAU); g.stroke(); }
      else { g.arc(p.x, p.y, rad, 0, TAU); g.fill(); }
    }

    /* the mixtape title, slamming in once the sky is drawn */
    const nameIn = clamp((age - 0.85) * 4, 0, 1);
    if (nameIn > 0) {
      g.save();
      g.translate(cx, 552); g.scale(backOut(nameIn), backOut(nameIn));
      g.font = FONT.heavy(runName().length > 20 ? 20 : 24);
      g.fillStyle = 'rgba(255,113,206,.5)'; g.fillText(runName(), 2, 3);
      g.fillStyle = SHELL.cream; g.fillText(runName(), 0, 0);
      g.restore();
      g.font = FONT.mono(13); g.fillStyle = SHELL.gold;
      g.fillText(run.wins + (run.wins === 1 ? ' GAME WON' : ' GAMES WON'), cx, 584);
      if (run.wins >= Save.d.best && run.wins > 0) {
        g.globalAlpha = 0.6 + 0.4 * Math.abs(Math.sin(t * 6));
        g.fillStyle = SHELL.pink; g.fillText('NEW BEST', cx, 608);
        g.globalAlpha = 1;
      } else if (Save.d.best > 0) {
        g.fillStyle = 'rgba(154,143,184,.8)'; g.fillText('best ' + Save.d.best, cx, 608);
      }
    }
    /* the moon in his grill waxes full — he has been wearing it all game */
    drawMascot(cx, 748, Math.min(1, age * 1.6), t,
      { scale: 1.20, grill: clamp((age - 0.9) * 0.9, 0, 1) });
    const ph = beatPhase();
    g.globalAlpha = .55 + .45 * Math.abs(Math.sin(ph * Math.PI));
    g.font = FONT.heavy(18); g.fillStyle = SHELL.gold;
    g.fillText('TAP TO GO AGAIN', cx, CFG.H - 178);
    g.globalAlpha = 1;
  }

  /* --------------------------- interruption ------------------------------ */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && (state === 'play' || state === 'countin')) {
      /* restart the interrupted game with a fresh count-in */
      mountNextSame();
    }
  });
  function mountNextSame() {
    if (!cartDef) return;
    nextDef = cartDef;
    run.gameNum--;                                   // remount same slot
    advance();
  }

  /* ------------------------------ self test ------------------------------ */
  function selfTest() {
    const ids = new Set();
    for (const r of REG) {
      if (!r.id || ids.has(r.id)) throw new Error('bad cartridge id ' + r.id);
      ids.add(r.id);
      if (!['tap', 'hold', 'release', 'drag', 'inhibit', 'mash'].includes(r.family)) throw new Error(r.id + ': bad family ' + r.family);
      if (!(r.slotBeats > 0)) throw new Error(r.id + ': bad slotBeats');
      if (typeof r.create !== 'function') throw new Error(r.id + ': no create');
    }
    if (debug.test) {
      const off = document.createElement('canvas'); off.width = CFG.W; off.height = CFG.H;
      const og = off.getContext('2d');
      for (const r of REG) {
        const inst = r.create(makeEnv({
          seed: 1, difficulty: 0,
          audio: { tone() {}, noise() {} },
          beatLen: () => 0.6, beatPhase: () => 0, armed: () => true,
        }));
        for (let i = 0; i < 10; i++) inst.step(1 / 60, { down: false, x: 195, y: 400, justDown: false, justUp: false });
        inst.render(og);
        if (inst.result() === undefined) throw new Error(r.id + ': result() undefined');
        if (typeof inst.timeout !== 'function') throw new Error(r.id + ': no timeout()');
        if (typeof inst.line !== 'function') throw new Error(r.id + ': no line()');
        const ln = inst.line();
        if (typeof ln !== 'string' || ln.length > 44) throw new Error(r.id + ': line() must be a string <= 44 chars, got ' + JSON.stringify(ln));
        if (!['won', 'lost', 'pending'].includes(inst.timeout())) throw new Error(r.id + ': timeout() must return won|lost|pending');
      }
      console.log('selfTest: ' + REG.length + ' cartridges OK');
    }
  }

  /* debug API — the house harness pattern (window.__NAME + state probe) */
  window.__LBB = {
    state: () => ({
      state, stateT: +stateT.toFixed(2), bpm: Audio2.bpm,
      game: cartDef && cartDef.id, next: nextDef && nextDef.id,
      result: cart ? cart.result() : null,
      /* the shell's own verdict for the round just played — authoritative, because a
         cartridge that resolves on the slot clock never changes its own result() */
      last: lastResult, resolved: resolvedCount,
      run: run ? { wins: run.wins, lives: run.lives, streak: run.streak, n: run.gameNum } : null,
      fps,
    }),
    reg: () => REG.map(r => ({ id: r.id, family: r.family, command: r.command, slotBeats: r.slotBeats, boss: !!r.boss })),
    hint: () => (cart && cart.hint) ? cart.hint() : null,
    version: VERSION,
  };

  return {
    boot() {
      selfTest();
      requestAnimationFrame(frame);
    },
    get REG() { return REG; },
  };
})();

/* TEST CARD — QA-only cartridge (debugOnly: never in rotation) */
(function () {
  registerGame({
    id: 'testcard', title: 'TEST CARD', command: 'TAP IT!', family: 'tap', slotBeats: 6, debugOnly: true,
    create(env) {
      let done = 'pending';
      const tx = 80 + env.rng() * (env.W - 160), ty = 260 + env.rng() * 300;
      let pulse = 0;
      return {
        step(dt, inp) {
          pulse += dt;
          if (done !== 'pending') return;
          if (inp.justDown) {
            const d = Math.hypot(inp.x - tx, inp.y - ty);
            if (d < 60) { done = 'won'; env.audio.tone({ f: 880, type: 'square', dur: 0.08, vol: 0.3 }); }
          }
        },
        render(g) {
          g.fillStyle = '#1d0d2e'; g.fillRect(0, 0, env.W, env.H);
          g.strokeStyle = env.ink; g.lineWidth = 3;
          const r = 44 + Math.sin(pulse * 6) * 6;
          g.beginPath(); g.arc(tx, ty, r, 0, Math.PI * 2); g.stroke();
          g.fillStyle = '#ffd166';
          g.beginPath(); g.arc(tx, ty, 20, 0, Math.PI * 2); g.fill();
        },
        result: () => done,
        timeout: () => 'lost',
        line: () => 'THE DOT REMAINS UNTAPPED.',
        hint: () => ({ type: 'tap', x: tx, y: ty }),
      };
    },
  });
})();

/* RALLY EVOLVED — return THE METRONOME's beat-locked serve; the rally is the track */
(function () {
  registerGame({
    id: 'rally',
    title: 'RALLY EVOLVED',
    command: 'RETURN IT!',
    family: 'tap',
    slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, cx = W / 2;
      // court perspective — donor math (cy^1.18), compressed so play sits in top 2/3
      const courtTop = H * 0.10, courtBot = H * 0.62;
      const halfTop = Math.min(W * 0.22, 150), halfBot = Math.min(W * 0.46, 330);
      const scrY = (cy) => courtTop + (courtBot - courtTop) * Math.pow(cy, 1.18);
      const halfW = (cy) => halfTop + (halfBot - halfTop) * Math.pow(cy, 1.18);
      const scl = (cy) => 0.55 + 0.6 * cy;
      const scrX = (cy, u) => cx + u * halfW(cy);
      const COL = {
        bg: '#061014', courtA: '#12524a', courtB: '#0e433d', line: '#dff3e9',
        ball: '#ffb32e', fast: '#35e0ff', lob: '#b78bff', fire: '#ff5d2e',
        dim: 'rgba(223,243,233,0.55)',
      };
      const F9 = (px) => '900 ' + px + 'px "Arial Black","Segoe UI Black",sans-serif';
      const F7 = (px) => '700 ' + px + 'px "Segoe UI",system-ui,sans-serif';
      const PERF = 0.075, GOODW = 0.16; // strike windows (s) around arrival
      const need = env.difficulty === 0 ? 1 : 2; // returns to land

      // ---- state ----
      let t = 0, bf = 0, whole = 0, prevPhase = null;
      let done = 'pending';
      let ball = null, returns = 0, served = false, seenFast = false;
      let playerX = 0, oppX = 0, oppDive = 0, swingT = 0, oppSwingT = 0;
      let shakeT = 0, shakeMag = 0, shX = 0, shY = 0, flashT = 0, flashCol = '#fff';
      let banner = null;
      const pops = [], parts = [], trail = [];
      const serveAim = env.rng() * 1.5 - 0.75;
      const replyAim = env.rng() * 1.5 - 0.75;
      const LINES = ['YOU DROPPED THE POCKET', 'THE METRONOME NEVER MISSES', 'OFF BY A HAIR. A LOAD-BEARING HAIR.'];
      const failLine = LINES[Math.floor(env.rng() * LINES.length)];

      // ---- kit (donor voices via env.audio; grid-scheduled via t offsets) ----
      const dTick = (down, loud) => env.audio.tone({ f: down ? 2100 : 1600, type: 'square', dur: 0.03, vol: loud ? 0.09 : 0.035 });
      const dKick = (d, fat) => { env.audio.tone({ f: 132, f2: 42, type: 'sine', dur: 0.24, vol: fat ? 0.55 : 0.45, t: d }); env.audio.noise({ dur: 0.025, vol: 0.1, hp: 1400, t: d }); };
      const dClap = (d) => { env.audio.noise({ dur: 0.11, vol: 0.2, hp: 1200, lp: 2600, t: d }); env.audio.noise({ dur: 0.08, vol: 0.11, hp: 1400, lp: 2800, t: d + 0.013 }); };
      const dSnare = () => { env.audio.noise({ dur: 0.13, vol: 0.24, hp: 900, lp: 2400 }); env.audio.tone({ f: 195, f2: 150, type: 'triangle', dur: 0.09, vol: 0.14 }); };
      const dRim = () => { env.audio.tone({ f: 1150, type: 'square', dur: 0.03, vol: 0.1 }); env.audio.noise({ dur: 0.03, vol: 0.08, hp: 4000 }); };
      const dHat = (d) => env.audio.noise({ dur: 0.045, vol: 0.07, hp: 7500, t: d });
      const fxWhiff = () => env.audio.noise({ dur: 0.07, vol: 0.1, hp: 500, lp: 1500 });
      const fxTape = () => env.audio.tone({ f: 160, f2: 24, type: 'sawtooth', dur: 0.6, vol: 0.26 });
      const fxRiser = (dur) => env.audio.tone({ f: 180, f2: 900, type: 'sawtooth', dur, vol: 0.08 });
      const fxCrash = (d) => {
        env.audio.noise({ dur: 0.7, vol: 0.3, hp: 5000, t: d });
        env.audio.noise({ dur: 0.3, vol: 0.2, hp: 600, lp: 1400, t: d });
        for (let i = 0; i < 5; i++) env.audio.noise({ dur: 0.05, vol: 0.13, hp: 1100, lp: 2200, t: Math.max(0, d - 0.28) + i * 0.055 });
      };

      // ---- fx helpers ----
      function pop(txt, col, sz) {
        pops.push({ txt, col, sz: sz || 1, age: 0, x: cx, y: H * 0.42 + (env.rng() * 30 - 15) });
        if (pops.length > 12) pops.shift();
      }
      function burst(x, y, n, col) {
        for (let i = 0; i < n; i++) {
          if (parts.length > 120) parts.shift();
          const a = env.rng() * Math.PI * 2, sp = 70 + env.rng() * 230;
          parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, age: 0, life: 0.7 + env.rng() * 0.5, col, w: 3 + env.rng() * 4, rot: env.rng() * 6, vr: (env.rng() - 0.5) * 10 });
        }
      }
      const shake = (m) => { shakeT = 0.22; shakeMag = m; };
      const flash = (col, d) => { flashT = d; flashCol = col; };

      // ---- ball (flight beats are bar-preserving: 2<->2, fast 1.5->2.5, lob 3->1) ----
      function launch(from, b0, flightB, x0, x1, type, opts) {
        opts = opts || {};
        ball = { from, b0, flightB, x0, x1, type, smash: !!opts.smash, perfect: !!opts.perfect, curve: opts.curve || 0, judged: false, resolved: false };
        trail.length = 0;
        const bl = env.beatLen(), lead = Math.max(0, (b0 - bf) * bl); // percussion on the grid, not at the tap
        if (from === 'P') {
          dKick(lead, !!opts.perfect);
          if (opts.perfect) dClap(lead);
          if (opts.smash) fxRiser(flightB * bl * 0.8);
        } else if (type === 'f') dRim(); else dSnare();
        dHat(lead + flightB * bl / 2); // the bounce is the hi-hat
      }
      function ballScreen() {
        const T = Math.max(0, Math.min(1, (bf - ball.b0) / ball.flightB));
        const cy = ball.from === 'P' ? 1 - T : T;
        const cu = ball.x0 + (ball.x1 - ball.x0) * T + Math.sin(Math.PI * T) * ball.curve;
        let h1, h2;
        if (ball.type === 'f') { h1 = 0.35; h2 = 0.22; }
        else if (ball.type === 'l') { h1 = 1.7; h2 = 0.85; }
        else if (ball.smash) { h1 = 0.3; h2 = 0.2; }
        else { h1 = 0.8; h2 = 0.5; }
        const u = T * 2;
        const zu = u < 1 ? h1 * 4 * u * (1 - u) : h2 * 4 * (u - 1) * (2 - u);
        const s = scl(cy);
        return { x: scrX(cy, cu), y: scrY(cy), z: zu * 88 * s, s };
      }
      const ballCol = () => ball.smash ? COL.fire : ball.type === 'f' ? COL.fast : ball.type === 'l' ? COL.lob : COL.ball;

      function playerHit(quality, tapX) {
        const arrB = ball.b0 + ball.flightB;
        const perfect = quality === 'perfect';
        let aim = tapX < W * 0.35 ? -0.75 : tapX > W * 0.65 ? 0.75 : 0;
        if (!perfect) aim += (env.rng() - 0.5) * 0.5;
        aim = Math.max(-0.85, Math.min(0.85, aim));
        ball.judged = true; returns++; swingT = 0.18;
        const final = returns >= need;
        const smash = final && perfect;
        const flight = smash ? 2 : ball.type === 'f' ? 2.5 : ball.type === 'l' ? 1 : 2;
        const curve = (perfect ? 0.22 : 0.05) * (aim === 0 ? (env.rng() < 0.5 ? -1 : 1) : Math.sign(aim));
        // feedback — instant at the thumb, percussion on the grid
        if (perfect) {
          pop(smash ? 'SMASH' : 'PERFECT', smash ? COL.fire : '#ffffff', smash ? 1.5 : 1.05);
          flash(smash ? COL.fire : '#ffffff', smash ? 0.22 : 0.08);
          shake(smash ? 9 : 3);
          burst(scrX(1, playerX), scrY(0.97) - 40, smash ? 36 : 14, smash ? COL.fire : COL.ball);
        } else {
          pop('GOOD', '#9fe8ff', final ? 1.2 : 0.8);
          if (final) { flash('#ffffff', 0.08); shake(3); burst(scrX(1, playerX), scrY(0.97) - 40, 14, COL.ball); }
        }
        launch('P', arrB, flight, ball.x1, aim, 'n', { perfect, smash, curve });
        if (final) {
          done = 'won';
          banner = { txt: 'POINT — YOU', col: COL.ball };
          if (smash) fxCrash(flight * env.beatLen()); // it lands; the metronome eats silence
        }
      }

      function onWrap() { // beat boundary
        dTick((whole - 1) % 4 === 0, !served || done !== 'pending'); // the tick taunts between points
        if (!served && whole >= 1) { // the serve lands on the downbeat — trust the tick
          served = true;
          oppSwingT = 0.18;
          launch('O', whole, 2, 0, serveAim, 'n', {});
        }
      }

      return {
        step(dt, inp) {
          t += dt;
          const bl = env.beatLen();
          const phase = env.beatPhase();
          if (prevPhase !== null && phase < prevPhase - 0.5) { whole++; onWrap(); }
          prevPhase = phase;
          bf = whole + phase;
          swingT = Math.max(0, swingT - dt);
          oppSwingT = Math.max(0, oppSwingT - dt);
          oppDive = Math.max(0, oppDive - dt * 1.4);
          if (shakeT > 0) { shakeT -= dt; shX = (env.rng() * 2 - 1) * shakeMag; shY = (env.rng() * 2 - 1) * shakeMag; }
          if (flashT > 0) flashT -= dt;

          if (ball) {
            const arrB = ball.b0 + ball.flightB;
            // player's return reaches the far baseline
            if (ball.from === 'P' && !ball.resolved && bf >= arrB) {
              ball.resolved = true;
              if (done === 'won') {
                if (ball.smash) oppDive = 1; else oppSwingT = 0.18; // dives on smash; too late either way
              } else {
                // THE METRONOME never misses — the reply
                oppSwingT = 0.18;
                const type = env.difficulty === 2 ? 'f' : 'n';
                if (type === 'f' && !seenFast) { seenFast = true; pop('OFFBEAT INCOMING', COL.fast, 1.0); }
                launch('O', arrB, type === 'f' ? 1.5 : 2, ball.x1, replyAim, type, {});
              }
            }
            // pass check resolves BEFORE any late tap could be judged (donor order)
            if (ball.from === 'O' && !ball.judged && (bf - arrB) * bl > GOODW && env.armed() && done === 'pending') {
              ball.judged = true;
              fxWhiff(); fxTape();
              done = 'lost';
              banner = { txt: 'POINT — THE METRONOME', col: '#ff5d7b' };
            }
            const p = ballScreen();
            trail.push({ x: p.x, y: p.y - p.z, age: 0 });
            if (trail.length > 14) trail.shift();
          }
          for (const tp of trail) tp.age += dt;

          // tap judgment — anywhere on screen; x aims
          if (done === 'pending' && inp.justDown && ball && ball.from === 'O' && !ball.judged) {
            const err = (bf - (ball.b0 + ball.flightB)) * bl - env.calib;
            if (err < -GOODW) { // too early — whiff, ball keeps coming
              fxWhiff(); swingT = 0.15; pop('early', '#7a8fa0', 0.6);
            } else if (Math.abs(err) <= PERF) playerHit('perfect', inp.x);
            else if (Math.abs(err) <= GOODW) playerHit('good', inp.x);
          }

          // characters track the play
          let pT = 0, oT = 0;
          if (ball) { if (ball.from === 'O') { pT = ball.x1; oT = ball.x0; } else { pT = ball.x0; oT = ball.x1; } }
          playerX += (pT - playerX) * Math.min(1, dt * 6);
          const oSpd = ball && ball.smash ? 1.6 : 6;
          oppX += (oT - oppX) * Math.min(1, dt * oSpd);

          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i]; p.age += dt;
            if (p.age > p.life) { parts.splice(i, 1); continue; }
            p.vy += 380 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
          }
          for (let i = pops.length - 1; i >= 0; i--) { pops[i].age += dt; if (pops[i].age > 1.1) pops.splice(i, 1); }
        },

        render(g) {
          g.save();
          if (shakeT > 0) g.translate(shX, shY);
          g.fillStyle = COL.bg; g.fillRect(-12, -12, W + 24, H + 24);
          const pulse = Math.pow(Math.max(0, 1 - (bf - Math.floor(bf))), 2.5);
          // court halves
          const quad = (c0, c1, fill) => {
            g.beginPath();
            g.moveTo(scrX(c0, -1), scrY(c0)); g.lineTo(scrX(c0, 1), scrY(c0));
            g.lineTo(scrX(c1, 1), scrY(c1)); g.lineTo(scrX(c1, -1), scrY(c1));
            g.closePath(); g.fillStyle = fill; g.fill();
          };
          quad(0, 0.5, COL.courtB); quad(0.5, 1, COL.courtA);
          g.strokeStyle = 'rgba(223,243,233,' + (0.5 + pulse * 0.45) + ')'; g.lineWidth = 2;
          g.beginPath();
          g.moveTo(scrX(0, -1), scrY(0)); g.lineTo(scrX(0, 1), scrY(0));
          g.lineTo(scrX(1, 1), scrY(1)); g.lineTo(scrX(1, -1), scrY(1));
          g.closePath(); g.stroke();
          g.strokeStyle = 'rgba(223,243,233,0.25)';
          g.beginPath(); g.moveTo(scrX(0, 0), scrY(0)); g.lineTo(scrX(1, 0), scrY(1)); g.stroke();
          const ny = scrY(0.5), nw = halfW(0.5);
          g.strokeStyle = 'rgba(223,243,233,' + (0.65 + pulse * 0.35) + ')'; g.lineWidth = 3;
          g.beginPath(); g.moveTo(cx - nw, ny); g.lineTo(cx + nw, ny); g.stroke();
          g.lineWidth = 1; g.strokeStyle = 'rgba(223,243,233,0.3)';
          for (let i = -4; i <= 4; i++) { const nx = cx + nw * i / 4; g.beginPath(); g.moveTo(nx, ny); g.lineTo(nx, ny - 9); g.stroke(); }

          const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

          // THE METRONOME (far) — pendulum extremes land ON the beat
          g.save();
          g.translate(scrX(0, oppX), scrY(0.03)); g.scale(0.7, 0.7);
          if (oppDive > 0) g.rotate(0.9 * (oppX >= 0 ? 1 : -1) * oppDive);
          g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(0, 4, 18, 5, 0, 0, Math.PI * 2); g.fill();
          rr(-11, -44, 22, 34, 8); g.fillStyle = '#0b1a1c'; g.fill();
          g.strokeStyle = 'rgba(223,243,233,0.35)'; g.lineWidth = 1.5; rr(-11, -44, 22, 34, 8); g.stroke();
          g.beginPath(); g.moveTo(-13, -46); g.lineTo(13, -46); g.lineTo(7, -74); g.lineTo(-7, -74); g.closePath();
          g.fillStyle = '#caa64b'; g.fill(); g.strokeStyle = '#0b1a1c'; g.lineWidth = 2; g.stroke();
          const pang = Math.cos(Math.PI * bf) * 0.55;
          g.save(); g.translate(0, -48); g.rotate(pang);
          g.strokeStyle = '#0b1a1c'; g.lineWidth = 2.5;
          g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -24); g.stroke();
          g.fillStyle = '#0b1a1c'; g.beginPath(); g.arc(0, -24, 3.5, 0, Math.PI * 2); g.fill();
          g.restore();
          const osw = oppSwingT > 0 ? (1 - oppSwingT / 0.18) : 0;
          const oang = 2.6 - osw * 2.2;
          g.strokeStyle = 'rgba(223,243,233,0.7)'; g.lineWidth = 3.5; g.lineCap = 'round';
          g.beginPath(); g.moveTo(-10, -36); g.lineTo(-10 + Math.cos(oang) * -20, -36 + Math.sin(oang) * -20); g.stroke();
          g.restore();

          // ball + trail + arrival ring
          if (ball) {
            const p = ballScreen(), col = ballCol();
            for (let i = 0; i < trail.length; i++) {
              const tp = trail[i], a = Math.max(0, 1 - tp.age * 3) * (i / trail.length) * 0.6;
              if (a <= 0) continue;
              g.globalAlpha = a; g.fillStyle = col;
              g.beginPath(); g.arc(tp.x, tp.y, 4.5 * p.s, 0, Math.PI * 2); g.fill();
            }
            g.globalAlpha = 1;
            g.fillStyle = 'rgba(0,0,0,0.45)';
            g.beginPath(); g.ellipse(p.x, p.y, 7 * p.s, 3 * p.s, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = col;
            g.beginPath(); g.arc(p.x, p.y - p.z, 7.5 * p.s, 0, Math.PI * 2); g.fill();
            g.fillStyle = 'rgba(255,255,255,0.5)';
            g.beginPath(); g.arc(p.x - 2 * p.s, p.y - p.z - 2 * p.s, 2.4 * p.s, 0, Math.PI * 2); g.fill();
            if (t < 1.8) { // shared marking: ink rim on the critical object, 8th-note pulse
              const e8 = 1 - ((bf * 2) % 1);
              g.globalAlpha = 0.25 + 0.5 * e8 * e8;
              g.strokeStyle = env.ink; g.lineWidth = 2;
              g.beginPath(); g.arc(p.x, p.y - p.z, 7.5 * p.s + 3.5, 0, Math.PI * 2); g.stroke();
              g.globalAlpha = 1;
            }
            if (ball.from === 'O' && !ball.judged) {
              const rem = (ball.b0 + ball.flightB - bf) / ball.flightB;
              if (rem < 0.8) {
                const lx = scrX(1, ball.x1), ly = scrY(0.97) - 40, r = 14 + Math.max(0, rem) * 90;
                g.globalAlpha = 0.35 + 0.6 * (1 - rem);
                g.strokeStyle = col; g.lineWidth = 3.5;
                g.beginPath(); g.arc(lx, ly, r, 0, Math.PI * 2); g.stroke();
                g.globalAlpha = 1;
              }
            }
          }

          // player (near)
          g.save();
          g.translate(scrX(1, playerX), scrY(0.97)); g.scale(1.05, 1.05);
          g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(0, 4, 20, 6, 0, 0, Math.PI * 2); g.fill();
          rr(-12, -46, 24, 36, 9); g.fillStyle = '#f2f7f4'; g.fill();
          g.beginPath(); g.arc(0, -56, 10, 0, Math.PI * 2); g.fillStyle = '#f2f7f4'; g.fill();
          const sw = swingT > 0 ? (1 - swingT / 0.18) : 0;
          const ang = -1.9 + sw * 2.6;
          g.strokeStyle = COL.ball; g.lineWidth = 4; g.lineCap = 'round';
          g.beginPath(); g.moveTo(10, -38); g.lineTo(10 + Math.cos(ang) * 26, -38 + Math.sin(ang) * 26); g.stroke();
          g.beginPath(); g.arc(10 + Math.cos(ang) * 32, -38 + Math.sin(ang) * 32, 8, 0, Math.PI * 2);
          g.strokeStyle = '#f2f7f4'; g.lineWidth = 3; g.stroke();
          g.restore();

          // particles
          for (const p of parts) {
            g.save(); g.globalAlpha = Math.max(0, 1 - p.age / p.life);
            g.translate(p.x, p.y); g.rotate(p.rot);
            g.fillStyle = p.col; g.fillRect(-p.w / 2, -p.w / 2, p.w, p.w * 0.6);
            g.restore();
          }
          // pops
          for (const pp of pops) {
            const k = pp.age / 1.1;
            g.save(); g.globalAlpha = 1 - k; g.textAlign = 'center';
            g.font = F9(19 * pp.sz + (1 - k) * 5);
            g.fillStyle = pp.col;
            g.fillText(pp.txt, pp.x, pp.y - k * 44);
            g.restore();
          }
          // HUD — native dim labels
          g.textAlign = 'right'; g.font = F7(12); g.fillStyle = COL.dim;
          g.fillText('♩ = ' + Math.round(60 / env.beatLen()), W - 14, 32);
          g.textAlign = 'left';
          g.fillText('rally ' + returns + (need > 1 ? ' / ' + need : ''), 14, 32);
          // point banner
          if (banner) {
            g.textAlign = 'center'; g.font = F9(Math.min(34, W * 0.075));
            g.fillStyle = banner.col;
            g.fillText(banner.txt, cx, H * 0.5);
          }
          // flash
          if (flashT > 0) {
            g.globalAlpha = Math.min(0.5, flashT * 3);
            g.fillStyle = flashCol; g.fillRect(-12, -12, W + 24, H + 24);
            g.globalAlpha = 1;
          }
          g.restore();
        },

        result: () => done,
        timeout: () => 'lost',
        line: () => failLine,
        hint() {
          if (done !== 'pending') return { type: 'wait', ms: 200 };
          if (ball && ball.from === 'O' && !ball.judged) {
            const rem = (ball.b0 + ball.flightB - bf) * env.beatLen();
            if (rem > 0.12) return { type: 'wait', ms: Math.max(16, Math.min(400, (rem - 0.06) * 1000)) };
            return { type: 'tap', x: cx, y: H * 0.5 };
          }
          return { type: 'wait', ms: 80 };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - The serve launches from THE METRONOME on the first beat boundary after create and
     arrives exactly 2 beats later; its arrival ring shrinks r=14+rem*90 onto the landing spot.
   - A tap within ±0.075s of arrival (calib-adjusted) is PERFECT: kick+clap scheduled on the
     grid, white flash 0.08s, shake 3, 14-chip burst. Within ±0.16s is GOOD. Either counts.
   - The final required return (1 at difficulty 0, 2nd at difficulty 1/2) sets result 'won'
     at the tap itself; a perfect final is a SMASH (fire flash 0.22, shake 9, 36 chips, dive).
   - An incoming ball passing 0.16s beyond arrival unjudged sets 'lost': whiff + tape-stop
     and the 'POINT — THE METRONOME' banner in #ff5d7b.
   - Difficulty 1 replies with a normal ball (2 beats); difficulty 2 replies FAST #35e0ff
     (1.5-beat flight, flat arc h1=0.35/h2=0.22, rim-click cue, 'OFFBEAT INCOMING' pop).
   BUG-IS-GAME (do not fix):
   - Early taps (more than 0.16s before arrival) do NOT lose — whiff sound, 'early' pop,
     same ball stays live for a retap. The signature mercy.
   - There is no late window: the pass check in step() resolves before a late tap can be
     judged. Don't add one.
   - Rally percussion is scheduled at the quantized beat (t-offset on env.audio), NOT at the
     tap — an early tap's kick fires later, dead on the grid.
   - The pendulum's EXTREMES land on the beat (ang=cos(PI*bf)*0.55), not its center-crossing.
   - A fast ball returns as the SLOW flight (1.5 in -> 2.5 back) — bar-preserving math.
   - The tick is LOUDER (0.09 vs 0.035) before the serve and after the point resolves —
     the metronome taunts between points.
*/

/* ===== carts/11-satisfaction.js ===== */
/* SATISFACTION — parry the red, never the gold: one dandy, one exchange of the duel */
(function () {
  var PAPER = '#efe3cb', PAPER2 = '#e6d6b8', INK = '#181420',
    INKSOFT = 'rgba(24,20,32,0.55)', RED = '#d81f3d', GOLD = '#d9a532',
    PINK = '#ff2e88', CYAN = '#25d4c8';
  var HURL = ['SPIGGOT!', 'POPINJAY!', 'MILKSOP!', 'NINNYHAMMER!', 'BLACKGUARD!', 'SCOUNDREL!', 'TRAGGOT!', 'CHURL!'];
  var BOSSES = [
    { key: 'POPINJAY', name: 'THE POPINJAY', tag: 'he telegraphs everything. vanity does that.',
      accent: '#2aa198', body: { wTop: 46, wBot: 60, hgt: 120, hat: 'plume', lean: 0 } },
    { key: 'MILKSOP', name: 'THE MILKSOP', tag: 'gold means he won’t.',
      accent: '#7fa8c9', body: { wTop: 36, wBot: 46, hgt: 104, hat: 'droop', lean: 0.1, teacup: true } },
    { key: 'SPIGGOT', name: 'THE SPIGGOT', tag: 'fast. wrong about everything, but fast.',
      accent: '#8fd12e', body: { wTop: 26, wBot: 34, hgt: 126, hat: 'stove', lean: 0.06, spikes: true } }
  ];
  function fh(px) { return '900 ' + px + 'px Georgia, "Times New Roman", serif'; }
  function fi(px) { return 'italic 600 ' + px + 'px Georgia, "Times New Roman", serif'; }

  registerGame({
    id: 'satisfaction', title: 'SATISFACTION', command: 'PARRY!', family: 'tap', slotBeats: 8,
    create(env) {
      var W = env.W, H = env.H, S = Math.min(W, H) / 430;
      var rand = function (a, b) { return a + env.rng() * (b - a); };
      var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
      var lerp = function (a, b, k) { return a + (b - a) * k; };
      var easeOut = function (k) { return 1 - Math.pow(1 - k, 3); };
      var easeIn = function (k) { return k * k * k; };

      /* ---- audio: donor recipes on the shell's sfx bus (vols scaled ~3x for the bus) ---- */
      var VS = 3.2;

      }

        windup: function () { T(392, 0.05, 'square', 0.028); },     // harsh square = the TRUTH
        feint: function () { T(1560, 0.16, 'sine', 0.035, 1100); }, // pretty falling sine = the LIE
        baited: function () { T(660, 0.2, 'sawtooth', 0.07, 180); N(0.08, 0.1); },
        held: function () { T(1040, 0.07, 'sine', 0.03); },
        early: function () { T(220, 0.08, 'square', 0.05, 160); }
      };
      var FAN = [659, 784, 988, 1319];

      /* ---- plan the exchange (all rolls at create — deterministic) ---- */
      var diff = clamp(env.difficulty | 0, 0, 2), boss = BOSSES[diff];
      var moves = [], gap;
      if (diff === 0) {              // THE POPINJAY: one honest red
        gap = rand(1050, 1400);
        moves.push({ type: 'strike', windup: rand(880, 980), strike: 340, inGap: 0 });
      } else if (diff === 1) {       // THE MILKSOP: maybe a gold lie first
        gap = rand(950, 1300);
        if (env.rng() < 0.38) {
          moves.push({ type: 'feint', windup: rand(820, 940), inGap: 0 });
          moves.push({ type: 'strike', windup: rand(820, 940) * 0.72, strike: 330, inGap: rand(160, 320) });
        } else moves.push({ type: 'strike', windup: rand(820, 940), strike: 330, inGap: 0 });
      } else {                       // THE SPIGGOT, Traggot garnish: gold, then the sudden strike
        gap = rand(620, 950);
        moves.push({ type: 'feint', windup: rand(470, 620), inGap: 0 });
        moves.push({ type: 'strike', windup: rand(240, 330), strike: 295, inGap: 90, sudden: true });
      }
      // fit inside the slot: shrink the opening gap, then windups; never the strike window
      var budget = env.beatLen() * 8 * 1000 - 320;
      function totalMs() {
        var s = gap + moves[moves.length - 1].strike;
        for (var i = 0; i < moves.length; i++) s += moves[i].windup + moves[i].inGap;
        return s;
      }
      if (totalMs() > budget) gap = Math.max(450, gap - (totalMs() - budget));
      if (totalMs() > budget) {

        var wf = Math.max(0.7, (wsum - (totalMs() - budget)) / wsum);
        for (wi = 0; wi < moves.length; wi++) moves[wi].windup *= wf;
      }

      /* ---- paper grain tile (built once; speckle fallback if OffscreenCanvas is absent) ---- */
      var grain = null, speckles = null;
      (function () {
        if (typeof OffscreenCanvas !== 'undefined') {
          try {
            grain = new OffscreenCanvas(220, 220);
            var g2 = grain.getContext('2d'), img = g2.createImageData(220, 220);
            for (var i = 0; i < img.data.length; i += 4) {
              var v = 200 + env.rng() * 55;
              img.data[i] = v; img.data[i + 1] = v * 0.96; img.data[i + 2] = v * 0.86;
              img.data[i + 3] = env.rng() < 0.5 ? 10 : 22;

          } catch (e) { grain = null; }
        }
        speckles = [];
        for (var j = 0; j < 700; j++) speckles.push({ x: env.rng() * W, y: env.rng() * H, d: env.rng() < 0.5 });
      })();

      /* ---- state ---- */
      var t = 0, ta = 0, tq = 0, done = 'pending', started = false, failKind = '';
      var phase = 'gap', timer = gap, mi = -1, move = null;
      var lockout = 0, pose = 0, poseT = 0, lungeK = 0, hearts = 3, hp = 1;
      var floats = [], slashes = [], parts = [], squeue = [];
      var shake = 0, shakeMag = 0, hitstop = 0, sx = 0, sy = 0;
      var flashA = 0, flashColor = PINK, redEdge = 0;
      var hurlIdx = Math.floor(env.rng() * HURL.length);
      var stampPick = Math.floor(env.rng() * 3);

      function addFloat(txt, x, y, o) {
        o = o || {};
        floats.push({ txt: txt, x: x, y: y, vx: o.vx || 0, vy: o.vy != null ? o.vy : -0.05,
          size: o.size || 26, color: o.color || INK, life: o.life || 1100, max: o.life || 1100,

     float (34px, punch 1.7->1), and the 'STRUCK, SIR.' stamp all fire together.
   - A tap during a GOLD windup resolves 'lost' immediately: 'BAITED, SIR.' (24px RED), boss
     laugh pose (lean wobble sin(poseT/70)*0.06), RED flash 0.4, shake 13/320, redEdge 1.
   - A tap during a RED windup resolves 'lost' ('EARLY.' 20px INKSOFT + 'UNDIGNIFIED.' stamp);
     a gap/ingap tap sets a silent 240ms lockout and locked-out taps are swallowed, so mashing
     from frame one always loses.
   - Letting a GOLD dissolve untapped prints 'COMPOSURE.' (16px INKSOFT) and continues into a
     RED: d1 follow-up windup *0.72 after inGap rand(160,320); d2 sudden windup rand(240,330)
     after inGap 90 with strike 295 (the Traggot mixup constants). Difficulty 2 always leads gold.
   - Strike window expiring untapped resolves 'lost' with the boss fully lunged (1.55x scale at
     H*0.55 over the rgba(216,31,61,0.18) disc). timeout() returns 'lost'.
   - The planned exchange (gap + windups + inGaps + strike) fits 8*beatLen()-320ms: the opening
     gap shrinks first (floor 450ms), then windups scale (floor 0.7x); the window never shrinks.
   BUG-IS-GAME (do not fix):
   - Idle whiff = ZERO feedback, hidden 240ms lockout. No sound, no text. Ever.
   - The feint's sound (1560Hz falling sine) is prettier and softer than the real windup's harsh
     392Hz square blip — the gentle cue marks the LIE. Do not swap them.
   - GOLD feints get the identical closing telegraph ring as RED strikes — the ring IS the bait.
   - The HURL cycle can shout the boss's own name, triggering 'AD HOMINEM!' 120ms later —

        // coin slot plate + felt-dark mouth + serial + NO TILT
        g.fillStyle = G.brass; rr(g, MX - 34, 494, 68, 24, 5); g.fill();
        g.fillStyle = '#17120E'; rr(g, MX - 3, 498, 6, 16, 2); g.fill();
        g.font = '600 9px Georgia,"Times New Roman",serif'; g.fillStyle = 'rgba(242,227,194,0.55)';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText('SER. No 011959', MX, 534);
        g.font = '900 11px "Arial Black","Segoe UI Black",sans-serif'; g.fillStyle = 'rgba(242,227,194,0.16)';
        g.fillText('NO TILT', MX, 550);

        g.beginPath(); g.moveTo(HUB.x, HUB.y); g.lineTo(gx, gy); g.stroke();
        g.strokeStyle = GLINT; g.lineWidth = 2;
        const px = Math.cos(crankA - Math.PI / 2) * 2.5, py = Math.sin(crankA - Math.PI / 2) * 2.5;
        g.beginPath();
        g.moveTo(HUB.x + Math.cos(crankA) * ARM * 0.15 + px, HUB.y + Math.sin(crankA) * ARM * 0.15 + py);

        g.stroke();
        { // paper tag tied at 0.55 of the arm, hangs crooked — 'Still works. – J.'

          g.strokeStyle = '#C9B98F'; g.lineWidth = 1;

          g.save(); g.translate(tx, ty + 9); g.rotate(tagA * 0.7 + 0.07);
          g.fillStyle = 'rgba(0,0,0,0.30)'; rr(g, -15 + 2, 2, 30, 15, 2); g.fill();
          g.fillStyle = '#E4D6AE'; rr(g, -15, 0, 30, 15, 2); g.fill();
          g.strokeStyle = 'rgba(110,92,58,0.45)'; rr(g, -15, 0, 30, 15, 2); g.stroke();
          g.fillStyle = 'rgba(90,74,48,0.75)'; g.font = 'italic 600 6px Georgia,"Times New Roman",serif';

        g.fillStyle = gB; g.beginPath(); g.arc(HUB.x, HUB.y, 17, 0, TAU); g.fill();
        g.strokeStyle = '#6B5510'; g.lineWidth = 1; g.beginPath(); g.arc(HUB.x, HUB.y, 17, 0, TAU); g.stroke();
        g.save(); g.translate(gx, gy); g.rotate(crankA);
        g.fillStyle = G.wood; rr(g, -GRIPR * 0.8, -GRIPR, GRIPR * 1.6, GRIPR * 2, GRIPR * 0.7); g.fill();
        g.fillStyle = 'rgba(255,235,200,0.28)'; rr(g, -GRIPR * 0.55, -GRIPR * 0.72, GRIPR * 1.1, GRIPR * 0.4, GRIPR * 0.2); g.fill();
        g.restore();

        if (t < 0.55) {

          const cxp = MX + 70 - 70 * p1, cyp = 470 + 32 * p1 + 14 * p3;
          g.save(); g.globalAlpha = 1 - p3; g.translate(cxp, cyp); g.scale(Math.max(0.15, 1 - p2 * 0.85), 1);
          g.fillStyle = BRASS; g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.fill();
          g.strokeStyle = '#7A6114'; g.lineWidth = 1.5; g.beginPath(); g.arc(0, 0, 10, 0, TAU); g.stroke();
          g.strokeStyle = GLINT; g.beginPath(); g.arc(0, 0, 6, -0.6, 0.9); g.stroke();
          g.restore();

        if (vend.out) {
          g.fillStyle = 'rgba(0,0,0,0.3)'; g.beginPath(); g.ellipse(vend.x, TRAY_Y + 12, 11, 4, 0, 0, TAU); g.fill();
          g.fillStyle = vend.c[0]; g.beginPath(); g.arc(vend.x, vend.y, vend.r, 0, TAU); g.fill();
          g.strokeStyle = 'rgba(0,0,0,0.25)'; g.lineWidth = 1.5; g.beginPath(); g.arc(vend.x, vend.y, vend.r, 0, TAU); g.stroke();
          g.fillStyle = 'rgba(255,255,255,0.85)';

        step, render,
        result: () => done,
        timeout() {

          return done;
        },
        line: () => 'THE MACHINE KEPT YOUR PENNY. NO CANDY.',
        hint() {
          if (done !== 'pending' || committed) return { type: 'wait', ms: 250 };
          const R = 95, a0 = hintA, a1 = hintA + Math.PI / 2; // chained quarter-circle arcs, clockwise
          hintA = a1;
