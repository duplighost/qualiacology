      const sBalk = () => {
        A.tone({ f: 200, f2: 60, type: 'sawtooth', dur: 0.45, vol: 0.2 });
        A.tone({ t: 0.06, f: 520, f2: 180, type: 'sine', dur: 0.5, vol: 0.14 });   // the whine
        A.noise({ dur: 0.2, lp: 700, vol: 0.25 });
      };
      const sSlip = () => A.noise({ dur: 0.12, lp: 1800, vol: 0.13 });

      function burst(wx, wy, n, col, spd) {
        for (let i = 0; i < n && parts.length < 90; i++) {
          const a = env.rng() * Math.PI * 2, s = spd * (0.35 + env.rng() * 0.9);
          parts.push({ x: wx, y: wy, vx: Math.cos(a) * s, vy: Math.abs(Math.sin(a)) * s * 0.9 + 1.5, life: 0.5 + env.rng() * 0.55, t: 0, c: col });
        }
      }

      /* ================================ STEP ================================ */
      function step(dt, inp) {
        t += dt;
        if (hitstop > 0) { hitstop -= dt; return; }
        shake = Math.max(0, shake - dt * 3.4);
        flash = Math.max(0, flash - dt * 3.2);
        zoom = Math.max(0, zoom - dt * 2.4);
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 16 * dt;
          if (p.t > p.life) parts.splice(i, 1);
        }
        if (done !== 'pending') { if (cleared > 0) cleared += dt; joy += dt; return; }

        /* ---- the hand ---- */
        const wasGrip = gripping;
        gripping = inp.down;
        if (gripping && !wasGrip) { sGrip(); everGripped = true; }
        if (!gripping && wasGrip) sOpen();
        const target = gripping ? SHORT_REST : LONG_REST;
        const rate = gripping ? SHORTEN : LENGTHEN;
        L += Math.sign(target - L) * Math.min(Math.abs(target - L), rate * dt);

        /* ---- dog: runs forward on its own; the rope is the only brake ---- */
        if (!dog.leapt && !dog.balked) dog.vx += (DOG_TOP - dog.vx) * 3.2 * dt;
        const gy = ground(dog.x);
        if (dog.onGround) { dog.y = gy; dog.vy = 0; }
        else { dog.vy -= GRAVITY * dt; dog.y += dog.vy * dt; if (dog.y <= gy && dog.vy < 0 && !overGap(dog.x)) { dog.y = gy; dog.vy = 0; dog.onGround = true; if (dog.leapt) onDogLanded(); } }
        dog.x += dog.vx * dt;
        dog.gait += Math.abs(dog.vx) * dt * 2.2;

        /* ---- the leash: hard positional constraint (the fist is near-rigid) ---- */
        const dx = dog.x - kid.x, dy = dog.y - kid.y;
        const dist = Math.hypot(dx, dy) || 0.0001;
        taut = Math.max(0, dist - (L - 0.42));
        if (dist > L) {
          const nx = dx / dist, ny = dy / dist, over = dist - L;
          if (gripping) {
            /* the dog tows the kid: airborne kid is unclamped, grounded kid is hauled */
            kid.x += nx * over * 0.86; kid.y += ny * over * 0.86;
            dog.x -= nx * over * 0.14; dog.y -= ny * over * 0.14;
            kid.vx = Math.max(kid.vx, dog.vx * 0.92);
            if (taut > 0.02 && env.rng() < 0.09) sCreak();
            tautGlow = 1;
          } else {
            kid.x += nx * over * 0.5; kid.y += ny * over * 0.5;
            dog.x -= nx * over * 0.5;
            tautGlow = Math.max(tautGlow, 0.5);
          }
        }
        tautGlow = Math.max(0, tautGlow - dt * 2.2);

        /* ---- kid: cannot climb the pitch alone (traction ~0.03 past 35 deg) ---- */
        const slope = (ground(kid.x + 0.05) - ground(kid.x - 0.05)) / 0.1;
        const slipping = Math.max(0, Math.min(1, (Math.abs(slope) - 0.30) / 0.28));
        const traction = 1 - slipping * 0.97;
        const kgy = ground(kid.x);
        if (kid.onGround) {
          kid.y = kgy;
          if (!gripping) {
            if (slope > 0.3) { kid.vx -= 14 * slipping * dt; if (env.rng() < 0.06) sSlip(); }   // slide back down
            else kid.vx += (KID_TOP * traction - kid.vx) * 2.2 * dt;
          }
          kid.vx = Math.max(-6, Math.min(kid.vx, gripping ? DOG_TOP : KID_TOP));
        } else {
          kid.vy -= GRAVITY * dt; kid.y += kid.vy * dt;
          if (kid.y <= kgy && kid.vy < 0 && !overGap(kid.x)) { kid.y = kgy; kid.vy = 0; kid.onGround = true; }
        }
        kid.x += kid.vx * dt;
        kid.step += Math.abs(kid.vx) * dt * 2.6;
        if (kid.onGround && overGap(kid.x) && !cleared) kid.onGround = false;

        /* ---- THE GAP: the dog leaps only with rope to spare ---- */
        if (!dog.leapt && !dog.balked && dog.x > GAP_X - 0.12) {
          if (L > LEAP_GATE && dog.vx > 4) {
            dog.leapt = true; dog.onGround = false;
            dog.vy = 9.4; dog.vx = Math.max(dog.vx, 9.6);
            sLeap(); zoom = 0.5; burst(dog.x, dog.y + 0.3, 10, '#ffeec2', 3);
          } else {
            dog.balked = true; dog.vx *= BALK; dog.onGround = false; dog.vy = 1.2;
            sBalk(); shake = 1; hitstop = 0.1;
            burst(dog.x, dog.y + 0.3, 12, '#4e5a6b', 2.6);
          }
        }
        /* denied: the rope drags him down into the span */
        if (dog.balked && dog.y < -3 && done === 'pending' && env.armed()) {
          done = 'lost'; why = everGripped ? 'held' : 'never';
          flash = 0.5; shake = 1.4;
        }
        /* cleared: the far lip */
        if (dog.leapt && dog.onGround === false && dog.x > gapEnd && dog.y <= ground(dog.x) + 0.02) {
          dog.onGround = true; dog.y = ground(dog.x); onDogLanded();
        }
        /* the kid falls in */
        if (!cleared && kid.y < -6 && done === 'pending' && env.armed()) { done = 'lost'; why = 'fell'; flash = 0.4; }
      }
      function onDogLanded() {
        if (cleared) return;
        cleared = 0.0001;
        sLand(); shake = 0.7; hitstop = 0.1; zoom = 0.6;
        burst(dog.x, dog.y + 0.2, 24, '#ffeec2', 3.4);
        done = 'won';
      }

      /* =============================== RENDER =============================== */
      let G = null;
      function grads(g) {
        G = {};
        G.sky = g.createLinearGradient(0, 0, 0, H);
        G.sky.addColorStop(0, '#5d8fb8'); G.sky.addColorStop(0.62, '#f3c58c'); G.sky.addColorStop(1, '#e88f6a');
        G.sun = g.createRadialGradient(W * 0.72, H * 0.30, 6, W * 0.72, H * 0.30, 190);
        G.sun.addColorStop(0, 'rgba(255,238,194,0.55)'); G.sun.addColorStop(1, 'rgba(255,238,194,0)');
      }
      const wx = (x) => (x - camX) * PX + W * 0.32;
      const wy = (y) => H * 0.70 - (y - camY) * PX;

      function band(g, col, yOff, amp, seedA, seedB) {
        g.fillStyle = col; g.beginPath(); g.moveTo(-10, H + 10);
        for (let px = -10; px <= W + 10; px += 18) {
          const u = px / W + camX * seedB;
          const h = Math.sin(u * 3.1 + seedA) * amp + Math.sin(u * 7.3 + seedA * 2) * amp * 0.4;
          g.lineTo(px, wy(0) + yOff - h);
        }
        g.lineTo(W + 10, H + 10); g.closePath(); g.fill();
      }
      function deck(g) {
        /* ground mass with a lit surface band, split by the gap */
        const segs = [[-4, GAP_X], [gapEnd, gapEnd + 26]];
        for (const [a, b] of segs) {
          g.beginPath();
          g.moveTo(wx(a), wy(ground(a)));
          for (let x = a; x <= b; x += 0.25) g.lineTo(wx(x), wy(ground(x)));
          g.lineTo(wx(b), H + 20); g.lineTo(wx(a), H + 20); g.closePath();
          g.fillStyle = '#3b414d'; g.fill();
          g.strokeStyle = '#565d6c'; g.lineWidth = 5; g.lineJoin = 'round';
          g.beginPath(); g.moveTo(wx(a), wy(ground(a)));
          for (let x = a; x <= b; x += 0.25) g.lineTo(wx(x), wy(ground(x)));
          g.stroke();
          g.strokeStyle = '#2a2f38'; g.lineWidth = 1.5; g.stroke();
        }
        /* the arches under the viaduct deck */
        g.fillStyle = '#2a2f38';
        for (let ax = 0; ax < GAP_X; ax += 3.2) {
          if (ground(ax) < RISE - 0.1) continue;
          const px = wx(ax), py = wy(RISE);
          g.beginPath(); g.moveTo(px, py + 8); g.lineTo(px, py + 62);
          g.lineTo(px + 26, py + 62); g.lineTo(px + 26, py + 8); g.closePath(); g.fill();
          g.fillStyle = 'rgba(243,197,140,0.35)';
          g.beginPath(); g.arc(px + 13, py + 40, 11, Math.PI, 0); g.fill();
          g.fillStyle = '#2a2f38';
        }
      }
      function drawDog(g) {
        const px = wx(dog.x), py = wy(dog.y);
        const s = PX / 46, bl = 0.72 * PX;
        g.save(); g.translate(px, py);
        const lean = dog.leapt ? -0.45 : Math.min(0.3, dog.vx * 0.02);
        g.rotate(lean);
        g.fillStyle = '#2a2f38';
        /* legs */
        for (let i = 0; i < 4; i++) {
          const ph = dog.gait + i * 1.6;
          const lx = (i < 2 ? -10 : 12) * s;
          const sw = dog.leapt ? (i < 2 ? -8 : 10) : Math.sin(ph) * 7;
          g.save(); g.translate(lx, -6 * s); g.rotate(sw * 0.05);
          g.fillRect(-2.2 * s, 0, 4.4 * s, 20 * s); g.restore();
        }
        /* body + head + tail */
        g.beginPath(); g.ellipse(0, -18 * s, 17 * s, 10 * s, 0, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.ellipse(17 * s, -25 * s, 9 * s, 7 * s, -0.25, 0, Math.PI * 2); g.fill();
        g.beginPath(); g.moveTo(23 * s, -28 * s); g.lineTo(31 * s, -25 * s); g.lineTo(23 * s, -22 * s); g.closePath(); g.fill();  // snout
        g.beginPath(); g.moveTo(14 * s, -31 * s); g.lineTo(11 * s, -40 * s); g.lineTo(19 * s, -33 * s); g.closePath(); g.fill();  // ear
        g.strokeStyle = '#2a2f38'; g.lineWidth = 3 * s; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-16 * s, -22 * s);
        g.quadraticCurveTo(-26 * s, (-30 + Math.sin(dog.gait * 1.5) * 5) * s, -30 * s, -34 * s); g.stroke();
        g.restore();
        void bl;
      }
      function drawKid(g) {
        const px = wx(kid.x), py = wy(kid.y);
        const s = PX / 46;
        g.save(); g.translate(px, py);
        g.rotate(gripping ? -0.22 : Math.min(0.16, kid.vx * 0.012));
        g.fillStyle = '#2a2f38';
        const sw = Math.sin(kid.step) * 8;
        g.save(); g.rotate(sw * 0.011); g.fillRect(-3 * s, -22 * s, 6 * s, 23 * s); g.restore();
        g.save(); g.rotate(-sw * 0.011); g.fillRect(-3 * s, -22 * s, 6 * s, 23 * s); g.restore();
        g.beginPath(); g.moveTo(-8 * s, -52 * s); g.lineTo(8 * s, -52 * s); g.lineTo(6 * s, -20 * s); g.lineTo(-6 * s, -20 * s); g.closePath(); g.fill();
        g.beginPath(); g.arc(0, -60 * s, 8.5 * s, 0, Math.PI * 2); g.fill();
        /* the arm: it points at the rope, and it OPENS when you let go */
        g.strokeStyle = '#2a2f38'; g.lineWidth = 5 * s; g.lineCap = 'round';
        const ax = 16 * s, ay = gripping ? -46 * s : -34 * s;
        g.beginPath(); g.moveTo(2 * s, -46 * s); g.lineTo(ax, ay); g.stroke();
        g.fillStyle = gripping ? '#2a2f38' : '#565d6c';
        g.beginPath(); g.arc(ax, ay, gripping ? 5 * s : 6.5 * s, 0, Math.PI * 2); g.fill();
        if (!gripping) { g.strokeStyle = '#ffeec2'; g.lineWidth = 1.6 * s; g.beginPath(); g.arc(ax, ay, 9 * s, -0.9, 0.9); g.stroke(); }
        g.restore();
        return [px + 16 * s, py + (gripping ? -46 * s : -34 * s)];
      }
      function drawLeash(g, hand) {
        const dx0 = hand[0], dy0 = hand[1];
        const dx1 = wx(dog.x) - 14, dy1 = wy(dog.y) - 22 * (PX / 46);
        const dist = Math.hypot(dog.x - kid.x, dog.y - kid.y);
        const slackFrac = Math.max(0, 1 - dist / Math.max(L, 0.01));
        const sag = slackFrac * 70;
        const tight = taut > 0.01 || tautGlow > 0.2;
        /* glow under a taut rope */
        if (tight) {
          g.strokeStyle = 'rgba(255,238,194,' + (0.25 + 0.45 * Math.min(1, tautGlow)) + ')';
          g.lineWidth = 7; g.lineCap = 'round';
          g.beginPath(); g.moveTo(dx0, dy0); g.lineTo(dx1, dy1); g.stroke();
        }
        /* the rope itself: 16 verlet-ish points sagging by slack */
        g.strokeStyle = tight ? '#ffeec2' : '#7d8ea3';
        g.lineWidth = tight ? 3 : 2.4;
        g.beginPath();
        for (let i = 0; i <= 16; i++) {
          const u = i / 16;
          const x = dx0 + (dx1 - dx0) * u;
          const y = dy0 + (dy1 - dy0) * u + Math.sin(u * Math.PI) * sag;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.stroke();
        /* the ink rim for the first 1.5s — the rope IS the interactive object */
        if (t < 1.5) {
          const pulse = 0.35 + 0.35 * Math.abs(Math.sin(env.beatPhase() * Math.PI * 2));
          g.strokeStyle = 'rgba(255,243,214,' + pulse * (1 - t / 1.5) + ')';
          g.lineWidth = 8; g.beginPath();
          for (let i = 0; i <= 16; i++) {
            const u = i / 16;
            const x = dx0 + (dx1 - dx0) * u;
            const y = dy0 + (dy1 - dy0) * u + Math.sin(u * Math.PI) * sag;
            i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
          }
          g.stroke();
        }
      }

      function render(g) {
        if (!G) grads(g);
        /* camera: hold the pair in frame, bias ahead of the kid */
        const tx = (kid.x + dog.x) / 2 - 0.6, ty = Math.max(0, (kid.y + dog.y) / 2);
        camX += (tx - camX) * 0.16; camY += (ty - camY) * 0.12;
        g.save();
        if (shake > 0.01) g.translate((env.rng() - 0.5) * shake * 9, (env.rng() - 0.5) * shake * 9);
        if (zoom > 0.01) { g.translate(W / 2, H / 2); g.scale(1 + zoom * 0.05, 1 + zoom * 0.05); g.translate(-W / 2, -H / 2); }

        g.fillStyle = G.sky; g.fillRect(-20, -20, W + 40, H + 40);
        /* the low sun */
        g.fillStyle = '#ffeec2';
        g.beginPath(); g.arc(W * 0.72, H * 0.30, 34, 0, Math.PI * 2); g.fill();
        g.fillStyle = G.sun; g.fillRect(-20, -20, W + 40, H + 40);
        band(g, '#a9bccb', 74, 26, 0.6, 0.010);
        band(g, '#7d8ea3', 40, 20, 2.2, 0.026);
        band(g, '#4e5a6b', 14, 13, 4.1, 0.055);
        deck(g);
        drawLeash(g, drawKidReturn(g));
        for (const p of parts) {
          const a = 1 - p.t / p.life;
          g.fillStyle = p.c === '#ffeec2' ? 'rgba(255,238,194,' + a + ')' : 'rgba(78,90,107,' + a + ')';
          g.fillRect(wx(p.x) - 2, wy(p.y) - 2, 4, 4);
        }
        g.restore();
        if (flash > 0.01) { g.fillStyle = 'rgba(255,238,194,' + flash * 0.5 + ')'; g.fillRect(0, 0, W, H); }
        /* the joy line, donor register */
        if (done === 'won' && joy > 0.15) {
          g.textAlign = 'center'; g.font = '600 20px Georgia,"Times New Roman",serif';
          g.fillStyle = 'rgba(255,238,194,' + Math.min(1, joy * 3) + ')';
          g.fillText('good dog.', W / 2, H * 0.20);
        }
      }
      /* draw kid first (returns the hand anchor) but keep the dog above the rope */
      function drawKidReturn(g) { const hand = drawKid(g); drawDog(g); return hand; }

      /* =============================== HOOKS ================================ */
      const LINES = {
        held: 'GOOD DOG. BAD HAND.',
        never: 'YOU NEVER TOOK THE ROPE.',
        fell: 'THE VIADUCT KEPT YOU.',
        timeout: 'THE GAP IS STILL THERE.',
      };
      return {
        step, render,
        result: () => done,
        timeout: () => (done === 'pending' ? 'lost' : done),
        line: () => LINES[why] || LINES.timeout,
        hint: () => {
          if (done !== 'pending') return { type: 'wait', ms: 120 };
          const toLip = GAP_X - dog.x;
          /* let go with rope to spare: payout needs (4.32-1.45)/9.5 = 0.30 s */
          if (toLip < 2.6 || L > LEAP_GATE) return { type: 'up' };
          return { type: 'down', x: 195, y: 620 };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - Holding on the pitch tows the kid up it; releasing on the pitch slides him back
     (traction = 1 - slipping*0.97, slipping = clamp((|slope|-0.30)/0.28,0,1)).
   - The dog leaps ONLY when leash L > 4.32 m and dog.vx > 4 at the lip; releasing takes
     (4.32-1.45)/9.5 = 0.30 s of pay-out, so the release must precede the lip by ~0.3 s.
   - Still gripped at the lip: dog.vx *= 0.12 (balk), he is dragged into the span, 'lost'
     with 'GOOD DOG. BAD HAND.'
   - Dog landing past gapEnd resolves 'won' inside 100 ms (hitstop 0.10, shake, 24 sun
     particles, warm 0-4-7-12 chord) — unmistakable.
   - The rope reads its own state with no text: slack = grey and sagging, taut = cream and
     straight with a glow; the hand OPENS (hollow circle + arc) the instant you let go.
   BUG-IS-GAME (do not fix):
   - Gripping SLOWS the dog and shortens his reach to 1.45 m. That is the point of the game,
     not a bug: the same hand that makes the climb possible makes the jump impossible.
   - The kid's ground speed clamp does not apply while airborne, so a taut rope can sling him
     faster than his own top speed. Donor behaviour (leash._solve clamps only when onGround).
   - There is no jump button and no way to help the dog. You only open or close one hand.
*/

/* ===== carts/20-duck.js ===== */
/* FAR ENOUGH — DUCK POND PATROL · "DON'T LET GO!" · the rescue atom.
   Physics constants are byte-faithful to the release build's PHYSICS_PRESERVATION
   (tether rest/max, spring force, hard-max split, rescue lift + catch). Duck art per
   Alex's canon-skin ruling; the donor's own runners are abstract silhouettes. */
(function () {
  registerGame({
    id: 'duck', title: 'DUCK POND PATROL', command: "DON'T LET GO!", family: 'hold', slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H;
      const D = env.difficulty | 0;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

      /* ---------- donor constants — DO NOT RETUNE ---------- */
      const REST = 205, MAX = 430;
      const GRAV = 1780, TERMINAL = 1050;
      const R = 17;
      const LEDGE_Y = 600, WATER_Y = 912;
      const CATCH_Y = 755, CATCH_VY = -520, CATCH_CD = 0.78;
      const LIFT = 3000;

      /* ---------- bodies: A = anchor (cyan), B = falling (gold) ---------- */
      const A = { x: 96, y: LEDGE_Y - R, vx: 0, vy: 0, grounded: true, sq: 0, st: 0, trail: [] };
      const B = { x: 172, y: LEDGE_Y - R - 2, vx: 34 + D * 10, vy: -40, grounded: false, sq: 0, st: 0, trail: [], catchCd: 0 };
      let held = false, everHeld = false, caught = false, catches = 0;
      let phase = 'slip';                 // slip -> fall -> swing -> safe
      let t = 0, done = 'pending', why = 'dropped';
      let tension = 0, glow = 0, splash = 0, shake = 0, flash = 0, hitstop = 0;
      const parts = [];
      let camY = 700;
      const S = 1.42;

      /* heron silhouette (diff 2 distraction only — never touches physics) */
      const heron = D >= 2 ? { x: -140, y: 430, t: 0 } : null;

      const AU = env.audio;
      const sGrab = () => { AU.tone({ f: 220, f2: 330, type: 'triangle', dur: 0.1, vol: 0.26 }); AU.noise({ dur: 0.05, hp: 1200, vol: 0.12 }); };
      const sSlip = () => AU.tone({ f: 500, f2: 240, type: 'sine', dur: 0.22, vol: 0.18 });
      const sStrain = () => AU.tone({ f: 120 + tension * 90, type: 'sawtooth', dur: 0.1, vol: 0.06 + tension * 0.05 });
      const sCatch = () => {
        AU.noise({ dur: 0.14, hp: 600, vol: 0.24 });
        [0, 7, 12].forEach((s, i) => AU.tone({ t: i * 0.04, f: 330 * Math.pow(2, s / 12), type: 'triangle', dur: 0.34, vol: 0.17 }));
      };
      const sSafe = () => [0, 4, 7, 12, 16].forEach((s, i) =>
        AU.tone({ t: i * 0.055, f: 262 * Math.pow(2, s / 12), type: 'triangle', dur: 0.42, vol: 0.16 }));
      const sSplash = () => { AU.noise({ dur: 0.5, lp: 1100, vol: 0.34 }); AU.tone({ f: 180, f2: 70, type: 'sine', dur: 0.4, vol: 0.2 }); };
      const sQuack = () => { AU.tone({ f: 420, f2: 300, type: 'sawtooth', dur: 0.12, vol: 0.16 }); };

      function burst(x, y, n, col, spd) {
        for (let i = 0; i < n && parts.length < 100; i++) {
          const a = env.rng() * Math.PI * 2, s = spd * (0.3 + env.rng());
          parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40, life: 0.4 + env.rng() * 0.5, t: 0, c: col });
        }
      }

      /* ---------- the tether, exactly as the release build solves it ---------- */
      function applyTether(dt) {
        let dx = B.x - A.x, dy = B.y - A.y;
        let d = Math.hypot(dx, dy) || 0.0001;
        if (d > REST) {
          const nx = dx / d, ny = dy / d;
          const rel = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          const stretch = d - REST;
          let force = stretch * 10.5 + rel * 1.25;
          force = clamp(force, -400, 2700);
          /* the anchor is planted: it takes the load but does not get yanked off */
          const aScale = A.grounded ? 0.06 : 1;
          A.vx += nx * force * dt * aScale; A.vy += ny * force * dt * aScale;
          B.vx -= nx * force * dt; B.vy -= ny * force * dt;
        }
        dx = B.x - A.x; dy = B.y - A.y; d = Math.hypot(dx, dy) || 0.0001;
        if (d > MAX) {
          const over = d - MAX, nx = dx / d, ny = dy / d, half = over * 0.5;
          if (!A.grounded) { A.x += nx * half; A.y += ny * half; B.x -= nx * half; B.y -= ny * half; }
          else { B.x -= nx * over; B.y -= ny * over; }
          const rel = (B.vx - A.vx) * nx + (B.vy - A.vy) * ny;
          if (rel > 0) {
            const imp = rel * 0.55;
            if (!A.grounded) { A.vx += nx * imp; A.vy += ny * imp; }
            B.vx -= nx * imp; B.vy -= ny * imp;
          }
        }
      }

      /* =============================== STEP =============================== */
      function step(dt, inp) {
        t += dt;
        if (hitstop > 0) { hitstop -= dt; return; }
        shake = Math.max(0, shake - dt * 3.2);
        flash = Math.max(0, flash - dt * 3);
        splash = Math.max(0, splash - dt * 1.4);
        glow = Math.max(0, glow - dt * 2.2);
        if (heron) heron.x += 150 * dt;
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt;
          if (p.t > p.life) parts.splice(i, 1);
        }
        A.sq *= Math.pow(0.02, dt); B.sq *= Math.pow(0.02, dt);
        if (B.catchCd > 0) B.catchCd -= dt;

        const was = held;
        held = inp.down;
        if (held && !was) { everHeld = true; sGrab(); glow = 1; }
        if (!held && was && phase !== 'safe') sSlip();

        if (done !== 'pending') { settle(dt); return; }

        if (phase === 'slip') {
          B.vy += GRAV * 0.35 * dt;
          B.y += B.vy * dt; B.x += B.vx * dt;
          if (B.y - A.y > 60) { phase = 'fall'; sQuack(); }
        } else {
          /* gravity on the falling duck */
          B.vy = Math.min(TERMINAL, B.vy + GRAV * dt);

          /* THE RESCUE — only while the hand is closed */
          const d = Math.hypot(B.x - A.x, B.y - A.y);
          const inWindow = B.y > 720 && A.y < 650 && (B.y - A.y) > 105 && d > REST * 1.22;
          if (held) {
            applyTether(dt); applyTether(dt);                 // called TWICE per step (donor)
            if (inWindow) {
              B.vy -= LIFT * dt;
              B.vx += (A.x - B.x) * 1.8 * dt;
              glow = 1;
              if (env.rng() < 0.25) sStrain();
            }
            /* the catch: the fall becomes a swing-up */
            if (B.y > CATCH_Y && A.grounded && B.catchCd <= 0) {
              B.catchCd = CATCH_CD;
              B.vy = Math.min(B.vy, CATCH_VY);
              B.vx += (A.x - B.x) * 1.35;
              caught = true; catches++;
              if (phase !== 'swing') { phase = 'swing'; sCatch(); shake = 0.8; hitstop = 0.06; }
              burst(B.x, B.y, 14, '#efffff', 260);
              B.sq = 1;
            }
          }
          B.x += B.vx * dt; B.y += B.vy * dt;

          /* home: back on the ledge, on her feet */
          if (phase === 'swing' && B.vy > -40 && B.y < LEDGE_Y - R + 6 && B.y > LEDGE_Y - R - 90 && B.x < 150) {
            B.y = LEDGE_Y - R; B.vy = 0; B.vx *= 0.3; B.grounded = true;
            phase = 'safe'; done = 'won'; why = 'safe';
            sSafe(); burst(B.x, B.y, 22, '#ffd56b', 300); shake = 0.5; flash = 0.5; B.sq = 1;
          }
          /* the water */
          if (B.y > WATER_Y && env.armed()) {
            done = 'lost'; why = everHeld ? 'dropped' : 'never';
            sSplash(); splash = 1; shake = 1; flash = 0.25;
            burst(B.x, WATER_Y, 24, '#8fe9ff', 220);
          }
        }
        /* trails */
        if (t % 0.02 < dt) {
          A.trail.push({ x: A.x, y: A.y }); if (A.trail.length > 9) A.trail.shift();
          B.trail.push({ x: B.x, y: B.y }); if (B.trail.length > 9) B.trail.shift();
        }
        tension = clamp((Math.hypot(B.x - A.x, B.y - A.y) - REST) / (MAX - REST), 0, 1);
      }
      function settle(dt) {
        if (why === 'dropped' || why === 'never') { B.vy = Math.min(TERMINAL, B.vy + GRAV * dt); B.y += B.vy * dt * 0.25; }
      }

      /* ============================== RENDER ============================== */
      let G = null;
      function grads(g) {
        G = {};
        G.sky = g.createLinearGradient(0, 0, 0, H);
        G.sky.addColorStop(0, '#050816'); G.sky.addColorStop(0.52, '#0b1330'); G.sky.addColorStop(1, '#131a3c');
        G.water = g.createLinearGradient(0, 0, 0, 200);
        G.water.addColorStop(0, 'rgba(60,110,160,0.55)'); G.water.addColorStop(1, 'rgba(8,14,34,0.9)');
      }
      const sx = (x) => (x - 130) * S + W * 0.5;
      const sy = (y) => (y - camY) * S + H * 0.46;

      function duck(g, b, col, dark, facing) {
        const px = sx(b.x), py = sy(b.y), r = R * S;
        for (let i = 0; i < b.trail.length; i++) {
          const p = b.trail[i], a = (i / b.trail.length) * 0.09;
          g.fillStyle = col; g.globalAlpha = a;
          g.beginPath(); g.arc(sx(p.x), sy(p.y), r * (0.45 + 0.5 * i / b.trail.length), 0, Math.PI * 2); g.fill();
        }
        g.globalAlpha = 1;
        g.save(); g.translate(px, py);
        g.rotate(clamp(b.vx / 1100, -0.22, 0.22));
        const sqv = Math.min(1, b.sq), sxs = 1 + sqv * 0.26, sys = 1 - sqv * 0.28;
        g.scale(sxs * facing, sys);
        /* body */
        g.fillStyle = col;
        g.beginPath(); g.ellipse(0, 0, r * 1.05, r * 0.92, 0, 0, Math.PI * 2); g.fill();
        /* tail */
        g.beginPath(); g.moveTo(-r * 0.9, -r * 0.1); g.lineTo(-r * 1.7, -r * 0.55); g.lineTo(-r * 0.8, r * 0.35); g.closePath(); g.fill();
        /* head + neck */
        g.beginPath(); g.ellipse(r * 0.72, -r * 0.92, r * 0.52, r * 0.55, 0, 0, Math.PI * 2); g.fill();
        g.fillRect(r * 0.28, -r * 0.95, r * 0.7, r * 0.9);
        /* bill */
        g.fillStyle = '#ffb14d';
        g.beginPath(); g.ellipse(r * 1.28, -r * 0.82, r * 0.42, r * 0.19, 0.08, 0, Math.PI * 2); g.fill();
        /* eye */
        g.fillStyle = '#0c1020';
        g.beginPath(); g.arc(r * 0.86, -r * 1.02, r * 0.13, 0, Math.PI * 2); g.fill();
        /* wing */
        g.fillStyle = dark; g.globalAlpha = 0.5;
        g.beginPath(); g.ellipse(-r * 0.12, r * 0.06, r * 0.62, r * 0.4, -0.2, 0, Math.PI * 2); g.fill();
        g.globalAlpha = 1;
        g.restore();
      }

      function render(g) {
        if (!G) grads(g);
        /* camera keeps the pair readable, biased so the action sits in the top 2/3 */
        const mid = (A.y + B.y) / 2;
        camY += (clamp(mid + 40, 640, 800) - camY) * 0.10;

        g.save();
        if (shake > 0.01) g.translate((env.rng() - 0.5) * shake * 10, (env.rng() - 0.5) * shake * 10);
        g.fillStyle = G.sky; g.fillRect(-20, -20, W + 40, H + 40);

        /* dusk stars */
        for (let i = 0; i < 26; i++) {
          const x = (i * 79) % W, y = ((i * 131) % 260);
          g.fillStyle = i % 4 === 0 ? 'rgba(143,233,255,0.5)' : 'rgba(255,255,255,0.28)';
          g.fillRect(x, y, 1.6, 1.6);
        }
        if (heron) {
          const hx = heron.x, hy = heron.y + Math.sin(t * 2) * 14;
          g.fillStyle = 'rgba(183,71,107,0.55)';
          g.save(); g.translate(sx(hx), sy(hy)); g.scale(1.1, 1.1);
          g.beginPath(); g.ellipse(0, 0, 26, 9, 0, 0, Math.PI * 2); g.fill();
          g.beginPath(); g.moveTo(10, -2); g.lineTo(30, -12); g.lineTo(12, 4); g.closePath(); g.fill();
          g.beginPath(); g.moveTo(-6, -4); g.lineTo(6, -26 + Math.sin(t * 9) * 8); g.lineTo(14, -3); g.closePath(); g.fill();
          g.restore();
        }

        /* the water */
        const wy = sy(WATER_Y);
        g.fillStyle = G.water; g.save(); g.translate(0, wy); g.fillRect(-20, 0, W + 40, H); g.restore();
        g.strokeStyle = 'rgba(143,233,255,0.35)'; g.lineWidth = 2;
        g.beginPath();
        for (let x = -10; x <= W + 10; x += 12) {
          const yy = wy + Math.sin(x * 0.05 + t * 1.6) * 3 + splash * Math.sin(x * 0.2 - t * 9) * 6;
          x === -10 ? g.moveTo(x, yy) : g.lineTo(x, yy);
        }
        g.stroke();
        for (let i = 0; i < 3; i++) {
          g.strokeStyle = 'rgba(143,233,255,' + (0.16 - i * 0.045) + ')';
          g.beginPath();
          for (let x = -10; x <= W + 10; x += 14) g.lineTo(x, wy + 26 + i * 22 + Math.sin(x * 0.04 + t * (1.1 + i * 0.3)) * 4);
          g.stroke();
        }

        /* the ledge + reeds */
        const ly = sy(LEDGE_Y);
        g.fillStyle = '#101a33';
        g.beginPath(); g.moveTo(-20, ly); g.lineTo(sx(150), ly); g.lineTo(sx(150) - 10, H + 20); g.lineTo(-20, H + 20); g.closePath(); g.fill();
        g.fillStyle = '#1d2c50'; g.fillRect(-20, ly - 5, sx(150) + 20, 5);
        g.strokeStyle = '#2b6b52'; g.lineWidth = 3; g.lineCap = 'round';
        for (let i = 0; i < 7; i++) {
          const rx = -10 + i * 17, sway = Math.sin(t * 1.3 + i) * 5;
          g.beginPath(); g.moveTo(rx, ly); g.quadraticCurveTo(rx + sway, ly - 34, rx + sway * 1.7, ly - 62); g.stroke();
          g.fillStyle = '#4a3a24';
          g.beginPath(); g.ellipse(rx + sway * 1.7, ly - 66, 3.4, 8, 0, 0, Math.PI * 2); g.fill();
        }

        /* THE TETHER — the whole read: taut+bright while held, dead grey when open */
        const ax = sx(A.x), ay = sy(A.y), bx = sx(B.x), by = sy(B.y);
        const slack = held ? 0 : 46;
        if (held) {
          g.strokeStyle = 'rgba(216,255,255,' + (0.2 + 0.5 * Math.max(tension, glow)) + ')';
          g.lineWidth = 9 + tension * 5; g.lineCap = 'round';
          g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
        }
        g.strokeStyle = held ? '#f8ffff' : '#6b6e82';
        g.lineWidth = held ? 3.4 : 2.2;
        g.beginPath();
        for (let i = 0; i <= 14; i++) {
          const u = i / 14, x = ax + (bx - ax) * u, y = ay + (by - ay) * u + Math.sin(u * Math.PI) * slack;
          i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.stroke();
        /* energy beads along a straining line */
        if (held && tension > 0.12) {
          for (let i = 0; i < 5; i++) {
            const u = ((t * 1.4 + i / 5) % 1);
            g.fillStyle = 'rgba(232,255,255,' + (0.8 * tension) + ')';
            g.beginPath(); g.arc(ax + (bx - ax) * u, ay + (by - ay) * u, 2.6, 0, Math.PI * 2); g.fill();
          }
        }
        /* ink rim on the line for the first 1.5 s — the line IS the verb */
        if (t < 1.5) {
          const pulse = (0.4 + 0.35 * Math.abs(Math.sin(env.beatPhase() * Math.PI * 2))) * (1 - t / 1.5);
          g.strokeStyle = 'rgba(255,243,214,' + pulse + ')';
          g.lineWidth = 11; g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
        }

        duck(g, A, '#8fe9ff', '#2a6f8f', 1);
        duck(g, B, '#ffd56b', '#8f6a1e', B.vx < -6 ? -1 : 1);

        for (const p of parts) {
          const a = 1 - p.t / p.life;
          g.fillStyle = p.c === '#efffff' ? 'rgba(239,255,255,' + a + ')'
            : p.c === '#ffd56b' ? 'rgba(255,213,107,' + a + ')' : 'rgba(143,233,255,' + a + ')';
          g.fillRect(sx(p.x) - 2, sy(p.y) - 2, 4, 4);
        }
        g.restore();
        if (flash > 0.01) { g.fillStyle = 'rgba(248,255,255,' + flash * 0.4 + ')'; g.fillRect(0, 0, W, H); }
        if (done === 'won') {
          g.textAlign = 'center'; g.font = '700 20px "Segoe UI",system-ui,sans-serif';
          g.fillStyle = 'rgba(255,213,107,0.95)';
          g.fillText('both of you.', W / 2, H * 0.17);
        }
      }

      const LINES = { dropped: 'THE POND KEPT HER.', never: 'YOU NEVER TOOK THE LINE.', safe: '' };
      return {
        step, render,
        result: () => done,
        /* you did not let go — that is the whole ask */
        timeout: () => (done !== 'pending' ? done : (held && B.y < WATER_Y ? 'won' : 'lost')),
        line: () => LINES[why] || LINES.dropped,
        hint: () => (done !== 'pending' ? { type: 'wait', ms: 120 } : { type: 'down', x: 195, y: 640 }),
      };
    },
  });
})();

/* DONE-CRITERIA
   - Holding through the fall triggers the donor rescue window verbatim
     (B.y>720 && A.y<650 && B.y-A.y>105 && d>205*1.22) applying lift 3000*dt and
     B.vx += (A.x-B.x)*1.8*dt.
   - The catch fires at B.y>755 with A grounded and catchCd<=0: vy clamped to -520,
     vx += (A.x-B.x)*1.35, cooldown 0.78 s — the fall becomes a swing-up in one frame.
   - Releasing at any point kills the tether: she free-falls past y=912 and the round is
     lost with a splash inside 300 ms.
   - Landing back on the ledge resolves 'won' with a 5-note rise and 'both of you.'
   - applyTether runs TWICE per step and only pulls when d>205 (rest); over 430 the hard
     max splits positionally with a rel*0.55 damping impulse.
   BUG-IS-GAME (do not fix):
   - The abandoned/inactive body keeps full physics and its momentum — "orchestration, not
     teleportation". Never snap a duck to a position.
   - The spring only acts beyond REST (205): inside that distance the line is genuinely
     dead and the duck free-falls. That dead zone is why the rescue feels late and earned.
   - The anchor is deliberately planted while grounded (takes 6% of the load) so the pond
     cannot drag her in. Removing that makes the rescue unwinnable, not "more physical".
*/

/* ===== carts/21-party.js ===== */
/* PARTY ANIMAL — the piñata fights back; tonight it doesn't get to */
(function () {
  const TAU = Math.PI * 2;
  const PAL = { ink: '#241a20', pink: '#ff5da2', head: '#ff7ac0', muzzle: '#ff9acb',
    mint: '#5fdcb8', butter: '#ffd666', sky: '#7ec8f2', grape: '#9a7bf0',
    red: '#ff4d6d', white: '#fffdf7' };
  const NEON = { magenta: '#ff3ccf', cyan: '#24d8ff', violet: '#8f5cff', amber: '#ffb13b',
    white: '#fff9ff', floor0: '#101a31', floor1: '#14213a' };
  const FRINGE = [PAL.pink, PAL.mint, PAL.butter, PAL.sky];
  const CONF = [PAL.pink, PAL.mint, PAL.butter, PAL.sky, PAL.grape, PAL.white];
  const TIERS = ['FLAT', 'FIZZY', 'FROSTED', 'GLAZED', 'SUGAR RUSH'];
  const COMBO_WORDS = { 3: 'SWEET', 6: 'RICH', 10: 'DECADENT', 15: 'SUGARBLIND' };
  const LADDER = [65, 67, 69, 72, 74, 77, 79, 81, 84]; // donor tom pitch ladder (MIDI)
  const ATK_CD = 0.26, SWING_T = 0.11;                  // donor P.atkCd / P.swingT
  const midi = (n) => 440 * Math.pow(2, (n - 69) / 12);
  function hexRGB(c) { const v = parseInt(c.slice(1), 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
  function rgba(c, a) { const r = hexRGB(c); return 'rgba(' + r[0] + ',' + r[1] + ',' + r[2] + ',' + a + ')'; }
  function mixWhite(c, k) { const r = hexRGB(c);
    return 'rgb(' + Math.round(r[0] + (255 - r[0]) * k) + ',' + Math.round(r[1] + (253 - r[1]) * k) + ',' + Math.round(r[2] + (247 - r[2]) * k) + ')'; }
  function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

  registerGame({
    id: 'party', title: 'PARTY ANIMAL', command: 'WAIL!', family: 'mash', slotBeats: 6,
    create(env) {
      const W = env.W, H = env.H, rng = env.rng;
      const PX = 195, PY = 346, SC = 2.2;         // hang point, center-upper (top 2/3)
      // hits-to-burst: 8/11/14 by difficulty, clamped so a hold-from-armed mash can win
      // (swing cadence is hard-capped at 0.26s; slot length rides the global bpm ramp)
      const playT = 7 * env.beatLen();            // count-in beat + 6 slot beats
      const hpMax = Math.min([8, 11, 14][env.difficulty] || 8,
        Math.max(4, Math.floor(playT / ATK_CD) - 2));
      let hp = hpMax, state = 'pending';
      let t = 0, worldT = 0;
      let atkCd = 0, swingT = 0, swingSide = 1, aim = 0;
      let combo = 0, hitFlash = 0, knockX = 0, knockY = 0;
      let stopT = 0, shake = 0, sx = 0, sy = 0, flashT = 0, wonT = -1;
      const parts = [], pops = [], litter = [], candy = [];
      // precomputed crack zigzags (revealed as hp drops)
      const cracks = [];
      for (let c = 0; c < 2; c++) {
        const pts = []; let cx = -16 + rng() * 8, cy = -12;
        for (let i = 0; i < 5; i++) { pts.push([cx, cy]); cx += (rng() - 0.3) * 9; cy += 5 + rng() * 3; }
        cracks.push(pts);
      }

      const dmg = () => (hpMax - hp) / hpMax;
      const tier = () => Math.min(4, Math.floor(dmg() * 5)); // the arrangement IS the health bar

      function q16() { // seconds until the next 16th note — donor qTime(): sfx land ON GRID, late on purpose
        const bl = env.beatLen(), ph = env.beatPhase();
        return Math.max(0.005, (Math.ceil(ph * 4 + 1e-4) / 4 - ph) * bl * 0.25 * 4);
      }
      function sfxHit() {
        const d = q16(), n = LADDER[Math.min(combo - 1, 8)];
        env.audio.tone({ f: midi(n), f2: midi(n - 5), type: 'triangle', dur: 0.14, vol: 0.34, t: d });
        const tr = tier(); // tier layers compressed to per-hit sfx intensity
        if (tr >= 1) env.audio.noise({ dur: 0.06, vol: 0.1, hp: 900, lp: 2600, t: d });
        if (tr >= 2) env.audio.noise({ dur: 0.045, vol: 0.07, hp: 7200, t: d });
        if (tr >= 3) env.audio.tone({ f: midi(53), f2: midi(41), type: 'sawtooth', dur: 0.12, vol: 0.08, t: d });
        if (tr >= 4) { // lead only screams in near-burst — donor scarcity, gated not constant
          env.audio.tone({ f: midi(77) * 0.996, type: 'sawtooth', dur: 0.2, vol: 0.06, t: d });
          env.audio.tone({ f: midi(77) * 1.004, type: 'sawtooth', dur: 0.2, vol: 0.06, t: d });
        }
      }
      function sfxBurst() {
        const d = q16();
        env.audio.noise({ dur: 0.9, vol: 0.3, hp: 5200, t: d });                       // AU.crash
        env.audio.tone({ f: 190, f2: 44, type: 'sine', dur: 0.25, vol: 0.3, t: d });
        env.audio.tone({ f: 120, f2: 30, type: 'sine', dur: 0.34, vol: 0.5 });          // AU.boom
        env.audio.noise({ dur: 0.3, vol: 0.3, lp: 1400 });
      }
      function sfxSealed() { // AU.hurtS + the muffle: the party heard through the floor
        env.audio.tone({ f: 230, f2: 64, type: 'sawtooth', dur: 0.3, vol: 0.22 });
        env.audio.noise({ dur: 0.5, vol: 0.18, lp: 520 });
      }

      function popText(x, y, txt, clr, size) {
        pops.push({ x, y, txt, clr, size: size || 18, life: 0.9, vy: -42 });
      }
      function confetti(x, y, n, burst) {
        for (let i = 0; i < n; i++) {
          const a = rng() * TAU, sp = 60 + rng() * (burst ? 360 : 160);
          parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rng() * 90,
            life: 0.5 + rng() * 0.6, clr: CONF[(rng() * 6) | 0], sz: 3 + rng() * 3,
            rot: rng() * TAU, vr: -8 + rng() * 16 });
          if (parts.length > 120) parts.shift();
        }
      }
      function candyBurst(x, y, n, cs) {
        parts.length = 0; // the money shot gets the whole particle budget (cap 120)
        for (let i = 0; i < n; i++) {
          const a = rng() * TAU, sp = 120 + rng() * 340;
          parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (40 + rng() * 120),
            life: 0.8 + rng() * 0.8, clr: cs[(rng() * cs.length) | 0], sz: 3 + rng() * 4,
            rot: rng() * TAU, vr: -10 + rng() * 20 });
        }
      }
      function dropCandy(x, y, n) {
        for (let i = 0; i < n; i++) {
          const a = rng() * TAU;
          candy.push({ x: x + Math.cos(a) * (6 + rng() * 20), y: y + Math.sin(a) * (6 + rng() * 20),
            vx: Math.cos(a) * (30 + rng() * 80), vy: Math.sin(a) * (30 + rng() * 80) + 60,
            clr: CONF[(rng() * 6) | 0], bob: rng() * TAU });
        }
      }
      function stampFloor(x, y) { // permanent litter — the room gets trashed
        const n = 9 + ((rng() * 7) | 0);
        for (let i = 0; i < n; i++) {
          litter.push({ x: x + (rng() - 0.5) * 90, y: y + (rng() - 0.5) * 60,
            rot: rng() * TAU, a: 0.5 + rng() * 0.35, clr: CONF[(rng() * 6) | 0] });
        }
      }

      function doSwing() {
        atkCd = ATK_CD; swingT = SWING_T; swingSide = -swingSide;
        aim = (swingSide > 0 ? 0 : Math.PI) + (rng() - 0.5) * 0.35;
        combo++; hp--;
        hitFlash = 0.14;
        knockX = Math.cos(aim) * 16; knockY = Math.sin(aim) * 16 - 4; // teleport knock, donor-crunchy
        confetti(PX, PY - 20, 8, false);
        stopT = Math.max(stopT, 0.045); shake = Math.max(shake, 3);
        sfxHit();
        if (COMBO_WORDS[combo]) popText(PX, PY - 130, COMBO_WORDS[combo], PAL.pink, 24);
        else if (combo >= 3) popText(PX + swingSide * 44, PY - 96, 'x' + combo, PAL.white, 15);
        if (hp <= 0) {
          state = 'won'; wonT = 0;
          candyBurst(PX, PY - 10, 120, FRINGE);   // ENDSWING burst verbatim
          dropCandy(PX, PY, 10);
          stampFloor(PX, 560);
          stopT = 0.22; shake = 18; flashT = 0.1;
          sfxBurst();
          popText(PX, PY - 150, 'HAPPY BIRTHDAY.', PAL.butter, 26);
        }
      }

      // ---------- drawing ----------
      function drawRoom(g) {
        const grd = g.createLinearGradient(0, 0, 0, H);
        grd.addColorStop(0, '#090611'); grd.addColorStop(0.35, '#160b27'); grd.addColorStop(1, '#070711');
        g.fillStyle = grd; g.fillRect(0, 0, W, H);
        g.fillStyle = '#100a1d'; g.fillRect(0, 0, W, 176); // wall band
        g.fillStyle = '#1d0b2c';
        for (let i = 0; i < 4; i++) g.fillRect(14 + i * 96, 12, 64, 156);
        // checker floor
        const fx = 16, fy = 234, fw = W - 32, fh = 456;
        g.save(); rr(g, fx, fy, fw, fh, 10); g.clip();
        for (let iy = 0; iy < 10; iy++) for (let ix = 0; ix < 8; ix++) {
          g.fillStyle = (ix + iy) % 2 ? NEON.floor1 : NEON.floor0;
          g.fillRect(fx + ix * 48, fy + iy * 48, 48, 48);
        }
        g.strokeStyle = 'rgba(101,151,220,.11)'; g.lineWidth = 1; g.beginPath();
        for (let ix = 1; ix < 8; ix++) { g.moveTo(fx + ix * 48, fy); g.lineTo(fx + ix * 48, fy + fh); }
        for (let iy = 1; iy < 10; iy++) { g.moveTo(fx, fy + iy * 48); g.lineTo(fx + fw, fy + iy * 48); }
        g.stroke();
        // permanent confetti litter
        for (let i = 0; i < litter.length; i++) {
          const l = litter[i];
          g.save(); g.translate(l.x, l.y); g.rotate(l.rot); g.globalAlpha = l.a;
          g.fillStyle = l.clr; g.fillRect(-3, -1.6, 6, 3.2); g.restore();
        }
        g.restore();
        g.strokeStyle = NEON.violet; g.lineWidth = 4; rr(g, fx, fy, fw, fh, 10); g.stroke();
        g.strokeStyle = rgba(NEON.cyan, 0.5); g.lineWidth = 1; rr(g, fx + 5, fy + 5, fw - 10, fh - 10, 7); g.stroke();
        // marquee side dots (fake glow: soft disc under crisp dot), light chase
        const head = Math.floor(worldT * 8) % 22;
        for (let i = 0; i < 22; i++) {
          const y = 20 + i * 74 % (H - 24), col = i % 2 ? NEON.cyan : NEON.magenta;
          const on = (i === head || i === (head + 11) % 22) ? 1 : 0.45;
          for (const dx of [7, W - 7]) {
            g.fillStyle = rgba(col, 0.16 * on); g.beginPath(); g.arc(dx, y, 8, 0, TAU); g.fill();
            g.fillStyle = rgba(col, 0.9 * on); g.beginPath(); g.arc(dx, y, 3, 0, TAU); g.fill();
          }
        }
        // sagging string bulbs
        g.strokeStyle = 'rgba(8,5,14,.85)'; g.lineWidth = 2;
        g.beginPath(); g.moveTo(0, 40); g.quadraticCurveTo(W / 2, 76, W, 40); g.stroke();
        const bulbCols = [NEON.magenta, NEON.cyan, NEON.amber, NEON.violet];
        for (let i = 0; i < 11; i++) {
          const x = i * (W / 10), y = 40 + Math.sin(i * Math.PI / 10) * 27;
          const c = bulbCols[i % 4], a = 0.6 + 0.4 * Math.abs(Math.sin(worldT * 3 + i));
          g.fillStyle = rgba(c, 0.22 * a); g.beginPath(); g.arc(x, y + 6, 9, 0, TAU); g.fill();
          g.fillStyle = rgba(c, a); g.beginPath(); g.arc(x, y + 6, 4, 0, TAU); g.fill();
        }
        // disco ball
        g.strokeStyle = 'rgba(8,5,14,.85)'; g.beginPath(); g.moveTo(322, 0); g.lineTo(322, 66); g.stroke();
        g.fillStyle = rgba(NEON.violet, 0.25); g.beginPath(); g.arc(322, 82, 22, 0, TAU); g.fill();
        g.fillStyle = NEON.violet; g.beginPath(); g.arc(322, 82, 15, 0, TAU); g.fill();
        g.strokeStyle = rgba(NEON.white, 0.55); g.lineWidth = 1;
        g.save(); g.beginPath(); g.arc(322, 82, 15, 0, TAU); g.clip();
        g.beginPath();
        for (let i = -1; i <= 1; i++) { g.moveTo(307, 82 + i * 7); g.lineTo(337, 82 + i * 7); }
        for (let i = -1; i <= 1; i++) g.ellipse(322, 82, 5 + Math.abs(i) * 6, 15, 0, 0, TAU);
        g.stroke(); g.restore();
        // two rows of bunting, ink-outlined triangles, fluttering
        const rows = [{ y: 108, n: 9, off: 0 }, { y: 140, n: 7, off: 24 }];
        for (const row of rows) {
          const step = (W - row.off * 2) / row.n;
          g.strokeStyle = 'rgba(8,5,14,.85)'; g.lineWidth = 2;
          g.beginPath(); g.moveTo(0, row.y - 8); g.lineTo(W, row.y - 8); g.stroke();
          for (let i = 0; i < row.n; i++) {
            const x = row.off + i * step, fl = Math.sin(i * 1.7 + worldT * 1.3) * 1.5;
            g.fillStyle = CONF[i % 6]; g.strokeStyle = PAL.ink; g.lineWidth = 2;
            g.beginPath(); g.moveTo(x, row.y - 8); g.lineTo(x + step, row.y - 8);
            g.lineTo(x + step / 2, row.y + 16 + fl); g.closePath(); g.fill(); g.stroke();
          }
        }
        // pink light pool + contact shadow on the floor under the hang point
        const pool = g.createRadialGradient(PX, 560, 8, PX, 560, 120);
        pool.addColorStop(0, rgba(PAL.pink, 0.16)); pool.addColorStop(1, rgba(PAL.pink, 0));
        g.fillStyle = pool; g.beginPath(); g.ellipse(PX, 560, 120, 62, 0, 0, TAU); g.fill();
        g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.ellipse(PX, 560, 58, 16, 0, 0, TAU); g.fill();
      }

      function drawPinata(g, x, y, wob) {
        const flash = hitFlash > 0, k = dmg() * 0.55;
        g.save(); g.translate(x, y); g.rotate(wob * 0.02); g.scale(SC * 1.14, SC * 1.14);
        const bobA = Math.sin(worldT * 9) * 1.6;
        g.fillStyle = '#17101c';
        for (let i = 0; i < 4; i++) {
          const lx = -15 + i * 9.5;
          rr(g, lx, 8 + ((i % 2 === 0) ? bobA : -bobA) * 0.55, 5, 11, 2); g.fill();
          g.fillStyle = FRINGE[(i + 1) % 4]; g.fillRect(lx, 15, 5, 3); g.fillStyle = '#17101c';
        }
        for (let i = 0; i < 4; i++) { // fringe bands whiten as the shell cracks
          const y0 = -12 + i * 6, c = flash ? PAL.white : mixWhite(FRINGE[i], k);
          const grad = g.createLinearGradient(-22, y0, 22, y0 + 7);
          grad.addColorStop(0, rgba(FRINGE[i], 0.72)); grad.addColorStop(0.48, c); grad.addColorStop(1, rgba(FRINGE[i], 0.74));
          g.fillStyle = grad; rr(g, -22, y0, 44, 7.4, 3); g.fill();
          g.fillStyle = 'rgba(7,5,13,.18)';
          for (let s = 0; s < 8; s++) {
            g.beginPath(); g.moveTo(-21 + s * 5.7, y0 + 5); g.lineTo(-18.2 + s * 5.7, y0 + 9);
            g.lineTo(-15.5 + s * 5.7, y0 + 5); g.closePath(); g.fill();
          }
        }
        g.strokeStyle = '#100b14'; g.lineWidth = 3; rr(g, -22, -12, 44, 25, 7); g.stroke();
        for (let c = 0; c < 2; c++) { // cracks reveal at 1/3 and 2/3 damage
          if (dmg() < (c + 1) / 3) break;
          const pts = cracks[c];
          g.strokeStyle = '#100b14'; g.lineWidth = 1.5; g.beginPath();
          g.moveTo(pts[0][0] + c * 14, pts[0][1]);
          for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] + c * 14, pts[i][1]);
          g.stroke();
        }
        g.strokeStyle = '#100b14'; g.lineWidth = 3;
        g.fillStyle = flash ? PAL.white : PAL.pink; rr(g, 12, -22, 20, 18, 6); g.fill(); g.stroke();
        g.fillStyle = flash ? PAL.white : PAL.head; rr(g, 20, -18, 17, 13, 5); g.fill(); g.stroke();
        g.fillStyle = PAL.butter; g.beginPath(); g.moveTo(15, -21); g.lineTo(18, -32); g.lineTo(25, -21); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = PAL.mint; g.beginPath(); g.moveTo(24, -22); g.lineTo(29, -33); g.lineTo(34, -21); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = PAL.sky; g.beginPath(); g.moveTo(19, -22); g.lineTo(23, -35); g.lineTo(28, -22); g.closePath(); g.fill(); g.stroke();
        g.fillStyle = PAL.muzzle; g.beginPath(); g.ellipse(34, -10, 6, 4, 0, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = NEON.white; g.beginPath(); g.arc(28, -14, 4, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = '#090711'; g.beginPath(); g.arc(29, -14, 2, 0, TAU); g.fill();
        if (combo >= 5) { g.lineWidth = 2.3; g.beginPath(); g.moveTo(23, -20); g.lineTo(31, -18); g.stroke(); }
        g.strokeStyle = PAL.grape; g.lineWidth = 4; g.beginPath();
        g.moveTo(-21, -5); g.quadraticCurveTo(-34, -10 + Math.sin(worldT * 7) * 4, -30, -19); g.stroke();
        g.strokeStyle = PAL.mint; g.lineWidth = 2; g.beginPath();
        g.moveTo(-21, -3); g.quadraticCurveTo(-30, 1, -34, -7); g.stroke();
        g.restore();
      }

      return {
        step(dt, inp) {
          t += dt;
          // shake jitter re-rolls even inside hitstop (donor: draw continues under freeze)
          shake *= Math.pow(0.001, dt);
          if (shake > 0.2) { sx = (rng() * 2 - 1) * shake; sy = (rng() * 2 - 1) * shake; }
          else { sx = 0; sy = 0; }
          if (stopT > 0) { stopT -= dt; return; } // hitstop: world fully frozen
          worldT += dt;
          if (flashT > 0) flashT -= dt;
          if (hitFlash > 0) hitFlash -= dt;
          if (swingT > 0) swingT -= dt;
          if (atkCd > 0) atkCd -= dt;
          if (wonT >= 0) wonT += dt;
          knockX *= Math.pow(0.0005, dt); knockY *= Math.pow(0.0005, dt); // spring back
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.vy += 520 * dt; p.vx *= Math.pow(0.3, dt);
            p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
            if ((p.life -= dt) <= 0) parts.splice(i, 1);
          }
          for (let i = pops.length - 1; i >= 0; i--) {
            const p = pops[i];
            p.vy *= Math.pow(0.1, dt); p.y += p.vy * dt;
            if ((p.life -= dt) <= 0) pops.splice(i, 1);
          }
          for (const c of candy) {
            c.x += c.vx * dt; c.y += c.vy * dt;
            c.vx *= Math.pow(0.05, dt); c.vy *= Math.pow(0.05, dt); c.bob += dt * 6;
          }
          if (state !== 'pending') return;
          // HOLD-to-mash at exactly 0.26s — extra taps between cooldowns do nothing (the rhythm)
          if (inp.down && atkCd <= 0) doSwing();
        },

        render(g) {
          g.save(); g.translate(sx, sy);
          drawRoom(g);
          // candy drops on the floor
          for (const c of candy) {
            const sh = 0.85 + 0.15 * Math.sin(c.bob);
            g.fillStyle = c.clr; g.strokeStyle = PAL.ink; g.lineWidth = 2;
            g.beginPath(); g.ellipse(c.x, c.y, 7 * sh, 5 * sh, c.bob * 0.2, 0, TAU); g.fill(); g.stroke();
            g.fillStyle = rgba(PAL.white, 0.7); g.beginPath(); g.arc(c.x - 2, c.y - 2, 1.6, 0, TAU); g.fill();
          }
          // hang the star: sway (diff2 only), title-pose bob, count-in cake-wobble, knock jolt
          const sway = env.difficulty === 2 ? Math.sin(worldT * 1.6) * 36 : 0;
          const wob = env.armed() ? 0 : Math.sin(worldT * 18) * 2.4 * Math.min(1, worldT / 0.9);
          const bob = Math.sin(worldT * 2.2) * 6;
          const px = PX + sway + knockX + wob, py = PY + bob + knockY;
          g.strokeStyle = PAL.grape; g.lineWidth = 4;
          g.beginPath(); g.moveTo(PX, 62); g.quadraticCurveTo(PX + sway * 0.4, 180, px + 8, py - 88); g.stroke();
          if (state === 'pending' || wonT < 0.3) drawPinata(g, px, py, wob + knockX * 0.4);
          if (env.difficulty === 2 && state === 'pending') { // guest-windup telegraph, decoration only
            g.strokeStyle = rgba(PAL.red, 0.52 + 0.34 * Math.sin(worldT * 26));
            g.lineWidth = 3; g.beginPath(); g.arc(px, py, 108, -0.6, 0.6); g.stroke();
          }
          if (t < 1.5) { // shared marking: cream rim pulse on 8ths, first ~1.5s only
            const p8 = 1 - ((env.beatPhase() * 2) % 1);
            g.strokeStyle = env.ink; g.lineWidth = 3;
            g.globalAlpha = (0.18 + 0.5 * p8) * Math.min(1, (1.5 - t) * 3);
            rr(g, px - 72, py - 100, 174, 148, 26); g.stroke(); g.globalAlpha = 1;
          }
          if (swingT > 0) { // magenta glow arc under crisp white — the donor swing
            const pr = (SWING_T - swingT) / SWING_T;
            g.save(); g.translate(px, py); g.rotate(aim); g.lineCap = 'round';
            g.globalAlpha = (1 - pr) * 0.42; g.strokeStyle = NEON.magenta; g.lineWidth = 26;
            g.shadowColor = NEON.magenta; g.shadowBlur = 20;
            g.beginPath(); g.arc(0, 0, 96, -1.05 + pr * 1.35, 0.52 + pr * 1.35); g.stroke();
            g.globalAlpha = (1 - pr) * 0.95; g.strokeStyle = NEON.white; g.lineWidth = 8;
            g.shadowBlur = 10; g.shadowColor = NEON.white;
            g.beginPath(); g.arc(0, 0, 91, -1.05 + pr * 1.35, 0.52 + pr * 1.35); g.stroke();
            g.shadowBlur = 0; g.restore(); g.globalAlpha = 1;
          }
          for (const p of parts) { // confetti / candy: rotated rects sz x 0.6sz
            g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
            g.globalAlpha = Math.min(1, p.life * 2);
            g.fillStyle = p.clr; g.fillRect(-p.sz / 2, -p.sz * 0.3, p.sz, p.sz * 0.6); g.restore();
          }
          g.globalAlpha = 1; g.textAlign = 'center';
          // combo counter grows over the star
          if (combo >= 2 && state === 'pending') {
            const fs = 15 + Math.min(combo, 12);
            g.font = '900 ' + fs + 'px "Arial Black","Segoe UI Black",sans-serif';
            g.strokeStyle = PAL.ink; g.lineWidth = 4; g.strokeText('x' + combo, px, py - 118);
            g.fillStyle = NEON.white; g.fillText('x' + combo, px, py - 118);
          }
          for (const p of pops) {
            g.font = '900 ' + p.size + 'px "Arial Black","Segoe UI Black",sans-serif';
            g.globalAlpha = Math.min(1, p.life * 1.6);
            g.strokeStyle = PAL.ink; g.lineWidth = 4; g.strokeText(p.txt, p.x, p.y);
            g.fillStyle = p.clr; g.fillText(p.txt, p.x, p.y); g.globalAlpha = 1;
          }
          // tier readout — the arrangement rising is the health bar
          g.font = '700 13px "Segoe UI",system-ui,sans-serif';
          g.fillStyle = tier() >= 4 ? NEON.magenta : rgba(NEON.white, 0.75);
          g.fillText(TIERS[tier()], PX, 210);
          // hits pips (sealed = dark, cracked = butter)
          const pw = Math.min(18, 250 / hpMax);
          for (let i = 0; i < hpMax; i++) {
            const x = PX - ((hpMax - 1) * pw) / 2 + i * pw;
            g.beginPath(); g.arc(x, 486, 5, 0, TAU);
            if (i < hpMax - hp) { g.fillStyle = PAL.butter; g.fill(); }
            else { g.fillStyle = '#17101c'; g.fill(); g.strokeStyle = rgba(env.ink === undefined ? '#fff3d6' : env.ink, 0.4); g.lineWidth = 1.5; g.stroke(); }
          }
          if (state === 'won') {
            g.font = '900 30px "Arial Black","Segoe UI Black",sans-serif';
            g.shadowColor = PAL.butter; g.shadowBlur = 14;
            g.fillStyle = PAL.butter; g.fillText('HAPPY BIRTHDAY.', PX, 206);
            g.shadowBlur = 0;
          }
          if (state === 'lost') { // plum wash, the piñata swings on, intact
            g.fillStyle = 'rgba(36,25,38,0.55)'; g.fillRect(-20, -20, W + 40, H + 40);
            g.font = '900 30px "Arial Black","Segoe UI Black",sans-serif';
            g.fillStyle = env.ink; g.fillText('STILL SEALED.', PX, 380);
          }
          if (flashT > 0) { // donor white flash
            g.fillStyle = 'rgba(255,253,247,' + Math.min(0.85, Math.max(0, flashT * 8)) + ')';
            g.fillRect(-20, -20, W + 40, H + 40);
          }
          g.restore();
        },

        result: () => state,
        timeout() {
          if (state === 'pending') { state = 'lost'; sfxSealed(); }
          return state;
        },
        line: () => 'the piñata wins. it always does.',
        hint() {
          if (state !== 'pending') return { type: 'wait', ms: 200 };
          return { type: 'hold', x: PX, y: PY + 150, ms: 400 }; // holding auto-swings at 0.26s
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - Holding the thumb down swings at exactly 0.26s cadence; N rapid taps within one
     cooldown produce exactly 1 swing (atkCd gate; no click-speed scaling anywhere).
   - Every swing: hp-1, 16px teleport knock + spring-back, 0.14s white hitFlash, 8 confetti,
     0.045s hitstop, shake 3, tom on ladder [65..84] scheduled to the next 16th.
   - hp reaches 0 -> within the same frame: 120-particle FRINGE candyBurst, 10 candy drops,
     floor litter stamp, 0.22s hitstop, shake 18, 0.1s white flash, crash+boom, and
     'HAPPY BIRTHDAY.' in butter — result() flips to 'won' instantly.
   - Slot expiry with hp>0 -> timeout() returns 'lost', plum 0.55 overlay + 'STILL SEALED.'
     in cream, sawtooth 230->64 hurt drop + lowpass-520 muffle thud.
   - Combo words SWEET/RICH/DECADENT pop at exactly 3/6/10 hits (pink, size 24).
   - hits-to-burst = 8/11/14 by difficulty, clamped to floor(slotSeconds/0.26)-2 so a
     hold-from-the-start mash always has >=2 swings of slack at the fastest bpm.
   BUG-IS-GAME (do not fix):
   - The 0.26s rate cap IS the rhythm — do not reward faster tapping.
   - Hit/burst sfx are quantized to the NEXT 16th (up to ~120ms after the visual) — deliberate
     beat-sync, not latency to remove.
   - Knockback teleports position (x += cos*16), no velocity — the crunchy snap is the point.
   - The cream-ink piñata lives inside a neon-dark club; the palette split is the look.
   - The tier-4 lead melody only plays when nearly burst — scarcity kept from the donor.
*/

/* ===== carts/22-sting.js ===== */
/* VELVET KNIFE — a blade rides your fingertip; open the bloom, and touch nothing else */
(function () {
  registerGame({
    id: 'sting',
    title: 'VELVET KNIFE',
    command: 'STING!',
    family: 'drag',
    slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, TAU = Math.PI * 2;
      const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
      /* donor's colour helper — every hue in this cartridge goes through it */
      const hs = (h, s, l, a) => 'hsla(' + h + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';

      /* ---- donor constants, quoted from VELVET_KNIFE-1 source ----------------------
         moveInput(), pointer branch:  k = 1-exp(-16*dt); vx = lerp(vx, dx*11, k); cap 700.
         Inside 3px of the pointer the blade coasts on exp(-12*dt). Position clamps 22..W-22.
         That spring is UNDERDAMPED (x'' + 16x' + 176x = 0, zeta 0.60) — it overshoots ~9%
         of every approach. The overshoot IS the knife's feel; do not critically damp it. */
      const CHASE = 16, PULL = 11, MAX_SPD = 700, SLACK = 3, COAST = 12, WALL = 22;
      /* pulse(): pulseCooldown = .48; ring(player, 8 -> 122, hue 318, .28s, 3px);
         player.pulse = 1 then *= exp(-10*dt), and a petal is caught while
         player.pulse > .055 && d < 116 — a live window of ln(1/.055)/10 = 0.29s. */
      const PULSE_CD = 0.48, PULSE_RING = 122, PULSE_R = 116, PULSE_FADE = 10, PULSE_LIVE = 0.055;
      const BLADE_R = 9;                    // player.r
      const SHARD_R = 13, BLOOM_R = 18;     // enemy r: type 0 shard / type 1 bloom
      const TOUCH = 2;                      // hit test is hypot(...) < e.r + player.r + 2
      const SHARD_TURN = 3;                 // enemy steering lerp: 1 - exp(-3*dt)
      const SPIN_S = 2.1, SPIN_B = 1.3;     // e.spin += dt*(e.type?1.3:2.1)
      const WOB = 6;                        // wob = sin(t*6 + e.spin) * 1.5
      const HUE = 318;                      // the one hot magenta: blade, trail, sparks, petals
      const GOLD = 45;                      // hs(45,100,70) — donor's type-1 core, our cut-mark
      const START_Y = H * 0.62;             // player.y = H*.62 — donor's resting height

      const diff = env.difficulty | 0;
      const NSHARD = [1, 2, 3][diff];       // 1 / 2 / 3 loose shards
      const SHARD_MV = [78, 78, 117][diff]; // donor mv for type 0 is 78; x1.5 = "faster drift"
      const BLOOM_MV = 26;                  // donor's type-1 mv is 55 toward a 190px standoff —
      // that standoff would BACK THE BLOOM AWAY from a blade closing to 116, so it is cut: the
      // bloom hovers instead. Only deliberate deviation from the donor's motion rules.

      /* ---- state ---- */
      let t = 0, bx = W / 2, by = START_Y, vx = 0, vy = 0, tx = W / 2, ty = START_Y;
      let faceX = 0, faceY = -1;            // donor lastMoveX/lastMoveY — the blade's tilt
      let pulseHot = 0, pulseCd = 0;
      let shake = 0, shX = 0, shY = 0, flash = 0, beatPulse = 0, lastPhase = 0, danger = 0;
      let decided = null, announced = 'pending', announceT = 0, failMode = '';
      let vig = null;
      const shards = [], parts = [], sparks = [], rings = [], trail = [];

      /* ---- donor audio recipes on the shell's two primitives ---- */
      // soundPulse: tone(185,.07,'sine',.22) + tone(370,.11,'triangle',.11, detune +7c)
      const sPulse = () => {
        env.audio.tone({ f: 185, type: 'sine', dur: 0.07, vol: 0.19 });
        env.audio.tone({ f: 371.5, type: 'triangle', dur: 0.11, vol: 0.10 }); // 370 @ +7 cents
      };
      // soundKill: tone(110,.13,'sawtooth',.18) + tone(440,.08,'triangle',.12) + noise(.04,.1,2400)
      const sKill = () => {
        env.audio.tone({ f: 110, type: 'sawtooth', dur: 0.13, vol: 0.16 });
        env.audio.tone({ f: 440, type: 'triangle', dur: 0.08, vol: 0.11 });
        env.audio.noise({ dur: 0.04, vol: 0.08, lp: 2400 });
      };
      // soundHit: noise(.15,.3,700) + tone(72,.24,'sawtooth',.25) — the whole game, ended
      const sHit = () => {
        env.audio.noise({ dur: 0.15, vol: 0.15, lp: 700 });
        env.audio.tone({ f: 72, type: 'sawtooth', dur: 0.24, vol: 0.22 });
      };
      const sBeat = () => env.audio.tone({ f: 80, type: 'sine', dur: 0.055, vol: 0.05 }); // soundBeat

      /* ---- fx (donor addParticle / sparkLine / ring, exact spreads) ---- */
      function burst(x, y, h, spd, n) {
        for (let i = 0; i < n && parts.length < 90; i++) {
          const a = env.rng() * TAU, s = (40 + env.rng() * 160) * spd, life = 0.22 + env.rng() * 0.43;
          parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, r: 0.7 + env.rng() * 2.5, h });
        }
      }
      function sparkLine(x, y, h, n) {
        for (let i = 0; i < n && sparks.length < 40; i++) {
          const a = env.rng() * TAU, s = 120 + env.rng() * 300, life = 0.08 + env.rng() * 0.14;
          sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life, max: life, h, len: 5 + env.rng() * 14 });
        }
      }
      function ring(x, y, r0, r1, h, life, width) { rings.push({ x, y, r: r0, r1, life, max: life, h, width }); }

      /* ---- world: one bloom to open, N shards that end you ---- */
      const bloom = {
        x: 78 + env.rng() * (W - 156),      // 78..312 — the whole read sits in the top 2/3
        y: 168 + env.rng() * 210,           // 168..378, always >=145 from the blade's start
        h: 310 + env.rng() * 35,            // donor enemy hue: rnd(345,310)
        spin: env.rng() * TAU, dir: env.rng() * TAU, seed: env.rng() * 9,
      };
      for (let i = 0; i < NSHARD; i++) {
        let x = 0, y = 0;
        for (let k = 0; k < 20; k++) {      // rejection-sample: never spawn in your lap
          x = 46 + env.rng() * (W - 92); y = 110 + env.rng() * 500;
          if (Math.hypot(x - bx, y - by) > 185 && Math.hypot(x - bloom.x, y - bloom.y) > 96 &&
            shards.every((s) => Math.hypot(x - s.x, y - s.y) > 80)) break;
        }
        const a = env.rng() * TAU;
        shards.push({ x, y, vx: Math.cos(a) * SHARD_MV, vy: Math.sin(a) * SHARD_MV, h: 310 + env.rng() * 35, spin: env.rng() * TAU });
      }

      /* ---- verbs ---- */
      function doPulse() {                  // donor pulse(): cooldown-gated, always fires the ring
        if (pulseCd > 0) return;
        pulseHot = 1; pulseCd = PULSE_CD;
        shake = Math.max(shake, 3);
        ring(bx, by, 8, PULSE_RING, HUE, 0.28, 3);
        sPulse();
      }
      function openBloom() {                // donor killEnemy(), dialled up: a reel win must land in 300ms
        decided = 'won'; announceT = 0.26;
        shake = 16; flash = Math.max(flash, 0.5);
        burst(bloom.x, bloom.y, bloom.h, 1.6, 26);
        sparkLine(bloom.x, bloom.y, HUE, 20);
        ring(bloom.x, bloom.y, 4, 52, bloom.h, 0.26, 2);
        ring(bloom.x, bloom.y, 8, 210, HUE, 0.5, 3);
        sKill();
        // the donor's soundCatch voices (320 + n*26 / 640 + n*40) struck at once as one chord
        env.audio.tone({ f: 320, type: 'triangle', dur: 0.22, vol: 0.18 });
        env.audio.tone({ f: 400, type: 'triangle', dur: 0.24, vol: 0.15 });
        env.audio.tone({ f: 480, type: 'triangle', dur: 0.28, vol: 0.13 });
        env.audio.tone({ f: 640, type: 'sine', dur: 0.16, vol: 0.07 });
      }
      function hitBlade(mode) {             // donor hitPlayer(): dead on the spot, no hp bar to consult
        decided = 'lost'; announceT = 0.30; failMode = mode;
        shake = 22; flash = 0.48;
        burst(bx, by, HUE, 1.8, 34);
        sparkLine(bx, by, 0, 28);           // hue 0: the only red in the game, and only at the end
        ring(bx, by, 6, 190, 0, 0.55, 4);
        sHit();
      }

      /* ---- step ---- */
      function step(dt, inp) {
        t += dt;
        const ph = env.beatPhase();
        if (ph < lastPhase) { beatPulse = 1; sBeat(); }   // phase wrapped = the reel's beat landed
        lastPhase = ph;
        beatPulse *= Math.exp(-7 * dt);                   // donor decays its own heartbeat this way
        flash *= Math.exp(-8 * dt);
        shake *= Math.exp(-8 * dt);
        shX = (env.rng() - 0.5) * shake; shY = (env.rng() - 0.5) * shake;
        for (let i = parts.length - 1; i >= 0; i--) {
          const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= Math.exp(-2.2 * dt); p.vy *= Math.exp(-2.2 * dt);
          p.life -= dt; if (p.life <= 0) parts.splice(i, 1);
        }
        for (let i = sparks.length - 1; i >= 0; i--) {
          const s = sparks[i]; s.x += s.vx * dt; s.y += s.vy * dt;
          s.vx *= Math.exp(-5 * dt); s.vy *= Math.exp(-5 * dt);
          s.life -= dt; if (s.life <= 0) sparks.splice(i, 1);
        }
        for (let i = rings.length - 1; i >= 0; i--) {
          const r = rings[i]; r.r += (r.r1 - r.r) * (1 - Math.exp(-10 * dt));
          r.life -= dt; if (r.life <= 0) rings.splice(i, 1);
        }
        for (let i = trail.length - 1; i >= 0; i--) { trail[i].life -= dt; if (trail[i].life <= 0) trail.splice(i, 1); }
        if (decided) { announceT -= dt; if (announceT <= 0) announced = decided; return; }

        const armed = env.armed(), mv = armed ? 1 : 0.5;  // count-in: half drift, nothing can kill
        if (inp.down) { tx = inp.x; ty = inp.y; }         // steer from anywhere on the glass
        if (inp.justDown) doPulse();                      // pointerdown = pulse, exactly as the donor

        // --- donor moveInput(), pointer branch, verbatim ---
        const dx = tx - bx, dy = ty - by, d = Math.hypot(dx, dy);
        if (d > SLACK) {
          const k = 1 - Math.exp(-CHASE * dt), nx = dx / d, ny = dy / d;
          faceX = nx; faceY = ny;
          vx += (dx * PULL - vx) * k; vy += (dy * PULL - vy) * k;
        } else { vx *= Math.exp(-COAST * dt); vy *= Math.exp(-COAST * dt); }
        const sp = Math.hypot(vx, vy);
        if (sp > MAX_SPD) { vx *= MAX_SPD / sp; vy *= MAX_SPD / sp; }
        bx = clamp(bx + vx * dt, WALL, W - WALL);
        by = clamp(by + vy * dt, WALL, H - WALL);
        trail.push({ x: bx, y: by, life: 0.22 });         // donor trail life .22

        pulseCd = Math.max(0, pulseCd - dt);
        pulseHot *= Math.exp(-PULSE_FADE * dt);

        // the bloom hovers and breathes; it never retreats from the blade
        bloom.dir += Math.sin(t * 0.8 + bloom.seed) * 0.9 * dt;
        bloom.x += Math.cos(bloom.dir) * BLOOM_MV * dt * mv;
        bloom.y += Math.sin(bloom.dir) * BLOOM_MV * dt * mv;
        if (bloom.x < 60 || bloom.x > W - 60) { bloom.dir = Math.PI - bloom.dir; bloom.x = clamp(bloom.x, 60, W - 60); }
        if (bloom.y < 140 || bloom.y > 520) { bloom.dir = -bloom.dir; bloom.y = clamp(bloom.y, 140, 520); }
        bloom.spin += dt * SPIN_B;

        // shards hunt on the donor's steering lerp with the standoff removed — a loose shard
        // has no gun, so it just comes. It aims at your position clipped to y<=660: nothing
        // that can kill you is ever allowed under the thumb.
        const huntY = Math.min(by, 660), k2 = 1 - Math.exp(-SHARD_TURN * dt);
        for (const s of shards) {
          const a = Math.atan2(huntY - s.y, bx - s.x);
          s.vx += (Math.cos(a) * SHARD_MV - s.vx) * k2;
          s.vy += (Math.sin(a) * SHARD_MV - s.vy) * k2;
          s.x += s.vx * dt * mv; s.y += s.vy * dt * mv;
          if (s.x < 26) { s.x = 26; s.vx = Math.abs(s.vx); }
          else if (s.x > W - 26) { s.x = W - 26; s.vx = -Math.abs(s.vx); }
          if (s.y < 60) { s.y = 60; s.vy = Math.abs(s.vy); }
          else if (s.y > 700) { s.y = 700; s.vy = -Math.abs(s.vy); }
          s.spin += dt * SPIN_S;
        }
        danger = clamp(shards.length / 14, 0, 1);         // donor: enemies/14 + bullets/80

        // the cut: the donor tested its pulse window against petals at d<116 — same window,
        // same radius, but here it opens the bloom. Wins are legal before the clock arms.
        if (pulseHot > PULSE_LIVE && Math.hypot(bloom.x - bx, bloom.y - by) < PULSE_R) { openBloom(); return; }
        if (!armed) return;                               // may not lose while unarmed
        for (const s of shards) {
          if (Math.hypot(s.x - bx, s.y - by) < SHARD_R + BLADE_R + TOUCH) { hitBlade('shard'); return; }
        }
        if (Math.hypot(bloom.x - bx, bloom.y - by) < BLOOM_R + BLADE_R + TOUCH) hitBlade('bloom');
      }

      /* ---- render ---- */
      function halo(g, x, y, r, h, l, a) {                // fake glow: no shadowBlur anywhere
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, hs(h, 100, l, a));
        gr.addColorStop(0.42, hs(h, 100, l, a * 0.34));
        gr.addColorStop(1, hs(h, 100, l, 0));
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
      }
      function render(g) {
        g.save();
        g.translate(shX, shY);
        // (1) donor background: violet well, brightening a hair with the field's danger
        const bg = g.createRadialGradient(W * 0.5, H * 0.48, 0, W * 0.5, H * 0.48, Math.max(W, H) * 0.72);
        bg.addColorStop(0, hs(270, 38, 10 + danger * 2));
        bg.addColorStop(0.55, hs(252, 42, 5));
        bg.addColorStop(1, '#020107');
        g.fillStyle = bg; g.fillRect(-40, -40, W + 80, H + 80);
        // (2) fourteen slow lobes, breathing on the beat
        g.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 14; i++) {
          const a = i / 14 * TAU + t * 0.015 * (i % 2 ? 1 : -1);
          const rr = Math.min(W, H) * (0.18 + i * 0.025) + Math.sin(t * 0.2 + i) * 9;
          g.globalAlpha = 0.018 + 0.012 * beatPulse;
          g.fillStyle = hs(285 + i * 4, 85, 55);
          g.beginPath(); g.arc(W / 2 + Math.cos(a) * rr, H / 2 + Math.sin(a) * rr, rr * 0.42, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
        g.globalCompositeOperation = 'source-over';
        // (3) the kinetic grid — wordless, and the only thing that says which way is moving
        g.strokeStyle = hs(280, 65, 60, 0.025 + 0.02 * danger); g.lineWidth = 1;
        const stp = 56, ox = (t * 7) % stp, oy = (t * 4) % stp;
        for (let x = -stp + ox; x < W + stp; x += stp) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
        for (let y = -stp + oy; y < H + stp; y += stp) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
        g.globalCompositeOperation = 'lighter';
        // (4) blade trail
        for (const tr of trail) {
          const a = tr.life / 0.22;
          g.fillStyle = hs(HUE, 100, 70, a * 0.15);
          g.beginPath(); g.arc(tr.x, tr.y, BLADE_R * (0.5 + 0.7 * a), 0, TAU); g.fill();
        }
        // (5) rings, particles, sparks
        for (const r of rings) {
          const a = clamp(r.life / r.max, 0, 1);
          g.globalAlpha = a * 0.7; g.strokeStyle = hs(r.h, 100, 70); g.lineWidth = r.width * a + 0.5;
          g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
        }
        g.globalAlpha = 1;
        for (const p of parts) {
          const a = clamp(p.life / p.max, 0, 1);
          g.fillStyle = hs(p.h, 100, 68, a * 0.8);
          g.beginPath(); g.arc(p.x, p.y, Math.max(0.4, p.r * a), 0, TAU); g.fill();
        }
        g.lineWidth = 1.2;
        for (const s of sparks) {
          const a = clamp(s.life / s.max, 0, 1), v = Math.hypot(s.vx, s.vy) || 1;
          g.strokeStyle = hs(s.h, 100, 72, a);
          g.beginPath(); g.moveTo(s.x, s.y);
          g.lineTo(s.x - s.vx / v * s.len * a, s.y - s.vy / v * s.len * a); g.stroke();
        }
        // (6) shards — donor's type-0 six-point silhouette, wobbling on its own spin
        for (const s of shards) {
          const wob = Math.sin(t * WOB + s.spin) * 1.5;
          halo(g, s.x, s.y, SHARD_R * 2.9, s.h, 60, 0.30);
          g.save(); g.translate(s.x, s.y); g.rotate(s.spin);
          g.strokeStyle = hs(s.h, 92, 68); g.fillStyle = hs(s.h, 80, 22, 0.48); g.lineWidth = 2.3;
          g.beginPath();
          for (let k = 0; k < 6; k++) {
            const a = k / 6 * TAU, r = SHARD_R + (k % 2 ? wob : -wob);
            const x = Math.cos(a) * r, y = Math.sin(a) * r;
            if (k) g.lineTo(x, y); else g.moveTo(x, y);
          }
          g.closePath(); g.fill(); g.stroke();
          g.fillStyle = hs(s.h, 100, 72, 0.9);
          g.beginPath(); g.arc(0, 0, 3.1, 0, TAU); g.fill();
          g.restore();
        }
        // (7) the bloom — donor's type-1 body, and its gold core is the cut-mark
        if (decided !== 'won') {
          halo(g, bloom.x, bloom.y, BLOOM_R * 3.4, bloom.h, 60, 0.34);
          g.save(); g.translate(bloom.x, bloom.y); g.rotate(bloom.spin);
          g.strokeStyle = hs(bloom.h, 92, 68); g.fillStyle = hs(bloom.h, 80, 22, 0.48); g.lineWidth = 2.3;
          g.beginPath(); g.arc(0, 0, BLOOM_R, 0, TAU); g.fill(); g.stroke();
          g.beginPath(); g.arc(0, 0, BLOOM_R * 0.52, 0, TAU); g.stroke();
          for (let k = 0; k < 4; k++) {
            g.rotate(Math.PI / 2);
            g.beginPath(); g.moveTo(BLOOM_R * 0.7, 0); g.lineTo(BLOOM_R * 1.28, 0); g.stroke();
          }
          g.restore();
          halo(g, bloom.x, bloom.y, 15, GOLD, 70, 0.85);
          g.fillStyle = hs(GOLD, 100, 70);
          g.beginPath(); g.arc(bloom.x, bloom.y, 4.3, 0, TAU); g.fill();
        }
        // (8) the blade: a square stood on its corner, aimed down its own travel
        if (decided !== 'lost') {
          halo(g, bx, by, 30 + pulseHot * 40, HUE, 68, 0.55);
          g.save(); g.translate(bx, by); g.rotate(Math.atan2(faceY, faceX) + Math.PI / 4);
          g.fillStyle = hs(HUE, 100, 78); g.fillRect(-7, -7, 14, 14);
          g.fillStyle = '#ffffff'; g.fillRect(-2.3, -2.3, 4.6, 4.6);
          g.restore();
        }
        // (9) the donor's white-rose flash, then its vignette
        g.globalCompositeOperation = 'source-over';
        if (flash > 0.002) {
          g.fillStyle = 'rgba(255,225,250,' + (flash * 0.28).toFixed(3) + ')';
          g.fillRect(-40, -40, W + 80, H + 80);
        }
        if (!vig) {
          vig = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.48, W / 2, H / 2, Math.max(W, H) * 0.62);
          vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.28)');
        }
        g.fillStyle = vig; g.fillRect(-40, -40, W + 80, H + 80);
        // (10) shared marking: cream ink on the one thing you must reach, 8th notes, ~1.5s
        if (t < 1.5 && !decided) {
          const e8 = 1 - ((env.beatPhase() * 2) % 1);
          g.globalAlpha = 0.26 + 0.5 * e8 * e8;
          g.strokeStyle = env.ink; g.lineWidth = 2;
          g.beginPath(); g.arc(bloom.x, bloom.y, BLOOM_R + 12 + 3 * e8, 0, TAU); g.stroke();
          g.globalAlpha = 1;
        }
        g.restore();
      }

      /* ---- QA bot: circle up to the bloom on the clean side, then tap on the spot ---- */
      const STAND = 82;                     // between the 29px kill radius and the 116px cut
      function pathRisk(x, y) {             // closest a straight walk there gets to any shard
        let near = 1e9;
        for (let i = 1; i <= 5; i++) {
          const u = i / 5, sx = bx + (x - bx) * u, sy = by + (y - by) * u;
          for (const s of shards) near = Math.min(near, Math.hypot(s.x - sx, s.y - sy));
        }
        return near;
      }
      function safePoint() {
        let best = { x: bloom.x, y: bloom.y + STAND }, score = -1e9;
        for (let i = 0; i < 12; i++) {
          const a = i / 12 * TAU;
          const x = clamp(bloom.x + Math.cos(a) * STAND, 40, W - 40);
          const y = clamp(bloom.y + Math.sin(a) * STAND, 90, 700);
          const sc = Math.min(pathRisk(x, y), 240) - Math.hypot(x - bx, y - by) * 0.3;
          if (sc > score) { score = sc; best = { x, y }; }
        }
        return best;
      }
      function hint() {
        if (decided) return { type: 'wait', ms: 200 };
        let nx = 0, ny = 0, nd = 1e9;
        for (const s of shards) {
          const dd = Math.hypot(s.x - bx, s.y - by);
          if (dd < nd) { nd = dd; nx = s.x; ny = s.y; }
        }
        if (nd < 78) {                      // a shard on the blade: run first, aim later
          const a = Math.atan2(by - ny, bx - nx);
          return { type: 'drag', x: bx, y: by,
            x2: clamp(bx + Math.cos(a) * 170, 40, W - 40),
            y2: clamp(by + Math.sin(a) * 170, 90, 760), ms: 120 };
        }
        const d = Math.hypot(bloom.x - bx, bloom.y - by);
        if (d > BLOOM_R + BLADE_R + 26 && d < PULSE_R - 14) {
          if (pulseCd > 0) return { type: 'wait', ms: 60 };   // recharging — hold the standoff
          return { type: 'tap', x: bx, y: by };               // tap on itself: pulse, don't steer
        }
        const p = safePoint();
        let hx = p.x, hy = p.y;
        const ddx = hx - bx, ddy = hy - by, dd2 = Math.hypot(ddx, ddy);
        if (dd2 > 200) { hx = bx + ddx / dd2 * 200; hy = by + ddy / dd2 * 200; } // cap the hop:
        // the chase overshoots ~9% of whatever it is asked to cross, and the bloom kills on touch
        return { type: 'drag', x: bx, y: by, x2: hx, y2: hy, ms: 130 };
      }

      return {
        step, render,
        result: () => announced,
        timeout() {                         // do-the-thing game: the bell is a loss
          if (decided === 'won') return 'won';
          if (!decided) {
            decided = 'lost'; announceT = 0; announced = 'lost'; failMode = 'bell';
            shake = 10; flash = 0.3;
            burst(bloom.x, bloom.y, bloom.h, 0.8, 14);
            ring(bloom.x, bloom.y, 30, 4, bloom.h, 0.4, 2);  // the bloom closing: a ring going IN
            sHit();
          }
          return 'lost';
        },
        line: () => failMode === 'bloom' ? 'YOU HUGGED IT. IT HAD OPINIONS.'
          : failMode === 'bell' ? 'THE BLOOM WAITED. YOU ADMIRED IT.'
          : 'A LOOSE PETAL WENT THROUGH YOU',
        hint,
      };
    },
  });
})();
/* DONE-CRITERIA
   - The blade chases the finger on the donor's spring exactly: vx += (dx*11 - vx)*(1-exp(-16*dt)),
