})();
/* DONE-CRITERIA
   - Clockwise angle-delta drag around hub (195,430) advances progress; detents fire every TAU/8 rad —
     6 needed at difficulty 0, 8 at 1, 10 at 2 (diff 2 also divides forward delta by 1.15).
   - Detent i plays the donor triple: bandpass click at ~3000*2^((i-1)/12) Hz, 160 Hz sine thock,
     523.25*2^((i-1)/12) triangle ring — a semitone higher per click, C5 root.
   - Counter-clockwise drag moves at 0.6x and floors at the last detent seat; dry pawl chatter <= 12 Hz,
     deliberately irregular; progress never decreases past the floor (minus the one 0.02 rad yield).
   - On final detent: freewheel (vel 13, exp(-3.2t) decay, card-in-spokes clicks), pips 880/660/440 at
     0.10/0.20/0.30 s, flap BANG at 0.40 s (trauma 0.55, <= 3 px shake), candy ejects and lands in the
     tray -> 'won' within ~0.7 s of the last click. timeout() with progress < target -> 'lost' + the
     machine's refusal (3 pawl ticks + flat 440 triple + amber wash on the flap).
   - Crank arm chases the pointer through a 300/30 spring with lag clamped to +/-0.105 rad; each detent
     adds +0.9 snap-forward and a 1 px machine shudder decaying at 9/s.
   BUG-IS-GAME (do not fix):
   - The last detent drags 15% harder (d /= 1.15 inside the final eighth, diff >= 1) — the 8th detent's bite.
   - THANK YOU is stamped off-center at flap.w * 0.07 — authored die misalignment, not a centering bug.
   - The 1¢ decal is rotated 2 degrees off-true — hand-applied, keep it crooked.
   - Holding backward pressure 1.4 s yields exactly 0.02 rad, once — a hidden give, not slop.
   - Pawl chatter timing is jittered ('never a rhythm') — the irregularity is intentional.
*/

/* ===== carts/13-still.js ===== */
/* STILL — hold to creep down the dark corridor; freeze when the watcher turns */
(function () {
  registerGame({
    id: 'still',
    title: 'STILL',
    command: "DON'T MOVE.",
    family: 'inhibit',
    slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, diff = env.difficulty;
      // ---- one-point corridor projection ----
      const VPX = 195, VPY = 330;                    // vanishing point
      const F = 0.45, D = 2.4;                       // pinhole: k = F/(F + rel*D)
      const P = (rel) => F / (F + Math.max(0, rel) * D);
      const SX = (wx, k) => VPX + wx * k;            // world x: -195..195
      const SY = (wy, k) => VPY + wy * k;            // world y: ceiling -330 .. floor +514
      const hsh = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

      // ---- watch schedule (seconds of ARMED time), seeded ----
      const slotDur = 8 * env.beatLen();
      const avail = slotDur - 0.2;
      const teleDur = [0.45, 0.35, 0.28][diff];      // donor recipe telegraph lead
      let s0 = [1.0, 0.95, 0.85][diff] + env.rng() * 0.5;   // first safe walk
      let w1d = [1.0, 1.15, 1.3][diff];              // first watch
      let s1 = diff >= 1 ? [0, 1.0, 0.85][diff] + env.rng() * 0.4 : 0;
      let w2d = [0, 0.8, 0.95][diff];                // difficulty adds a second, shorter watch
      const total = s0 + w1d + s1 + w2d;
      if (total > avail) { const m = avail / total; s0 *= m; w1d *= m; s1 *= m; w2d *= m; }
      const watches = [{ tele: s0 - teleDur, start: s0, end: s0 + w1d, teleF: false, backF: false }];
      if (diff >= 1) {
        const st = s0 + w1d + s1;
        watches.push({ tele: st - teleDur, start: st, end: st + w2d, teleF: false, backF: false });
      }
      let busy = teleDur * watches.length;
      for (const w of watches) busy += (w.end - w.start);
      // seconds of full-speed holding that reach the door (early win); survival also wins.
      // Floor: the door must sit beyond the first watch — holding straight through the
      // count-in and the first safe window can never finish before it turns.
      const needHeld = Math.max(
        Math.min([2.8, 3.5, 4.2][diff], Math.max(1.5, (avail - busy) * 0.92)),
        env.beatLen() + s0 + 0.75
      );
      const wRate = 0.757 / needHeld;                // watcher 1.4 m/s vs player WALK 1.85
      const baseTension = [0.1, 0.16, 0.3][diff];    // d2 rides higher (donor recipe)
      const streaks = []; for (let i = 0; i < 9; i++) streaks.push(0.06 + i * 0.115 + env.rng() * 0.05);

      // ---- state ----
      let t = 0, armedT = 0, done = 'pending';
      let v = 0, progress = 0, stillTime = 1, seenT = 0, noticed = false;
      let bobPhase = 0, strideAcc = 0.75;
      let zw = [0.62, 0.62, 0.44][diff];             // watcher depth (d2 30% closer)
      let wStep = 0, headTurn = 0, lampOn = true;
      let tension = baseTension, spikeV = 0, hbAcc = 0.35, rtAcc = 0.6;
      let watched = false, teleNow = false;
      let whisper = null, introF = false, wonT = 0, grabT = 0;

      // ---- audio (donor RECIPES{} approximations, shell bus) ----
      const tone = (o) => env.audio.tone(o), noise = (o) => env.audio.noise(o);
      const proxGain = () => { const d = (zw - progress) * 1.85 * needHeld; return 1 / (1 + d * d * 0.035); };
      const entityStep = (g) => {
        const f = 60 + (hsh(t * 31.7) - 0.5) * 40;   // 60*drift(20), slideTo 26
        tone({ f, f2: 26, type: 'sine', dur: 0.34, vol: Math.min(0.5, 0.42 * g) });
        noise({ dur: 0.26, vol: Math.min(0.3, 0.2 * g), hp: 60, lp: 420 });
      };
      const playerStep = () => {
        noise({ dur: 0.11, vol: 0.085, hp: 70, lp: 320 });
        if (hsh(t * 57.3) < 0.16) noise({ dur: 0.2, vol: 0.05, hp: 600, lp: 1000, t: 0.02 }); // stepWood creak layer
      };
      const flickerBuzz = () => {
        tone({ f: 100, type: 'sawtooth', dur: 0.5, vol: 0.035 });
        noise({ dur: 0.5, vol: 0.022, hp: 3600, lp: 4800 });
      };
      const inhale = () => noise({ dur: 0.55, vol: 0.09, hp: 650, lp: 1600 });   // inhale-then-silence = FREEZE
      const exhale = () => {                                                      // exhale = you may move
        noise({ dur: 1.3, vol: 0.06, hp: 70, lp: 420 });
        tone({ f: 46, f2: 36, type: 'sawtooth', dur: 1.2, vol: 0.018 });
      };
      const whisperSfx = () => noise({ dur: 0.5, vol: 0.05, hp: 700, lp: 1500 });
      const grabSfx = () => {                        // "the worst sound in the game"
        tone({ f: 220, f2: 24, type: 'sine', dur: 1.1, vol: 0.55 });
        noise({ dur: 0.8, vol: 0.32, hp: 180, lp: 1900 });
        noise({ dur: 0.5, vol: 0.12, hp: 660, lp: 900, t: 0.05 });   // scream formants 780/1160/1620
        noise({ dur: 0.5, vol: 0.1, hp: 1000, lp: 1330, t: 0.07 });
        noise({ dur: 0.45, vol: 0.08, hp: 1450, lp: 1800, t: 0.09 });
      };
      const doorCreak = () => {
        noise({ dur: 1.2, vol: 0.16, hp: 520, lp: 980 });
        tone({ f: 70, f2: 55, type: 'sine', dur: 1.2, vol: 0.1 });
      };

      // ---- helpers ----
      const quad = (g, ax, ay, bx, by, cx, cy, dx, dy, fill) => {
        g.fillStyle = fill; g.beginPath();
        g.moveTo(ax, ay); g.lineTo(bx, by); g.lineTo(cx, cy); g.lineTo(dx, dy);
        g.closePath(); g.fill();
      };
      const spaced = (g, txt, cx, y, sp) => {        // donor letter-spaced serif
        let tw = -sp;
        for (const ch of txt) tw += g.measureText(ch).width + sp;
        let x = cx - tw / 2;
        for (const ch of txt) { g.fillText(ch, x, y); x += g.measureText(ch).width + sp; }
      };
      const silhouette = (g, x, yF, k, turn) => {    // tall, thin, wrong
        g.fillStyle = '#1c1a1e';
        g.fillRect(x - 12 * k, yF - 150 * k, 8 * k, 151 * k);          // legs
        g.fillRect(x + 4 * k, yF - 150 * k, 8 * k, 151 * k);
        g.beginPath();                                                  // tapered torso
        g.moveTo(x - 20 * k, yF - 150 * k); g.lineTo(x + 20 * k, yF - 150 * k);
        g.lineTo(x + 54 * k, yF - 318 * k); g.lineTo(x - 54 * k, yF - 318 * k);
        g.closePath(); g.fill();
        g.fillRect(x - 54 * k, yF - 332 * k, 108 * k, 16 * k);          // box shoulders (0.72 wide)
        g.fillRect(x - 57 * k, yF - 318 * k, 4.5 * k, 168 * k);         // thread-thin arms
        g.fillRect(x + 52.5 * k, yF - 318 * k, 4.5 * k, 168 * k);
        g.fillRect(x - 4 * k, yF - 356 * k, 8 * k, 26 * k);             // neck
        g.fillStyle = '#3a3234';                                        // pale stretched head (0.85, 1.35)
        g.beginPath(); g.ellipse(x, yF - 384 * k, 18 * k, 29 * k, 0, 0, Math.PI * 2); g.fill();
        if (turn > 0.05) {                                              // the face: a pale dot, only when it turns
          g.fillStyle = 'rgba(138,129,120,' + (0.95 * turn).toFixed(3) + ')';
          g.beginPath(); g.ellipse(x, yF - 382 * k, 13 * k, 23 * k, 0, 0, Math.PI * 2); g.fill();
        }
      };

      return {
        step(dt, inp) {
          t += dt;
          if (done === 'won') { wonT += dt; return; }
          if (done === 'lost') { grabT += dt; return; }

          // ---- movement: hold = walk, release = freeze (touch inversion) ----
          const held = inp.down;
          v += ((held ? 1 : 0) - v) * Math.min(1, (held ? 10 : 12) * dt);
          progress = Math.min(1, progress + (v * dt) / needHeld);
          bobPhase += dt * 7.4 * (0.35 + v);
          const moving = v * 1.85 > 0.12;              // donor: vel > 0.12 m/s
          stillTime = moving ? 0 : stillTime + dt;     // resets on ANY motion
          if (moving) {
            strideAcc += v * 1.85 * dt;                // stride 1.5 m
            if (strideAcc > 1.5) { strideAcc -= 1.5; playerStep(); }
          }

          // ---- count-in: watcher asleep, whisper 'still.' ----
          if (!introF && t > 0.05) {
            introF = true; exhale(); whisperSfx();
            whisper = { txt: 'still.', at: t, dur: 1.1 };
          }
          if (env.armed()) armedT += dt;

          // ---- watch phases (armed time), latched telegraph/snap/back events ----
          teleNow = false; watched = false;
          for (const w of watches) {
            if (armedT >= w.tele && armedT < w.start) {
              teleNow = true;
              if (!w.teleF) { w.teleF = true; flickerBuzz(); inhale(); }
            } else if (armedT >= w.start && armedT < w.end) {
              watched = true;
            } else if (armedT >= w.end && !w.backF) {
              w.backF = true; exhale();
            }
          }
          lampOn = teleNow ? hsh(t * 91.7) < 0.4 : true;   // donor: ON only 40% of frames while dying
          headTurn += ((watched ? 1 : 0) - headTurn) * Math.min(1, (watched ? 16 : 6) * dt);

          // ---- watcher walks away during safe phases only ----
          if (env.armed() && !teleNow && !watched) {
            zw += wRate * dt;
            wStep += 1.4 * dt;                          // donor step cadence: speed * dt > 0.9
            if (wStep > 0.9) { wStep -= 0.9; entityStep(1.1 * proxGain()); }
          }
          zw = Math.max(zw, progress + 0.06);           // it stays between you and the door

          // ---- perception: donor constants verbatim ----
          if (watched && stillTime < 0.25) {            // release is not instantly safe
            seenT += dt;
          } else {
            seenT = Math.max(0, seenT - dt * 1.5);      // sticky decay
            if (seenT === 0) noticed = false;           // latch clears only at zero
          }
          if (seenT > 0.16 && !noticed) {               // it NOTICES: loud step + fear, nothing else
            noticed = true;
            entityStep(1.5 * Math.max(0.6, proxGain()));
            spikeV += 0.5;
            hbAcc = -0.35;                              // the heart skips a beat
          }

          // ---- resolve ----
          if (progress >= 1) {                          // reached the doorway of light
            done = 'won'; doorCreak(); whisperSfx();
            whisper = { txt: 'up.', at: t, dur: 9 };
            return;
          }
          if (seenT > 0.55 && env.armed()) {            // taken
            done = 'lost'; headTurn = 1; grabSfx(); spikeV += 1.2;
            return;
          }

          // ---- fear conductor: up fast (1.8), down slow (0.14) ----
          spikeV = Math.max(0, spikeV - dt * 0.16);
          const amb = baseTension + (watched ? 0.25 : 0) + (teleNow ? 0.1 : 0) + seenT * 0.6;
          const tgt = Math.min(1, amb + spikeV);
          tension += (tgt - tension) * Math.min(1, dt * (tgt > tension ? 1.8 : 0.14));

          // ---- body: heartbeat bpm 52 + tension*96, dry and inside you ----
          hbAcc += dt;
          const per = 60 / (52 + tension * 96);
          if (hbAcc >= per) {
            hbAcc -= per;
            const hv = 0.05 + tension * 0.4;
            tone({ f: 180, f2: 120, type: 'sine', dur: 0.09, vol: hv });          // lub
            tone({ f: 180, f2: 120, type: 'sine', dur: 0.09, vol: hv * 0.65, t: 0.19 }); // dub
          }

          if (rtAcc > 0.75) { rtAcc -= 0.75; tone({ f: 44, type: 'sine', dur: 1.4, vol: 0.04, attack: 0.4 }); }

        render(g) {
          // ---- taken: the read IS the frame — blink to black, the pale stretched face ----
          if (done === 'lost') {
            g.fillStyle = '#000000'; g.fillRect(0, 0, W, H);
            const fa = Math.min(1, 0.55 + grabT * 5);
            g.fillStyle = 'rgba(138,129,120,' + (fa * 0.92).toFixed(3) + ')';
            g.beginPath(); g.ellipse(195, 350, 88, 142, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = 'rgba(28,26,30,' + (fa * 0.35).toFixed(3) + ')';
            g.beginPath(); g.ellipse(165, 322, 12, 21, 0, 0, Math.PI * 2); g.fill();
            g.beginPath(); g.ellipse(225, 322, 12, 21, 0, 0, Math.PI * 2); g.fill();
            g.fillStyle = 'rgba(28,26,30,' + fa.toFixed(3) + ')';
            g.fillRect(155, 470, 80, 380);               // dark below the jaw
            for (let i = 0; i < 70; i++) {               // heavy grain
              const fr = Math.floor(t * 24);
              g.fillStyle = i % 2 ? 'rgba(255,244,220,0.1)' : 'rgba(0,0,0,0.14)';
              g.fillRect(hsh(i * 13.7 + fr) * W, hsh(i * 7.9 + fr * 1.7) * H, 2, 2);
            }
            return;
          }

          g.fillStyle = '#000000'; g.fillRect(0, 0, W, H);
          const s2 = tension * tension;                  // tremble ∝ tension², never random-jumpy
          const camX = Math.sin(bobPhase) * 3.5 * v + s2 * (Math.sin(t * 12.6) * 2.2 + Math.sin(t * 34.2) * 1.3);
          const camY = Math.sin(bobPhase * 2) * 5 * v + s2 * (Math.sin(t * 16.2) * 1.6 + Math.sin(t * 19.8) * 1.2);
          g.save(); g.translate(camX, camY);

          const kn = 1.08;                               // near plane oversized to hide shake
          const kd = P(1 - progress);                    // door plane
          quad(g, SX(-195, kn), SY(-330, kn), SX(195, kn), SY(-330, kn), SX(195, kd), SY(-330, kd), SX(-195, kd), SY(-330, kd), '#241a12'); // ceiling

/* DONE-CRITERIA
   - Holding (or being within the settle tail) while a watch phase is active accumulates seenT
     at 1*dt; seenT > 0.16 fires exactly one loud entityStep (gain 1.5) + fear spike 0.5 and
     nothing else; seenT > 0.55 while env.armed() sets 'lost' and the very next frame is the
     black + pale-face grab read.
   - On release, velocity lerps down at rate 12 and the player still counts as moving until
     0.25 s after v*1.85 drops below 0.12 — a full-speed release is unsafe for ~0.45 s.
   - seenT decays at 1.5/s when the gate is closed and the notice latch clears only when
     seenT reaches exactly 0, so separate twitches accumulate.
   - progress >= 1.0 sets 'won' immediately with doorCreak + whisper 'up.' and the warm flood;
     timeout() returns 'won' (inhibit family: surviving the slot is also a win).
   - No watch phase can begin before env.armed() (armedT accumulates only while armed), so
     'lost' is impossible during the count-in; the watcher stands asleep until armed.
   - Each watch is telegraphed teleDur (0.45/0.35/0.28 s by difficulty) ahead: the door lamp
     flickers ON only when hash < 0.4 per step, flickerBuzz + inhale play, and its footsteps stop.
   BUG-IS-GAME (do not fix):
   - The 0.25 s settle window: release is NOT instantly safe — panic releases still die.
   - Sticky seenT (decay 1.5/s, latch clears only at 0): repeated glances add up to being taken.
   - The 0.16 s notice does nothing mechanical — no speed-up, no course change. Just the sound,
     the spike, the skipped heartbeat. The grace gap is deliberately empty.
   - Lamp flicker is ON only 40% of frames during the telegraph (mostly dark). Not inverted.
   - No run exists: top speed is fixed at the WALK 1.85 equivalent; do not add sprint.
     Standing still the entire slot also wins — the lit door is the bait, not the requirement.
*/

/* DONE-CRITERIA
   - Spark starts already roped to hand A, mid-swing (seeded 35-45deg, 540-610 px/s); no input needed to keep swinging.
   - justUp while roped releases with vx,vy *= 1.08 and vy -= 26 when rising (donor REL_BOOST throw), within one frame.
   - Airborne spark within REACH=170 of hand B's anchor => 'won' with 34ms hitstop, burst, chord, 'caught.' (verdict announced 0.28s later, timeout() already reports 'won').
   - Falling past world y=950 while armed => 'lost', word 'fell.', light collapses to 0; never 'lost' while env.armed() is false (spark hovers on the fail line).
   - Difficulty 1: B's anchor oscillates x = 450 + 80*sin(2*pi*t/3.0 + ph). Difficulty 2: hand A tele from heldT 1.2s (1320Hz tick accelerating .23s -> .10s, index cocks, hand brightens 1+tele*1.6) and throws at 980 px/s at heldT >= 1.75, cool 1.2s; a thorn (225,395,r30) parked on the flick corridor kills airborne contact => 'pricked.' (drawn over the hands, donor order).
   - Regrab: holding input while airborne within 170 of A re-attaches with L=clamp(dist,70,190); blocked for relT<0.35 after releasing A (donor lockout).
   BUG-IS-GAME (do not fix):
   - Letting go ADDS energy (REL_BOOST + 26 up) — free energy on purpose; do not conserve it.
   - Release velocity comes from the rope-constraint solve, so aim IS timing — no aim indicator.
   - The flick hand punishes the game's only verb; being thrown for holding is intended (a lucky flick from the right side of the swing can still fluke into B's catch radius — keep that).
   - Invulnerability while held is THE design: the thorn is only tested while s.hold === null — at diff 2 the swing passes straight through it. Do not add held-state collision.
   - Moving = seeing: light radius uses lit=1's litF 0.55 and shrinks toward 90 world px when slow; the gloom is the mood, no ambient light, no HUD beyond the three orbiting beads.
*/

/* ===== carts/15-heart.js ===== */
/* HEART OF THE PARTY — tap anywhere as rings land on the glossy heart; let the red foul pass */
(function () {

    { bg: '#0c0716', fA: '#2c164a', fB: '#190e2e', ac: '#ea55a4', ac2: '#46c2e0' },
    { bg: '#0d0718', fA: '#3a1860', fB: '#20103c', ac: '#ff3d8d', ac2: '#2fdcf5' },

  var RED = '#ff3355', GOLD = '#ffd166', GOODC = '#9fe8ff', MISSC = '#ff6b8a', DIMC = '#7a7396', DODGEC = '#8affc1';
  var GWORDS = ['GOOD', 'NICE', 'OKAY!'];

    g.bezierCurveTo(0.28 * s, -0.22 * s, 0, 0.10 * s, 0, 0.30 * s);

  registerGame({
    id: 'heart', title: 'HEART OF THE PARTY', command: 'TAP THE BEAT!', family: 'tap', slotBeats: 8,
    create(env) {

      var P = PALS[D], lvl = 2 + D;

      var PW = 0.085;                            // donor PERFECT window (s)

      var LAND = [[2, 4, 6, 8], [2, 3, 5, 6], [2, 3, 4, 5]][D];
      /* EVERY RING IS A BEAT YOU TAP. There used to be a red decoy you had to let pass —
         the donor's "party foul" — and it read as the game arbitrarily not wanting the last
         tap. A microgame command that says TAP THE BEAT! and then punishes a tap on the beat
         is arguing with itself. All four rings are real now; the discrimination idea can
         live somewhere its own command sells it. */
      var redIdx = -1;
      var targets = [];
      for (var i = 0; i < 4; i++) targets.push({ beat: LAND[i], red: false, landT: 99, judged: false });
      /* You are asked for every beat, and allowed to fumble exactly one. */
      var NEED = [3, 4, 4][D];
      var showDodge = env.rng() < 0.35;          // donor: "nice dodge" popup only 35% of the time

      // pre-seeded crowd
      var dancers = [];
      var nd = 6 + ((env.rng() * 3) | 0);
      for (i = 0; i < nd; i++) {
        dancers.push({
          u: (env.rng() - 0.5) * 0.7, v: 0.18 + env.rng() * 0.72,
          color: DCOL[(env.rng() * DCOL.length) | 0], ph: env.rng(),
          arms: (env.rng() * 3) | 0, hat: env.rng() < 0.5,
          xoff: 0, dir: env.rng() < 0.5 ? -1 : 1, flee: false,
        });
      }
      dancers.sort(function (a, b) { return a.v - b.v; }); // far to near

      var t = 0, started = false, prevPh = env.beatPhase(), beatIdx = 0;
      var beatStart = -prevPh * env.beatLen();
      var kickPulse = 0, tapSquash = 0, winPulse = 0, comboPop = 0;
      var shakeT = 0, shakeMag = 0, flash = 0;
      var done = 'pending', why = 'miss', hits = 0, perfects = 0, dead = false, redWarned = false;
      var parts = [], bursts = [], pops = [];

      function floorY(v) { return HORIZON + (H * 0.965 - HORIZON) * Math.pow(v, 1.3); }
      function rowW(v) { return W * 0.66 + (W * 1.5 - W * 0.66) * Math.pow(v, 1.3); }
      function ap() { return Math.max(0.7, Math.min(1.2, env.beatLen() * 2)); } // donor 120/bpm clamp
      function shake(m) { shakeT = 0.22; shakeMag = m; }
      function pop(txt, color, sz) {
        if (pops.length < 18) pops.push({ txt: txt, color: color, sz: sz || 1, t: 0, y: HY - HR * 2.1 });
      }
      function confetti(n, color) {
        for (var k = 0; k < n && parts.length < 120; k++) {
          var a = env.rng() * Math.PI * 2, sp = 60 + env.rng() * 220;
          parts.push({
            x: HX, y: HY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
            life: 0.9 + env.rng() * 0.5, t: 0, w: 3 + env.rng() * 4,
            rot: env.rng() * Math.PI, vr: (env.rng() - 0.5) * 8,
            color: color || DCOL[(env.rng() * DCOL.length) | 0],
          });
        }
      }
      function ringBurst(color) { if (bursts.length < 6) bursts.push({ t: 0, color: color }); }

      // donor-synth sfx via the shell bus
      function sKick() { env.audio.tone({ f: 150, f2: 40, type: 'sine', dur: 0.24, vol: 0.34 }); env.audio.noise({ dur: 0.03, vol: 0.07, hp: 1200 }); }
      function sHat() { env.audio.noise({ dur: 0.05, vol: 0.05, hp: 7000 }); }
      function sClap() { env.audio.noise({ dur: 0.13, vol: 0.13, hp: 1400, lp: 2600 }); env.audio.noise({ dur: 0.09, vol: 0.08, hp: 1600, lp: 2800, t: 0.014 }); }
      function sPerfect() { env.audio.tone({ f: 900, f2: 1600, type: 'sine', dur: 0.10, vol: 0.28 }); env.audio.noise({ dur: 0.03, vol: 0.12, hp: 6000 }); }
      function sGood() { env.audio.tone({ f: 620, f2: 900, type: 'sine', dur: 0.09, vol: 0.20 }); }
      function sMiss() { env.audio.tone({ f: 190, f2: 70, type: 'sawtooth', dur: 0.16, vol: 0.28 }); env.audio.noise({ dur: 0.10, vol: 0.14, lp: 500 }); }
      function sFoul() { // record scratch, approximated in two noise bands + a saw dive
        env.audio.noise({ dur: 0.09, vol: 0.4, hp: 1500, lp: 3200 });
        env.audio.noise({ dur: 0.14, vol: 0.32, hp: 200, lp: 900, t: 0.07 });
        env.audio.tone({ f: 2600, f2: 280, type: 'sawtooth', dur: 0.18, vol: 0.16 });
      }
      function sStray() { env.audio.tone({ f: 240, f2: 180, type: 'sine', dur: 0.06, vol: 0.10 }); }
      function sWarn() { // the decoy's own voice: a scratchy low rasp as the red ring appears
        env.audio.noise({ dur: 0.09, vol: 0.10, hp: 800, lp: 3000 });
        env.audio.tone({ f: 160, f2: 90, type: 'sawtooth', dur: 0.14, vol: 0.10 });
      }
      function sEncore() {
        env.audio.tone({ f: 500, f2: 1900, type: 'sine', dur: 0.26, vol: 0.22 });
        var ns = [523.25, 659.25, 783.99, 1046.5];
        for (var k = 0; k < ns.length; k++) env.audio.tone({ f: ns[k], type: 'sine', dur: 0.4, vol: 0.12, t: k * 0.09 });
      }
      function sTapeStop() { env.audio.tone({ f: 170, f2: 26, type: 'sawtooth', dur: 0.9, vol: 0.3 }); }

      function redDone() { return redIdx < 0 || targets[redIdx].judged; }   // no decoy: always true
      function win() {
        done = 'won'; winPulse = 1; shake(3);
        sEncore(); confetti(36, GOLD); ringBurst('#ffffff');
        pop(['CLEAN', 'FILTHY', 'UNREAL', 'LOUDER'][Math.min(3, perfects)], GOLD, 1.5);
      }
      function fail(w) {
        if (!env.armed()) return;

        for (var k = 0; k < targets.length; k++) targets[k].judged = true;
        for (k = 0; k < dancers.length; k++) dancers[k].flee = true;

        else { shake(4); sMiss(); pop('MISSED', MISSC, 1.3); }
      }

      function drawDancer(g, d) {
        var sc = 0.55 + d.v * 0.6;
        var y = floorY(d.v), x = HX + d.u * rowW(d.v) + d.xoff;
        var bp = env.beatPhase() + d.ph;
        var hop = d.flee ? Math.abs(Math.sin(t * 14 + d.ph * 6)) * 4 * sc
          : Math.abs(Math.sin(Math.PI * bp)) * (6 + lvl * 2.2) * sc;

        g.translate(x, y - hop); g.scale(sc, sc);

        g.strokeStyle = d.color; g.lineWidth = 4; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-5, -6); g.lineTo(-5 + leg, 0); g.moveTo(5, -6); g.lineTo(5 - leg, 0); g.stroke();
        rr(g, -10, -32, 20, 27, 8); g.fillStyle = d.color; g.fill();

        g.beginPath();
        if (d.flee) { g.moveTo(-9, -26); g.lineTo(-17, -20); g.moveTo(9, -26); g.lineTo(17, -20); }
        else if (d.arms === 1 || lvl >= 4) { g.moveTo(-9, -26); g.lineTo(-15, -40 + wob); g.moveTo(9, -26); g.lineTo(15, -40 - wob); }
        else if (d.arms === 2) { g.moveTo(-9, -26); g.lineTo(-17, -26 + wob); g.moveTo(9, -26); g.lineTo(17, -26 - wob); }

      return {
        step(dt, inp) {

          for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 1.1) pops.splice(i, 1); }

          /* Expiries. A passed red is the dodge reward. A passed real ring used to END THE

             finished reading the command. The donor never did this: it ran a vibe meter you
             could bleed and recover. So a miss now COSTS a hit instead of the round, and you

        },

        render(g) {
          g.save();
          if (shakeT > 0) g.translate(Math.sin(t * 97) * shakeMag, Math.cos(t * 83) * shakeMag);

          g.fillStyle = P.bg; g.fillRect(-10, -10, W + 20, H + 20);

          // horizon glow
          var ga = lvl >= 3 ? 0.16 : 0.07;
          var grad = g.createLinearGradient(0, HORIZON - 70, 0, HORIZON);
          grad.addColorStop(0, hexA(P.ac, 0)); grad.addColorStop(1, hexA(P.ac, ga));
          g.fillStyle = grad; g.fillRect(0, HORIZON - 70, W, 70);

            for (var j = 0; j < 10; j++) {

              g.beginPath();
              g.moveTo(HX + a0 * w0, y0); g.lineTo(HX + a1 * w0, y0);
              g.lineTo(HX + a1 * w1, y1); g.lineTo(HX + a0 * w1, y1);
              g.closePath(); g.fill();
            }
          }

          // swinging spotlights (club levels 3+)
          if (lvl >= 3) {
            g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.09;
            for (var k = 0; k < 2; k++) {
              var ang = Math.PI / 2 + Math.sin(t * (0.8 + k * 0.3) + k * 2) * 0.5;
              var ox = W * (0.25 + 0.5 * k), hw = 55 + lvl * 8, L = H * 0.72;
              var dx = Math.cos(ang), dy = Math.sin(ang);

              g.lineTo(bx - dy * hw, by + dx * hw);
              g.lineTo(bx + dy * hw, by - dx * hw);
              g.closePath(); g.fill();
            }
            g.restore();
          }

          for (i = 0; i < dancers.length; i++) drawDancer(g, dancers[i]);

          // landing halo (donor verbatim)
          if (!dead) {
            g.save(); g.translate(HX, HY); g.globalAlpha = 0.25;
            g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.5;
            g.setLineDash([4, 6]);
            g.beginPath(); g.arc(0, 0, HR * 1.12, 0, Math.PI * 2); g.stroke();
            g.setLineDash([]); g.restore();
          }

          // the heart
          var s = (1 + kickPulse * 0.14 + winPulse * 0.3) * (dead ? 0.85 : 1);
          var sq = tapSquash;
          g.save(); g.translate(HX, HY);
          g.scale(s * (1 - 0.10 * sq), s * (1 + 0.14 * sq));
          g.translate(0, -0.45 * HR);
          heartPath(g, HR);
          g.fillStyle = dead ? '#5a5468' : P.ac; g.fill();
          g.lineWidth = 3; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.stroke();
          g.beginPath();
          g.ellipse(-HR * 0.38, 0.02 * HR, HR * 0.20, HR * 0.30, -0.5, 0, Math.PI * 2);
          g.fillStyle = 'rgba(255,255,255,0.28)'; g.fill();
          if (dead) {
            g.strokeStyle = 'rgba(10,8,16,0.9)'; g.lineWidth = 4;
            g.beginPath();
            g.moveTo(0, -0.1 * HR); g.lineTo(-0.18 * HR, 0.25 * HR);
            g.lineTo(0.12 * HR, 0.5 * HR); g.lineTo(-0.08 * HR, 0.85 * HR);
            g.stroke();
          }
          if (t < 1.6 && !dead) { // shared marking: cream rim pulsing on 8ths, first ~1.5s
            var eighth = 1 - ((env.beatPhase() * 2) % 1);
            g.globalAlpha = 0.55 * (1 - t / 1.6) * (0.35 + 0.65 * eighth);
            g.strokeStyle = env.ink; g.lineWidth = 2.5;
            heartPath(g, HR * 1.09); g.stroke();
          }
          g.restore();

          // ---- THE STRIKE ZONE ------------------------------------------------
          // The donor could rely on a whole song to teach its timing; four seconds cannot.
          // So the landing radius is drawn as a real target: a standing ring that brightens
          // as the next real ring closes on it, and blazes white inside the hit window.
          var nx0 = null, nxRem = 9;
          for (i = 0; i < targets.length; i++) {
            var t0 = targets[i]; if (t0.judged) continue;
            var r0 = t0.landT - t;
            if (r0 < nxRem && r0 > -GW) { nxRem = r0; nx0 = t0; }
          }
          var RZ = HR * 1.12;
          var near = nx0 ? Math.max(0, 1 - Math.abs(nxRem) / ap()) : 0;   // 0 far -> 1 landing
          var live = nx0 && Math.abs(nxRem) <= GW && !nx0.red;            // tappable RIGHT NOW
          g.save();
          g.translate(HX, HY);
          // the ring itself: thin and dim when nothing is close, fat and hot on the beat
          g.globalAlpha = 0.30 + 0.70 * near;
          g.lineWidth = 2 + near * 5;
          g.strokeStyle = live ? '#ffffff' : (nx0 && nx0.red ? RED : P.ac);
          g.beginPath(); g.arc(0, 0, RZ, 0, Math.PI * 2); g.stroke();
          // four tick marks so the eye has something crisp to snap the ring against
          g.globalAlpha = 0.25 + 0.6 * near;
          g.lineWidth = 3; g.lineCap = 'round';
          for (i = 0; i < 4; i++) {
            var ta = i * Math.PI / 2 - Math.PI / 4;
            g.beginPath();
            g.moveTo(Math.cos(ta) * (RZ - 7), Math.sin(ta) * (RZ - 7));
            g.lineTo(Math.cos(ta) * (RZ + 7), Math.sin(ta) * (RZ + 7));
            g.stroke();
          }
          // the NOW flare: an outward halo the instant a real ring is inside the window
          if (live) {
            g.globalAlpha = 0.55;
            g.lineWidth = 12;
            g.strokeStyle = 'rgba(255,255,255,0.5)';
            g.beginPath(); g.arc(0, 0, RZ, 0, Math.PI * 2); g.stroke();
          }
          g.globalAlpha = 1;
          g.restore();

          // converging rings (donor geometry verbatim; red wobbles)
          var A = ap();
          for (i = 0; i < targets.length; i++) {
            var tg = targets[i]; if (tg.judged) continue;
            var rem = tg.landT - t;
            if (rem > A || rem <= -0.06) continue;
            var prog = Math.max(0, Math.min(1, rem / A));
            var r = HR * 1.12 + prog * HR * 2.5;
            var wx = tg.red ? Math.sin(t * 16 + tg.beat) * 3.5 : 0;
            g.save(); g.translate(HX + wx, HY);
            // inside the hit window a real ring goes white and fattens — the ring tells you
            // when, the strike zone tells you where, and the two agree
            var hot = !tg.red && Math.abs(rem) <= GW;
            g.globalAlpha = 0.35 + 0.65 * (1 - prog);
            g.strokeStyle = hot ? '#ffffff' : (tg.red ? RED : P.ac);
            g.lineWidth = hot ? 8 : 5;
            g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke();
            if (tg.red) {
              var arm = r * 0.35;
              g.globalAlpha *= 0.8; g.lineWidth = 4; g.lineCap = 'round';
              g.beginPath();
              g.moveTo(-arm, -arm); g.lineTo(arm, arm);
              g.moveTo(arm, -arm); g.lineTo(-arm, arm);
              g.stroke();
            }
            g.restore();
          }

          // hit shockwaves
          for (i = 0; i < bursts.length; i++) {
            var e = bursts[i].t / 0.45;
            g.save(); g.globalAlpha = (1 - e) * 0.8;
            g.strokeStyle = bursts[i].color; g.lineWidth = 6 * (1 - e) + 1;
            g.beginPath(); g.arc(HX, HY, HR * 1.12 + e * HR * 1.6, 0, Math.PI * 2); g.stroke();
            g.restore();
          }

          // confetti
          for (i = 0; i < parts.length; i++) {
            var p = parts[i], kk = 1 - p.t / p.life;
            g.save(); g.globalAlpha = Math.max(0, kk);
            g.translate(p.x, p.y); g.rotate(p.rot);
            g.fillStyle = p.color; g.fillRect(-p.w / 2, -p.w * 0.3, p.w, p.w * 0.6);
            g.restore();
          }

          // floating popups
          for (i = 0; i < pops.length; i++) {
            var q = pops[i], kt = q.t / 1.1;
            g.save(); g.globalAlpha = 1 - kt;
            g.font = FONT(Math.round(20 * q.sz + (1 - kt) * 6));
            g.textAlign = 'center'; g.fillStyle = q.color;
            g.fillText(q.txt, HX, q.y - kt * 46);
            g.restore();
          }

          // hit pips: one little heart per hit you still owe, filled as you land taps.
          // It must show NEED, not a fixed 3 — the goal is only honest if you can count it.
          for (i = 0; i < NEED; i++) {
            g.save(); g.translate(28 + i * 30, 106);
            var psc = i === hits - 1 ? 1 + comboPop * 0.5 : 1;
            g.scale(psc, psc); g.translate(0, -4);
            heartPath(g, 9);
            if (i < hits) { g.fillStyle = P.ac; g.fill(); g.strokeStyle = 'rgba(255,255,255,0.6)'; g.lineWidth = 1.5; }
            else { g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 2; }
            g.stroke();
            g.restore();
          }

          if (flash > 0) { g.fillStyle = 'rgba(255,51,85,' + (flash * 0.6).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }

          // vignette
          var vg = g.createRadialGradient(HX, H * 0.45, H * 0.25, HX, H * 0.45, H * 0.75);
          vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.42)');
          g.fillStyle = vg; g.fillRect(0, 0, W, H);
          g.restore();
        },

        result: function () { return done; },
        timeout: function () { if (done !== 'pending') return done; return hits >= NEED ? 'won' : 'lost'; },
        line: function () {
          return why === 'foul' ? 'you high-fived the party foul' : 'the beat went on without you';
        },
        hint: function () {
          if (done !== 'pending') return { type: 'wait', ms: 120 };
          var nxt = null;
          for (var i = 0; i < targets.length; i++) {
            var tg = targets[i];
            if (!tg.judged && (!nxt || tg.landT < nxt.landT)) nxt = tg;
          }
          if (!nxt) return { type: 'wait', ms: 100 };
          var rem = nxt.landT - t;
          if (nxt.red) return { type: 'wait', ms: Math.max(60, Math.min(400, (rem + GW) * 1000 + 60)) };
          if (rem <= 0.05) return { type: 'tap', x: HX, y: HY };
          return { type: 'wait', ms: Math.max(16, Math.min(110, (rem - 0.03) * 1000)) };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - 4 rings spawn per round (3 in the level accent color, exactly 1 red at index >=1),
     each landing on an integer musical beat (2/4/6/8 at d0, 2/3/5/6 at d1, 2/3/4/5 at d2),
     converging over approach = clamp(2*beatLen, 0.7, 1.2)s onto the dashed halo at HR*1.12.
   - A tap is judged against the NEAREST unjudged target in time using t - env.calib:
     err <= 0.085 = PERFECT (squash + shake 3 + 14 confetti), err <= GW (0.17/0.155/0.12 by
     difficulty) = GOOD; tapping the red = instant 'lost' (scratch sfx, PARTY FOUL, shake 7).
   - Letting any non-red ring pass landT + GW = instant 'lost' (sfxMiss, MISSED, tape-stop,
     gray cracked heart at 0.85 scale, dancers flee at 240*sc).
   - 'won' fires only when hits >= 3 AND the red target is resolved (dodged or absent from
     play): encore sweep + 4-note rise, 36 gold confetti, praise word by perfect count.
   - timeout() returns 'won' iff hits >= 3, else 'lost'.
   - Red ring is triple-marked: #ff3355 + center X cross + 3.5px x-wobble at 16rad/s, and
     announces itself with a low scratch rasp the frame it becomes visible.
   BUG-IS-GAME (do not fix):
   - Tap position is ignored during play — the whole screen is the button; no hitbox.
   - A correct red dodge is usually SILENT: the 'nice dodge' popup pre-rolls at only 35%.
   - Judgment picks the nearest target in TIME, never by ring you were "aiming" at.
   - Kick/clap/hat play from the first frame including the count-in beat, with no rings —
     the empty first bar is the donor's musical count-in, not a spawner bug.
*/

/* ===== carts/16-sugar.js ===== */
/* SUGAR HALF-LIFE — steer the light-orb through candy before it curdles; sweetness decays */
(function () {
  registerGame({
    id: 'sugar',
    title: 'SUGAR HALF-LIFE',
    command: 'SWEEP UP!',
    family: 'drag',
    slotBeats: 8,
    create(env) {
      const W = env.W, H = env.H, TAU = Math.PI * 2;
      // donor palette — candy stays candy
      const CANDY = ['#ff4d9d', '#ff8a3d', '#35e0e8', '#b36bff', '#ffe066'];
      const ROT = '#7a8b3f', BLOOD = '#8b1e3f', SUGAR = '#fff4fb', PINK = '#ff4d9d',
        TANG = '#ff8a3d', LABEL = '#a98fc0';
      const SCALE = [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24]; // minor pentatonic climb
      const F9 = (px) => '900 ' + px + 'px "Arial Black","Segoe UI Black",sans-serif';
      const FM = (px) => '700 ' + px + 'px "Consolas","Courier New",monospace';
      const CFG = [
        { n: 4, quota: 4, decay: 0.20, drain: 0.14, spd: 1 },
        { n: 6, quota: 5, decay: 0.28, drain: 0.18, spd: 1 },
        { n: 7, quota: 6, decay: 0.36, drain: 0.22, spd: 1.5 }, // donor speeds x1.5
      ][env.difficulty];
      const FRESH0 = [1.0, 0.95, 0.85, 0.75, 0.70, 0.65, 0.60]; // staggered ring-drain moments

      // ---- state ----
      let t = 0, bgT = 0, humT = 0;
      let done = 'pending', failMode = '';
      let px = 195, py = 510, tx = 195, ty = 510, life = 1; // orb; donor player.r = 15
      let eaten = 0, score = 0, combo = 0, comboTimer = 0;
      let shake = 0, shX = 0, shY = 0, flash = 0, flashCol = PINK;
      let vig = null; // vignette gradient, built lazily on first render
      const sweets = [], rots = [], parts = [], floats = [], trail = [];

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const hexA = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + clamp01(a).toFixed(3) + ')';
      };

      // ---- donor audio recipes (via env.audio) ----
      const blip = (step, fresh) => { // called with post-increment combo: SCALE[0] never plays (kept)
        const f = 220 * Math.pow(2, SCALE[Math.min(step, SCALE.length - 1)] / 12);
        env.audio.tone({ f, type: 'triangle', dur: 0.15, vol: 0.12 + fresh * 0.10 });
        if (step > 4) env.audio.tone({ f: f * 2, type: 'sine', dur: 0.1, vol: 0.05 }); // sparkle harmonic
      };
      const rotHit = () => { // donor: saw 140->60 through a 600 Hz lowpass; noise stands in for the wet
        env.audio.tone({ f: 140, f2: 60, type: 'sawtooth', dur: 0.26, vol: 0.12 });
        env.audio.noise({ dur: 0.18, vol: 0.05, lp: 600 });
      };
      const deathSound = () => env.audio.tone({ f: 200, f2: 40, type: 'sine', dur: 1.0, vol: 0.25 }); // long sad power-down

      // ---- fx ----
      function burst(x, y, n, power, col) {
        for (let i = 0; i < n; i++) {
          if (parts.length > 120) parts.shift();
          const a = env.rng() * TAU, sp = (30 + env.rng() * 160) * power;
          parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, sz: 2 + env.rng() * 2.5, col });
        }
      }
      function float(x, y, txt, col) {
        floats.push({ x, y, txt, col, age: 0 });
        if (floats.length > 8) floats.shift();
      }

      // ---- world seeding (inner field only, staggered freshness) ----
      function spawnSweet(fresh, fx, fy) {
        let x = fx, y = fy, tries = 0;
        while (fx === undefined) {
          x = 40 + env.rng() * 310; y = 130 + env.rng() * 600;
          const clear = Math.hypot(x - 195, y - 510) > 100 &&
            sweets.every((o) => Math.hypot(x - o.x, y - o.y) > 70);
          if (clear || ++tries > 24) break;
        }
        const a = env.rng() * TAU, sp = (12 + env.rng() * 26) * CFG.spd;
        sweets.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          r: 16 + env.rng() * 10, fresh, col: CANDY[Math.min(4, (env.rng() * 5) | 0)],
          wob: env.rng() * TAU,
        });
      }
      const seedN = env.difficulty === 1 ? CFG.n - 1 : CFG.n;
      for (let i = 0; i < seedN; i++) spawnSweet(FRESH0[i]);
      if (env.difficulty === 1) // one half-stale candy in a corner — teaches triage
        spawnSweet(0.55, env.rng() < 0.5 ? 55 + env.rng() * 30 : 305 + env.rng() * 30,
          env.rng() < 0.5 ? 150 + env.rng() * 45 : 635 + env.rng() * 45);
      if (env.difficulty === 2) { // one rot already wandering mid-field at arm
        const a = env.rng() * TAU, sp = 6 + env.rng() * 13;
        rots.push({ x: 110 + env.rng() * 170, y: 280 + env.rng() * 280, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 20 + env.rng() * 8, life: 1, wob: env.rng() * TAU, sfx: 0 });
      }

      function curdleSweet(i) { // fresh hit 0 — candy becomes hazard, silently (donor has no curdle sfx)
        const s = sweets[i];
        sweets.splice(i, 1);
        rots.push({ x: s.x, y: s.y, vx: s.vx * 0.5, vy: s.vy * 0.5, r: s.r + 2, life: 1, wob: s.wob, sfx: 0 });
        burst(s.x, s.y, 8, 0.7, ROT);
      }
      function eat(i) {
        const s = sweets[i];
        sweets.splice(i, 1);
        eaten++; combo++; comboTimer = 1.15;
        const f = clamp01(s.fresh);
        const gained = Math.max(1, Math.round((6 + s.r) * f * (1 + combo * 0.35)));
        score += gained;
        life = Math.min(1, life + 0.045 + f * 0.05);
        shake = Math.min(shake + 3 + f * 3, 14);
        flash = Math.min(flash + 0.25, 0.6); flashCol = s.col;
        burst(s.x, s.y, 10 + (combo > 3 ? 8 : 0), 1 + f * 0.6, s.col);
        float(s.x, s.y - 22, '+' + gained, s.col);
        blip(combo, f);
        if (eaten >= CFG.quota) { // WIN — resolve early, full sparkle
          done = 'won';
          flash = 0.6; flashCol = s.col;
          shake = 14;
          burst(px, py, 26, 1.6, s.col);
          env.audio.tone({ f: 220 * Math.pow(2, 19 / 12), type: 'triangle', dur: 0.16, vol: 0.2 });
          env.audio.tone({ f: 220 * Math.pow(2, 24 / 12), type: 'triangle', dur: 0.2, vol: 0.18, t: 0.07 });
          env.audio.tone({ f: 440 * Math.pow(2, 24 / 12), type: 'sine', dur: 0.12, vol: 0.06, t: 0.07 });
        }
      }

      return {
        step(dt, inp) {
          t += dt; bgT += dt * 0.05;
          const armed = env.armed();
          if (done === 'pending' && inp.down) { tx = inp.x; ty = inp.y; } // touch anywhere = steer
          const k = 1 - Math.pow(0.0009, dt); // donor: 'fast lerp = weighty but instant'
          px += (tx - px) * k; py += (ty - py) * k;
          trail.push({ x: px, y: py });
          if (trail.length > 16) trail.shift();

          if (done === 'pending') {
            humT -= dt; // 55/82.5 Hz sub hum (perfect fifth), retriggered as a crossfade
            if (humT <= 0) {
              env.audio.tone({ f: 55, type: 'sine', dur: 0.75, vol: 0.045, attack: 0.3 });
              env.audio.tone({ f: 82.5, type: 'sine', dur: 0.75, vol: 0.03, attack: 0.3 });
              humT = 0.5;
            }
            const mv = armed ? 1 : 0.5; // count-in = attract mode, half drift, no decay
            for (const s of sweets) {
              s.x += s.vx * dt * mv; s.y += s.vy * dt * mv;
              if (s.x < 20 && s.vx < 0) s.vx *= -1;
              if (s.x > W - 20 && s.vx > 0) s.vx *= -1;
              if (s.y < 20 && s.vy < 0) s.vy *= -1;
              if (s.y > H - 20 && s.vy > 0) s.vy *= -1;
              s.wob += dt * 4;
              if (armed) s.fresh -= CFG.decay * dt;
            }
            for (let i = sweets.length - 1; i >= 0; i--) if (sweets[i].fresh <= 0) curdleSweet(i);
            for (let i = rots.length - 1; i >= 0; i--) {
              const r = rots[i];
              r.x += r.vx * dt * mv; r.y += r.vy * dt * mv;
              r.wob += dt * 3;
              r.sfx = Math.max(0, r.sfx - dt);
              if (armed) {
                r.life -= dt * 0.35; // ~3s lifespan
                if (r.life <= 0) { burst(r.x, r.y, 5, 0.5, ROT); rots.splice(i, 1); }
              }
            }
            if (armed && done === 'pending') {
              for (let i = sweets.length - 1; i >= 0 && done === 'pending'; i--) {
                const s = sweets[i], dx = s.x - px, dy = s.y - py;
                if (dx * dx + dy * dy < (s.r + 15) * (s.r + 15)) eat(i); // just be there — no click
              }
            }
            if (armed && done === 'pending') {
              for (const r of rots) {
                if (Math.hypot(r.x - px, r.y - py) < r.r + 15) {
                  life -= 0.55 * dt; // continuous drain while touching
                  combo = 0; comboTimer = 0;
                  shake = Math.min(shake + 2, 12);
                  flash = Math.min(flash + 0.15, 0.5); flashCol = BLOOD;
                  if (r.sfx <= 0) { rotHit(); r.sfx = 0.25; }
                }
              }
              if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }
              life -= CFG.drain * dt; // the half-life: always falling
              if (life <= 0) {
                life = 0; done = 'lost'; failMode = 'drained';
                deathSound();
                flash = 0.5; flashCol = BLOOD;
              }
            }
          }
          // fx decay always
          shake = Math.max(0, shake - dt * 40);
          if (shake > 0) { shX = (env.rng() * 2 - 1) * shake; shY = (env.rng() * 2 - 1) * shake; }
          else { shX = 0; shY = 0; }
          flash = Math.max(0, flash - dt * 1.8);
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.life -= dt * 1.6;
            if (p.life <= 0) { parts.splice(i, 1); continue; }
            p.vx *= 0.92; p.vy *= 0.92; // per-frame friction (fixed 60fps)
            p.x += p.vx * dt; p.y += p.vy * dt;
          }
          for (let i = floats.length - 1; i >= 0; i--) {
            floats[i].age += dt;
            if (floats[i].age > 0.8) floats.splice(i, 1);
          }
        },

        render(g) {
          const armed = env.armed();
          g.save();
          g.translate(shX, shY);
          // (1) plum radial bg, center slowly drifting, 40px overscan for shake
          const bx = W * 0.5 + Math.sin(bgT) * W * 0.1, by = H * 0.42 + Math.cos(bgT * 0.8) * H * 0.1;
          const bg = g.createRadialGradient(bx, by, 0, bx, by, H * 0.85);
          bg.addColorStop(0, '#22102f'); bg.addColorStop(0.55, '#160a22'); bg.addColorStop(1, '#0b0512');
          g.fillStyle = bg; g.fillRect(-40, -40, W + 80, H + 80);
          // (2) additive world
          g.globalCompositeOperation = 'lighter';
          // (3) rots first, so candy pops
          for (const r of rots) {
            const a = clamp01(r.life), rx = r.x + Math.sin(r.wob) * 2, ry = r.y;
            const gr = g.createRadialGradient(rx, ry, 0, rx, ry, r.r * 2.4);
            gr.addColorStop(0, 'rgba(139,30,63,' + (0.5 * a).toFixed(3) + ')');
            gr.addColorStop(0.5, 'rgba(122,139,63,' + (0.35 * a).toFixed(3) + ')');
            gr.addColorStop(1, 'rgba(122,139,63,0)');
            g.fillStyle = gr; g.beginPath(); g.arc(rx, ry, r.r * 2.4, 0, TAU); g.fill();
            g.fillStyle = 'rgba(74,86,38,' + (0.85 * a).toFixed(3) + ')';
            g.beginPath(); g.arc(rx, ry, r.r * 0.7, 0, TAU); g.fill();
          }
          // (4) sweets — shrink and dim as they stale; ring is the per-candy timer
          for (const s of sweets) {
            const f = clamp01(armed ? s.fresh : 0.55 + Math.sin(t + s.wob) * 0.35); // count-in: pulse, never curdle
            const rad = s.r * (0.6 + f * 0.5);
            const sx = s.x + Math.sin(s.wob) * 2, sy = s.y;
            const gl = g.createRadialGradient(sx, sy, 0, sx, sy, rad * 3);
            gl.addColorStop(0, hexA(s.col, 0.55 * f)); gl.addColorStop(1, hexA(s.col, 0));
            g.fillStyle = gl; g.beginPath(); g.arc(sx, sy, rad * 3, 0, TAU); g.fill();
            g.fillStyle = hexA(s.col, 0.35 + 0.6 * f);
            g.beginPath(); g.arc(sx, sy, rad, 0, TAU); g.fill();
            g.strokeStyle = hexA(s.col, 0.75); g.lineWidth = 2.5;
            g.beginPath(); g.arc(sx, sy, rad + 6, -Math.PI / 2, -Math.PI / 2 + f * 6.2832); g.stroke();
            g.fillStyle = 'rgba(255,255,255,' + (0.5 * f).toFixed(3) + ')';
            g.beginPath(); g.arc(sx - rad * 0.25, sy - rad * 0.25, rad * 0.28, 0, TAU); g.fill();
          }
          // (5) particles
          for (const p of parts) {
            g.fillStyle = hexA(p.col, clamp01(p.life));
            g.beginPath(); g.arc(p.x, p.y, Math.max(0.5, p.sz * p.life), 0, TAU); g.fill();
          }
          // (6) player — trail, aura, hot core: a hand-held ball of light
          for (let i = 0; i < trail.length; i++) {
            const a = (i + 1) / trail.length;
            g.fillStyle = 'rgba(255,77,157,' + (0.18 * a).toFixed(3) + ')';
            g.beginPath(); g.arc(trail[i].x, trail[i].y, 2 + 5 * a, 0, TAU); g.fill();
          }
          const pulse = 1 + Math.sin(bgT * 40) * 0.06;
          const ar = 15 * 3.4 * pulse;
          const au = g.createRadialGradient(px, py, 0, px, py, ar);
          au.addColorStop(0, 'rgba(255,255,255,0.9)');
          au.addColorStop(0.25, 'rgba(255,77,157,0.7)');
          au.addColorStop(0.6, 'rgba(179,107,255,0.3)');
          au.addColorStop(1, 'rgba(179,107,255,0)');
          g.fillStyle = au; g.beginPath(); g.arc(px, py, ar, 0, TAU); g.fill();
          g.fillStyle = done === 'lost' ? 'rgba(255,244,251,0.35)' : SUGAR;
          g.beginPath(); g.arc(px, py, 15 * 0.62, 0, TAU); g.fill();
          // (7) back to source-over: eat-flash in the candy's own hue
          g.globalCompositeOperation = 'source-over';
          if (flash > 0) {
            g.globalAlpha = flash * 0.25;
            g.fillStyle = flashCol; g.fillRect(-40, -40, W + 80, H + 80);
            g.globalAlpha = 1;
          }
          // (8) vignette
          if (!vig) {
            vig = g.createRadialGradient(W / 2, H / 2, 0.3 * Math.min(W, H), W / 2, H / 2, 0.72 * Math.max(W, H));
            vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.55)');
          }
          g.fillStyle = vig; g.fillRect(-40, -40, W + 80, H + 80);
          // shared marking: ink rim on the orb, 8th-note pulse, first ~1.5s only
          if (t < 1.5) {
            const e8 = 1 - ((env.beatPhase() * 2) % 1);
            g.globalAlpha = 0.25 + 0.5 * e8 * e8;
            g.strokeStyle = env.ink; g.lineWidth = 2;
            g.beginPath(); g.arc(px, py, 21, 0, TAU); g.stroke();
            g.globalAlpha = 1;
          }
          // score floats — feedback above the touch point
          for (const fl of floats) {
            const kk = fl.age / 0.8;
            g.globalAlpha = 1 - kk; g.textAlign = 'center'; g.font = F9(15);
            g.fillStyle = fl.col; g.fillText(fl.txt, fl.x, fl.y - kk * 46);
            g.globalAlpha = 1;
          }
          // ---- HUD, all in the top third ----
          g.textAlign = 'left'; g.font = F9(20);
          g.fillStyle = PINK; g.fillText(score, 16, 46); // donor hard-shadow
          g.fillStyle = SUGAR; g.fillText(score, 14, 44);
          g.font = FM(9); g.fillStyle = LABEL; g.fillText('sweetness', 14, 58);
          if (combo >= 2) {
            g.textAlign = 'right';
            g.font = F9(14 * (1 + Math.min(combo, 12) * 0.05));
            g.fillStyle = TANG; g.fillText('×' + combo, W - 14, 48);
          }
          // quota pips — lit candy = still to sweep, husk = eaten
          const pw = 20, px0 = W / 2 - ((CFG.quota - 1) * pw) / 2;
          for (let i = 0; i < CFG.quota; i++) {
            const x = px0 + i * pw, y = 64, c = CANDY[i % 5];
            if (i < eaten) {
              g.globalAlpha = 0.25; g.strokeStyle = c; g.lineWidth = 1.5;
              g.beginPath(); g.arc(x, y, 4, 0, TAU); g.stroke(); g.globalAlpha = 1;
            } else {
              g.fillStyle = c; g.beginPath(); g.arc(x, y, 5, 0, TAU); g.fill();
              g.fillStyle = 'rgba(255,255,255,0.6)';
              g.beginPath(); g.arc(x - 1.5, y - 1.5, 1.6, 0, TAU); g.fill();
            }
          }
          // half-life bar (moved to top third for thumb clearance; donor gradient kept)
          const bw = 200, bxx = W / 2 - bw / 2, byy = 82, bh = 12;
          const rr = (x, y, w, h, r) => {
            g.beginPath(); g.moveTo(x + r, y);
            g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
            g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
          };
          g.fillStyle = 'rgba(255,255,255,0.06)'; rr(bxx, byy, bw, bh, 6); g.fill();
          const low = life < 0.25;
          const lg = g.createLinearGradient(bxx, 0, bxx + bw, 0);
          if (low) { lg.addColorStop(0, BLOOD); lg.addColorStop(1, ROT); }
          else { lg.addColorStop(0, PINK); lg.addColorStop(0.5, TANG); lg.addColorStop(1, '#35e0e8'); }
          g.save();
          rr(bxx, byy, bw, bh, 6); g.clip();
          g.globalAlpha = low ? 0.7 + 0.3 * Math.sin(t * 12.6) : 1; // silent alarm pulse
          g.fillStyle = lg; g.fillRect(bxx, byy, bw * life, bh);
          g.restore();
          g.textAlign = 'center'; g.font = FM(9); g.fillStyle = LABEL;
          g.fillText('h a l f · l i f e', W / 2, byy - 5);
          g.restore();
        },

        result: () => done,
        timeout() { // bell: quota met = won; unmet = the survivors curdle as the sting
          if (done === 'won' || eaten >= CFG.quota) return 'won';
          if (done === 'pending') {
            failMode = 'bell';
            for (let i = sweets.length - 1; i >= 0; i--) curdleSweet(i);
            rotHit();
            deathSound();
            flash = 0.4; flashCol = BLOOD;
            done = 'lost';
          }
          return 'lost';
        },
        line: () => failMode === 'drained'
          ? 'YOUR HALF-LIFE HIT ZERO. ON BRAND.'
          : 'THE CANDY CURDLED ON YOUR WATCH',
        hint() { // sweep the stalest candy first — its ring dies soonest
          if (done !== 'pending') return { type: 'wait', ms: 200 };
          let best = null, bestF = 2;
          for (const s of sweets) if (s.fresh < bestF) { bestF = s.fresh; best = s; }
          if (!best) return { type: 'wait', ms: 100 };
          const hx = Math.max(20, Math.min(W - 20, best.x));
          const hy = Math.max(40, Math.min(H - 30, best.y));
          return { type: 'hold', x: hx, y: hy, ms: 130 };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - The orb chases the touch with k = 1 - 0.0009^dt (~0.14s lag) from frame one; eating is
     pure circle overlap dist^2 < (s.r + 15)^2 with no tap needed, disabled until env.armed().
   - Quota (4 / 5 / 6 at difficulty 0/1/2) reached sets 'won' at the eat itself: flash 0.6 in
     that candy's hue, shake 14, 26-particle burst, and a two-note pentatonic-top flourish
     (SCALE 19 then 24) with a sine sparkle — unmistakable within one frame.
   - Each chained eat plays the triangle blip at 220*2^(SCALE[combo]/12) with combo counted
     AFTER increment, vol 0.12 + fresh*0.10, sparkle harmonic past x5; combo window 1.15s.
   - A candy at fresh <= 0 curdles into a rot (half velocity, r+2, ~3s life, 8 olive particles,
     no sound); touching a rot drains 0.55/s, zeroes combo every frame, splats at most every
     0.25s per rot. Life 0 while armed = 'lost' + 200->40 Hz power-down.
   - timeout(): 'won' if eaten >= quota, else every surviving candy curdles on-screen with the
     olive pop + splat + power-down and 'lost'.
   - Difficulty knobs: decay 0.20/0.28/0.36 per s, drain 0.14/0.18/0.22 per s, candy drift
     x1.5 at difficulty 2; diff 1 seeds one fresh-0.55 corner candy, diff 2 pre-seeds one rot.
   BUG-IS-GAME (do not fix):
   - blip() gets the post-increment combo, so SCALE[0] (the 220 Hz root) never plays — the
     first eat already sounds at +3 semitones. The chain's voice; leave the index alone.
   - Eat overlap uses the BASE radius s.r while a stale candy is drawn at s.r*(0.6+f*0.5) —
     stale candy looks smaller than its hitbox. Generous on purpose; don't shrink the check.
   - Releasing the finger parks the target where it was: the orb glides there and idles while
     its half-life keeps draining. No auto-follow, no idle penalty — idling to death is legal.
   - Rot contact re-zeroes the combo EVERY frame and drains continuously — per-second
     punishment with only the sfx throttled, exactly as the donor feels.
   - The count-in runs attract-mode rules: half drift speed, fresh pulses 0.55 + sin*0.35 and
     never curdles, then snaps to the seeded staggered values at arm. That snap is the start.
*/

/* ===== carts/17-finale.js ===== */
/* FINALE — beat the fuse: tap the shell while its white ring is open and its firework becomes yours */
(function () {
  // palette — donor js/config.js COL, quoted
  var SKY_TOP = '#070912', SKY_BOT = '#131A3A', SKY_GLOW = '#1D2A5E';
  var CITY = '#05070E', ROOF = '#0C1226', WIN = '#F2C46A', CROWD = '#0B1020';
  var HULL = '#6B2E8F', TRIM = 'rgba(233,168,255,0.75)', CORE = '#FF2D6F';
  var DANGER = '#FF2D6F', MINE_A = '#5FF7FF', MINE_B = '#B8FFEA', PEA = '#3FA6C8', ACCENT = '#FFD166';
  var TAU = Math.PI * 2;

  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function ss(k) { k = clamp(k, 0, 1); return k * k * (3 - 2 * k); }
  // donor game.js drawEnemies casing, verbatim vertices
  function casing(g, r) {
    g.beginPath();
    g.moveTo(0, -r); g.lineTo(r * 0.78, -r * 0.2); g.lineTo(r * 0.5, r * 0.85);
    g.lineTo(-r * 0.5, r * 0.85); g.lineTo(-r * 0.78, -r * 0.2);
    g.closePath();
  }
  // donor atlas.js drawDiamond, verbatim vertices (nose R*1.75 faces +x)
  function diamond(g, R) {
    g.beginPath();
    g.moveTo(R * 1.75, 0); g.lineTo(0, R * 0.72); g.lineTo(-R * 0.85, 0); g.lineTo(0, -R * 0.72);
    g.closePath(); g.fill();
  }
  function diamondCore(g, R) {
    g.beginPath();
    g.moveTo(R * 0.9, 0); g.lineTo(0, R * 0.3); g.lineTo(-R * 0.3, 0); g.lineTo(0, -R * 0.3);
    g.closePath(); g.fill();
  }

  registerGame({
    id: 'finale', title: 'FINALE', command: 'BEAT THE FUSE!', family: 'tap', slotBeats: 8,
    create(env) {
      var W = env.W, H = env.H, D = env.difficulty, R = env.rng;

      // ---- baked-at-create world (arrays only; no offscreen canvases allowed here) ----
      var stars = [], farB = [], nearB = [], wins = [], crowd = [];
      var i, k, b;
      for (i = 0; i < 40; i++) stars.push({ x: R() * W, y: 4 + R() * H * 0.52, a: 0.10 + R() * 0.24, s: R() < 0.16 ? 1.6 : 1 });
      for (i = 0; i < 9; i++) farB.push({ x: i * (W / 9) + (R() - 0.5) * 26 - 8, w: 36 + R() * 44, roof: 596 + R() * 74, mast: 0 });
      for (i = 0; i < 8; i++) nearB.push({ x: i * (W / 8) + (R() - 0.5) * 30 - 10, w: 44 + R() * 52, roof: 676 + R() * 92, mast: R() < 0.22 ? 12 + R() * 16 : 0 });
      function placeWins(list, far, budget) {
        var px = far ? 9 : 11, py = far ? 12 : 15, cw = far ? 2 : 3, ch = far ? 3 : 4, n = 0;
        for (var q = 0; q < list.length; q++) {
          var bb = list[q], cols = ((bb.w - 8) / px) | 0, rows = Math.min(far ? 4 : 5, ((H - 14 - bb.roof) / py) | 0);
          for (var r0 = 0; r0 < rows; r0++) for (var c0 = 0; c0 < cols; c0++) {
            if (n >= budget) return;
            if (R() > 0.55) continue;
            wins.push({ x: bb.x + 5 + c0 * px, y: bb.roof + 7 + r0 * py, w: cw, h: ch, far: far, on: R() < 0.55 });
            n++;
          }
        }
      }
      placeWins(farB, true, 55); placeWins(nearB, false, 55);
      for (i = 0; i < nearB.length && crowd.length < 14; i++) {
        b = nearB[i];
        if (b.roof < 690 || b.w < 36) continue;
        var np = 2 + ((R() * 3) | 0);
        for (k = 0; k < np && crowd.length < 14; k++)
          crowd.push({ x: b.x + 8 + R() * (b.w - 16), y: b.roof, ph: R() * TAU, up: false });
      }

      // ---- the shell (big, slow, high — top 2/3 always) ----
      var SHR = [34, 31, 29][D];
      var SH = {
        r: SHR, hx: 105 + R() * 180, hy: 235 + R() * 85,
        x: 0, y: 0, t: 0, hitFlash: 0, dead: false,
      };
      var startX = clamp(SH.hx + (R() - 0.5) * 90, 50, W - 50);
      var enterT = 0, ENTER = 0.9;             // donor cadenceT settle: a shell never asks instantly

      // cascade fodder: two little shells the petals will ignite (the flourish frame)
      var echoes = [];
      for (i = 0; i < 2; i++) {
        var sgn = i === 0 ? -1 : 1;
        echoes.push({
          x0: clamp(SH.hx + sgn * (88 + R() * 55), 42, W - 42),
          y0: clamp(SH.hy + (R() - 0.5) * 190, 150, 430),
          x: 0, y: 0, r: 13, ph: R() * TAU, t: 0, ig: 0, dead: false,
        });
      }

      // ---- fuse timing (difficulty shortens the window; d2 adds a fake shimmer) ----
      var FUSE = [1.2, 0.85, 0.65][D];
      var wOpen = 0.55 + R() * 0.30;           // seconds after armed; granted on the next 1/8
      var fakeAt = D === 2 ? Math.max(0.16, wOpen - (0.45 + R() * 0.2)) : -1;
      var TAPR = [80, 74, 70][D];              // generous positional radius
      var open = false, fired = false, fuseT = 0, whT = 0, fakeDone = false;

      // ---- actors / fx state ----
      var ship = { x: W * 0.5, y: 686, dead: false, fireT: 0.05, volley: 0, tx: [], ty: [], tn: 0 };
      for (i = 0; i < 8; i++) { ship.tx.push(ship.x); ship.ty.push(ship.y); }
      var peas = [], petals = [], reds = [], sparks = [], flashes = [], rings = [];
      var t = 0, tA = 0, prevPh = env.beatPhase();
      var done = 'pending', why = 'late', chain = 0;
      var hs = 0, shakeT = 0, shakeMag = 0, skyFlash = 0, allLit = false, waveT = -1;
      var tickT = 0, notYetT = 0, flinch = 0;
      var RELIGHT = 0.42;                      // beat of dark between fuses

      // ---- donor-synth sfx on the shell bus ----
      function sPea() { env.audio.tone({ f: 900, type: 'triangle', dur: 0.025, vol: 0.028 }); }
      function sTick() { env.audio.tone({ f: 1400, type: 'sine', dur: 0.012, vol: 0.02 }); }
      function sFake() { env.audio.tone({ f: 380, f2: 470, type: 'sine', dur: 0.11, vol: 0.06 }); }
      function sOpen() { env.audio.noise({ dur: 0.05, vol: 0.09, hp: 2600 }); }
      function sWhistle(frac) {                // 380->1250Hz rising countdown, in stoppable segments
        var f = 380 * Math.pow(1250 / 380, frac);
        var f2 = 380 * Math.pow(1250 / 380, Math.min(1, frac + 0.11 / FUSE));
        env.audio.tone({ f: f, f2: f2, type: 'sine', dur: 0.12, vol: 0.13, attack: 0.012 });
      }
      function sBloomBlue(petalN, ch) {        // ascending noise bloom + 62Hz thump
        var g0 = Math.min(0.28, 0.10 + 0.004 * petalN) * 1.5;
        env.audio.noise({ dur: 0.22, vol: g0, hp: 500, lp: 2600 });
        env.audio.tone({ f: 1200 * Math.pow(2, Math.min(ch, 30) / 24), f2: 220, type: 'sine', dur: 0.22, vol: 0.2 });
        env.audio.tone({ f: 62, type: 'sine', dur: 0.18, vol: 0.26 });
      }
      function sBloomRed() {                   // duller by design: failure is heard, never buzzered
        env.audio.noise({ dur: 0.26, vol: 0.18, hp: 140, lp: 760 });
        env.audio.tone({ f: 300, f2: 120, type: 'sine', dur: 0.05, vol: 0.17 });
      }
      function sDud() { env.audio.tone({ f: 240, f2: 200, type: 'sine', dur: 0.05, vol: 0.07 }); }
      function sNotYet() { env.audio.tone({ f: 190, type: 'sine', dur: 0.035, vol: 0.05 }); }
      function sDeath() { env.audio.tone({ f: 55, type: 'sine', dur: 1.1, vol: 0.2 }); env.audio.noise({ dur: 0.12, vol: 0.2, lp: 900 }); }

      // ---- fx spawners ----
      function burst(x, y, n, c, sp) {
        var ph = R() * TAU;                    // stacked blooms never align into a grid
        for (var q = 0; q < n && petals.length < 40; q++) {
          var a = ph + q / n * TAU;
          petals.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 1.8, c: c });
        }
      }
      function sparksAt(x, y, n) {
        for (var q = 0; q < n && sparks.length < 40; q++) {
          var a = R() * TAU, sp = 150 + R() * 190;
          sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, t: 0, life: 0.30 + R() * 0.28, c: q & 1 ? '#FFFFFF' : MINE_A });
        }
      }
      function bloomAt(x, y, petalN, c, ringC) {
        burst(x, y, petalN, c, 320);           // SPARK volley speed 200 * PETAL_SPEED_MULT 1.6
        if (flashes.length < 6) flashes.push({ x: x, y: y, r0: 18 + 1.4 * petalN, t: 0, c: '#FFFFFF' });
        if (rings.length < 6) rings.push({ x: x, y: y, r0: SHR, t: 0, c: ringC });
        sparksAt(x, y, Math.min(14, 4 + (petalN >> 2)));
        skyFlash = Math.max(skyFlash, Math.min(1, 0.28 + petalN * 0.011));
      }
      function winNow() {
        done = 'won'; open = false; SH.dead = true; chain = 1;
        hs = 0.045;                            // donor HITSTOP_FUSEKILL_BIG
        shakeT = 0.25; shakeMag = 3;
        bloomAt(SH.x, SH.y, 12, MINE_A, MINE_A);
        allLit = true; waveT = 0;
        sBloomBlue(12, 1);
      }
      function volley() {                       // the shell answers; the round continues
        var aim0 = Math.atan2(ship.y - SH.y, ship.x - SH.x);
        for (var v = 0; v < 5; v++) {
          var av = aim0 + (v - 2) / 4 * (46 * Math.PI / 180);
          reds.push({ x: SH.x, y: SH.y, vx: Math.cos(av) * 200, vy: Math.sin(av) * 200 });
        }
        if (flashes.length < 6) flashes.push({ x: SH.x, y: SH.y, r0: 26, t: 0, c: DANGER });
        if (rings.length < 6) rings.push({ x: SH.x, y: SH.y, r0: SHR, t: 0, c: DANGER });
        shakeT = 0.2; shakeMag = 2;
        sBloomRed();
      }
      function redBloom(reason) {
        done = 'lost'; why = reason; open = false; fired = true;
        var aim = Math.atan2(ship.y - SH.y, ship.x - SH.x);
        for (var q = 0; q < 5; q++) {          // donor SPARK volley: fan n:5 spread:46 speed:200 aimed
          var a = aim + (q - 2) / 4 * (46 * Math.PI / 180);
          reds.push({ x: SH.x, y: SH.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200 });
        }
        if (flashes.length < 6) flashes.push({ x: SH.x, y: SH.y, r0: 26, t: 0, c: DANGER });
        if (rings.length < 6) rings.push({ x: SH.x, y: SH.y, r0: SHR, t: 0, c: DANGER });
        shakeT = 0.2; shakeMag = 2;
        sBloomRed();
      }

      return {
        step(dt, inp) {
          var ph = env.beatPhase();
          var eighth = (prevPh < 0.5 && ph >= 0.5) || ph < prevPh;
          prevPh = ph;
          if (hs > 0) {                        // the world freezes; the shake keeps wobbling
            hs -= dt;
            if (shakeT > 0) shakeT -= dt * 0.4;
            return;
          }
          t += dt;
          if (env.armed()) tA += dt;
          SH.t += dt;
          if (SH.hitFlash > 0) SH.hitFlash -= dt;
          if (shakeT > 0) shakeT -= dt;
          if (skyFlash > 0) skyFlash -= 4.5 * dt;
          tickT -= dt; notYetT -= dt; flinch = Math.max(0, flinch - dt);

          // shell + echoes ease in, then breathe (donor enterHold)
          var ek = enterT < ENTER ? ss(enterT / ENTER) : 1;
          if (enterT < ENTER) enterT += dt;
          if (!SH.dead) {
            SH.x = startX + (SH.hx - startX) * ek + Math.sin(SH.t * 0.9) * 14 * ek;
            SH.y = -70 + (SH.hy + 70) * ek + Math.sin(SH.t * 1.4) * 7 * ek;
          }
          for (var q = 0; q < echoes.length; q++) {
            var e = echoes[q];
            e.t += dt;
            if (e.dead) continue;
            e.x = e.x0 + Math.sin(e.t * 0.9 + e.ph) * 10 * ek;
            e.y = (e.y0 - 60) + 60 * ek + Math.sin(e.t * 1.4 + e.ph) * 5 * ek;
            if (e.ig > 0) {                    // petal lit this fuse; it blooms a beat later
              e.ig -= dt;
              if (e.ig <= 0) {
                e.dead = true; chain++;
                bloomAt(e.x, e.y, 8, chain >= 2 ? MINE_B : MINE_A, MINE_B);
                hs = Math.max(hs, 0.03); shakeT = 0.2; shakeMag = 2;
                sBloomBlue(8, chain);
              }
            }
          }

          // ship autopilot: parks under the shell — you are the aim, even hands-free
          if (!ship.dead) {
            var wx = SH.dead ? ship.x : clamp(SH.x, 24, W - 24);
            var dx = wx - ship.x, mx = 250 * dt;
            ship.x += Math.abs(dx) < mx ? dx : (dx > 0 ? mx : -mx);
            ship.tn = (ship.tn + 1) & 7; ship.tx[ship.tn] = ship.x; ship.ty[ship.tn] = ship.y;
            ship.fireT -= dt;                  // the gun fires itself, 10 volleys/s, from tick 0
            while (ship.fireT <= 0) {
              ship.fireT += 0.1; ship.volley++;
              if (peas.length < 38) { peas.push({ x: ship.x - 7, y: ship.y - 12 }); peas.push({ x: ship.x + 7, y: ship.y - 12 }); }
              if (ship.volley % 3 === 0 && done === 'pending') sPea();
            }
          }

/* DONE-CRITERIA
   - The fuse window opens on the first 1/8-note boundary after 0.55-0.85s of armed time, lasts
     exactly [1.2, 0.85, 0.65]s by difficulty, and while open the white ring shrinks from r*2.2
     to r*1.0 pulsing at 8Hz while a sine whistle rises 380->1250Hz in 0.09s segments.
   - A tap within [80, 74, 70]px of the shell while the window is open sets 'won' the same frame:
     12 cyan diamond petals burst radially at 320 px/s, white flash disc r=18+1.4*12, 0.045s
     hitstop, sky flash 0.412 rim-lighting city and crowd gold, every window lights, and the
     crowd stands arms-up in a 0.5s left-to-right wave.
   - Petals that touch either small shell force a 0.12s white ignite ring and then it blooms too
     (8 petals, chain-pitched chime) — the cascade travels shell-to-shell.
   - An armed tap while the window is closed (including the diff-2 fake shimmer) OR the fuse
     expiring sets 'lost' the same frame: 5 magenta comets (fan spread 46 deg, speed 200) fire at
     the ship with the dull 300->120Hz chirp; a comet reaching the ship pops it with 0.14s
     hitstop and shake 8. timeout() = 'lost' if unresolved.
   - Pea bullets are consumed with white ticks only while the window is open; at all other times
     they visibly fly straight through the shell.
   BUG-IS-GAME (do not fix):
   - Peas pass through the closed shell without vanishing — "not yet" has to read on screen.
   - The converted volley blooms as a RADIAL RING even though the enemy version was an aimed fan;
     count is preserved (min 12), shape deliberately is not.
   - A petal touching a small shell looks like it "did nothing" for 0.12s — that is the ignite,
     the cascade engine, not a missed hit.
   - Nothing is pure #FFFFFF at full alpha except the fuse ring, bloom flashes, the ship's core
     dot, and the shell's in-window core: stars are rgba(184,205,255,*), the city is tinted.
     White means ACT NOW.
   - The window is granted only on a 1/8-note boundary, so the shell sometimes visibly waits
     after its 0.55-0.85s settle — quantisation, not lag.
   - The red bloom is quieter and duller than the blue one on purpose.
*/
