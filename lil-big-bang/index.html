        env.audio.tone({ f: 155, f2: 71, type: 'square', dur: 0.22, vol: 0.10 });
        const CH = [440, 554, 659, 880];
        for (let i = 0; i < 4; i++) {
          env.audio.tone({ f: CH[i], f2: CH[i] * 1.02, type: 'sine', dur: 0.34, vol: 0.11, t: i * 0.035 });
        }
      }
      function sDeath() {
        env.audio.tone({ f: 220, f2: 55, type: 'triangle', dur: 0.8, vol: 0.16 });
        env.audio.tone({ f: 110, f2: 27.5, type: 'sine', dur: 0.9, vol: 0.14, t: 0.08 });
      }
      /* the lobby hum: the donor's generator at ATRIUM settings (tempo 88, root 110, [0,3,5,7,10]).
         Held under 0.06 total so it sits beneath the shell's music instead of arguing with it. */
      const SCALE = [0, 3, 5, 7, 10];
      function bed(s) {
        if (s % 2 === 0) {
          const f = 110 * Math.pow(2, SCALE[((s * 3 + (s >> 2)) % 5 + 5) % 5] / 12) * (s % 8 === 0 ? 0.5 : 1);
          env.audio.tone({ f: f, f2: f * 0.996, type: 'triangle', dur: 0.34, vol: 0.035 });
        }
        if (s % 8 === 0) env.audio.tone({ f: 55, f2: 50, type: 'sine', dur: 0.55, vol: 0.055 });
      }

      /* ---------------------------- fx (cap 120, donor shapes) ---------------------------- */
      function burst(x, y, n, col, sp, life, size, shape) {
        for (let i = 0; i < n && parts.length < 120; i++) {
          const a = R() * TAU, v = sp * (0.45 + R() * 0.55);
          parts.push({
            x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life, max: life,
            col: col, size: size, shape: shape, rot: R() * TAU, drag: 0.5 + R() * 2,
          });
        }
      }
      function ring(x, y, col, r1, life, wid) {
        if (rings.length < 10) rings.push({ x: x, y: y, r: 4, r1: r1, life: life, max: life, col: col, w: wid });
      }
      function fx(dt) {
        for (let i = parts.length - 1; i >= 0; i--) {
          const q = parts[i];
          q.x += q.vx * dt; q.y += q.vy * dt;
          const f = Math.exp(-q.drag * dt); q.vx *= f; q.vy *= f;
          q.rot += dt * 5;
          q.life -= dt; if (q.life <= 0) parts.splice(i, 1);
        }
        for (let i = rings.length - 1; i >= 0; i--) {
          const s = rings[i];
          s.life -= dt;
          s.r = 4 + (s.r1 - 4) * (1 - s.life / s.max);
          if (s.life <= 0) rings.splice(i, 1);
        }
        trauma = Math.max(0, trauma - dt * 1.9);            // donor: view.trauma -= dt*1.9
      }

      /* ---------------------------- the throw ---------------------------- */
      function launch() {
        b.state = 'out';
        b.x = p.x + aim.x * MUZZLE; b.y = p.y + aim.y * MUZZLE; b.px = b.x; b.py = b.y;
        b.vx = aim.x * SPD; b.vy = aim.y * SPD; b.life = 0; b.bounces = 0;
        p.kx -= aim.x * 4; p.ky -= aim.y * 4;               // donor recoil p.vx -= n.x*65, at sprite scale
        throws++; sThrow();
        ring(b.x, b.y, ACCENT, 54, 0.22, 3);
        burst(b.x, b.y, 8, ACCENT, 190, 0.3, 3, 'streak');
      }
      function recall() {
        if (b.state !== 'out') return;
        b.state = 'returning'; sRecall();
        ring(b.x, b.y, '#fff1bf', 70, 0.3, 3);
      }
      function catchIt() {
        b.state = 'held'; b.vx = b.vy = 0; b.life = 0;
        sCatch(); ring(p.x, p.y, '#f5e0b2', 70, 0.3, 2);
      }
      function bounce(hit) {
        const dot = b.vx * hit.nx + b.vy * hit.ny;
        b.vx -= dot * REFLECT * hit.nx; b.vy -= dot * REFLECT * hit.ny;
        if (hit.rail) { b.vx *= RAIL_GAIN; b.vy *= RAIL_GAIN; banked++; }
        else hitPlacard++;
        b.bounces++;
        b.x = hit.x + hit.nx * 1.5; b.y = hit.y + hit.ny * 1.5;
        b.spin += (dot > 0 ? 1 : -1) * 1.4;
        sBounce(Math.hypot(b.vx, b.vy));
        burst(hit.x, hit.y, 9, hit.rail ? EDGE : PLACARD_CRACK, 210, 0.34, 3, 'shard');
        ring(hit.x, hit.y, EDGE, 42, 0.22, 2);
        trauma = Math.min(1, trauma + 0.035);               // donor addTrauma(.035) — texture, not a shake
      }
      function win() {
        decided = 'won'; announceT = 0.5; breakT = 0;
        hitstop = 0.09; trauma = 0.72;
        b.vx *= REBOUND; b.vy *= REBOUND;                   // it bounces off the thing it just broke
        burst(btnX, BTN_Y, 17, BLOOD, 260, 0.58, 4, 'shard');
        burst(btnX, BTN_Y, 24, ACCENT, 280, 0.6, 4, 'streak');
        ring(btnX, BTN_Y, ACCENT, 125, 0.5, 4);
        sBreak();
      }

      /* ---------------------------- bell integration (donor updateBell) ---------------------------- */
      function stepBell(dt) {
        if (b.state === 'held') {
          b.x = damp(b.x, p.x + aim.x * HAND, 28, dt);
          b.y = damp(b.y, p.y + aim.y * HAND, 28, dt);
          b.px = b.x; b.py = b.y; b.spin += dt * 2;
          return;
        }
        b.life += dt;
        b.spin += dt * (Math.hypot(b.vx, b.vy) / 80 + 2);
        if (b.state === 'out') {
          const d = Math.exp(-AIR * dt); b.vx *= d; b.vy *= d;
          if (b.bounces > MAX_BOUNCE || b.life > RECALL_LIFE) recall();
        } else {
          const dx = p.x - b.x, dy = p.y - b.y, m = Math.hypot(dx, dy) || 1;
          const tgt = RETURN_SPD * (1 + Math.min(0.25, b.life * 0.04));
          b.vx = damp(b.vx, dx / m * tgt, RETURN_L, dt);
          b.vy = damp(b.vy, dy / m * tgt, RETURN_L, dt);
        }
        /* donor sub-steps at 22px so a 860px/s bell can never tunnel a 22px placard */
        const sp = Math.hypot(b.vx, b.vy), n = Math.max(1, Math.ceil(sp * dt / 22)), sd = dt / n;
        for (let s = 0; s < n; s++) {
          const ox = b.x, oy = b.y, nx = ox + b.vx * sd, ny = oy + b.vy * sd;
          b.px = ox; b.py = oy;
          let best = null;
          for (let i = 0; i < walls.length; i++) {
            const h = lineRect(ox, oy, nx, ny, walls[i], BELL_R);
            if (h && (!best || h.t < best.t)) best = h;
          }
          if (best) bounce(best); else { b.x = nx; b.y = ny; }
          /* donor order: resolve the wall first, THEN test the checkout screen against the
             clipped segment — a shot the placard eats can never also break the page.
             DEVIATION: the donor also lets the RETURNING bell break the screen. Its guest walks
             around; ours is nailed to the axis directly below CLOSE, so the recall line runs
             straight through the hit circle and every high throw would win for free — which
             deletes the only thing this cartridge is for. The bell comes home behind the page. */
          if (!decided && b.state === 'out' && segCircle(ox, oy, b.x, b.y, btnX, BTN_Y, HIT_R)) { win(); return; }
        }
        if (b.state === 'returning' && Math.hypot(b.x - p.x, b.y - p.y) < P_R + BELL_R + 12) catchIt();
      }

      /* ---------------------------- the two predictions ----------------------------
         tracePath() is the DRAWN guide: the donor's traceAimPath, which reflects at a true 2.0
         while the bell itself reflects at 1.88. The dashes are therefore a hair optimistic on
         long shots and that is deliberate (see BUG-IS-GAME) — near-misses must feel like your
         read, not the game's. simThrow() is the honest one: the exact loop above, run forward.
         It decides the lock ring and it is what the QA bot aims with. */
      function tracePath(ux, uy) {
        const segs = [];
        let x = p.x + ux * MUZZLE, y = p.y + uy * MUZZLE, dx = ux, dy = uy, remain = TRACE_REMAIN;
        for (let k = 0; k < 3 && remain > 0; k++) {
          const ex = x + dx * remain, ey = y + dy * remain;
          let best = null;
          for (let i = 0; i < walls.length; i++) {
            const h = lineRect(x, y, ex, ey, walls[i], BELL_R);
            if (h && (!best || h.t < best.t)) best = h;
          }
          if (!best) { segs.push([x, y, ex, ey]); break; }
          const len = Math.hypot(best.x - x, best.y - y);
          segs.push([x, y, best.x, best.y]);
          remain -= len;
          const dot = dx * best.nx + dy * best.ny;
          dx -= 2 * dot * best.nx; dy -= 2 * dot * best.ny;   // the PREVIEW uses 2.0. Do not reconcile.
          x = best.x + best.nx * 2; y = best.y + best.ny * 2;
        }
        return segs;
      }
      function simThrow(ux, uy) {
        let x = p.x + ux * MUZZLE, y = p.y + uy * MUZZLE;
        let vx = ux * SPD, vy = uy * SPD, life = 0, bn = 0;
        const dt = 1 / 60;
        for (let f = 0; f < 120; f++) {
          life += dt;
          const dr = Math.exp(-AIR * dt); vx *= dr; vy *= dr;
          const sp = Math.hypot(vx, vy), n = Math.max(1, Math.ceil(sp * dt / 22)), sd = dt / n;
          for (let s = 0; s < n; s++) {
            const ox = x, oy = y, nx = x + vx * sd, ny = y + vy * sd;
            let best = null;
            for (let i = 0; i < walls.length; i++) {
              const h = lineRect(ox, oy, nx, ny, walls[i], BELL_R);
              if (h && (!best || h.t < best.t)) best = h;
            }
            if (best) {
              const dot = vx * best.nx + vy * best.ny;
              vx -= dot * REFLECT * best.nx; vy -= dot * REFLECT * best.ny;
              if (best.rail) { vx *= RAIL_GAIN; vy *= RAIL_GAIN; }
              bn++; x = best.x + best.nx * 1.5; y = best.y + best.ny * 1.5;
            } else { x = nx; y = ny; }
            /* the target is simulated where it will BE, not where it is — diff 2 slides it */
            if (segCircle(ox, oy, x, y, btnAt(t + life), BTN_Y, HIT_R)) return true;
          }
          if (bn > MAX_BOUNCE || life > RECALL_LIFE) return false;
        }
        return false;
      }
      /* the bot's answer: sweep the circle with the real simulation, keep the widest contiguous
         winning arc, aim down its middle. Recomputed only when the target has actually moved. */
      let solved = null, solvedKey = 1e9;
      function solveAim() {
        const key = SLIDE ? Math.round(btnX / 12) : 0;
        if (solved && key === solvedKey) return solved;
        const N = 144, hit = [];
        for (let i = 0; i < N; i++) {
          const a = i / N * TAU;
          hit.push(simThrow(Math.cos(a), Math.sin(a)));
        }
        let bestI = -1, bestLen = 0;
        for (let i = 0; i < N; i++) {
          if (!hit[i] || hit[(i - 1 + N) % N]) continue;      // only start at an arc's leading edge
          let len = 0;
          while (len < N && hit[(i + len) % N]) len++;
          if (len > bestLen) { bestLen = len; bestI = i; }
        }
        solvedKey = key;
        if (bestI < 0) { solved = null; return null; }
        const a = ((bestI + (bestLen - 1) / 2) % N) / N * TAU;
        solved = { x: Math.cos(a), y: Math.sin(a) };
        return solved;
      }

      /* ---------------------------- static chrome, pre-rendered once ---------------------------- */
      function spaced(c, txt, cx, y, sp) {
        /* Every caller sets textAlign='center' for its own layout, and this used to inherit it —
           so each glyph was drawn CENTRED on the pen position and then the pen advanced by that
           glyph's full width, displacing every character by half its own width. Narrow letters
           landed on top of their neighbours ("AIM" read as "A M"). The advance math here is
           left-to-right, so the pen must be too. */
        const keep = c.textAlign;
        c.textAlign = 'left';
        let tw = -sp;
        for (const ch of txt) tw += c.measureText(ch).width + sp;
        let x = cx - tw / 2;
        for (const ch of txt) { c.fillText(ch, x, y); x += c.measureText(ch).width + sp; }
        c.textAlign = keep;
      }
      /* 1. THE ATRIUM — the lobby behind the page, only ever seen once the page comes apart */
      const LOBBY = env.layer(W, H, (c) => {
        c.fillStyle = FLOOR; c.fillRect(0, 0, W, H);
        const g = c.createRadialGradient(195, 371, 40, 195, 371, 590);
        g.addColorStop(0, FLOOR2); g.addColorStop(1, FLOOR);
        c.fillStyle = g; c.fillRect(0, 0, W, H);
        c.globalAlpha = 0.18; c.lineWidth = 1; c.strokeStyle = EDGE;   // donor 'marble' pattern
        for (let x = 0; x < W + 125; x += 125) {
          c.beginPath(); c.moveTo(x, 0); c.lineTo(x + Math.sin(x * 0.013) * 38, H); c.stroke();
        }
        for (let y = 0; y < H + 125; y += 125) {
          c.beginPath(); c.moveTo(0, y); c.lineTo(W, y + Math.cos(y * 0.011) * 25); c.stroke();
        }
        c.globalAlpha = 1;
        const v = c.createRadialGradient(195, 397, 97, 195, 397, 641);  // donor drawVignette, lit=0
        v.addColorStop(0, 'transparent');
        v.addColorStop(0.72, 'rgba(3,4,8,.13)');
        v.addColorStop(1, 'rgba(2,3,6,.52)');
        c.fillStyle = v; c.fillRect(0, 0, W, H);
      });
      /* 2. THE RAILS — the donor's kind:'rail' walls. They are drawn OVER the page, not under it:
         you cannot read a ricochet off a surface you cannot see, and the actors already break
         that layer (see BUG-IS-GAME). shadowBlur 14 is faked with two translucent passes. */
      const RAILS = env.layer(W, H, (c) => {
        for (let i = 0; i < 4; i++) {
          const w = walls[i], tall = w.h > w.w;
          c.fillStyle = GLOW; c.globalAlpha = 0.10;
          rrect(c, w.x - 14, w.y - 14, w.w + 28, w.h + 28, 18); c.fill();
          c.globalAlpha = 0.18;
          rrect(c, w.x - 6, w.y - 6, w.w + 12, w.h + 12, 14); c.fill();
          c.globalAlpha = 1; c.fillStyle = EDGE;
          rrect(c, w.x, w.y, w.w, w.h, Math.min(18, w.h * 0.35, w.w * 0.35)); c.fill();
          c.globalAlpha = 0.35; c.fillStyle = '#fff';
          /* donor highlights the top 24% of a wall; on a full-height rail that reads as a
             polished inner edge instead, so the strip is transposed for the tall pair */
          if (tall) rrect(c, w.x + 4, w.y + 4, w.w * 0.24, w.h - 8, 6);
          else rrect(c, w.x + 4, w.y + 4, w.w - 8, w.h * 0.24, 6);
          c.fill(); c.globalAlpha = 1;
        }
      });
      /* 3. THE CHECKOUT PAGE — everything on it that never changes. Overscanned 10px past every
         edge exactly as the donor does, so the win jitter never exposes a seam. */
      const PAGE = env.layer(W, H, (c) => {
        c.fillStyle = PAPER; c.fillRect(-10, -10, W + 20, H + 20);
        c.fillStyle = SCAN; c.globalAlpha = 0.12;
        for (let y = 0; y < H; y += 28) c.fillRect(0, y, W, 1);
        c.globalAlpha = 1;
        c.textAlign = 'center';
        c.fillStyle = HEAD; c.font = BLACK9 + '46px ' + AB;
        c.fillText('CHECKOUT', 195, 173); c.fillText('COMPLETE', 195, 215);
        c.fillStyle = SUB; c.font = BOLD7 + '12px ' + SUI;
        spaced(c, 'YOUR STAY HAS ENDED', 195, 240, 3);
        c.fillStyle = FOOT; c.font = BOLD7 + '10px ' + SUI;
        spaced(c, 'NO FURTHER ACTION IS REQUIRED', 195, 640, 1.5);
      });
      /* 4. the scratch surface the page is composited on, so the shatter's destination-out
         punch-out eats the page and NOT the lobby underneath it. Made once, reused every frame. */
      let sc = null;
      const SHEET = env.layer(W, H, (c) => { sc = c; });

      /* ---------------------------- step ---------------------------- */
      function step(dt, inp) {
        const ph = env.beatPhase();
        if ((prevPh < 0.5 && ph >= 0.5) || ph < prevPh) { if (!decided) bed(step8); step8++; }
        prevPh = ph;
        t += dt;
        p.kx = damp(p.kx, 0, 14, dt); p.ky = damp(p.ky, 0, 14, dt);

        if (decided) {
          announceT -= dt;
          if (breakT >= 0) breakT += dt;
          if (hitstop > 0) hitstop -= dt; else fx(dt);       // 90ms of total freeze on the break
          if (announceT <= 0) announced = decided;
          lastDown = inp.down;
          return;
        }

        btnX = btnAt(t);
        /* aim: the donor's mouse path, norm(touch - guest). Press anywhere; the vector is what
           matters, not the spot, so the thumb never has to find a target. */
        if (inp.justDown) { aiming = true; everTouched = true; }
        if (aiming && inp.down) {
          const dx = inp.x - p.x, dy = inp.y - p.y, m = Math.hypot(dx, dy);
          if (m > 12) { aim = { x: dx / m, y: dy / m }; }    // inside 12px keep the last read
        }
        if (inp.justUp && aiming) {
          aiming = false;
          if (b.state === 'held') launch();                  // no charge meter: release IS the flick
        }
        stepBell(dt);
        if (!decided) fx(dt);
        lastDown = inp.down;
      }

      /* ---------------------------- render ---------------------------- */
      function drawBell(g) {
        if (b.state !== 'held') {                            // donor's smear: one fat translucent stroke
          g.strokeStyle = ACCENT; g.globalAlpha = 0.2;
          g.lineWidth = Math.max(2, 7.2); g.lineCap = 'round';
          g.beginPath(); g.moveTo(b.px, b.py); g.lineTo(b.x, b.y); g.stroke();
          g.globalAlpha = 1; g.lineCap = 'butt';
        }
        g.save(); g.translate(b.x, b.y); g.rotate(b.spin);
        g.shadowColor = GLOW; g.shadowBlur = 22;             // the one real glow in the cartridge
        const gr = g.createRadialGradient(-3.6, -4.2, 1, 0, 0, 15.6);
        gr.addColorStop(0, '#fff7d5'); gr.addColorStop(0.38, ACCENT); gr.addColorStop(1, '#8f542b');
        g.fillStyle = gr; g.beginPath(); g.arc(0, 0, BELL_R, 0, TAU); g.fill();
        g.shadowBlur = 0;
        g.strokeStyle = '#fff0bc'; g.globalAlpha = 0.75; g.lineWidth = 2;
        g.beginPath(); g.arc(0, 0, 9.4, 0.2, Math.PI * 1.4); g.stroke();
        g.globalAlpha = 1; g.fillStyle = '#20140c';
        g.beginPath(); g.arc(0, 6.2, 2.3, 0, TAU); g.fill();
        g.restore();
      }
      function drawGuest(g) {
        g.save(); g.translate(p.x + p.kx, p.y + p.ky);
        g.fillStyle = 'rgba(0,0,0,.28)';
        g.beginPath(); g.ellipse(0, 18, 24, 10, 0, 0, TAU); g.fill();
        const st = Math.sin(t * 12) * 6;                     // the donor's idle step wobble
        g.fillStyle = '#15151e'; g.strokeStyle = ACCENT; g.lineWidth = 3;
        g.beginPath();
        g.moveTo(-10, 13); g.lineTo(-12 + st * 0.35, 31); g.lineTo(-4 + st * 0.35, 31); g.lineTo(0, 13);
        g.lineTo(5 - st * 0.35, 31); g.lineTo(13 - st * 0.35, 31); g.lineTo(10, 13);
        g.fill();
        rrect(g, -19, -18, 38, 42, 12); g.fill(); g.stroke();
        g.fillStyle = '#eee5d8'; g.beginPath(); g.arc(0, -27, 13, 0, TAU); g.fill();
        g.strokeStyle = ACCENT; g.lineWidth = 2;
        g.beginPath(); g.arc(0, -27, 13, Math.PI * 0.1, Math.PI * 0.9); g.stroke();
        g.fillStyle = ACCENT;
        g.beginPath(); g.moveTo(-18, -9); g.lineTo(4, -2); g.lineTo(-18, 5); g.closePath(); g.fill();
        g.fillStyle = '#fff'; g.globalAlpha = 0.55;
        g.beginPath(); g.arc(4, -31, 3, 0, TAU); g.fill();
        g.globalAlpha = 1; g.restore();
      }
      function drawSheet() {                                 // page + placard + button, on the scratch
        const c = sc, age = breakT >= 0 ? breakT : 0;
        const hits = decided === 'won' ? Math.min(3, 1 + Math.floor(age / 0.12)) : 0;
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, W, H);
        c.save();
        c.translate(decided === 'won' ? Math.sin(t * 58) * 4.5 : 0, 0);   // the page shakes, hard sin
        c.drawImage(PAGE, 0, 0);
        /* DO NOT DISTURB — the reason a straight throw is not a throw */
        c.fillStyle = SLAB; rrect(c, PL_X, PL_Y, PL_W, PL_H, 6); c.fill();
        c.strokeStyle = PLACARD_CRACK; c.globalAlpha = 0.25; c.lineWidth = 1.6;
        const cx = PL_X + PL_W / 2, cy = PL_Y + PL_H / 2, sp = PL_W * 0.35;
        c.beginPath();
        c.moveTo(cx - sp * 0.2, cy - sp); c.lineTo(cx + sp * 0.12, cy - sp * 0.22);
        c.lineTo(cx - sp * 0.22, cy + sp * 0.08); c.lineTo(cx + sp * 0.3, cy + sp);
        c.moveTo(cx + sp * 0.12, cy - sp * 0.22); c.lineTo(cx + sp * 0.72, cy - sp * 0.48);
        c.moveTo(cx - sp * 0.22, cy + sp * 0.08); c.lineTo(cx - sp * 0.75, cy + sp * 0.5);
        c.stroke();
        c.globalAlpha = 1; c.textAlign = 'center';
        c.fillStyle = '#8d8a83'; c.font = BOLD7 + '9px ' + SUI;
        spaced(c, 'DO NOT DISTURB', cx, cy + 3.5, 2);
        /* THE CLOSE BUTTON. Struck, it flips red and cycles its own excuses. */
        const bx = btnX - BTN_W / 2, by = BTN_Y - BTN_H / 2;
        if (hits) {                                          // faked glow: two translucent passes
          c.fillStyle = BLOOD; c.globalAlpha = 0.16;
          rrect(c, bx - 12, by - 12, BTN_W + 24, BTN_H + 24, 20); c.fill();
          c.globalAlpha = 0.26; rrect(c, bx - 5, by - 5, BTN_W + 10, BTN_H + 10, 16); c.fill();
          c.globalAlpha = 1;
        }
        c.fillStyle = hits ? STRUCK : SLAB;
        rrect(c, bx, by, BTN_W, BTN_H, 13); c.fill();
        c.fillStyle = LABEL; c.font = BLACK9 + '16px ' + AB;
        c.fillText(['CLOSE', 'CLOSE FAILED', 'STILL HERE', ''][hits], btnX, BTN_Y + 6);
        if (hits) {                                          // 21 three-segment cracks fanning out
          c.strokeStyle = CRACK; c.lineWidth = 2.2; c.globalAlpha = 0.45 + hits * 0.16;
          for (let k = 0; k < 21; k++) {
            const a = k * 2.399 + hits * 0.5, len = 45 + (k % 5) * 29;
            c.beginPath(); c.moveTo(btnX, BTN_Y);
            let x = btnX, y = BTN_Y;
            for (let n = 1; n <= 3; n++) {
              x += Math.cos(a + n * 0.15) * len / 3; y += Math.sin(a + n * 0.15) * len / 3;
              c.lineTo(x + (n % 2 ? 8 : -8), y);
            }
            c.stroke();
          }
          c.globalAlpha = 1;
        }
        if (breakT >= 0) {                                   // punched out: 18 holes eating the page
          c.globalCompositeOperation = 'destination-out';
          for (let i = 0; i < 18; i++) {
            const a = i * TAU / 18 + age * 2, r = age * 370;
            c.beginPath();
            c.arc(btnX + Math.cos(a) * r, BTN_Y + Math.sin(a) * r, 18 + age * 70, 0, TAU);
            c.fill();
          }
          c.globalCompositeOperation = 'source-over';
        }
        c.restore();
        return breakT >= 0 ? clamp(1 - breakT / BREAK_MS, 0, 1) : 1;
      }
      function drawGuide(g, alpha) {
        const segs = tracePath(aim.x, aim.y);
        if (!segs.length) return;
        /* difficulty eats the prediction from the far end: full ricochet, then the first leg
           plus a 40px hint of where it goes, then a 30px stub that only tells you the heading */
        let keep = segs.slice();
        if (GUIDE === 1) {
          keep = [segs[0]];
          if (segs[1]) {
            const s = segs[1], m = Math.hypot(s[2] - s[0], s[3] - s[1]) || 1, k = Math.min(1, 40 / m);
            keep.push([s[0], s[1], s[0] + (s[2] - s[0]) * k, s[1] + (s[3] - s[1]) * k]);
          }
        } else if (GUIDE === 2) {
          const s = segs[0], m = Math.hypot(s[2] - s[0], s[3] - s[1]) || 1, k = Math.min(1, 30 / m);
          keep = [[s[0], s[1], s[0] + (s[2] - s[0]) * k, s[1] + (s[3] - s[1]) * k]];

        /* STOP THE GUIDE ON THE BUTTON.
           tracePath draws 760px of geometric ricochet and runs straight THROUGH the target and
           out the other side, so the guide reads as a zigzag with no destination — you cannot
           tell which crossing is the hit. Clip at the first point that enters CLOSE's hit
           radius and end the dot there: the line now finishes on the thing it opens. */
        for (let i = 0; i < keep.length; i++) {
          const sg = keep[i];
          const ex = sg[2] - sg[0], ey = sg[3] - sg[1];
          const fx = sg[0] - btnX, fy = sg[1] - BTN_Y;
          const A2 = ex * ex + ey * ey;
          const B2 = 2 * (fx * ex + fy * ey);
          const C2 = fx * fx + fy * fy - HIT_R * HIT_R;
          const disc = B2 * B2 - 4 * A2 * C2;
          if (A2 > 0 && disc >= 0) {
            const rt = Math.sqrt(disc);
            let u = (-B2 - rt) / (2 * A2);
            if (u < 0) u = (-B2 + rt) / (2 * A2);
            if (u >= 0 && u <= 1) {
              keep = keep.slice(0, i);
              keep.push([sg[0], sg[1], sg[0] + ex * u, sg[1] + ey * u]);
              break;
            }
          }
        }
        g.save();
        /* a dark casing under the gold: ACCENT is a brass on a cream page and vanishes into it */
        g.strokeStyle = SLAB; g.lineWidth = 6; g.globalAlpha = 0.30 * alpha;
        g.setLineDash([10, 13]); g.lineDashOffset = -t * 35;
        for (const s of keep) { g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); g.stroke(); }
        g.strokeStyle = ACCENT; g.lineWidth = 3; g.globalAlpha = 0.95 * alpha;
        for (const s of keep) { g.beginPath(); g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); g.stroke(); }
        g.setLineDash([]);
        const e = keep[keep.length - 1];
        g.globalAlpha = 0.9 * alpha;
        g.fillStyle = SLAB; g.beginPath(); g.arc(e[2], e[3], 8, 0, TAU); g.fill();
        g.fillStyle = ACCENT; g.beginPath(); g.arc(e[2], e[3], 5.5, 0, TAU); g.fill();
        g.restore();

        g.save();

        if (sh > 0.05) g.translate((R() * 2 - 1) * sh, (R() * 2 - 1) * sh);
        g.drawImage(LOBBY, 0, 0);
        g.globalAlpha = drawSheet();
        g.drawImage(SHEET, 0, 0);
        g.globalAlpha = 1;
        g.drawImage(RAILS, 0, 0);

        /* the aim guide, then the actors — the donor draws every one of them ON TOP of the page
           it is supposedly trapped behind, and that inversion is the whole joke */
        if (b.state === 'held' && !decided) {
          if (aiming) drawGuide(g, 1);
          else if (D === 0 && throws === 0 && !everTouched) {
            /* THE ANSWER, DRAWN, and it waits for you.
               This used to be 0.34 alpha layered on drawGuide's own 0.52 — 18% gold on a cream
               page — and it expired on a 1.15s clock whether or not anyone had looked at it.
               It is the one thing in the cartridge that shows you the shot exists. It now holds
               at full strength until the first touch and breathes so the eye finds it. */
            const s = solveAim(), keep = aim;
            if (s) { aim = s; drawGuide(g, 0.82 + 0.18 * Math.sin(t * 5)); aim = keep; }
          }
        }
        drawGuest(g);
        if (!(decided === 'won' && breakT > 0.3)) drawBell(g);

        for (const q of parts) {                             // donor shard / streak shapes
          const a = clamp(q.life / q.max, 0, 1);
          g.save(); g.translate(q.x, q.y); g.rotate(q.rot);
          g.globalAlpha = a; g.fillStyle = q.col;
          if (q.shape === 'streak') {
            g.strokeStyle = q.col; g.lineWidth = q.size;
            g.beginPath(); g.moveTo(0, 0); g.lineTo(-q.vx * 0.045, -q.vy * 0.045); g.stroke();
          } else {
            g.beginPath();
            g.moveTo(-q.size * 0.5, -q.size); g.lineTo(q.size * 0.6, 0); g.lineTo(-q.size * 0.3, q.size);
            g.closePath(); g.fill();

          g.restore();
        }
        g.globalAlpha = 1;
        for (const s of rings) {
          g.globalAlpha = clamp(s.life / s.max, 0, 1) * 0.75;
          g.strokeStyle = s.col; g.lineWidth = s.w;
          g.beginPath(); g.arc(s.x, s.y, s.r, 0, TAU); g.stroke();
        }
        g.globalAlpha = 1;

        /* THE FIRST HALF-SECOND. This cartridge opens as a cream corporate modal, and in a reel
           that just handed you a neon shooter that reads as a CRASH, not a game. So the opening
           has to shout "someone is in here, and this is yours": a warm bloom under the bell, a
           fat ink rim on it, and a matching ring on the button you are aiming at. Three brass
           objects are on screen and only one of them is in your hand. */
        if (t < 1.5 && !decided) {
          const e8 = 1 - ((env.beatPhase() * 2) % 1);
          const fade = clamp((1.5 - t) / 0.35, 0, 1);
          /* the bloom — the only warm light on a flat page, so the eye goes here first */
          const bl = g.createRadialGradient(b.x, b.y, 2, b.x, b.y, 74);
          bl.addColorStop(0, 'rgba(255,206,110,' + (0.42 * fade) + ')');
          bl.addColorStop(1, 'rgba(255,206,110,0)');
          g.fillStyle = bl; g.beginPath(); g.arc(b.x, b.y, 74, 0, TAU); g.fill();
          g.strokeStyle = env.ink; g.lineWidth = 3.5;
          g.globalAlpha = (0.45 + 0.55 * e8) * fade;
          g.beginPath(); g.arc(b.x, b.y, BELL_R + 9 + 4 * e8, 0, TAU); g.stroke();

          g.globalAlpha = (0.30 + 0.45 * e8) * fade;
          g.lineWidth = 3;
          g.beginPath(); g.arc(btnX, BTN_Y, HIT_R + 8 + 4 * e8, 0, TAU); g.stroke();
          g.globalAlpha = 1;
        }
        /* the lock: the honest simulation says this release connects. Assistance, so it fades out
           with the guide — at difficulty 2 you get no confirmation at all. */
        if (aiming && !decided && b.state === 'held' && D < 2 && simThrow(aim.x, aim.y)) {
          const th = 0.5 + 0.5 * Math.sin(t * 14);
          g.strokeStyle = BLOOD; g.lineWidth = 3; g.globalAlpha = 0.45 + 0.4 * th;
          g.beginPath(); g.arc(btnX, BTN_Y, HIT_R + 4 * th, 0, TAU); g.stroke();
          g.globalAlpha = 1;
        }
        g.restore();

        /* the page's own fine print, teaching the verb in the hotel's voice */
        if (!decided && (!everTouched || t < 1.9)) {
          /* It said only "THE STRAIGHT LINE IS OCCUPIED", at 11px, and left after 1.9s. That
             names the OBSTACLE and never the VERB, so a first-time player is told what will not
             work and nothing about what will. Now it names both, and waits for the first touch. */
          g.textAlign = 'center';
          g.globalAlpha = everTouched ? 0.85 * clamp((1.9 - t) / 0.5, 0, 1) : 0.95;
          g.fillStyle = HEAD; g.font = BLACK9 + '17px ' + SUI;
          spaced(g, 'HOLD TO AIM. LET GO TO THROW.', 195, 276, 1.5);
          g.fillStyle = SUB; g.font = BOLD7 + '11px ' + SUI;
          spaced(g, 'THE STRAIGHT LINE IS OCCUPIED', 195, 300, 2);
          g.globalAlpha = 1;
        }
        if (hitstop > 0) { g.fillStyle = 'rgba(255,243,214,0.14)'; g.fillRect(0, 0, W, H); }
      }

      /* ---- QA bot: hold, steer onto the solved bank angle, let go the frame the honest
         simulation says it connects. Chains down -> up across polls, exactly like BRINK. ---- */
      function hint() {
        if (decided) return { type: 'wait', ms: 200 };
        if (b.state !== 'held') return { type: 'wait', ms: 60 };     // the return leg is free
        if (lastDown && !aiming) return { type: 'up' };
        const s = solveAim();
        if (!s) return { type: 'wait', ms: 120 };
        const ax = clamp(p.x + s.x * 120, 8, W - 8), ay = clamp(p.y + s.y * 120, 60, H - 8);
        if (!aiming) return { type: 'down', x: ax, y: ay };
        return simThrow(aim.x, aim.y) ? { type: 'up' } : { type: 'down', x: ax, y: ay };
      }

      return {
        step: step,
        render: render,
        result: () => announced,
        timeout: () => {
          if (decided === 'won') return 'won';
          if (!stung) { stung = true; sDeath(); }
          return 'lost';
        },
        line: () => throws === 0 ? 'YOU STOOD THERE. SO DID THE HOTEL.'
          : hitPlacard > 0 && banked === 0 ? 'YOU RANG THE SIGN. THE SIGN IS FINE.'
          : banked > 0 ? 'GREAT BOUNCE. WRONG CENTURY.'
          : 'YOUR STAY ENDED. THE BELL DISAGREED.',
        hint: hint,
      };
    },
  });
})();

/* DONE-CRITERIA
   - No straight throw can ever win. Sweeping all 3600 headings through the shipped physics at
     every difficulty returns ZERO zero-bounce hits: the padded DO NOT DISTURB placard
     (x 195 +/- [70,85,100], y 560..582, inflated by the bell's 13px radius) covers the entire
     +/-19.3 degree cone that reaches the CLOSE hit circle from the guest at (195,664). Every
     winning heading crosses at least one rail first. This is the cartridge; if a straight throw
     ever wins again, the geometry has drifted and the reel just has a second, worse `dash`.
   - Only an OUTBOUND bell can break the page. The recall leg flies home behind it (deviation from
     the donor, which lets a returning bell score — its guest is mobile, ours is bolted to the
     button's own axis, so a free return hit would win from any high throw).
   - Exactly two winning arcs exist per difficulty, one off each rail, mirror images:
     23.8 deg wide each at diff 0 (320.3..344.1 and 195.9..219.7), 18.4 at diff 1, 12.0 at diff 2.
     The fastest solution is a single rail bounce landing in ~0.45s.
   - Releasing with the bell in hand fires it at [720,790,860] px/s on the release frame with no
     windup; a rail bounce reflects at 1.88 and multiplies both components by 1.12; the placard
     reflects at 1.88 with no gain. Miss => auto-recall at bounces > 4 or life > 1.05s, home at
     1260 px/s damped at 9.5, caught inside 45px — roughly two attempts fit an 8-beat slot.
   - The swept bell segment touching the r=64 circle at (btnX, 470) resolves 'won' that frame:
     90ms total freeze, trauma 0.72 (peak ~4.7px, gone in 0.38s), 17 red shards + 24 gold streaks
     + a ring to r=125, the glass-smash-into-A-major chord, and a 520ms punch-out of 18 growing
     holes that eats the cream page and reveals the lit ATRIUM. Verdict announced 0.5s later.
   - timeout() returns 'lost' (do-the-thing) and fires the donor's 220->55Hz death pair once.
   - At difficulty 0 the aim guide draws the full 3-bounce dashed prediction and a red lock ring
     appears on CLOSE exactly on the headings that actually connect; difficulty 1 shows the first
     leg plus a 40px stub; difficulty 2 shows a 30px stub and no lock ring at all.
   BUG-IS-GAME (do not fix):
   - The bell reflects at 1.88 but the drawn guide reflects at a true 2.0. The dashes are a hair
     optimistic on long shots. Do NOT reconcile the two numbers — the guide being slightly
     generous is what makes a near-miss feel like your read instead of the game's.
   - Rails ADD 12% energy per bounce. A banked bell reaches CLOSE faster than a straight one
     could have. Physically wrong; it is the entire reason banking feels good.
   - The CLOSE hit circle (r=64) is much larger than the drawn button (265x68, half-height 34),
     so shots that visually sail over the button still count. The screen is easier to break than
     it looks — that is the gag.
   - The bell rebounds off the checkout screen at -0.58 velocity on the same frame it shatters it.
     It bounces off the thing it just destroyed.
   - The cream page is filled from (-10,-10) to (W+20,H+20), deliberately overscanned on all four
     sides. "Fixing" it to (0,0,W,H) reintroduces a 1px seam under the win jitter.
   - The page covers the whole screen and the guest, the bell, the aim guide and the rails are all
     drawn ON TOP of it. It looks like a layer-order mistake. It is the joke, and it is also the
     only reason the ricochet is readable at all.
   - The HUD is never greyscaled the way the donor greyscales its own: the shell owns the fuse and
     dimming it would break the reel's read of time remaining.
*/
