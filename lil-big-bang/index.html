     Steering is live from frame one, valid anywhere on the glass, and the target parks on release.
   - Every touchdown pulses if pulseCd <= 0: ring 8 -> 122 at hue 318, 0.48s cooldown, pulseHot=1
     decaying exp(-10*dt), and the bloom dies the moment pulseHot > 0.055 && centre distance < 116.
   - A win fires inside one frame: flash 0.5, shake 16, 26 particles + 20 sparks + two rings, the
     donor's soundKill transient and a 320/400/480/640 Hz chord; result() reports 'won' 0.26s later
     (timeout() already answers 'won' inside that window).
   - Any contact ends it instantly while armed — shard at 13+9+2 = 24px, bloom at 18+9+2 = 29px —
     with shake 22, flash 0.48, 34 particles, 28 hue-0 sparks and the 72 Hz saw. No hp, no i-frames.
     Nothing can kill while env.armed() is false; drift runs at half speed through the count-in.
   - Difficulty 0/1/2 seeds 1/2/3 shards at 78/78/117 px/s, spawned >=185px from the blade and
     >=96px from the bloom; they steer on 1-exp(-3*dt) toward the blade clipped to y<=660.
   - The bloom sits between y 140 and 520 with the cream ink rim pulsing on 8ths for the first 1.5s;
     the bottom 144px of the screen holds no read and no hazard.
   BUG-IS-GAME (do not fix):
   - The donor's chase spring is underdamped (zeta 0.60, ~9% overshoot on every approach). Aiming
     for the bloom's edge and arriving past it is the whole knife. Do not critically damp it.
   - A touchdown both steers AND pulses, so the blade lunges at wherever you tapped. Tapping across
     the screen to fire will throw you into the thing you were avoiding. Donor behaviour; keep it.
   - You cannot pulse without lifting your finger first — pointerdown is the trigger, and a finger
     already down is already spent. The lift is the reload.
   - Shards refuse to hunt below y=660, so the bottom of the screen is a bunker. You can hide there
     for the whole slot in perfect safety and lose anyway when the bell rings. That trade is the joke.
   - The bloom is lethal to touch and it is also the only way to win. The target and the trap are
     the same object; the 82px of air between 29 and 116 is the entire game.
   - danger only ever reaches 3/14, so the background barely brightens. That is the donor's formula
     running on a field with no bullets in it — leave the number alone.
*/

/* ===== carts/23-core.js ===== */
/* AFTERIMAGE — the core cracks its own shell to fire; dash into the crack, be the weapon */
(function () {
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  // donor lerp(a,b,t)=a+(b-a)*t, always fed t = 1-Math.pow(k,dt) so easing is frame-rate free
  function lerp(a, b, t) { return a + (b - a) * t; }

  /* ---- donor palette, quoted from afterimage-1 (1).html ------------------- */
  var BG = ['#080819', '#11071a', '#18050e'];                  // drawBackground() phase tint
  var SHARD = ['rgba(125,185,255,.82)', 'rgba(210,110,255,.82)', 'rgba(255,80,120,.88)'];
  var HALO = ['#568dff', '#c55cff', '#ff335e'];                // drawBoss() glowCircle halo
  var POLY = ['rgba(130,160,255,.34)', 'rgba(130,160,255,.34)', 'rgba(255,60,120,.34)'];
  var BUL = ['#ff4e7f', '#b85cff', '#ff9a3c'];                 // drawProjectiles(), by kind
  var STAR_HI = '#dce7ff', STAR_LO = '#7f8dad';                // drawBackground() star tiers
  var GRID = 'rgba(100,120,190,.10)';                          // the horizon rig
  var SHOT = 'rgba(150,230,255,.52)';                          // your own auto-fire
  var PLYR = '#25d9ff', TRAIL = 'rgba(60,210,255,1)', AIM = 'rgba(150,245,255,.9)';
  var SPK_P = '#7cecff', SPK_HIT = '#ff365d', SPK_BOSS = '#bb74ff', SPK_RED = '#ff4b79';
  var RING = '#87d9ff', RING2 = '#ff6688';
  var WHITE = '#ffffff';

  /* donor glowCircle() leaned on ctx.shadowBlur; the contract bans that in loops, so the
     same read (halo r*1.5 @ .22 over a hot core) is faked with stacked translucent discs. */
  function glow(g, px, py, r, core, halo, alpha) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = halo;
    g.globalAlpha = alpha * 0.10; g.beginPath(); g.arc(px, py, r * 2.7, 0, TAU); g.fill();
    g.globalAlpha = alpha * 0.20; g.beginPath(); g.arc(px, py, r * 1.9, 0, TAU); g.fill();
    g.globalAlpha = alpha * 0.34; g.beginPath(); g.arc(px, py, r * 1.35, 0, TAU); g.fill();
    g.globalAlpha = alpha; g.fillStyle = core;
    g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill();
    g.restore();
  }

  registerGame({
    id: 'core', title: 'AFTERIMAGE', command: 'STRIKE THE CORE!', family: 'tap', slotBeats: 8,
    create(env) {
      var W = env.W, H = env.H, D = env.difficulty | 0, R = env.rng;

      /* ================= donor constants, quoted from the source =================
         player {r:8, hp:4}                    boss {r:70, shards:9}
         dash() .14s at 1050px/s, cd .55, inv .22, shake 9, flash .18, 28 sparks
         hitPlayer() inv 1.05, shake 24, hitFlash .38, 45 sparks
         update() easings: pow(.0007,dt) pointer chase, pow(.3,dt) glide, pow(.04,dt) park
         auto-fire: every .075s, 880px/s, life 1.2, lands inside boss.r*.72
                    (the donor gives each shot r:2.3 and then never reads it — so do we)
         bossPattern() phase 0: ring of 18 @120 r4 kind1 / aimed 5 @250 r5 spread .15
                       phase 1: aimed 9 @330 r4 spread .11
                       phase 2: 6 spokes @360 r4 kind2
      ========================================================================== */
      var P_R = 8, P_HP = 4;
      var B_R = 70, SHARDS = 9;
      var DASH_V = 1050, DASH_T = 0.14, DASH_CD = 0.55, DASH_INV = 0.22;
      var HIT_INV = 1.05, HIT_SHAKE = 24, HIT_FLASH = 0.38;
      var STRIKE_R = B_R * 0.72;                    // donor's own "inside the boss" test: 50.4px
      var CHASE_K = 0.0007, GLIDE_K = 0.3, PARK_K = 0.04;
      var CHASE_MAX = 390, CHASE_GAIN = 4.2;
      var SHOT_CLK = 0.075, SHOT_V = 880, SHOT_LIFE = 1.2;
      var MARGIN = 22;

      /* THE ONE GEOMETRY CHANGE. The donor clamps you to y >= H*.32 (270px) while the boss
         sits at H*.23 (194px) with a 50px hit skin — i.e. in the donor you can never touch
         it, the dash is purely a dodge. Here the floor is lifted to 150 so the dodge becomes
         the weapon, and the hover is raised off the donor's H*.78 (658px) to keep the whole
         duel above the thumb line (H*2/3 = 563). */
      var PLAY_TOP = 150, PLAY_BOT = 556, HOVER_Y = 392;

      /* ---- the exchange: clench -> fire -> the shell cracks -> shut ---- */
      var OPEN_T = [0.85, 0.62, 0.46][D];           // how long the crack stays open
      var VENT = 0.10;                              // fire -> crack, the recoil beat
      var CHARGE0 = [1.05, 0.95, 0.86][D];          // first wind-up, ticking from frame one
      var CHARGE = [0.72, 0.66, 0.58][D];           // between exchanges

      /* ---- world ---- */
      var boss = { x: W * 0.5, y: H * 0.24, rot: R() * TAU, pulse: 0, crack: 0, chg: 0, dead: false };
      var pl = { x: W * 0.5, y: HOVER_Y + 46, vx: 0, vy: 0, hp: P_HP, aim: -Math.PI / 2,
        dash: 0, dashCD: 0, inv: 1, stun: 0, strike: 0, launchOpen: false, trail: [] };
      var stars = [];
      for (var si = 0; si < 54; si++)                // donor makeStars(): floor(W*H/6000) = 54
        stars.push({ x: R() * W, y: R() * H, z: R(), p: R() * TAU });
      var wob = R() * TAU;                          // this run's weave phase

      var bullets = [], shots = [], sparks = [], rings = [];
      var t = 0, shotClock = 0, chgTick = 0, humT = 0, answer = -1;
      var cyc = 'charge', cycT = CHARGE0, chargeLen = CHARGE0, open = false, shutAt = -9;
      // a dash launched inside the window still lands while the shell is visibly closing.
      // the crack eases shut on a 77ms time constant, so 0.18s is roughly "while you can
      // still see the gap" — commitment is judged at launch, contact is the follow-through.
      var GRACE = 0.18;
      var sealed = false, doomed = false, strikes = 0;
      var shake = 0, flash = 0, hitFlash = 0, hs = 0;
      var nova = 0, novaX = 0, novaY = 0;           // the strike frame is the frame you keep
      var done = 'pending', why = 'never';
      var bgGrad = null, vigGrad = null, hitGrad = null;

      /* ---- sfx: donor blip()/noiseBurst() recipes on the shell's two primitives -------
         donor blip(freq,dur,type,vol,slide) exp-ramps to freq+slide; noiseBurst is a
         highpassed-600Hz decaying hiss. The donor's 55Hz sawtooth hum ran through a 180Hz
         lowpass we don't have on this bus, so it is re-voiced as a bare sine pulse. */
      function blip(f, dur, type, vol, slide) {
        env.audio.tone({ f: f, f2: slide ? Math.max(20, f + slide) : 0, type: type, dur: dur, vol: vol });
      }
      function nb(dur, vol) { env.audio.noise({ dur: dur, vol: vol, hp: 600 }); }
      function sHum() { env.audio.tone({ f: 55, type: 'sine', dur: 0.42, vol: 0.05 }); }
      function sTick(k) { blip(240 + k * 300, 0.03, 'square', 0.045, 60); }
      function sFire() { blip(80 + D * 55, 0.5, 'triangle', 0.16, 400); nb(0.14, 0.10); }
      function sOpen() {                            // donor start(): the "we begin" chime
        blip(110, 0.30, 'sine', 0.14, 440);
        blip(880, 0.14, 'triangle', 0.09, 300);
        env.audio.noise({ dur: 0.05, vol: 0.08, hp: 2600 });
      }
      function sShut() { blip(150, 0.12, 'sine', 0.08, -70); }
      function sDash() { blip(170, 0.16, 'square', 0.15, 650); env.audio.noise({ dur: 0.07, vol: 0.06, hp: 600 }); }
      function sHit() { blip(95, 0.30, 'sawtooth', 0.16, -50); nb(0.22, 0.18); }
      function sBounce() { sHit(); blip(210, 0.18, 'square', 0.10, -120); }
      function sWin() {                             // donor win() + the chord the house wants
        nb(0.70, 0.16);
        blip(55, 0.90, 'sawtooth', 0.18, 660);
        env.audio.tone({ f: 440, type: 'sine', dur: 0.55, vol: 0.11 });
        env.audio.tone({ f: 660, type: 'sine', dur: 0.55, vol: 0.09 });
        env.audio.tone({ f: 880, type: 'triangle', dur: 0.45, vol: 0.08 });
        env.audio.tone({ f: 1320, type: 'sine', dur: 0.40, vol: 0.06 });
      }

      /* ---- fx spawners (donor spawnSpark / spawnBullet, caps added) ---- */
      /* lead: seconds of travel already spent at birth. The shell freezes the cartridge's
         final frame, so a win's particles get pre-advanced or the stamp shows a tidy dot. */
      function spark(px, py, a, s, kind, lead) {
        if (sparks.length >= 90) return;
        var vx = Math.cos(a) * s, vy = Math.sin(a) * s, u = lead || 0;
        sparks.push({ x: px + vx * u, y: py + vy * u, vx: vx, vy: vy,
          life: 0.35 + R() * 0.55, max: 1, kind: kind, size: 1 + R() * 3 });
      }
      function spawnB(px, py, a, s, r, kind) {
        if (bullets.length >= 56) return;
        bullets.push({ x: px, y: py, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: r, kind: kind, life: 9 });
      }
      function ring(px, py, r, a, vr, life) {
        if (rings.length >= 14) return;
        rings.push({ x: px, y: py, r: r, a: a, vr: vr, life: life });
      }
      function aimAtPlayer() { return Math.atan2(pl.y - boss.y, pl.x - boss.x); }

      /* ---- the exchange ---- */
      function fire() {
        // donor phase-0 ring: 18 curling bullets, i/18*TAU + boss.rot, 120px/s, r4, kind 1
        for (var i = 0; i < 18; i++) spawnB(boss.x, boss.y, i / 18 * TAU + boss.rot, 120, 4, 1);
        if (D >= 1) {                               // + donor phase-0 aimed volley
          var a0 = aimAtPlayer();
          for (i = -2; i <= 2; i++) spawnB(boss.x, boss.y, a0 + i * 0.15, 250, 5, 0);
        }
        if (D >= 2) {                               // + donor phase-1 aimed 9 and phase-2 spokes
          var a1 = aimAtPlayer();
          for (i = 0; i < 9; i++) spawnB(boss.x, boss.y, a1 + (i - 4) * 0.11, 330, 4, 0);
          for (i = 0; i < 6; i++) spawnB(boss.x, boss.y, t * 1.9 + i * TAU / 6, 360, 4, 2);
        }
        boss.pulse = 1;
        shake = Math.max(shake, 16); flash = Math.max(flash, 0.35);   // donor phase-change punch
        ring(boss.x, boss.y, B_R, 1, 500, 0.8);                       // donor phase-change ring
        sFire();
      }
      function crackOpen() {
        open = true; boss.crack = 0.55;             // snap, then settle — ease-OUT, never a fade-in
        ring(boss.x, boss.y, B_R * 0.5, 1, 420, 1);  // donor start() ring
        for (var i = 0; i < 14; i++) spark(boss.x, boss.y, R() * TAU, 60 + R() * 220, 0);
        sOpen();
      }
      function crackShut() { open = false; shutAt = t; sShut(); }

      function strike() {                           // donor win(), one exchange early
        done = 'won'; why = 'won'; open = false;
        novaX = boss.x; novaY = boss.y; nova = 1; boss.dead = true;
        // donor win() sets flash=1 and shake=30. In the donor that white-out DECAYS over ~0.4s;
        // here the shell freezes this exact frame and holds it for a whole beat, so flash=1
        // would be permanent fog — and the shell already lays its own 0.72-alpha cream wash
        // over the first 0.12s of the stamp. The wash is pulled back to 0.55 and the energy
        // moved into the nova, which is drawn ON TOP of it.
        hs = 0.06; flash = 0.55; shake = 30;
        bullets.length = 0; sparks.length = 0;      // donor win() clears the sky
        for (var i = 0; i < 9; i++)                 // the nine shards go first, outward
          spark(novaX, novaY, i / SHARDS * TAU + boss.rot, 520 + R() * 240, 3, 0.055);
        for (i = 0; i < 61; i++)                    // donor win() spray, capped for the contract
          spark(novaX, novaY, R() * TAU, 80 + R() * 900, 3, 0.045);
        for (var j = 0; j < 9; j++)                 // donor win() rings, pre-grown by 50ms
          ring(novaX, novaY, 20 + j * 7 + (220 + j * 90) * 0.05, 1 - j * 0.06, 220 + j * 90, 1.4);
        sWin();
      }
      function bounce() {                           // the shell was shut; you rang it like a bell
        var a = Math.atan2(pl.y - boss.y, pl.x - boss.x);
        pl.vx = Math.cos(a) * 620; pl.vy = Math.sin(a) * 620;
        pl.dash = 0; pl.dashCD = DASH_CD; pl.inv = 0; pl.stun = 0.9;
        hs = Math.max(hs, 0.045); shake = HIT_SHAKE; hitFlash = HIT_FLASH;
        boss.pulse = 1;
        ring(boss.x + Math.cos(a) * B_R, boss.y + Math.sin(a) * B_R, 8, 1, 520, 0.6);
        for (var i = 0; i < 24; i++) spark(pl.x, pl.y, a + (R() - 0.5) * 2.2, 120 + R() * 380, 2);
        sBounce();
        /* A bounce used to seal the core for the rest of the slot — one stray tap and the
           round was already over, which is a trap when the command is STRIKE THE CORE!
           The first bounce now costs a real beat (stun, knockback, the answering volley)
           but the shell still opens again. Only a SECOND bounce seals it: the game teaches
           its rule with the first mistake instead of ending on it. */
        strikes++;
        answer = 0.22;
        if (strikes >= 2 && !doomed) { doomed = true; sealed = true; }
      }
      function answerVolley() {                     // donor phase-0 aimed 5, at a pilot who is reeling
        var a = aimAtPlayer();
        for (var i = -2; i <= 2; i++) spawnB(boss.x, boss.y, a + i * 0.15, 250, 5, 0);
        shake = Math.max(shake, 12); sFire();
      }
      function hitPlayer(b) {                       // donor hitPlayer(), verbatim numbers
        b.life = 0;
        pl.hp--; pl.inv = HIT_INV; shake = HIT_SHAKE; hitFlash = HIT_FLASH;
        for (var i = 0; i < 40; i++) spark(pl.x, pl.y, R() * TAU, 100 + R() * 500, 2);
        sHit();
        if (doomed || pl.hp <= 0) { done = 'lost'; hs = Math.max(hs, 0.10); }
      }
      function dash() {                             // donor dash(), aimed at the core instead of a pointer
        var dx = boss.x - pl.x, dy = boss.y - pl.y, m = Math.hypot(dx, dy) || 1;
        pl.dash = DASH_T; pl.dashCD = DASH_CD; pl.inv = DASH_INV;
        pl.strike = 0.50; pl.launchOpen = open;     // the contact test stays live for half a second
        pl.vx = dx / m * DASH_V; pl.vy = dy / m * DASH_V;
        shake = Math.max(shake, 9); flash = Math.max(flash, 0.18);
        ring(pl.x, pl.y, 10, 1, 700, 0.45);
        for (var i = 0; i < 28; i++)
          spark(pl.x, pl.y, Math.atan2(-dy, -dx) + (R() - 0.5) * 1.7, 180 + R() * 520, 1);
        sDash();
      }

      /* ---------------------------------- step -------------------------------- */
      function step(dt, inp) {
        if (hs > 0) {                               // the world stops; the shake keeps ringing
          hs -= dt; shake *= Math.pow(0.012, dt);
          flash = Math.max(0, flash - dt * 2.5);
          return;
        }
        t += dt;
        humT -= dt; if (humT <= 0) { humT = 0.45; sHum(); }   // the donor's 55Hz bed

        /* the core: donor motion, verbatim */
        boss.x = W * 0.5 + Math.sin(t * 0.45) * W * 0.10;
        boss.y = H * 0.23 + Math.sin(t * 0.9) * 18;
        boss.rot += dt * (0.45 + D * 0.32);
        boss.pulse = Math.max(0, boss.pulse - dt * 4);

        /* the exchange clock */
        if (done === 'pending') {
          cycT -= dt;
          if (cyc === 'charge') {
            var ck = clamp(1 - cycT / chargeLen, 0, 1);
            boss.chg = ck * ck;                     // the shell clenches late, then lets go
            chgTick -= dt;
            if (chgTick <= 0) { chgTick = 0.20 - 0.13 * ck; sTick(ck); }
            if (cycT <= 0) { boss.chg = 0; fire(); cyc = 'vent'; cycT = VENT; }
          } else if (cyc === 'vent') {
            if (cycT <= 0) {
              cyc = sealed ? 'charge' : 'open';     // a sealed core never opens again this slot
              cycT = sealed ? (chargeLen = CHARGE) : OPEN_T;
              if (!sealed) crackOpen();
            }
          } else {
            if (cycT <= 0) { crackShut(); cyc = 'charge'; cycT = chargeLen = CHARGE; }
          }
        }
        var wantCrack = open ? 1 : 0;
        boss.crack += (wantCrack - boss.crack) * Math.min(1, dt * (open ? 30 : 13));
        if (answer > 0) { answer -= dt; if (answer <= 0) { answer = -1; answerVolley(); } }

        /* ---- THE TAP: one verb, valid anywhere on the screen ---- */
        if (inp.justDown && done === 'pending' && pl.dashCD <= 0) dash();

        /* ---- the pilot: donor pointer-chase with the pointer replaced by an autopilot ---- */
        pl.inv = Math.max(0, pl.inv - dt);
        pl.dash = Math.max(0, pl.dash - dt);
        pl.dashCD = Math.max(0, pl.dashCD - dt);
        pl.stun = Math.max(0, pl.stun - dt);
        if (pl.dash <= 0 && pl.stun <= 0) {
          var tx = boss.x + Math.sin(t * 1.31 + wob) * 54;      // weave under the core
          var ty = HOVER_Y + Math.sin(t * 0.83 + wob) * 22;
          for (var q = 0; q < bullets.length; q++) {            // and lean off the nearest threats
            var bb = bullets[q], ex = pl.x - bb.x, ey = pl.y - bb.y, ed = Math.hypot(ex, ey);
            if (ed < 150 && ed > 0.01) {
              var kk = 1 - ed / 150;
              tx += ex / ed * kk * 190; ty += ey / ed * kk * 150;
            }
          }
          tx = clamp(tx, MARGIN, W - MARGIN); ty = clamp(ty, 300, PLAY_BOT);
          var dx = tx - pl.x, dy = ty - pl.y, m = Math.hypot(dx, dy);
          if (m > 6) {
            var sp = Math.min(CHASE_MAX, m * CHASE_GAIN), e = 1 - Math.pow(CHASE_K, dt);
            pl.vx = lerp(pl.vx, dx / m * sp, e); pl.vy = lerp(pl.vy, dy / m * sp, e);
          } else { pl.vx *= Math.pow(PARK_K, dt); pl.vy *= Math.pow(PARK_K, dt); }
        }
        if (pl.dash <= 0) { pl.vx *= Math.pow(GLIDE_K, dt); pl.vy *= Math.pow(GLIDE_K, dt); }
        pl.x += pl.vx * dt; pl.y += pl.vy * dt;
        pl.x = clamp(pl.x, MARGIN, W - MARGIN);
        pl.y = clamp(pl.y, PLAY_TOP, PLAY_BOT + 40);
        pl.aim = Math.atan2(boss.y - pl.y, boss.x - pl.x);      // the nose always names the target
        pl.trail.unshift({ x: pl.x, y: pl.y, d: pl.dash > 0 });
        if (pl.trail.length > 32) pl.trail.pop();

        /* ---- contact: only a live dash can reach the core ---- */
        if (pl.strike > 0 && done === 'pending') {
          pl.strike -= dt;
          if (Math.hypot(pl.x - boss.x, pl.y - boss.y) < STRIKE_R) {
            pl.strike = 0;
            if (open || (pl.launchOpen && t - shutAt < GRACE)) strike();
            else if (env.armed()) { why = pl.launchOpen ? 'late' : 'shut'; bounce(); }
            else { pl.vx *= -0.5; pl.vy *= -0.5; sShut(); }     // unarmed: a nudge, never a verdict
          }
        }

        /* ---- your auto-fire: it chips, it glitters, it will never be enough ---- */
        shotClock -= dt;
        while (shotClock <= 0 && !boss.dead) {
          shotClock += SHOT_CLK;
          if (shots.length < 30) {
            var sa = Math.atan2(boss.y - pl.y, boss.x - pl.x);
            shots.push({ x: pl.x, y: pl.y, vx: Math.cos(sa) * SHOT_V, vy: Math.sin(sa) * SHOT_V, life: SHOT_LIFE });
          }
          if (R() < 0.18) blip(260 + R() * 70, 0.025, 'triangle', 0.018, 90);
        }
        for (var i = shots.length - 1; i >= 0; i--) {
          var s = shots[i];
          s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
          if (s.life <= 0) { shots.splice(i, 1); continue; }
          if (!boss.dead && Math.hypot(s.x - boss.x, s.y - boss.y) < STRIKE_R) {
            shots.splice(i, 1);
            boss.pulse = Math.min(1, boss.pulse + 0.06);        // donor damageBoss(.0019): a scratch
            if (sparks.length < 60) spark(boss.x + (R() - 0.5) * 70, boss.y + (R() - 0.5) * 70, R() * TAU, 80 + R() * 240, 3);
          }
        }

        /* ---- the burst ---- */
        for (i = bullets.length - 1; i >= 0; i--) {
          var b = bullets[i];
          b.life -= dt;
          if (b.kind === 1) {                       // donor: kind 1 curls +.9 rad/s
            var c1 = Math.cos(0.9 * dt), s1 = Math.sin(0.9 * dt);
            var vx1 = b.vx * c1 - b.vy * s1; b.vy = b.vx * s1 + b.vy * c1; b.vx = vx1;
          } else if (b.kind === 2) {                // kind 2 curls -.7 rad/s
            var c2 = Math.cos(-0.7 * dt), s2 = Math.sin(-0.7 * dt);
            var vx2 = b.vx * c2 - b.vy * s2; b.vy = b.vx * s2 + b.vy * c2; b.vx = vx2;
          }
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.life <= 0 || b.x < -100 || b.x > W + 100 || b.y < -100 || b.y > H + 100) { bullets.splice(i, 1); continue; }
          if (done === 'pending' && env.armed() && pl.inv <= 0 &&
              Math.hypot(b.x - pl.x, b.y - pl.y) < b.r + P_R) { hitPlayer(b); bullets.splice(i, 1); }
        }

        /* ---- fx (donor updateFX(), verbatim decays) ---- */
        for (i = sparks.length - 1; i >= 0; i--) {
          var p = sparks[i];
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= Math.pow(0.12, dt); p.vy *= Math.pow(0.12, dt);
          p.life -= dt;
          if (p.life <= 0) sparks.splice(i, 1);
        }
        for (i = rings.length - 1; i >= 0; i--) {
          var rr = rings[i]; rr.r += rr.vr * dt; rr.a -= dt / rr.life;
          if (rr.a <= 0) rings.splice(i, 1);
        }
        shake *= Math.pow(0.012, dt);
        flash = Math.max(0, flash - dt * 2.5);
        hitFlash = Math.max(0, hitFlash - dt * 2.1);
        if (nova > 0) nova = Math.max(0, nova - dt * 2.6);
      }

      /* --------------------------------- render -------------------------------- */
      function drawBg(g) {
        if (!bgGrad) {
          bgGrad = g.createRadialGradient(W * 0.5, H * 0.3, 0, W * 0.5, H * 0.3, Math.max(W, H) * 0.9);
          bgGrad.addColorStop(0, BG[D]); bgGrad.addColorStop(0.55, '#03030a'); bgGrad.addColorStop(1, '#000');
        }
        g.fillStyle = bgGrad; g.fillRect(0, 0, W, H);
        g.save(); g.globalCompositeOperation = 'screen';
        for (var i = 0; i < stars.length; i++) {   // donor: scroll 8+40z, twinkle .18+.48
          var s = stars[i], yy = (s.y + t * (8 + 40 * s.z)) % (H + 30) - 15;
          g.globalAlpha = 0.18 + 0.48 * (0.5 + 0.5 * Math.sin(t * (0.8 + s.z * 2) + s.p));
          g.fillStyle = s.z > 0.72 ? STAR_HI : STAR_LO;
          g.fillRect(s.x, yy, 1 + s.z * 1.3, 1 + s.z * 1.3);
        }
        g.restore();
        g.save(); g.translate(W * 0.5, H * 0.72);  // donor horizon rig: 14 ellipses + 17 spokes

        for (i = 0; i < 14; i++) {
          var q = i / 14;
          g.globalAlpha = 1 - q * 0.72;
          g.beginPath(); g.ellipse(0, q * q * H * 0.5, W * (0.12 + q * 0.78), H * (0.018 + q * 0.11), 0, Math.PI, TAU); g.stroke();
        }
        g.globalAlpha = 1; g.beginPath();
        for (i = -8; i <= 8; i++) { g.moveTo(i * W * 0.035, 0); g.lineTo(i * W * 0.14, H * 0.42); }
        g.stroke();
        g.restore();
      }

      function drawBoss(g) {
        if (boss.dead) return;
        var op = boss.crack;                        // 0 shut .. 1 cracked wide
        var r = B_R * (1 + boss.pulse * 0.15) * (1 + op * 0.10) * (1 - boss.chg * 0.11);
        g.save(); g.translate(boss.x, boss.y); g.rotate(boss.rot);
        g.globalCompositeOperation = 'lighter';
        for (var i = 0; i < SHARDS; i++) {          // donor shard ring: 9 bars, fillRect(-5,-18,10,36)
          // shut r*1.15 (donor) -> cracked r*1.75; the core sways +-39px, so this is the
          // widest the shell can throw them and still land inside 390px
          var rr = r * (1.15 + op * 0.60 - boss.chg * 0.24) + Math.sin(t * 2 + i) * 8;
          g.save();
          g.rotate(i / SHARDS * TAU); g.translate(rr, 0);
          g.rotate(Math.PI / 4 + t * (i % 2 ? 1 : -1) * (1 + op * 2.4));

          g.beginPath();
          var sides = 3 + k;
          for (i = 0; i <= sides; i++) {
            var a = i / sides * TAU + t * (k % 2 ? 0.6 : -0.45);
            var pr = r * (0.42 + k * 0.12) * (1 + 0.08 * Math.sin(t * 3 + k)) * (1 + op * 0.6);

          g.beginPath(); g.arc(boss.x, boss.y, r * (1.0 + 0.80 * kf), 0, TAU); g.stroke();

      function drawProjectiles(g) {
        g.save(); g.globalCompositeOperation = 'lighter';
        g.strokeStyle = SHOT; g.lineWidth = 1.3;    // your auto-fire: short cyan dashes
        g.beginPath();
        for (var i = 0; i < shots.length; i++) {

          g.moveTo(s.x - s.vx * 0.014, s.y - s.vy * 0.014); g.lineTo(s.x, s.y);

        g.stroke();
        for (var k = 0; k < 3; k++) {               // batched by kind: 3 paths per colour, not 3 per bullet
          g.strokeStyle = BUL[k]; g.fillStyle = BUL[k]; g.lineWidth = 2;
          g.globalAlpha = 0.28; g.beginPath();
          for (i = 0; i < bullets.length; i++) {
            var b = bullets[i]; if (b.kind !== k) continue;
            g.moveTo(b.x - b.vx * 0.035, b.y - b.vy * 0.035); g.lineTo(b.x, b.y);
          }
          g.stroke();
          g.globalAlpha = 0.30; g.beginPath();
          for (i = 0; i < bullets.length; i++) {
            var b2 = bullets[i]; if (b2.kind !== k) continue;

          }

          g.globalAlpha = 0.95; g.beginPath();

      function drawPlayer(g) {

      function drawFX(g) {

        for (var i = 0; i < sparks.length; i++) {   // donor: velocity-stretched lines, never dots
          var s = sparks[i], q = clamp(s.life / s.max, 0, 1);

          g.strokeStyle = s.kind === 2 ? SPK_HIT : s.kind === 3 ? (D === 2 ? SPK_RED : SPK_BOSS) : SPK_P;
          g.lineWidth = s.size;
          g.beginPath(); g.moveTo(s.x, s.y); g.lineTo(s.x - s.vx * 0.025, s.y - s.vy * 0.025); g.stroke();
        }
        g.lineWidth = 2; g.strokeStyle = D === 2 ? RING2 : RING;
        for (i = 0; i < rings.length; i++) {
          var r = rings[i];
          g.globalAlpha = Math.max(0, r.a);
          g.beginPath(); g.arc(r.x, r.y, r.r, 0, TAU); g.stroke();
        }
        g.restore();
      }

      function render(g) {
        drawBg(g);
        var sh = shake;                             // donor jitters with Math.random; seeded trig here
        g.save();
        if (sh > 0.05) g.translate(Math.sin(t * 231) * sh * 0.5, Math.cos(t * 197) * sh * 0.5);
        drawBoss(g);
        drawProjectiles(g);
        drawPlayer(g);
        drawFX(g);

        if (t < 1.6 && !boss.dead) {
          var e8 = 1 - ((env.beatPhase() * 2) % 1);
          g.save();
          g.globalAlpha = clamp((1.6 - t) / 0.45, 0, 1) * (0.32 + 0.68 * e8) * 0.85;
          g.strokeStyle = env.ink; g.lineWidth = 2.5;
          g.beginPath(); g.arc(boss.x, boss.y, B_R * (1.34 + 0.06 * e8), 0, TAU); g.stroke();
          g.restore();
        }
        g.restore();
        if (flash > 0) { g.fillStyle = 'rgba(220,235,255,' + (flash * 0.35).toFixed(3) + ')'; g.fillRect(0, 0, W, H); }
        // the kill punches THROUGH the donor's white-out — the strike frame is the one the
        // shell freezes for the stamp, so the detonation has to be legible in a single frame
        if (nova > 0) {

          glow(g, novaX, novaY, 50 * (0.55 + nk * 0.45), WHITE, SPK_P, nk);
          g.save(); g.globalCompositeOperation = 'lighter';
          g.strokeStyle = WHITE; g.globalAlpha = nk;
          g.lineWidth = 7 * nk; g.beginPath(); g.arc(novaX, novaY, 92 * (1.7 - nk), 0, TAU); g.stroke();
          g.lineWidth = 4 * nk; g.beginPath(); g.arc(novaX, novaY, 150 * (2.1 - nk), 0, TAU); g.stroke();
          g.strokeStyle = SPK_P; g.globalAlpha = nk * 0.8; g.lineWidth = 2.5 * nk;
          g.beginPath(); g.arc(novaX, novaY, 210 * (2.4 - nk), 0, TAU); g.stroke();
          g.restore();

        if (hitFlash > 0) {                         // donor: red closes in from the edges
          if (!hitGrad) {
            hitGrad = g.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.75);
            hitGrad.addColorStop(0, 'rgba(255,0,60,0)'); hitGrad.addColorStop(1, 'rgba(255,0,60,1)');
          }
          g.save(); g.globalAlpha = hitFlash * 0.55; g.fillStyle = hitGrad; g.fillRect(0, 0, W, H); g.restore();
        }
        g.save(); g.globalCompositeOperation = 'multiply';   // donor vignette
        if (!vigGrad) {
          vigGrad = g.createRadialGradient(W * 0.5, H * 0.5, Math.min(W, H) * 0.2, W * 0.5, H * 0.5, Math.max(W, H) * 0.7);
          vigGrad.addColorStop(0, 'rgba(255,255,255,1)'); vigGrad.addColorStop(1, 'rgba(0,0,0,.28)');
        }
        g.fillStyle = vigGrad; g.fillRect(0, 0, W, H);
        g.restore();
        if (hs > 0) { g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, W, H); }
      }

      /* ---- QA bot: hold still until the shell cracks, then dash the moment it does ---- */
      function hint() {
        if (done !== 'pending') return { type: 'wait', ms: 200 };
        // the dash burns ~(gap/1050 + 0.09)s of flight. Starting one it cannot finish inside
        // the window plus GRACE is a bounce, and a bounce is fatal — so sit the window out
        // and take the next one instead.
        var flight = Math.max(0, Math.hypot(boss.x - pl.x, boss.y - pl.y) - STRIKE_R) / DASH_V + 0.09;
        if (open && cycT + GRACE > flight + 0.10 && pl.dashCD <= 0 && !doomed)
          return { type: 'tap', x: boss.x, y: boss.y };
        return { type: 'wait', ms: 60 };
      }

      return {
        step: step,
        render: render,
        result: function () { return done; },
        timeout: function () { return done !== 'pending' ? done : 'lost'; },
        line: function () {
          return why === 'shut' ? 'the shell was shut. it felt that.'
            : why === 'late' ? 'you arrived. the door did not wait.'
            : 'it opened for you. you were busy.';
        },
        hint: hint,
      };
    },
  });
})();

      // vanish on it. The other five rotate exactly as the donor's moods do.
      const PALETTES = [
        { name: 'EGG', background: '#16091f', deep: '#090611', sun: '#fff36a', hot: '#ff4f91', cool: '#67f5de', ink: '#120b20' },
        { name: 'POOL', background: '#061c32', deep: '#020b18', sun: '#ffdf71', hot: '#ff6c5f', cool: '#58e7ff', ink: '#031524' },
        { name: 'BRUISE', background: '#24103d', deep: '#090511', sun: '#d9ff5b', hot: '#ff4fd8', cool: '#8d7cff', ink: '#110820' },
        { name: 'JUICE', background: '#3a0d20', deep: '#13040b', sun: '#ffe078', hot: '#ff5c35', cool: '#7dffb2', ink: '#200610' },
        { name: 'BLUE HOUR', background: '#101c4a', deep: '#050817', sun: '#f9f4ff', hot: '#f279ff', cool: '#6fc6ff', ink: '#090d29' },

      };

        dtone(f * 2, 0.08, 0.022, 'triangle', 0.98, 0.012);
      };
      const sfxPulse = () => dtone(150, 0.12, 0.075, 'triangle', 1.9);      // donor pulse()
      const sfxBumper = (p) => {                                            // donor bumper(power)
        dtone(92 + p * 35, 0.16, 0.14, 'sine', 0.38);
        dtone(260 + p * 80, 0.07, 0.035, 'square', 0.72);
      };
      const sfxOrbit = () => {                        // donor orbit(): A major arpeggio, 4 voices
        [0, 0.07, 0.14, 0.22].forEach((delay, i) => {
          dtone(220 * Math.pow(2, [0, 4, 7, 12][i] / 12), 0.34, 0.11, 'sine', 1.02, delay);
        });
        env.audio.noise({ dur: 0.22, vol: 0.05, hp: 900, t: 0.01 });        // the flare's hiss
      };

      // ---- fx -----------------------------------------------------------------------------
      function burst(x, y, color, count, speed, size) {          // donor particleBurst, cap 34
        const n = Math.min(count, 34);
        for (let i = 0; i < n; i++) {
          const a = env.rng() * TAU, v = speed * (0.35 + env.rng() * 0.8);
          parts.push({
            x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
            life: 0.45 + env.rng() * 0.55,      // two independent draws — see BUG-IS-GAME
            max: 0.45 + env.rng() * 0.55,
            size: size * (0.5 + env.rng()),
            color, drag: 0.95 + env.rng() * 0.035,
          });
        }
        while (parts.length > 120) parts.shift();
      }
      function ring(x, y, color, radius, maxLife, width) {       // donor addRing
        rings.push({ x, y, color, radius, life: maxLife, max: maxLife, width });
        if (rings.length > 12) rings.shift();
      }
      function resetSweep() { orbitAngle = null; travel = 0; quarter = 0; }

      // donor pulseAt(): every lift shoves the sun AWAY from where the finger left the glass
      function pulseAt(x, y, strength) {
        const dx = star.x - x, dy = star.y - y;
        const d = Math.max(18, Math.hypot(dx, dy));
        const reach = clamp(1 - d / 330, 0.12, 1);
        const impulse = (210 + 260 * reach) * strength;
        star.vx += (dx / d) * impulse; star.vy += (dy / d) * impulse;
        shake = Math.max(shake, 3.5 * reach);
        ring(x, y, C.hot, 14, 0.52, 3);
        burst(x, y, C.hot, 8, 120, 2);
        sfxPulse();
      }

      function win() {                                           // donor awardOrbit
        if (done !== 'pending') return;
        done = 'won'; verdictT = 0;
        shown = 1; winFlash = 0.5;
        flash = Math.max(flash, 0.35);
        shake = Math.max(shake, 9);
        burst(star.x, star.y, C.cool, 28, 220, 3.5);
        burst(star.x, star.y, C.sun, 16, 300, 3);
        ring(fingerX, fingerY, C.cool, 30, 0.9, 3);
        ring(star.x, star.y, C.sun, 16, 0.75, 3);
        sfxOrbit();
      }

      return {
        step(dt, inp) {
          t += dt;
          const live = done === 'pending';
          const armed = env.armed();
          if (!armed) handT = t;               // the beat the invisible hand lets go

          // ---- the finger --------------------------------------------------------------
          const down = live && !!inp.down;
          if (live && !down && wasDown) {
            // donor endPointer(): quick = held < 230ms AND moved < 24px; strength 1.08 / 0.62
            const moved = Math.hypot(lastX - dnX, lastY - dnY);
            pulseAt(lastX, lastY, (holdT < 0.23 && moved < 24) ? 1.08 : 0.62);
            resetSweep();                    // the donor wipes the sweep on EVERY lift
          }
          if (down) {
            if (!wasDown) { holdT = 0; dnX = inp.x; dnY = inp.y; everDown = true; } else holdT += dt;
            lastX = inp.x; lastY = inp.y; fingerX = inp.x; fingerY = inp.y;
          }
          if (live) wasDown = down;          // the frozen final frame keeps the hand that won

          // Count-in: an invisible hand holds the sun in orbit around this play's centre.
          // It is the whole instruction, wordlessly — and on the beat the hand lets go.
          if (!armed && !down && live) {
            const gx = CX - star.x, gy = CY - star.y;
            const gd = Math.max(14, Math.hypot(gx, gy));
            const ga = accelAt(gd);
            star.vx += (gx / gd) * ga * dt; star.vy += (gy / gd) * ga * dt;
          }

          if (live) {
            if (down) {
              // donor pull: accel grows with distance and caps, min distance 14
              const dx = inp.x - star.x, dy = inp.y - star.y;
              const d = Math.max(14, Math.hypot(dx, dy));
              const acc = accelAt(d);
              star.vx += (dx / d) * acc * dt; star.vy += (dy / d) * acc * dt;
              fingerD = d;
              inBand = d > BAND[0] && d < BAND[1];

              // ---- THE ORBIT TEST, donor-verbatim ------------------------------------
              const angle = Math.atan2(star.y - inp.y, star.x - inp.x);
              if (orbitAngle !== null && inBand) {
                const turn = normalizeAngle(angle - orbitAngle);
                if (Math.abs(turn) < 0.52) {                 // a jump this big is a teleport
                  if (Math.sign(turn) !== Math.sign(travel) && Math.abs(travel) > 0.7) {
                    travel *= 0.72;                          // doubling back costs you 28%
                    reverseT = 0.45;
                  }
                  travel += turn;
                  const q = Math.min(3, Math.floor(Math.abs(travel) / (NEED / 4)));
                  if (q > quarter) { quarter = q; sfxSpark(q - 1); ring(star.x, star.y, C.sun, 9, 0.34, 2); }
                  if (Math.abs(travel) >= NEED) win();
                }
              }
              orbitAngle = angle;
            } else { orbitAngle = null; travel = 0; quarter = 0; inBand = false; }
          }

          // ---- the sun's own physics (runs even after the verdict, so the frame lives) ----
          const nowShown = clamp(Math.abs(travel) / NEED, 0, 1);
          if (done === 'pending') {
            stall = nowShown > lastProg + 0.002 ? 0 : stall + dt;
            lastProg = nowShown;
            // the arc snaps up with you and drains over ~0.3s when the sweep is taken away
            shown = nowShown > shown ? nowShown : shown + (nowShown - shown) * clamp(dt * 9, 0, 1);
          }
          // count-in is attract mode: the sky coasts, so the sun arrives at the speed it was
          // seeded with and the first beat is a look, not a handicap.
          if (armed) { star.vx *= WX.drag; star.vy *= WX.drag; }  // donor: pow(drag, step*60), step=dt
          let speed = Math.hypot(star.vx, star.vy);
          const maxSpeed = 860 * WX.speed;
          if (speed > maxSpeed) { star.vx *= maxSpeed / speed; star.vy *= maxSpeed / speed; speed = maxSpeed; }
          if (armed && speed < 58 && !down) {                  // donor idle nudge, so it never parks
            const n = t * 0.8 + A0;
            star.vx += Math.cos(n) * 16 * dt; star.vy += Math.sin(n) * 16 * dt;
          }
          star.x += star.vx * dt; star.y += star.vy * dt;
          star.angle = Math.atan2(star.vy, star.vx);
          star.squash += (clamp(speed / 700, 0, 0.38) - star.squash) * clamp(dt * 9, 0, 1);

          // walls: the sky's ceiling and its horizon — the sun never enters the thumb zone.
          // donor wallHit(x, y): 0.12s cooldown, shake clamp(speed/110, 2, 7), 8 cool particles
          wallT = Math.max(0, wallT - dt);
          const wallHit = (x, y) => {
            if (wallT > 0) return;
            wallT = 0.12;
            shake = Math.max(shake, clamp(speed / 110, 2, 7));
            burst(x, y, C.cool, 8, 115, 2.2);
            sfxBumper(clamp(speed / 850, 0.1, 0.7));
          };
          if (star.x < SX0) { star.x = SX0; star.vx = Math.abs(star.vx) * 0.92; wallHit(star.x, star.y); }
          else if (star.x > SX1) { star.x = SX1; star.vx = -Math.abs(star.vx) * 0.92; wallHit(star.x, star.y); }
          if (star.y < SY0) { star.y = SY0; star.vy = Math.abs(star.vy) * 0.92; wallHit(star.x, star.y); }
          else if (star.y > SY1) { star.y = SY1; star.vy = -Math.abs(star.vy) * 0.92; wallHit(star.x, star.y); }

          trail.push(star.x, star.y);
          while (trail.length > MAXTRAIL * 2) trail.splice(0, 2);
          wedgeR += ((fingerD || 118) - wedgeR) * clamp(dt * 14, 0, 1);  // hug the sun, don't trail it

          // ---- fx decay -----------------------------------------------------------------
          for (let i = parts.length - 1; i >= 0; i--) {
            const p = parts[i];
            p.life -= dt;
            if (p.life <= 0) { parts.splice(i, 1); continue; }
            p.vx *= p.drag; p.vy *= p.drag;
            p.x += p.vx * dt; p.y += p.vy * dt;
          }
          for (let i = rings.length - 1; i >= 0; i--) {
            const r = rings[i];
            r.life -= dt; r.radius += dt * 78;
            if (r.life <= 0) rings.splice(i, 1);
          }
          flash = Math.max(0, flash - dt * 1.7);              // donor decay rates
          shake = Math.max(0, shake - dt * 24);
          winFlash = Math.max(0, winFlash - dt * 1.5);
          reverseT = Math.max(0, reverseT - dt);
          // The mood drifts across the slot, the way the donor's sky cross-fades. Rebuilt only
          // when the blend actually moves a step — every derived colour hangs off it, and none
          // of them need to be re-mixed sixty times a second to look continuous.
          const step48 = Math.round(smoothstep(t / 6) * 0.42 * 48);
          if (step48 !== blendStep) { blendStep = step48; C = mood(step48 / 48); }
          if (done !== 'pending') verdictT += dt;
        },

        render(g) {
          const speed = Math.hypot(star.vx, star.vy);
          const speedMix = clamp(speed / 860, 0, 1);

          // (1) donor sky: linear ground + an ambient halo that travels with the sun
          const base = g.createLinearGradient(0, 0, W, H);
          base.addColorStop(0, C.skyTop);
          base.addColorStop(0.48, C.deep);
          base.addColorStop(1, C.skyLow);
          g.fillStyle = base; g.fillRect(0, 0, W, H);

          g.save();
          if (shake > 0.4) g.translate(Math.sin(t * 88.1) * shake * 0.5, Math.cos(t * 71.7) * shake * 0.5);

          const amb = g.createRadialGradient(star.x, star.y, 18, star.x, star.y, H * 0.82);
          amb.addColorStop(0, withAlpha(C.sun, 0.105 + speedMix * 0.025));
          amb.addColorStop(0.18, withAlpha(C.hot, 0.04));
          amb.addColorStop(0.58, withAlpha(C.background, 0.06));
          amb.addColorStop(1, withAlpha(C.deep, 0));
          g.fillStyle = amb; g.fillRect(0, 0, W, H);

          // (2) the corridor: the donor's own 48..210 gate, drawn around your thumb
          if (wasDown && done === 'pending') {
            const ok = inBand;
            g.save(); g.setLineDash([3, 9]); g.lineWidth = 1;
            g.strokeStyle = withAlpha(ok ? C.cool : C.hot, ok ? 0.24 : 0.46);
            g.beginPath(); g.arc(fingerX, fingerY, BAND[0], 0, TAU); g.stroke();
            g.globalAlpha = 0.6;                 // the far wall is advisory; the near one bites
            g.beginPath(); g.arc(fingerX, fingerY, BAND[1], 0, TAU); g.stroke();
            g.restore();
          }

          // (3) the swept sector — the leading edge is pinned to the sun, so the wedge IS
          //     the ground you have covered. Capped at one turn; the arcs carry the overflow.
          if (wasDown && Math.abs(travel) > 0.02) {
            const now = Math.atan2(star.y - fingerY, star.x - fingerX);
            const sw = clamp(Math.abs(travel), 0, TAU) * Math.sign(travel);
            g.save(); g.globalCompositeOperation = 'screen';
            g.fillStyle = withAlpha(reverseT > 0 ? C.hot : C.cool, 0.075 + shown * 0.06);
            g.beginPath(); g.moveTo(fingerX, fingerY);
            g.arc(fingerX, fingerY, wedgeR, now - sw, now, sw < 0);
            g.closePath(); g.fill();
            g.globalAlpha = 0.5; g.lineWidth = 1.4;
            g.strokeStyle = withAlpha(C.cool, 0.5);
            g.beginPath(); g.arc(fingerX, fingerY, wedgeR, now - sw, now, sw < 0); g.stroke();
            g.restore();
          }

          // (4) the tether + the donor's four pointer rings; the outer one is the progress arc
          if (wasDown && done === 'pending') {
            const pull = clamp(1 - fingerD / 560, 0.13, 0.84);
            const mx = (star.x + fingerX) * 0.5 + (star.y - fingerY) * 0.1;
            const my = (star.y + fingerY) * 0.5 + (fingerX - star.x) * 0.1;
            g.save(); g.globalCompositeOperation = 'screen'; g.lineCap = 'round';
            g.beginPath(); g.moveTo(star.x, star.y); g.quadraticCurveTo(mx, my, fingerX, fingerY);
            g.globalAlpha = 0.32 + pull * 0.24;
            g.strokeStyle = C.tether; g.lineWidth = 1.1; g.stroke();
            for (let i = 0; i < 3; i++) {
              g.globalAlpha = (0.34 - i * 0.052) * pull;
              g.strokeStyle = i % 2 ? C.sun : C.cool;
              g.lineWidth = i === 0 ? 1.6 : 0.7;
              g.beginPath();
              g.arc(fingerX, fingerY, 13 + i * 13 + Math.sin(t * 4.7 - i * 0.7) * 2.8, 0, TAU);
              g.stroke();
            }
            g.restore();
            arcGauge(g, fingerX, fingerY, 52, 3, 0.55);
          }

          // (5) the comet wake — donor's three tapered spline passes, faked without shadows
          const n = trail.length / 2;
          if (n > 3) {
            g.save(); g.globalCompositeOperation = 'screen'; g.lineCap = 'round'; g.lineJoin = 'round';
            // the wide hot halo carries no taper the eye can see, so it goes down as ONE spline
            g.strokeStyle = C.hot; g.globalAlpha = 0.055; g.lineWidth = star.r * 1.7;
            g.beginPath();
            g.moveTo((trail[0] + trail[2]) * 0.5, (trail[1] + trail[3]) * 0.5);
            for (let i = 1; i < n - 1; i++) {
              g.quadraticCurveTo(trail[i * 2], trail[i * 2 + 1],
                (trail[i * 2] + trail[(i + 1) * 2]) * 0.5, (trail[i * 2 + 1] + trail[(i + 1) * 2 + 1]) * 0.5);
            }
            g.stroke();
            // two tapered passes; the white core only rides the freshest half of the wake
            const passes = [[star.r * 1.06, 0.17, C.sun, 1], [star.r * 0.25, 0.78, '#ffffff', 0.5]];
            for (const p of passes) {
              g.strokeStyle = p[2];
              const from = Math.max(1, Math.floor((n - 2) * (1 - p[3])));
              for (let i = from; i < n - 1; i++) {
                const ax = trail[(i - 1) * 2], ay = trail[(i - 1) * 2 + 1];
                const bx = trail[i * 2], by = trail[i * 2 + 1];
                const cx2 = trail[(i + 1) * 2], cy2 = trail[(i + 1) * 2 + 1];
                const prog = i / Math.max(1, n - 2);
                const taper = 0.07 + Math.pow(prog, 1.55) * 0.93;
                g.globalAlpha = p[1] * (0.22 + prog * 0.78);
                g.lineWidth = p[0] * taper;
                g.beginPath();
                g.moveTo((ax + bx) * 0.5, (ay + by) * 0.5);
                g.quadraticCurveTo(bx, by, (bx + cx2) * 0.5, (by + cy2) * 0.5);
                g.stroke();
              }
            }
            g.restore();
          }

          // (6) particles and rings
          g.save(); g.globalCompositeOperation = 'screen'; g.lineCap = 'round';
          for (const p of parts) {
            const a = clamp(p.life / p.max, 0, 1);
            g.globalAlpha = a * 0.84;
            g.strokeStyle = p.color;
            g.lineWidth = Math.max(0.65, p.size * (0.24 + a * 0.3));
            g.beginPath(); g.moveTo(p.x, p.y);
            g.lineTo(p.x - p.vx * 0.022, p.y - p.vy * 0.022); g.stroke();
          }
          for (const r of rings) {
            const a = clamp(r.life / r.max, 0, 1);
            g.globalAlpha = a * 0.62;
            g.strokeStyle = r.color; g.lineWidth = r.width * clamp(a, 0.18, 1);
            g.beginPath(); g.arc(r.x, r.y, r.radius, 0, TAU); g.stroke();
          }
          g.restore();

          // (7) the sun: corona, rays, photosphere — the donor's living miniature star
          const sunR = star.r * 1.16 * (done === 'won' ? 1.18 : 1);
          const coronaR = sunR * 5.7 * (1 + speedMix * 0.08);
          g.save(); g.globalCompositeOperation = 'screen';
          const cor = g.createRadialGradient(star.x, star.y, sunR * 0.1, star.x, star.y, coronaR);
          cor.addColorStop(0, withAlpha('#ffffff', done === 'won' ? 0.44 : 0.34));
          cor.addColorStop(0.12, withAlpha(C.sun, done === 'won' ? 0.52 : 0.37));
          cor.addColorStop(0.4, withAlpha(done === 'won' ? C.hot : C.sun, 0.09));
          cor.addColorStop(1, withAlpha(C.sun, 0));
          g.fillStyle = cor;
          g.beginPath(); g.arc(star.x, star.y, coronaR, 0, TAU); g.fill();
          g.translate(star.x, star.y); g.rotate(t * 0.07);
          // donor rayCount 22, batched into the two line weights it actually uses: the shimmer
          // that reads is the varying LENGTH, and that survives the batching intact.
          g.strokeStyle = C.sun; g.lineCap = 'round';
          for (let pass = 0; pass < 2; pass++) {
            g.lineWidth = pass ? 1.1 : 0.6;
            g.globalAlpha = 0.086 * (pass ? 1 : 0.86);
            g.beginPath();
            for (let ray = 0; ray < 22; ray++) {
              if ((ray % 5 === 0) !== !!pass) continue;
              const a = (ray / 22) * TAU;
              const sh = 0.68 + Math.sin(t * 4.1 + ray * 2.6) * 0.22;
              const inner = sunR * (1.18 + (ray % 3) * 0.05);
              const outer = inner + sunR * (0.5 + sh * 0.72);
              g.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
              g.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
            }
            g.stroke();
          }
          g.restore();

          g.save();
          g.translate(star.x, star.y); g.rotate(star.angle);
          g.scale(1 + star.squash, 1 - star.squash * 0.56);
          const core = g.createRadialGradient(-sunR * 0.3, -sunR * 0.35, sunR * 0.04, 0, 0, sunR * 1.06);
          core.addColorStop(0, '#ffffff');
          core.addColorStop(0.18, C.coreA);
          core.addColorStop(0.58, C.sun);
          core.addColorStop(0.86, C.coreB);
          core.addColorStop(1, C.coreC);
          g.fillStyle = core;
          g.shadowColor = C.sun; g.shadowBlur = 10;            // the one glow, on the one hero
          g.beginPath(); g.arc(0, 0, sunR, 0, TAU); g.fill();
          g.shadowBlur = 0;
          g.globalCompositeOperation = 'screen';
          g.globalAlpha = 0.3; g.strokeStyle = '#ffffff'; g.lineWidth = 0.7;
          g.beginPath(); g.arc(0, 0, sunR * 0.9, -Math.PI * 0.82, Math.PI * 0.12); g.stroke();
          g.restore();

          // shared marking: cream rim on the one interactive-critical object, 8ths, first 1.5s
          if (t < 1.6) {
            const p8 = 0.5 + 0.5 * Math.sin(env.beatPhase() * Math.PI * 4);
            g.globalAlpha = 0.24 + 0.44 * p8;
            g.strokeStyle = env.ink; g.lineWidth = 1.6;
            g.beginPath(); g.arc(star.x, star.y, sunR + 7, 0, TAU); g.stroke();
            g.globalAlpha = 1;
          }

          // (8) the sun is out of the corridor — say so, above it, never under the thumb
          if (wasDown && done === 'pending' && !inBand && Math.abs(travel) < NEED) {
            g.textAlign = 'center';
            g.font = '700 10px "Consolas","Courier New",monospace';
            g.fillStyle = withAlpha(C.hot, 0.55 + 0.35 * Math.abs(Math.sin(t * 7)));
            g.fillText(fingerD <= BAND[0] ? 'TOO CLOSE' : 'TOO WIDE',
              clamp(star.x, 44, W - 44), clamp(star.y - sunR - 18, 112, SY1));
          }
          g.restore();  // shake off

          // (9) horizon: the sky's floor. Below it is thumb country and nothing lives there.
          const floor = g.createLinearGradient(0, SY1 - 14, 0, H);
          floor.addColorStop(0, withAlpha(C.deep, 0));
          floor.addColorStop(0.42, withAlpha(C.deep, 0.72));
          floor.addColorStop(1, withAlpha('#000000', 0.86));
          g.fillStyle = floor; g.fillRect(0, SY1 - 14, W, H - SY1 + 14);

          if (flash > 0) { g.fillStyle = withAlpha(C.cool, flash * 0.2); g.fillRect(0, 0, W, H); }
          if (winFlash > 0) { g.fillStyle = withAlpha(C.sun, winFlash * 0.16); g.fillRect(0, 0, W, H); }

          // (10) the occlusion-proof read: the same arc, nailed to the top third
          arcGauge(g, W / 2, 58, 21, 4, 1);
          g.textAlign = 'center';
          g.font = '700 8px "Consolas","Courier New",monospace';
          g.fillStyle = withAlpha(C.cool, 0.5);
          g.fillText('O R B I T', W / 2, 92);

          // the mood's name, the way the donor labels its own sky
          g.textAlign = 'left';
          g.font = '700 8px "Consolas","Courier New",monospace';
          g.fillStyle = withAlpha(C.sun, 0.34);
          g.fillText(C.name + ' · ' + WX.name, 16, 40);

          // (11) the invisible hand, while it is still holding: a ghost thumb-mark at the
          //      count-in orbit's centre. It fades the moment the beat drops, and difficulty
          //      1 and 2 never get the word.
          const ghost = clamp(1 - Math.max(0, t - handT) * [2.6, 4.5, 9][diff], 0, 1);
          if (!everDown && done === 'pending' && ghost > 0.01) {
            const bl = ghost * (0.3 + 0.3 * Math.abs(Math.sin(t * 4)));
            g.save(); g.setLineDash([2, 5]); g.lineWidth = 1.4;
            g.strokeStyle = withAlpha(env.ink, bl);
            g.beginPath(); g.arc(CX, CY, 17, 0, TAU); g.stroke(); g.restore();
            if (diff === 0) {
              g.textAlign = 'center';
              g.font = '700 11px "Consolas","Courier New",monospace';
              g.fillStyle = withAlpha(env.ink, bl);
              g.fillText('H O L D', CX, clamp(CY + 38, 120, SY1));
            }
          }

          // (12) verdict, top third, unmistakable
          if (done !== 'pending') {
            const s = 1 + 0.45 * Math.pow(Math.max(0, 1 - verdictT * 5), 2);
            g.save(); g.translate(W / 2, 176); g.scale(s, s);
            g.textAlign = 'center';
            g.font = '900 46px "Arial Black","Segoe UI Black",sans-serif';
            g.fillStyle = done === 'won' ? C.sun : C.hot;
            g.fillText(done === 'won' ? 'ORBIT' : 'ADRIFT', 0, 0);
            g.restore();
          }

          // the arc: one turn of cream-backed colour, filling the way you actually swept
          function arcGauge(gg, x, y, rad, wdt, alpha) {
            const p = done === 'won' ? 1 : shown;
            const dir = travel < 0 ? -1 : 1;
            gg.save();
            gg.globalAlpha = alpha * 0.3; gg.lineWidth = wdt; gg.lineCap = 'round';
            gg.strokeStyle = env.ink;
            gg.beginPath(); gg.arc(x, y, rad, 0, TAU); gg.stroke();
            if (p > 0.001) {
              gg.globalAlpha = alpha * (done === 'won' ? 1 : 0.92);
              gg.strokeStyle = done === 'won' ? C.sun : (reverseT > 0 ? C.hot : C.cool);
              gg.lineWidth = wdt + (done === 'won' ? 1.6 : 0);
              gg.beginPath();

      // inside the corridor on the very first frame. So the search is over the ANGLE, not the
      // distance: start at the two velocity normals (a true circle) and walk outward from
      // them until the resulting orbit stops spilling off the field. Clamping the point into

                + Math.max(0, SY0 + 6 - y) + Math.max(0, y - (H - 20));
              const score = spill + off * 3 + k * 2.5;
              if (score < bestScore) { bestScore = score; best = [x, y]; }
              if (k === 0) break;                    // k 0 has only the one angle
            }
          }
        }

/* BRINK — hold to dilate time and aim; release to dash THROUGH the thing coming for you */
(function () {
  registerGame({
    id: 'dash', title: 'BRINK', command: 'DASH!', family: 'release', slotBeats: 8,
    create(env) {
      /* ---- donor constants, quoted from BRINK source. Everything below is per FRAME at
         60fps exactly as the donor wrote it; one step (dt = 1/60) is one donor frame, so
         each is multiplied by `k = timeScale * dt * 60`. ---- */
      const R = 12;                     // player.radius
      const DASH_SPEED = 30;            // player.dashSpeed, px/frame -> 1800 px/s
      const DASH_F = 12;                // player.maxDashFrames — the dash AND the i-frames, 0.2 s
      const DASH_LEN = DASH_SPEED * DASH_F;   // 360 px: the whole commitment, drawn as the aim ray
      const AIM_TS = 0.15;              // timeScale on pointerdown — "DILATE TIME"
      const MIN_AIM = 5;                // handlePointerUp: dist > 5 or no dash at all
      const FRIC = 0.92;                // drift friction, per frame
      const DASH_EXIT = 0.1;            // vx,vy *= 0.1 when the dash runs out
      const HITSTOP = 6;                // triggerBrinkFlash: frames of total freeze
      const SHAKE_BRINK = 15, SHAKE_DASH = 2;
      const DARK_PUSH = 15;             // darkness = Math.max(0, darkness - 15) per brink
      const CREEP_AIM = 0.08, CREEP_IDLE = 0.04;   // darknessCreepRate, then * timeScale
      const P_LIFE = 0.03, P_SPD = 15, P_FRIC = 0.9;   // particle life/speed/friction per frame
      const SHK_GROW = 20, SHK_LIFE = 0.05;            // shockwave: radius += 20, life -= 0.05
      const TRAIL_LIFE = 0.05;

      const CYAN = '#0ff', MAG = '#f05', WHITE = '#fff', VOID = '#050505';
      const MONO = '"Consolas","Courier New",monospace';

      const W = env.W, H = env.H, diff = env.difficulty | 0, TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const TOPB = 30;                  // donor bounces at `player.radius`; we hold 30 clear of the shell fuse

      /* ---- difficulty: enemy speed and how fast the dark closes ----
         Donor enemy speed is `2 + Math.random()*3` px/frame plus a frameCount ramp; all three
         tiers sit inside that native 2..5 band. DARK_S compresses the donor's per-frame creep
         (0.04 idle / 0.08 aiming, both * timeScale) into one 8-beat slot. */

      const DARK0 = [16, 28, 40][diff];             // the gloom you inherit
      const DARK_S = [10, 13, 16][diff];            // creep multiplier

      /* ---- the exchange: you, low-centre; it, coming down out of the dark ---- */
      const p = { x: 195 + (env.rng() * 2 - 1) * 30, y: 560, vx: 0, vy: 0, dashing: false, dashF: 0, trail: [] };
      const eAng = -Math.PI / 2 + (env.rng() * 2 - 1) * 0.34;   // within ~19.5 deg of straight up
      const e = {
        x: clamp(p.x + Math.cos(eAng) * 420, 28, W - 28),
        y: p.y + Math.sin(eAng) * 420,
        r: 14 + env.rng() * 6,                      // donor: radius 14 + Math.random()*6

        env.audio.noise({ dur: 0.09, vol: 0.08, hp: 1200 });                     // the sweep its comment promised
      };
      const brinkSfx = () => {                      // playSound('brink'): [300,450,600] -> half, 0.3 s
        [300, 450, 600].forEach((f, i) => env.audio.tone({
          f, f2: f * 0.5, type: i === 0 ? 'square' : 'sawtooth', dur: 0.3, vol: 0.2 - i * 0.035,
        }));
        env.audio.noise({ dur: 0.22, vol: 0.13, hp: 220, lp: 3000 });            // stands in for lowpass 3000->200
      };

      function fxStep(k) {

          const f = Math.pow(P_FRIC, k); q.vx *= f; q.vy *= f;

          else fxStep(dt * 60);

          if (announceT <= 0) announced = decided;

        if (aiming && inp.down) { aimX = inp.x; aimY = inp.y; }

        else if (p.y > H - R) { p.y = H - R; p.vy *= -1; }

          e.y += Math.sin(e.ang) * e.speed * k;
