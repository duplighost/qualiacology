     family release, slotBeats 8; the one 5x6-pane target sits at y=230..422 in the top 2/3.
   - A fresh press starts donor-style inhale audio and charges from 0 to 1 in CHARGE_TIME=.55s;
     the body inflates by up to 22%, its mouth opens, and the dashed ring flips blue -> hot at .30.
   - Releasing at charge >= SHOUT=.30 shatters all 30 panes into exactly 60 glass fragments,
     emits three radial scream rings, glass/scream audio plus the donor door chord, and wins.
   - Releasing below .30 emits a blue fizzle ring, eight visible puffs and "..." without resolving;
     any number of retries remain legal until timeout.
   - result() remains pending through the 50ms hitstop and reports won after the 270ms impact hold;
     timeout() preserves a shatter win and otherwise returns lost with a cause-specific line.
   - hint() performs down -> charge beyond .36 -> up, and never aims at a small target.
   BUG-IS-GAME (do not fix):
   - Management says NO HOLLERING while the only winning act is a scream. The contradiction is the room.
   - The shout is radial and the thumb may press anywhere; do not turn the glass into a tap target.
*/

/* ===== carts/44-seent-it.js ===== */
/* I SEENT IT — tow the confiscated moon through one Federal Moon Bureau receiver. */
(function () {
  registerGame({
    id: 'seent-it',
    title: 'I SEENT IT',
    command: 'TOW IT!',
    family: 'drag',
    slotBeats: 8,
    minGame: 4,
    create(env) {
      const W = env.W, H = env.H, D = env.difficulty | 0, R = env.rng;
      const TAU = Math.PI * 2;
      const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
      const INK = '#070910', NIGHT = '#161126', ROOF = '#080a10';
      const BONE = '#f2ead5', WARM = '#fff8c7', GREY = '#8d96a8';
      const CYAN = '#57dff2', PINK = '#ff4f87', VIOLET = '#8b72ff';
      const direction = R() < 0.5 ? 1 : -1;
      const roofY = 558, playerY = roofY - 22, moonY = roofY - 31;
      const receiver = { x: W * 0.5, y: 480, r: [58, 54, 52][D] };
      const destinationX = direction > 0 ? W - 42 : 42;
      const player = { x: direction > 0 ? 170 : 220, y: playerY, vx: 0 };
      const moon = { x: direction > 0 ? 42 : W - 42, y: moonY, vx: 0, spin: 0 };
      const TETHER_LENGTH = 148, TETHER_LIMIT = 276;
      const stars = [];
      for (let i = 0; i < 46; i++) stars.push({
        x: R() * W, y: 26 + R() * 390, r: 0.6 + R() * 1.7,
        p: R() * TAU, cyan: i % 13 === 0,
      });
      const skyline = [];
      for (let x = -18, i = 0; x < W + 30; i++) {
        const width = 34 + R() * 46, height = 62 + R() * 150;
        skyline.push({ x, width, height, antenna: i % 4 === 0 });
        x += width + 7;
      }

      let t = 0, done = 'pending', announced = 'pending', announceT = 0;
      let lastDown = false, targetX = player.x;
      let moved = 0, tensionPeak = 0, creaked = false, flash = 0, shake = 0;
      let failPulse = 0, towStarted = false, receiverPulse = 0;
      const particles = [];

      function rgba(hex, alpha) {
        const n = parseInt(hex.slice(1), 16);
        return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' +
          (n & 255) + ',' + alpha + ')';
      }

      function tension() {
        return clamp((Math.abs(player.x - moon.x) - TETHER_LENGTH) /
          (TETHER_LIMIT - TETHER_LENGTH), 0, 1);
      }

      function burst(x, y) {
        for (let i = 0; i < 58; i++) {
          const a = R() * TAU, speed = 50 + R() * 210;
          particles.push({
            x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
            life: 0.38 + R() * 0.56, max: 0.94,
            r: 1 + R() * 3.2, c: i % 5 === 0 ? PINK : i % 2 ? WARM : CYAN,
          });
        }
      }

      function win() {
        if (done !== 'pending') return;
        done = 'won'; announceT = 0.27; receiverPulse = 1; flash = 0.72; shake = 10;
        burst(receiver.x, receiver.y);
        env.audio.noise({ dur: 0.12, vol: 0.16, hp: 1600 });
        env.audio.tone({ f: 392, f2: 523.25, type: 'square', dur: 0.17, vol: 0.14 });
        env.audio.tone({ f: 659.25, type: 'triangle', dur: 0.25, vol: 0.15, t: 0.06 });
        env.audio.tone({ f: 783.99, type: 'sine', dur: 0.42, vol: 0.12, t: 0.12 });
      }

      function lose() {
        if (done !== 'pending') return;
        done = 'lost'; failPulse = 1; shake = 6;
        env.audio.tone({ f: 110, f2: 58, type: 'sawtooth', dur: 0.38, vol: 0.12 });
        env.audio.noise({ dur: 0.18, vol: 0.09, lp: 900 });
      }

      function drawStar(g, x, y, r) {
        g.beginPath();
        g.moveTo(x, y - r * 1.8); g.lineTo(x + r * 0.35, y - r * 0.35);
        g.lineTo(x + r * 1.8, y); g.lineTo(x + r * 0.35, y + r * 0.35);
        g.lineTo(x, y + r * 1.8); g.lineTo(x - r * 0.35, y + r * 0.35);
        g.lineTo(x - r * 1.8, y); g.lineTo(x - r * 0.35, y - r * 0.35);
        g.closePath(); g.fill();
      }

      function drawReceiver(g) {
        const lit = done === 'won';
        const pulse = 0.5 + Math.sin(t * 7.2) * 0.5;
        if (lit || t < 1.6) {
          g.fillStyle = lit ? rgba(WARM, 0.16 + receiverPulse * 0.16) :
            rgba(env.ink, 0.055 + pulse * 0.055);
          g.beginPath(); g.arc(receiver.x, receiver.y,
            receiver.r + 18 + pulse * 10, 0, TAU); g.fill();
        }

        g.save();
        g.strokeStyle = lit ? WARM : rgba(BONE, 0.62);
        g.lineWidth = lit ? 3 : 2; g.setLineDash(lit ? [] : [7, 7]);
        g.beginPath(); g.moveTo(receiver.x, roofY); g.lineTo(receiver.x, receiver.y + 22); g.stroke();
        g.setLineDash([]);
        g.translate(receiver.x, receiver.y); g.rotate(Math.PI / 4);
        g.fillStyle = lit ? WARM : '#101421';
        g.strokeStyle = lit ? WARM : (t < 1.6 ? env.ink : BONE);
        g.lineWidth = t < 1.6 ? 4 : 3;
        g.fillRect(-16, -16, 32, 32); g.strokeRect(-16, -16, 32, 32);
        g.rotate(-Math.PI / 4);
        g.fillStyle = lit ? INK : BONE;
        g.beginPath(); g.arc(0, 0, lit ? 5 : 3, 0, TAU); g.fill();
        if (!lit) {
          g.strokeStyle = rgba(CYAN, 0.28 + pulse * 0.42); g.lineWidth = 2;
          g.beginPath(); g.arc(0, 0, 27 + pulse * 7, -0.62, 0.62); g.stroke();
          g.beginPath(); g.arc(0, 0, 39 + pulse * 8, Math.PI - 0.62, Math.PI + 0.62); g.stroke();
        }
        g.restore();

        const windowY = roofY + 25;
        for (let row = 0; row < 2; row++) for (let col = 0; col < 3; col++) {
          const x = receiver.x - 32 + col * 25, y = windowY + row * 28;
          g.fillStyle = lit ? WARM : '#111420';
          g.strokeStyle = lit ? rgba(WARM, 0.5) : rgba(BONE, 0.18);
          g.lineWidth = 1; g.fillRect(x, y, 16, 19); g.strokeRect(x, y, 16, 19);
          if (lit && (row + col) % 2 === 0) {
            g.fillStyle = rgba(PINK, 0.34); g.fillRect(x + 3, y + 4, 10, 11);
          }
        }
      }

      function drawMoon(g, ten) {
        g.save(); g.translate(moon.x, moon.y); g.rotate(moon.spin);
        g.fillStyle = ten > 0.7 ? rgba(PINK, 0.15) : rgba(CYAN, 0.13);
        g.beginPath(); g.arc(0, 0, 44 + ten * 9, 0, TAU); g.fill();
        g.fillStyle = WARM; g.strokeStyle = INK; g.lineWidth = 4;
        g.beginPath(); g.arc(0, 0, 31, 0, TAU); g.fill(); g.stroke();
        g.fillStyle = '#afa887';
        g.beginPath(); g.arc(-10, -8, 7, 0, TAU); g.arc(11, 7, 9, 0, TAU);
        g.arc(7, -14, 4, 0, TAU); g.fill();
        g.strokeStyle = rgba(INK, 0.48); g.lineWidth = 1.5;
        g.beginPath(); g.arc(-10, -8, 4, 0, TAU); g.arc(11, 7, 5.5, 0, TAU); g.stroke();
        g.restore();
      }

      function drawPlayer(g) {
        g.save(); g.translate(player.x, player.y);
        const facing = Math.abs(player.vx) > 0.2 ? Math.sign(player.vx) : direction;
        const stride = Math.sin(t * 21 * Math.min(1, Math.abs(player.vx) / 5));
        g.scale(facing, 1);
        g.fillStyle = BONE;
        g.beginPath(); g.moveTo(-2, -8); g.lineTo(-34 - Math.abs(player.vx) * 1.2, 4 + stride * 2);
        g.lineTo(-10, 12); g.closePath(); g.fill();
        g.strokeStyle = INK; g.lineWidth = 7; g.lineCap = 'round';
        g.beginPath(); g.moveTo(-6, 9); g.lineTo(-8 - stride * 7, 20);
        g.moveTo(7, 8); g.lineTo(9 + stride * 7, 20); g.stroke();
        g.strokeStyle = BONE; g.lineWidth = 4; g.stroke();
        g.fillStyle = BONE; g.beginPath(); g.moveTo(-10, -18); g.lineTo(12, -18);
        g.lineTo(16, 8); g.lineTo(-13, 9); g.closePath(); g.fill();
        g.strokeStyle = BONE; g.lineWidth = 5; g.beginPath(); g.moveTo(9, -10); g.lineTo(19, -2); g.stroke();
        g.fillStyle = BONE; g.beginPath(); g.arc(2, -31, 11, 0, TAU); g.fill();
        g.fillStyle = INK; g.beginPath(); g.arc(7, -32, 2.5, 0, TAU); g.fill();
        g.fillStyle = PINK; g.fillRect(-8, -23, 20, 3);
        g.restore();
      }

      return {
        step(dt, inp) {
          t += dt; lastDown = !!inp.down;
          flash = Math.max(0, flash - dt * 2.5);
          shake = Math.max(0, shake - dt * 24);
          failPulse = Math.max(0, failPulse - dt * 1.7);
          receiverPulse = Math.max(0, receiverPulse - dt * 1.8);

          if (done === 'pending') {
            if (inp.justDown) {
              targetX = clamp(inp.x, 32, W - 32);
              if (!towStarted) {
                towStarted = true;
                env.audio.tone({ f: 94, f2: 126, type: 'sine', dur: 0.18, vol: 0.08 });
              }
            }
            if (inp.down) targetX = clamp(inp.x, 32, W - 32);

            const before = player.x;
            if (inp.down) {
              player.vx += clamp((targetX - player.x) * 0.065, -0.92, 0.92);
              player.vx *= 0.94;
            } else {
              player.vx *= 0.78;
            }
            player.vx = clamp(player.vx, -8.4, 8.4);

            const dx = player.x - moon.x;
            const dist = Math.abs(dx) || 1;
            if (dist > TETHER_LENGTH) {
              const nx = dx / dist, extension = dist - TETHER_LENGTH;
              const relative = (player.vx - moon.vx) * nx;
              const pull = extension * 0.052 + Math.max(0, relative) * 0.025;
              moon.vx += nx * pull;
              player.vx -= nx * pull * 0.17;
            }

            moon.vx *= 0.965;
            player.x += player.vx; moon.x += moon.vx;
            player.x = clamp(player.x, 24, W - 24);
            moon.x = clamp(moon.x, 31, W - 31);

            const postDx = player.x - moon.x, postDist = Math.abs(postDx) || 1;
            if (postDist > TETHER_LIMIT) {
              const excess = postDist - TETHER_LIMIT, nx = postDx / postDist;
              moon.x += nx * excess * 0.82; player.x -= nx * excess * 0.18;
              moon.vx += nx * excess * 0.09;
            }
            moved += Math.abs(player.x - before);
            moon.spin += moon.vx * dt * 0.18;

            const ten = tension();
            tensionPeak = Math.max(tensionPeak, ten);
            if (!creaked && ten > 0.52) {
              creaked = true;
              env.audio.tone({ f: 138, f2: 174, type: 'triangle', dur: 0.22, vol: 0.07 });
            }
            const goalDx = moon.x - receiver.x, goalDy = moon.y - receiver.y;
            if (goalDx * goalDx + goalDy * goalDy <= receiver.r * receiver.r) win();
          }

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i]; p.life -= dt; p.vy += 80 * dt;
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985;
            if (p.life <= 0) particles.splice(i, 1);
          }
          if (done === 'won' && announced === 'pending') {
            announceT -= dt;
            if (announceT <= 0) announced = 'won';
          }
        },

        render(g) {
          const hx = Math.sin((t * 60 + 2.3) * 12.9898) * 43758.5453;
          const hy = Math.sin((t * 60 + 8.1) * 78.233) * 43758.5453;
          const sx = shake ? ((hx - Math.floor(hx)) - 0.5) * shake : 0;
          const sy = shake ? ((hy - Math.floor(hy)) - 0.5) * shake : 0;
          g.save(); g.translate(sx, sy);

          const bg = g.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, INK); bg.addColorStop(0.58, NIGHT); bg.addColorStop(1, '#10131c');
          g.fillStyle = bg; g.fillRect(-16, -16, W + 32, H + 32);
          g.save(); g.globalCompositeOperation = 'screen';
          for (const s of stars) {
            g.globalAlpha = 0.45 + Math.sin(t * 1.5 + s.p) * 0.2;
            g.fillStyle = s.cyan ? CYAN : BONE;
            s.cyan ? drawStar(g, s.x, s.y, s.r * 1.5) :
              (g.beginPath(), g.arc(s.x, s.y, s.r, 0, TAU), g.fill());
          }
          g.restore();

          g.fillStyle = '#0f1321';
          for (const b of skyline) {
            const y = roofY - b.height - 18;
            g.fillRect(b.x, y, b.width, b.height + 20);
            if (b.antenna) {
              g.strokeStyle = '#242945'; g.lineWidth = 2; g.beginPath();
              g.moveTo(b.x + b.width * 0.62, y); g.lineTo(b.x + b.width * 0.62, y - 40); g.stroke();
            }
          }
          g.globalAlpha = 0.08; g.strokeStyle = VIOLET; g.lineWidth = 1;
          const offset = (t * 70) % 44;
          for (let x = -H; x < W + H; x += 42) {
            g.beginPath(); g.moveTo(x + offset, 0); g.lineTo(x - H * 0.35 + offset, H); g.stroke();
          }
          g.globalAlpha = 1;

          g.fillStyle = ROOF; g.fillRect(-20, roofY, W + 40, H - roofY + 20);
          g.strokeStyle = BONE; g.lineWidth = 4; g.beginPath(); g.moveTo(-20, roofY); g.lineTo(W + 20, roofY); g.stroke();
          g.strokeStyle = rgba(VIOLET, 0.32); g.lineWidth = 1.5;
          for (let x = 24; x < W; x += 64) {
            g.beginPath(); g.moveTo(x, roofY + 30); g.lineTo(x - 25, H + 28); g.stroke();
          }

          g.fillStyle = rgba(BONE, 0.58); g.font = '700 10px "Consolas","Courier New",monospace';
          g.textAlign = 'center'; g.fillText('F.M.B. OBSERVATION UNIT // CASE 00-1', W / 2, 72);
          g.fillStyle = rgba(BONE, 0.8); g.font = '700 12px "Consolas","Courier New",monospace';
          g.fillText(done === 'won' ? 'A WINDOW REMEMBERS YOU' : 'MOVE. THE EVIDENCE WILL FOLLOW.', W / 2, 100);

          if (done === 'pending') {
            const cue = 0.42 + Math.sin(t * 7) * 0.16;
            g.strokeStyle = rgba(env.ink, cue); g.fillStyle = rgba(env.ink, cue * 0.85); g.lineWidth = 4;
            for (let i = 0; i < 3; i++) {
              const x = player.x + direction * (48 + i * 25), y = 405;
              g.beginPath();
              g.moveTo(x - direction * 12, y - 11); g.lineTo(x, y); g.lineTo(x - direction * 12, y + 11); g.stroke();
            }
          }

          drawReceiver(g);
          const ten = tension();
          g.lineCap = 'round'; g.strokeStyle = 'rgba(0,0,0,.7)'; g.lineWidth = 9;
          g.beginPath(); g.moveTo(player.x, player.y); g.lineTo(moon.x, moon.y); g.stroke();
          g.strokeStyle = ten > 0.78 ? PINK : CYAN; g.lineWidth = 2.5 + ten * 2.5;
          g.setLineDash(ten > 0.72 ? [9, 6] : []); g.lineDashOffset = -t * 52 * ten;
          g.beginPath(); g.moveTo(player.x, player.y); g.lineTo(moon.x, moon.y); g.stroke(); g.setLineDash([]);
          drawMoon(g, ten); drawPlayer(g);

          for (const p of particles) {
            g.globalAlpha = clamp(p.life / p.max, 0, 1); g.fillStyle = p.c;
            g.fillRect(p.x - p.r * 0.5, p.y - p.r * 0.5, p.r, p.r);
          }
          g.globalAlpha = 1;

          const meterX = 68, meterY = 635, meterW = W - 136;
          g.fillStyle = rgba(BONE, 0.08); g.fillRect(meterX, meterY, meterW, 5);
          const meter = clamp(Math.max(tensionPeak * 0.76, moved / 220), 0, 1);
          g.fillStyle = ten > 0.78 ? PINK : CYAN; g.fillRect(meterX, meterY, meterW * meter, 5);
          g.fillStyle = rgba(BONE, 0.42); g.font = '700 9px "Consolas","Courier New",monospace';
          g.fillText('CHAIN OF CUSTODY', W / 2, meterY + 23);

          if (failPulse > 0) {
            g.fillStyle = rgba(PINK, failPulse * 0.13); g.fillRect(0, 0, W, H);
            g.fillStyle = rgba(BONE, failPulse * 0.72); g.font = '700 11px "Consolas","Courier New",monospace';
            g.fillText('CUSTODY REVOKED', W / 2, 132);
          }
          if (flash > 0) { g.fillStyle = rgba(WARM, flash * 0.34); g.fillRect(0, 0, W, H); }
          g.restore();
        },

        result: () => announced,
        timeout() { if (done === 'pending') lose(); return done === 'won' ? 'won' : 'lost'; },
        line: () => 'YOU SEENT IT. THEY SAY YOU DIDN\'T.',
        hint() {
          if (done !== 'pending') return lastDown ? { type: 'up' } : { type: 'wait', ms: 160 };
          return { type: 'drag', x: player.x, y: player.y, x2: destinationX, y2: player.y, ms: 850 };
        },
      };
    },
  });
})();

/* DONE-CRITERIA
   - The player, moon, 148px slack tether, 276px hard limit, receiver diamond and window bank are
     drawn from I SEENT IT's CASE 00-1 vocabulary rather than reskinned into the shell's cosmos.
   - Dragging the masked figure in the arrowed direction indirectly pulls the moon through the
     receiver; touching the moon itself never grants direct control.
   - The receiver eases from a 58px reach to 54/52px and the source start geometry gives the player
     the full 8-beat slot; an immediate committed drag can win and a short/early drag can be resumed.
   - The receiver crossing wins exactly once with a warm window-light, evidence burst and three-note
     filing sting; inactivity or failure to cross before timeout loses.
   - hint() uses the same player drag a thumb uses and never teleports or directly steers the moon.
   BUG-IS-GAME (do not fix):
   - The moon is laggy evidence. The hand controls the person immediately; the tether, not the
     pointer, decides when the moon follows and how hard it snaps toward the receiver.
*/


Shell.boot();
</script>
</body>
