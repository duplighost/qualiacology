<style>
  :root{
    --void:#0b0a14;
    --paper:#f3ead8;

    --ink:#1a1522;
    --serif:"Iowan Old Style","Palatino Linotype","Palatino","Book Antiqua","Hoefler Text",Georgia,serif;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  html,body{margin:0;padding:0;height:100%;background:var(--void);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;}
  canvas#c{display:block;touch-action:none;cursor:crosshair;}
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 42%,rgba(30,22,44,.72),rgba(6,5,12,.93) 70%);backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);
    color:var(--paper);font-family:var(--serif);z-index:10;
    padding:calc(env(safe-area-inset-top) + 20px) calc(env(safe-area-inset-right) + 20px) calc(env(safe-area-inset-bottom) + 20px) calc(env(safe-area-inset-left) + 20px);}
  .ov.show{display:flex;}
  .card{box-sizing:border-box;max-width:540px;max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 28px);width:100%;text-align:center;padding:30px 26px;border:1px solid rgba(243,234,216,.12);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));box-shadow:0 24px 80px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.05);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .card h2{font-weight:400;font-size:clamp(26px,5vw,40px);letter-spacing:.18em;margin:0 0 10px;}
  .card p{margin:6px 0;opacity:.8;font-size:15px;line-height:1.5;}
  .card .small{font-size:12px;opacity:.55;letter-spacing:.08em;}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;}
  button.b{appearance:none;border:1px solid rgba(243,234,216,.35);background:transparent;color:var(--paper);
    font-family:var(--serif);font-size:16px;letter-spacing:.14em;padding:14px 22px;min-width:140px;min-height:48px;
    border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s;text-shadow:0 1px 10px rgba(255,255,255,.08);}
  button.b:hover,button.b:focus-visible{background:rgba(255,179,71,.12);border-color:var(--spark);outline:none;box-shadow:0 0 0 3px rgba(255,179,71,.08),0 8px 26px rgba(0,0,0,.22);}
  button.b:active{transform:translateY(1px);}
  button.b.primary{border-color:var(--spark);}
  .tally{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:22px auto 8px;max-width:420px;}
  .tally div{border-top:1px solid rgba(243,234,216,.18);padding-top:10px;}
  .tally .n{font-family:var(--mono);font-size:clamp(30px,7vw,48px);font-variant-numeric:tabular-nums;line-height:1;}
  .tally .l{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.6;margin-top:8px;}
  .medals{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0 4px;font-size:12px;letter-spacing:.1em;}
  .medals span{opacity:.75}
  .medals b{font-weight:400;color:var(--spark);}
  .life{font-family:var(--mono);font-size:12px;opacity:.5;margin-top:14px;letter-spacing:.06em;}
  .line{font-style:italic;font-size:clamp(16px,3.4vw,21px);opacity:0;transition:opacity 1.4s;margin-top:26px;}
  .line.show{opacity:.92;}
  .corner{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 10px);
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,234,216,.22);background:rgba(11,10,20,.52);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:var(--paper);display:none;align-items:center;justify-content:center;cursor:pointer;font-family:var(--serif);
    font-size:18px;line-height:1;opacity:.55;transition:opacity .2s;}
  .corner.show{display:flex;}
  .corner:hover{opacity:1;}
  .corner:focus-visible{outline:1px solid var(--spark);}
  @media (prefers-reduced-motion: reduce){ .line{transition:none;} }

  /* second-pass presentation: quiet, theatrical, and intentionally not a generic glass UI */
  .ov{animation:ovIn .18s ease-out both;}
  /* overflow stays auto: this re-declaration used to say `hidden`, which clipped the end
     screen's own buttons off small phones with no way to scroll to them. */
  .card{position:relative;overflow:auto;border-radius:10px;background:
    linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012)),
    radial-gradient(circle at 50% 0%,rgba(255,179,71,.075),transparent 48%);
    box-shadow:0 34px 110px rgba(0,0,0,.62),inset 0 1px 0 rgba(255,255,255,.07);}
  .card::before,.card::after{content:"";position:absolute;pointer-events:none;opacity:.55;}
  .card::before{inset:9px;border:1px solid rgba(243,234,216,.07);}
  .card::after{left:50%;top:0;width:96px;height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,var(--spark),transparent);box-shadow:0 0 18px rgba(255,179,71,.7);}
  .card h2{text-shadow:0 0 32px rgba(255,220,175,.15);}
  button.b{border-radius:4px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0));position:relative;overflow:hidden;}
  button.b::after{content:"";position:absolute;left:18%;right:18%;bottom:7px;height:1px;background:var(--spark);transform:scaleX(0);opacity:.7;transition:transform .18s ease;}
  button.b:hover::after,button.b:focus-visible::after{transform:scaleX(1);}
  .corner{border-radius:5px;}
  @keyframes ovIn{from{opacity:0}to{opacity:1}}


  /* Pure-play presentation: no persistent HUD. The only chrome is one quiet corner mark,
     which is the ONLY way a touch player can reach pause, sound and restart — desktop also
     has P / Escape / M / R. It is deliberately small and dim so it never reads as UI. */
  .corner{width:36px;height:36px;font-size:15px;opacity:.30;}
  .corner:hover,.corner:focus-visible{opacity:.9;}
  @media (pointer:coarse){.corner{width:40px;height:40px;opacity:.26;}}
  /* A 320x568 phone overflowed the end card by about one button, so "Climb again" and
     "Sound" — the only touch UI a player gets after a full climb — sat on or past the cut
     edge. Trim spacing before the type, so the reading order (tally, line, medals, then the
     buttons) survives intact and nothing has to be scrolled to. */
  @media (max-height:700px){
    .card{padding:22px 20px}
    .card h2{font-size:clamp(22px,4.6vw,32px);margin-bottom:6px}
    .tally{margin:14px auto 4px}.tally .n{font-size:clamp(26px,6vw,38px)}
    .line{margin-top:14px;font-size:clamp(15px,3.2vw,18px)}
    .medals{margin:12px 0 2px;gap:10px}
    .life{margin-top:10px}
    .row{margin-top:14px}
    button.b{padding:12px 20px;min-height:46px}
  }
  @media (max-height:480px){
    .ov{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:calc(env(safe-area-inset-bottom) + 10px);}
    .card{padding:16px 18px}.card h2{font-size:24px;margin-bottom:5px}.tally{margin:12px auto 4px}.tally .n{font-size:28px}.row{margin-top:12px}.line{margin-top:12px}.medals{margin:10px 0 2px}.life{margin-top:8px}
  }
  /* A 320px-tall viewport (a small phone held sideways) still cannot hold everything. The
     lifetime tally is the one thing here that is not about THIS climb, so it goes first
     rather than pushing the buttons off the card. */
  @media (max-height:380px){
    .card{padding:12px 16px}.card h2{font-size:21px;letter-spacing:.14em}
    .tally{margin:9px auto 2px}.tally .n{font-size:24px}.tally .l{font-size:10px;margin-top:5px}
    .line{margin-top:9px;font-size:14px}
    .medals{margin:8px 0 0;gap:9px;font-size:11px}
    .life{display:none}
    .row{margin-top:10px;gap:8px}
    button.b{padding:10px 16px;min-height:44px;min-width:120px;font-size:14px}
  }

  /* site home pill (added by build-site-copy.mjs) */
  .home-link{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));
    z-index:2147483647;display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;
    color:rgba(243,234,216,.9);text-decoration:none;font:400 11px/1.2 var(--serif);letter-spacing:.16em;
    text-transform:uppercase;border:1px solid rgba(243,234,216,.24);border-radius:4px;
    background:rgba(11,10,20,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:.36;transition:opacity .18s ease,border-color .18s ease;}
  .home-link:hover,.home-link:focus-visible{opacity:1;border-color:var(--spark);outline:0;}
  @media (pointer:coarse){.home-link{opacity:.3;}}
  @media (max-width:600px){
    .home-link{width:40px;height:40px;padding:0;display:grid;place-items:center;font-size:0;}
    .home-link::after{content:'Q.';font:400 13px/1 var(--serif);letter-spacing:.02em;color:var(--paper);}
  }
</style>

<body>
<a class="home-link" href="/" aria-label="Return to Qualiacology" title="Return to Qualiacology"><span aria-hidden="true">&#8592;</span> <span>Qualiacology</span></a>
<canvas id="c" role="application" aria-label="THROWN. Hold the screen to catch a hand, drag sideways to lean, and release to fly."></canvas>
<button class="corner" id="pauseBtn" aria-label="Pause">‖</button>

<div class="ov" id="pauseOv" role="dialog" aria-label="Paused">
  <div class="card">
    <h2>PAUSED</h2>
    <p class="small">hold: space · click · touch &nbsp;&nbsp; lean: A D · ← → · slide sideways</p>
    <div class="row">
      <button class="b primary" id="resumeBtn">Resume</button>
      <button class="b" id="restartChBtn">Restart hands</button>
      <button class="b" id="soundBtn">Sound: on</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="b" id="restartGameBtn">Start over</button>
    </div>
    <p class="small" style="margin-top:18px" id="pauseStats"></p>
  </div>
</div>

<div class="ov" id="endOv" role="dialog" aria-label="The top">
  <div class="card">
    <h2 id="endTitle">THE TOP</h2>
    <div class="tally">
      <div><div class="n" id="tHeld">0</div><div class="l">held</div></div>
      <div><div class="n" id="tLet">0</div><div class="l">let go</div></div>
      <div><div class="n" id="tThrown">0</div><div class="l">thrown</div></div>
    </div>
    <p class="line" id="endLine">Same number. It was always the same number.</p>
    <div class="medals" id="endMedals"></div>
    <p class="life" id="endLife"></p>
    <div class="row">
      <button class="b primary" id="againBtn">Climb again</button>
      <button class="b" id="endSoundBtn">Sound: on</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============================================================
   THROWN
   hold to hold on. let go to fly.
   one spark, many hands, one direction.
   ============================================================ */

/* ---------- utils ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const hyp = Math.hypot;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const smooth = t => t * t * (3 - 2 * t);
let QA_RNG_SEED = 0x54a8f13d;
function gameRandom() {
  if (!QA_MODE) return Math.random();
  QA_RNG_SEED = (Math.imul(QA_RNG_SEED, 1664525) + 1013904223) >>> 0;
  return QA_RNG_SEED / 4294967296;
}
const rnd = (a = 1, b) => b === undefined ? gameRandom() * a : a + gameRandom() * (b - a);
const pick = a => a[(gameRandom() * a.length) | 0];
const fmtTime = s => { s = Math.max(0, s); const m = (s / 60) | 0; const r = s - m * 60; return m + ':' + (r < 10 ? '0' : '') + r.toFixed(1); };
// cheap deterministic noise (for tremor etc.)
function hashNoise(i) { let x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function noise1(t, seed = 0) { const i = Math.floor(t); const f = t - i; const a = hashNoise(i + seed * 57), b = hashNoise(i + 1 + seed * 57); return lerp(a, b, smooth(f)) * 2 - 1; }

const BUILD_ID = 'thrown-mobile-luminous-1.0.0';
const FLAGS = new URLSearchParams(window.location.search);
const QA_MODE = FLAGS.get('qa') === '1';
const FORCE_TOUCH = FLAGS.get('touch') === '1';
const REDUCED = FLAGS.get('reduced') === '1' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const IS_TOUCH = FORCE_TOUCH || ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
let COARSE_POINTER = FORCE_TOUCH || mq('(pointer: coarse)');
// navigator.maxTouchPoints alone calls every touchscreen Windows laptop a phone, which then
// gets the phone's reduced DPR, softer darkness buffer and coarser hands on a machine being
// played with a mouse. Ask what the PRIMARY pointer is, and re-ask on resize.
function deviceIsMobile() {
  if (!IS_TOUCH) return false;
  if (FORCE_TOUCH) return true;
  if (!COARSE_POINTER) return false;                       // primary pointer is a mouse/trackpad
  if (mq('(any-pointer: fine)') && Math.min(window.innerWidth, window.innerHeight) >= 720) return false;
  return true;
}
let MOBILE_LIKELY = deviceIsMobile();
const DEVICE_CORES = navigator.hardwareConcurrency || 4;
const DEVICE_MEMORY = navigator.deviceMemory || 4;
const LOW_POWER_HINT = MOBILE_LIKELY && (DEVICE_CORES <= 4 || DEVICE_MEMORY <= 3);
document.body.dataset.buildId = BUILD_ID;
document.body.dataset.gameReady = 'false';

const Haptics = (() => {
  const supported = IS_TOUCH && typeof navigator.vibrate === 'function';
  function pulse(pattern) {
    if (!supported || REDUCED || document.visibilityState !== 'visible') return;
    try { navigator.vibrate(pattern); } catch (e) { /* optional hardware feedback */ }
  }
  return { pulse, get supported() { return supported; } };
})();

// QA-only long-task telemetry. It stays out of normal play, but makes first-touch
// audio and mobile frame stalls directly measurable in the exact shipped file.
const RUNTIME_PERF = { longTasks: [], maxLongTask: 0 };
if (QA_MODE && typeof PerformanceObserver === 'function') {
  try {
    new PerformanceObserver(list => {
      for (const entry of list.getEntries()) {
        const duration = +entry.duration.toFixed(2);
        RUNTIME_PERF.longTasks.push(duration);
        RUNTIME_PERF.maxLongTask = Math.max(RUNTIME_PERF.maxLongTask, duration);
      }
      if (RUNTIME_PERF.longTasks.length > 64) RUNTIME_PERF.longTasks.splice(0, RUNTIME_PERF.longTasks.length - 64);
    }).observe({ entryTypes: ['longtask'] });
  } catch (e) { /* optional browser telemetry */ }
}

/* ---------- storage (guarded; never throws) ---------- */
const SAVE_KEY = 'thrown.save.v1';
const Store = (() => {
  let mem = null;
  function load() {
    if (mem) return mem;
    let d = null;
    try { const raw = localStorage.getItem(SAVE_KEY); if (raw) d = JSON.parse(raw); } catch (e) { /* ignore */ }
    mem = Object.assign({ best: {}, life: { held: 0, letgo: 0, thrown: 0, snuffs: 0, climbs: 0, tops: 0 }, sound: true }, d || {});
    if (!mem.best) mem.best = {};
    if (!mem.life) mem.life = { held: 0, letgo: 0, thrown: 0, snuffs: 0, climbs: 0, tops: 0 };
    return mem;
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(mem)); } catch (e) { /* ignore */ } }
  return { load, save };
})();
const SAVE = Store.load();

/* ---------- audio (all synthesized) ---------- */
const Audio = (() => {
  let ac = null, master = null, comp = null, mixBus = null, fxBus = null, musicBus = null;
  let dryGain = null, reverb = null, reverbGain = null, delay = null, delayGain = null, delayFeedback = null;
  let windGain = null, windFilter = null, airGain = null, airFilter = null;
  let droneGain = null, droneFilter = null, shimmerGain = null, holdGain = null, holdFilter = null;
  let enabled = SAVE.sound !== false, unlocked = false, noiseBuf = null, ambienceReady = false, ambienceQueued = false;
  let droneOsc = [], currentRoot = 110, nextNoteT = 0, scoreStep = 0, scoreChapter = -1;
  let scoreIntensity = 0, scoreHeld = 0, scoreProgress = 0, lastBedT = -99;
  // When the game ducks the mix — a death, the last throw, a pause — bed() must stop
  // rewriting the same gains 30 times a second, or the silence lasts exactly one frame.
  let ducked = false;

  const SCORE = [
    { tempo: 66,  pattern: [0,null,2,null,4,null,2,null],                    kind:'wood',  gain:.038, octave:.50, chord:[1,1.25,1.5] },
    { tempo: 112, pattern: [0,4,2,5,3,6,2,4,0,5,2,7,3,6,4,2],            kind:'pulse', gain:.026, octave:.50, chord:[1,1.2,1.5] },
    { tempo: 50,  pattern: [0,null,null,4,null,null,2,null,5,null,null,4],   kind:'bell',  gain:.032, octave:.50, chord:[1,1.25,1.5] },
    { tempo: 62,  pattern: [0,null,5,null,2,null,6,null,4,null,2,null],     kind:'glass', gain:.026, octave:.50, chord:[1,1.2,1.5] },
    { tempo: 80,  pattern: [0,2,4,5,7,9,7,5,4,2,5,7],                    kind:'open',  gain:.034, octave:.50, chord:[1,1.25,1.5,2] },
  ];

  // Waiting for idle is right ONCE, to stay out of the way of first paint. It is wrong for
  // every continuation: the buffer fill yields eight or nine times, and each yield cost the
  // full idle timeout, so ~30 ms of actual work took two to three seconds of wall clock.
  // Start on idle, continue on the next macrotask — each slice is capped well under a frame.
  function deferAudioWork(fn) {
    if ('requestIdleCallback' in window) requestIdleCallback(fn, { timeout: 200 });
    else setTimeout(fn, 16);
  }
  // setTimeout(fn, 0) is not "the next task" here — behind a running rAF loop each one was
  // measured at ~146 ms, turning 103 ms of buffer fill into 1.6 s of wall clock. A
  // MessageChannel post is a real next-task yield: it still lets rendering in between
  // slices, but it is not a clamped, deprioritised timer.
  const continueAudioWork = (() => {
    if (typeof MessageChannel !== 'function') return fn => setTimeout(fn, 0);
    const ch = new MessageChannel(), q = [];
    ch.port1.onmessage = () => { const fn = q.shift(); if (fn) fn(); };
    return fn => { q.push(fn); ch.port2.postMessage(0); };
  })();
  function queueAmbience() {
    if (ambienceQueued || ambienceReady || !enabled) return;
    ambienceQueued = true;
    const begin = () => {
      if (!ac || ambienceReady || !enabled) { ambienceQueued = false; return; }
      try {
        // Build the long noise and impulse-response buffers in sub-5 ms slices.
        // This keeps audio richness without planting a 50–90 ms hitch after first touch.
        const len = Math.floor(ac.sampleRate * (MOBILE_LIKELY ? 1.35 : 2));
        const fullNoise = ac.createBuffer(1, len, ac.sampleRate), nd = fullNoise.getChannelData(0);
        const tail = MOBILE_LIKELY ? 2.35 : 3.15;
        const irLen = Math.floor(ac.sampleRate * tail), ir = ac.createBuffer(2, irLen, ac.sampleRate);
        const targets = [nd, ir.getChannelData(0), ir.getChannelData(1)];
        let target = 0, pos = 0;
        const fill = () => {
          if (!ac || !enabled) { ambienceQueued = false; return; }
          const sliceStart = performance.now();
          while (target < targets.length && performance.now() - sliceStart < 7) {
            const d = targets[target], end = Math.min(d.length, pos + 4096);
            if (target === 0) {
              for (let i = pos; i < end; i++) d[i] = Math.random() * 2 - 1;
            } else {
              const ch = target - 1;
              for (let i = pos; i < end; i++) {
                const t = i / irLen;
                d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 3.25) * (.70 + .30 * Math.sin(i * .013 + ch * 1.7));
              }
            }
            pos = end;
            if (pos >= d.length) { target++; pos = 0; }
          }
          if (target < targets.length) { continueAudioWork(fill); return; }
          finish(fullNoise, ir);
        };
        continueAudioWork(fill);
      } catch (e) { ambienceQueued = false; }
    };
    const finish = (fullNoise, ir) => {
      if (!ac || !enabled) { ambienceQueued = false; return; }
      try {
        noiseBuf = fullNoise;

/* ---------- text helpers ---------- */
const FONT_SERIF = getComputedStyle(document.documentElement).getPropertyValue('--serif').trim() || 'Georgia, serif';
const FONT_MONO = getComputedStyle(document.documentElement).getPropertyValue('--mono').trim() || 'monospace';
function spacedText(ctx, text, x, y, size, spacing, color, { italic = false, weight = '400', align = 'center', alpha = 1, gapChar = null, gapW = 0, shadow = 0 } = {}) {
  ctx.save();
  ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FONT_SERIF}`;
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillStyle = color; ctx.globalAlpha = alpha;
  if (shadow) { ctx.shadowColor = 'rgba(4,3,9,.92)'; ctx.shadowBlur = size * shadow; }
  const chars = [...text];
  const widths = chars.map(ch => ch === gapChar ? gapW : ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1);
  let px = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  let gapX = null;
  chars.forEach((ch, i) => { if (ch === gapChar) gapX = px + widths[i] / 2; else ctx.fillText(ch, px, y); px += widths[i] + spacing; });
  ctx.restore();
  return { total, gapX };
}
function text(ctx, str, x, y, size, color, { italic = false, weight = '400', align = 'center', alpha = 1, mono = false, baseline = 'middle', shadow = 0 } = {}) {
  ctx.save(); ctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${mono ? FONT_MONO : FONT_SERIF}`;
  ctx.textAlign = align; ctx.textBaseline = baseline; ctx.fillStyle = color; ctx.globalAlpha = alpha;
  // Two dark passes then the glyph: one halo is not enough to sit cream serif over a lit
  // palm or over OPEN's daylight sky, and this text has to be readable in every chapter.
  if (shadow) { ctx.shadowColor = 'rgba(4,3,9,.92)'; ctx.shadowBlur = size * shadow; ctx.fillText(str, x, y); }
  ctx.fillText(str, x, y); ctx.restore();
}
function hexToRgb(hx) { const n = parseInt(hx.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mixHex(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${Math.round(lerp(A[0], B[0], t))},${Math.round(lerp(A[1], B[1], t))},${Math.round(lerp(A[2], B[2], t))})`; }

/* ---------- orb (spark) ---------- */
function drawOrb(ctx, x, y, r, core = '#fff6e8', glow = '#ffb347', intensity = 1, flick = 0, underlay = 0) {
  ctx.save();

  if (underlay > 0) {
    const u = ctx.createRadialGradient(x, y, 0, x, y, r * 5.4);
    u.addColorStop(0, `rgba(28,22,26,${0.42 * underlay})`); u.addColorStop(.5, `rgba(30,22,24,${0.16 * underlay})`); u.addColorStop(1, 'rgba(40,30,26,0)');

  halo.addColorStop(0, glow); halo.addColorStop(.09, glow); halo.addColorStop(.34, rgbaHex(glow, .34)); halo.addColorStop(1, rgbaHex(glow, 0));
  ctx.globalAlpha = 0.32 * intensity; ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); ctx.fill();

  ctx.globalAlpha = 0.9 * intensity; ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(x, y, r * 1.65 * pulse, 0, TAU); ctx.fill();
  ctx.shadowBlur = RenderQuality.detailLevel()<2 ? 0 : Math.max(4, r * 1.4); ctx.globalAlpha = intensity; ctx.fillStyle = core; ctx.beginPath(); ctx.arc(x, y, r * pulse, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.9 * intensity; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x - r*.22, y - r*.25, Math.max(.7,r*.27), 0, TAU); ctx.fill();
  ctx.globalAlpha = 0.16 * intensity; ctx.strokeStyle = core; ctx.lineWidth = Math.max(.7, r*.09); ctx.beginPath(); ctx.arc(x, y, r * (2.3 + .12*Math.sin(performance.now()*.005)), 0, TAU); ctx.stroke();
  ctx.restore();
}

/* ---------- darkness ---------- */
function cutLight(x, y, r, a = 1, hard = 0.3) {
  dcx.save();dcx.globalAlpha=a;dcx.drawImage(maskSprite(hard),x-r,y-r,r*2,r*2);dcx.restore();
}

// Hands do not carry point lamps. Their whole form holds a low, diffuse presence:
// skin, fingers, palm and forearm emerge together from the dark.
function handLightState(hd, sx, sy, sr, tnow) {
  if (hd._lightFrame === tnow) return hd._lightState;
  hd._lightFrame = tnow;
  const p = W2S(hd.ax, hd.ay), ax = p[0], ay = p[1], z = zoomNow() * hd.sc;
  if (ay < -460 * z || ay > VH + 460 * z) return (hd._lightState = null);
  const dist = hyp(ax - sx, ay - sy); let alpha = hd.alpha;
  if (hd.shy) alpha *= clamp((sr * .95 - dist) / Math.max(1, sr * .35), 0, 1);
  if (alpha <= .008) return (hd._lightState = null);
  let rot = -hd.ang;
  if (hd.t === 'wave') rot += .075 * Math.sin(tnow * TAU / hd.per + hd.ph + 1.2);
  if (hd.tremor) rot += noise1(hd.tm * 11, hd.seed + 3) * .009 * hd.tremor;
  if (hd.flickAnim) rot += Math.sin(hd.flickAnim * Math.PI) * .065;
  return (hd._lightState = { ax, ay, z, dist, alpha, rot, shift: hd.t === 'palm' ? PALM_SHIFT : 0 });
}

function softMaskEllipse(ctx, x, y, rx, ry, strength, hard = .06) {
  if (strength <= .001) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(rx, ry);
  ctx.globalAlpha=strength;ctx.drawImage(_handMaskSprite,-1,-1,2,2);ctx.restore();
}

function cutHandPresence(hd, sx, sy, sr, tnow) {
  if (hd.alpha <= 0 || hd.done) return;
  const st = handLightState(hd, sx, sy, sr, tnow); if (!st) return;
  const pulse = .94 + .06 * Math.sin(tnow * 1.35 + hd.seed);
  const cool = hd.cool > 0 ? .28 : 1;
  const palm = hd.t === 'palm';
  const strength = st.alpha * cool * pulse * (palm ? .34 : .235) * (1+(hd._reachCue||0)*.58) * (MOBILE_LIKELY&&RenderQuality.tier>0?1.08:1);
  dcx.save(); dcx.translate(st.ax, st.ay); dcx.rotate(st.rot); dcx.scale(st.z, st.z);
  // Overlapping anatomical lobes make one soft area light instead of a bright dot.
  softMaskEllipse(dcx, st.shift - 10, 0, palm ? 112 : 93, palm ? 82 : 66, strength * .74, .025); // finger fan
  softMaskEllipse(dcx, st.shift - 91, 0, 92, 72, strength, .04);                              // palm
  softMaskEllipse(dcx, st.shift - 176, 0, 116, 55, strength * .48, 0);                       // wrist
  softMaskEllipse(dcx, st.shift - 305, 0, 184, 54, strength * .21, 0);                       // forearm fade
  // A restrained exact-form reveal preserves anatomy within the atmospheric wash.
  const _cp = handShape(dcx, hd, tnow); dcx.globalAlpha = strength * (palm ? .42 : .34); dcx.fillStyle = '#000'; _cp ? dcx.fill(_cp) : dcx.fill();
  dcx.restore(); hd._handPose = null;
}

function drawHandPresence(hd, pal, sx, sy, sr, tnow) {

  // A hand winding up to throw you brightens as it does it — the finger-cock alone was

/* ---------- HUD ----------
   There are still no readouts: no timer, no counter, no meter. The world carries state.
   What lives here is theatre — the title, the chapter cards, and the one word you get
   when you go out. All of it was already being timed by step(); it was simply never
   reaching the screen, so the game opened on a dark shaft with nothing to tell a first
   player that holding is the whole verb. */

// hard vertical seams down the screen wherever the plate ends.
function hudPlate(y,h,a,w){
  cx.save();cx.translate(VW*.5,y);cx.scale(w*.5,h);
  const g=cx.createRadialGradient(0,0,0,0,0,1);
  g.addColorStop(0,`rgba(6,5,12,${.66*a})`);g.addColorStop(.55,`rgba(6,5,12,${.44*a})`);g.addColorStop(1,'rgba(6,5,12,0)');
  cx.fillStyle=g;cx.fillRect(-1,-1,2,2);cx.restore();
}

  cx.save();cx.globalAlpha=a;cx.shadowColor='rgba(4,3,9,.8)';cx.shadowBlur=6;
  const g=cx.createLinearGradient(mx-w,0,mx+w,0);
  g.addColorStop(0,'rgba(255,179,71,0)');g.addColorStop(.5,'#ffb347');g.addColorStop(1,'rgba(255,179,71,0)');
  cx.fillStyle=g;cx.fillRect(mx-w,y,w*2,1.3);cx.restore();

  // reach-invitation arc points at the first hand — a player does not need the mapping

/* ---------- game state ---------- */
/* Two chapter indices, on purpose:
     ci     — how far you have PROGRESSED. Monotonic. Owns scoring, medals, pars.
     viewCi — where the spark physically IS. Owns the sky, the palette, the music.
   They diverge whenever you fall back down the tower, and until this split existed the
   game would show you OPEN's daylight while you hung in the dark at the bottom of
   BIG HANDS, playing the wrong chapter's score. */
const Game = {
  phase: 'title', world: null, spark: null, ci: 0, viewCi: 0, checkpoint: null, titleA: 1,
  run: null, chT: 0, chRunning: false, chHeld: 0, chMotes: 0,
  card: null, cardQueue: [],
  hint: { lean: 0, leanDone: false, stallT: 0, pumpT: 0 },
  snuffed: false, snuffT: 0, snuffWord: '',
  little: null, endT: 0, openness: 0, paused: false,
  safe: { top: 0, left: 0, bottom: 0, right: 0 },
  tnow: 0,
};
function newRun() { return { held: 0, letgo: 0, thrown: 0, snuffs: 0, motes: 0, chapters: {}, startT: 0 }; }
function startGame(fromTitle = true) {
  if (QA_MODE) QA_RNG_SEED = 0x54a8f13d;
  Game.world = buildWorld();
  const start = Game.world.hands.find(hd => hd.start);
  Game.spark = newSpark(start.ax, start.ay + 11);
  Game.spark.rest = start; Game.spark.restT = 1; Game.spark.lightR = 260; Game.spark.floorY = -1e9; snapSpark(Game.spark);
  Game.checkpoint = start; Game.ci = 0; Game.viewCi = 0; Game.run = newRun();
  Game.chT = 0; Game.chRunning = false; Game.chHeld = 0; Game.chMotes = 0;
  Game.card = null; Game.cardQueue = []; Game.little = null; Game.endT = 0; Game.openness = 0; cam.zoomMul = 1;
  Game.snuffed = false; Game.paused = false; Game.phase = fromTitle ? 'title' : 'play'; Game.titleA = fromTitle ? 1 : 0;
  Game.hint = { lean: 0, leanDone: false, stallT: 0, pumpT: 0 }; VIS.trail.length=0; VIS.rings.length=0; VIS.chapterT=-99;
  for (const hd of Game.world.hands) hd.done = false;
  cam.y = Game.spark.y + 220; cam.x = TOWER_W / 2;
  Audio.setRoot(CHAPTERS[0].root, 0);
  if (!fromTitle) queueCard(CHAPTERS[0].name, CHAPTERS[0].line);
  pauseOv.classList.remove('show'); endOv.classList.remove('show');
  // A climb is counted when someone actually starts climbing, not when the page loads.
  if (!QA_MODE && !fromTitle) { SAVE.life.climbs = (SAVE.life.climbs || 0) + 1; Store.save(); }
  updatePauseBtn();
}
function queueCard(title, line, sub, dur = 3.4) { Game.cardQueue.push({ title, line, sub, a: 0, t: 0, dur }); }
function chapterStartPalm(ci) {
  if (ci === 0) return Game.world.hands.find(hd => hd.start);
  return Game.world.hands.find(hd => hd.t === 'palm' && hd.ci === ci - 1 && hd.top);
}
function restartChapter() {
  // Inert once the finale has begun. The pause card stays usable through the 'ending' phase,
  // and this used to re-seed the spark on a palm ~950 px below the top while the phase stayed
  // 'ending' — so physStep was never called again, the controls went dead, and the game's
  // payoff re-staged at the wrong palm. The KeyR path already guarded itself; the button did not.
  if (Game.phase !== 'play') return;
  // The chapter you are CLIMBING, derived from the checkpoint — not Game.ci, which only
  // ever counts up. Using Game.ci here would fling a player who had fallen back down the
  // tower straight to the start of the highest chapter they had ever reached.
  const ck = Game.checkpoint;
  const ci = ck ? (ck.top ? Math.min(ck.ci + 1, CHAPTERS.length - 1) : ck.ci) : Game.ci;

  const d = document.createElement('div'); d.style.cssText = 'position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);bottom:env(safe-area-inset-bottom);right:env(safe-area-inset-right);visibility:hidden;pointer-events:none';
  document.body.appendChild(d); const r = d.getBoundingClientRect();
  Game.safe = { top: r.top, left: r.left, bottom: Math.max(0, window.innerHeight - r.bottom), right: Math.max(0, window.innerWidth - r.right) }; d.remove();
}

/* ---------- app/tab lifecycle ---------- */
function interruptPlay() {
  const preserveHold = !!((Game.spark && Game.spark.hold) || (Game.little && Game.little.held));
  Input.interrupt(preserveHold);
  acc = 0; lastT = performance.now(); staticFrameDirty = true;
}
function wakePlay() {
  pageActive = document.visibilityState !== 'hidden';
  if (!pageActive) return;
  acc = 0; lastT = performance.now(); staticFrameDirty = true;
  resize(); readSafeArea(); Audio.resume();
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    pageActive = false; interruptPlay(); Audio.suspend();
  } else wakePlay();
});
window.addEventListener('blur', () => { pageActive = false; interruptPlay(); Audio.suspend(); });
window.addEventListener('focus', wakePlay);
window.addEventListener('pagehide', () => { pageActive = false; interruptPlay(); Audio.suspend(); });
window.addEventListener('pageshow', wakePlay);

/* ---------- deterministic QA surface ---------- */
function qaGoToChapter(index) {
  if (!QA_MODE) return false;
  const ci = clamp(Number(index) || 0, 0, CHAPTERS.length - 1) | 0;
  startGame(false);
  const palm = chapterStartPalm(ci);
  if (!palm) return false;
  const s = Game.spark;
  Object.assign(s, { x: palm.ax, y: palm.ay + 11, vx: 0, vy: 0, hold: null, rest: palm, restT: 1, lit: LIT_MAX, iT: 0, chain: 0, speedS: 0, energy: 0, relT: 9, floorY: palm.ay - 420 }); snapSpark(s);
  Game.checkpoint = palm; Game.ci = ci; Game.viewCi = chapterAt(s.y); Game.phase = 'play'; Game.titleA = 0; Game.openness = CHAPTERS[ci].pal.open ? .5 : 0;
  Game.card = null; Game.cardQueue.length = 0; Game.chT = 0; Game.chRunning = false; Game.chHeld = 0; Game.chMotes = 0;
  cam.x = TOWER_W / 2; cam.y = s.y + 220; cam.zoomMul = 1;
  Audio.setRoot(CHAPTERS[ci].root, 0); staticFrameDirty = true;
  return true;
}
function qaSnapshot() {
  const s = Game.spark;
  return {
    build: BUILD_ID, ready: document.body.dataset.gameReady === 'true', qa: QA_MODE,
    phase: Game.phase, paused: Game.paused, chapter: Game.ci, viewChapter: Game.viewCi,
    checkpoint: Game.checkpoint ? { id: Game.checkpoint.id, ci: Game.checkpoint.ci, y: Game.checkpoint.ay } : null,
    titleA: +Game.titleA.toFixed(3), card: Game.card ? { title: Game.card.title, a: +Game.card.a.toFixed(3) } : null,
    spark: s ? { x: +s.x.toFixed(2), y: +s.y.toFixed(2), vx: +s.vx.toFixed(2), vy: +s.vy.toFixed(2), lit: s.lit, heldBy: s.hold ? s.hold.id : null, restingOn: s.rest ? s.rest.id : null } : null,
    run: Game.run ? { held: Game.run.held, letgo: Game.run.letgo, thrown: Game.run.thrown, snuffs: Game.run.snuffs, motes: Game.run.motes } : null,
    viewport: { width: VW, height: VH, dpr: +DPR.toFixed(2), darknessDpr: +DARK_DPR.toFixed(2), canvasWidth: cv.width, canvasHeight: cv.height, darkWidth: darkCv.width, darkHeight: darkCv.height },
    quality: { tier: RenderQuality.tier, locked: RenderQuality.locked, metrics: Object.assign({}, RenderQuality.metrics) },
    world: Game.world ? { hands: Game.world.hands.length, hazards: Game.world.hazards.length, motes: Game.world.motes.length, deco: Game.world.deco.length } : null,
    input: { pointers: Input.pointerCount, resumeHold: Input.resumeHold, touchMode: IS_TOUCH, coarsePointer: COARSE_POINTER, mobileProfile: MOBILE_LIKELY },
    audio: { state: Audio.state, unlocked: Audio.unlocked, ambienceReady: Audio.ambienceReady },
    lifecycle: { visibility: document.visibilityState, active: pageActive },
    performance: { longTaskCount: RUNTIME_PERF.longTasks.length, maxLongTask: RUNTIME_PERF.maxLongTask }
  };
}
function qaBenchmarkRender(count = 40) {
  if (!QA_MODE) return null;
  const n = clamp(Number(count) || 40, 5, 120) | 0, samples = [];
  const savedTrail = VIS.trail.map(p => Object.assign({}, p)), savedRings = VIS.rings.map(r => Object.assign({}, r)), savedTrailT = VIS.lastTrailT, savedPulseT = VIS.pulseT;
  for (let i = 0; i < 5; i++) render(Game, tnow + i / 60);
  for (let i = 0; i < n; i++) { const a = performance.now(); render(Game, tnow + (i + 5) / 60); samples.push(performance.now() - a); }
  VIS.trail.splice(0, VIS.trail.length, ...savedTrail); VIS.rings.splice(0, VIS.rings.length, ...savedRings); VIS.lastTrailT = savedTrailT; VIS.pulseT = savedPulseT;
  render(Game, tnow);
  const sorted = samples.slice().sort((a,b) => a-b);
  const mean = samples.reduce((a,b) => a+b, 0) / samples.length;
  return { count: n, mean: +mean.toFixed(3), p50: +sorted[(n * .5) | 0].toFixed(3), p95: +sorted[Math.min(n - 1, (n * .95) | 0)].toFixed(3), max: +sorted[n - 1].toFixed(3), tier: RenderQuality.tier };
}

resize(); readSafeArea(); startGame(true); Audio.prewarm();
window.__THROWN__ = Object.freeze({
  build: BUILD_ID,
  snapshot: qaSnapshot,
  restart: () => { startGame(true); staticFrameDirty = true; return qaSnapshot(); },
  chapter: qaGoToChapter,
  benchmarkRender: qaBenchmarkRender,
  setQuality: tier => QA_MODE ? RenderQuality.setTier(clamp(Number(tier) || 0, 0, 2), performance.now()) : false,
  clearLongTasks: () => { if (!QA_MODE) return false; RUNTIME_PERF.longTasks.length = 0; RUNTIME_PERF.maxLongTask = 0; return true; }
});
requestAnimationFrame(frame);
</script>
