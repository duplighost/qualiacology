name: Android mobile conversion export
on:
  push:
    branches: [android/mobile-selection-20260913]
    paths: [.github/workflows/android-mobile-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare source snapshot
        run: |
          set -eux
          mkdir -p /tmp/mobile-export/site /tmp/mobile-export/tools
          git rev-parse HEAD > /tmp/mobile-export/SOURCE_COMMIT.txt
          for p in falling-open i-seent-it thurible lil-big-bang lead thrown wick pocket-sun no-moon glide rally rocket-shoes party-animal galaxy-sandbox games assets shared vendor; do
            if [ -e "$p" ]; then cp -a "$p" /tmp/mobile-export/site/; fi
          done
          find /tmp/mobile-export/site -type f -printf '%P\t%s\n' > /tmp/mobile-export/SITE_FILES.tsv
          python - <<'PY'
          import pathlib, json, urllib.request, hashlib, concurrent.futures
          root=pathlib.Path('/tmp/mobile-export/site')
          def check(slug):
              p=root/slug/'index.html'
              if not p.exists(): return {'slug':slug,'missing':True}
              item={'slug':slug,'repository_sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
              try:
                  req=urllib.request.Request('https://qualiacology.com/'+slug+'/',headers={'User-Agent':'Qualiacology-Android-Build/1.0'})
                  with urllib.request.urlopen(req,timeout=25) as r: live=r.read()
                  item['live_sha256']=hashlib.sha256(live).hexdigest(); item['live_matches_repository']=item['repository_sha256']==item['live_sha256']
                  item['live_bytes']=len(live)
              except Exception as e:item['live_error']=str(e)
              return item
          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as ex: out=list(ex.map(check,['falling-open','i-seent-it','thurible','lil-big-bang','lead','thrown','wick','pocket-sun','no-moon','glide','rally','rocket-shoes','party-animal','galaxy-sandbox']))
          pathlib.Path('/tmp/mobile-export/LIVE_VERIFICATION.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Export Android build tools
        run: |
          set -eux
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          cp "$ANDROID_HOME/platforms/android-35/android.jar" /tmp/mobile-export/tools/
          cp -a "$ANDROID_HOME/build-tools/35.0.0" /tmp/mobile-export/tools/build-tools
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-mobile-sources-and-tools
          path: /tmp/mobile-export
          retention-days: 3
          compression-level: 6
