name: Pocket Sun Android validation

on:
  push:
    branches: ['android/pocket-sun-20260913']
    paths: ['.github/workflows/pocket-sun-android-validation.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installed-apk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Retrieve exact APK already built and signature-verified
        uses: actions/download-artifact@v4
        with:
          name: POCKET-SUN-Android-build
          run-id: 34736178778
          github-token: ${{ github.token }}
      - name: Verify APK identity and enable acceleration
        run: |
          echo '9478638de18a95212e5b0d83a94c12082b9a4c90bea445f416b4771f608fa23b  pocket-sun-android/POCKET-SUN-Android-test.apk' | sha256sum --check
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p android-test-results
          cp pocket-sun-android/SHA256SUMS.txt android-test-results/TESTED-APK-SHA256SUMS.txt
          free -h > android-test-results/host-memory-before.txt
      - name: Test same installed app offline on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          emulator-build: 14472402
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 240
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: node android-apps/pocket-sun/smoke.mjs
      - name: Preserve host diagnostics
        if: always()
        run: |
          mkdir -p android-test-results
          sudo dmesg --ctime | tail -160 > android-test-results/host-kernel-tail.txt || true
          free -h > android-test-results/host-memory-after.txt
      - name: Export native test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-SUN-Android-validation-pinned
          retention-days: 30
          if-no-files-found: error
          path: android-test-results/
