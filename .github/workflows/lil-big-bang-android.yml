name: LIL BIG BANG Android
on:
  push:
    branches: [android/lil-big-bang-20260913]
    paths:
      - '.github/workflows/lil-big-bang-android.yml'
      - 'android/lil-big-bang/**'
permissions:
  contents: read
concurrency:
  group: lil-big-bang-android
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lil-big-bang
            android/lil-big-bang
          sparse-checkout-cone-mode: true
      - name: Reconstruct verified Android project
        shell: python
        run: |
          import base64, hashlib, json, pathlib, shutil, zipfile, io
          root = pathlib.Path('android/lil-big-bang')
          encoded = (root / 'project.zip.b64').read_text()
          repairs = root / 'transfer-repairs.json'
          if repairs.exists():
              for old, new in json.loads(repairs.read_text()):
                  assert encoded.count(old) == 1, 'Ambiguous transfer repair'
                  encoded = encoded.replace(old, new, 1)
          raw = base64.b64decode(encoded, validate=True)
          expected = 'ee6339632321a4d0d47e3f3664fd7271f847183b8caf569923b0943e3d533457'
          actual = hashlib.sha256(raw).hexdigest()
          assert actual == expected, 'Transfer SHA256 mismatch: ' + actual
          dest = pathlib.Path('LIL-BIG-BANG-Android')
          zipfile.ZipFile(io.BytesIO(raw)).extractall(dest)
          (dest / 'game-source').mkdir(exist_ok=True)
          shutil.copyfile('lil-big-bang/index.html', dest / 'game-source/index.html')
          test = dest / 'app/src/androidTest/java/com/qualiacology/lilbigbang/OfflineGameTest.java'
          text = test.read_text()
          text = text.replace('intent.putExtra("selfTest", true);', '// Normal launcher path; cartridge contract tests run separately in browser QA.')
          text = text.replace('done.await(10, TimeUnit.SECONDS)', 'done.await(60, TimeUnit.SECONDS)')
          text = text.replace('SystemClock.uptimeMillis() + 20000', 'SystemClock.uptimeMillis() + 60000')
          text = text.replace('AtomicReference<String> result = new AtomicReference<>();', 'System.out.println("LBB_JS_REQUEST=" + expression);\n        AtomicReference<String> result = new AtomicReference<>();')
          text = text.replace('return result.get();', 'System.out.println("LBB_JS_RESULT=" + result.get());\n        return result.get();')
          test.write_text(text)
          pathlib.Path('ci-native-test.sh').write_text('''#!/usr/bin/env bash
          set +e
          mkdir -p dist/qa
          adb logcat -c
          (cd LIL-BIG-BANG-Android && timeout 240 ./gradlew connectedDebugAndroidTest --stacktrace)
          result=$?
          adb logcat -d > dist/qa/emulator-logcat.txt
          adb pull /sdcard/Android/data/com.qualiacology.lilbigbang/files/qa dist/qa/screenshots
          adb exec-out screencap -p > dist/qa/emulator-final-screen.png
          exit "$result"
          ''')
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Prepare offline assets and Android SDK
        run: |
          python3 LIL-BIG-BANG-Android/prepare_assets.py
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          gradle -p LIL-BIG-BANG-Android wrapper --gradle-version 8.13
      - name: Compile app and installed-app tests
        run: |
          cd LIL-BIG-BANG-Android
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Verify APK and assemble deliverables
        run: |
          mkdir -p dist/qa
          cp LIL-BIG-BANG-Android/app/build/outputs/apk/debug/app-debug.apk dist/LIL-BIG-BANG-Android.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/LIL-BIG-BANG-Android.apk > dist/qa/apk-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/LIL-BIG-BANG-Android.apk > dist/qa/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/LIL-BIG-BANG-Android.apk > dist/qa/apk-permissions.txt
          cp LIL-BIG-BANG-Android/app/src/main/assets/build-info.json dist/qa/build-info.json
          git rev-parse HEAD > dist/qa/build-commit.txt
          zip -qr dist/LIL-BIG-BANG-Android-Source.zip LIL-BIG-BANG-Android -x '*/build/*' '*/.gradle/*' '*/local.properties' '*/.kotlin/*'
          sha256sum dist/LIL-BIG-BANG-Android.apk dist/LIL-BIG-BANG-Android-Source.zip > dist/SHA256SUMS.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed app on Android
        timeout-minutes: 7
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci-native-test.sh
      - name: Collect test reports
        if: always()
        run: |
          mkdir -p dist/qa
          if [ -d LIL-BIG-BANG-Android/app/build/reports/androidTests ]; then cp -r LIL-BIG-BANG-Android/app/build/reports/androidTests dist/qa/; fi
          if [ -d LIL-BIG-BANG-Android/app/build/outputs/androidTest-results ]; then cp -r LIL-BIG-BANG-Android/app/build/outputs/androidTest-results dist/qa/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lil-big-bang-android
          path: dist
          retention-days: 30
          if-no-files-found: error
