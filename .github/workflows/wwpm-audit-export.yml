name: WWPM native audit

on:
  push:
    branches: [audit/wwpm-616f756-evidence-20260914]
    paths: [.github/workflows/wwpm-audit-export.yml, '.audit/wwpm/**']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare unchanged game and browser tools
        shell: bash
        run: |
          mkdir -p /tmp/wwpm-source audit-evidence
          git archive HEAD curfew | tar -x -C /tmp/wwpm-source
          git ls-tree -r HEAD curfew > audit-evidence/GIT_TREE.txt
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Inspect current game
        env:
          WWPM_SOURCE: /tmp/wwpm-source
        run: python .audit/wwpm/runtime_audit.py
      - name: Package audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwpm-native-evidence-${{ github.run_number }}
          path: |
            audit-evidence/
            .audit/wwpm/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
