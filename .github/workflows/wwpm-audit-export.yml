name: WWPM isolated ending verification
on:
  push:
    branches: [audit/wwpm-616f756-evidence-20260914]
    paths: [.github/workflows/wwpm-audit-export.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Prepare unchanged game and native browser
        run: |
          mkdir -p /tmp/wwpm-source audit-evidence
          git archive HEAD curfew | tar -x -C /tmp/wwpm-source
          git ls-tree -r HEAD curfew > audit-evidence/GIT_TREE.txt
          python -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Inspect isolated ending and inputs
        env:
          WWPM_SOURCE: /tmp/wwpm-source
        run: timeout --signal=INT --kill-after=30s 23m python .audit/wwpm_deep_clean.py
      - name: Package evidence even if a case fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wwpm-clean-evidence-${{ github.run_number }}
          path: |
            audit-evidence/
            .audit/wwpm_deep.py
            .audit/wwpm_deep_clean.py
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
