name: WWPM pinned audit export

on:
  push:
    branches: [audit/wwpm-616f756-evidence-20260914]
    paths: [.github/workflows/wwpm-audit-export.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 616f75690c54ee37a53f603ecc6d7a0d1ca13b17
          persist-credentials: false
      - name: Record exact source identity
        shell: bash
        run: |
          mkdir -p audit-export
          git rev-parse HEAD > audit-export/REVISION.txt
          git ls-tree -r HEAD curfew > audit-export/GIT_TREE.txt
          cp -R curfew audit-export/curfew
          cp AGENTS.md audit-export/AGENTS.md
          find audit-export/curfew -type f -print0 | sort -z | xargs -0 sha256sum > audit-export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wwpm-exact-616f756
          path: audit-export/
          retention-days: 7
          if-no-files-found: error
