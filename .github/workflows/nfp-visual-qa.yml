name: NO FIXED POINTS Visual QA

on:
  push:
    branches: [ai/no-fixed-points-reforged-qa]
    paths:
      - 'nfp-qa/**'
      - '.github/workflows/nfp-visual-qa.yml'

permissions:
  contents: read

concurrency:
  group: nfp-visual-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct QA build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nfp-dist/vendor nfp-artifact/qa
          cat nfp-qa/payload-00.txt nfp-qa/payload-01.txt nfp-qa/payload-02.txt nfp-qa/tail-*.txt \
            | base64 --decode | gzip --decompress > nfp-dist/index.html
          cp arc/vendor/three.module.min.js nfp-dist/vendor/three.module.min.js
          cp nfp-dist/index.html nfp-dist/NO_FIXED_POINTS_THE_WEIGHT_OF_GOD.html
          test "$(wc -c < nfp-dist/index.html)" -gt 100000
          test "$(wc -c < nfp-dist/vendor/three.module.min.js)" -gt 600000

      - name: Start local server
        shell: bash
        run: |
          cd nfp-dist
          python3 -m http.server 4173 > /tmp/nfp-http.log 2>&1 &
          echo $! > /tmp/nfp-http.pid
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Install visual harness
        shell: bash
        run: npm install --no-save --no-package-lock playwright-core@1.55.0

      - name: Render and inspect authored QA views
        shell: bash
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          set -euo pipefail
          cat > nfp-render.mjs <<'NODE'
          import { chromium } from 'playwright-core';
          import { writeFile, stat } from 'node:fs/promises';

          const shots = ['hero', 'bell', 'reliquary', 'spine', 'boss', 'scale'];
          const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.CHROME_PATH,
            args: [
              '--no-sandbox', '--disable-dev-shm-usage', '--use-angle=swiftshader',
              '--enable-webgl', '--ignore-gpu-blocklist', '--disable-background-networking'
            ]
          });
          const report = { chrome: await browser.version(), shots: [], errors: [] };

          for (const shot of shots) {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 900 },
              deviceScaleFactor: 1,
              reducedMotion: 'reduce'
            });
            const page = await context.newPage();
            const messages = [];
            page.on('console', m => messages.push({ type: m.type(), text: m.text() }));
            page.on('pageerror', e => messages.push({ type: 'pageerror', text: String(e.stack || e) }));
            const url = `http://127.0.0.1:4173/index.html?shot=${shot}`;
            await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForFunction(
              () => window.__NFP_READY__ === true || document.body?.dataset?.ready === 'true',
              null,
              { timeout: 45000 }
            );
            await page.waitForTimeout(2200);
            const path = `nfp-artifact/qa/${shot}.png`;
            await page.screenshot({ path, type: 'png' });
            const bytes = (await stat(path)).size;
            if (bytes < 40000) throw new Error(`${shot} screenshot suspiciously small: ${bytes}`);
            const diagnostics = await page.evaluate(() => ({
              ready: window.__NFP_READY__ === true,
              qa: window.__NFP_QA__ || null,
              engine: document.querySelector('canvas')?.dataset?.engine || null,
              bodyReady: document.body?.dataset?.ready || null,
              title: document.title,
              canvas: (() => {
                const c = document.querySelector('canvas');
                return c ? { width: c.width, height: c.height } : null;
              })()
            }));
            report.shots.push({ shot, bytes, diagnostics, messages });
            await context.close();
          }

          await browser.close();
          await writeFile('nfp-artifact/qa/visual-report.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify(report, null, 2));
          if (report.shots.some(s => !s.diagnostics.ready || s.diagnostics.engine !== 'three.js r161')) {
            throw new Error('One or more authored views failed runtime readiness checks.');
          }
          NODE
          timeout --signal=TERM --kill-after=10s 420s node ./nfp-render.mjs | tee nfp-artifact/qa/harness.log
          cp /tmp/nfp-http.log nfp-artifact/qa/http.log

      - name: Assemble offline package
        shell: bash
        run: |
          cp -R nfp-dist nfp-artifact/NO_FIXED_POINTS_REFORGED
          cat > nfp-artifact/README.txt <<'EOF'
          NO FIXED POINTS — THE WEIGHT OF GOD

          Run locally:
            python3 -m http.server 8080 --directory NO_FIXED_POINTS_REFORGED
          Then open:
            http://localhost:8080/

          Controls:
            WASD move · Mouse look · Space jump · Shift sprint · Q dash
            RMB tether · LMB strike / throw · Esc pause

          The package vendors Three.js r161 and does not require a CDN.
          EOF
          cd nfp-artifact
          zip -qr ../NO_FIXED_POINTS_REFORGED.zip NO_FIXED_POINTS_REFORGED README.txt qa

      - name: Upload package and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: NO_FIXED_POINTS_REFORGED_QA
          path: |
            nfp-artifact/
            NO_FIXED_POINTS_REFORGED.zip
          if-no-files-found: error
          retention-days: 7
