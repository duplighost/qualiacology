name: WINTERLINE production visual survey

on:
  push:
    branches: [test/winterline-live-regression]

permissions:
  contents: read

concurrency:
  group: winterline-live-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-survey:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out survey harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install Chromium
        working-directory: build
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Capture full spawn-room camera survey
        working-directory: build
        shell: bash
        run: |
          mkdir -p qa test-output/winterline-survey
          cat > qa/winterline-camera-survey.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const output = path.resolve('test-output/winterline-survey');
          fs.mkdirSync(output, { recursive: true });
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const digest = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const errors = [];
          const pageErrors = [];
          const failedRequests = [];

          const browser = await chromium.launch({
            headless: false,
            args: [
              '--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle',
              '--use-angle=swiftshader', '--enable-unsafe-swiftshader',
              '--autoplay-policy=no-user-gesture-required', '--disable-dev-shm-usage',
              '--disable-gpu-sandbox', '--no-sandbox',
            ],
          });
          const context = await browser.newContext({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.setDefaultTimeout(30000);
          page.on('console', message => { if (message.type() === 'error') errors.push(message.text()); });
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure() }));

          await page.goto('https://qualiacology.com/winterline/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          let ready = false;
          for (let second = 0; second < 100; second++) {
            const state = await page.locator('#play').evaluate(button => ({ disabled: button.disabled, message: document.querySelector('#message')?.textContent?.trim() || '' })).catch(() => null);
            if (state && !state.disabled) { ready = true; break; }
            if (state?.message?.toLowerCase().includes('loading failed')) break;
            await sleep(1000);
          }
          if (!ready) throw new Error(`WINTERLINE never became ready: ${await page.locator('#message').innerText().catch(() => 'no message')}`);

          await page.locator('#play').click({ force: true });
          await page.waitForFunction(() => document.body.classList.contains('playing'), null, { timeout: 20000 });
          await sleep(7000);

          const files = [];
          const capture = async index => {
            const file = path.join(output, `yaw-${String(index).padStart(2, '0')}.png`);
            await page.screenshot({ path: file, timeout: 30000 });
            files.push(file);
          };
          const look = async dx => {
            await page.evaluate(value => {
              const event = new MouseEvent('mousemove', { bubbles: true, cancelable: true, view: window });
              Object.defineProperty(event, 'movementX', { configurable: true, value });
              Object.defineProperty(event, 'movementY', { configurable: true, value: 0 });
              document.dispatchEvent(event);
            }, dx);
            await sleep(600);
          };

          await capture(0);
          for (let index = 1; index <= 8; index++) {
            await look(400);
            await capture(index);
          }

          const hashes = files.map(file => ({ file: path.basename(file), sha256: digest(file), bytes: fs.statSync(file).size }));
          const result = {
            url: page.url(),
            bodyClass: await page.locator('body').getAttribute('class'),
            pointerLockElement: await page.evaluate(() => document.pointerLockElement?.id || null),
            weapon: await page.locator('#weapon-label').innerText(),
            uniqueFrames: new Set(hashes.map(item => item.sha256)).size,
            hashes,
            errors,
            pageErrors,
            failedRequests,
          };
          fs.writeFileSync(path.join(output, 'survey.json'), JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          await context.close();
          await browser.close();
          if (result.uniqueFrames < 6 || errors.length || pageErrors.length || failedRequests.length) process.exit(1);
          NODE
          timeout 180s xvfb-run -a -s "-screen 0 1280x720x24" node qa/winterline-camera-survey.mjs

      - name: Upload visual survey
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winterline-production-camera-survey
          path: build/test-output/winterline-survey
          if-no-files-found: error
          retention-days: 7
