name: WINTERLINE production street test

on:
  push:
    branches: [test/winterline-live-regression]

permissions:
  contents: read

concurrency:
  group: winterline-live-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  street-test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out test harness
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build/package-lock.json

      - name: Install Chromium
        working-directory: build
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Walk from the spawn room into the live city
        working-directory: build
        shell: bash
        run: |
          mkdir -p qa test-output/winterline-street
          cat > qa/winterline-street-test.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';

          const output = path.resolve('test-output/winterline-street');
          fs.mkdirSync(output, { recursive: true });
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const hash = file => crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          const errors = [];
          const warnings = [];
          const pageErrors = [];
          const failedRequests = [];
          const badResponses = [];
          const harnessErrors = [];
          const files = [];

          const browser = await chromium.launch({
            headless: false,
            args: [
              '--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle',
              '--use-angle=swiftshader', '--enable-unsafe-swiftshader',
              '--autoplay-policy=no-user-gesture-required', '--disable-dev-shm-usage',
              '--disable-gpu-sandbox', '--no-sandbox',
            ],
          });
          const context = await browser.newContext({ viewport: { width: 1280, height: 720 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          const cdp = await context.newCDPSession(page);
          page.setDefaultTimeout(30000);
          page.on('console', message => {
            if (message.type() === 'error') errors.push(message.text());
            if (message.type() === 'warning') warnings.push(message.text());
          });
          page.on('pageerror', error => pageErrors.push(String(error)));
          page.on('requestfailed', request => failedRequests.push({ url: request.url(), failure: request.failure() }));
          page.on('response', response => { if (response.status() >= 400) badResponses.push({ url: response.url(), status: response.status() }); });

          const capture = async name => {
            const file = path.join(output, `${name}.png`);
            await page.screenshot({ path: file, timeout: 30000 });
            files.push(file);
          };
          const look = async (dx, dy = 0) => {
            await page.evaluate(([x, y]) => {
              const event = new MouseEvent('mousemove', { bubbles: true, cancelable: true, view: window });
              Object.defineProperty(event, 'movementX', { configurable: true, value: x });
              Object.defineProperty(event, 'movementY', { configurable: true, value: y });
              document.dispatchEvent(event);
            }, [dx, dy]);
            await sleep(500);
          };
          const nativeDown = async ({ code, key, vk, modifiers = 0, text = '' }) => {
            await cdp.send('Input.dispatchKeyEvent', {
              type: 'rawKeyDown', code, key,
              windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk,
              modifiers, autoRepeat: false, isKeypad: false,
            });
            await cdp.send('Input.dispatchKeyEvent', {
              type: 'keyDown', code, key,
              windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk,
              modifiers, text, unmodifiedText: text,
            });
          };
          const nativeUp = async ({ code, key, vk, modifiers = 0 }) => {
            await cdp.send('Input.dispatchKeyEvent', {
              type: 'keyUp', code, key,
              windowsVirtualKeyCode: vk, nativeVirtualKeyCode: vk,
              modifiers,
            });
          };
          const trustedMove = async (milliseconds, sprint = false) => {
            await page.bringToFront();
            await page.locator('#game').focus().catch(() => {});
            if (sprint) await nativeDown({ code: 'ShiftLeft', key: 'Shift', vk: 16, modifiers: 8 });
            await nativeDown({ code: 'KeyW', key: sprint ? 'W' : 'w', vk: 87, modifiers: sprint ? 8 : 0, text: sprint ? 'W' : 'w' });
            await sleep(milliseconds);
            await nativeUp({ code: 'KeyW', key: sprint ? 'W' : 'w', vk: 87, modifiers: sprint ? 8 : 0 });
            if (sprint) await nativeUp({ code: 'ShiftLeft', key: 'Shift', vk: 16, modifiers: 0 });
            await sleep(1200);
          };

          let response = null;
          let ready = false;
          let entered = false;
          try {
            response = await page.goto('https://qualiacology.com/winterline/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            for (let second = 0; second < 110; second++) {
              const state = await page.locator('#play').evaluate(button => ({ disabled: button.disabled, message: document.querySelector('#message')?.textContent?.trim() || '' })).catch(() => null);
              if (state && !state.disabled) { ready = true; break; }
              if (state?.message?.toLowerCase().includes('loading failed')) break;
              await sleep(1000);
            }
            if (!ready) throw new Error(`WINTERLINE never became ready: ${await page.locator('#message').innerText().catch(() => 'no message')}`);

            await page.locator('#play').click({ force: true });
            await page.waitForFunction(() => document.body.classList.contains('playing'), null, { timeout: 20000 });
            entered = true;
            await sleep(7000);
            await capture('00-spawn-facing-fireplace');

            for (let turn = 0; turn < 4; turn++) await look(400);
            await capture('01-door-centered');

            await trustedMove(4200, false);
            await capture('02-through-door');

            await trustedMove(5500, true);
            await capture('03-square-near');

            await trustedMove(7000, true);
            await capture('04-square-far');

            await look(550);
            await capture('05-look-right');
            await look(-1100);
            await capture('06-look-left');
          } catch (error) {
            harnessErrors.push(String(error));
          }

          const hashes = files.map(file => ({ file: path.basename(file), sha256: hash(file), bytes: fs.statSync(file).size }));
          const result = {
            url: page.url(),
            httpStatus: response?.status() || null,
            ready,
            entered,
            bodyClass: await page.locator('body').getAttribute('class').catch(() => null),
            pointerLockElement: await page.evaluate(() => document.pointerLockElement?.id || null).catch(() => null),
            weapon: await page.locator('#weapon-label').innerText().catch(() => ''),
            score: await page.locator('#score-total').innerText().catch(() => ''),
            level: await page.locator('#rank-number').innerText().catch(() => ''),
            uniqueFrames: new Set(hashes.map(item => item.sha256)).size,
            hashes,
            errors,
            warnings,
            pageErrors,
            failedRequests,
            badResponses,
            harnessErrors,
          };
          fs.writeFileSync(path.join(output, 'street-test.json'), JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          await context.close();
          await browser.close();

          const passed = result.httpStatus === 200 && result.ready && result.entered && result.bodyClass?.includes('playing') && result.pointerLockElement === 'game' && result.uniqueFrames >= 6 && errors.length === 0 && pageErrors.length === 0 && failedRequests.length === 0 && badResponses.length === 0 && harnessErrors.length === 0;
          if (!passed) process.exit(1);
          NODE
          timeout 240s xvfb-run -a -s "-screen 0 1280x720x24" node qa/winterline-street-test.mjs

      - name: Upload street evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winterline-production-street-native-input
          path: build/test-output/winterline-street
          if-no-files-found: error
          retention-days: 7
