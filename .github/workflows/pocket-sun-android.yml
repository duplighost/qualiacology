name: Pocket Sun Android

on:
  push:
    branches: ['android/pocket-sun-20260913']
    paths:
      - 'android-apps/pocket-sun/**'
      - '.github/workflows/pocket-sun-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Prepare exact shipped game and native shell
        run: |
          node --check android-apps/pocket-sun/prepare.mjs
          node --check android-apps/pocket-sun/smoke.mjs
          node android-apps/pocket-sun/prepare.mjs
      - name: Compile Android APK and unsigned future-release bundle
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cd pocket-sun-android/android
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Verify signature, permissions and bundled assets
        run: |
          cd pocket-sun-android
          cp android/app/build/outputs/apk/debug/app-debug.apk POCKET-SUN-Android-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab POCKET-SUN-UNSIGNED.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs POCKET-SUN-Android-test.apk > APK-SIGNATURE.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging POCKET-SUN-Android-test.apk > APK-METADATA.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions POCKET-SUN-Android-test.apk > APK-PERMISSIONS.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree POCKET-SUN-Android-test.apk AndroidManifest.xml > APK-MANIFEST.txt
          if grep -q 'android.permission.INTERNET' APK-PERMISSIONS.txt; then echo 'Unexpected Internet permission'; exit 1; fi
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const proof=JSON.parse(fs.readFileSync('BUILD-PROVENANCE.json'));
          for(const file of proof.files){
            const bytes=execFileSync('unzip',['-p','POCKET-SUN-Android-test.apk','assets/public/'+file.file]);
            const hash=crypto.createHash('sha256').update(bytes).digest('hex');
            if(hash!==file.sourceSHA256)throw new Error('APK game asset mismatch: '+file.file);
          }
          console.log('APK contains byte-identical production game bundles.');
          JS
          sha256sum POCKET-SUN-Android-test.apk POCKET-SUN-UNSIGNED.aab > SHA256SUMS.txt
          cp ../android-apps/pocket-sun/smoke.mjs android-emulator-smoke.mjs
          zip -q -r ../POCKET-SUN-Android-project.zip . -x 'node_modules/*' 'android/.gradle/*' 'android/*/build/*' 'android/build/*' 'android/local.properties' '*.apk' '*.aab'
      - name: Export installable APK and buildable project
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-SUN-Android-build
          retention-days: 30
          if-no-files-found: error
          path: |
            pocket-sun-android/POCKET-SUN-Android-test.apk
            pocket-sun-android/POCKET-SUN-UNSIGNED.aab
            pocket-sun-android/BUILD-PROVENANCE.json
            pocket-sun-android/APK-*.txt
            pocket-sun-android/SHA256SUMS.txt
            POCKET-SUN-Android-project.zip
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p android-test-results
          free -h > android-test-results/host-memory-before.txt
      - name: Test installed app offline on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          emulator-build: 14472402
          target: google_apis
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: node android-apps/pocket-sun/smoke.mjs
      - name: Preserve host crash diagnostics
        if: always()
        run: |
          mkdir -p android-test-results
          sudo dmesg --ctime | tail -160 > android-test-results/host-kernel-tail.txt || true
          free -h > android-test-results/host-memory-after.txt
      - name: Export emulator checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: POCKET-SUN-Android-validation
          retention-days: 30
          if-no-files-found: warn
          path: android-test-results/
