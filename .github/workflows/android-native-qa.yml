name: Android native recheck
on:
  push:
    branches: ['android/mobile-batch-20260913']
    paths: ['android-native-qa/**', '.github/workflows/android-native-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-native-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      ANDROID_APK_DIR: /tmp/mobile-apks/delivery
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: qualiacology-mobile-apps
          run-id: 34743298270
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/mobile-apks
      - name: Prepare emulator tests
        run: |
          python -m py_compile android-native-qa/recheck.py
          python -m pip install websocket-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, interact, pause and resume exact APKs
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 2 -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python android-native-qa/recheck.py
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-recheck
          path: android-native-qa/out/
          if-no-files-found: warn
          retention-days: 30
