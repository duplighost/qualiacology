name: Android native recheck
on:
  push:
    branches: ['android/mobile-batch-20260913']
    paths: ['android-native-qa/**', '.github/workflows/android-native-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-native-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Native ${{ matrix.game }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        game: [falling-open, lil-big-bang, thrown, i-seent-it]
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      ANDROID_APK_DIR: /tmp/mobile-apks/delivery
      TEST_GAME: ${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/download-artifact@v4
        with:
          name: qualiacology-mobile-apps
          run-id: 34743298270
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/mobile-apks
      - name: Prepare isolated emulator tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android-native-qa/recheck.py')
          s=p.read_text()
          changes={
            "verification=json.loads": "GAMES=[g for g in GAMES if g[1]==os.environ['TEST_GAME']]\nassert len(GAMES)==1, 'Unknown game'\nverification=json.loads",
            "'Game paused' in menu and 'Resume' in menu": "'game paused' in menu.lower() and 'resume' in menu.lower()",
            "len(reports)!=4": "len(reports)!=len(GAMES)",
            "time.sleep(.75)": "time.sleep(1.5)",
            "# Native input, not synthetic DOM pointer events.": "evaluate(ws, \"(()=>{const b=Array.from(document.querySelectorAll('button')).find(b=>/^(keep falling|resume)$/i.test(b.innerText.trim())&&b.getBoundingClientRect().width>0);if(b)b.click();return true})()\")\n        # Native input, not synthetic DOM pointer events."
          }
          for old,new in changes.items():
              assert old in s, old
              s=s.replace(old,new)
          p.write_text(s)
          out=Path('android-native-qa/out');out.mkdir(parents=True,exist_ok=True)
          (out/'executed-test.py').write_text(s)
          PY
          python -m py_compile android-native-qa/recheck.py
          python -m pip install websocket-client
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, interact, pause and resume exact APK
        timeout-minutes: 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -memory 3072 -cores 2 -no-snapshot -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            python android-native-qa/recheck.py
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.game }}
          path: android-native-qa/out/
          if-no-files-found: warn
          retention-days: 30
