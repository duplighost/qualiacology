name: WWPM isolated refactor export
on:
  push:
    branches: [wwpm-refactor-20260912]
    paths: [.github/workflows/wwpm-refactor-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b822ee53c57e9740522eb60b38803672910c5d60
          sparse-checkout: |
            curfew
            build/qa
            AGENTS.md
            CLAUDE.md
          sparse-checkout-cone-mode: true
      - name: Record exact source revision
        run: git rev-parse HEAD > WWPM_SOURCE_REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wwpm-pinned-runtime-b822ee53
          path: |
            curfew/
            build/qa/
            AGENTS.md
            CLAUDE.md
            WWPM_SOURCE_REVISION.txt
          retention-days: 7
          if-no-files-found: error
