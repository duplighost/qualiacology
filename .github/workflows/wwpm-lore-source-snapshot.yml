name: WWPM pinned lore source snapshot
on:
  push:
    branches: [wwpm-lore-bible-source-snapshot]
    paths: [.github/workflows/wwpm-lore-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6b24bc735c2ecf5dca45dc79ce8bbafcf2147d7b
          persist-credentials: false
          sparse-checkout: |
            curfew
            AGENTS.md
            CLAUDE.md
          sparse-checkout-cone-mode: false
      - name: Record immutable source revision
        run: git rev-parse HEAD > WWPM_SOURCE_REVISION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wwpm-source-6b24bc7
          path: |
            curfew/
            AGENTS.md
            CLAUDE.md
            WWPM_SOURCE_REVISION.txt
          retention-days: 3
          if-no-files-found: error
