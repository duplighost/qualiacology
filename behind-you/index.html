        #crosshair {
            position: absolute; top: 50%; left: 50%;

        .screen {
            pointer-events: auto;

        #timer-display {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);

        #boss-bar-wrap {
            position: absolute; top: 88px; left: 50%;

        }
        #boss-name-label {
            font-weight: 700; font-size: 11px;

        }
        #boss-bar {
            height: 6px;

        }
        #boss-fill {
            height: 100%; width: 100%;
            background: linear-gradient(90deg, #ff2200, #ff7a00);

        #boss-announce {
            position: absolute; top: 34%; left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 800; font-size: clamp(1.6rem, 6vw, 3rem); line-height: 1.1;
            color: #ff2a1a; letter-spacing: 0.18em; text-transform: uppercase;
            text-shadow: 0 0 24px rgba(255, 30, 0, 0.9);

            opacity: 0; transition: opacity 0.45s ease;
        }
        #boss-announce .sub {
            display: block; font-size: 0.85rem; letter-spacing: 0.28em;
            color: #fca5a5; margin-top: 10px; text-shadow: none;
        }
        #boss-announce.show { opacity: 1; }

        button {
            background: #500; color: white; border: 2px solid #f55;
            padding: 10px 30px; font-size: 1.5rem; font-family: inherit;
            cursor: pointer; transition: all 0.2s; margin-top: 20px;
            text-transform: uppercase;

        button:hover { background: #f55; color: #000; box-shadow: 0 0 15px #f55; }

        .hidden { display: none !important; }

        @media (max-width: 700px) {

        /* CRT overlay effect */

            background-size: 100% 4px, 6px 100%; pointer-events: none; z-index: 100; opacity: 0.6;

<body>
    <a class="home-link" href="/">Qualiacology</a>

    <canvas id="game-canvas"></canvas>

    <div id="death-flash"></div>
    <div id="crosshair"></div>

    <div id="boss-bar-wrap">
        <div id="boss-name-label">HELLWARDEN</div>
        <div id="boss-bar"><div id="boss-fill"></div></div>
    </div>
    <div id="boss-announce">HELLWARDEN<span class="sub">Jump the shockwave</span></div>

        <div id="ui-layer">
            <div id="start-screen" class="screen">
                <h1 class="text-6xl font-bold mb-4 tracking-widest" style="color: #f22; text-shadow: 0 0 20px #f00;">BEHIND YOU</h1>
            <p class="stat-line">Best <span id="start-best">0.0000</span> / Hell Held <span class="achievement-target">666.6660</span></p>
            <p id="desktop-note" class="stat-line hidden">Desktop with a mouse &amp; keyboard required.</p>
            <button id="start-btn">Click to Enter</button>
        </div>

        <div id="game-over-screen" class="screen hidden">
            <h1 class="text-6xl font-bold mb-4 text-red-600">YOU DIED</h1>
            <p class="text-2xl text-white mb-2">Time Survived:</p>
            <p id="final-time" class="text-5xl font-bold text-yellow-400 mb-8" style="text-shadow: 0 0 15px rgba(255,255,0,0.5);">0.0000</p>
            <p id="new-best" class="stat-line hidden">New Best</p>
            <p id="delta-time" class="stat-line">Delta 0.0000</p>
            <p class="stat-line">Best <span id="over-best">0.0000</span> / Hell Held <span class="achievement-target">666.6660</span></p>
            <p id="achievement-line" class="stat-line hidden">HELL HELD</p>
            <button id="restart-btn">Try Again</button>
        </div>
    </div>

    <script src="./vendor/three.min.js"></script>
    <script src="./vendor/PointerLockControls.js"></script>
    <script src="./vendor/Tone.js"></script>

    <script>
        let camera, scene, renderer, controls;
        let infiniteArena;
        let audioListener, enemyAudioBuffers;
        
        // Game State
        let isPlaying = false;
        let isGameOver = false;
        let gameTime = 0;
        let lastTime = performance.now();
        let lastSpawnTime = 0;
        const legacyBestTimeKey = 'demonShardsBestTime';
        const legacyDemonAchievementKey = 'demonShardsHellHeld';
        const legacyLowAchievementKey = 'behindYouHellHeld';
        const bestTimeKey = 'behindYouBestTime';
        const achievementKey = 'behindYouHellHeld666';
        const achievementTime = 666.666;
        const spawnDistancePressureTime = 66.666;
        const arenaTileSize = 2400;
        const arenaRecenterStep = 400;
        let shardCount = 0;
        let shotCount = 0;
        let deathTimer = null;

        // Boss state. The HELLWARDEN arrives at 66.666s and again 66.666s after each kill,
        // escalating each time. Only one boss walks the arena at a time.
        const bossIntervalTime = 66.666;
        let bossNumber = 0;
        let nextBossTime = bossIntervalTime;
        let bossActive = false;
        let bossAnnounceTimer = null;

        // HUD elements, cached at init so the hot loop never queries the DOM.
        let timerEl, bossWrapEl, bossNameEl, bossFillEl, bossAnnounceEl;

        // Entities
        const projectiles = [];
        const enemies = [];
        const shards = [];
        const particles = [];
        const floorGlows = [];
        const shockwaves = []; // expanding boss slam rings — jump them or die
        const glowLightPool = []; // reusable PointLights for floor glows (bounded, no per-kill alloc)
        
        // Player Physics/Stats
        const playerSpeed = 35.0;
        const playerVelocity = new THREE.Vector3();
        const playerDirection = new THREE.Vector3();
        const friction = 10.0;
        const airFriction = 2.5;
        const gravity = 42.0;
        const jumpVelocity = 13.5;
        const playerEyeHeight = 2;
        let isGrounded = true;
        
        // Input state
        const keys = { w: false, a: false, s: false, d: false };
        let isShooting = false;
        let lastShotTime = 0;
        const baseFireRate = 80; // ms between shots

        // Audio Synths
        let shootSynth, enemyDeathSynth, spawnerDeathSynth, playerHitSynth, pickupSynth, bossSlamSynth, bossDeathSynth;
        let nextSynthStart = 0;
        const audioMix = {
            shotVolume: -29,
            shotVelocityMin: 0.1,
            shotVelocityRange: 0.16,
            deathVolume: -24,
            playerHitVolume: -14,
            enemyCueBufferGain: 0.58,
            enemyCueVolume: 1.0,
            enemyCueRefDistance: 14,
            enemyCueRolloff: 1.55,
            closePressureRefDistance: 5.5,
            closePressureRolloff: 0.85
        };

        function clamp01(value) {
            return Math.max(0, Math.min(1, value));
        }

        function smoothstep(value) {
            const t = clamp01(value);
            return t * t * (3 - 2 * t);
        }

        function setSpatialVolume(sound, value) {
            if (!sound) return;
            const volume = clamp01(value);
            sound.setVolume(volume);
            if (sound.gain && sound.gain.gain) sound.gain.gain.value = volume;
        }

        function nextSynthTime() {
            const now = Tone.now();
            // Space out triggers by 12ms, but never let the shared schedule run more than
            // 50ms ahead of real time, so a burst of SFX can't add creeping latency.
            nextSynthStart = Math.max(now, Math.min(nextSynthStart + 0.012, now + 0.05));
            return nextSynthStart;
        }

        function triggerSynth(synth, note, duration, velocity = null) {
            if (!synth) return;
            const time = nextSynthTime();
            if (velocity === null) synth.triggerAttackRelease(note, duration, time);
            else synth.triggerAttackRelease(note, duration, time, velocity);
        }

        function triggerNoise(synth, duration) {
            if (!synth) return;
            synth.triggerAttackRelease(duration, nextSynthTime());
        }

        function formatTime(value) {
            return value.toFixed(4);
        }

        function migrateLegacySaveData() {
            try {
                if (localStorage.getItem(bestTimeKey) === null) {
                    const rawOldBest = localStorage.getItem(legacyBestTimeKey);
                    if (rawOldBest !== null) {
                        // Normalize while migrating so the new key only ever holds a clean number.
                        const oldBest = Number(rawOldBest);
                        if (Number.isFinite(oldBest) && oldBest >= 0) localStorage.setItem(bestTimeKey, String(oldBest));
                    }
                }
                const savedBest = Number(localStorage.getItem(bestTimeKey));
                if (Number.isFinite(savedBest) && savedBest >= achievementTime && localStorage.getItem(achievementKey) === null) {
                    localStorage.setItem(achievementKey, '1');
                }
                localStorage.removeItem(legacyBestTimeKey);
                localStorage.removeItem(legacyDemonAchievementKey);
                localStorage.removeItem(legacyLowAchievementKey);
            } catch (error) {
                // Storage is optional; blocked storage should never prevent play.
            }
        }

        function readBestTime() {
            try {
                const stored = Number(localStorage.getItem(bestTimeKey));
                return Number.isFinite(stored) ? stored : 0;
            } catch (error) {
                return 0;
            }
        }

        function writeBestTime(value) {
            try {
                localStorage.setItem(bestTimeKey, String(value));
            } catch (error) {
                // Best time is nice to have; the game should still play without storage.
            }
        }

        function updateBestDisplays() {
            const bestText = formatTime(readBestTime());
            document.getElementById('start-best').innerText = bestText;
            document.getElementById('over-best').innerText = bestText;
        }

        function updateAchievementDisplays() {
            document.querySelectorAll('.achievement-target').forEach(element => {
                element.innerText = formatTime(achievementTime);
            });
        }

        function recordBestTime(value) {
            const previousBest = readBestTime();
            if (value > previousBest) {
                writeBestTime(value);
                return true;
            }
            return false;
        }

        function hasAchievement() {
            try {
                return localStorage.getItem(achievementKey) === '1';
            } catch (error) {
                return false;
            }
        }

        function recordAchievement(value) {
            if (value < achievementTime) return false;
            try {
                localStorage.setItem(achievementKey, '1');
            } catch (error) {
                // The badge is local-only; storage failure should not affect play.
            }
            return true;
        }

        function currentSpawnInterval() {
            if (gameTime < 20) return 2200;
            if (gameTime < 40) return 1650;
            if (gameTime < 60) return 1125;
            if (gameTime < 90) return 780;
            return Math.max(360, 780 - (gameTime - 90) * 10);
        }

        function currentSpawnDistance() {
            const pressure = Math.min(gameTime / spawnDistancePressureTime, 1);
            return 64 - pressure * 14 + Math.random() * (18 - pressure * 8);
        }

        function weaponStage() {
            if (shardCount >= 36) return 4;
            if (shardCount >= 22) return 3;
            if (shardCount >= 10) return 2;
            if (shardCount >= 4) return 1;
            return 0;
        }

        function currentFireRate() {
            const stage = weaponStage();
            return Math.max(52, baseFireRate - stage * 7);
        }

        function currentProjectileLife() {
            return 1.0 + Math.min(0.45, shardCount * 0.012);
        }

        function chooseEnemyType() {
            const activeSpawners = enemies.filter(e => e.type === 'spawner').length;
            const roll = Math.random();
            if (gameTime < 20) return 'chaser';
            if (gameTime < 40) {
                if (activeSpawners < 1 && roll < 0.18) return 'spawner';
                return 'chaser';
            }
            if (gameTime < 60) {
                if (activeSpawners < 2 && roll < 0.14) return 'spawner';
                return 'chaser';
            }
            if (gameTime < 90) {
                if (activeSpawners < 3 && roll < 0.18) return 'spawner';
                return 'chaser';
            }
            if (activeSpawners < 3 && roll < 0.18) return 'spawner';
            return 'chaser';
        }

        function initAudio() {
            // Rapid fire dagger sound
            shootSynth = new Tone.MembraneSynth({
                pitchDecay: 0.01,
                octaves: 2,
                oscillator: { type: "square" },
                envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 }
            }).toDestination();
            shootSynth.volume.value = audioMix.shotVolume;

            // Harsh crunch for enemy death
            enemyDeathSynth = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.005, decay: 0.12, sustain: 0 }
            });
            
            // Filter to make the death sound crunchy
            const filter = new Tone.Filter(800, "bandpass").toDestination();
            enemyDeathSynth.connect(filter);
            enemyDeathSynth.volume.value = audioMix.deathVolume;

            spawnerDeathSynth = new Tone.FMSynth({
                modulationIndex: 14,
                oscillator: { type: "sine" },
                modulation: { type: "square" },
                envelope: { attack: 0.005, decay: 0.6, sustain: 0, release: 0.2 }
            }).toDestination();
            spawnerDeathSynth.volume.value = -13;

            // Deep impact when player dies
            playerHitSynth = new Tone.FMSynth({
                modulationIndex: 10,
                oscillator: { type: "sine" },
                modulation: { type: "sawtooth" },
                envelope: { attack: 0.005, decay: 0.45, sustain: 0, release: 0.35 }
            }).toDestination();
            playerHitSynth.volume.value = audioMix.playerHitVolume;

            pickupSynth = new Tone.MembraneSynth({
                pitchDecay: 0.005,
                octaves: 1,
                oscillator: { type: "triangle" },
                envelope: { attack: 0.001, decay: 0.035, sustain: 0, release: 0.02 }
            }).toDestination();
            pickupSynth.volume.value = -24;

            // Room-shaking boom when the boss slams the floor
            bossSlamSynth = new Tone.MembraneSynth({
                pitchDecay: 0.08,
                octaves: 3,
                oscillator: { type: "sine" },
                envelope: { attack: 0.002, decay: 0.7, sustain: 0, release: 0.4 }
            }).toDestination();
            bossSlamSynth.volume.value = -7;

            // Long, grinding collapse when the boss finally dies
            bossDeathSynth = new Tone.FMSynth({
                modulationIndex: 18,
                oscillator: { type: "sine" },
                modulation: { type: "square" },
                envelope: { attack: 0.01, decay: 1.4, sustain: 0, release: 0.6 }
            }).toDestination();
            bossDeathSynth.volume.value = -9;

            Tone.start();

            // Initialize Three.js 3D Spatial Audio Listener
            if (!audioListener) {
                audioListener = new THREE.AudioListener();
                // We attach the ears directly to the camera (the player's head)
                if (camera) camera.add(audioListener);
                
                const audioCtx = THREE.AudioContext.getContext();
                enemyAudioBuffers = {
                    chaser: buildAudioBuffer(audioCtx, 0.45, t => {
                        const buzz = Math.sin(t * 240 * Math.PI * 2) * 0.45;
                        const grind = Math.sin(t * (96 + Math.sin(t * 19) * 22) * Math.PI * 2) * 0.35;
                        const gate = 0.45 + Math.sin(t * 27 * Math.PI * 2) * 0.35;
                        return (buzz + grind) * gate * audioMix.enemyCueBufferGain;
                    }),
                    spawner: buildAudioBuffer(audioCtx, 0.95, t => {
                        const breath = 0.56 + Math.sin(t * 1.15 * Math.PI * 2) * 0.12;
                        const body = Math.sin(t * 52 * Math.PI * 2) * 0.48 + Math.sin(t * 78 * Math.PI * 2) * 0.18;
                        return body * breath * 0.36;
                    }),
                    chaserClose: buildAudioBuffer(audioCtx, 0.32, t => {
                        const pulse = 0.58 + Math.sin(t * 11 * Math.PI * 2) * 0.34;
                        const chest = Math.sin(t * 78 * Math.PI * 2) * 0.62;
                        const teeth = Math.sin(t * 430 * Math.PI * 2) * 0.2;
                        return (chest + teeth) * pulse * 0.58;
                    }),
                    spawnerClose: buildAudioBuffer(audioCtx, 0.7, t => {
                        const breath = 0.48 + Math.sin(t * 1.4 * Math.PI * 2) * 0.12;
                        const sub = Math.sin(t * 42 * Math.PI * 2) * 0.45;
                        const rough = Math.sin(t * 96 * Math.PI * 2) * 0.14;
                        return (sub + rough) * breath;
                    }),
                    // The boss reads as a huge slow heartbeat — two sub thumps per cycle
                    // with a low grind underneath. Proximity + enrage speed it up.
                    boss: buildAudioBuffer(audioCtx, 1.15, t => {
                        const ph = t % 0.575;
                        const thump = Math.exp(-ph * 9);
                        const sub = Math.sin(t * 46 * Math.PI * 2) * thump * 0.85;
                        const grind = Math.sin(t * (30 + Math.sin(t * 5.2) * 6) * Math.PI * 2) * 0.16;
                        return (sub + grind) * 0.6;
                    }),
                    bossClose: buildAudioBuffer(audioCtx, 0.8, t => {
                        const breath = 0.5 + Math.sin(t * 1.25 * Math.PI * 2) * 0.14;
                        const sub = Math.sin(t * 34 * Math.PI * 2) * 0.55;
                        const rough = Math.sin(t * 68 * Math.PI * 2) * 0.18;
                        return (sub + rough) * breath;
                    }),
                    // Rising growl: the slam telegraph. Non-looping; played from the boss mesh
                    // so the warning itself is HRTF-localized on the sound stage.
                    bossRoar: buildAudioBuffer(audioCtx, 1.3, t => {
                        const p = Math.min(1, t / 1.3);
                        const f = 34 + p * 46;
                        const growl = Math.sin(t * f * Math.PI * 2) * (0.25 + p * 0.7);
                        const rasp = Math.sin(t * f * 2.03 * Math.PI * 2) * 0.28 * p;
                        const teeth = Math.sin(t * 415 * Math.PI * 2) * 0.06 * p;
                        return (growl + rasp + teeth) * 0.9;
                    })
                };
            }
        }

        function buildAudioBuffer(audioCtx, duration, sampler) {
            const length = Math.max(1, Math.floor(audioCtx.sampleRate * duration));
            const buffer = audioCtx.createBuffer(1, length, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            const fadeSamples = Math.max(1, Math.min(Math.floor(audioCtx.sampleRate * 0.012), Math.floor(length / 8)));
            for (let i = 0; i < length; i++) {
                const sample = sampler(i / audioCtx.sampleRate);
                const fadeIn = Math.min(1, i / fadeSamples);
                const fadeOut = Math.min(1, (length - 1 - i) / fadeSamples);
                data[i] = Math.max(-1, Math.min(1, sample * Math.min(fadeIn, fadeOut)));
            }
            return buffer;
        }

        function init() {
            const canvas = document.getElementById('game-canvas');
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(1); // Keep res low for retro feel

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050000); // Pitch black/very dark red
            scene.fog = new THREE.FogExp2(0x0a0000, 0.015); // Dense dark fog

            camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = playerEyeHeight; // Player height

            controls = new THREE.PointerLockControls(camera, document.body);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xff0000, 1, 50);
            camera.add(pointLight); // Light follows player
            scene.add(camera);

            // Reusable glow lights (see createFloorGlow). Kept in the scene, toggled on demand,
            // so kills reuse a fixed set instead of adding/removing a PointLight every time.
            for (let i = 0; i < 8; i++) {
                const glowLight = new THREE.PointLight(0xff2a00, 0, 14, 2.2);
                glowLight.visible = false;
                scene.add(glowLight);
                glowLightPool.push({ light: glowLight, inUse: false });
            }

            // Endless-looking arena tile. It recenters far outside the fog, so no edge is visible.
            infiniteArena = new THREE.Group();
            scene.add(infiniteArena);

            const floorGeo = new THREE.PlaneGeometry(arenaTileSize, arenaTileSize, 1, 1);
            const gridGeo = new THREE.PlaneGeometry(arenaTileSize, arenaTileSize, 240, 240);
            
            // Dark solid floor
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            infiniteArena.add(floor);

            // Dense reference grid that recenters with the player for an endless-floor feel.
            const gridMat = new THREE.MeshBasicMaterial({ color: 0x440000, wireframe: true, transparent: true, opacity: 0.34, fog: false });
            const grid = new THREE.Mesh(gridGeo, gridMat);
            grid.rotation.x = -Math.PI / 2;
            grid.renderOrder = 2;
            grid.position.y = 0.035;
            infiniteArena.add(grid);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            // Held keys are only cleared on keyup; a keyup delivered to another window while
            // a key is down would otherwise leave the player auto-walking on the next lock.
            window.addEventListener('blur', clearHeldInput);
            document.addEventListener('pointerlockerror', onPointerLockError);
            // If the GPU context is lost the canvas cannot render; forfeit rather than let the
            // timer keep counting and enemies keep spawning while the player is blind.
            canvas.addEventListener('webglcontextlost', onContextLost, false);

            // Cache HUD elements so per-frame updates never hit getElementById.
            timerEl = document.getElementById('timer-display');
            bossWrapEl = document.getElementById('boss-bar-wrap');
            bossNameEl = document.getElementById('boss-name-label');
            bossFillEl = document.getElementById('boss-fill');
            bossAnnounceEl = document.getElementById('boss-announce');

            // Setup UI Buttons
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('restart-btn').addEventListener('click', resetGame);

            controls.addEventListener('lock', function () {
                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.add('hidden');
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('timer-display').style.display = 'block';
                if(!isPlaying && !isGameOver) isPlaying = true;
            });

            controls.addEventListener('unlock', function () {
                // Leaving the arena mid-run forfeits. Pausing must not be usable to freeze
                // incoming threats (and the death check) and plan a risk-free escape.
                if (isPlaying) triggerGameOver();
            });
            migrateLegacySaveData();
            updateBestDisplays();
            updateAchievementDisplays();
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space':
                    event.preventDefault();
                    if (isPlaying && isGrounded) {
                        playerVelocity.y = jumpVelocity;
                        isGrounded = false;
                    }
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': event.preventDefault(); break;
            }
        }

        function onMouseDown(event) {
            if (controls.isLocked && event.button === 0) isShooting = true;
        }

        function onMouseUp(event) {
            if (event.button === 0) isShooting = false;
        }

        function clearHeldInput() {
            keys.w = keys.a = keys.s = keys.d = false;
            isShooting = false;
        }

        function onPointerLockError() {
            // Lock request failed (unsupported, or a browser cooldown). Don't leave the player
            // stuck on a hidden HUD with no way back in — restore the start screen.
            if (!controls.isLocked && !isGameOver) {
                isPlaying = false;
                document.getElementById('start-screen').classList.remove('hidden');
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';
            }
        }

        function onContextLost(event) {
            event.preventDefault(); // let Three.js restore the context on 'webglcontextrestored'
            if (isPlaying) triggerGameOver();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        const projGeometry = new THREE.BoxGeometry(0.1, 0.1, 1.8);
        const projMaterial = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const pierceProjMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });

        function fireWeapon() {
            const stage = weaponStage();
            const piercing = stage >= 4 && shotCount % 7 === 0;
            if (stage >= 2) {
                spawnProjectile(-0.2, piercing);
                spawnProjectile(0.2, piercing);
            } else {
                spawnProjectile(0, piercing);
            }
            shotCount++;
        }

        function spawnProjectile(sideOffset = 0, piercing = false) {
            const bullet = new THREE.Mesh(projGeometry, piercing ? pierceProjMaterial : projMaterial);
            
            // Start slightly below and to the right of center (like holding a dagger)
            bullet.position.copy(camera.position);
            bullet.position.y -= 0.2;
            
            // Get camera direction
            const direction = new THREE.Vector3();
            camera.getWorldDirection(direction);
            const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
            bullet.position.addScaledVector(right, sideOffset);
            
            bullet.quaternion.copy(camera.quaternion);
            
            // Keep rapid shots tactile without making aim feel muddy.
            const spread = weaponStage() >= 3 ? 0.018 : 0.025;
            direction.x += (Math.random() - 0.5) * spread;
            direction.y += (Math.random() - 0.5) * spread;
            direction.normalize();

            const flash = new THREE.Line(
                particleGeo.clone(),
                new THREE.LineBasicMaterial({ color: 0xffffdd, transparent: true, opacity: 0.8 })
            );
            flash.position.copy(bullet.position);
            scene.add(flash);
            particles.push({
                mesh: flash,
                dir: direction.clone(),
                speed: 18,
                life: 0.18,
                fadeRate: 7
            });

            scene.add(bullet);
            projectiles.push({
                mesh: bullet,
                velocity: direction.multiplyScalar(108 + weaponStage() * 4),
                life: currentProjectileLife(),
                pierce: piercing ? 2 : 0
            });

            if (shootSynth) {
                // Pitch variation for texture
                const velocity = audioMix.shotVelocityMin + Math.random() * audioMix.shotVelocityRange;
                triggerSynth(shootSynth, "C6", "32n", velocity);
            }
        }

        // Simple line particles for explosions
        const particleGeo = new THREE.BufferGeometry();
        particleGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0, 0,0,0]), 3));
        const floorGlowGeo = new THREE.CircleGeometry(1, 28);
        const floorGlowMat = new THREE.MeshBasicMaterial({
            color: 0xff4a00,
            transparent: true,
            opacity: 0.58,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            fog: false
        });

        function createExplosion(position, colorHex) {
            const count = 8;
            for(let i=0; i<count; i++) {
                const mat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true });
                const line = new THREE.Line(particleGeo.clone(), mat);
                line.position.copy(position);
                
                // Random outward direction
                const dir = new THREE.Vector3(
                    Math.random() - 0.5,
                    Math.random() - 0.5,
                    Math.random() - 0.5
                ).normalize();

                scene.add(line);
                particles.push({
                    mesh: line,
                    dir: dir,
                    speed: Math.random() * 20 + 10,
                    life: 1.0
                });
            }
        }

        function createFloorGlow(position, strength = 1) {
            const glow = new THREE.Mesh(floorGlowGeo, floorGlowMat.clone());
            glow.position.set(position.x, 0.055, position.z);
            glow.rotation.x = -Math.PI / 2;
            glow.rotation.z = Math.random() * Math.PI * 2;
            glow.scale.setScalar(2.0 + strength * 1.6);
            glow.renderOrder = 4;
            scene.add(glow);

            // Borrow a pooled light if one is free (bounded); the additive glow mesh carries the
            // effect regardless, so running out simply means this glow has no dynamic light.
            let poolEntry = null;
            for (let i = 0; i < glowLightPool.length; i++) {
                if (!glowLightPool[i].inUse) { poolEntry = glowLightPool[i]; break; }
            }
            let maxIntensity = 0;
            if (poolEntry) {
                poolEntry.inUse = true;
                const light = poolEntry.light;
                light.distance = 11 + strength * 3;
                light.intensity = 0.9 * strength;
                light.position.set(position.x, 1.0, position.z);
                light.visible = true;
                maxIntensity = light.intensity;
            }

            floorGlows.push({
                mesh: glow,
                poolEntry,
                baseScale: glow.scale.x,
                life: 1.35,
                maxLife: 1.35,
                maxOpacity: 0.34 + strength * 0.2,
                maxIntensity
            });

            const splinterCount = 5 + Math.floor(strength * 2);
            for (let i = 0; i < splinterCount; i++) {
                const length = 0.55 + Math.random() * 1.25;
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
                    -length, 0, 0,
                    length, 0, 0
                ]), 3));
                const line = new THREE.Line(
                    geometry,
                    new THREE.LineBasicMaterial({ color: 0xff4a00, transparent: true, opacity: 0.62 })
                );
                const radius = Math.random() * (1.15 + strength * 0.45);
                const angle = Math.random() * Math.PI * 2;
                line.position.set(
                    position.x + Math.cos(angle) * radius,
                    0.09,
                    position.z + Math.sin(angle) * radius
                );
                line.rotation.y = Math.random() * Math.PI * 2;
                line.renderOrder = 5;
                scene.add(line);
                particles.push({
                    mesh: line,
                    staticLine: true,
                    life: 0.85,
                    maxLife: 0.85,
                    maxOpacity: 0.62,
                    fadeRate: 1
                });
            }
        }

        // Low-poly enemies stay visually simple; sound carries the archetype read.
        const enemyGeo = new THREE.IcosahedronGeometry(1, 0);
        const chaserEyeGeo = new THREE.SphereGeometry(0.22, 8, 6);
        const chaserMawGeo = new THREE.BoxGeometry(0.7, 0.16, 0.08);
        const enemyMat = new THREE.MeshLambertMaterial({
            color: 0xff0000, 
            emissive: 0x550000,
            fog: false
        });
        const spawnerMat = new THREE.MeshLambertMaterial({
            color: 0x4b0015,
            emissive: 0x300012,
            fog: false
        });
        const bossMat = new THREE.MeshLambertMaterial({
            color: 0x8a0505,
            emissive: 0x4a0000,
            fog: false
        });
        const bossHornGeo = new THREE.ConeGeometry(0.16, 1.1, 5);
        const bossHornMat = new THREE.MeshLambertMaterial({ color: 0xd8c9a3, emissive: 0x241c0c, fog: false });
        const chaserEyeMat = new THREE.MeshBasicMaterial({ color: 0xfff1c8, transparent: true, opacity: 0.9, fog: false });
        const chaserMawMat = new THREE.MeshBasicMaterial({ color: 0x100000, fog: false });
        const shardGeo = new THREE.TetrahedronGeometry(0.32, 0);
        const shardMat = new THREE.MeshBasicMaterial({ color: 0xff2a00, transparent: true, opacity: 0.96, fog: false });

        function addEnemyPart(root, geometry, material, setup, role = 'detail') {
            const part = new THREE.Mesh(geometry, material.clone());
            part.userData.role = role;
            if (setup) setup(part);
            root.add(part);
            return part;
        }

        function decorateEnemy(enemy, type) {
            const visual = { eyes: [], glowParts: [enemy] };
            enemy.userData.visual = visual;

            if (type === 'boss') {
                // A crown of horns. Positions are in local space, so they scale with the body.
                [
                    { x: -0.52, z: -0.3, lean: 0.5 },
                    { x: 0.52, z: -0.3, lean: -0.5 },
                    { x: -0.3, z: 0.42, lean: 0.35 },
                    { x: 0.3, z: 0.42, lean: -0.35 }
                ].forEach(def => {
                    addEnemyPart(enemy, bossHornGeo, bossHornMat, part => {
                        part.position.set(def.x, 0.82, def.z);
                        part.rotation.z = def.lean;
                    }, 'horn');
                });
            }

            if (type === 'chaser' || type === 'spawner' || type === 'boss') {
                [
                    [-0.42, 0.24, -1.14],
                    [0.42, 0.24, -1.14],
                    [0, -0.25, -1.2],
                    [-0.42, 0.24, 1.14],
                    [0.42, 0.24, 1.14],
                    [0, -0.25, 1.2]
                ].forEach(pos => {
                    const eye = addEnemyPart(enemy, chaserEyeGeo, chaserEyeMat, part => {
                        part.position.set(pos[0], pos[1], pos[2]);
                    }, 'eye');
                    visual.eyes.push(eye);
                });

                addEnemyPart(enemy, chaserMawGeo, chaserMawMat, part => {
                    part.position.set(0, -0.42, -0.86);
                }, 'maw');
            }
        }

        function setEnemyGlow(root, intensity) {
            // Iterate the emissive-material list cached at spawn (see spawnEnemy) instead of
            // traversing + allocating a per-object array every frame.
            const mats = root.userData.emissiveMats;
            if (!mats) return;
            for (let i = 0; i < mats.length; i++) mats[i].emissiveIntensity = intensity;
        }

        function animateEnemyVisual(enemyRecord, pulse, nearThreat, audioPanic, delta, playerPos) {
            const root = enemyRecord.mesh;
            const visual = root.userData.visual;
            if (!visual) return;

            if (enemyRecord.type === 'chaser' || enemyRecord.type === 'spawner' || enemyRecord.type === 'boss') {
                // Spawners flare their eyes while charging an emit; the boss reuses the same
                // channel to flare during its slam telegraph.
                const emitCharge = enemyRecord.type === 'chaser' ? 0 : (enemyRecord.emitCharge || 0);
                root.lookAt(playerPos.x, root.position.y, playerPos.z);
                root.rotateZ(Math.sin(gameTime * 5.2 + enemyRecord.wobbleOffset) * (enemyRecord.type === 'boss' ? 0.05 : 0.16));
                visual.eyes.forEach((eye, index) => {
                    const eyeScale = 1 + nearThreat * 0.7 + pulse * 0.22 + emitCharge * 0.45 + index * 0.04;
                    eye.scale.setScalar(eyeScale);
                    eye.material.opacity = 0.72 + pulse * 0.22 + nearThreat * 0.06 + emitCharge * 0.14;
                });
            }
        }

        function disposeEnemyMaterials(root) {
            root.traverse(obj => {
                const mats = obj.material ? (Array.isArray(obj.material) ? obj.material : [obj.material]) : [];
                mats.forEach(mat => {
                    if (mat && mat.dispose) mat.dispose();
                });
            });
        }

        function enemyProfile(type) {
            if (type === 'boss') {
                return {
                    type,
                    geometry: enemyGeo,
                    material: bossMat,
                    y: 3.3,
                    scale: 3.4,
                    shape: { x: 1, y: 1, z: 1 },
                    health: 90 + 45 * (bossNumber - 1), // escalates each visit
                    hitRadius: 4.4,
                    speed: 3.0, // slow looming walker; enrage adds up to +2.6 as it takes damage
                    shards: 24 + 8 * bossNumber,
                    refDistance: 24,
                    rolloff: 1.05,
                    volume: 1,
                    nearVolume: 1,
                    pitchRise: 0.5,
                    warningRadius: 70,
                    nearRadius: 16,
                    hitColor: 0xff2222,
                    deathColor: 0xff7722
                };
            }
            if (type === 'spawner') {
                return {
                    type,
                    geometry: enemyGeo,
                    material: spawnerMat,
                    y: 1.8,
                    scale: 1.28,
                    shape: { x: 1, y: 1, z: 1 },
                    health: 5,
                    hitRadius: 2.2,
                    speed: 0,
                    shards: 10,
                    refDistance: 14,
                    rolloff: 1.55,
                    volume: 0.9,
                    nearVolume: 0.82,
                    pitchRise: 0.05,
                    warningRadius: 42,
                    nearRadius: 10,
                    hitColor: 0xff1545,
                    deathColor: 0xff1545
                };
            }
            return {
                type: 'chaser',
                geometry: enemyGeo,
                material: enemyMat,
                y: 1.55 + Math.random() * 0.85,
                scale: 0.8 + Math.random() * 0.6,
                shape: { x: 1, y: 1, z: 1 },
                health: 1,
                hitRadius: 1.5,
                speed: 7.5 + Math.min(gameTime, 90) * 0.075 + Math.random() * 3,
                shards: 3,
                refDistance: audioMix.enemyCueRefDistance,
                rolloff: audioMix.enemyCueRolloff,
                volume: audioMix.enemyCueVolume,
                nearVolume: 1,
                pitchRise: 0.46,
                warningRadius: 36,
                nearRadius: 11,
                hitColor: 0xff0000,
                deathColor: 0xff0000
            };
        }

        function spawnEnemy(type = chooseEnemyType(), origin = null) {
            const profile = enemyProfile(type);
            const enemy = new THREE.Mesh(profile.geometry, profile.material.clone());
            
            // Spawn in a circle around the player, outside immediate view
            const angle = Math.random() * Math.PI * 2;
            const distance = currentSpawnDistance();
            if (origin) {
                enemy.position.copy(origin);
                enemy.position.x += (Math.random() - 0.5) * 3;
                enemy.position.z += (Math.random() - 0.5) * 3;
            } else {
                enemy.position.x = camera.position.x + Math.cos(angle) * distance;
                enemy.position.z = camera.position.z + Math.sin(angle) * distance;
            }
            enemy.position.y = profile.y;

            const scale = profile.scale;
            const shape = profile.shape || { x: 1, y: 1, z: 1 };
            enemy.scale.set(scale * shape.x, scale * shape.y, scale * shape.z);
            enemy.material.emissiveIntensity = 0.7;
            decorateEnemy(enemy, profile.type);

            // Cache emissive materials once so setEnemyGlow doesn't traverse every frame.
            enemy.userData.emissiveMats = [];
            enemy.traverse(obj => {
                const mats = obj.material ? (Array.isArray(obj.material) ? obj.material : [obj.material]) : [];
                mats.forEach(mat => { if (mat.emissive) enemy.userData.emissiveMats.push(mat); });
            });

            // Add 3D Positional Audio to the enemy
            let sound = null;
            let nearSound = null;
            let roarSound = null;
            if (audioListener && enemyAudioBuffers && enemyAudioBuffers[profile.type]) {
                sound = new THREE.PositionalAudio(audioListener);
                sound.setBuffer(enemyAudioBuffers[profile.type]);
                sound.setRefDistance(profile.refDistance);
                sound.setRolloffFactor(profile.rolloff);
                sound.setDistanceModel('exponential');
                sound.panner.panningModel = 'HRTF'; // True 3D headphone panning
                sound.setLoop(true);
                setSpatialVolume(sound, profile.volume);
                enemy.add(sound); // Attach audio strictly to the visual mesh
                sound.play();

                const closeBuffer = enemyAudioBuffers[`${profile.type}Close`];
                if (closeBuffer) {
                    nearSound = new THREE.PositionalAudio(audioListener);
                    nearSound.setBuffer(closeBuffer);
                    nearSound.setRefDistance(audioMix.closePressureRefDistance);
                    nearSound.setRolloffFactor(audioMix.closePressureRolloff);
                    nearSound.setDistanceModel('exponential');
                    nearSound.panner.panningModel = 'HRTF';
                    nearSound.setLoop(true);
                    setSpatialVolume(nearSound, 0.001);
                    enemy.add(nearSound);
                    nearSound.play();
                }

                // The boss carries its slam telegraph on its own body so the roar itself
                // tells you where the shockwave will come from. Non-looping; replayed per slam.
                if (profile.type === 'boss' && enemyAudioBuffers.bossRoar) {
                    roarSound = new THREE.PositionalAudio(audioListener);
                    roarSound.setBuffer(enemyAudioBuffers.bossRoar);
                    roarSound.setRefDistance(26);
                    roarSound.setRolloffFactor(1.0);
                    roarSound.setDistanceModel('exponential');
                    roarSound.panner.panningModel = 'HRTF';
                    setSpatialVolume(roarSound, 0.95);
                    enemy.add(roarSound);
                }
            }

            scene.add(enemy);

            enemies.push({
                mesh: enemy,
                type: profile.type,
                sound: sound, // Store reference to kill the audio on death
                nearSound: nearSound,
                roarSound: roarSound,
                speed: profile.speed,
                health: profile.health,
                maxHealth: profile.health,
                bornAt: gameTime,
                enrage: 0,
                nextSlam: gameTime + 4.5, // boss only: first slam lands shortly after arrival
                telegraphUntil: 0,
                hitRadius: profile.hitRadius,
                shardDrop: profile.shards,
                hitColor: profile.hitColor,
                deathColor: profile.deathColor,
                cueVolume: profile.volume,
                nearVolume: profile.nearVolume,
                warningRadius: profile.warningRadius,
                nearRadius: profile.nearRadius,
                baseScale: scale,
                shape: shape,
                baseY: profile.y,
                pitchBase: 1,
                pitchRise: profile.pitchRise,
                nextEmit: gameTime + 2.5 + Math.random() * 1.5,
                emitInterval: 3.6 + Math.random() * 0.9,
                emitCharge: 0,
                wobbleSpeed: Math.random() * 5 + 2,
                wobbleOffset: Math.random() * Math.PI * 2
            });

        }

        function spawnShards(position, count) {
            createFloorGlow(position, Math.min(1.45, 0.72 + count * 0.045));
            for (let i = 0; i < count; i++) {
                const shard = new THREE.Mesh(shardGeo, shardMat.clone());
                shard.position.copy(position);
                shard.position.x += (Math.random() - 0.5) * 1.8;
                shard.position.z += (Math.random() - 0.5) * 1.8;
                shard.position.y = Math.max(1.2, position.y);
                const baseScale = 0.95 + Math.random() * 0.3;
                shard.scale.setScalar(baseScale);
                scene.add(shard);
                shards.push({
                    mesh: shard,
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 6,
                        3.8 + Math.random() * 4.2,
                        (Math.random() - 0.5) * 6
                    ),
                    restY: 1.0 + Math.random() * 0.16,
                    phase: Math.random() * Math.PI * 2,
                    baseScale,
                    landed: false,
                    landPulse: 0,
                    life: 8
                });
            }
        }

        function collectShard(index) {
            const shard = shards[index];
            scene.remove(shard.mesh);
            shard.mesh.material.dispose(); // shardGeo is shared; dispose only the per-shard cloned material
            shards.splice(index, 1);
            shardCount++;
            triggerSynth(pickupSynth, "C7", "64n");
        }

        function updateInfiniteArena() {
            if (!infiniteArena || !camera) return;
            infiniteArena.position.x = Math.round(camera.position.x / arenaRecenterStep) * arenaRecenterStep;
            infiniteArena.position.z = Math.round(camera.position.z / arenaRecenterStep) * arenaRecenterStep;
        }

        function killEnemy(enemy, index) {
            const position = enemy.mesh.position.clone();
            createExplosion(position, enemy.deathColor || 0xff0000);
            spawnShards(position, enemy.shardDrop);
            if (enemy.type === 'boss') {
                // The fall of a HELLWARDEN: a second burst, a long collapse, and the arena resets
                // its clock — the next one arrives 66.666s from now.
                createExplosion(position, 0xffcc55);
                triggerSynth(bossDeathSynth, "C1", "1n");
                bossActive = false;
                nextBossTime = gameTime + bossIntervalTime;
                if (bossWrapEl) bossWrapEl.style.display = 'none';
            } else if (enemy.type === 'spawner') triggerSynth(spawnerDeathSynth, "C1", "4n");
            else triggerNoise(enemyDeathSynth, "16n");
            if (enemy.sound && enemy.sound.isPlaying) enemy.sound.stop();
            if (enemy.nearSound && enemy.nearSound.isPlaying) enemy.nearSound.stop();
            if (enemy.roarSound && enemy.roarSound.isPlaying) enemy.roarSound.stop();
            scene.remove(enemy.mesh);
            disposeEnemyMaterials(enemy.mesh);
            enemies.splice(index, 1);
        }

        // --- Boss shockwaves -------------------------------------------------------------
        // The slam sends a glowing ring outward along the floor. Grounded when it crosses
        // you = death; jump it. It also shreds any lesser enemy it touches, so a well-baited
        // slam can clear the crowd.
        const shockwaveGeo = new THREE.RingGeometry(0.88, 1, 64);

        function spawnShockwave(position) {
            const mat = new THREE.MeshBasicMaterial({
                color: 0xff3a00,
                transparent: true,
                opacity: 0.85,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending,
                fog: false
            });
            const mesh = new THREE.Mesh(shockwaveGeo, mat);
            mesh.rotation.x = -Math.PI / 2;
            mesh.position.set(position.x, 0.08, position.z);
            mesh.renderOrder = 5;
            mesh.scale.setScalar(0.1);
            scene.add(mesh);
            shockwaves.push({ mesh, x: position.x, z: position.z, radius: 0.1, speed: 13, maxRadius: 30 });
            triggerSynth(bossSlamSynth, "C1", "2n");
            createFloorGlow(position, 1.8);
        }

        function updateShockwaves(delta) {
            for (let i = shockwaves.length - 1; i >= 0; i--) {
                const w = shockwaves[i];
                w.radius += w.speed * delta;
                // Prune BEFORE the kill checks: the ring must never test collision at a
                // radius the player never saw rendered.
                if (w.radius >= w.maxRadius) {
                    scene.remove(w.mesh);
                    w.mesh.material.dispose(); // shockwaveGeo is shared; only the material is per-ring
                    shockwaves.splice(i, 1);
                    continue;
                }
                w.mesh.scale.setScalar(w.radius);
                // Stay bright the whole time it is lethal; fade only over the final 15%.
                w.mesh.material.opacity = 0.85 * Math.min(1, (w.maxRadius - w.radius) / (w.maxRadius * 0.15));

                // Player: the ring only bites ankles. Airborne = safe.
                const dx = camera.position.x - w.x;
                const dz = camera.position.z - w.z;
                const playerDist = Math.sqrt(dx * dx + dz * dz);
                if (isGrounded && Math.abs(playerDist - w.radius) < 1.15) {
                    triggerGameOver();
                    return;
                }

                // Lesser enemies caught by the ring are destroyed (the boss is immune).
                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (e.type === 'boss') continue;
                    const ex = e.mesh.position.x - w.x;
                    const ez = e.mesh.position.z - w.z;
                    const enemyDist = Math.sqrt(ex * ex + ez * ez);
                    if (Math.abs(enemyDist - w.radius) < 1.3) killEnemy(e, j);
                }
            }
        }

        function romanNumeral(n) {
            const steps = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
            let out = '';
            for (let i = 0; i < steps.length; i++) {
                while (n >= steps[i][0]) { out += steps[i][1]; n -= steps[i][0]; }
            }
            return out || 'I';
        }

        function spawnBoss() {
            bossNumber++;
            bossActive = true;
            spawnEnemy('boss');
            const title = 'HELLWARDEN ' + romanNumeral(bossNumber);
            if (bossNameEl) bossNameEl.textContent = title;
            if (bossFillEl) bossFillEl.style.width = '100%';
            if (bossWrapEl) bossWrapEl.style.display = 'block';
            if (bossAnnounceEl) {
                bossAnnounceEl.firstChild.textContent = title;
                bossAnnounceEl.classList.add('show');
                if (bossAnnounceTimer) clearTimeout(bossAnnounceTimer);
                bossAnnounceTimer = setTimeout(() => {
                    bossAnnounceEl.classList.remove('show');
                    bossAnnounceTimer = null;
                }, 2600);
            }
        }

        function updatePhysics(delta) {
            // Apply friction
            const activeFriction = isGrounded ? friction : airFriction;
            playerVelocity.x -= playerVelocity.x * activeFriction * delta;
            playerVelocity.z -= playerVelocity.z * activeFriction * delta;

            playerDirection.z = Number(keys.w) - Number(keys.s);
            playerDirection.x = Number(keys.d) - Number(keys.a);
            playerDirection.normalize();

            // Apply movement based on camera orientation
            const control = isGrounded ? playerSpeed : playerSpeed * 0.82;
            if (keys.w || keys.s) playerVelocity.z -= playerDirection.z * control * delta;
            if (keys.a || keys.d) playerVelocity.x -= playerDirection.x * control * delta;

            controls.moveRight(-playerVelocity.x * delta);
            controls.moveForward(-playerVelocity.z * delta);

            if (!isGrounded) {
                playerVelocity.y -= gravity * delta;
                camera.position.y += playerVelocity.y * delta;
                if (camera.position.y <= playerEyeHeight) {
                    camera.position.y = playerEyeHeight;
                    playerVelocity.y = 0;
                    isGrounded = true;
                }
            }

            updateInfiniteArena();
        }

        function updateProjectiles(delta) {
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.velocity, delta);
                p.life -= delta;

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    projectiles.splice(i, 1);
                }
            }
        }

        // Reusable scratch vectors so the per-frame enemy loop allocates nothing.
        const _cameraForward = new THREE.Vector3();
        const _toEnemyFlat = new THREE.Vector3();
        const _dir = new THREE.Vector3();

        function updateEnemies(delta) {
            const playerPos = camera.position;
            camera.getWorldDirection(_cameraForward);
            _cameraForward.y = 0;
            _cameraForward.normalize();

            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                let distanceToPlayer = e.mesh.position.distanceTo(playerPos);
                const warningStart = Math.max(e.hitRadius + 1, e.warningRadius);
                const threat = smoothstep(1 - (distanceToPlayer - e.hitRadius) / (warningStart - e.hitRadius));
                const nearThreat = smoothstep(1 - (distanceToPlayer - e.hitRadius) / (e.nearRadius - e.hitRadius));
                const contactThreat = Math.pow(smoothstep(1 - (distanceToPlayer - e.hitRadius) / (5.5 - e.hitRadius)), 1.35);
                _toEnemyFlat.copy(e.mesh.position).sub(playerPos);
                _toEnemyFlat.y = 0;
                if (_toEnemyFlat.lengthSq() > 0.0001) _toEnemyFlat.normalize();
                const rearThreat = clamp01(-_cameraForward.dot(_toEnemyFlat)) * nearThreat;
                const audioPanic = clamp01(contactThreat + rearThreat * 0.45);
                 
                const dir = _dir.subVectors(playerPos, e.mesh.position);
                if (e.type === 'chaser') dir.y *= 0.15;
                dir.normalize();
                if (e.type === 'spawner') {
                    const timeToEmit = e.nextEmit - gameTime;
                    e.emitCharge = smoothstep(1 - Math.max(0, timeToEmit) / 0.9);
                    e.mesh.position.y = e.baseY + Math.sin(gameTime * 2 + e.wobbleOffset) * 0.35;
                    if (gameTime >= e.nextEmit) {
                        spawnEnemy('chaser', e.mesh.position);
                        // Spawner output thins during boss fights too, matching the ambient
                        // spawn multiplier, so the fight actually stays readable late-game.
                        e.nextEmit = gameTime + Math.max(2.1, e.emitInterval - gameTime * 0.01) * (bossActive ? 1.7 : 1);
                        e.emitCharge = 0;
                    }
                } else if (e.type === 'boss') {
                    // Enrage builds from damage taken AND from time alive: an ignored
                    // HELLWARDEN keeps getting faster until it outruns the player, so
                    // kiting it forever is never the right play. Fully enraged ~75s in.
                    const enrage = Math.max(1 - e.health / e.maxHealth, Math.min(1, (gameTime - e.bornAt) / 75));
                    e.enrage = enrage;
                    dir.y = 0;
                    if (dir.lengthSq() > 0.0001) dir.normalize();
                    e.mesh.position.addScaledVector(dir, (e.speed + enrage * 2.6) * delta);

                    // Slam cycle: roar (telegraph, eyes flare) -> floor shockwave. Jump it.
                    if (e.telegraphUntil === 0 && gameTime >= e.nextSlam) {
                        e.telegraphUntil = gameTime + 1.35;
                        if (e.roarSound) {
                            if (e.roarSound.isPlaying) e.roarSound.stop();
                            e.roarSound.play();
                        }
                    }
                    if (e.telegraphUntil > 0) {
                        e.emitCharge = smoothstep(1 - (e.telegraphUntil - gameTime) / 1.35);
                        if (gameTime >= e.telegraphUntil) {
                            e.telegraphUntil = 0;
                            e.emitCharge = 0;
                            e.nextSlam = gameTime + 6.5 - Math.min(2.5, enrage * 3) + Math.random() * 1.5;
                            spawnShockwave(e.mesh.position);
                        }
                    }
                    if (bossFillEl) bossFillEl.style.width = Math.max(0, (e.health / e.maxHealth) * 100) + '%';
                } else {
                    e.mesh.position.addScaledVector(dir, e.speed * delta);
                }
                 
                if (e.type !== 'spawner') {
                    e.mesh.position.y = e.baseY + Math.sin(gameTime * e.wobbleSpeed + e.wobbleOffset) * 0.06;
                }
                const pulse = Math.sin(gameTime * 14 + e.wobbleOffset) * 0.5 + 0.5;
                const scale = e.baseScale * (1 + nearThreat * 0.22 + audioPanic * 0.18 + pulse * 0.05);
                e.mesh.scale.set(scale * e.shape.x, scale * e.shape.y, scale * e.shape.z);
                setEnemyGlow(e.mesh, 0.55 + nearThreat * 1.2 + audioPanic * 1.15 + pulse * 0.25);
                animateEnemyVisual(e, pulse, nearThreat, audioPanic, delta, playerPos);
                if (e.sound) {
                    // The boss heartbeat never drops below half volume while it walks:
                    // it must always be trackable on the sound stage.
                    const volumeFloor = e.type === 'boss' ? 0.5 : 0.18;
                    const farVolume = clamp01(volumeFloor + threat * 0.42 + nearThreat * 0.28 + rearThreat * 0.28);
                    setSpatialVolume(e.sound, e.cueVolume * farVolume);
                    if (e.sound.source && e.sound.source.playbackRate) {
                        let rate = e.pitchBase + threat * e.pitchRise * 0.45 + audioPanic * e.pitchRise * 0.85;
                        // Enrage (damage or time alive) quickens the boss heartbeat — the
                        // rising pulse is itself the warning that it's getting faster.
                        if (e.type === 'boss') rate += (e.enrage || 0) * 0.45;
                        e.sound.source.playbackRate.value = rate;
                    }
                }
                if (e.nearSound) {
                    const nearVolume = clamp01(Math.pow(nearThreat, 1.65) * 0.72 + audioPanic * 0.55);
                    setSpatialVolume(e.nearSound, e.nearVolume * nearVolume);
                    if (e.nearSound.source && e.nearSound.source.playbackRate) {
                        e.nearSound.source.playbackRate.value = 0.78 + nearThreat * 0.5 + audioPanic * 0.5;
                    }
                }

                // Check collision with player (Death)
                distanceToPlayer = e.mesh.position.distanceTo(playerPos);
                if (distanceToPlayer < e.hitRadius) {
                    triggerGameOver();
                    return; // Stop processing to avoid errors after death
                }

                // Check collision with projectiles (squared distance avoids a sqrt per test)
                const hitRadiusSq = e.hitRadius * e.hitRadius;
                for (let j = projectiles.length - 1; j >= 0; j--) {
                    const p = projectiles[j];
                    if (e.mesh.position.distanceToSquared(p.mesh.position) < hitRadiusSq) {
                        e.health--;
                        // The boss soaks dozens of hits per second; sparking on every 4th
                        // keeps the feedback without drowning the frame in particles.
                        if (e.type !== 'boss' || e.health % 4 === 0) {
                            createExplosion(p.mesh.position, e.hitColor || 0xff0000);
                        }
                        if (e.health <= 0) {
                            killEnemy(e, i);
                        }

                        if (p.pierce > 0) {
                            p.pierce--;
                        } else {
                            scene.remove(p.mesh);
                            projectiles.splice(j, 1);
                        }
                        break;
                    }
                }
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= delta * (p.fadeRate || 2); // fade fast
                
                if (!p.staticLine) {
                    // Expand the line
                    const positions = p.mesh.geometry.attributes.position.array;
                    positions[3] += p.dir.x * p.speed * delta;
                    positions[4] += p.dir.y * p.speed * delta;
                    positions[5] += p.dir.z * p.speed * delta;
                    p.mesh.geometry.attributes.position.needsUpdate = true;
                }
                 
                const maxLife = p.maxLife || 1;
                const maxOpacity = p.maxOpacity === undefined ? 1 : p.maxOpacity;
                p.mesh.material.opacity = Math.max(0, Math.min(maxOpacity, maxOpacity * (p.life / maxLife)));

                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    // Each particle owns a unique cloned/fresh geometry + material; free the GPU handles.
                    p.mesh.geometry.dispose();
                    p.mesh.material.dispose();
                    particles.splice(i, 1);
                }
            }
        }

        function releaseGlowLight(poolEntry) {
            if (!poolEntry) return;
            poolEntry.light.visible = false;
            poolEntry.light.intensity = 0;
            poolEntry.inUse = false;
        }

        function updateFloorGlows(delta) {
            for (let i = floorGlows.length - 1; i >= 0; i--) {
                const glow = floorGlows[i];
                glow.life -= delta;
                const t = Math.max(0, glow.life / glow.maxLife);
                glow.mesh.material.opacity = glow.maxOpacity * t;
                glow.mesh.scale.setScalar(glow.baseScale * (1 + (1 - t) * 0.55));
                if (glow.poolEntry) glow.poolEntry.light.intensity = glow.maxIntensity * t * t;
                if (glow.life <= 0) {
                    scene.remove(glow.mesh);
                    glow.mesh.material.dispose();
                    releaseGlowLight(glow.poolEntry);
                    floorGlows.splice(i, 1);
                }
            }
        }

        function updateShards(delta) {
            for (let i = shards.length - 1; i >= 0; i--) {
                const shard = shards[i];
                shard.life -= delta;
                shard.velocity.y -= 22 * delta;
                shard.mesh.position.addScaledVector(shard.velocity, delta);
                shard.mesh.rotation.x += delta * 8;
                shard.mesh.rotation.y += delta * 11;
                const restY = shard.restY || 0.7;
                const fallingIntoFloor = shard.velocity.y < -0.45;
                if (shard.mesh.position.y < restY) {
                    shard.mesh.position.y = restY;
                    if (!shard.landed && fallingIntoFloor) {
                        shard.landed = true;
                        shard.landPulse = 0.28;
                    }
                    shard.velocity.y *= -0.22;
                    shard.velocity.x *= 0.82;
                    shard.velocity.z *= 0.82;
                }
                if (Math.abs(shard.velocity.y) < 0.18 && Math.abs(shard.velocity.x) < 0.45 && Math.abs(shard.velocity.z) < 0.45) {
                    shard.mesh.position.y = restY + Math.sin(gameTime * 8 + shard.phase) * 0.06;
                }
                if (shard.landPulse > 0) {
                    shard.landPulse = Math.max(0, shard.landPulse - delta);
                    const pulse = shard.landPulse / 0.28;
                    shard.mesh.scale.setScalar(shard.baseScale * (1 + pulse * 0.32));
                } else {
                    shard.mesh.scale.setScalar(shard.baseScale);
                }

                const distance = shard.mesh.position.distanceTo(camera.position);
                if (distance < 2.35) {
                    collectShard(i);
                    continue;
                }

                const fade = shard.life < 1.25 ? shard.life / 1.25 : 1;
                shard.mesh.material.opacity = Math.max(0, Math.min(0.96, 0.96 * fade));
                if (shard.life <= 0) {
                    scene.remove(shard.mesh);
                    shard.mesh.material.dispose();
                    shards.splice(i, 1);
                }
            }
        }

        function stopRunAudio() {
            if (shootSynth && shootSynth.triggerRelease) shootSynth.triggerRelease();
            if (enemyDeathSynth && enemyDeathSynth.triggerRelease) enemyDeathSynth.triggerRelease();
            if (spawnerDeathSynth && spawnerDeathSynth.triggerRelease) spawnerDeathSynth.triggerRelease();
            if (pickupSynth && pickupSynth.triggerRelease) pickupSynth.triggerRelease();
            if (bossSlamSynth && bossSlamSynth.triggerRelease) bossSlamSynth.triggerRelease();
            if (bossDeathSynth && bossDeathSynth.triggerRelease) bossDeathSynth.triggerRelease();
            enemies.forEach(e => {
                if (e.sound && e.sound.isPlaying) e.sound.stop();
                if (e.nearSound && e.nearSound.isPlaying) e.nearSound.stop();
                if (e.roarSound && e.roarSound.isPlaying) e.roarSound.stop();
            });
        }

        function clearActiveRun() {
            enemies.forEach(e => {
                scene.remove(e.mesh);
                disposeEnemyMaterials(e.mesh);
            });
            // Projectiles share projGeometry + projMaterial/pierceProjMaterial, so never dispose those.
            projectiles.forEach(p => scene.remove(p.mesh));
            shards.forEach(s => {
                scene.remove(s.mesh);
                s.mesh.material.dispose(); // shardGeo is shared; only the cloned material is per-shard
            });
            particles.forEach(p => {
                scene.remove(p.mesh);
                p.mesh.geometry.dispose(); // every particle geometry is a clone or a fresh BufferGeometry
                p.mesh.material.dispose();
            });
            floorGlows.forEach(g => {
                scene.remove(g.mesh);
                if (g.mesh.material && g.mesh.material.dispose) g.mesh.material.dispose();
                releaseGlowLight(g.poolEntry);
            });
            shockwaves.forEach(w => {
                scene.remove(w.mesh);
                w.mesh.material.dispose(); // shockwaveGeo is shared; only the material is per-ring
            });

            enemies.length = 0;
            projectiles.length = 0;
            shards.length = 0;
            particles.length = 0;
            floorGlows.length = 0;
            shockwaves.length = 0;

            bossActive = false;
            if (bossWrapEl) bossWrapEl.style.display = 'none';
            if (bossAnnounceEl) bossAnnounceEl.classList.remove('show');
            if (bossAnnounceTimer) {
                clearTimeout(bossAnnounceTimer);
                bossAnnounceTimer = null;
            }
        }

        function triggerGameOver() {
            if (isGameOver) return;
            const finalTime = gameTime;
            const previousBest = readBestTime();
            const isNewBest = recordBestTime(finalTime);
            const gotAchievement = recordAchievement(finalTime) || hasAchievement();
            isGameOver = true;
            isPlaying = false;
            isShooting = false;
            Object.keys(keys).forEach(key => { keys[key] = false; });
            stopRunAudio();
            document.body.classList.add('death-hit');
             
            triggerSynth(playerHitSynth, "C1", "8n");

            if (deathTimer) clearTimeout(deathTimer);
            deathTimer = setTimeout(() => {
                clearActiveRun();
                scene.background = new THREE.Color(0x050000);
                document.body.classList.remove('death-hit');
                controls.unlock();

                document.getElementById('start-screen').classList.add('hidden');
                document.getElementById('crosshair').style.display = 'none';
                document.getElementById('timer-display').style.display = 'none';

                const gameOverScreen = document.getElementById('game-over-screen');
                gameOverScreen.classList.remove('hidden');
                document.getElementById('final-time').innerText = formatTime(finalTime);
                document.getElementById('new-best').classList.toggle('hidden', !isNewBest);
                document.getElementById('achievement-line').classList.toggle('hidden', !gotAchievement);
                const delta = previousBest > 0 ? finalTime - previousBest : 0;
                const sign = delta >= 0 ? '+' : '-';
                document.getElementById('delta-time').innerText = previousBest > 0 ? `Delta ${sign}${formatTime(Math.abs(delta))}` : 'Delta 0.0000';
                updateBestDisplays();
                deathTimer = null;
            }, 150);
        }

        function isLikelyUnsupported() {
            // This is a pointer-lock + mouse-look + WASD game. Touch devices and browsers
            // without the Pointer Lock API (e.g. iOS Safari) cannot play it.
            const noPointerLock = typeof document.body.requestPointerLock !== 'function';
            const coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            return noPointerLock || coarsePointer;
        }

        function showUnsupportedMessage() {
            const note = document.getElementById('desktop-note');
            if (note) note.classList.remove('hidden');
            const btn = document.getElementById('start-btn');
            if (btn) btn.textContent = 'Desktop Only';
        }

        function startGame() {
            if (isLikelyUnsupported()) { showUnsupportedMessage(); return; }
            if(!shootSynth) initAudio(); // init on first user interaction
            lastTime = performance.now();
            lastSpawnTime = lastTime; // start the spawn clock fresh on every run
            try {
                controls.lock();
            } catch (err) {
                // Older/mobile browsers can throw synchronously from requestPointerLock.
                showUnsupportedMessage();
            }
        }

        function resetGame() {
            // Clean up scene
            if (deathTimer) {
                clearTimeout(deathTimer);
                deathTimer = null;
            }
            stopRunAudio();
            if (playerHitSynth && playerHitSynth.triggerRelease) playerHitSynth.triggerRelease();
            clearActiveRun();
            document.body.classList.remove('death-hit');
             
            camera.position.set(0, playerEyeHeight, 0);
            updateInfiniteArena();
            playerVelocity.set(0,0,0);
            scene.background = new THREE.Color(0x050000);
             
            isGameOver = false;
            isGrounded = true;
            isShooting = false;
            gameTime = 0;
            shardCount = 0;
            shotCount = 0;
            bossNumber = 0;
            nextBossTime = bossIntervalTime;
            lastSpawnTime = performance.now();
            lastShotTime = 0;
            lastTime = performance.now();
             
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('new-best').classList.add('hidden');
            document.getElementById('achievement-line').classList.add('hidden');
            startGame();
            // isPlaying is set by the pointer-lock 'lock' handler once the lock is confirmed,
            // matching startGame(); do not force it true here or a failed lock leaves us
            // "playing" with the HUD hidden and no control.
        }

        function animate() {
            requestAnimationFrame(animate);

            const timeNow = performance.now();
            // Clamp the frame delta: a GC pause or hitch must not tunnel a lunging enemy
            // straight through the player's hit test or blow up the friction integration.
            const delta = Math.min((timeNow - lastTime) / 1000, 0.05);
            lastTime = timeNow;

            if (isPlaying) {
                gameTime += delta;
                timerEl.innerText = gameTime.toFixed(4);

                // The HELLWARDEN arrives on schedule — but only one at a time.
                if (!bossActive && gameTime >= nextBossTime) spawnBoss();

                // Handle Spawning - ramp up difficulty over time. Trash thins out while a
                // boss walks so the fight stays readable.
                const spawnRate = currentSpawnInterval() * (bossActive ? 1.7 : 1);
                if (timeNow - lastSpawnTime > spawnRate) {
                    spawnEnemy(); // type defaults to chooseEnemyType()
                    lastSpawnTime = timeNow;
                }

                // Handle Shooting
                if (isShooting && timeNow - lastShotTime > currentFireRate()) {
                    fireWeapon();
                    lastShotTime = timeNow;
                }

                updatePhysics(delta);
                updateProjectiles(delta);
                updateEnemies(delta);
                updateShockwaves(delta);
                updateShards(delta);
                updateFloorGlows(delta);
                updateParticles(delta);
            } else if (controls.isLocked && !isGameOver) {
                 // edge case: locked but not playing (right at start)
                 isPlaying = true;
            }

            // Slight camera bob for atmosphere even when still
            if(isPlaying && isGrounded) {
                 camera.position.y = playerEyeHeight + Math.sin(timeNow * 0.003) * 0.05;
            }

            renderer.render(scene, camera);
        }

        // Boot up
        window.onload = function() {
            init();
            animate();
        };
    </script>
</body>
</html>
