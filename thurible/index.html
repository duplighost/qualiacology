<script>
(function(){
/* ===== a-core.js ===== */
/* ============================================================
   THURIBLE — a one-thumb liturgy
   core: math, buffers, floor bake, lighting, post-process
   ============================================================ */
'use strict';

const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
const sstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* deterministic RNG so the floor bakes identically every time */
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- the ember ramp: the whole game's colour language ----------
   0 = dead coal, 1 = white-hot. Everything that burns samples this. */
const EMBER = [
  [0.00, 86, 26, 12],
  [0.16, 150, 46, 16],
  [0.34, 220, 88, 22],
  [0.52, 255, 128, 34],
  [0.70, 255, 178, 72],
  [0.86, 255, 226, 150],
  [1.00, 255, 250, 232]
];
function ember(t) {
  t = clamp(t, 0, 1);
  for (let i = 1; i < EMBER.length; i++) {
    if (t <= EMBER[i][0]) {
      const a = EMBER[i - 1], b = EMBER[i];
      const f = (t - a[0]) / (b[0] - a[0]);
      return [Math.round(lerp(a[1], b[1], f)), Math.round(lerp(a[2], b[2], f)), Math.round(lerp(a[3], b[3], f))];
    }
  }
  return [255, 250, 232];
}
const emberCss = (t, a) => { const c = ember(t); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')'; };
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';

/* ---------- canvases ---------- */
const view = document.getElementById('view');
let W = 0, H = 0, DPR = 1, unit = 1, PW = 0, PH = 0;

function mkbuf(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  return c;
}
/* a buffer that you draw into using CSS pixels, at an arbitrary internal scale */
function Layer(scale, alpha) {
  return {
    scale, alpha: alpha !== false, c: null, x: null,
    fit() {
      this.c = mkbuf(W * this.scale * DPR, H * this.scale * DPR);
      this.x = this.c.getContext('2d', { alpha: this.alpha, willReadFrequently: false });
      this.reset();
    },
    reset() { this.x.setTransform(this.scale * DPR, 0, 0, this.scale * DPR, 0, 0); },
    clear() { this.x.setTransform(1, 0, 0, 1, 0, 0); this.x.clearRect(0, 0, this.c.width, this.c.height); this.reset(); },
    fill(col) {
      this.x.setTransform(1, 0, 0, 1, 0, 0);
      this.x.globalCompositeOperation = 'copy'; this.x.fillStyle = col;
      this.x.fillRect(0, 0, this.c.width, this.c.height);
      this.x.globalCompositeOperation = 'source-over'; this.reset();
    }
  };
}

const SCENE = Layer(1, false);
const FLOOR = Layer(1, false);   // baked stone, "fully lit" colours
const DECAL = Layer(1);          // scorch, soot, spilled coal — persists across a run
const LIT = Layer(1, false);     // scratch: floor × light
const LIGHT = Layer(0.5, false); // additive light accumulation
const SPILL = Layer(0.5);        // the light itself, no ambient
let SMOKE_A = Layer(0.5), SMOKE_B = Layer(0.5); // ping-pong advected incense
const SMOKE_LIT = Layer(0.5);
const HALO = Layer(0.28);        // the trail's outer glow, blurred by being small

let ctx = null; // SCENE context, the one every draw call uses

/* ---------- soft radial sprite, reused everywhere ---------- */
function radial(size, stops) {
  const c = mkbuf(size, size), x = c.getContext('2d');
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const s of stops) g.addColorStop(s[0], s[1]);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return c;
}
const GLOW = radial(160, [
  [0, 'rgba(255,255,255,1)'], [0.11, 'rgba(255,255,255,0.86)'],
  [0.26, 'rgba(255,255,255,0.44)'], [0.48, 'rgba(255,255,255,0.15)'],
  [0.74, 'rgba(255,255,255,0.035)'], [1, 'rgba(255,255,255,0)']
]);
const SOFT = radial(128, [
  [0, 'rgba(255,255,255,0.85)'], [0.35, 'rgba(255,255,255,0.42)'],
  [0.68, 'rgba(255,255,255,0.11)'], [1, 'rgba(255,255,255,0)']
]);
const PUFF = radial(128, [
  [0, 'rgba(255,255,255,0.62)'], [0.28, 'rgba(255,255,255,0.40)'],
  [0.58, 'rgba(255,255,255,0.16)'], [0.82, 'rgba(255,255,255,0.04)'], [1, 'rgba(255,255,255,0)']
]);

function sprite(x2, img, x, y, size, col, alpha, op) {
  x2.save();
  x2.globalCompositeOperation = op || 'lighter';
  x2.globalAlpha = alpha;
  if (col) {
    // tint by drawing the sprite then multiplying — cheaper: pre-tint via shadow trick is slow,
    // so we just draw white and rely on the caller's fillStyle overlay where colour matters.
    x2.fillStyle = col;
  }
  x2.drawImage(img, x - size / 2, y - size / 2, size, size);
  x2.restore();
}

/* tinted glow: draw into a scratch tint canvas once per colour is expensive, so instead
   we stack a white core + a coloured wide pass. Reads as a hot light with coloured spill. */
function light2d(x2, x, y, size, col, alpha) {
  x2.save();
  x2.globalCompositeOperation = 'lighter';
  x2.globalAlpha = alpha;
  x2.fillStyle = col;
  const g = x2.createRadialGradient(x, y, 0, x, y, size / 2);
  g.addColorStop(0, col);
  g.addColorStop(0.18, rgbaMul(col, 0.70));
  g.addColorStop(0.42, rgbaMul(col, 0.26));
  g.addColorStop(0.70, rgbaMul(col, 0.06));
  g.addColorStop(1, rgbaMul(col, 0));
  x2.fillStyle = g;
  x2.fillRect(x - size / 2, y - size / 2, size, size);
  x2.restore();
}
function rgbaMul(css, k) {
  const m = css.match(/rgba?\(([^)]+)\)/);
  if (!m) return css;
  const p = m[1].split(',').map(Number);
  const a = (p[3] === undefined ? 1 : p[3]) * k;
  return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + a + ')';
}

/* ============================================================
   THE FLOOR — a cathedral seen from directly above.
   Baked once per resize in "fully lit" values; the light buffer
   multiplies it down, so the room only exists where fire falls.
   ============================================================ */
const ROOM = { cx: 0, cy: 0, R: 0, altarY: 0, roseY: 0 };

/* A tiled grain sheet, generated once. Stone without grain reads as plastic. */
let GRAIN = null;
function makeGrain() {
  const n = 256;
  const c = mkbuf(n, n), x = c.getContext('2d');
  const img = x.createImageData(n, n);
  const R = mulberry(99);
  for (let i = 0; i < n * n; i++) {
    const v = 128 + (R() - 0.5) * 160 + (R() - 0.5) * 100;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  return c;
}

function bakeFloor() {
  FLOOR.fit();
  if (!GRAIN) GRAIN = makeGrain();
  const x = FLOOR.x;
  const R = mulberry(1337);
  ROOM.cx = W / 2; ROOM.cy = H * 0.53;
  ROOM.R = Math.min(W, H) * 0.42;
  ROOM.altarY = Math.max(46 * unit, H * 0.075);
  ROOM.roseY = ROOM.cy;

  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, FLOOR.c.width, FLOOR.c.height);
  FLOOR.reset();

  /* Baked at FULLY LIT values: this is the stone with the coal right on top of
     it. The light buffer multiplies it down to nothing everywhere else. Kept
     nearly neutral so the coal can make it warm and the high windows cold. */
  const PALE = [198, 190, 196], MID = [168, 158, 168], DARK = [138, 128, 142];
  const mix = (a, b, t) => [lerp(a[0], b[0], t) | 0, lerp(a[1], b[1], t) | 0, lerp(a[2], b[2], t) | 0];
  const css = (c) => 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';

  x.fillStyle = css(MID);
  x.fillRect(0, 0, W, H);

  const T = clamp(Math.min(W, H) / 9.5, 58, 112);

  const crack = (cx0, cy0, n, alpha) => {
    x.globalAlpha = alpha === undefined ? 0.18 + R() * 0.14 : alpha;
    x.strokeStyle = 'rgb(72,64,80)';
    x.lineWidth = rndR(R, 0.6, 1.5) * unit;
    x.beginPath();
    let px = cx0, py = cy0, ang = rndR(R, 0, TAU);
    x.moveTo(px, py);
    for (let s = 0; s < (n || 5); s++) {
      ang += rndR(R, -0.8, 0.8);
      px += Math.cos(ang) * rndR(R, 7, 28) * unit;
      py += Math.sin(ang) * rndR(R, 7, 28) * unit;
      x.lineTo(px, py);
    }
    x.stroke();
    x.globalAlpha = 1;
  };

  /* --- the field of slabs: no chequer, just stone that varies --- */
  for (let py = -T; py < H + T; py += T) {
    for (let px = -T; px < W + T; px += T) {
      const d = Math.hypot(px + T / 2 - ROOM.cx, py + T / 2 - ROOM.roseY) / ROOM.R;
      // neighbouring slabs stay close in value: a big jump between two of them
      // turns into a hard-edged rectangle the moment the coal lights it
      const base = mix(PALE, DARK, clamp(0.34 + R() * 0.30 + d * 0.16, 0, 1));
      const v = 1 + (R() - 0.5) * 0.07;
      x.fillStyle = 'rgb(' + ((base[0] * v) | 0) + ',' + ((base[1] * v) | 0) + ',' + ((base[2] * v) | 0) + ')';
      x.fillRect(px, py, T, T);
      for (let m = 0; m < 4; m++) {
        x.globalAlpha = 0.035 + R() * 0.065;
        x.fillStyle = R() < 0.5 ? 'rgb(238,234,242)' : 'rgb(88,80,94)';
        x.beginPath();
        x.ellipse(px + rndR(R, 0.05, 0.95) * T, py + rndR(R, 0.05, 0.95) * T,
          rndR(R, 0.08, 0.40) * T, rndR(R, 0.06, 0.34) * T, rndR(R, 0, TAU), 0, TAU);
        x.fill();
      }
      // seam: a hairline, and only three sides of it, so the grid never closes
      x.globalAlpha = 0.20 + R() * 0.16;
      x.strokeStyle = 'rgb(84,76,92)';
      x.lineWidth = 1 * unit;
      x.beginPath();
      x.moveTo(px + 0.5, py + T - 0.5); x.lineTo(px + 0.5, py + 0.5); x.lineTo(px + T - 0.5, py + 0.5);
      if (R() < 0.7) x.lineTo(px + T - 0.5, py + T - 0.5);
      x.stroke();
      x.globalAlpha = 0.07;
      x.fillStyle = 'rgb(250,248,252)';
      x.fillRect(px + 1, py + 1, T - 2, 1.1 * unit);
      x.globalAlpha = 1;
      if (R() < 0.10) crack(px + rndR(R, 0.2, 0.8) * T, py + rndR(R, 0.2, 0.8) * T, 4);
    }
  }

  /* --- a ring of voussoir blocks around the rose: the one deliberate pattern --- */
  x.save();
  x.translate(ROOM.cx, ROOM.roseY);
  for (let i = 0; i < 36; i++) {
    const a0 = (i / 36) * TAU, a1 = ((i + 1) / 36) * TAU;
    const r0 = ROOM.R * 1.02, r1 = ROOM.R * 1.16;
    x.globalAlpha = 0.5;
    x.fillStyle = i & 1 ? css(mix(DARK, MID, 0.35)) : css(mix(PALE, MID, 0.5));
    x.beginPath();
    x.arc(0, 0, r0, a0, a1); x.arc(0, 0, r1, a1, a0, true); x.closePath(); x.fill();
    x.globalAlpha = 0.28;
    x.strokeStyle = 'rgb(78,70,86)'; x.lineWidth = 1 * unit;
    x.stroke();
  }
  x.globalAlpha = 1;
  x.restore();

  /* --- wear that ignores the grid entirely --- */
  for (let i = 0; i < 54; i++) {
    const rr = rndR(R, 0.05, 0.32) * Math.min(W, H);
    const cx0 = rndR(R, -0.1, 1.1) * W, cy0 = rndR(R, -0.1, 1.1) * H;
    const dark = R() < 0.56;
    const g = x.createRadialGradient(cx0, cy0, 0, cx0, cy0, rr);
    g.addColorStop(0, dark ? 'rgba(70,62,78,0.30)' : 'rgba(246,244,250,0.17)');
    g.addColorStop(0.55, dark ? 'rgba(70,62,78,0.12)' : 'rgba(246,244,250,0.06)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g;
    x.fillRect(cx0 - rr, cy0 - rr, rr * 2, rr * 2);
  }
  // the path worn down the middle of the nave by centuries of feet
  const wg = x.createLinearGradient(W * 0.5 - ROOM.R * 0.55, 0, W * 0.5 + ROOM.R * 0.55, 0);
  wg.addColorStop(0, 'rgba(238,236,244,0)');
  wg.addColorStop(0.5, 'rgba(238,236,244,0.10)');
  wg.addColorStop(1, 'rgba(238,236,244,0)');
  x.fillStyle = wg; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 11; i++) crack(rndR(R, 0, W), rndR(R, 0, H), 18, 0.16);

  /* --- benches down the aisles: worn wood, not a barcode --- */
  const aisle = Math.max(0, (W - ROOM.R * 2.5) / 2);
  const pewW = Math.min(aisle - 18 * unit, 128 * unit);
  if (pewW > 40 * unit) {
    for (const side of [0, 1]) {
      const bx = side ? W - pewW - 14 * unit : 14 * unit;
      for (let py = ROOM.altarY + 110 * unit; py < H - 40 * unit; py += 46 * unit) {
        const jit = (R() - 0.5) * 5 * unit, w = pewW * (0.92 + R() * 0.08);
        x.globalAlpha = 0.34;
        x.fillStyle = 'rgb(112,96,110)';
        x.fillRect(bx + jit, py, w, 20 * unit);
        x.globalAlpha = 0.22;
        x.fillStyle = 'rgb(224,214,226)';
        x.fillRect(bx + jit, py + 1 * unit, w, 2 * unit);
        x.globalAlpha = 0.30;
        x.fillStyle = 'rgb(56,48,62)';
        x.fillRect(bx + jit, py + 18 * unit, w, 4.5 * unit);
        x.globalAlpha = 0.12;
        x.strokeStyle = 'rgb(48,40,54)'; x.lineWidth = 1 * unit;
        for (let k = 1; k < 4; k++) {
          x.beginPath(); x.moveTo(bx + jit + w * k / 4, py); x.lineTo(bx + jit + w * k / 4, py + 20 * unit); x.stroke();
        }
        x.globalAlpha = 1;
      }
    }
  }

  /* --- the great rose inlay under the nave --- */
  x.save();
  x.translate(ROOM.cx, ROOM.roseY);
  const BR = 'rgb(206,160,84)', BRL = 'rgb(252,222,156)', BRD = 'rgb(120,90,46)';
  for (const [rr, lw, col] of [[1.0, 3.4, BR], [0.88, 1.7, BRD], [0.63, 2.6, BR], [0.31, 1.7, BRD]]) {
    x.strokeStyle = col; x.lineWidth = lw * unit; x.globalAlpha = 0.60;
    x.beginPath(); x.arc(0, 0, ROOM.R * rr, 0, TAU); x.stroke();
  }
  x.globalAlpha = 0.38; x.strokeStyle = BR; x.lineWidth = 1.8 * unit;
  x.beginPath();
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * TAU;
    x.moveTo(Math.cos(a) * ROOM.R * 0.63, Math.sin(a) * ROOM.R * 0.63);
    x.lineTo(Math.cos(a) * ROOM.R * 0.995, Math.sin(a) * ROOM.R * 0.995);
  }
  x.stroke();
  x.globalAlpha = 0.48; x.strokeStyle = BRL; x.lineWidth = 1.6 * unit;
  for (let i = 0; i < 8; i++) {
    x.save(); x.rotate((i / 8) * TAU);
    x.beginPath();
    x.moveTo(0, 0);
    x.quadraticCurveTo(ROOM.R * 0.20, -ROOM.R * 0.13, ROOM.R * 0.30, 0);
    x.quadraticCurveTo(ROOM.R * 0.20, ROOM.R * 0.13, 0, 0);
    x.stroke();
    x.restore();
  }
  x.globalAlpha = 0.66; x.fillStyle = BRL;
  x.beginPath(); x.arc(0, 0, 4.5 * unit, 0, TAU); x.fill();
  x.globalAlpha = 1;
  x.restore();

  /* --- the altar: a raised sanctuary step, then the mensa --- */
  const ay = ROOM.altarY;
  const stepY = ay + 22 * unit;
  x.globalAlpha = 0.42;
  x.fillStyle = 'rgb(214,206,216)';
  x.fillRect(0, 0, W, stepY);
  x.globalAlpha = 0.34;
  x.fillStyle = 'rgb(84,74,92)';
  for (let i = 0; i < 44; i++) {
    const rr = rndR(R, 18, 96) * unit;
    x.beginPath();
    x.ellipse(rndR(R, 0, W), rndR(R, -14, stepY + 8 * unit), rr, rr * 0.45, 0, 0, TAU);
    x.fill();
  }
  x.globalAlpha = 1;
  // the shadow the step throws down the nave
  const sg = x.createLinearGradient(0, stepY, 0, stepY + 30 * unit);
  sg.addColorStop(0, 'rgba(24,18,32,0.62)');
  sg.addColorStop(1, 'rgba(24,18,32,0)');
  x.fillStyle = sg; x.fillRect(0, stepY, W, 30 * unit);
  // mensa
  const mw = Math.min(W * 0.46, 520 * unit), mx = (W - mw) / 2;
  x.globalAlpha = 0.92;
  x.fillStyle = 'rgb(212,202,216)';
  x.fillRect(mx, ay - 32 * unit, mw, 46 * unit);
  x.globalAlpha = 0.50; x.fillStyle = 'rgb(252,250,255)';
  x.fillRect(mx, ay - 32 * unit, mw, 2.6 * unit);
  x.globalAlpha = 0.55; x.fillStyle = 'rgb(40,32,52)';
  x.fillRect(mx, ay + 12 * unit, mw, 3.5 * unit);
  const mg = x.createLinearGradient(mx, 0, mx + mw, 0);
  mg.addColorStop(0, 'rgba(40,32,52,0.5)');
  mg.addColorStop(0.12, 'rgba(40,32,52,0)');
  mg.addColorStop(0.88, 'rgba(40,32,52,0)');
  mg.addColorStop(1, 'rgba(40,32,52,0.5)');
  x.globalAlpha = 1; x.fillStyle = mg;
  x.fillRect(mx, ay - 32 * unit, mw, 46 * unit);

  /* --- the name, brass, set into the stone of the nave --- */
  inlayWord(x, 'THURIBLE', ROOM.cx, ROOM.roseY + ROOM.R * 0.80, Math.min(W * 0.052, 34 * unit));

  /* --- grain over everything, so no surface is perfectly smooth --- */
  x.save();
  x.globalAlpha = 0.10;
  x.fillStyle = x.createPattern(GRAIN, 'repeat');
  x.fillRect(0, 0, W, H);
  x.restore();

  /* --- grime in the corners --- */
  const vg = x.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.22, W / 2, H * 0.5, Math.max(W, H) * 0.84);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(40,32,54,0.66)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
}

function rndR(R, a, b) { return a + R() * (b - a); }

function inlayWord(x, word, cx, cy, size) {
  x.save();
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '600 ' + size + 'px Georgia,"Times New Roman",Didot,serif';
  const track = size * 0.42;
  let total = 0;
  const widths = [];
  for (const ch of word) { const w = x.measureText(ch).width; widths.push(w); total += w + track; }
  total -= track;
  let px = cx - total / 2;
  for (let i = 0; i < word.length; i++) {
    const cxi = px + widths[i] / 2;
    // recess shadow
    x.globalAlpha = 0.6; x.fillStyle = '#241a32';
    x.fillText(word[i], cxi + size * 0.03, cy + size * 0.035);
    // brass fill
    const g = x.createLinearGradient(cxi, cy - size * 0.55, cxi, cy + size * 0.55);
    g.addColorStop(0, '#f0cd8a'); g.addColorStop(0.45, '#b48c48');
    g.addColorStop(0.55, '#8f6c33'); g.addColorStop(1, '#d6a95e');
    x.globalAlpha = 0.92; x.fillStyle = g;
    x.fillText(word[i], cxi, cy);
    // top bevel
    x.globalAlpha = 0.5; x.strokeStyle = '#e6c98d'; x.lineWidth = Math.max(0.6, size * 0.018);
    x.strokeText(word[i], cxi, cy - size * 0.012);
    px += widths[i] + track;
  }
  x.globalAlpha = 1;
  x.restore();
}

/* ============================================================
   POST — WebGL2: bright-pass, dual-Kawase bloom, heat refraction,
   aberration, filmic tonemap, vignette, grain.
   Falls back to a pure Canvas2D bloom if WebGL is missing.
   ============================================================ */
const Post = {
  gl: null, ok: false, quality: 1,
  fbo: [], tex: {}, prog: {}, vao: null,
  W: 0, H: 0,

  init() {
    let gl = null;
    try {
      gl = view.getContext('webgl2', {
        alpha: false, antialias: false, depth: false, stencil: false,
        premultipliedAlpha: false, preserveDrawingBuffer: true,
        powerPreference: 'high-performance', desynchronized: false
      });
    } catch (e) { gl = null; }
    if (!gl) { this.ok = false; this.fallback(); return; }
    this.gl = gl;
    const half = gl.getExtension('EXT_color_buffer_half_float');
    const flt = gl.getExtension('EXT_color_buffer_float');
    this.hdr = !!(half || flt);
    this.fmt = half ? gl.HALF_FLOAT : (flt ? gl.FLOAT : gl.UNSIGNED_BYTE);
    this.ifmt = half ? gl.RGBA16F : (flt ? gl.RGBA32F : gl.RGBA8);
    gl.getExtension('OES_texture_float_linear');
    gl.getExtension('OES_texture_half_float_linear');

    const VS = `#version 300 es
    out vec2 vUv;
    void main(){
      vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2);
      vUv = p;
      gl_Position = vec4(p*2.0-1.0, 0.0, 1.0);
    }`;

    const HEAD = `#version 300 es
    precision highp float;
    in vec2 vUv;
    out vec4 o;
    `;

    /* bright pass + half-res downsample */
    const F_BRIGHT = HEAD + `
    uniform sampler2D uT; uniform vec2 uTexel; uniform float uThresh, uKnee;
    void main(){
      vec3 s = vec3(0.0);
      s += texture(uT, vUv + uTexel*vec2(-1.0,-1.0)).rgb;
      s += texture(uT, vUv + uTexel*vec2( 1.0,-1.0)).rgb;
      s += texture(uT, vUv + uTexel*vec2(-1.0, 1.0)).rgb;
      s += texture(uT, vUv + uTexel*vec2( 1.0, 1.0)).rgb;
      s *= 0.25;
      float l = max(s.r, max(s.g, s.b));
      float w = clamp((l - uThresh) / max(uKnee, 1e-4), 0.0, 1.0);
      w *= w;
      o = vec4(s * w, 1.0);
    }`;

    /* dual-Kawase down */
    const F_DOWN = HEAD + `
    uniform sampler2D uT; uniform vec2 uTexel;
    void main(){
      vec3 s = texture(uT, vUv).rgb * 4.0;
      s += texture(uT, vUv - uTexel).rgb;
      s += texture(uT, vUv + uTexel).rgb;
      s += texture(uT, vUv + vec2(uTexel.x, -uTexel.y)).rgb;
      s += texture(uT, vUv - vec2(uTexel.x, -uTexel.y)).rgb;
      o = vec4(s / 8.0, 1.0);
    }`;

    /* dual-Kawase up */
    const F_UP = HEAD + `
    uniform sampler2D uT; uniform vec2 uTexel;
    void main(){
      vec3 s = texture(uT, vUv + vec2(-uTexel.x*2.0, 0.0)).rgb;
      s += texture(uT, vUv + vec2(-uTexel.x, uTexel.y)).rgb*2.0;
      s += texture(uT, vUv + vec2(0.0, uTexel.y*2.0)).rgb;
      s += texture(uT, vUv + vec2(uTexel.x, uTexel.y)).rgb*2.0;
      s += texture(uT, vUv + vec2(uTexel.x*2.0, 0.0)).rgb;
      s += texture(uT, vUv + vec2(uTexel.x, -uTexel.y)).rgb*2.0;
      s += texture(uT, vUv + vec2(0.0, -uTexel.y*2.0)).rgb;
      s += texture(uT, vUv + vec2(-uTexel.x, -uTexel.y)).rgb*2.0;
      o = vec4(s / 12.0, 1.0);
    }`;

    /* composite */
    const F_OUT = HEAD + `
    uniform sampler2D uScene, uBloom, uSmoke;
    uniform vec2 uRes;
    uniform float uTime, uHeat, uBloomAmt, uAber, uShock, uShockR, uFade, uGrain, uHurt, uFlash, uStreak, uToe;
    uniform vec2 uShockC;

    vec3 aces(vec3 x){
      const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
      return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0);
    }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }

    void main(){
      vec2 uv = vUv;
      vec2 c = uv - 0.5;
      float r2 = dot(c,c);

      /* heat shimmer: refract along the gradient of the incense density */
      vec2 tx = 1.0/uRes;
      float sC = texture(uSmoke, uv).a;
      float sx = texture(uSmoke, uv + vec2(4.0,0.0)*tx).a - texture(uSmoke, uv - vec2(4.0,0.0)*tx).a;
      float sy = texture(uSmoke, uv + vec2(0.0,4.0)*tx).a - texture(uSmoke, uv - vec2(0.0,4.0)*tx).a;
      float wob = sin(uv.y*140.0 + uTime*3.4) * 0.5 + sin(uv.x*97.0 - uTime*2.1)*0.5;
      vec2 refr = vec2(sx, sy) * (0.0016 + uHeat*0.0034) * (0.6 + 0.4*wob) * smoothstep(0.02,0.35,sC);

      /* shockwave rings from big kills */
      if (uShock > 0.001){
        vec2 d = uv - uShockC;
        d.x *= uRes.x/uRes.y;
        float dist = length(d);
        float band = exp(-pow((dist - uShockR)*26.0, 2.0)) * uShock;
        refr += normalize(d + 1e-5) * band * 0.020;
      }

      uv += refr;

      /* chromatic aberration, radial, stronger at the frame's edge */
      float ab = (uAber + uHurt*0.0055) * (0.25 + r2*2.2);
      vec2 dir = c * ab;
      vec3 col;
      col.r = texture(uScene, uv + dir).r;
      col.g = texture(uScene, uv).g;
      col.b = texture(uScene, uv - dir).b;

      vec3 bl = texture(uBloom, uv).rgb;
      /* a lazy anamorphic smear: widen the bloom horizontally a touch */
      if (uStreak > 0.001){
        vec3 st = vec3(0.0);
        st += texture(uBloom, uv + vec2( 6.0,0.0)*tx).rgb;
        st += texture(uBloom, uv + vec2(-6.0,0.0)*tx).rgb;
        st += texture(uBloom, uv + vec2( 14.0,0.0)*tx).rgb;
        st += texture(uBloom, uv + vec2(-14.0,0.0)*tx).rgb;
        bl += st * 0.22 * uStreak;
      }
      col += bl * uBloomAmt;

      /* A kill flashes the room, it does not paint over it: multiply, so the
         blacks stay black and only what is already lit gets hit. */
      col *= 1.0 + uFlash * 3.2;
      /* the room turning against you */
      col = mix(col, col*vec3(1.22,0.46,0.50), uHurt*0.46);

      /* Tonemap the LUMINANCE and rescale chroma, so a hot coal goes amber-white
         instead of every bright thing clipping to the same neutral. */
      col *= 1.10;
      float l0 = max(dot(col, vec3(0.2126,0.7152,0.0722)), 1e-5);
      float l1 = aces(vec3(l0)).r;
      col *= l1 / l0;
      col = mix(col, col * vec3(1.0, 0.88, 0.66), smoothstep(0.55, 1.0, l1) * 0.80);
      col = clamp(col, 0.0, 1.0);

      /* vignette, warm at the core */
      float v = smoothstep(1.15, 0.02, r2*1.95);
      col *= mix(0.055, 1.0, v);
      /* a chroma floor on the vignette: without it the corners collapse to neutral
         and the room stops being cold exactly where it is darkest */
      col += vec3(0.0035, 0.0050, 0.0125) * (1.0 - v);
      col += vec3(0.030,0.012,0.020) * v * (0.4 + uHeat*0.9);

      /* A toe. Without one the bottom two stops sit at a third of a percent of peak
         and a phone in daylight shows a dead panel where the room should be. Tinted
         cool, so what survives reads as night air and not as a lifted black. */
      float lt2 = dot(col, vec3(0.2126,0.7152,0.0722));
      col += uToe * vec3(0.0090, 0.0115, 0.0235) * (1.0 - smoothstep(0.0, 0.32, lt2));

      /* grain — 35mm, not TV static */
      /* multiplicative, luminance-only, quiet in the darks, and it does not crawl */
      float gseed = floor(uTime * 11.0);
      float g = hash(floor(gl_FragCoord.xy) + gseed * 71.3);
      float lg = dot(col, vec3(0.2126,0.7152,0.0722));
      col *= 1.0 + (g - 0.5) * uGrain * (0.35 + sqrt(lg) * 1.5);

      col *= uFade;
      o = vec4(max(col, 0.0), 1.0);
    }`;

    const cmp = (vs, fs) => {
      const p = gl.createProgram();
      for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.warn('shader', gl.getShaderInfoLog(s));
          return null;
        }
        gl.attachShader(p, s);
      }
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.warn(gl.getProgramInfoLog(p)); return null; }
      const u = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
      return { p, u };
    };

    this.prog.bright = cmp(VS, F_BRIGHT);
    this.prog.down = cmp(VS, F_DOWN);
    this.prog.up = cmp(VS, F_UP);
    this.prog.out = cmp(VS, F_OUT);
    if (!this.prog.bright || !this.prog.down || !this.prog.up || !this.prog.out) { this.ok = false; this.fallback(); return; }

    this.vao = gl.createVertexArray();
    this.tex.scene = this.mktex(gl.LINEAR, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    this.tex.smoke = this.mktex(gl.LINEAR, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE);
    this.ok = true;
    view.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.ok = false; this.fallback(); });
  },

  fallback() {
    // No WebGL: the visible canvas becomes a plain 2D surface and we do a
    // downsample-bloom by hand. Less pretty, still lit.
    this.fb = view.getContext('2d', { alpha: false });
    if (this.fb) { this.fbBloom = [Layer(0.25), Layer(0.125), Layer(0.0625)]; this.fbReady = true; this.fitFallback(); }
  },
  fitFallback() { view.width = PW; view.height = PH; if (this.fbBloom) for (const l of this.fbBloom) l.fit(); },

  mktex(filter, ifmt, fmt, type) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    t._i = ifmt; t._f = fmt; t._t = type;
    return t;
  },

  fit() {
    if (!this.ok) { this.fitFallback(); return; }
    const gl = this.gl;
    view.width = PW; view.height = PH;
    this.W = PW; this.H = PH;
    for (const f of this.fbo) { gl.deleteFramebuffer(f.fb); gl.deleteTexture(f.tex); }
    this.fbo = [];
    let w = Math.max(2, PW >> 1), h = Math.max(2, PH >> 1);
    const LEVELS = 6;
    for (let i = 0; i < LEVELS; i++) {
      const tex = this.mktex(gl.LINEAR, this.ifmt, gl.RGBA, this.fmt);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, this.ifmt, w, h, 0, gl.RGBA, this.fmt, null);
      const fb = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      this.fbo.push({ fb, tex, w, h });
      w = Math.max(2, w >> 1); h = Math.max(2, h >> 1);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  },

  pass(prog, target, binds, setup) {
    const gl = this.gl;
    if (target) { gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); gl.viewport(0, 0, target.w, target.h); }
    else { gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, this.W, this.H); }
    gl.useProgram(prog.p);
    for (let i = 0; i < binds.length; i++) {
      gl.activeTexture(gl.TEXTURE0 + i);
      gl.bindTexture(gl.TEXTURE_2D, binds[i][1]);
      gl.uniform1i(prog.u[binds[i][0]], i);
    }
    if (setup) setup(gl, prog.u);
    gl.bindVertexArray(this.vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  },

  render(p) {
    if (!this.ok) return this.renderFallback(p);
    const gl = this.gl;
    gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);

    gl.bindTexture(gl.TEXTURE_2D, this.tex.scene);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, SCENE.c);
    gl.bindTexture(gl.TEXTURE_2D, this.tex.smoke);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, gl.RGBA, gl.UNSIGNED_BYTE, SMOKE_A.c);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

    const N = this.quality >= 1 ? 5 : 4;
    // bright pass into level 0
    this.pass(this.prog.bright, this.fbo[0], [['uT', this.tex.scene]], (g, u) => {
      g.uniform2f(u.uTexel, 1 / this.W, 1 / this.H);
      g.uniform1f(u.uThresh, p.thresh);
      g.uniform1f(u.uKnee, 0.55);
    });
    for (let i = 1; i < N; i++) {
      this.pass(this.prog.down, this.fbo[i], [['uT', this.fbo[i - 1].tex]], (g, u) => {
        g.uniform2f(u.uTexel, 1 / this.fbo[i - 1].w, 1 / this.fbo[i - 1].h);
      });
    }
    for (let i = N - 1; i > 0; i--) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      this.pass(this.prog.up, this.fbo[i - 1], [['uT', this.fbo[i].tex]], (g, u) => {
        g.uniform2f(u.uTexel, 1 / this.fbo[i].w, 1 / this.fbo[i].h);
      });
      gl.disable(gl.BLEND);
    }

    this.pass(this.prog.out, null,
      [['uScene', this.tex.scene], ['uBloom', this.fbo[0].tex], ['uSmoke', this.tex.smoke]],
      (g, u) => {
        g.uniform2f(u.uRes, this.W, this.H);
        g.uniform1f(u.uTime, p.time);
        g.uniform1f(u.uHeat, p.heat);
        g.uniform1f(u.uBloomAmt, p.bloom);
        g.uniform1f(u.uAber, p.aber);
        g.uniform1f(u.uShock, p.shock);
        g.uniform1f(u.uShockR, p.shockR);
        g.uniform2f(u.uShockC, p.shockX, 1 - p.shockY);
        g.uniform1f(u.uFade, p.fade);
        g.uniform1f(u.uGrain, p.grain);
        g.uniform1f(u.uHurt, p.hurt);
        g.uniform1f(u.uFlash, p.flash);
        g.uniform1f(u.uStreak, p.streak);
        g.uniform1f(u.uToe, p.toe);
      });
  },

  renderFallback(p) {
    const fb = this.fb;
    if (!fb) return;
    fb.setTransform(1, 0, 0, 1, 0, 0);
    fb.globalCompositeOperation = 'copy';
    fb.drawImage(SCENE.c, 0, 0, PW, PH);
    fb.globalCompositeOperation = 'source-over';
    // cheap bloom: cascade of downsamples, added back
    let src = SCENE.c;
    for (const l of this.fbBloom) {
      l.x.setTransform(1, 0, 0, 1, 0, 0);
      l.x.globalCompositeOperation = 'copy';
      l.x.imageSmoothingEnabled = true;
      l.x.drawImage(src, 0, 0, l.c.width, l.c.height);
      l.x.globalCompositeOperation = 'source-over';
      src = l.c;
    }
    fb.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.fbBloom.length; i++) {
      fb.globalAlpha = clamp(p.bloom * (0.16 + i * 0.14), 0, 1);
      fb.drawImage(this.fbBloom[i].c, 0, 0, PW, PH);
    }
    fb.globalAlpha = 1;
    fb.globalCompositeOperation = 'source-over';
    if (p.fade < 1) { fb.fillStyle = 'rgba(0,0,0,' + (1 - p.fade) + ')'; fb.fillRect(0, 0, PW, PH); }
  }
};

/* ---------- resize ---------- */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, QUALITY.dpr);
  W = Math.max(320, window.innerWidth);
  H = Math.max(320, window.innerHeight);
  PW = Math.floor(W * DPR); PH = Math.floor(H * DPR);
  view.style.width = W + 'px'; view.style.height = H + 'px';
  unit = clamp(Math.min(W, H) / 720, 0.62, 1.6);

  SCENE.fit(); DECAL.fit(); LIT.fit(); LIGHT.fit(); SPILL.fit();
  SMOKE_A.fit(); SMOKE_B.fit(); SMOKE_LIT.fit(); HALO.fit();
  ctx = SCENE.x;
  bakeFloor();
  Post.fit();
  if (typeof onResized === 'function') onResized();
}

const QUALITY = { dpr: 1.75, bloom: 1, smoke: 1 };


/* ===== b-art.js ===== */
/* ============================================================
   art: lighting, incense, the censer, the thurifer, the congregation
   ============================================================ */

/* A glow with a temperature. The white GLOW sprite is right for a lens flare and
   wrong for fire: a small bright ball of it desaturates to pale green-white long
   before it ever reaches the tonemap's warm shoulder. */
function fireGlow(x, y, size, t01, alpha) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(x, y, 0, x, y, size / 2);
  g.addColorStop(0.00, rgba(ember(clamp(t01 + 0.10, 0, 1)), alpha));
  g.addColorStop(0.10, rgba(ember(t01), alpha * 0.82));
  g.addColorStop(0.26, rgba(ember(clamp(t01 - 0.18, 0, 1)), alpha * 0.40));
  g.addColorStop(0.50, rgba(ember(clamp(t01 - 0.34, 0, 1)), alpha * 0.13));
  g.addColorStop(0.76, rgba(ember(clamp(t01 - 0.46, 0, 1)), alpha * 0.032));
  g.addColorStop(1.00, rgba(ember(0.2), 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - size / 2, y - size / 2, size, size);
  ctx.restore();
}

/* soft black sprite, multiplied into the light buffer to carve shadows */
const SHADOW = radial(128, [
  [0, 'rgba(0,0,0,0.94)'], [0.30, 'rgba(0,0,0,0.72)'],
  [0.58, 'rgba(0,0,0,0.32)'], [0.82, 'rgba(0,0,0,0.08)'], [1, 'rgba(0,0,0,0)']
]);

/* every light in the room, rebuilt each frame */
let lights = [], shadows = [];
function parseRGB(css) {
  const m = css.match(/rgba?\(([^)]+)\)/);
  if (!m) return [255, 255, 255];
  const p = m[1].split(',');
  return [+p[0], +p[1], +p[2]];
}
function addLight(x, y, r, col, a, soft, sx, sy, rot, warm) {
  lights.push({ x, y, r, col, a, soft, sx: sx || 1, sy: sy || 1, rot: rot || 0, rgb: parseRGB(col), warm: !!warm });
}
function addShadow(x, y, rx, ry, rot, k) { shadows.push({ x, y, rx, ry, rot, k }); }

const AMBIENT = [15, 13, 22];

/* Two buffers, deliberately: SPILL is the light itself (used for the glow that
   hangs in the air and for tinting the incense), LIGHT is SPILL over an ambient
   floor with the shadows carved back out (used to multiply the stone). */
/* The room has its own cold light — high windows, a moon somewhere, whatever a
   cathedral has at night. It is barely there, but it means the stone exists before
   you light it, and it gives every warm thing something cold to sit against. */
let ROOMK = 1;
let WORLDK = 1;   // set each frame: 0 = the room has gone out
function roomLight() {
  if (ROOMK < 0.004) return;
  /* Three shafts down each aisle from the clerestory, and a wash under the great
     window over the altar. Directional, so the nave keeps its dark middle and the
     coal still owns the frame. */
  const S = Math.min(W, H);
  for (const side of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const y = H * (0.20 + i * 0.28);
      addLight(W * 0.5 + side * W * 0.40, y, S * 0.40,
        'rgba(122,140,184,1)', (0.155 - i * 0.022) * ROOMK, true, 1.0, 2.1, side * 0.22);
    }
  }
  addLight(W * 0.5, ROOM.altarY + S * 0.06, S * 0.56, 'rgba(126,142,186,1)', 0.115 * ROOMK, true, 1.5, 0.85);
  addLight(W * 0.5, H * 0.55, S * 1.25, 'rgba(104,118,158,1)', 0.050 * ROOMK, true);
}

function buildLight(heat) {
  roomLight();
  const S = SPILL, sx = S.x;
  S.clear();
  sx.save();
  sx.globalCompositeOperation = 'lighter';
  for (const l of lights) {
    sx.save();
    if (l.sx !== 1 || l.sy !== 1 || l.rot) {
      sx.translate(l.x, l.y); sx.rotate(l.rot); sx.scale(l.sx, l.sy); sx.translate(-l.x, -l.y);
    }
    const g = sx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r);
    if (l.soft === 'pool') {
      g.addColorStop(0.00, rgbaMul(l.col, l.a));
      g.addColorStop(0.09, rgbaMul(l.col, l.a * 0.76));
      g.addColorStop(0.22, rgbaMul(l.col, l.a * 0.48));
      g.addColorStop(0.40, rgbaMul(l.col, l.a * 0.255));
      g.addColorStop(0.60, rgbaMul(l.col, l.a * 0.110));
      g.addColorStop(0.80, rgbaMul(l.col, l.a * 0.032));
      g.addColorStop(1.00, rgbaMul(l.col, 0));
    } else if (l.soft) {
      g.addColorStop(0.00, rgbaMul(l.col, l.a));
      g.addColorStop(0.32, rgbaMul(l.col, l.a * 0.66));
      g.addColorStop(0.62, rgbaMul(l.col, l.a * 0.28));
      g.addColorStop(0.85, rgbaMul(l.col, l.a * 0.07));
      g.addColorStop(1.00, rgbaMul(l.col, 0));
    } else {
      // inverse-square-ish: a small hot core and a long, quiet falloff
      g.addColorStop(0.00, rgbaMul(l.col, l.a));
      g.addColorStop(0.055, rgbaMul(l.col, l.a * 0.70));
      g.addColorStop(0.14, rgbaMul(l.col, l.a * 0.38));
      g.addColorStop(0.28, rgbaMul(l.col, l.a * 0.175));
      g.addColorStop(0.48, rgbaMul(l.col, l.a * 0.075));
      g.addColorStop(0.72, rgbaMul(l.col, l.a * 0.024));
      g.addColorStop(1.00, rgbaMul(l.col, 0));
    }
    sx.fillStyle = g;
    sx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2);
    sx.restore();
  }
  sx.restore();

  const L = LIGHT, x = L.x;
  const amb = (1 + heat * 0.22) * (0.10 + ROOMK * 0.90);
  AMBK = amb;
  L.fill('rgb(' + Math.round(AMBIENT[0] * amb) + ',' + Math.round(AMBIENT[1] * amb) + ',' + Math.round(AMBIENT[2] * amb) + ')');
  x.save();
  // SPILL is already in this buffer's pixel space — draw it 1:1, not through
  // the layer's CSS-pixel transform, or the whole room ends up in one quadrant.
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'lighter';
  x.drawImage(S.c, 0, 0);
  x.restore();
  L.reset();

  x.save();
  x.globalCompositeOperation = 'multiply';
  for (const s of shadows) {
    x.globalAlpha = s.k;
    x.translate(s.x, s.y); x.rotate(s.rot);
    x.drawImage(SHADOW, -s.rx, -s.ry, s.rx * 2, s.ry * 2);
    x.setTransform(L.scale * DPR, 0, 0, L.scale * DPR, 0, 0);
  }
  x.restore();
}

/* A shadow stretched away from the coal: long, soft at the tip, and anchored by a
   tight dark contact right under the thing so it stands ON the floor. */
function castShadow(px, py, r, hx, hy, strength) {
  let dx = px - hx, dy = py - hy;
  const d = Math.hypot(dx, dy) || 1;
  dx /= d; dy /= d;
  const near = clamp(1 - d / (900 * unit), 0.10, 1);
  const len = r * (1.9 + clamp(d / (200 * unit), 0, 3.2));
  const rot = Math.atan2(dy, dx);
  addShadow(px + dx * len * 0.30, py + dy * len * 0.30, len * 0.70, r * 1.10, rot, strength * near * 0.80);
  addShadow(px + dx * len * 0.72, py + dy * len * 0.72, len * 0.85, r * 1.55, rot, strength * near * 0.34);
  addShadow(px + dx * r * 0.22, py + dy * r * 0.22, r * 1.25, r * 1.10, rot, strength * near * 0.95);
}

/* ============================================================
   INCENSE — a feedback field that billows out from the coal
   ============================================================ */
function advectSmoke(dt, tnow, ex, ey) {
  /* One transform, one draw, one decay. Anything drawn twice per frame becomes a
     fixed point that never fades — which is how you end up with flat fog instead
     of plumes. All the shape comes from where the coal laid the smoke down. */
  const src = SMOKE_A, dst = SMOKE_B;
  const x = dst.x, cw = dst.c.width, ch = dst.c.height;
  const S = SMOKE_A.scale * DPR;
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.clearRect(0, 0, cw, ch);

  const decay = Math.pow(0.42, dt);            // ~1.7 s half-life
  const grow = 1 + 0.15 * dt;                  // it billows
  const spin = (Math.sin(tnow * 0.23) * 0.80 + Math.sin(tnow * 0.47 + 2) * 0.42) * dt;
  const cx = (ex === undefined ? cw / (2 * S) : ex) * S;
  const cy = (ey === undefined ? ch / (2 * S) : ey) * S;
  const dx = Math.sin(tnow * 0.37) * 7 * S * dt;
  const dy = (Math.cos(tnow * 0.29) * 0.5 - 0.9) * 7 * S * dt;

  x.globalAlpha = decay;
  x.translate(cx + dx, cy + dy);
  x.rotate(spin);
  x.scale(grow, grow);
  x.translate(-cx, -cy);
  x.drawImage(src.c, 0, 0);
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalAlpha = 1;
  dst.reset();
  const tmp = SMOKE_A; SMOKE_A = SMOKE_B; SMOKE_B = tmp;
}

function stampSmoke(x, y, r, a) {
  const s = SMOKE_A.x;
  s.save();
  s.globalCompositeOperation = 'lighter';
  s.globalAlpha = a;
  s.drawImage(PUFF, x - r, y - r, r * 2, r * 2);
  s.restore();
}

function compositeSmoke(amount) {
  /* Smoke has no colour of its own. It borrows whatever light reaches it,
     which is why incense in front of a coal looks like fire and incense
     in the dark looks like nothing at all. */
  const L = SMOKE_LIT, x = L.x;
  x.setTransform(1, 0, 0, 1, 0, 0);
  x.globalCompositeOperation = 'copy';
  x.drawImage(SPILL.c, 0, 0);
  x.globalCompositeOperation = 'destination-in';
  x.drawImage(SMOKE_A.c, 0, 0);
  // incense is never neutral: it is smoke off a coal
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = 'rgba(255,176,104,0.30)';
  x.fillRect(0, 0, L.c.width, L.c.height);
  x.globalCompositeOperation = 'source-over';
  L.reset();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = amount;
  ctx.drawImage(L.c, 0, 0, W, H);
  ctx.restore();
}

/* ============================================================
   DECALS — scorch the floor keeps. The only record of the run.
   ============================================================ */
function scorch(x, y, r, dark) {
  const d = DECAL.x;
  d.save();
  d.globalAlpha = dark * 0.85;
  const g = d.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(6,4,7,0.95)');
  g.addColorStop(0.42, 'rgba(11,7,9,0.62)');
  g.addColorStop(0.76, 'rgba(16,10,12,0.20)');
  g.addColorStop(1, 'rgba(16,10,12,0)');
  d.fillStyle = g;
  d.beginPath(); d.arc(x, y, r, 0, TAU); d.fill();
  d.globalAlpha = dark * 0.42;
  d.strokeStyle = 'rgba(58,34,20,0.8)';
  d.lineWidth = 1.3 * unit;
  d.beginPath();
  for (let i = 0; i <= 20; i++) {
    const a = (i / 20) * TAU;
    const rr = r * (0.58 + Math.sin(a * 3.1 + x * 0.03) * 0.09 + Math.sin(a * 5.7 + y * 0.02) * 0.05);
    if (i === 0) d.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    else d.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  d.closePath(); d.stroke();
  d.restore();
}
function sootTrail(x, y, r, a) {
  const d = DECAL.x;
  d.save();
  d.globalAlpha = a;
  const g = d.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(8,5,8,0.5)');
  g.addColorStop(1, 'rgba(8,5,8,0)');
  d.fillStyle = g;
  d.fillRect(x - r, y - r, r * 2, r * 2);
  d.restore();
}

/* ============================================================
   THE TRAIL — hot gas. It expands as it ages and cools as it ages,
   so the oldest part is the widest and the reddest, and it does not end:
   it thins out and hands itself over to the incense.

   Drawn as chunks along its own length rather than one polygon with a
   gradient across it — a swing that loops back on itself has its tail
   sitting next to its head, and a straight-line gradient across that
   chord paints the whole loop one temperature.
   ============================================================ */
function drawTrail(trail, heat, kill01, now, coal) {
  const n = trail.length;
  if (n < 6) return;
  const life = 0.62;

  const layers = [
    { k: 3.10, a: 0.038, boil: 0.30 },
    { k: 1.90, a: 0.058, boil: 0.24 },
    { k: 1.15, a: 0.105, boil: 0.18 },
    { k: 0.66, a: 0.210, boil: 0.12 },
    { k: 0.34, a: 0.330, boil: 0.07 },
    { k: 0.15, a: 0.460, boil: 0.03 }
  ];
  const w0 = (1.8 + heat * 3.5 + kill01 * 5.0) * unit;
  const hot = clamp(0.26 + coal * 0.76, 0, 1);
  const CH = 5;

  const lx = new Float32Array(n), ly = new Float32Array(n);
  const rx = new Float32Array(n), ry = new Float32Array(n);

  /* The outer halo is rasterised into a third-scale buffer and blown back up:
     the upsample filter turns the stack of stepped quads into a continuous
     falloff, which is what a glow is. The bright core stays at full res. */
  HALO.clear();
  const HX = HALO.x;
  HX.globalCompositeOperation = 'lighter';

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  for (let li = 0; li < layers.length; li++) {
    const L = layers[li];
    const g2 = li < 3 ? HX : ctx;
    for (let i = 0; i < n; i++) {
      const p = trail[i];
      const a = trail[Math.max(0, i - 1)], b = trail[Math.min(n - 1, i + 1)];
      let tx = b.x - a.x, ty = b.y - a.y;
      const d = Math.hypot(tx, ty) || 1;
      tx /= d; ty /= d;
      const age = clamp((now - p.t) / life, 0, 1);
      const grow = 0.50 + age * 1.45;
      const cap = 1 - Math.pow(1 - (i / (n - 1)), 2.4);
      const boil = 1 + (Math.sin(i * 1.9 + p.t * 11) * 0.6 + Math.sin(i * 0.7 - p.t * 6) * 0.4) * L.boil;
      const w = (w0 + p.s * 9 * unit) * L.k * grow * cap * boil;
      lx[i] = p.x - ty * w; ly[i] = p.y + tx * w;
      rx[i] = p.x + ty * w; ry[i] = p.y - tx * w;
    }

    for (let c = 0; c < CH; c++) {
      // integer boundaries, shared exactly: floor/ceil would overlap one segment
      // between chunks and draw it twice, which shows up as a bright quad
      const i0 = Math.round((c * (n - 1)) / CH);
      const i1 = Math.min(n - 1, Math.round(((c + 1) * (n - 1)) / CH));
      if (i1 <= i0) continue;
      g2.beginPath();
      g2.moveTo(lx[i0], ly[i0]);
      for (let i = i0 + 1; i <= i1; i++) g2.lineTo(lx[i], ly[i]);
      for (let i = i1; i >= i0; i--) g2.lineTo(rx[i], ry[i]);
      g2.closePath();

      const f0 = i0 / (n - 1), f1 = i1 / (n - 1);
      const temp = (f) => clamp(hot * Math.pow(f, 0.55) - (1 - f) * 0.10, 0, 1);
      const fade = (f) => { const g = 1 - f; return Math.exp(-g * 2.9) * (1 - Math.pow(g, 4)); };
      const g = g2.createLinearGradient(trail[i0].x, trail[i0].y, trail[i1].x, trail[i1].y);
      g.addColorStop(0, emberCss(temp(f0), L.a * fade(f0)));
      g.addColorStop(0.5, emberCss(temp((f0 + f1) / 2), L.a * fade((f0 + f1) / 2)));
      g.addColorStop(1, emberCss(temp(f1), L.a * fade(f1)));
      g2.fillStyle = g;
      g2.fill();
    }
  }
  // the halo, upsampled out of its small buffer, which is what smooths the steps
  ctx.globalAlpha = 1;
  ctx.drawImage(HALO.c, 0, 0, W, H);
  ctx.restore();
}

/* ============================================================
   THE CENSER — a pierced brass thurible seen from above.
   It must stay an OBJECT, and it must LOOK like what it currently is:
   cold iron when it cannot kill, blowing out when it can.
   ============================================================ */
function drawCenser(h, spd01, heat, tnow, spin, coal, killing) {
  const R = (15 + heat * 8) * unit;
  const vx = h.x - h.px, vy = h.y - h.py;
  const vlen = Math.hypot(vx, vy);
  const ang = vlen > 0.4 ? Math.atan2(vy, vx) : 0;

  const ghosts = spd01 > 0.12 ? 3 : 0;
  for (let g = ghosts; g >= 1; g--) {
    const f = g / (ghosts + 1);
    ctx.save();
    ctx.globalAlpha = 0.13 * spd01 * (1 - f * 0.5);
    ctx.globalCompositeOperation = 'lighter';
    body(h.x - vx * f * 1.5, h.y - vy * f * 1.5, R * (1 - f * 0.10), ang, coal * 0.85, true);
    ctx.restore();
  }
  body(h.x, h.y, R, ang, coal, false);

  function body(cx, cy, r, a, hot, ghost) {
    const stretch = 1 + clamp(vlen * 0.015, 0, 0.42);
    // how much the metal itself has come up: dead iron -> working brass -> glowing
    const glow = clamp(hot * 1.15, 0.24, 1);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.scale(stretch, 1 / (1 + (stretch - 1) * 0.4));
    ctx.rotate(-a);
    ctx.rotate(spin);

    if (!ghost) {
      ctx.fillStyle = '#0b0810';
      ctx.beginPath(); ctx.arc(0, 0, r * 1.15, 0, TAU); ctx.fill();
      const k = 0.10 + WORLDK * 0.90;
      const m = (cold, warm) => 'rgb(' +
        Math.round(lerp(cold[0], warm[0], glow) * k) + ',' +
        Math.round(lerp(cold[1], warm[1], glow) * k) + ',' +
        Math.round(lerp(cold[2], warm[2], glow) * k) + ')';
      const lg = ctx.createRadialGradient(-r * 0.38, -r * 0.38, r * 0.04, 0, 0, r);
      lg.addColorStop(0, m([64, 60, 70], [214, 176, 112]));
      lg.addColorStop(0.38, m([44, 41, 50], [148, 114, 52]));
      lg.addColorStop(0.78, m([27, 25, 32], [76, 58, 28]));
      lg.addColorStop(1, m([15, 14, 19], [38, 28, 16]));
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.fill();
    }

    /* the coal seen through the piercings — the holes grow and blow out as it heats */
    ctx.globalCompositeOperation = 'lighter';
    const holes = 8;
    const hw = r * (0.085 + hot * 0.135), hh = r * (0.13 + hot * 0.24);
    for (let i = 0; i < holes; i++) {
      const th = (i / holes) * TAU;
      const rr = r * 0.62;
      const flick = 0.70 + Math.sin(tnow * 12 + i * 2.1) * 0.30;
      ctx.fillStyle = rgba(ember(clamp(0.10 + hot * 0.95 * flick, 0, 1)), 0.52 + hot * 0.46);
      ctx.beginPath();
      ctx.ellipse(Math.cos(th) * rr, Math.sin(th) * rr, hw, hh, th, 0, TAU);
      ctx.fill();
    }
    /* the eye of the coal: nothing at all when cold, a white pinpoint when lethal */
    if (hot > 0.02) {
      const cr = r * (0.34 + hot * 0.62);
      const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, cr);
      cg.addColorStop(0, rgba(ember(clamp(hot * 1.22, 0, 1)), clamp(0.35 + hot * 1.4, 0, 1)));
      cg.addColorStop(0.42, rgba(ember(hot * 0.96), clamp(0.20 + hot * 0.85, 0, 1)));
      cg.addColorStop(1, rgba(ember(hot * 0.55), 0));
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(0, 0, cr, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    if (!ghost && killing) {
      // a genuinely clipped pinpoint, only ever when this coal can kill
      ctx.globalCompositeOperation = 'lighter';
      const wr = r * (0.16 + hot * 0.10);
      const wg = ctx.createRadialGradient(0, 0, 0, 0, 0, wr * 2.2);
      wg.addColorStop(0, 'rgba(255,252,244,1)');
      wg.addColorStop(0.42, 'rgba(255,238,206,0.72)');
      wg.addColorStop(1, 'rgba(255,214,150,0)');
      ctx.fillStyle = wg;
      ctx.beginPath(); ctx.arc(0, 0, wr * 2.2, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    }
    if (!ghost) {
      // the rim states plainly whether this coal is hot enough to kill
      ctx.strokeStyle = killing
        ? rgba(ember(clamp(0.80 + hot * 0.20, 0, 1)), 0.60 + hot * 0.40)
        : 'rgba(112,104,120,' + ((0.32 + glow * 0.30) * (0.15 + WORLDK * 0.85)) + ')';
      ctx.lineWidth = (killing ? 2.2 : 1.4) * unit;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = 'rgba(230,206,164,' + ((0.10 + glow * 0.34) * (0.15 + WORLDK * 0.85)) + ')';
      ctx.lineWidth = 1.0 * unit;
      ctx.beginPath(); ctx.arc(0, 0, r * 0.80, -2.5, -0.6); ctx.stroke();
      const fk = 0.10 + WORLDK * 0.90;
      ctx.fillStyle = 'rgb(' + Math.round(lerp(58, 226, glow) * fk) + ',' +
        Math.round(lerp(54, 190, glow) * fk) + ',' + Math.round(lerp(64, 128, glow) * fk) + ')';
      ctx.beginPath(); ctx.arc(0, 0, r * 0.13, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(' + Math.round(lerp(96, 184, glow) * fk) + ',' +
        Math.round(lerp(90, 152, glow) * fk) + ',' + Math.round(lerp(104, 92, glow) * fk) + ',0.8)';
      ctx.lineWidth = 1.4 * unit;
      for (let i = 0; i < 3; i++) {
        const th = -a + (i / 3) * TAU;
        ctx.beginPath();
        ctx.arc(Math.cos(th) * r * 0.94, Math.sin(th) * r * 0.94, r * 0.12, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
  }
  return R;
}

/* ============================================================
   THE CHAIN
   ============================================================ */
function drawChain(chain, SEGS, heat) {
  ctx.save();
  for (let i = 0; i < SEGS - 1; i++) {
    const a = chain[i], b = chain[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const ang = Math.atan2(dy, dx);
    const f = i / (SEGS - 1);
    const glow = clamp((f - 0.45) / 0.55, 0, 1) * heat;
    for (let k = 0; k < 2; k++) {
      const tt = (k + 0.5) / 2;
      const lx = a.x + dx * tt, ly = a.y + dy * tt;
      const lw = d / 2 * 0.55, lh = 1.9 * unit + f * unit;
      const edge = (i + k) & 1;
      ctx.save();
      ctx.translate(lx, ly); ctx.rotate(ang);
      // brass near the coal, near-black at the hand: it is lit by one thing only
      const reach = 0.36 + f * f * 0.78;
      ctx.strokeStyle = glow > 0.04
        ? rgba(ember(clamp(0.08 + glow * 0.55, 0, 1)), (0.5 + glow * 0.5) * reach)
        : 'rgba(158,146,124,' + (0.52 * (0.12 + WORLDK * 0.88) * reach) + ')';
      ctx.lineWidth = 1.3 * unit;
      ctx.beginPath();
      if (edge) ctx.ellipse(0, 0, lw, lh, 0, 0, TAU);
      else ctx.ellipse(0, 0, lw * 0.9, lh * 0.4, 0, 0, TAU);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(248,238,216,' + ((0.26 + glow * 0.42) * (0.12 + WORLDK * 0.88) * reach) + ')';
      ctx.lineWidth = 0.7 * unit;
      ctx.beginPath();
      ctx.ellipse(0, 0, lw * 0.86, (edge ? lh : lh * 0.4) * 0.8, 0, -2.5, -0.85);
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();
}

/* ============================================================
   THE THURIFER
   ============================================================ */
function drawPlayer(p, hem, hx, hy, hurtFlick, tnow, coalK) {
  const K = 0.10 + WORLDK * 0.90;
  const dk = (c) => 'rgb(' + ((c[0] * K) | 0) + ',' + ((c[1] * K) | 0) + ',' + ((c[2] * K) | 0) + ')';
  const RK = clamp(Math.max(coalK === undefined ? 1 : coalK, WORLDK * 0.35), 0, 1);
  const r = p.r * unit * 1.30;              // drawn a touch bigger than it is hit
  const toL = Math.atan2(hy - p.y, hx - p.x);

  ctx.save();
  ctx.globalAlpha = hurtFlick ? 0.45 : 1;
  ctx.translate(p.x, p.y);

  // hem: cloth that lags behind the turn
  ctx.beginPath();
  ctx.moveTo(0, 0);
  for (let i = 0; i < hem.length; i++) ctx.lineTo(hem[i].x - p.x, hem[i].y - p.y);
  ctx.closePath();
  const hg = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.6);
  hg.addColorStop(0, dk([36, 26, 46]));
  hg.addColorStop(1, dk([10, 7, 16]));
  ctx.fillStyle = hg;
  ctx.fill();

  ctx.rotate(p.face + Math.PI / 2);

  ctx.beginPath();
  ctx.moveTo(0, -r * 1.42);
  ctx.bezierCurveTo(r * 1.12, -r * 0.92, r * 1.34, r * 0.55, r * 0.94, r * 1.66);
  ctx.lineTo(-r * 0.94, r * 1.66);
  ctx.bezierCurveTo(-r * 1.34, r * 0.55, -r * 1.12, -r * 0.92, 0, -r * 1.42);
  ctx.closePath();
  const rg = ctx.createLinearGradient(0, -r * 1.5, 0, r * 1.7);
  rg.addColorStop(0, dk([51, 38, 68]));
  rg.addColorStop(0.5, dk([29, 22, 40]));
  rg.addColorStop(1, dk([11, 8, 18]));
  ctx.fillStyle = rg;
  ctx.fill();

  ctx.strokeStyle = 'rgba(146,124,176,' + (0.085 * K) + ')';
  ctx.lineWidth = 1 * unit;
  for (const o of [-0.42, 0.46]) {
    ctx.beginPath();
    ctx.moveTo(r * o * 0.8, r * 0.05);
    ctx.quadraticCurveTo(r * o, r * 0.7, r * o * 1.30, r * 1.50);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.ellipse(0, -r * 0.44, r * 0.82, r * 0.74, 0, 0, TAU);
  ctx.fillStyle = '#07050c';
  ctx.fill();
  ctx.restore();

  // warm rim from the coal + a cold kicker on the far side: the figure gets an
  // edge on both sides and stops being a smudge
  ctx.save();
  ctx.globalAlpha = hurtFlick ? 0.4 : 1;
  ctx.translate(p.x, p.y);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.rotate(p.face + Math.PI / 2);
  // the robe's own outline, lit from wherever the coal happens to be
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.42);
  ctx.bezierCurveTo(r * 1.12, -r * 0.92, r * 1.34, r * 0.55, r * 0.94, r * 1.66);
  ctx.lineTo(-r * 0.94, r * 1.66);
  ctx.bezierCurveTo(-r * 1.34, r * 0.55, -r * 1.12, -r * 0.92, 0, -r * 1.42);
  ctx.closePath();
  const savedK = LITK;
  LITK = RK;
  rimShape(r * 1.5, [214, 196, 232], toL - p.face - Math.PI / 2, 3.0, 0.95);
  LITK = savedK;
  const eb = 0.70 + Math.sin(tnow * 2.3) * 0.16;
  ctx.fillStyle = 'rgba(255,206,120,' + (eb * (0.35 + RK * 0.65)) + ')';
  ctx.beginPath(); ctx.ellipse(-r * 0.25, -r * 0.52, r * 0.12, r * 0.09, 0.2, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.ellipse(r * 0.25, -r * 0.52, r * 0.12, r * 0.09, -0.2, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ============================================================
   THE ALTAR — three candles are the whole of your health plan.
   They are the second-brightest thing in the game and must never
   outrank the coal, so they are capped and they are never white.
   ============================================================ */
function drawAltar(candleList, tnow) {
  for (const c of candleList) {
    ctx.save();
    ctx.translate(c.x, c.y);

    // spilled wax pooled on the stone, then the taper itself
    const waxR = 9.0 * unit;
    ctx.fillStyle = 'rgba(30,25,32,0.75)';
    ctx.beginPath(); ctx.ellipse(0, waxR * 0.30, waxR * 1.75, waxR * 1.30, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c.lit ? 'rgba(74,64,58,0.90)' : 'rgba(38,33,40,0.90)';
    ctx.beginPath(); ctx.ellipse(0, waxR * 0.14, waxR * 1.42, waxR * 1.20, 0, 0, TAU); ctx.fill();
    const wg = ctx.createRadialGradient(-waxR * 0.32, -waxR * 0.36, 0, 0, 0, waxR);
    wg.addColorStop(0, c.lit ? 'rgb(196,180,148)' : 'rgb(70,64,66)');
    wg.addColorStop(0.62, c.lit ? 'rgb(138,120,90)' : 'rgb(48,43,48)');
    wg.addColorStop(1, c.lit ? 'rgb(74,62,44)' : 'rgb(28,25,30)');
    ctx.fillStyle = wg;
    ctx.beginPath(); ctx.arc(0, 0, waxR, 0, TAU); ctx.fill();
    // a run of wax down one side, different on each candle
    ctx.fillStyle = c.lit ? 'rgba(210,196,164,0.35)' : 'rgba(84,78,80,0.35)';
    ctx.beginPath();
    ctx.ellipse(Math.cos(c.seed * 2.1) * waxR * 0.62, Math.sin(c.seed * 2.1) * waxR * 0.62,
      waxR * 0.30, waxR * 0.46, c.seed, 0, TAU);
    ctx.fill();

    if (c.lit) {
      /* the flame: never neutral, never as bright as the coal, always moving */
      const f1 = Math.sin(tnow * 7.7 + c.seed * 3.1);
      const f2 = Math.sin(tnow * 13.3 + c.seed * 5.7);
      const f3 = Math.sin(tnow * 2.3 + c.seed);
      const fl = 0.88 + f1 * 0.08 + f2 * 0.045;
      const lean = (f3 * 0.5 + f1 * 0.25) * waxR * 0.20;
      const leanY = f2 * waxR * 0.10;
      ctx.save();
      ctx.translate(lean, leanY);
      ctx.globalCompositeOperation = 'lighter';
      // outer envelope, amber
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, waxR * 2.35 * fl);
      g.addColorStop(0, 'rgba(255,206,132,0.92)');
      g.addColorStop(0.22, 'rgba(255,168,74,0.52)');
      g.addColorStop(0.55, 'rgba(238,112,36,0.16)');
      g.addColorStop(1, 'rgba(220,96,30,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(0, 0, waxR * 2.35 * fl, waxR * 2.62 * fl, lean * 0.06, 0, TAU);
      ctx.fill();
      // the body of the flame, a little taller than wide
      const bg = ctx.createRadialGradient(0, waxR * 0.10, 0, 0, 0, waxR * 0.78 * fl);
      bg.addColorStop(0, 'rgba(255,232,178,0.95)');
      bg.addColorStop(0.55, 'rgba(255,190,104,0.62)');
      bg.addColorStop(1, 'rgba(255,150,60,0)');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, -waxR * 0.06, waxR * 0.46 * fl, waxR * 0.74 * fl, lean * 0.1, 0, TAU);
      ctx.fill();
      // the cool base where the wax is still burning off
      ctx.fillStyle = 'rgba(140,178,236,0.24)';
      ctx.beginPath();
      ctx.ellipse(0, waxR * 0.30, waxR * 0.24 * fl, waxR * 0.20 * fl, 0, 0, TAU);
      ctx.fill();
      ctx.restore();
      // the wick, dark, under all of it
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(24,16,14,0.85)';
      ctx.beginPath();
      ctx.ellipse(lean * 0.4, waxR * 0.22, waxR * 0.10, waxR * 0.16, 0, 0, TAU);
      ctx.fill();
    } else {
      // a black wick and a ring of soot: it stays out for the rest of the run
      ctx.fillStyle = 'rgba(9,7,10,0.95)';
      ctx.beginPath(); ctx.ellipse(0, 0, waxR * 0.26, waxR * 0.24, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 0.34;
      ctx.fillStyle = '#08060c';
      ctx.beginPath(); ctx.ellipse(0, 0, waxR * 1.05, waxR * 0.98, 0, 0, TAU); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }
}

/* ============================================================
   Sampling the same light the floor gets.
   The floor is albedo x light. If actors are not, the room's whole thesis is
   false in every frame: a creature stays bright in a room that has gone out.
   The lights are analytic, so this evaluates them directly — no readback.
   ============================================================ */
const FALLOFF = {
  pool: [[0, 1], [0.09, 0.76], [0.22, 0.48], [0.40, 0.255], [0.60, 0.110], [0.80, 0.032], [1, 0]],
  soft: [[0, 1], [0.32, 0.66], [0.62, 0.28], [0.85, 0.07], [1, 0]],
  hard: [[0, 1], [0.055, 0.70], [0.14, 0.38], [0.28, 0.175], [0.48, 0.075], [0.72, 0.024], [1, 0]]
};
function curveAt(d, soft) {
  const T = soft === 'pool' ? FALLOFF.pool : soft ? FALLOFF.soft : FALLOFF.hard;
  for (let i = 1; i < T.length; i++) {
    if (d <= T[i][0]) {
      const a = T[i - 1], b = T[i];
      return lerp(a[1], b[1], (d - a[0]) / (b[0] - a[0]));
    }
  }
  return 0;
}

let AMBK = 1;                    // whatever buildLight used this frame
const _L = { r: 0, g: 0, b: 0, lum: 0, coal: 0, cx: 0, cy: 0 };

function lightAt(x, y) {
  let r = AMBIENT[0] * AMBK, g = AMBIENT[1] * AMBK, b = AMBIENT[2] * AMBK;
  let coal = 0, cx = 0, cy = 0;
  for (let i = 0; i < lights.length; i++) {
    const l = lights[i];
    let dx = x - l.x, dy = y - l.y;
    if (l.rot) {
      const c = Math.cos(-l.rot), s = Math.sin(-l.rot);
      const nx = dx * c - dy * s; dy = dx * s + dy * c; dx = nx;
    }
    if (l.sx !== 1) dx /= l.sx;
    if (l.sy !== 1) dy /= l.sy;
    const d = Math.sqrt(dx * dx + dy * dy) / l.r;
    if (d >= 1) continue;
    const k = l.a * curveAt(d, l.soft);
    if (k <= 0.0006) continue;
    r += l.rgb[0] * k; g += l.rgb[1] * k; b += l.rgb[2] * k;
    if (l.warm) { coal += k; cx += (l.x - x) * k; cy += (l.y - y) * k; }
  }
  _L.r = r; _L.g = g; _L.b = b;
  _L.lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
  _L.coal = coal;
  const m = Math.hypot(cx, cy) || 1;
  _L.cx = cx / m; _L.cy = cy / m;
  return _L;
}

/* ============================================================
   THE CONGREGATION
   Law: the body is a hole in the lit floor. Colour arrives as light —
   a rim from the coal, a cold kicker opposite, self-lit marks inside.
   Every silhouette must be nameable in one frame at thirty pixels.
   ============================================================ */
/* Light the CURRENT PATH from the direction of the coal. A rim that follows the
   silhouette makes the thing look lit; a rim drawn as a circle over it just looks
   like a crescent stuck on top. */
let LITK = 1;   // how much of the coal reaches this thing
let LITE = 1;   // how much of ALL light reaches it
let TOA = -Math.PI / 2;   // which way the altar is, in the creature's local frame
function rimShape(r, col, toL, w, a) {
  const uw = Math.max(unit, 0.86);   // a hairline on a phone is not a rim
  const cold = a * (0.55 + 0.45 * LITK);   // the room lights the far edge no matter where the coal is
  a *= LITK;
  /* r is the silhouette's own reach, not the collision radius: the gradient has to
     put its full value ON the outline or a wide creature gets a fraction of the rim
     a narrow one gets, purely because of how far its edge sits from the centre. */
  const gx = Math.cos(toL), gy = Math.sin(toL), L = r * 1.06;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  let g = ctx.createLinearGradient(gx * L, gy * L, -gx * L * 0.55, -gy * L * 0.55);
  g.addColorStop(0, rgba(ember(0.86), a));
  g.addColorStop(0.26, rgba(ember(0.64), a * 0.52));
  g.addColorStop(0.58, rgba(col, a * 0.14));
  g.addColorStop(1, rgba(col, 0));
  ctx.strokeStyle = g; ctx.lineWidth = w * uw; ctx.stroke();
  g = ctx.createLinearGradient(gx * L, gy * L, -gx * L * 0.2, -gy * L * 0.2);
  g.addColorStop(0, 'rgba(255,214,150,' + (a * 0.26) + ')');
  g.addColorStop(0.24, 'rgba(255,180,110,0)');
  ctx.strokeStyle = g; ctx.lineWidth = w * 0.20 * unit; ctx.stroke();
  g = ctx.createLinearGradient(-gx * L, -gy * L, gx * L * 0.5, gy * L * 0.5);
  g.addColorStop(0, 'rgba(164,192,240,' + (cold * 0.34) + ')');
  g.addColorStop(0.45, 'rgba(120,146,200,0)');
  ctx.strokeStyle = g; ctx.lineWidth = w * 0.55 * uw; ctx.stroke();
  /* the altar's edge. Whatever the coal is doing, three candles are still burning
     somewhere behind you, and this is the floor under which no shape may sink. */
  const ax = Math.cos(TOA), ay = Math.sin(TOA);
  const guard = clamp(0.15 + (1 - LITE) * 0.14, 0, 0.32);
  g = ctx.createLinearGradient(ax * L, ay * L, -ax * L * 0.55, -ay * L * 0.55);
  g.addColorStop(0, 'rgba(158,178,218,' + guard + ')');
  g.addColorStop(0.42, 'rgba(130,152,196,0)');
  ctx.strokeStyle = g; ctx.lineWidth = Math.max(w * 0.60 * uw, 1.5); ctx.stroke();
  ctx.restore();
}

/* and a soft wash of the coal's light across the body's coal-facing half */
function litHalf(r, toL, a) {
  a *= 0.35 + LITK * 0.9;
  const gx = Math.cos(toL), gy = Math.sin(toL);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.clip();
  const g = ctx.createRadialGradient(gx * r * 0.85, gy * r * 0.85, 0, gx * r * 0.85, gy * r * 0.85, r * 1.7);
  g.addColorStop(0, rgba(ember(0.66), a));
  g.addColorStop(0.45, rgba(ember(0.42), a * 0.35));
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-r * 3, -r * 3, r * 6, r * 6);
  ctx.restore();
}

function rimPair(r, col, toL, spread, w, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = rgba(ember(0.70), a * 0.55);
  ctx.lineWidth = w * 0.40 * unit;
  ctx.beginPath(); ctx.arc(0, 0, r, toL - spread, toL + spread); ctx.stroke();
  ctx.strokeStyle = 'rgba(150,178,228,0.26)';
  ctx.lineWidth = w * 0.30 * unit;
  ctx.beginPath(); ctx.arc(0, 0, r, toL + Math.PI - spread * 0.85, toL + Math.PI + spread * 0.85); ctx.stroke();
  ctx.restore();
}

/* the same, but along an arbitrary path the caller has already built */
function rimPath(col, toL, w, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = rgba(ember(0.60), a * 0.55);
  ctx.lineWidth = w * unit;
  ctx.stroke();
  ctx.restore();
}

function bodyFill(r, col, albedo) {
  /* Albedo x the light that actually reaches it. Flat, because a baked highlight
     fights the coal and every creature ends up the same polished bean. */
  const k = (0.13 + LITE * 0.92) * (albedo === undefined ? 1 : albedo);
  const g = ctx.createLinearGradient(0, -r, 0, r);
  g.addColorStop(0, 'rgb(' + ((col[0] * 0.150 * k) | 0) + ',' + ((col[1] * 0.132 * k) | 0) + ',' + ((col[2] * 0.160 * k) | 0) + ')');
  g.addColorStop(1, 'rgb(' + ((col[0] * 0.058 * k) | 0) + ',' + ((col[1] * 0.050 * k) | 0) + ',' + ((col[2] * 0.082 * k) | 0) + ')');
  return g;
}

/* a dark pool directly under the thing, so it stands ON the floor */
function contact(r, k) {
  ctx.save();
  ctx.globalAlpha = k;
  const g = ctx.createRadialGradient(0, r * 0.18, 0, 0, r * 0.18, r * 1.5);
  g.addColorStop(0, 'rgba(2,1,5,0.85)');
  g.addColorStop(0.55, 'rgba(2,1,5,0.35)');
  g.addColorStop(1, 'rgba(2,1,5,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, r * 0.18, r * 1.5, r * 1.30, 0, 0, TAU); ctx.fill();
  ctx.restore();
}

function drawEnemy(e, tnow, hx, hy) {
  const ty = TYPES[e.type];
  const col = ty.rgb;
  const r = e.r;
  const L = lightAt(e.x, e.y);
  // how lit this thing actually is, and from where
  LITK = clamp(L.coal * 1.35, 0.015, 1.25);
  LITE = clamp(L.lum * 2.4, 0.05, 1.2);
  const toL = (L.coal > 0.004 ? Math.atan2(L.cy, L.cx) : Math.atan2(hy - e.y, hx - e.x)) - (e.rot || 0);
  // the altar is always somewhere behind you: its light is what keeps a distant
  // shape from becoming a hole in the floor
  TOA = Math.atan2(ROOM.altarY - e.y, W / 2 - e.x) - (e.rot || 0);
  const flash = e.flash > 0 ? clamp(e.flash / 0.12, 0, 1) : 0;

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.rot || 0);
  ctx.lineJoin = 'round';
  contact(r, clamp(0.25 + LITE * 0.95, 0, 1));
  const F = ENEMY_ART[e.type];
  if (F) F(e, r, col, toL, tnow, flash);
  if (flash > 0) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = flash * 0.95;
    ctx.fillStyle = rgba(ember(0.90), 1);
    ctx.beginPath(); ctx.arc(0, 0, r * 1.12, 0, TAU); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  LITK = 1; LITE = 1;
}

function fear0(e) { return LITK; }

const ENEMY_ART = {

  /* MILKSOP — tallow. Heavy, slumped, and dripping. Nothing on it is sharp. */
  milksop(e, r, col, toL, tt) {
    /* Two shoulders and a bowed head, and the head has to be a BUMP on the outline —
       a dark hollow inside the shape reads as a pot with a hole in it. Built from its
       own seed so a crowd of them is never a pattern. */
    const s = e.seed;
    const fear = LITK;
    const lean = Math.sin(s * 3.1) * 0.40;
    const wide = 1.30 + Math.sin(s * 1.7) * 0.16;
    const tall = (0.92 + Math.cos(s * 2.3) * 0.11) * (1 - fear * 0.12);
    const tremble = Math.sin(tt * (7.5 + fear * 16)) * (0.012 + fear * 0.040) + Math.sin(tt * 2.1 + s) * 0.038;
    const hr = r * 0.40;                                  // the head
    const hx0 = lean * r * 0.30, hy0 = -r * tall * 1.02;

    ctx.save();
    ctx.rotate(tremble);
    ctx.beginPath();
    // left shoulder up over the neck, round the head, down the right shoulder,
    // then in to a narrow base where it is kneeling
    ctx.moveTo(-r * wide, -r * tall * 0.02);
    ctx.bezierCurveTo(-r * wide * 0.92, -r * tall * 0.66, hx0 - r * 0.60, -r * tall * 0.80, hx0 - hr * 0.86, hy0 + hr * 0.52);
    ctx.arc(hx0, hy0, hr, Math.PI * 0.86, Math.PI * 0.14, true);
    ctx.bezierCurveTo(hx0 + r * 0.60, -r * tall * 0.80, r * wide * 0.92, -r * tall * 0.66, r * wide, -r * tall * 0.02);
    ctx.bezierCurveTo(r * wide * 0.94, r * tall * 0.56, r * 0.62, r * tall * 0.92, r * 0.28, r * tall * 0.96);
    ctx.quadraticCurveTo(0, r * tall * 1.06, -r * 0.28, r * tall * 0.96);
    ctx.bezierCurveTo(-r * 0.62, r * tall * 0.92, -r * wide * 0.94, r * tall * 0.56, -r * wide, -r * tall * 0.02);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col);
    ctx.fill();
    ctx.save(); litHalf(r * 1.35, toL, 0.30); ctx.restore();
    rimShape(r * 1.42, col, toL, 3.0, 0.95);

    // the hood's shadow, sitting inside the head bump
    ctx.beginPath();
    ctx.ellipse(hx0, hy0 + hr * 0.24, hr * 0.66, hr * 0.54, lean * 0.5, 0, TAU);
    ctx.fillStyle = 'rgba(3,2,6,0.88)';
    ctx.fill();

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    // tallow catches the high windows even where the coal never reaches
    ctx.strokeStyle = 'rgba(176,196,238,0.12)';
    ctx.lineWidth = 1.3 * unit;
    ctx.beginPath();
    ctx.arc(hx0, hy0, hr * 0.92, Math.PI * 1.00, Math.PI * 1.62);
    ctx.stroke();
    // cloth pulled tight over a back that has given up
    ctx.strokeStyle = rgba(col, 0.10 * LITK);
    ctx.lineWidth = 1.1 * unit;
    for (const o of [-0.70, -0.22, 0.34, 0.74]) {
      ctx.beginPath();
      ctx.moveTo(r * o * 0.72, -r * tall * 0.38);
      ctx.quadraticCurveTo(r * o * 1.06, r * tall * 0.22, r * o * 0.56, r * tall * 0.92);
      ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  },

  /* NINNYHAMMER — a dart with barbs. It rears, then it is where you were. */
  ninnyhammer(e, r, col, toL, tt) {
    const wind = e.wind || 0;
    const back = -r * 0.75 * wind;
    if (wind > 0.02) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const len = r * 11 * wind;
      const g = ctx.createLinearGradient(r, 0, len, 0);
      g.addColorStop(0, 'rgba(255,244,214,' + (0.46 * wind) + ')');
      g.addColorStop(0.35, 'rgba(255,146,66,' + (0.20 * wind) + ')');
      g.addColorStop(1, 'rgba(255,110,60,0)');
      ctx.fillStyle = g;
      const hw = (1.0 + wind * 3.4) * unit;
      ctx.fillRect(r, -hw / 2, len - r, hw);
      ctx.restore();
    }
    ctx.save();
    ctx.translate(back, 0);
    const barb = 1 + wind * 0.35;
    ctx.beginPath();
    ctx.moveTo(r * 2.35, 0);
    ctx.lineTo(-r * 0.30, r * 0.62 * barb);
    ctx.lineTo(-r * 1.15, r * 1.20 * barb);
    ctx.lineTo(-r * 0.62, 0);
    ctx.lineTo(-r * 1.15, -r * 1.20 * barb);
    ctx.lineTo(-r * 0.30, -r * 0.62 * barb);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col);
    ctx.fill();
    ctx.save(); litHalf(r * 1.4, toL, 0.26); ctx.restore();
    rimShape(r * 1.42, col, toL, 2.6, 0.95);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(ember(0.58), (0.30 + wind * 0.55) * (0.35 + LITK * 0.65));
    ctx.lineWidth = (1.9 + wind * 1.7) * unit;
    ctx.beginPath();
    ctx.moveTo(r * 2.35, 0); ctx.lineTo(-r * 0.30, -r * 0.62 * barb); ctx.lineTo(-r * 1.15, -r * 1.20 * barb);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 2.35, 0); ctx.lineTo(-r * 0.30, r * 0.62 * barb); ctx.lineTo(-r * 1.15, r * 1.20 * barb);
    ctx.stroke();
    ctx.strokeStyle = rgba(col, 0.24 * LITK);
    ctx.lineWidth = 1.3 * unit;
    ctx.beginPath(); ctx.moveTo(r * 2.0, 0); ctx.lineTo(-r * 0.5, 0); ctx.stroke();
    if (wind > 0.02) {
      ctx.fillStyle = 'rgba(255,248,228,' + (0.85 * wind) + ')';
      ctx.beginPath(); ctx.arc(r * 2.35, 0, r * 0.26 * wind, 0, TAU); ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  },

  /* POPINJAY — a fan of eyes. It will not be hit and it wants you to notice. */
  popinjay(e, r, col, toL, tt) {
    const d = e.dodge || 0;
    const spread = 0.72 + d * 0.68;
    ctx.save();
    ctx.rotate(Math.PI);
    for (let i = 0; i < 7; i++) {
      const a = (i / 6 - 0.5) * spread * 2;
      const L = r * (2.05 + Math.sin(tt * 5.5 + i * 1.2 + e.seed) * 0.16) * (1 + d * 0.30);
      ctx.save();
      ctx.rotate(a);
      // the quill, dark
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(L * 0.5, -r * 0.17, L, 0);
      ctx.quadraticCurveTo(L * 0.5, r * 0.17, 0, 0);
      const pk = 0.06 + LITE * 0.94;
      ctx.fillStyle = 'rgb(' + ((col[0] * 0.11 * pk) | 0) + ',' + ((col[1] * 0.12 * pk) | 0) + ',' + ((col[2] * 0.14 * pk) | 0) + ')';
      ctx.fill();
      rimShape(r * 0.9, col, toL - a - Math.PI, 1.7, 0.85);
      // an eye on the tip of every plume
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const eg = ctx.createRadialGradient(L * 0.88, 0, 0, L * 0.88, 0, r * 0.34);
      eg.addColorStop(0, rgba(col, (0.30 + d * 0.20) * LITK));
      eg.addColorStop(0.45, rgba(col, 0.08 * LITK));
      eg.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = eg;
      ctx.beginPath(); ctx.arc(L * 0.88, 0, r * 0.34, 0, TAU); ctx.fill();
      ctx.restore();
      // the vane, a thin bright spine
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = rgba(col, 0.14 * LITK);
      ctx.lineWidth = 0.9 * unit;
      ctx.beginPath(); ctx.moveTo(r * 0.2, 0); ctx.lineTo(L * 0.8, 0); ctx.stroke();
      ctx.restore();
      ctx.restore();
    }
    ctx.restore();
    ctx.beginPath();
    ctx.moveTo(r * 1.20, 0);
    ctx.bezierCurveTo(r * 0.6, -r * 0.86, -r * 0.7, -r * 0.80, -r * 0.95, 0);
    ctx.bezierCurveTo(-r * 0.7, r * 0.80, r * 0.6, r * 0.86, r * 1.20, 0);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col);
    ctx.fill();
    ctx.save(); litHalf(r * 1.1, toL, 0.24); ctx.restore();
    rimShape(r, col, toL, 3.4, 0.98);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.strokeStyle = rgba(col, 0.34 * LITK);
    ctx.lineWidth = 1.5 * unit;
    for (let i = 0; i < 3; i++) {
      const a = -0.5 + i * 0.5;
      ctx.beginPath();
      ctx.moveTo(r * 0.35, -r * 0.35);
      ctx.quadraticCurveTo(r * 0.7, -r * 0.9 + a * r * 0.2, r * 0.6 + a * r * 0.5, -r * 1.35);
      ctx.stroke();
    }
    ctx.fillStyle = rgba(col, 0.55 * LITK);
    ctx.beginPath(); ctx.arc(r * 0.62, -r * 0.16, r * 0.13, 0, TAU); ctx.fill();
    ctx.restore();
  },

  /* SPIGGOT — a cask on legs. Hoops are its health. The tap drinks your swing. */
  spiggot(e, r, col, toL, tt) {
    const swell = 1 + (e.drink || 0) * 0.13;
    ctx.save();
    ctx.scale(swell, swell);
    // stubby feet
    ctx.fillStyle = 'rgb(' + ((col[0] * 0.09) | 0) + ',' + ((col[1] * 0.09) | 0) + ',' + ((col[2] * 0.12) | 0) + ')';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * r * 0.52, r * 1.02, r * 0.24, r * 0.20, 0, 0, TAU);
      ctx.fill();
    }
    ctx.beginPath();
    ctx.moveTo(-r * 0.70, -r * 0.98);
    ctx.lineTo(r * 0.70, -r * 0.98);
    ctx.quadraticCurveTo(r * 1.04, 0, r * 0.70, r * 0.98);
    ctx.lineTo(-r * 0.70, r * 0.98);
    ctx.quadraticCurveTo(-r * 1.04, 0, -r * 0.70, -r * 0.98);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col);
    ctx.fill();
    ctx.save(); litHalf(r * 1.1, toL, 0.22); ctx.restore();
    rimShape(r, col, toL, 3.4, 0.95);
    // staves crowd toward the silhouette, the way staves on a barrel do
    ctx.strokeStyle = 'rgba(150,116,182,' + (0.16 * (0.2 + LITE * 0.8)) + ')';
    ctx.lineWidth = 1 * unit;
    for (const o of [-0.86, -0.58, -0.22, 0.16, 0.52, 0.84]) {
      ctx.beginPath();
      ctx.moveTo(r * o * 0.78, -r * 0.94);
      ctx.quadraticCurveTo(r * o * 1.02, 0, r * o * 0.78, r * 0.94);
      ctx.stroke();
    }
    // the spout, jutting forward
    const ik = 0.13 + LITE * 0.87;
    ctx.fillStyle = 'rgb(' + ((44 * ik) | 0) + ',' + ((40 * ik) | 0) + ',' + ((48 * ik) | 0) + ')';
    ctx.beginPath();
    ctx.moveTo(r * 0.20, r * 0.50); ctx.lineTo(r * 0.20, r * 1.42);
    ctx.lineTo(-r * 0.20, r * 1.42); ctx.lineTo(-r * 0.20, r * 0.50);
    ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const maxhp = TYPES.spiggot.hp;
    for (let i = 0; i < e.hp && i < 5; i++) {
      const oy = (-0.56 + i * (1.12 / Math.max(1, maxhp - 1))) * r;
      ctx.strokeStyle = 'rgba(126,120,132,' + (0.30 + LITK * 0.20) + ')';
      ctx.lineWidth = 3.0 * unit;
      ctx.beginPath();
      ctx.moveTo(-r * 0.86, oy); ctx.quadraticCurveTo(0, oy - r * 0.13, r * 0.86, oy);
      ctx.stroke();
      ctx.strokeStyle = rgba(ember(0.72), 0.42 * LITK);
      ctx.lineWidth = 1.2 * unit;
      ctx.beginPath();
      ctx.moveTo(-r * 0.86, oy - r * 0.045); ctx.quadraticCurveTo(0, oy - r * 0.175, r * 0.86, oy - r * 0.045);
      ctx.stroke();
    }
    const dr = e.drink || 0;
    ctx.fillStyle = rgba(col, (0.30 + dr * 0.70) * LITK);
    ctx.beginPath(); ctx.ellipse(0, r * 1.46, r * 0.09 * (1 + dr * 0.6), r * 0.15 * (1 + dr * 0.9), 0, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
  },

  /* TRAGGOT — a sac with two passengers pushing at the membrane. */
  traggot(e, r, col, toL, tt) {
    /* A bag with two lumps in it and a fault line between them. The outline itself
       has to say "this is about to become two things". */
    const p1 = tt * 1.5 + e.seed, p2 = p1 + Math.PI * 0.86;
    const bulge = (a) =>
      Math.pow(Math.max(0, Math.cos(a - p1)), 1.35) * 0.60 +
      Math.pow(Math.max(0, Math.cos(a - p2)), 1.35) * 0.54;
    const skin = (a, k) => r * (0.68 + Math.sin(a * 3 + tt * 1.7 + e.seed) * 0.04 + bulge(a)) * (k || 1);
    const outline = (k) => {
      ctx.beginPath();
      for (let i = 0; i <= 44; i++) {
        const a = (i / 44) * TAU, rr = skin(a, k);
        if (i === 0) ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
        else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
      }
      ctx.closePath();
    };

    outline();
    ctx.fillStyle = bodyFill(r, col, 2.1);
    ctx.fill();

    // the two of them, swelling the skin from underneath
    ctx.save();
    outline();
    ctx.clip();
    ctx.globalCompositeOperation = 'lighter';
    for (const [ph, sz] of [[p1, 0.60], [p2, 0.54]]) {
      const px = Math.cos(ph) * r * 0.46, py = Math.sin(ph) * r * 0.46;
      const g = ctx.createRadialGradient(px, py, 0, px, py, r * sz * 1.25);
      const lk = 0.34 + LITE * 0.66;
      g.addColorStop(0, rgba(col, 0.26 * lk));
      g.addColorStop(0.55, rgba(col, 0.085 * lk));
