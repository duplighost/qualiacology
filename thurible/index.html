      g.addColorStop(1, rgba(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.ellipse(px, py, r * sz * 1.25, r * sz * 0.96, ph, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // the fault line, where it will come apart
    const seam = (p1 + p2) / 2 + Math.PI / 2;
    ctx.save();
    outline();
    ctx.clip();
    ctx.strokeStyle = 'rgba(5,3,8,0.72)';
    ctx.lineWidth = 1.8 * unit;
    const tear = 0.30 + Math.abs(Math.sin(tt * 1.9 + e.seed)) * 0.22;
    ctx.beginPath();
    for (let i = -1; i <= 1; i += 2) {
      ctx.moveTo(0, 0);
      let px = 0, py = 0, ang = seam + (i < 0 ? Math.PI : 0);
      for (let k = 0; k < 3; k++) {
        ang += Math.sin(k * 2.7 + e.seed) * 0.55;
        px += Math.cos(ang) * r * tear * 0.45;
        py += Math.sin(ang) * r * tear * 0.45;
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
    ctx.restore();

    outline(1.02);
    rimShape(r * 1.30, col, toL, 4.2, 1.0);
    // the skin goes pale and tight over each lump, wherever the light is
    outline(0.62);
    rimShape(r * 0.82, col, toL, 2.0, 0.6);
  },

  runt(e, r, col, toL, tt) {
    /* Half of a traggot, out on its own and in a hurry. Smallest thing in the game,
       so it gets a whipping tail and a hot little eye to be findable by. */
    const w = Math.sin(tt * 13 + e.seed);
    ctx.beginPath();
    ctx.moveTo(r * 1.20, 0);
    ctx.quadraticCurveTo(r * 0.30, -r * 0.94, -r * 0.50, -r * 0.34 + w * r * 0.20);
    ctx.quadraticCurveTo(-r * 1.70, w * r * 0.62, -r * 2.30, w * r * 1.00);
    ctx.quadraticCurveTo(-r * 1.55, w * r * 0.34, -r * 0.50, r * 0.34 + w * r * 0.20);
    ctx.quadraticCurveTo(r * 0.30, r * 0.94, r * 1.20, 0);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col);
    ctx.fill();
    rimShape(r, col, toL, 2.4, 1.0);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(r * 0.46, 0, 0, r * 0.46, 0, r * 0.46);
    g.addColorStop(0, rgba(col, 0.55 * (0.40 + LITK * 0.60)));
    g.addColorStop(0.5, rgba(col, 0.16 * (0.40 + LITK * 0.60)));
    g.addColorStop(1, rgba(col, 0));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(r * 0.46, 0, r * 0.46, 0, TAU); ctx.fill();
    // the tail catches the room even when the coal does not
    const tg = ctx.createLinearGradient(-r * 0.5, 0, -r * 2.2, 0);
    tg.addColorStop(0, 'rgba(170,196,240,0.34)');
    tg.addColorStop(1, 'rgba(150,176,220,0)');
    ctx.strokeStyle = tg;
    ctx.lineWidth = 1.5 * unit;
    ctx.beginPath();
    ctx.moveTo(-r * 0.50, w * r * 0.10);
    ctx.quadraticCurveTo(-r * 1.5, w * r * 0.55, -r * 2.20, w * r * 0.96);
    ctx.stroke();
    ctx.restore();
  },

  /* BEAR — a caryatid. Half animal, half masonry, holding a piece of the roof off
     your head. Its health is the cracks running through it, and the entablature it
     carries is real stone: dark, jointed, and heavier than anything else in the room. */
  bear(e, r, col, toL, tt) {
    const maxhp = e.maxhp || 20;
    const dmg = 1 - clamp(e.hp / maxhp, 0, 1);
    const strain = Math.sin(tt * 1.15 + e.seed) * 0.016 + dmg * 0.030;
    const K = 0.05 + LITE * 0.95;
    const st = (c) => 'rgb(' + ((c[0] * K) | 0) + ',' + ((c[1] * K) | 0) + ',' + ((c[2] * K) | 0) + ')';

    /* ---- the entablature ---- */
    const sy = -r * 1.40, sh = r * 0.86, sw = r * 2.35;
    const sag = dmg * r * 0.10 + Math.sin(tt * 0.9 + e.seed) * r * 0.012;
    ctx.save();
    ctx.translate(0, sag);
    // the shadow it drops on everything under it
    ctx.globalAlpha = 0.92;
    ctx.drawImage(SHADOW, -sw * 1.25, sy + sh - r * 0.55, sw * 2.5, r * 1.9);
    ctx.globalAlpha = 1;
    // the block itself
    ctx.beginPath();
    ctx.moveTo(-sw, sy);
    ctx.lineTo(sw, sy);
    ctx.lineTo(sw * 0.955, sy + sh);
    ctx.lineTo(-sw * 0.955, sy + sh);
    ctx.closePath();
    const SK = 0.05 + clamp(LITE * 1.5, 0, 1.35) * 0.95;
    const sst = (c) => 'rgb(' + ((c[0] * SK) | 0) + ',' + ((c[1] * SK) | 0) + ',' + ((c[2] * SK) | 0) + ')';
    ctx.fillStyle = sst([64, 60, 82]);
    ctx.fill();
    rimShape(sw, [168, 178, 206], toL, 2.6, 0.55);
    // the near face, in shadow, and the top face catching whatever is above
    ctx.beginPath();
    ctx.moveTo(-sw * 0.955, sy + sh * 0.66);
    ctx.lineTo(sw * 0.955, sy + sh * 0.66);
    ctx.lineTo(sw * 0.955, sy + sh);
    ctx.lineTo(-sw * 0.955, sy + sh);
    ctx.closePath();
    ctx.fillStyle = sst([20, 17, 28]);
    ctx.fill();
    ctx.globalAlpha = 0.30;
    ctx.fillStyle = sst([150, 152, 184]);
    ctx.fillRect(-sw, sy, sw * 2, r * 0.06);
    ctx.globalAlpha = 1;
    // joints between the blocks, and chips out of the ends
    ctx.strokeStyle = 'rgba(4,3,8,0.65)';
    ctx.lineWidth = 2.0 * unit;
    for (const jx of [-0.52, -0.04, 0.48]) {
      ctx.beginPath();
      ctx.moveTo(sw * jx, sy);
      ctx.lineTo(sw * jx * 0.955, sy + sh);
      ctx.stroke();
    }

    // dust shaken loose where it is failing
    if (dmg > 0.25) {
      ctx.globalAlpha = (dmg - 0.25) * 0.5;
      ctx.fillStyle = st([120, 110, 130]);
      for (let i = 0; i < 7; i++) {
        const dx = Math.sin(i * 2.3 + e.seed) * sw * 0.8;
        ctx.fillRect(dx, sy + sh, 1.4 * unit, r * (0.2 + ((tt * 1.6 + i) % 1) * 0.9));
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    /* ---- the animal under it ---- */
    ctx.save();
    ctx.scale(1 + strain, 1 - strain);

    // arms, bent at the elbow, paws flat against the underside
    ctx.strokeStyle = st([72, 53, 44]);
    ctx.lineWidth = r * 0.44; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.66, -r * 0.02);
      ctx.lineTo(s * r * 1.26, -r * 0.56);
      ctx.lineTo(s * r * 1.30, sy + sh * 0.9 + sag);
      ctx.stroke();
    }
    ctx.fillStyle = st([84, 62, 50]);
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * r * 1.30, sy + sh * 0.92 + sag);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.34, r * 0.20, 0, 0, TAU);
      ctx.fill();
      // toes
      ctx.fillStyle = st([34, 25, 22]);
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.arc(i * r * 0.17, -r * 0.10, r * 0.07, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = st([62, 46, 38]);
      ctx.restore();
    }

    // ears
    for (const s of [-1, 1]) {
      ctx.beginPath(); ctx.arc(s * r * 0.70, -r * 0.70, r * 0.33, 0, TAU);
      ctx.fillStyle = st([40, 29, 25]); ctx.fill();
      ctx.beginPath(); ctx.arc(s * r * 0.70, -r * 0.70, r * 0.17, 0, TAU);
      ctx.fillStyle = st([22, 15, 14]); ctx.fill();
    }

    // the mass: not a circle. A hunched back seen from above.
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.02);
    ctx.bezierCurveTo(r * 0.72, -r * 0.98, r * 1.08, -r * 0.34, r * 1.02, r * 0.24);
    ctx.bezierCurveTo(r * 0.96, r * 0.86, r * 0.44, r * 1.14, 0, r * 1.10);
    ctx.bezierCurveTo(-r * 0.44, r * 1.14, -r * 0.96, r * 0.86, -r * 1.02, r * 0.24);
    ctx.bezierCurveTo(-r * 1.08, -r * 0.34, -r * 0.72, -r * 0.98, 0, -r * 1.02);
    ctx.closePath();
    ctx.fillStyle = bodyFill(r, col, 1.25);
    ctx.fill();
    ctx.save(); litHalf(r * 1.1, toL, 0.26); ctx.restore();
    rimShape(r * 1.06, col, toL, 4.6, 1.0);

    // fur, or the chisel marks of whoever carved it
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.02);
    ctx.bezierCurveTo(r * 0.72, -r * 0.98, r * 1.08, -r * 0.34, r * 1.02, r * 0.24);
    ctx.bezierCurveTo(r * 0.96, r * 0.86, r * 0.44, r * 1.14, 0, r * 1.10);
    ctx.bezierCurveTo(-r * 0.44, r * 1.14, -r * 0.96, r * 0.86, -r * 1.02, r * 0.24);
    ctx.bezierCurveTo(-r * 1.08, -r * 0.34, -r * 0.72, -r * 0.98, 0, -r * 1.02);
    ctx.closePath();
    ctx.clip();
    const R3 = mulberry(4242);
    ctx.strokeStyle = 'rgba(200,168,132,' + (0.055 * (0.2 + LITE * 0.8)) + ')';
    ctx.lineWidth = 1.4 * unit;
    for (let i = 0; i < 30; i++) {
      const a = R3() * TAU, d0 = (0.25 + R3() * 0.72) * r;
      const w = 0.20 + R3() * 0.28;
      ctx.beginPath();
      ctx.arc(0, 0, d0, a, a + w);
      ctx.stroke();
    }

    // the cracks: its health, and they get into the light as they open
    if (dmg > 0.02) {
      ctx.globalCompositeOperation = 'lighter';
      const R2 = mulberry(777);
      const n = 3 + Math.floor(dmg * 11);
      for (let i = 0; i < n; i++) {
        const flick = 0.75 + Math.sin(tt * 6 + i) * 0.25;
        ctx.strokeStyle = rgba(ember(0.40 + dmg * 0.48), (0.20 + dmg * 0.62) * flick);
        ctx.lineWidth = (0.9 + dmg * 2.2) * unit;
        ctx.beginPath();
        let px = 0, py = 0, ang = R2() * TAU;
        ctx.moveTo(0, 0);
        for (let s = 0; s < 5; s++) {
          ang += (R2() - 0.5) * 1.3;
          px += Math.cos(ang) * r * 0.26; py += Math.sin(ang) * r * 0.26;
          ctx.lineTo(px, py);
        }
        ctx.stroke();
      }
    }
    ctx.restore();

    // eyes, deep in the mass
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = rgba(col, 0.50 * clamp(0.35 + LITK, 0, 1));
    ctx.beginPath(); ctx.ellipse(-r * 0.28, -r * 0.18, r * 0.10, r * 0.070, 0.2, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.28, -r * 0.18, r * 0.10, r * 0.070, -0.2, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.restore();
  }
};

/* ============================================================
   PARTICLES
   ============================================================ */
function drawParticles(parts) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of parts) {
    if (p.kind === 'ash') continue;
    const f = clamp(p.life / p.max, 0, 1);
    const c = p.col ? p.col : ember(clamp(p.heat * f + 0.05, 0, 1));
    const a = f * f * (p.a || 1);
    if (p.kind === 'spark') {
      const vl = Math.hypot(p.vx, p.vy);
      const st = clamp(vl / 800, 0, 1);
      ctx.strokeStyle = rgba(c, a);
      ctx.lineWidth = p.r * (1 - st * 0.35);
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.018 * st, p.y - p.vy * 0.018 * st);
      ctx.stroke();
    } else {
      ctx.fillStyle = rgba(c, a);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + f * 0.6), 0, TAU); ctx.fill();
    }
  }
  ctx.restore();
  ctx.save();
  for (const p of parts) {
    if (p.kind !== 'ash') continue;
    const f = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = f * 0.5;
    ctx.fillStyle = '#181318';
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillRect(-p.r, -p.r * 0.35, p.r * 2, p.r * 0.7);
    ctx.restore();
  }
  ctx.restore();
}

function drawSpikes(spikes) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const s of spikes) {
    const f = clamp(s.life / s.max, 0, 1);
    const grow = 1 - f * f;
    const g = ctx.createLinearGradient(s.x, s.y,
      s.x + Math.cos(s.a) * s.len * grow, s.y + Math.sin(s.a) * s.len * grow);
    g.addColorStop(0, rgba(ember(0.98), f * s.k));
    g.addColorStop(0.45, rgba(ember(0.78), f * s.k * 0.5));
    g.addColorStop(1, rgba(ember(0.5), 0));
    ctx.strokeStyle = g;
    ctx.lineWidth = s.w * f;
    ctx.beginPath();
    ctx.moveTo(s.x + Math.cos(s.a) * s.len * grow * 0.12, s.y + Math.sin(s.a) * s.len * grow * 0.12);
    ctx.lineTo(s.x + Math.cos(s.a) * s.len * grow, s.y + Math.sin(s.a) * s.len * grow);
    ctx.stroke();
  }
  ctx.restore();
}

function drawRings(rings) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings) {
    const f = clamp(r.life / r.max, 0, 1);
    const rr = r.r0 + (r.r1 - r.r0) * (1 - f * f);
    const w = r.w * unit * (0.2 + f * 0.8);
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = rgba(r.col, f * f * r.a * [0.22, 0.42, 1][k]);
      ctx.lineWidth = w * [3.2, 1.7, 0.7][k];
      ctx.beginPath(); ctx.arc(r.x, r.y, rr, 0, TAU); ctx.stroke();
    }
  }
  ctx.restore();
}

const Audio_ = {
  ok: false, muted: false, ac: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ac = new AC();
      this.ac = ac;
      const master = ac.createGain(); master.gain.value = 0.9;
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.25;

      // a stone room: long, dark, cheap convolution
      const rl = Math.floor(ac.sampleRate * 2.6);
      const ir = ac.createBuffer(2, rl, ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < rl; i++) {
          const t = i / rl;
          d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.6) * (i < 400 ? i / 400 : 1);
        }
      }
      const verb = ac.createConvolver(); verb.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.34;
      const damp = ac.createBiquadFilter(); damp.type = 'lowpass'; damp.frequency.value = 2600;
      master.connect(comp);
      master.connect(damp); damp.connect(verb); verb.connect(wet); wet.connect(comp);
      comp.connect(ac.destination);
      this.master = master;

      const dg = ac.createGain(); dg.gain.value = 0.0; dg.connect(master);
      const dlp = ac.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 520; dlp.connect(dg);
      const o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55;
      const o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 55.6;
      const o3 = ac.createOscillator(); o3.type = 'triangle'; o3.frequency.value = 82.5;
      const g3 = ac.createGain(); g3.gain.value = 0.0;
      o1.connect(dlp); o2.connect(dlp); o3.connect(g3); g3.connect(dlp);
      o1.start(); o2.start(); o3.start();
      this.drone = dg; this.fifth = g3;

      const len = ac.sampleRate * 2;
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 1.4;
      const wg = ac.createGain(); wg.gain.value = 0;
      src.connect(bp); bp.connect(wg); wg.connect(master);
      src.start();
      this.whoosh = wg; this.whooshF = bp;
      this.ok = true;
    } catch (e) { this.ok = false; }
  },
  setDrone(v, heat) {
    if (!this.ok) return;
    const t = this.ac.currentTime;
    this.drone.gain.setTargetAtTime(this.muted ? 0 : v, t, 0.4);
    this.fifth.gain.setTargetAtTime(this.muted ? 0 : heat * 0.5, t, 0.5);
  },
  setSwing(s) {
    if (!this.ok) return;
    const t = this.ac.currentTime;
    const g = this.muted ? 0 : Math.pow(s, 1.6) * 0.22;
    this.whoosh.gain.setTargetAtTime(g, t, 0.04);
    this.whooshF.frequency.setTargetAtTime(280 + s * 2200, t, 0.05);
  },
  noise(dur, f0, f1, vol, type) {
    if (!this.ok || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = this.noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = type || 'bandpass'; bp.Q.value = 1.1;
    bp.frequency.setValueAtTime(f0, t);
    bp.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(bp); bp.connect(g); g.connect(this.master);
    s.start(t); s.stop(t + dur + 0.02);
  },
  bell(freq, dur, vol) {
    if (!this.ok || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const car = ac.createOscillator(); car.type = 'sine'; car.frequency.value = freq;
    const mod = ac.createOscillator(); mod.type = 'sine'; mod.frequency.value = freq * 2.41;
    const mg = ac.createGain(); mg.gain.setValueAtTime(freq * 1.6, t);
    mg.gain.exponentialRampToValueAtTime(1, t + dur * 0.5);
    mod.connect(mg); mg.connect(car.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    car.connect(g); g.connect(this.master);
    car.start(t); mod.start(t); car.stop(t + dur + 0.02); mod.stop(t + dur + 0.02);
  },
  tone(freq, dur, vol, type) {
    if (!this.ok || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = type || 'triangle'; o.frequency.setValueAtTime(freq, t);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  },
  slide(f0, f1, dur, vol, type) {
    if (!this.ok || this.muted) return;
    const ac = this.ac, t = ac.currentTime;
    const o = ac.createOscillator(); o.type = type || 'sawtooth';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.02);
  }
};

  if (!dragging) return;

  const p = pointerPos(e);
  if (isTouch) { player.tx += (p.x - lastPX); player.ty += (p.y - lastPY); }
  else { player.tx = p.x; player.ty = p.y; }
  lastPX = p.x; lastPY = p.y;

  player.ty = clamp(player.ty, PAD, H - PAD);
}

function buildWave(n) {
  const q = [];
  const push = (type, k) => { for (let i = 0; i < k; i++) q.push(type); };
  push('milksop', 3 + Math.floor(n * 1.2));
  if (n >= 2) push('ninnyhammer', 1 + Math.floor(n * 0.75));
  if (n >= 3) push('popinjay', 1 + Math.floor((n - 2) * 0.55));
  if (n >= 4) push('spiggot', 1 + Math.floor((n - 3) * 0.4));
  if (n >= 5) push('traggot', 1 + Math.floor((n - 4) * 0.5));
  if (n === 8 || (n > 8 && (n - 8) % 5 === 0)) push('bear', 1);
  for (let i = q.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const tmp = q[i]; q[i] = q[j]; q[j] = tmp; }
  return q;
}

function spark(x, y, n, spd, heat0, col) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(0.15, 1) * spd * unit;
    parts.push({
      kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(0.22, 0.85), max: 0.85, r: rnd(1.0, 2.6) * unit,
      heat: heat0 === undefined ? 0.85 : heat0, col: col || null, a: 1, drag: 0.93
    });
  }
}
function ash(x, y, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(0.1, 1) * spd * unit;
    parts.push({
      kind: 'ash', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: rnd(1.1, 2.6), max: 2.6, r: rnd(1.4, 3.4) * unit,
      rot: rnd(0, TAU), spin: rnd(-3, 3), drag: 0.88
    });
  }
}
function ring(x, y, r0, r1, life, col, a, w) {
  rings.push({ x, y, r0, r1, life, max: life, col, a, w });
}
function bang(x, y, r, k) {
  flashes.push({ x, y, r, life: 0.26, max: 0.26, k });
}
/* short bright spikes thrown out of the impact, gone in a tenth of a second */
function starburst(x, y, n, len, k) {
  const a0 = rnd(0, TAU);
  for (let i = 0; i < n; i++) {
    const a = a0 + (i / n) * TAU + rnd(-0.16, 0.16);
    spikes.push({ x, y, a, len: len * rnd(0.7, 1.6), life: 0.11, max: 0.11, k, w: rnd(1.4, 3.2) * unit });
  }
}

/* ---------------- update ---------------- */
function update(dt) {
  t += dt;

  const kx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  const ky = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  if (kx || ky) {
    const m = Math.hypot(kx, ky) || 1;
    player.tx = clamp(player.tx + (kx / m) * 620 * unit * dt, PAD, W - PAD);
    player.ty = clamp(player.ty + (ky / m) * 620 * unit * dt, PAD, H - PAD);
  }

  const dx = player.tx - player.x, dy = player.ty - player.y;
  const k = 1 - Math.pow(0.0009, dt);
  player.vx = dx * k / Math.max(dt, 0.0001);
  player.vy = dy * k / Math.max(dt, 0.0001);
  player.x += dx * k; player.y += dy * k;
  player.x = clamp(player.x, PAD, W - PAD);
  player.y = clamp(player.y, PAD, H - PAD);
  if (Math.hypot(player.vx, player.vy) > 20) player.face = Math.atan2(player.vy, player.vx);

  simChain(dt);
  simHem(dt);

  const h = head();
  const spd = headSpeed();
  const spd01 = clamp((spd - 120) / 1700, 0, 1);
  const KILL = 780 * unit, NUDGE = 340 * unit, WHITE = 2300 * unit;

  heat += (clamp((spd - KILL) / (WHITE - KILL), 0, 1) * 1.35 - 0.95) * dt;
  heat = clamp(heat, 0, 1);
  const mult = 1 + Math.floor(heat * 4.999);
  const headR = (19 + heat * 13) * unit;

  Audio_.setSwing(spd01);
  Audio_.setDrone(0.07 + heat * 0.05, heat);

  trail.push({ x: h.x, y: h.y, s: spd01, t: t });
  while (trail.length && t - trail[0].t > 0.62) trail.shift();
  if (trail.length > 90) trail.shift();

  emitCenser(dt, h, spd01, spd, KILL);

  moonAlpha = clamp(moonAlpha + (heat > 0.82 ? dt * 1.6 : -dt * 1.1), 0, 1);
  waveGlow = Math.max(0, waveGlow - dt * 0.55);

  if (betweenWaves > 0) {
    betweenWaves -= dt;
    if (betweenWaves <= 0) nextWave();
  } else if (spawnQueue.length) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnAt(spawnQueue.shift());
      spawnTimer = clamp(0.82 - wave * 0.035, 0.19, 0.82) * rnd(0.7, 1.3);
    }
  } else if (enemies.length === 0) {
    betweenWaves = 1.5;
    score += 250 * wave;
    if (wave % 3 === 0 && candles < 3) {
      candles++;
      relightCandle();
    }
  }

  if (iframes > 0) iframes -= dt;
  if (chainTimer > 0) { chainTimer -= dt; if (chainTimer <= 0) killChain = 0; }
  hurt = Math.max(0, hurt - dt * 2.2);
  flash = Math.max(0, flash - dt * 7.5);
  if (shockA > 0) { shockA = Math.max(0, shockA - dt * 2.2); shockR += dt * 0.85; }

  /* ---- enemies: behaviour is untouched ---- */
  let bearAlive = false;
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const ty = TYPES[e.type];
    if (e.type === 'bear') bearAlive = true;
    if (e.flash > 0) e.flash -= dt;
    e.dodge = Math.max(0, e.dodge - dt * 2.4);
    e.drink = Math.max(0, e.drink - dt * 1.8);
    const toP = Math.atan2(player.y - e.y, player.x - e.x);
    const distP = Math.hypot(player.x - e.x, player.y - e.y);

    if (e.stagger > 0) {
      e.stagger -= dt;
      e.x += e.vx * dt; e.y += e.vy * dt;
      e.vx *= 0.9; e.vy *= 0.9;
      e.wind = 0;
    } else {
      switch (e.type) {
        case 'milksop': {
          const wob = Math.sin(t * 2.4 + e.seed) * 0.5;
          e.x += Math.cos(toP + wob) * e.spd * dt;
          e.y += Math.sin(toP + wob) * e.spd * dt;
          break;
        }
        case 'ninnyhammer': {
          e.timer -= dt;
          if (e.timer > 0 && e.timer < 0.45) { e.wind = clamp((0.45 - e.timer) / 0.45, 0, 1); }
          else if (e.timer <= 0) {
            e.vx = Math.cos(toP) * 620 * unit; e.vy = Math.sin(toP) * 620 * unit;
            e.timer = rnd(1.5, 2.4); e.stagger = 0.45; e.wind = 0;
            spark(e.x, e.y, 7, 210, 0.55, ty.rgb);
            Audio_.noise(0.16, 1400, 500, 0.05);
          } else {
            e.wind = 0;
            e.x += Math.cos(toP) * e.spd * dt; e.y += Math.sin(toP) * e.spd * dt;
          }
          break;
        }
        case 'popinjay': {
          const dh = Math.hypot(h.x - e.x, h.y - e.y);
          if (dh < 120 * unit && spd > NUDGE) {
            const away = Math.atan2(e.y - h.y, e.x - h.x);
            e.x += Math.cos(away) * e.spd * 1.5 * dt;
            e.y += Math.sin(away) * e.spd * 1.5 * dt;
            e.dodge = 1;
          } else {
            const orbit = toP + (Math.sin(t * 0.8 + e.seed) > 0 ? 1 : -1) * (distP > 165 * unit ? 0.35 : 1.35);
            e.x += Math.cos(orbit) * e.spd * dt;
            e.y += Math.sin(orbit) * e.spd * dt;
          }
          break;
        }
        case 'spiggot': {
          e.x += Math.cos(toP) * e.spd * dt; e.y += Math.sin(toP) * e.spd * dt;
          break;
        }
        case 'traggot':
        case 'runt': {
          const wob = Math.sin(t * 5 + e.seed) * 0.32;
          e.x += Math.cos(toP + wob) * e.spd * dt;
          e.y += Math.sin(toP + wob) * e.spd * dt;
          break;
        }
        case 'bear': {
          e.x += Math.cos(toP) * e.spd * dt; e.y += Math.sin(toP) * e.spd * dt;
          break;
        }
      }
    }

    // presentation only: which way is it facing
    if (e.type === 'ninnyhammer') e.rot = toP;
    else if (e.type === 'popinjay') e.rot = lerpAngle(e.rot, toP, 1 - Math.pow(0.001, dt));
    else if (e.type === 'traggot' || e.type === 'runt') e.rot = t * 1.4 + e.seed;
    else if (e.type === 'milksop') e.rot = Math.sin(t * 1.5 + e.seed) * 0.12;
    else e.rot = 0;

    const dh = Math.hypot(h.x - e.x, h.y - e.y);
    if (dh < e.r + headR) {
      if (spd > KILL) {
        e.hp -= (spd > WHITE ? 3 : 1);
        e.flash = 0.12;
        const kb = Math.atan2(e.y - h.y, e.x - h.x);
        e.vx = Math.cos(kb) * 320 * unit; e.vy = Math.sin(kb) * 320 * unit; e.stagger = 0.22;
        if (e.type === 'spiggot' && e.hp > 0) {
          for (let s = 1; s < SEGS; s++) chain[s].px = lerp(chain[s].px, chain[s].x, -0.45);
          e.drink = 1;
          spark(e.x, e.y, 14, 260, 0.5, ty.rgb);
          ring(e.x, e.y, e.r * 1.6, e.r * 0.2, 0.45, ty.rgb, 0.7, 2.4);
          Audio_.noise(0.22, 300, 90, 0.12, 'lowpass');
        }
        if (e.hp <= 0) killEnemy(i, e, spd, WHITE, mult);
        else {
          spark(e.x, e.y, 9, 230, 0.75);
          ring(e.x, e.y, e.r * 0.4, e.r * 2.1, 0.28, ember(0.75), 0.55, 2);
          Audio_.noise(0.1, 1800, 700, 0.06);
        }
      } else if (spd > NUDGE) {
        const kb = Math.atan2(e.y - h.y, e.x - h.x);
        e.vx = Math.cos(kb) * 170 * unit; e.vy = Math.sin(kb) * 170 * unit; e.stagger = 0.18;
        if (Math.random() < 0.35) spark(e.x, e.y, 2, 120, 0.35);
        if (Math.random() < 0.2) Audio_.noise(0.07, 500, 200, 0.04, 'lowpass');
      }
    }

    if (distP < e.r + player.r * unit && iframes <= 0 && !GOD) {
      candles--;
      iframes = 1.5;
      shake = 18;
      hurt = 1;
      snuffCandle();
      Audio_.noise(0.5, 1200, 120, 0.2, 'lowpass');
      Audio_.slide(180, 60, 0.5, 0.12, 'square');
      spark(player.x, player.y, 30, 420, 0.2, [255, 70, 82]);
      ring(player.x, player.y, player.r * unit, 150 * unit, 0.5, [255, 70, 82], 0.8, 3);
      const kb = Math.atan2(e.y - player.y, e.x - player.x);
      e.vx = Math.cos(kb) * 420 * unit; e.vy = Math.sin(kb) * 420 * unit; e.stagger = 0.4;
      heat *= 0.35;
      if (candles <= 0) { die(); return; }
    }

    if (e.x < -260 || e.x > W + 260 || e.y < -260 || e.y > H + 260) {
      if (t - e.born > 6) enemies.splice(i, 1);
    }
  }

  sag = clamp(sag + (bearAlive ? dt * 0.7 : -dt * 1.2), 0, 1);
  stepParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 52);
}

function lerpAngle(a, b, k) {
  let d = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
  return a + d * k;
}

function simChain(dt) {
  const hand = { x: player.x + Math.cos(player.face) * 6 * unit, y: player.y + Math.sin(player.face) * 6 * unit };
  const damp = limp ? 0.90 : 0.992;
  for (let i = 1; i < SEGS; i++) {
    const p = chain[i];
    const vx = (p.x - p.px) * damp, vy = (p.y - p.py) * damp;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy;
  }
  chain[0].x = hand.x; chain[0].y = hand.y; chain[0].px = hand.x; chain[0].py = hand.y;
  for (let it = 0; it < 5; it++) {
    for (let i = 0; i < SEGS - 1; i++) {
      const a = chain[i], b = chain[i + 1];
      const ax = b.x - a.x, ay = b.y - a.y;
      const d = Math.hypot(ax, ay) || 0.0001;
      const diff = (d - segLen) / d;
      const w = i === 0 ? 0 : 0.5;
      const mv = i === 0 ? 1 : 0.5;
      a.x += ax * diff * w; a.y += ay * diff * w;
      b.x -= ax * diff * mv; b.y -= ay * diff * mv;
    }
    chain[0].x = hand.x; chain[0].y = hand.y;
  }
  const h = head();
  if (!limp) {
    const hd = Math.hypot(h.x - hand.x, h.y - hand.y);
    if (hd < segLen * 1.2) {
      const a = t * 3.1;
      h.x += Math.cos(a) * 26 * unit * dt * 8;
      h.y += Math.sin(a) * 26 * unit * dt * 8;
    }
  }
  h.x = clamp(h.x, -30, W + 30); h.y = clamp(h.y, -30, H + 30);
}

function simHem(dt) {
  const r = player.r * unit;
  for (let i = 0; i < hem.length; i++) {
    const a = (i / (hem.length - 1)) * Math.PI + player.face + Math.PI / 2;
    const tx = player.x + Math.cos(a) * r * 1.62;
    const ty = player.y + Math.sin(a) * r * 1.62;
    const p = hem[i];
    const vx = (p.x - p.px) * 0.80, vy = (p.y - p.py) * 0.80;
    p.px = p.x; p.py = p.y;
    p.x += vx; p.y += vy;
    const kk = 1 - Math.pow(0.00004, dt);
    p.x += (tx - p.x) * kk; p.y += (ty - p.y) * kk;
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d > r * 2.5) {
      const s = r * 2.5 / d;
      p.x = player.x + (p.x - player.x) * s;
      p.y = player.y + (p.y - player.y) * s;
    }
  }
}

let smokeAcc = 0;
function emitCenser(dt, h, spd01, spd, KILL) {
  // incense: dense, continuous, thicker the harder you swing
  smokeAcc += dt * (86 + spd01 * 170);
  while (smokeAcc > 1) {
    smokeAcc -= 1;
    /* Braid the plume as it is laid down: puffs go off to either side of the
       swing, alternating, so the smoke curls instead of tracing one wire. */
    const vx = h.x - h.px, vy = h.y - h.py;
    const vl = Math.hypot(vx, vy) || 1;
    const px = -vy / vl, py = vx / vl;
    const ph = t * 5.2 + smokeAcc;
    const side = Math.sin(ph) * (5 + spd01 * 22) * unit;
    const back = rnd(0, 1) * vl * 3;
    const j = 4 * unit;
    stampSmoke(h.x + px * side - vx * back / vl + rnd(-j, j),
      h.y + py * side - vy * back / vl + rnd(-j, j),
      rnd(16, 42) * unit, 0.20 + spd01 * 0.23 + heat * 0.12);
    if (Math.random() < 0.22) {
      stampSmoke(h.x - px * side * 1.4 + rnd(-j, j), h.y - py * side * 1.4 + rnd(-j, j),
        rnd(26, 62) * unit, 0.07 + spd01 * 0.08);
    }
  }
  // sparks spat from the piercings
  if (Math.random() < spd01 * 0.9 + heat * 0.4) {
    const a = rnd(0, TAU), s = rnd(30, 150) * unit;
    parts.push({
      kind: 'spark', x: h.x, y: h.y,
      vx: Math.cos(a) * s - (h.x - h.px) * 12, vy: Math.sin(a) * s - (h.y - h.py) * 12,
      life: rnd(0.25, 0.8), max: 0.8, r: rnd(0.8, 2.0) * unit,
      heat: clamp(0.45 + spd01 * 0.55, 0, 1), a: 0.9, drag: 0.94
    });
  }
  // soot laid down when the coal is really up
  if (spd > KILL && Math.random() < 0.28) sootTrail(h.x, h.y, 18 * unit, 0.016 + heat * 0.018);
}

function stepParticles(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const d = Math.pow(p.drag || 0.94, dt * 60);
    p.vx *= d; p.vy *= d;
    if (p.kind === 'ash') p.rot += p.spin * dt;
  }
  for (let i = rings.length - 1; i >= 0; i--) { rings[i].life -= dt; if (rings[i].life <= 0) rings.splice(i, 1); }
  for (let i = flashes.length - 1; i >= 0; i--) { flashes[i].life -= dt; if (flashes[i].life <= 0) flashes.splice(i, 1); }
  for (let i = spikes.length - 1; i >= 0; i--) { spikes[i].life -= dt; if (spikes[i].life <= 0) spikes.splice(i, 1); }
}

function snuffCandle() {
  for (let i = candleList.length - 1; i >= 0; i--) {
    if (candleList[i].lit) {
      candleList[i].lit = false; candleList[i].snuff = 4.5;
      for (let k = 0; k < 26; k++) stampSmoke(candleList[i].x + rnd(-7, 7), candleList[i].y + rnd(-7, 7), rnd(9, 22) * unit, 0.10);
      Audio_.noise(0.35, 2600, 400, 0.10);
      break;
    }
  }
}
function relightCandle() {
  for (const c of candleList) {
    if (!c.lit) {
      c.lit = true; c.snuff = 0;
      const h = head();
      // a spark travels from the coal to the wick
      for (let i = 0; i < 10; i++) {
        const a = Math.atan2(c.y - h.y, c.x - h.x) + rnd(-0.3, 0.3);
        const s = rnd(300, 620) * unit;
        parts.push({ kind: 'spark', x: h.x, y: h.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.4, 0.7), max: 0.7, r: 1.8 * unit, heat: 0.95, a: 1, drag: 0.98 });
      }
      ring(c.x, c.y, 4 * unit, 70 * unit, 0.7, ember(0.8), 0.8, 2);
      Audio_.bell(392, 1.3, 0.16);
      Audio_.bell(587.33, 1.1, 0.10);
      break;
    }
  }
}

function killEnemy(i, e, spd, WHITE, mult) {
  const ty = TYPES[e.type];
  const white = spd > WHITE;
  enemies.splice(i, 1);
  killChain++; chainTimer = 1.6; killCount++;
  score += Math.round(ty.score * mult * (1 + Math.min(killChain, 12) * 0.06));

  const big = e.type === 'bear';
  const R = e.r;

  // the coal goes through it: a hard white core, then everything it was made of
  const hv = head();
  const swx = (hv.x - hv.px) * 34, swy = (hv.y - hv.py) * 34;
  bang(e.x, e.y, R * (big ? 5.0 : 2.4), big ? 1.9 : (white ? 1.5 : 1.05));
  spark(e.x, e.y, big ? 150 : 42, big ? 700 : 430, white ? 1 : 0.86);
  spark(e.x, e.y, big ? 46 : 14, big ? 340 : 230, 0.5, ty.rgb);
  // everything the coal knocked loose keeps the coal's momentum
  for (let k = parts.length - 1; k >= 0 && k > parts.length - (big ? 200 : 60); k--) {
    parts[k].vx += swx; parts[k].vy += swy;
  }
  ash(e.x, e.y, big ? 44 : 12, big ? 260 : 170);
  // a fast thin ring, and a slower fat one behind it
  ring(e.x, e.y, R * 0.6, R * (big ? 7.5 : 4.2), big ? 0.34 : 0.22, ember(0.94), 0.95, big ? 3.4 : 2.0);
  ring(e.x, e.y, R * 0.3, R * (big ? 13 : 6.4), big ? 0.95 : 0.52, ember(white ? 0.96 : 0.80), white ? 0.85 : 0.62, big ? 6 : 3.2);
  if (white || big) ring(e.x, e.y, R * 0.2, R * (big ? 19 : 9.6), big ? 1.3 : 0.72, ember(0.88), 0.34, big ? 3.5 : 1.8);
  // a star of embers thrown along the swing
  starburst(e.x, e.y, big ? 9 : 6, R * (big ? 4.6 : 2.6), white || big ? 1 : 0.72);
  // the incense gets punched out of the way
  for (let k = 0; k < (big ? 26 : 9); k++) {
    const a = rnd(0, TAU), d = R * rnd(1.1, big ? 4.0 : 2.4);
    stampSmoke(e.x + Math.cos(a) * d, e.y + Math.sin(a) * d, R * rnd(0.7, 1.5), big ? 0.16 : 0.09);
  }
  scorch(e.x, e.y, R * (big ? 2.6 : 1.45), big ? 0.55 : 0.30);
  flash = Math.min(0.55, flash + (big ? 0.42 : white ? 0.22 : 0.12));

  hitstop = white ? 0.075 : 0.04;
  shake = Math.min(24, shake + (big ? 26 : 6));
  Audio_.bell(SCALE[Math.min(SCALE.length - 1, Math.min(killChain, 9))], 0.9, 0.16);
  if (white) Audio_.bell(SCALE[Math.min(SCALE.length - 1, Math.min(killChain, 9))] * 2, 0.5, 0.08);

  if (e.type === 'traggot' && !white) {
    for (let k = 0; k < 2; k++) {
      const a = rnd(0, TAU);
      enemies.push({
        type: 'runt', x: e.x + Math.cos(a) * 18, y: e.y + Math.sin(a) * 18,
        vx: 0, vy: 0, r: TYPES.runt.r * unit, hp: 1, maxhp: 1, spd: TYPES.runt.spd * unit,
        seed: rnd(0, TAU), timer: 0, ang: 0, stagger: 0.2, flash: 0, born: t,
        rot: 0, wind: 0, dodge: 0, drink: 0
      });
    }
    ring(e.x, e.y, e.r * 1.2, e.r * 0.3, 0.4, ty.rgb, 0.9, 3);
  }
  if (e.type === 'bear') {
    shake = 32;
    shockA = 1; shockR = 0.02; shockX = e.x / W; shockY = e.y / H;
    Audio_.slide(70, 30, 1.8, 0.2, 'sawtooth');
    Audio_.bell(98, 2.4, 0.22);
    for (const other of enemies) { other.stagger = 1.4; other.vx *= 0.2; other.vy *= 0.2; }
    for (let k = 0; k < 70; k++) stampSmoke(e.x + rnd(-80, 80) * unit, e.y + rnd(-80, 80) * unit, rnd(22, 52) * unit, 0.13);
  }
}

/* ---------------- title / death idles ---------------- */
function idleUpdate(dt) {
  t += dt;
  /* The attract loop is a real swing, not a screensaver: it breathes up into a hard
     sweep every few seconds so the coal flares and the trail blazes, then settles.
     It teaches the verb and it rakes the brass letters with light on the way past. */
  const cx = W / 2, cy = ROOM.roseY + ROOM.R * 0.22;
  const breath = 0.5 + 0.5 * Math.sin(t * 0.62);
  const drive = 0.34 + Math.pow(breath, 2.4) * 1.45;
  const amp = Math.min(W * 0.20, 190 * unit) * (0.6 + drive * 0.55);
  const ampY = Math.min(H * 0.13, 120 * unit) * (0.6 + drive * 0.55);
  idlePh += dt * (0.55 + drive * 1.9);
  player.tx = cx + Math.cos(idlePh) * amp;
  player.ty = cy + Math.sin(idlePh * 2) * ampY;
  const dx = player.tx - player.x, dy = player.ty - player.y;
  const k = 1 - Math.pow(0.0009, dt);
  player.x += dx * k; player.y += dy * k;
  if (Math.hypot(dx, dy) > 0.4) player.face = Math.atan2(dy, dx);
  simChain(dt);
  simHem(dt);
  coolCoal(dt);
  const h = head();
  const spd01 = clamp((headSpeed() - 120) / 1700, 0, 1);
  trail.push({ x: h.x, y: h.y, s: spd01, t: t });
  while (trail.length && t - trail[0].t > 0.62) trail.shift();
  emitCenser(dt, h, spd01, headSpeed(), 780 * unit);
  stepParticles(dt);
  heat = lerp(heat, 0.18 + drive * 0.34, 1 - Math.pow(0.25, dt));
  ROOMK = lerp(ROOMK, 1, 1 - Math.pow(0.02, dt));
  moonAlpha = clamp(moonAlpha - dt * 0.8, 0, 1);
  if (shake > 0) shake = Math.max(0, shake - dt * 52);
  for (const c of candleList) { c.lit = true; c.snuff = 0; }
  candles = 3;
  fade = 1;
}

function dyingUpdate(dt) {
  t += dt; dyingT += dt;
  simChain(dt);
  simHem(dt);
  const h = head();
  trail.push({ x: h.x, y: h.y, s: 0, t: t });
  while (trail.length && t - trail[0].t > 0.62) trail.shift();
  smokeAcc += dt * 40;
  while (smokeAcc > 1) { smokeAcc -= 1; stampSmoke(h.x + rnd(-8, 8), h.y + rnd(-8, 8), rnd(16, 34) * unit, 0.06); }
  heat = Math.max(0, heat - dt * 0.9);
  coalT = Math.max(0, coalT - dt * 0.55);
  hurt = Math.max(0, hurt - dt * 1.4);
  ROOMK = Math.max(0.055, ROOMK - dt * 0.55);
  if (Math.random() < 0.6) stampSmoke(emberX + rnd(-5, 5) * unit, emberY + rnd(-5, 5) * unit, rnd(10, 22) * unit, 0.06);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.vx *= Math.pow(0.05, dt); e.vy *= Math.pow(0.05, dt);
    e.dodge = Math.max(0, e.dodge - dt); e.drink = Math.max(0, e.drink - dt);
  }
  stepParticles(dt);
  if (shake > 0) shake = Math.max(0, shake - dt * 52);
  fade = 1 - sstep(0.4, 2.4, dyingT) * 0.22;
  if (dyingT > 2.9) { state = 'dead'; restT = 0; }
}

function deadUpdate(dt) {
  t += dt; restT += dt;
  simChain(dt); simHem(dt);
  stepParticles(dt);
  stepDust(dt);
  heat = 0; coalT = 0;
  ROOMK = Math.max(0.055, ROOMK - dt * 0.5);
  fade = 1;
  // one thread of smoke off the ember, the only motion left in the room
  if (Math.random() < 0.5) {
    stampSmoke(emberX + rnd(-3, 3) * unit, emberY + rnd(-3, 3) * unit, rnd(7, 15) * unit, 0.05);
  }
  for (let i = enemies.length - 1; i >= 0; i--) enemies.splice(i, 1);
  if (shake > 0) shake = Math.max(0, shake - dt * 52);
}
/* the breath of the last coal: up over a second, down over two, forever */
function emberBreath() {
  const p = (restT % 3.2) / 3.2;
  return p < 0.375 ? sstep(0, 1, p / 0.375) : 1 - sstep(0, 1, (p - 0.375) / 0.625);
}

/* ---------------- draw ---------------- */
function draw() {
  const h = head();
  const spd = headSpeed();
  const KILL = 780 * unit, WHITE = 2300 * unit;
  const spd01 = clamp((spd - 120) / 1700, 0, 1);
  const kill01 = clamp((spd - KILL) / (WHITE - KILL), 0, 1);
  const killing = spd > KILL;
  // the coal's colour IS the rule: dull below killing speed, bright above it
  const kf = spd / KILL;
  const target = kf < 1 ? 0.05 + kf * 0.47 : 0.52 + kill01 * 0.48;
  const coal = coalT;

  /* ---- 1. the light in the room ---- */
  lights.length = 0; shadows.length = 0;
  const pool = (330 + coal * 300) * unit;
  addLight(h.x, h.y, pool, rgba(ember(clamp(coal * 0.86 + 0.08, 0, 1)), 1), 0.42 + coal * 0.52, 'pool', 1, 1, 0, true);
  addLight(h.x, h.y, 78 * unit, rgba(ember(clamp(coal * 1.1, 0, 1)), 1), 0.30 + coal * 0.70, false, 1, 1, 0, true);
  /* The ribbon is burning gas. It has to put light on the floor it passes over,
     or the biggest thing on the screen is a decal. Eight emitters down its length,
     each carrying that segment's own age and temperature. */
  {
    const N = 8, tn = trail.length;
    if (tn > 4) {
      for (let i = 1; i <= N; i++) {
        const p = trail[Math.round((i / (N + 0.6)) * (tn - 1))];
        const age = clamp((t - p.t) / 0.62, 0, 1);
        const amt = (1 - age) * (1 - age) * (0.034 + coal * 0.082);
        if (amt < 0.006) continue;
        addLight(p.x, p.y, (70 + age * 190 + coal * 90) * unit,
          rgba(ember(clamp((0.22 + coal * 0.72) * Math.pow(1 - age, 0.7), 0, 1)), 1),
          amt, 'pool', 1, 1, 0, true);
      }
    }
  }
  if (killing) addLight(h.x, h.y, 105 * unit, 'rgba(255,232,180,1)', 0.30 + kill01 * 0.45, false, 1, 1, 0, true);

  for (const c of candleList) {
    if (!c.lit) continue;
    const fl = 0.86 + Math.sin(t * 7.7 + c.seed * 3.1) * 0.09 + Math.sin(t * 13.3 + c.seed * 5.7) * 0.05;
    addLight(c.x + Math.sin(t * 2.3 + c.seed) * 3 * unit, c.y, 250 * unit * fl, 'rgba(255,172,84,1)', 0.50 * fl, false, 1, 1, 0, true);
  }
  for (const f of flashes) {
    const ff = clamp(f.life / f.max, 0, 1);
    addLight(f.x, f.y, f.r * 4.2 * (1.6 - ff * 0.6), 'rgba(255,228,182,1)', ff * ff * 1.7 * f.k, 'pool', 1, 1, 0, true);
  }
  if (state === 'dead' || state === 'dying') {
    const bth = state === 'dead' ? emberBreath() : 1;
    addLight(emberX, emberY, (120 + bth * 90) * unit, rgba(ember(0.42 + bth * 0.22), 1), 0.55 + bth * 0.55, 'pool', 1, 1, 0, true);
    addLight(emberX, emberY, 34 * unit, rgba(ember(0.70 + bth * 0.20), 1), 0.5 + bth * 0.5, false, 1, 1, 0, true);
  }
  if (waveGlow > 0.01) addLight(W / 2, ROOM.roseY, ROOM.R * 1.7, rgba(ember(0.52), 1), waveGlow * 0.28);
  if (moonAlpha > 0.01) addLight(W / 2, ROOM.altarY * 0.5, Math.min(W, H) * 0.8, 'rgba(146,176,232,1)', moonAlpha * 0.16);
  const glassK = heat * heat;
  if (glassK > 0.005) {
    addLight(W * 0.30, ROOM.altarY + 6 * unit, Math.min(W, H) * 0.34, 'rgba(70,104,220,1)', glassK * 0.20);
    addLight(W * 0.70, ROOM.altarY + 6 * unit, Math.min(W, H) * 0.34, 'rgba(214,48,66,1)', glassK * 0.18);
  }

  // a boss opening up is a second fire: its cracks light the floor under it
  for (const e of enemies) {
    if (e.type !== 'bear') continue;
    const d = 1 - clamp(e.hp / (e.maxhp || 20), 0, 1);
    if (d < 0.08) continue;
    addLight(e.x, e.y, (90 + d * 210) * unit, rgba(ember(0.44 + d * 0.40), 1), d * d * 0.62, 'pool', 1, 1, 0, true);
  }
  for (const e of enemies) castShadow(e.x, e.y, e.r * 1.10, h.x, h.y, 0.92);
  castShadow(player.x, player.y, player.r * unit * 1.45, h.x, h.y, 0.85);
  if (state === 'play' || state === 'title' || state === 'paused') {
    const want = state === 'title' ? 0.86 : 0.40 + candles * 0.20;
    ROOMK += (want - ROOMK) * (1 - Math.pow(0.06, 1 / 60));
  }
  WORLDK = clamp(ROOMK * 0.72 + coal * 0.42, 0, 1);
  buildLight(heat);

  /* ---- 2. the floor, revealed only where fire falls ---- */
  const LX = LIT.x;
  LX.setTransform(1, 0, 0, 1, 0, 0);
  LX.globalCompositeOperation = 'copy';
  LX.drawImage(FLOOR.c, 0, 0);
  LX.globalCompositeOperation = 'source-over';
  LX.drawImage(DECAL.c, 0, 0);
  LX.globalCompositeOperation = 'multiply';
  LX.drawImage(LIGHT.c, 0, 0, LIT.c.width, LIT.c.height);
  LX.globalCompositeOperation = 'source-over';
  LIT.reset();

  const sx = shake > 0 ? rnd(-shake, shake) * 0.35 : 0;
  const sy = shake > 0 ? rnd(-shake, shake) * 0.35 : 0;

  SCENE.fill('#040309');
  ctx.save();
  ctx.translate(sx, sy);
  ctx.drawImage(LIT.c, 0, 0, W, H);
  // the light hanging in the air itself
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.11;
  ctx.drawImage(SPILL.c, 0, 0, W, H);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  drawAltar(candleList, t);
  for (const e of enemies) drawEnemy(e, t, h.x, h.y);
  drawChain(chain, SEGS, heat);
  drawPlayer(player, hem, h.x, h.y, iframes > 0 && Math.floor(iframes * 16) % 2 === 0, t,
    (state === 'dead' || state === 'dying') ? (0.25 + emberBreath() * 0.45) : clamp(0.25 + coal * 0.85, 0, 1));

  compositeSmoke(0.58);

  drawTrail(trail, heat, kill01, t, coal);
  drawCenser(h, spd01, heat, t, t * (0.7 + spd01 * 5.0), coal, killing);

  if (killChain > 1 && chainTimer > 0) {
    const k = clamp(killChain / 12, 0, 1) * clamp(chainTimer / 1.6, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = rgba(ember(0.70 + k * 0.30), 0.22 + k * 0.36);
    ctx.lineWidth = (1 + k * 2.2) * unit;
    ctx.beginPath();
    ctx.arc(h.x, h.y, (28 + heat * 14 + k * 20) * unit, 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  drawDust(h.x, h.y);
  drawRings(rings);
  drawSpikes(spikes);
  drawParticles(parts);

  for (const f of flashes) {
    const ff = clamp(f.life / f.max, 0, 1);
    fireGlow(f.x, f.y, f.r * 3.8, 0.72 + (1 - ff) * 0.26, clamp(ff * ff * f.k, 0, 1));
  }

  drawMoon();

  if (state === 'title') {
    // two slow rings out of the thurifer: the only instruction the game gives
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 2; i++) {
      const ph = ((t * 0.42) + i * 0.5) % 1;
      const rr = (18 + ph * 74) * unit;
      const a = Math.sin(ph * Math.PI) * 0.30;
      ctx.strokeStyle = rgba(ember(0.62), a);
      ctx.lineWidth = (1.6 - ph) * unit;
      ctx.beginPath(); ctx.arc(player.x, player.y, rr, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  if (state === 'dead' || (state === 'dying' && dyingT > 1.2)) {
    const bth = state === 'dead' ? emberBreath() : clamp((dyingT - 1.2) / 1.2, 0, 1);
    fireGlow(emberX, emberY, 156 * unit, 0.46 + bth * 0.24, 0.42 + bth * 0.52);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cg = ctx.createRadialGradient(emberX, emberY, 0, emberX, emberY, 6 * unit);
    cg.addColorStop(0, rgba(ember(0.58 + bth * 0.26), 0.95));
    cg.addColorStop(0.5, rgba(ember(0.34 + bth * 0.20), 0.7));
    cg.addColorStop(1, rgba(ember(0.14), 0));
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(emberX, emberY, 6 * unit, 0, TAU); ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  /* ---- the roof the bear is holding, sagging into frame ---- */
  if (sag > 0.004) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, 'rgba(3,2,6,' + (sag * 0.6) + ')');
    g.addColorStop(0.32, 'rgba(3,2,6,0)');
    g.addColorStop(0.68, 'rgba(3,2,6,0)');
    g.addColorStop(1, 'rgba(3,2,6,' + (sag * 0.6) + ')');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}

function drawMoon() {
  if (moonAlpha <= 0.004) return;
  const x = W / 2, y = ROOM.altarY * 0.55, r = 26 * unit;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = moonAlpha;
  ctx.drawImage(GLOW, x - 150 * unit, y - 150 * unit, 300 * unit, 300 * unit);
  ctx.globalAlpha = moonAlpha * 0.95;
  ctx.fillStyle = '#efe6d2';
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = moonAlpha * 0.22;
  ctx.fillStyle = '#9a8e78';
  ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.22, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r * 0.28, y + r * 0.3, r * 0.16, 0, TAU); ctx.fill();
  ctx.restore();
}

/* ---------------- main loop ---------------- */
const POST = {
  time: 0, heat: 0, bloom: 0.6, thresh: 0.80, aber: 0.0009,
  shock: 0, shockR: 0, shockX: 0.5, shockY: 0.5,
  fade: 1, grain: 0.048, hurt: 0, flash: 0, streak: 0.5, toe: 0.7
};

function present() {
  POST.time = t;
  POST.heat = heat;
  POST.bloom = 0.62 + heat * 0.38;
  POST.thresh = 0.86 - heat * 0.16;
  POST.aber = 0.00030 + heat * 0.00045 + shake * 0.00007 + hurt * 0.0010;
  POST.shock = shockA; POST.shockR = shockR; POST.shockX = shockX; POST.shockY = shockY;
  POST.fade = fade;
  POST.hurt = hurt;
  POST.flash = flash;
  POST.streak = QUALITY.bloom;
  POST.toe = clamp(1.45 - Math.min(W, H) / 620, 0.42, 1.15);
  Post.render(POST);
}

let acc = 0;
const FIXED = 1 / 120;
let LOOP = true;   // the harness parks the live loop so a posed frame stays posed
let costMs = 0, costRing = [];
let perfAcc = 0, perfN = 0;

function coolCoal(dt) {
  const h = head();
  const spd = Math.hypot(h.x - h.px, h.y - h.py) * 60;
  const KILL = 780 * unit, WHITE = 2300 * unit;
  const kf = spd / KILL;
  const tgt = kf < 1 ? 0.05 + kf * 0.47 : 0.52 + clamp((spd - KILL) / (WHITE - KILL), 0, 1) * 0.48;
  const tau = tgt > coalT ? 0.075 : 0.52;         // catches quickly, dies slowly
  coalT += (tgt - coalT) * (1 - Math.pow(0.0001, dt / tau));
}

function step(dt) {
  if (state === 'play') update(dt);
  else if (state === 'dying') dyingUpdate(dt);
  else if (state === 'dead') deadUpdate(dt);
  else if (state === 'paused') { /* held */ }
  else idleUpdate(dt);
  coolCoal(dt);
  const hh = head();
  advectSmoke(dt, t, hh.x, hh.y);
  stepDust(dt);
  stepSnuffed(dt);
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!LOOP) { last = now; return; }
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);
  frames++;

  const t0 = performance.now();
  if (hitstop > 0) { hitstop -= dt; draw(); present(); }
  else { step(dt); draw(); present(); }
  costMs = performance.now() - t0;
  costRing.push(costMs); if (costRing.length > 240) costRing.shift();

  // if the room is too much for the machine, dim the machinery, not the room
  perfAcc += dt; perfN++;
  if (perfN >= 90) {
    const avg = perfAcc / perfN;
    perfAcc = 0; perfN = 0;
    if (avg > 0.024 && QUALITY.dpr > 1.0) { QUALITY.dpr = Math.max(1.0, QUALITY.dpr - 0.25); QUALITY.bloom = 0; resize(); }
    else if (avg > 0.021 && QUALITY.bloom > 0) { QUALITY.bloom = 0; Post.quality = 0; }
  }
}

/* ---------------- boot ---------------- */
Post.init();
resize();
window.addEventListener('resize', () => { QUALITY.dpr = Math.min(QUALITY.dpr, 1.75); resize(); });
player.x = player.tx = W / 2; player.y = player.ty = H * 0.62;
segLen = 15 * unit;
resetChain();
placeCandles();
try { best = Number(localStorage.getItem('thurible:best')) || 0; } catch (e) {}
requestAnimationFrame(frame);

/* ---------------- harness hooks ---------------- */
window.__TH = {
  ready: true,
  phase() { return state; },
  mute() { Audio_.muted = true; if (Audio_.ok) Audio_.setSwing(0); },
  start() { startRun(); },
  run(sec, st) {
    st = st || 1 / 60;
    const n = Math.max(1, Math.round(sec / st));
    for (let i = 0; i < n; i++) { if (hitstop > 0) hitstop -= st; else step(st); }
    draw(); present();
  },
  drag(x, y) { player.tx = clamp(x, PAD, W - PAD); player.ty = clamp(y, PAD, H - PAD); },
  setHeat(v) { heat = clamp(v, 0, 1); },
  god(v) { GOD = v !== false; },
  pause() { LOOP = false; },
  resume() { LOOP = true; last = 0; },
  enemyNear(x, y, d) { return enemies.some(e => Math.hypot(e.x - x, e.y - y) < d); },
  headPos() { const h = head(); return { x: h.x, y: h.y, vx: (h.x - h.px), vy: (h.y - h.py) }; },
  /* peak luminance of a creature against the floor immediately around it */
  lum(pts) {
    const cv = SCENE.c, cx = cv.getContext('2d', { willReadFrequently: true });
    const S = DPR;
    return pts.map(p => {
      const R = Math.max(6, p.r * S), px = p.x * S, py = p.y * S;
      const box = (x0, y0, w, hh) => {
        x0 = Math.max(0, Math.round(x0)); y0 = Math.max(0, Math.round(y0));
        w = Math.min(cv.width - x0, Math.round(w)); hh = Math.min(cv.height - y0, Math.round(hh));
        if (w <= 0 || hh <= 0) return { peak: 0, mean: 0 };
        const d = cx.getImageData(x0, y0, w, hh).data;
        let peak = 0, dark = 255, sum = 0, n = 0;
        for (let i = 0; i < d.length; i += 4) {
          const l = 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
          if (l > peak) peak = l;
          if (l < dark) dark = l;
          sum += l; n++;
        }
        return { peak, dark, mean: sum / n };
      };
      // the box has to contain the whole creature: plumes, tails and bulges all
      // reach well past the collision radius, and they are what you actually see
      const on = box(px - R * 2.4, py - R * 2.4, R * 4.8, R * 4.8);
      const around = box(px - R * 6.0, py - R * 6.0, R * 12, R * 12);
      const floor = Math.max(0.6, (around.mean * 144 - on.mean * 23.04) / (144 - 23.04));
      return { k: p.k, peak: on.peak, dark: on.dark, floor, ratio: on.peak / floor };
    });
  },
  /* how differently a killing coal reads from a cold one */
  coalContrast() {
    const cv = SCENE.c, cx = cv.getContext('2d', { willReadFrequently: true });
    const sample = () => {
      const hd = head(), S = DPR, R = 26 * unit * S;
      const x0 = Math.max(0, Math.round(hd.x * S - R)), y0 = Math.max(0, Math.round(hd.y * S - R));
      const w = Math.min(cv.width - x0, Math.round(R * 2)), hh = Math.min(cv.height - y0, Math.round(R * 2));
      if (w <= 0 || hh <= 0) return 0;
      const d = cx.getImageData(x0, y0, w, hh).data;
      let sum = 0, n = 0;
      for (let i = 0; i < d.length; i += 4) { sum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]; n++; }
      return sum / n;
    };
    window.__TH.start(); GOD = true; enemies.length = 0; betweenWaves = 9999;
    const st = 1 / 120;
    for (let i = 0; i < 200; i++) { drag(innerWidth / 2 + Math.cos(i * st * 0.5) * 30, innerHeight / 2 + Math.sin(i * st * 0.5) * 30); window.__TH.run(st, st); }
    const cold = sample();
    for (let i = 0; i < 260; i++) { drag(innerWidth / 2 + Math.cos(i * st * 5.4) * 250, innerHeight / 2 + Math.sin(i * st * 5.4) * 250); window.__TH.run(st, st); }
    const hot = sample();
    return { cold, hot, ratio: hot / Math.max(1, cold) };
    function drag(x, y) { player.tx = clamp(x, PAD, W - PAD); player.ty = clamp(y, PAD, H - PAD); }
  },
  /* honest frame cost: real rAF frames, not the stepped harness */
  bench(n) {
    return new Promise(res => {
      const wasParked = !LOOP;
      LOOP = true; last = 0;
      costRing.length = 0;
      let k = 0;
      const tick = () => {
        if (++k < n) requestAnimationFrame(tick);
        else {
          const ms = costRing.slice().sort((a, b) => a - b);
          if (wasParked) LOOP = false;
          res({ p50: ms[ms.length >> 1] || 0, p95: ms[Math.floor(ms.length * 0.95)] || 0, enemies: enemies.length, frames: ms.length });
        }
      };
      requestAnimationFrame(tick);
    });
  },
  dump() {
    const onBlack = (lay) => { const t = document.createElement('canvas'); t.width = lay.c.width; t.height = lay.c.height; const q = t.getContext('2d'); q.fillStyle = '#000'; q.fillRect(0,0,t.width,t.height); q.drawImage(lay.c,0,0); return t.toDataURL(); };
    return { floor: FLOOR.c.toDataURL(), light: LIGHT.c.toDataURL(), spill: onBlack(SPILL), lit: LIT.c.toDataURL(), smoke: onBlack(SMOKE_A), scene: SCENE.c.toDataURL() };
  },
  probe() {
    const stat = (lay, name) => {
      const cv = lay.c, cx = cv.getContext('2d', { willReadFrequently: true });
      const d = cx.getImageData(0, 0, cv.width, cv.height).data;
      let maxA = 0, sumA = 0, maxL = 0, sumL = 0, n = 0;
      for (let i = 0; i < d.length; i += 16) {
        const l = Math.max(d[i], d[i + 1], d[i + 2]);
        if (d[i + 3] > maxA) maxA = d[i + 3];
        if (l > maxL) maxL = l;
        sumA += d[i + 3]; sumL += l; n++;
      }
      return { name, w: cv.width, maxAlpha: maxA, meanAlpha: +(sumA / n).toFixed(2), maxLum: maxL, meanLum: +(sumL / n).toFixed(2) };
    };
    return [stat(SMOKE_A, 'smoke'), stat(SPILL, 'spill'), stat(LIGHT, 'light'), stat(LIT, 'lit'), stat(SCENE, 'scene')];
  },
  setWave(n) { wave = n; },
  spawn(type, x, y) {
    spawnAt(type);
    const e = enemies[enemies.length - 1];
    if (x !== undefined) { e.x = x; e.y = y; }
    return e;
  },
  clearEnemies() { enemies.length = 0; spawnQueue.length = 0; betweenWaves = 9999; },
  kill() { candles = 0; die(); },
  info() {
    return {
      frames, state, wave, candles, heat, score,
      enemies: enemies.length, parts: parts.length, flashes: flashes.length, spikes: spikes.length, rings: rings.length,
      gl: Post.ok, dpr: DPR, W, H, unit,
      headSpeed: headSpeed(), kills: killCount, coalT: coalT, kill01: clamp((headSpeed() - 780 * unit) / (2300 * unit - 780 * unit), 0, 1)
    };
  }
};
window.__TH.state = window.__TH.info;

})();
</script>
