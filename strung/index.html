<script>
"use strict";
(() => {
const cv = document.getElementById('game');
const g = cv.getContext('2d');
let W = 960, H = 600, DPR = 1;

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const approach = (a, b, k, dt) => b + (a - b) * Math.exp(-k * dt);
const sgn = v => v < 0 ? -1 : 1;
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = rng(20261015);
const gauss = r => { let u = 0; while (!u) u = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2832 * r()); };
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// the title and the neon: Big Shoulders here; the site copy swaps in its own self-hosted face, squeezed
const FONT = Object.assign({ family: '"Big Shoulders Display", "Arial Narrow", sans-serif', thin: 200, light: 300, squash: 1 }, window.STRUNG_FONT || {});

// ---------- the walk ----------
const STRIDE = 0.62;   // metres per step
const CADENCE = 0.44;  // seconds per step
const PENTA = [0, 2, 4, 7, 9]; // D major pentatonic over everything
const deg2midi = d => 62 + 12 * Math.floor(d / 5) + PENTA[((d % 5) + 5) % 5];

// Every rope is a string. L span, H drop to the street, rise of the far end,
// sag under your weight, sigma wobble per step, assist early forgiveness,
// net depth below the rope (0: none), root of the drone, deg0/span/motif the tune your feet play.
const ROPES = [
  { L: 17, H: 21, rise: 0.0, sag: .30, sigma: .09, assist: 1.30, net: 4.5, root: 50, deg0: 0,  span: 5,  motif: [0, 2, 1, 3], lit: .64, cars: 9, kids: 6 },
  { L: 22, H: 25, rise: 1.0, sag: .40, sigma: .12, assist: .90, net: 6,   root: 47, deg0: -1, span: 5,  motif: [0, 1, 2, 1], lit: .58, cars: 8, kids: 5, pigeons: [.40, .45, .51] },
  { L: 26, H: 29, rise: 2.0, sag: .45, sigma: .13, assist: .60, net: 8,   root: 43, deg0: 1,  span: 8,  motif: [0, 2, 0, 1], lit: .52, cars: 7, kids: 4, gusts: [[.30, 1, 1.15], [.66, -1, 1.35]] },
  { L: 28, H: 31, rise: 0.5, sag: 1.30, sigma: .16, assist: .40, net: 10, root: 45, deg0: 0,  span: 8,  motif: [0, 1, 3, 2], lit: .47, cars: 6, kids: 4, slack: 1, pigeons: [.58, .62] },
  { L: 30, H: 37, rise: 3.0, sag: .50, sigma: .15, assist: .25, net: 13,  root: 52, deg0: 1,  span: 5,  motif: [0, 2, 1, 0], lit: .41, cars: 5, kids: 3, gusts: [[.22, -1, 1.25], [.52, 1, 1.35], [.80, -1, 1.4]], crows: [.38] },
  { L: 32, H: 43, rise: 2.0, sag: .55, sigma: .19, assist: .12, net: 16,  root: 42, deg0: 0,  span: 7,  motif: [0, 1, 0, 2], lit: .35, cars: 4, kids: 2, rain: 1, gusts: [[.35, 1, 1.25], [.72, -1, 1.35]], pigeons: [.5] },
  { L: 37, H: 54, rise: 4.0, sag: .60, sigma: .17, assist: 0,   net: 21,  root: 43, deg0: 1,  span: 8,  motif: [0, 2, 1, 3], lit: .28, cars: 3, kids: 1, gusts: [[.2, 1, 1.3], [.42, -1, 1.45], [.64, 1, 1.5], [.86, -1, 1.55]], crows: [.3, .7], pigeons: [.55, .58] },
  { L: 41, H: 63, rise: 6.0, sag: .65, sigma: .15, assist: 0,   net: 0,   root: 50, deg0: -5, span: 10, motif: [0, 1, 2, 0], lit: .2,  cars: 2, kids: 0, bells: 1, tower: 1 },
];
ROPES.forEach((r, i) => {
  r.i = i;
  r.steps = Math.ceil(r.L / STRIDE);
  r.notes = [];
  for (let k = 0; k < r.steps; k++) {
    const base = r.deg0 + Math.round(r.span * k / (r.steps - 1));
    r.notes.push(deg2midi(base + (k < r.steps - 2 ? r.motif[k % r.motif.length] : 0)));
  }
  r.notes[r.steps - 1] = deg2midi(r.deg0 + r.span);
  r.gusts = r.gusts || []; r.pigeons = r.pigeons || []; r.crows = r.crows || [];
});

// balance: lean theta (rad, + = right), the pole tilt phi (+ = right end heavy)
const PH = { G: 2.2, D: 1.1, K: 5.4, phiMax: 0.62, poleTau: 0.065, fall: 0.86 };

// ---------- state ----------
const S = {
  mode: 'title', rope: 0, z: 0, theta: 0, omega: 0, phi: 0, engage: 0,
  stepping: false, stepT: 0, stepIdx: 0, foot: 1,
  by: 0, bv: 0, sx: 0, sv: 0, sa: 0, vib: 0, ext: 0, grace: 0,
  gusts: [], pigeons: [], crows: [], pulses: [], bats: [], leaves: [], drops: [], feathers: [], smoke: [], fliers: [],
  timeScale: 1, slowUntil: 0, fade: 1, fadeTo: 0, real: 0,
  falls: 0, fallT: 0, fallDir: 1, fallPress: 0, fx: 0, fy: 0, fvx: 0, fvy: 0, frot: 0, fvr: 0, bounces: 0,
  swing: 0, swingV: 0, climb: 0,
  t: 0, wind: 0, windDir: 1, windVis: 0, hum: 0, rain: 0,
  bellsLeft: -1, bellT: 0, bellSide: 1, bellSwing: 0,
  played: [], intro: 1, danger: 0, creakT: 0, endT: 0, arriveT: 0, replayAt: -1, scarf: [],
  shake: 0, kick: 0, crowLoad: 0, title: 1, sawTitle: false,
  pf: 0, pfv: 0, turn: 0, sit: 0, pole: null,
};
const IN = { mx: 0, my: 0, down: false, key: false, presses: 0, seen: false };
// phones: hold anywhere on the right half to walk, drag anywhere on the left half to balance
const TOUCH = { active: false, balId: null, bx0: 0, bx: 0, walkIds: new Set(), usedWalk: false, usedBal: false, hint: 1 };
const held = () => IN.down || IN.key;
const holding = () => held() || (TOUCH.active && TOUCH.balId !== null);
const buzz = ms => { if (TOUCH.active && navigator.vibrate) { try { navigator.vibrate(ms); } catch (_) {} } };

// ---------- sound ----------
const AU = { ctx: null };
function noiseBuf(ctx, sec, brown) {
  const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0);
  let last = 0;
  for (let i = 0; i < n; i++) {
    const w = Math.random() * 2 - 1;
    if (brown) { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
  }
  return b;
}
function impulse(ctx, sec) {
  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.8) * Math.min(1, i / (sr * 0.012));
  }
  return b;
}
function biquad(type, f, q) { const b = AU.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function loop(buf) { const s = AU.ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * buf.duration); return s; }
function panner(p) {
  const ctx = AU.ctx;
  if (ctx.createStereoPanner) { const n = ctx.createStereoPanner(); n.pan.value = clamp(p, -1, 1); return n; }
  return ctx.createGain();
}
function route(node, pan = 0, send = 0.25) {
  const p = panner(pan); node.connect(p); p.connect(AU.master);
  if (send > 0) { const s = AU.ctx.createGain(); s.gain.value = send; p.connect(s); s.connect(AU.rev); }
  return p;
}
function env(gn, t, a, peak, dec) {
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
}

function audioStart() {
  if (AU.ctx) { if (AU.ctx.state !== 'running') AU.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  let ctx;
  try { ctx = AU.ctx = new AC(); } catch (e) { AU.ctx = null; return; }
  const t = ctx.currentTime;
  AU.master = ctx.createGain();
  AU.master.gain.setValueAtTime(0.0001, t); AU.master.gain.exponentialRampToValueAtTime(0.8, t + 1.5);
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -20; comp.knee.value = 12; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.3;
  AU.master.connect(comp); comp.connect(ctx.destination);
  AU.rev = ctx.createConvolver(); AU.rev.buffer = impulse(ctx, 3.4);
  const wet = ctx.createGain(); wet.gain.value = 0.5; AU.rev.connect(wet); wet.connect(AU.master);
  AU.noise = noiseBuf(ctx, 3, false); AU.brown = noiseBuf(ctx, 4, true);

  // the rope's hum: two voices on one note. Leaning pulls one of them out of tune.
  const d = AU.drone = {};
  d.out = ctx.createGain(); d.out.gain.value = 0;
  d.lp = biquad('lowpass', 700, 0.4); d.lp.connect(d.out); route(d.out, 0, 0.55);
  const voice = (type, amp) => {
    const o = ctx.createOscillator(); o.type = type;
    const a = ctx.createGain(); a.gain.value = amp; o.connect(a); a.connect(d.lp); o.start(); return o;
  };
  d.a = voice('triangle', 0.5); d.b = voice('triangle', 0.5); d.c = voice('sine', 0.15); d.s = voice('sine', 0.3);
  const lfo = ctx.createOscillator(); lfo.frequency.value = 0.11;
  const lg = ctx.createGain(); lg.gain.value = 0.01; lfo.connect(lg); lg.connect(d.out.gain); lfo.start();
  setDroneRoot(ROPES[S.rope].root, 0.01);

  // wind, and the wire singing in it
  const w = AU.wind = {};
  w.bp = biquad('bandpass', 500, 0.6); w.g = ctx.createGain(); w.g.gain.value = 0;
  w.pan = panner(0); loop(AU.noise).connect(w.bp); w.bp.connect(w.g); w.g.connect(w.pan);
  w.hum = ctx.createOscillator(); w.hum.type = 'sine'; w.hum.frequency.value = 520;
  w.hg = ctx.createGain(); w.hg.gain.value = 0; w.hum.connect(w.hg); w.hg.connect(w.pan); w.hum.start();
  w.pan.connect(AU.master);
  const ws = ctx.createGain(); ws.gain.value = 0.25; w.pan.connect(ws); ws.connect(AU.rev);

  // rain, and the city far down
  AU.rainG = ctx.createGain(); AU.rainG.gain.value = 0;
  const rh = biquad('highpass', 1700, 0.5), rl = biquad('lowpass', 6500, 0.5);
  loop(AU.noise).connect(rh); rh.connect(rl); rl.connect(AU.rainG); route(AU.rainG, 0, 0.3);
  AU.cityG = ctx.createGain(); AU.cityG.gain.value = 0;
  const cl = biquad('lowpass', 170, 0.5); loop(AU.brown).connect(cl); cl.connect(AU.cityG); AU.cityG.connect(AU.master);
}

function setDroneRoot(m, glide = 0.6) {
  if (!AU.ctx) return;
  const d = AU.drone, t = AU.ctx.currentTime, f = mtof(m);
  d.a.frequency.setTargetAtTime(f, t, glide); d.b.frequency.setTargetAtTime(f, t, glide);
  d.c.frequency.setTargetAtTime(f * 1.5, t, glide); d.s.frequency.setTargetAtTime(f / 2, t, glide);
}

function audioTick() {
  if (!AU.ctx || !AU.drone) return;
  const t = AU.ctx.currentTime, d = AU.drone, w = AU.wind;
  const onRope = S.mode === 'rope' || S.mode === 'hang';
  const lean = S.mode === 'rope' ? S.theta / PH.fall : S.mode === 'hang' ? 0.25 : 0;
  const lvl = S.mode === 'rope' ? 0.085 : S.mode === 'hang' ? 0.05 : S.mode === 'end' ? 0.0 : S.mode === 'fall' ? 0 : 0.03;
  d.out.gain.setTargetAtTime(lvl, t, onRope ? 0.25 : 0.6);
  d.b.detune.setTargetAtTime(lean * 72, t, 0.03);
  d.a.detune.setTargetAtTime(-lean * 7, t, 0.03);
  d.lp.frequency.setTargetAtTime(620 + 900 * S.danger + 300 * Math.abs(lean), t, 0.08);
  w.g.gain.setTargetAtTime(0.01 + 0.05 * S.wind, t, 0.15);
  w.bp.frequency.setTargetAtTime(380 + 520 * S.wind, t, 0.2);
  w.hg.gain.setTargetAtTime(0.02 * clamp(S.hum, 0, 1.4), t, 0.15);
  w.hum.frequency.setTargetAtTime(430 + 240 * S.hum, t, 0.3);
  if (w.pan.pan) w.pan.pan.setTargetAtTime(-S.windDir * 0.75 * clamp(S.hum * 1.5, 0, 1), t, 0.2);
  AU.rainG.gain.setTargetAtTime(0.03 * S.rain, t, 0.6);
  AU.cityG.gain.setTargetAtTime(S.mode === 'end' ? 0.015 : 0.045 * (1 - S.rope / 11), t, 0.8);
}

// --- one-shots ---
const KS = {};
function ksBuf(m) {
  if (KS[m]) return KS[m];
  const ctx = AU.ctx, sr = ctx.sampleRate, f = mtof(m);
  const N = Math.max(4, Math.round(sr / f - 0.5));
  const dur = clamp(3.0 - (m - 48) * 0.045, 0.8, 3.2), len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr), out = buf.getChannelData(0), ring = new Float32Array(N);
  let p = 0, mean = 0;
  for (let i = 0; i < N; i++) { p = p * 0.5 + (Math.random() * 2 - 1) * 0.5; ring[i] = p; mean += p; }
  mean /= N; for (let i = 0; i < N; i++) ring[i] -= mean;
  const rho = Math.pow(0.001, 1 / (f * dur));
  let idx = 0, peak = 1e-6;
  for (let i = 0; i < len; i++) {
    const j = idx + 1 === N ? 0 : idx + 1, a = ring[idx];
    out[i] = a; ring[idx] = rho * 0.5 * (a + ring[j]); idx = j;
    if (a > peak) peak = a; else if (-a > peak) peak = -a;
  }
  const fadeN = Math.floor(len * 0.15);
  for (let i = 0; i < len; i++) { let v = out[i] / peak * 0.7; if (i > len - fadeN) v *= (len - i) / fadeN; out[i] = v; }
  return (KS[m] = { buf, rate: f / (sr / (N + 0.5)) });
}
function pluck(m, vol = 0.3, pan = 0, send = 0.35, when = 0) {
  if (!AU.ctx) return;
  const ctx = AU.ctx, k = ksBuf(m), s = ctx.createBufferSource();
  s.buffer = k.buf; s.playbackRate.value = k.rate;
  const gn = ctx.createGain(); gn.gain.value = vol; s.connect(gn); route(gn, pan, send);
  s.start(ctx.currentTime + when);
}
function noiseShot(vol, type, f, q, a, dec, pan = 0, send = 0.1, when = 0, f2 = 0) {
  if (!AU.ctx) return;
  const ctx = AU.ctx, t = ctx.currentTime + when, s = ctx.createBufferSource(); s.buffer = AU.noise;
  const b = biquad(type, f, q);
  if (f2) { b.frequency.setValueAtTime(f, t); b.frequency.exponentialRampToValueAtTime(f2, t + a + dec); }
  const gn = ctx.createGain(); env(gn, t, a, vol, dec);
  s.connect(b); b.connect(gn); route(gn, pan, send);
  s.start(t, Math.random() * 2); s.stop(t + a + dec + 0.05);
}
const thud = (vol = 0.1, f = 240) => noiseShot(vol, 'lowpass', f, 0.7, 0.003, 0.09, 0, 0.05);
const whoosh = (vol, pan, dur, f0, f1, when = 0) => noiseShot(vol, 'bandpass', f0, 0.9, dur * 0.4, dur * 0.6, pan, 0.3, when, f1);
function flutter(n, pan = 0, vol = 0.05) {
  let w = 0;
  for (let i = 0; i < n; i++) {
    w += 0.028 + Math.random() * 0.025;
    noiseShot(vol * (1 - i / n * 0.6), 'bandpass', 700 + Math.random() * 900, 1.2, 0.004, 0.045, pan, 0.15, w);
  }
}
function tone(type, f0, f1, a, dec, vol, pan = 0, send = 0.3, when = 0, filt = 0) {
  if (!AU.ctx) return;
  const ctx = AU.ctx, t = ctx.currentTime + when, o = ctx.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + a + dec);
  const e = ctx.createGain(); env(e, t, a, vol, dec);
  if (filt) { const b = biquad('bandpass', filt, 2.2); o.connect(b); b.connect(e); } else o.connect(e);
  route(e, pan, send); o.start(t); o.stop(t + a + dec + 0.05);
}
function coo(pan = 0, vol = 0.02) {
  tone('sine', 330, 300, 0.06, 0.18, vol, pan, 0.3);
  tone('sine', 360, 290, 0.08, 0.32, vol * 0.8, pan, 0.3, 0.26);
}
function caw(pan = 0, vol = 0.04, when = 0) {
  tone('sawtooth', 640, 420, 0.015, 0.24, vol, pan, 0.4, when, 1300);
  tone('sawtooth', 600, 400, 0.015, 0.22, vol * 0.8, pan, 0.4, when + 0.34, 1250);
}
const creak = (vol = 0.03, pan = 0) => tone('sawtooth', 60 + Math.random() * 30, 38, 0.02, 0.2, vol, pan, 0.3, 0, 520);
function bell(m, vol = 0.2, pan = 0, len = 1, send = 0.7, when = 0) {
  if (!AU.ctx) return;
  const ctx = AU.ctx, t = ctx.currentTime + when, f = mtof(m);
  const out = ctx.createGain(); out.gain.value = vol; route(out, pan, send);
  const P = [[0.5, .55, 5], [1, 1, 3.6], [1.19, .5, 2.2], [1.5, .3, 1.8], [2, .42, 1.5], [2.51, .2, 1.1], [3.01, .16, .8], [4.07, .08, .5]];
  for (const [r, a, d] of P) {
    const o = ctx.createOscillator(); o.frequency.value = f * r; o.detune.value = (Math.random() - 0.5) * 6;
    const e = ctx.createGain(); env(e, t, 0.003, a, d * len);

const RA = [0, 0];
function drawRope(r, part) {
  // the walker splits the rope: the stretch beyond them is drawn before them, the stretch in front after
  const m = S.mode, split = m === 'rope' || m === 'hang' || m === 'fall' ? clamp(S.z, 0, r.L) : m === 'title' ? 0 : r.L;
  const zc = Math.max(0, CAM.z + 0.5);
  let z0, z1;
  if (part === 'ahead') { z0 = Math.max(split, zc); z1 = r.L; } else { z0 = zc; z1 = Math.min(split, r.L); }
  if (z1 - z0 < 0.02) return;

        g.beginPath(); g.moveTo(px, py - w * 0.22); g.lineTo(P.x, P.y - w * 0.22); g.stroke();

  }

}

function drawPigeons() {
  for (const p of S.pigeons) {

  g.translate(W / 2, H / 2); g.rotate(roll); g.scale(1.03, 1.03); g.translate(-W / 2, -H / 2);
  const hy = drawSky(rdt);
  if (polyPath([-600, -r.H, -40, 600, -r.H, -40, 600, -r.H, r.L + 600, -600, -r.H, r.L + 600])) { g.fillStyle = '#0a0910'; g.fill(); }
  for (const b of SC.rows[2]) drawBuilding(b);
  haze(hy, 0.45);
  for (const b of SC.rows[1]) drawBuilding(b);
  haze(hy, 0.2);
  for (const b of SC.rows[0]) if (b.target && r.tower) drawTower(b, r); else drawBuilding(b);
  drawStreet(r);
  drawRoofStuff(r);
  canyonGlow();
  // near things, back to front: the net, the rope beyond you, you, the rope in front of you, the roof you left
  drawNet(r);
  drawRope(r, 'ahead');
  drawPigeons();
  if (S.mode === 'fall' || S.mode === 'hang') {
    // below the rope now: the roof edge and the rope can be in front of you
    drawWalker(r, rdt); drawLostPole(); drawCrows(); drawRope(r, 'behind'); drawNearRoof();
  } else {
    drawRope(r, 'behind'); drawNearRoof(); drawWalker(r, rdt); drawCrows();
  }
  drawSpecks();
  g.restore();
  const vg = g.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.32, W / 2, H * 0.55, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.5 + 0.3 * S.danger})`);
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  post();
  drawTitle();
  drawThumbs();
  if (S.fade > 0.002) { g.fillStyle = `rgba(4,4,9,${S.fade})`; g.fillRect(0, 0, W, H); }
  if (IN.seen && !TOUCH.active) {
    const pulse = S.mode === 'title' ? 1 + 0.25 * Math.sin(S.real * 4) : 1;
    g.strokeStyle = 'rgba(232,226,212,0.6)'; g.lineWidth = 1.2;
    g.beginPath(); g.arc(IN.mx, IN.my, 7 * pulse, 0, 6.2832); g.stroke();
    g.fillStyle = 'rgba(232,226,212,0.85)'; g.fillRect(IN.mx - 1, IN.my - 1, 2, 2);
  }
}

// ---------- input and the loop ----------
function resize() {
  DPR = Math.min(Q.dpr, window.devicePixelRatio || 1);
  const b = cv.getBoundingClientRect();
  W = Math.max(320, Math.round(b.width)); H = Math.max(240, Math.round(b.height));
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  if (!IN.seen) { IN.mx = W / 2; IN.my = H * 0.62; }
  S.drops.length = 0; S.scarf = [];
  setupPost();
}
const isTouch = e => e.pointerType === 'touch';
function at(e) { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }
cv.addEventListener('pointerdown', e => {
  const [x, y] = at(e);
  if (isTouch(e)) {
    TOUCH.active = true; IN.seen = true; audioStart(); IN.presses++;
    if (x < W / 2 && TOUCH.balId === null) { TOUCH.balId = e.pointerId; TOUCH.bx0 = TOUCH.bx = x; TOUCH.usedBal = true; }
    else { TOUCH.walkIds.add(e.pointerId); TOUCH.usedWalk = true; }
    IN.down = TOUCH.walkIds.size > 0;
  } else {
    if (e.button !== 0) return;
    TOUCH.active = false; IN.mx = x; IN.my = y; IN.seen = true; audioStart(); IN.down = true; IN.presses++;
  }
  cv.focus();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const [x, y] = at(e);
  if (isTouch(e)) {
    if (e.pointerId === TOUCH.balId) {
      // the anchor follows if you run out of thumb room
      TOUCH.bx = x;
      const range = W * 0.14, d = x - TOUCH.bx0;
      if (d > range) TOUCH.bx0 = x - range; else if (d < -range) TOUCH.bx0 = x + range;
    }
    return;
  }
  IN.mx = x; IN.my = y; IN.seen = true;
});
const lift = e => {
  if (isTouch(e)) {
    if (e.pointerId === TOUCH.balId) TOUCH.balId = null;
    TOUCH.walkIds.delete(e.pointerId);
    IN.down = TOUCH.walkIds.size > 0;
    audioStart();
  } else IN.down = false;
};
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
// iOS only lets sound start at the end of a touch
window.addEventListener('touchend', () => {
  if (!AU.ctx) return;
  if (AU.ctx.state !== 'running') AU.ctx.resume();
  try { const s = AU.ctx.createBufferSource(); s.buffer = AU.ctx.createBuffer(1, 1, 22050); s.connect(AU.ctx.destination); s.start(0); } catch (_) {}
}, { passive: true });
window.addEventListener('blur', () => { IN.down = false; IN.key = false; IN.left = IN.right = false; TOUCH.balId = null; TOUCH.walkIds.clear(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
const WALK = ['Space', 'KeyW', 'ArrowUp', 'Enter'];
window.addEventListener('keydown', e => {
  if (WALK.includes(e.code)) { e.preventDefault(); if (!e.repeat) { TOUCH.active = false; audioStart(); IN.key = true; IN.presses++; IN.seen = true; } }
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') { IN.left = true; IN.seen = true; TOUCH.active = false; e.preventDefault(); }
  if (e.code === 'KeyD' || e.code === 'ArrowRight') { IN.right = true; IN.seen = true; TOUCH.active = false; e.preventDefault(); }
});
window.addEventListener('keyup', e => {
  if (WALK.includes(e.code)) IN.key = false;
  if (e.code === 'KeyA' || e.code === 'ArrowLeft') IN.left = false;
  if (e.code === 'KeyD' || e.code === 'ArrowRight') IN.right = false;
});

const STEP = 1 / 120;
let last = 0, acc = 0;
function afterFade() {
  const a = S.afterFade; S.fadeTo = 0; S.afterFade = '';
  if (a === 'next') { loadRope(S.rope + 1); S.mode = 'rope'; CS.snap = true; }
  else if (a === 'retry') { resetRope(); S.mode = 'rope'; CS.snap = true; }
  else if (a === 'restart') { restart(); CS.snap = true; }
}
function frame(now) {
  const rdt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
  S.real += rdt;
  if (IN.left || IN.right) IN.mx = clamp(IN.mx + ((IN.right ? 1 : 0) - (IN.left ? 1 : 0)) * W * 0.8 * rdt, 0, W);
  const slow = S.real < S.slowUntil;
  S.timeScale = approach(S.timeScale, slow ? 0.28 : 1, slow ? 30 : 4, rdt);
  acc += rdt * S.timeScale;
  let n = 0;
  while (acc >= STEP && n < 30) { update(STEP); acc -= STEP; n++; }
  if (n === 30) acc = 0;
  S.fade = approach(S.fade, S.fadeTo, S.fadeTo ? 5 : 2.4, rdt);
  if (S.fadeTo === 1 && S.fade > 0.985) afterFade();
  S.title = approach(S.title, S.mode === 'title' || S.endTitle ? 1 : 0, S.mode === 'title' ? 6 : 1.2, rdt);
  // anything the page puts over the game (the site's home link) hides while you walk
  const playing = S.mode !== 'title' && !S.endTitle;
  if (document.body && playing !== document.body.classList.contains('playing')) document.body.classList.toggle('playing', playing);
  // once both thumbs have done their job, the hints go away for good
  if (TOUCH.usedWalk && TOUCH.usedBal && S.stepIdx > 5 && TOUCH.hint > 0) {
    TOUCH.hint = Math.max(0, TOUCH.hint - rdt * 0.6);
    if (TOUCH.hint === 0) { try { localStorage.setItem('strung-thumbs', '1'); } catch (_) {} }
  }
  // if this machine can't keep up, drop the extras before it touches the feel
  Q.t += rdt;
  if (Q.t > 4 && document.visibilityState === 'visible') {
    if (rdt > 0.028) Q.slow++; else Q.slow = Math.max(0, Q.slow - 0.25);
    if (Q.slow > 45) {
      Q.slow = 0;
      if (Q.bloom) Q.bloom = false; else if (Q.grain) Q.grain = false; else if (Q.dpr > 1.25) { Q.dpr = 1.25; resize(); }
    }
  }
  audioTick();
  render(rdt);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
if (document.fonts && document.fonts.load) document.fonts.load(`${FONT.thin} 64px ${FONT.family}`).catch(() => {});
function start(data) {
  resize(); loadRope(0);
  const d = data || {};
  if (typeof d.rope === 'number' && d.rope > 0 && d.rope < ROPES.length) { loadRope(d.rope); S.mode = 'rope'; S.intro = 0; S.falls = d.falls || 0; }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ rope: S.rope, falls: S.falls })); } catch (_) {}
if (hot && typeof hot.ready === 'function') hot.ready(start); else start(hot && hot.data);
window.__strung = { S, ROPES, PH, IN, TOUCH, Q, jump(i) { loadRope(i); S.mode = 'rope'; S.intro = 0; S.fade = 0; S.fadeTo = 0; CS.snap = true; }, update };
})();
</script>
</body>
