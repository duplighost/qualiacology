  float cr1 = 1.0 - smoothstep(0.0, fw1 + 0.008, abs(nB.g - 0.5));
  float cr2 = 1.0 - smoothstep(0.0, fw2 + 0.012, abs(nC.b - 0.5));
  float crack = cr1 * smoothstep(0.5, 0.8, nA.g) * rk * (0.35 + 0.65 * (1.0 - crust)) + cr2 * 0.0;
  // fine grain: the surface is rough at every scale down to the eye
  vec4 nF = n3v(P / 0.33 + 1.7);
  bump += nGrad(P, 1.0 / 0.33, 1) * 0.0016 * rk * smoothstep(9.0, 2.0, length(P - uCam.xyz));
  // strata on steep faces: layers of slightly different stone, a step at each
  float steep = 1.0 - smoothstep(0.35, 0.75, abs(N.y));
  float sy = P.y * 1.15 + (nA.r - 0.5) * 5.0 + (nB.r - 0.5) * 1.2;
  float layer = fract(sy * 0.35);
  float strata = steep * rk;
  bump += vec3(0.0, 1.0, 0.0) * strata * (smoothstep(0.0, 0.08, layer) - smoothstep(0.85, 1.0, layer)) * 0.12;
  vec3 Nd = normalize(N - bump - sandB);
  // albedo detail
  float macro = 0.82 + 0.36 * nA.b;
  alb *= mix(1.0, macro, 0.8);
  alb *= mix(1.0, 0.8 + 0.35 * nB.b, rk);
  alb *= mix(1.0, 0.82 + 0.3 * fract(floor(sy * 0.35) * 0.618), strata * 0.8);
  alb *= 1.0 - crack * 0.3;
  ao *= 1.0 - crack * 0.45;
  alb *= mix(1.0, 0.86 + 0.28 * nF.r, rk);
  alb *= 1.0 + sand * (rip * 0.06 + (nC.r - 0.5) * 0.12);
  // living rock: encrusting sponges, coralline algae, zoanthid mats and turf in patches at three scales,
  // all varied around the biome's own crust colour so every biome keeps its character
  float life = crust * (1.0 - ice) * (1.0 - sand);
  if (life > 0.01) {
    vec4 q1 = n3v(P / 1.35 + 11.0), q2 = n3v(P / 0.48 + 3.0), q3 = n3v(P / 0.2);
    float sel = q1.r * 0.65 + q2.g * 0.35;
    vec3 base = alb;
    // each kind of growth has its own surface: coralline smooth with fine knobs, sponge pitted with pores,
    // turf fuzzy, crust chalky; the edges between them are ragged rather than drawn with a ruler
    float rag = (q3.r - 0.5) * 0.07 + (n3v(P / 0.09).g - 0.5) * 0.03;
    float s2 = sel + rag;
    float kV = smoothstep(0.34, 0.42, s2), kO = smoothstep(0.45, 0.52, s2), kG = smoothstep(0.55, 0.61, s2), kP = smoothstep(0.66, 0.72, s2);
    vec3 lc = base * vec3(1.28, 0.80, 1.05);                                    // pink coralline
    lc = mix(lc, base * vec3(0.85, 0.72, 1.38), kV);                            // violet
    lc = mix(lc, base * vec3(1.55, 1.02, 0.50), kO);                            // orange-gold sponge
    lc = mix(lc, base * vec3(0.78, 1.18, 0.66), kG);                            // green turf
    lc = mix(lc, base * vec3(1.18, 1.12, 1.02), kP);                            // pale crust
    float pores = smoothstep(0.09, 0.03, q3.a) * (kO - kG) ;                     // sponge oscula
    float fuzz = (nF.g - 0.5) * 0.5 * (kG - kP);                                // turf
    float knobs = smoothstep(0.1, 0.3, q3.a) * (1.0 - kV * 0.5) * (1.0 - kO);   // coralline
    lc *= 0.82 + 0.22 * knobs + 0.1 * (q2.b - 0.5) + fuzz - pores * 0.5;
    alb = mix(alb, lc, life * 0.9);
    ao *= 1.0 - pores * 0.4 * life;
  }
  // ice: blue-white, glassy, lit from within
  vec3 V = normalize(P - uCam.xyz);
  vec3 sunPart;
  float trans = ice * 0.6;
  vec3 light = lightAtG(P, Nd, N, ao, vSky, trans, sunPart);
  vec3 col = alb * light;
  if (ice > 0.5) {
    // melt scallops: shallow dimples from the cells of the noise, at two sizes
    vec4 s1 = n3v(P / 8.5), s2 = n3v(P / 3.2 + 4.0);
    vec3 g1 = nGrad(P, 1.0 / 8.5, 3), g2 = nGrad(P, 1.0 / 3.2, 3);
    vec3 Ni = normalize(N + (g1 * 0.32 + g2 * 0.12));
    float rim1 = smoothstep(0.25, 0.42, s1.a), rim2 = smoothstep(0.22, 0.4, s2.a);
    float fr = pow(1.0 - max(dot(-V, Ni), 0.0), 4.0);
    // light comes through the ice from above: turquoise where it is thin and near the surface, deep blue inside
    float thin = exp(-depthOf(P) / 14.0) * (0.45 + 0.55 * smoothstep(0.2, -0.6, Ni.y));
    vec3 through = mix(vec3(0.03, 0.22, 0.42), vec3(0.18, 0.78, 0.92), thin) * (sunAt(P) * 0.32 + skyAt(P) * 0.95);
    vec3 face = vec3(0.78, 0.9, 0.96) * lightAtG(P, Ni, N, ao, vSky, 0.6, sunPart) * 0.45;
    col = through * (0.9 + 0.12 * rim1 + 0.05 * rim2) + face * (0.75 + 0.25 * rim1);
    vec3 Rr = reflect(V, Ni);
    col += skyAt(P) * vec3(0.8, 0.95, 1.0) * smoothstep(-0.1, 0.8, Rr.y) * fr * 0.9;
    col += sunAt(P) * pow(max(dot(Rr, uSunDir.xyz), 0.0), 80.0) * 0.6;
  }
  o = vec4(col, 1.0);
  if (uDbg == 1) o = vec4(vec3(shadowAt(P, N)), 1.0);
  if (uDbg == 2) o = vec4(causticAt(P) * 0.5, 1.0);
  if (uDbg == 3) o = vec4(alb, 1.0);
  if (uDbg == 4) o = vec4(Nd * 0.5 + 0.5, 1.0);
  if (uDbg == 5) o = vec4(vec3(vSky), 1.0);
  if (uDbg == 6) o = vec4(vec3(ao), 1.0);
  if (uDbg == 7) o = vec4(sunPart * 0.2, 1.0);
  if (uDbg == 8) o = vec4(n3v(P / 5.3).rgb, 1.0);
}
#endif
`;

// ---------- the sea surface, from below ----------
const VS_SURFACE = `
layout(location = 0) in vec2 aXZ;
out vec3 vP;
void main() {
  vec3 p = vec3(aXZ.x + uCam.x, 0.0, aXZ.y + uCam.z);
  vP = p;
  gl_Position = uViewProj * vec4(p, 1.0);
}
`;
const FS_SURFACE = `
in vec3 vP; out vec4 o;
vec3 waveN(vec2 x, float t) {
  vec2 g = vec2(0.0);
  // a handful of swells and chop
  const int K = 7;
  vec3 W[7] = vec3[7](vec3(0.9, 0.42, 14.0), vec3(-0.35, 0.94, 9.0), vec3(0.62, -0.78, 6.1), vec3(-0.92, -0.38, 4.3), vec3(0.2, 0.98, 2.7), vec3(0.98, -0.2, 1.9), vec3(-0.6, 0.8, 1.3));
  for (int i = 0; i < K; i++) {
    vec2 d = normalize(W[i].xy); float L = W[i].z; float k = 6.2831853 / L; float c = sqrt(9.81 / k);
    float A = 0.0042 * L * (i < 2 ? 1.0 : 0.8);
    g += d * k * A * cos(k * dot(d, x) - c * k * t * 1.0);
  }
  vec4 n1 = n3v(vec3(x * 0.06 + vec2(t * 0.013, t * 0.009), t * 0.006));
  vec4 n2 = n3v(vec3(x * 0.23 - vec2(t * 0.03, -t * 0.021), 0.5 + t * 0.011));
  vec4 n3 = n3v(vec3(x * 0.61 + vec2(t * 0.05, t * 0.04), 0.25 + t * 0.02));
  g += (n1.rg - 0.5) * 0.08 + (n2.gb - 0.5) * 0.07 + (n3.rg - 0.5) * 0.05;
  return normalize(vec3(-g.x, 1.0, -g.y));
}
vec3 skyAbove(vec3 d) {
  float h = clamp(d.y, 0.0, 1.0);
  vec3 sky = mix(vec3(0.86, 0.93, 1.0) * uSkyTint.rgb, vec3(0.42, 0.66, 0.98), pow(h, 0.6)) * uSunAir.w * 2.6;
  float s = max(dot(d, uSunAir.xyz), 0.0);
  // fair-weather clouds drifting over, brighter where the sun is behind them
  vec2 cp = d.xz / max(d.y, 0.08) * 0.18 + vec2(uCam.w * 0.004, uCam.w * 0.0017);
  float cl = n3v(vec3(cp, 0.3)).r * 0.6 + n3v(vec3(cp * 2.7, 0.7)).g * 0.3 + n3v(vec3(cp * 6.1, 0.1)).b * 0.1;
  cl = smoothstep(0.52, 0.72, cl) * smoothstep(0.05, 0.3, d.y);
  sky = mix(sky, vec3(1.0, 0.98, 0.96) * uSkyTint.rgb * uSunAir.w * 3.0 * (0.8 + 0.6 * pow(s, 6.0)), cl * 0.85);
  sky += uSkyTint.rgb * vec3(1.0, 0.95, 0.85) * (pow(s, 12.0) * 1.2 + pow(s, 180.0) * 8.0 + pow(s, 3000.0) * 400.0) * max(uSunAir.w, 0.6) * 0.25 * (1.0 - uSkyTint.w * 0.7);
  return sky;
}
void main() {
  float t = uCam.w;
  vec3 n = waveN(vP.xz, t);
  vec3 V = normalize(vP - uCam.xyz);
  if (V.y <= 0.0) { o = vec4(0.0); return; }
  vec3 nw = -n;
  vec3 R = refract(V, nw, 1.333);
  float cosI = clamp(dot(V, n), 0.0, 1.0);
  vec3 refl = reflect(V, nw);
  float fd = max(uPlayer.w > -1.0 ? uFloor.x : 60.0, 1.0);
  float Df = fd / max(-refl.y, 0.05);
  vec3 pf = vP + refl * Df;
  vec3 floorLit = uFloor.yzw * 0.75 * exp(-extinction() * Df);
  // the mirror shimmers: each facet of the swell sees a slightly different, brighter or darker piece of the water below
  float slope = length(n.xz);
  vec4 sh = n3v(vec3(vP.xz * 0.42 + n.xz * 3.0, t * 0.05));
  float shimmer = 0.7 + 0.55 * sh.r + 0.9 * smoothstep(0.03, 0.12, slope) * sh.g;
  vec3 below = (inscatter(vP - vec3(0, 0.3, 0), refl, Df) * 1.45 + floorLit * 0.45) * shimmer;
  // glints where a facet turns the sun's refracted light toward the eye
  vec3 Hs = normalize(-V + uSunDir.xyz);
  float glint = pow(max(dot(nw, -Hs) * -1.0, 0.0), 900.0) * 30.0 + pow(max(-dot(nw, Hs), 0.0), 120.0) * 1.2;
  vec3 col;
  if (dot(R, R) < 0.01) {
    col = below + uSunCol.rgb * glint * 0.15;
  } else {
    vec3 Rn = normalize(R);
    float cosT = clamp(dot(Rn, n), 0.0, 1.0);
    float r0 = 0.02; float F = r0 + (1.0 - r0) * pow(1.0 - cosT, 5.0);
    vec3 sky = skyAbove(Rn);
    // the rim of the window splits a little into colours
    float rim = smoothstep(0.25, 0.0, cosT);
    sky *= 1.0 + rim * vec3(0.25, 0.0, -0.2);
    col = mix(sky * (1.0 - F), below, F) + uSunCol.rgb * glint * 0.2;
  }
  o = vec4(col, 1.0);
}
`;

// ---------- light shafts: raymarched sun in-scatter, shadowed by everything, patterned by the waves ----------
const FS_SHAFTS = `
in vec2 vUv; out vec4 o;
uniform sampler2D uDepth;
void main() {
  float dz = texture(uDepth, vUv).r;
  vec4 clip = vec4(vUv * 2.0 - 1.0, dz * 2.0 - 1.0, 1.0);
  vec4 wp = uInvViewProj * clip; wp /= wp.w;
  vec3 ro = uCam.xyz; vec3 rd = normalize(wp.xyz - ro);
  float D = dz >= 0.99999 ? 1e4 : length(wp.xyz - ro);
  if (rd.y > 0.0) D = min(D, (-0.2 - ro.y) / rd.y);
  float Dm = min(D, 120.0);
  vec3 ext = extinction();
  float L_y = max(uSunDir.y, 0.25);
  float c = dot(rd, uSunDir.xyz);
  float ph = sunPhase(c);
  vec3 acc = vec3(0.0);
  const int STEPS = 40;
  float j = ign(gl_FragCoord.xy + vec2(uParams.x * 7.0, uParams.x * 3.0));
  float bmean = max(textureLod(uCaustic, vec2(0.5), 10.0).g, 1e-3);
  float prev = 0.0;
  for (int i = 1; i <= STEPS; i++) {
    float f = (float(i) - 1.0 + j) / float(STEPS);
    float s = Dm * f * f;
    float ds = s - prev; prev = s;
    vec3 p = ro + rd * s;
    if (p.y > -0.1) break;
    vec4 sc = uShadowVP * vec4(p, 1.0);
    vec3 q = sc.xyz / sc.w * 0.5 + 0.5;
    float vis = 1.0;
    if (q.x > 0.0 && q.y > 0.0 && q.x < 1.0 && q.y < 1.0 && q.z < 1.0) vis = texture(uShadow, q);
    float z = -p.y;
    vec2 e = entryXZ(p);
    float beam = textureLod(uCaustic, e * 0.031, 0.5 + min(z * 0.03, 2.5)).g / bmean;
    float contrast = exp(-z / 50.0) * 0.96;
    contrast *= 0.35 + 0.65 * exp(-s / 30.0);           // shafts read near the eye; far away they merge into glow
    float pat = mix(1.0, 0.25 + 0.75 * beam, contrast);
    vec3 sun = uSunCol.rgb * exp(-ext * z / L_y);
    acc += (vis * pat - 1.0) * sun * exp(-ext * s) * ds * ph * 0.9;
    // the torch beam: light scattered back toward the eye from inside its cone
    if (uTorch.w > 0.01 && s < 40.0) {
      vec3 to = p - (uCam.xyz + vec3(0.0, 0.18, 0.0)); float dt2 = length(to); to /= max(dt2, 1e-3);
      float spot = smoothstep(0.80, 0.97, dot(to, uTorch.xyz)) * 0.85 + 0.15 * smoothstep(0.55, 0.85, dot(to, uTorch.xyz));
      float sp2 = smoothstep(0.86, 0.985, dot(to, uTorch.xyz));
      acc += vec3(1.0, 0.95, 0.86) * uTorch.w * sp2 * exp(-ext * (dt2 + s)) / (1.0 + dt2 * dt2 * 0.12) * ds * 0.010;
    }
  }
  o = vec4(acc * uScat.rgb * uScat.w, 1.0);
}
`;

// ---------- ambient occlusion (half resolution) ----------
const FS_SSAO = `
in vec2 vUv; out vec4 o;
uniform sampler2D uDepth; uniform vec2 uNF;
vec3 wpos(vec2 uv) { float d = texture(uDepth, uv).r; vec4 c = vec4(uv * 2.0 - 1.0, d * 2.0 - 1.0, 1.0); vec4 w = uInvViewProj * c; return w.xyz / w.w; }
float lin(float d) { float z = d * 2.0 - 1.0; return 2.0 * uNF.x * uNF.y / (uNF.y + uNF.x - z * (uNF.y - uNF.x)); }
void main() {
  float d0 = texture(uDepth, vUv).r;
  if (d0 >= 0.99999) { o = vec4(1.0); return; }
  vec3 P = wpos(vUv);
  vec2 px = uRes.zw * 2.0;
  vec3 Px = wpos(vUv + vec2(px.x, 0.0)) - P, Py = wpos(vUv + vec2(0.0, px.y)) - P;
  vec3 Px2 = P - wpos(vUv - vec2(px.x, 0.0)), Py2 = P - wpos(vUv - vec2(0.0, px.y));
  if (dot(Px2, Px2) < dot(Px, Px)) Px = Px2;
  if (dot(Py2, Py2) < dot(Py, Py)) Py = Py2;
  vec3 N = normalize(cross(Px, Py));
  if (dot(N, uCam.xyz - P) < 0.0) N = -N;
  float dist = length(P - uCam.xyz);
  float Rr = clamp(dist * 0.05, 0.18, 1.1);
  float j = ign(gl_FragCoord.xy + uParams.x * 5.0);
  vec3 T = normalize(abs(N.y) < 0.9 ? cross(N, vec3(0.0, 1.0, 0.0)) : cross(N, vec3(1.0, 0.0, 0.0))); vec3 Bt = cross(N, T);
  float occ = 0.0;
  for (int i = 0; i < 12; i++) {
    float fi = (float(i) + j) / 12.0;
    float a = fi * 6.2831 * 4.618 + j * 6.2831;
    float r = sqrt(fi), h = sqrt(max(1.0 - r * r, 0.0)) * 0.9 + 0.1;
    vec3 s = P + (T * cos(a) * r + Bt * sin(a) * r + N * h) * Rr * (0.25 + 0.75 * fi);
    vec4 c = uViewProj * vec4(s, 1.0); vec3 sc = c.xyz / c.w * 0.5 + 0.5;
    if (sc.x < 0.0 || sc.y < 0.0 || sc.x > 1.0 || sc.y > 1.0) continue;
    float sd = lin(texture(uDepth, sc.xy).r), sz = lin(sc.z);
    float diff = sz - sd;
    occ += step(0.02, diff) * smoothstep(Rr * 2.0, Rr * 0.5, diff);
  }
  o = vec4(1.0 - occ / 12.0, 0.0, 0.0, 1.0);
}
`;

// ---------- composite: water between the eye and every surface ----------
const FS_COMPOSITE = `
in vec2 vUv; out vec4 o;
uniform sampler2D uScene; uniform sampler2D uDepth; uniform sampler2D uShafts; uniform sampler2D uAO;
void main() {
  vec3 col = texture(uScene, vUv).rgb;
  float dz = texture(uDepth, vUv).r;
  vec4 clip = vec4(vUv * 2.0 - 1.0, dz * 2.0 - 1.0, 1.0);
  vec4 wp = uInvViewProj * clip; wp /= wp.w;
  vec3 ro = uCam.xyz; vec3 rd = normalize(wp.xyz - ro);
  bool sky = dz >= 0.99999;
  float D = sky ? 1e4 : length(wp.xyz - ro);
  if (rd.y > 0.0) D = min(D, (-0.0 - ro.y) / rd.y);
  vec3 T = exp(-extinction() * D);
  vec3 ins = inscatter(ro, rd, D);
  // upsample the half-resolution shafts, guided by depth
  vec2 hp = uRes.zw * 2.0;
  vec3 sh = vec3(0.0); float wsum = 0.0;
  float lz = sky ? 1e4 : D;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 uv = vUv + vec2(float(x), float(y)) * hp;
    float w = 1.0 / (1.0 + float(x * x + y * y));
    sh += texture(uShafts, uv).rgb * w; wsum += w;
  }
  sh /= wsum;
  if (any(isnan(col))) col = vec3(0.0);
  // occlusion, upsampled with the same weights as the shafts
  float ao = 0.0, aw = 0.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 uv = vUv + vec2(float(x), float(y)) * uRes.zw * 2.0;
    float w = 1.0 / (1.0 + float(x * x + y * y));
    ao += texture(uAO, uv).r * w; aw += w;
  }
  ao /= aw;
  col *= mix(1.0, ao * ao, 0.7);
  vec3 c = (sky ? vec3(0.0) : col * T) + ins + sh;
  if (sky && rd.y > 0.0) c = col * T + ins + sh;
  o = vec4(max(c, vec3(0.0)), 1.0);
#ifdef DBG
  o = vec4(col, 1.0);
#endif
#ifdef DBGSH
  o = vec4(sh * 4.0 + 0.25, 1.0);
#endif
}
`;

// ---------- bloom + tone ----------
const FS_DOWN = `
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uFirst;
void main() {
  vec3 a = texture(uSrc, vUv + uTexel * vec2(-1.0, -1.0)).rgb;
  vec3 b = texture(uSrc, vUv + uTexel * vec2(1.0, -1.0)).rgb;
  vec3 c = texture(uSrc, vUv + uTexel * vec2(-1.0, 1.0)).rgb;
  vec3 d = texture(uSrc, vUv + uTexel * vec2(1.0, 1.0)).rgb;
  vec3 e = texture(uSrc, vUv).rgb;
  vec3 s = (a + b + c + d) * 0.125 + e * 0.5;
  if (any(isnan(s)) || any(isinf(s))) s = vec3(0.0);
  if (uFirst > 0.5) { float l = dot(s, vec3(0.2126, 0.7152, 0.0722)); s *= 1.0 / (1.0 + l * 0.05); }
  o = vec4(s, 1.0);
}
`;
const FS_UP = `
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform vec2 uTexel; uniform float uW;
void main() {
  vec3 s = vec3(0.0);
  s += texture(uSrc, vUv + uTexel * vec2(-1, -1)).rgb * 1.0;
  s += texture(uSrc, vUv + uTexel * vec2(0, -1)).rgb * 2.0;
  s += texture(uSrc, vUv + uTexel * vec2(1, -1)).rgb * 1.0;
  s += texture(uSrc, vUv + uTexel * vec2(-1, 0)).rgb * 2.0;
  s += texture(uSrc, vUv).rgb * 4.0;
  s += texture(uSrc, vUv + uTexel * vec2(1, 0)).rgb * 2.0;
  s += texture(uSrc, vUv + uTexel * vec2(-1, 1)).rgb * 1.0;
  s += texture(uSrc, vUv + uTexel * vec2(0, 1)).rgb * 2.0;
  s += texture(uSrc, vUv + uTexel * vec2(1, 1)).rgb * 1.0;
  o = vec4(s / 16.0 * uW, 1.0);
}
`;
const FS_LUM = `
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform sampler2D uPrev; uniform float uDt;
void main() {
  // average log luminance over a sparse grid, centre-weighted, then adapt
  float s = 0.0, w = 0.0;
  for (int y = 0; y < 12; y++) for (int x = 0; x < 16; x++) {
    vec2 uv = (vec2(float(x), float(y)) + 0.5) / vec2(16.0, 12.0);
    float cw = 1.0 - 0.6 * length(uv - 0.5);
    vec3 c = textureLod(uSrc, uv, 0.0).rgb;
    float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
    s += log(max(l, 1e-4)) * cw; w += cw;
  }
  float avg = exp(s / w);
  float prev = texture(uPrev, vec2(0.5)).r;
  if (prev <= 0.0) prev = avg;
  float k = 1.0 - exp(-uDt * (avg > prev ? 2.2 : 1.1));
  o = vec4(mix(prev, avg, k), 0.0, 0.0, 1.0);
}
`;
const FS_TONE = `
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc; uniform sampler2D uBloom; uniform sampler2D uLum;
uniform float uExpMin, uExpMax, uSat, uBloomK, uFade;

// ---- 50-player.js ----
// The swimmer: mouse looks, WASD swims where you look, Space rises, C or Ctrl sinks, Shift kicks hard.
// Thrust comes in kicks; the water carries you a little after you stop. It should never feel like floating.
const Input = {
  keys: new Set(), dx: 0, dy: 0, locked: false, torchOff: false,
  init() {
    addEventListener('keydown', (e) => {
      this.keys.add(e.code);
      if (e.code === 'KeyT') this.toggleTorch();
      if (e.code === 'KeyF') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().then(() => { if (Game.started && !Game.paused) canvas.requestPointerLock(); }).catch(() => {}); }
      if (e.code === 'KeyM') Audio2 && Audio2.toggleMute && Audio2.toggleMute();
      if (['Space', 'ControlLeft', 'Tab', 'KeyS', 'KeyW'].includes(e.code) && this.locked) e.preventDefault();
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => this.keys.clear());
    addEventListener('mousemove', (e) => { if (this.locked) { this.dx += e.movementX; this.dy += e.movementY; } });
    addEventListener('mousedown', (e) => { if (e.button === 2 && this.locked) this.toggleTorch(); });
    addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('pointerlockchange', () => { this.locked = document.pointerLockElement === canvas; Game.onLock(this.locked); });
  },
  down(c) { return this.keys.has(c); },
  toggleTorch() { this.torchOff = !this.torchOff; Audio2.event('torch', { on: !this.torchOff }); },
};

const Player = {
  pos: [-1.5, -6.2, 14], vel: [0, 0, 0], yaw: 0.05, pitch: -0.12, look: [0, 0, -1],
  kick: 0, kickPhase: 0, bob: [0, 0, 0], roll: 0, speed: 0, effort: 0,
  cam: [0, 0, 0], camLook: [0, 0, -1], fovK: 0,
  update(dt) {
    // look
    const sens = 0.0021;
    this.yawRate = dt > 0 ? (-Input.dx * sens) / dt : 0;
    this.yaw -= Input.dx * sens; this.pitch -= Input.dy * sens;
    Input.dx = 0; Input.dy = 0;
    this.pitch = clamp(this.pitch, -1.53, 1.53);
    const cp = Math.cos(this.pitch);
    const fwd = [Math.sin(this.yaw) * cp * -1, Math.sin(this.pitch), Math.cos(this.yaw) * cp * -1];
    this.look = fwd;
    const right = [Math.cos(this.yaw), 0, -Math.sin(this.yaw)];
    // intent
    const f = (Input.down('KeyW') || Input.down('ArrowUp') ? 1 : 0) - (Input.down('KeyS') || Input.down('ArrowDown') ? 1 : 0);
    const s = (Input.down('KeyD') || Input.down('ArrowRight') ? 1 : 0) - (Input.down('KeyA') || Input.down('ArrowLeft') ? 1 : 0);
    const u = (Input.down('Space') ? 1 : 0) - (Input.down('KeyC') || Input.down('ControlLeft') || Input.down('ControlRight') ? 1 : 0);
    const fast = Input.down('ShiftLeft') || Input.down('ShiftRight');
    let dx = fwd[0] * f + right[0] * s, dy = fwd[1] * f + u, dz = fwd[2] * f + right[2] * s;
    const dl = Math.hypot(dx, dy, dz);
    const moving = dl > 0.01;
    if (moving) { dx /= dl; dy /= dl; dz /= dl; }
    const top = fast ? 7.4 : 3.3;
    // kicks: thrust comes in strokes; their rate rises with effort
    this.effort += ((moving ? (fast ? 1 : 0.5) : 0) - this.effort) * (1 - Math.exp(-dt * 3));
    const rate = 0.9 + this.effort * 1.4;
    this.kickPhase += dt * rate * TAU;
    const stroke = Math.max(0, Math.sin(this.kickPhase));
    const surge = moving ? 0.84 + 0.3 * stroke * stroke : 0;
    const resp = moving ? 3.2 + 1.6 * stroke : 1.3;    // how fast velocity follows intent; coasting when there is none
    const k = 1 - Math.exp(-dt * resp);
    const tx = dx * top * surge, ty = dy * top * surge, tz = dz * top * surge;
    this.vel[0] += (tx - this.vel[0]) * k; this.vel[1] += (ty - this.vel[1]) * k; this.vel[2] += (tz - this.vel[2]) * k;
    // the water moves you a little in the shallows
    const cur = Env.current;
    const depth = -this.pos[1];
    const carry = Math.exp(-depth / 10) * 0.35;
    // a river of current carries you with it
    const fl = Env.flow;
    this.pos[0] += (this.vel[0] + cur[0] * carry + fl[0]) * dt;
    this.pos[1] += (this.vel[1] + fl[1]) * dt;
    this.pos[2] += (this.vel[2] + cur[2] * carry + fl[2]) * dt;
    this.collide();
    Flora.collide(this.pos, this.vel, 0.45);
    if (this.pos[1] > -0.5) { this.pos[1] = -0.5; if (this.vel[1] > 0) this.vel[1] *= 0.3; }
    this.speed = Math.hypot(this.vel[0], this.vel[1], this.vel[2]);
    // camera: a slight lift with each stroke, a little roll into turns and strafes
    const kb = moving ? Math.sin(this.kickPhase) : 0;
    this.bob[1] += ((kb * 0.018 * (0.5 + this.effort)) - this.bob[1]) * (1 - Math.exp(-dt * 8));
    const rollT = -s * 0.035 - clamp(this.yawRate || 0, -3, 3) * 0.012;
    this.roll += (rollT - this.roll) * (1 - Math.exp(-dt * 4));
    this.cam[0] = this.pos[0]; this.cam[1] = this.pos[1] + this.bob[1]; this.cam[2] = this.pos[2];
    this.camLook = fwd;
    this.fovK += ((fast && moving ? 1 : 0) - this.fovK) * (1 - Math.exp(-dt * 2.2));
  },
  collide() {
    const p = this.pos, R = 0.55;
    for (let it = 0; it < 2; it++) {
      const d = World.density(p[0], p[1], p[2]);
      if (d < -R - 0.4) return;
      const e = 0.25;
      const gx = World.density(p[0] + e, p[1], p[2]) - d, gy = World.density(p[0], p[1] + e, p[2]) - d, gz = World.density(p[0], p[1], p[2] + e) - d;
      const gl2 = Math.hypot(gx, gy, gz) || 1;
      const nx = -gx / gl2, ny = -gy / gl2, nz = -gz / gl2;
      // density is roughly metres from the surface; push out to R
      const dist = -d * (e / gl2);
      if (dist >= R) return;
      const push = R - dist;
      p[0] += nx * push; p[1] += ny * push; p[2] += nz * push;
      const vn = this.vel[0] * nx + this.vel[1] * ny + this.vel[2] * nz;
      if (vn < 0) { this.vel[0] -= vn * nx * 1.05; this.vel[1] -= vn * ny * 1.05; this.vel[2] -= vn * nz * 1.05; }
    }
  },
};

      const P = (s, t) => { const x = (s - 0.5) * W, z = cup * x * x / W + ruff * Math.sin(s * 9 + t * 4 + k) * t + 0.07 * t * t * Math.sin(k); return [bl.x + cy * x - sy * z, 0.03 + t * H, sy * x + cy * z]; };
      const base = mb.count;
      for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
        const s = i / nu, t = j / nv, p = P(s, t), a = P(s + 0.01, t), b = P(s, t + 0.01);
        const ux = a[0] - p[0], uy = a[1] - p[1], uz = a[2] - p[2], wx = b[0] - p[0], wy = b[1] - p[1], wz = b[2] - p[2];
        let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx; const nl = Math.hypot(nx, ny, nz) || 1;
        const edge = smooth(0.25, 0.9, Math.hypot((s - 0.5) * 1.7, t * 1.05));
        mb.v(p[0], p[1], p[2], nx / nl, ny / nl, nz / nl, [0.86 + 0.14 * t, edge, 0.75 + 0.25 * t, t], [0.7, 0, t, KR.lace], 0.03 + 0.94 * (bl.flip ? 1 - s : s), 0.98 - 0.78 * t);
      }
      for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = base + j * (nu + 1) + i; mb.tri(a, a + 1, a + nu + 2); mb.tri(a, a + nu + 2, a + nu + 1); }
    }
    rtube(mb, [{ x: 0, y: -0.04, z: 0, r: 0.02 }, { x: 0, y: 0.0, z: 0, r: 0.014 }, { x: 0, y: 0.04, z: 0, r: 0.008 }], lod ? 4 : 6, (k, t) => AT(0.7, 0.2 * t, 0.7, 0, 0.2, 0, 0, 0), { cap: 0.5 });
  },
});

// ---- anemone (Heteractis magnifica): a bright column, an oral disc packed with blunt tentacles that sway together ----
// kind 36 (tentacles: palette base, tips toward the accent; t = along the tentacle); the column is the accent colour.
Flora.def('anemone', {
  size: 'medium', sway: [0.16, 1.2, 0.9, 0.02], mat: [0.65, 0, 0, 0.5],
  pal: [[[0.88, 0.74, 0.50], [0.82, 0.18, 0.30]], [[0.74, 0.70, 0.44], [0.58, 0.30, 0.78]], [[0.94, 0.64, 0.42], [0.97, 0.86, 0.72]], [[0.62, 0.68, 0.44], [0.30, 0.52, 0.88]]],
  build(mb, rnd, lod, v) {
    const g = RS(8, v), R = [0.2, 0.17, 0.22][v];
    mb.lathe([[R * 0.8, -0.06], [R * 0.84, 0.0], [R * 0.9, 0.03], [R * 1.0, 0.048], [R * 0.95, 0.056], [0.0, 0.06]], lod ? 8 : 16, (t) => AT(0.75 + 0.25 * t, 1, 0.6 + 0.4 * t, 0.05, 0.4, 0, 0, 0));
    const n = lod ? 70 : 200, segs = lod ? 1 : 3, sides = lod ? 3 : 4;
    for (let i = 0; i < n; i++) {
      const f = Math.sqrt((i + 0.5) / n), rr = 0.01 + f * R * 0.96, a = i * 2.39996 + g() * 0.3;
      const x = Math.cos(a) * rr, z = Math.sin(a) * rr, out = 0.25 + 2.2 * f * f;
      const len = R_(g, 0.07, 0.12) * (lod ? 1.05 : 1) * [1, 0.85, 1.15][v], r0 = R_(g, 0.0088, 0.0108) * (lod ? 1.4 : 1);
      let dx = Math.cos(a) * out + (g() - 0.5) * 0.4, dy = 1, dz = Math.sin(a) * out + (g() - 0.5) * 0.4;
      const pts = []; let px = x, py = 0.055, pz = z;
      for (let k = 0; k <= segs; k++) {
        const l = Math.hypot(dx, dy, dz);
        pts.push({ x: px, y: py, z: pz, r: r0 * (1 - 0.18 * k / segs) });
        px += dx / l * len / segs; py += dy / l * len / segs; pz += dz / l * len / segs;
        dx += Math.cos(a) * 0.35 * f; dy -= 0.3 * f * f; dz += Math.sin(a) * 0.35 * f;
      }
      rtube(mb, pts, sides, (k, t) => AT(0.92 + 0.08 * t, 0, 0.75 + 0.25 * t, 0.3 + 0.7 * t, 0.7, 0, t, KR.tentacle), { cap: 1.1, round: false, rot: a });
    }
    bakeAO(mb, 0, { res: lod ? 12 : 20, k: 0.6, lo: 0.3, up: 0.6 });
  },
});


// ---- giant clam (Tridacna): ribbed valves gaping on a velvet mantle that spills over their scalloped lips ----
// kinds 38 (shell; t from the hinge to the lip) and 37 (mantle, palette accent; t: 0 along the middle .. 1 at the edge).
// Variants: 0 maxima, 1 squamosa (broad, fluted), 2 crocea (bored into the rock, only the mantle and lips showing).
Flora.def('clam', {
  size: 'small', d0: 12, d1: 45, sway: [0, 1, 0, 0], mat: [0.35, 0.3, 0, 0.35], glow: [0.04, 0.22, 0.32],
  pal: [[[0.80, 0.78, 0.70], [0.05, 0.56, 0.96]], [[0.76, 0.74, 0.66], [0.10, 0.76, 0.64]], [[0.82, 0.80, 0.72], [0.30, 0.40, 0.94]], [[0.78, 0.76, 0.68], [0.90, 0.66, 0.18]]],
  build(mb, rnd, lod, v) {
    const L = [0.42, 0.5, 0.3][v], H = [0.16, 0.19, 0.06][v], W = [0.1, 0.13, 0.05][v], F = [5, 5, 6][v], A = [0.018, 0.024, 0.01][v], sink = [0.02, 0.03, 0.05][v];
    const nu = lod ? 10 : 34, nv = lod ? 3 : 9;
    const wid = (u) => Math.pow(Math.max(0, Math.sin(u * Math.PI)), 0.55);
    const lipY = (u) => H * (0.35 + 0.65 * Math.sin(u * Math.PI)) - sink;
    const gap = (u) => (0.03 + 0.045 * Math.sin(u * Math.PI)) * (v === 1 ? 1.2 : 1);
    const zig = (u) => A * Math.sin(u * F * 2 * Math.PI) * wid(u);             // the gape zigzags where the valves interlock
    for (const s of [1, -1]) {
      surf(mb, nu, nv, (u, w) => {
        const x = (u - 0.5) * L, rib = Math.cos(u * F * 2 * Math.PI) * A * 0.8 * Math.pow(w, 1.4) * wid(u);
        const y = -sink - 0.03 + (lipY(u) + sink + 0.03) * (1 - Math.pow(1 - w, 1.7)) + 0.4 * Math.abs(rib);
        const z = zig(u) * w * w + s * (W * wid(u) * Math.sin(Math.min(1, w * 1.08) * Math.PI * 0.88) + gap(u) * 0.5 * w * w + rib);
        return [x, y, z];
      }, (u, w) => AT(0.82 + 0.18 * w, 0, 0.55 + 0.45 * w, 0, 0.06, 0, w, KR.shell), { flip: s < 0 });
    }
    // the mantle: across the gape and out over the lips, ruffled, sagging a little at its edge
    surf(mb, nu, lod ? 2 : 6, (u, q) => {
      const x = (u - 0.5) * L * 0.97, w = q * 2 - 1, edge = Math.abs(w);
      const over = (0.016 + 0.01 * Math.sin(u * 31 + w * 3) * Math.sin(u * 13)) * (v === 2 ? 1.6 : 1);
      const lipZ = W * wid(u) * Math.sin(0.88 * Math.PI) + gap(u) * 0.5;
      const z = zig(u) + w * (lipZ * Math.pow(edge, 0.7) + over * Math.pow(edge, 4));
      const y = lipY(u) + 0.014 * (1 - w * w) * wid(u) - 0.008 * Math.pow(edge, 8) + 0.004 * Math.sin(u * 47 + w * 5) * edge;
      return [x, y + 0.006, z];
    }, (u, q) => AT(1, 1, 1, 0, 0.45, 0.6, Math.abs(q * 2 - 1), KR.mantle), { flip: true });
    // the exhalant siphon, a small raised mouth near one end
    if (!lod) {
      const u = 0.8, x = (u - 0.5) * L * 0.97, z = zig(u), y = lipY(u) + 0.012 * wid(u);
      rtube(mb, [{ x, y: y - 0.004, z, r: 0.011 }, { x, y: y + 0.008, z, r: 0.009 }], 8, (k) => AT(k ? 0.55 : 1, 1, 1, 0, 0.4, 0.5, 0.2, KR.mantle), { cap: 0.25, round: false });
    }
  },
});

// ---- barrel sponge (Xestospongia): a great vase, its wall thrown into deep knobbly ridges, a dark well inside ----
// kind 39 (t: 0 the outer wall .. 1 deep in the well). Variants: 0 tall barrel, 1 squat bowl, 2 flaring vase.
Flora.def('barrel', {
  size: 'big', solid: [0.48, 0.5], sway: [0, 1, 0, 0], mat: [0.08, 0, 0, 0.15],
  pal: [[[0.62, 0.32, 0.26], [0.80, 0.52, 0.40]], [[0.68, 0.46, 0.32], [0.86, 0.64, 0.46]], [[0.52, 0.34, 0.46], [0.72, 0.54, 0.64]], [[0.72, 0.50, 0.38], [0.88, 0.72, 0.56]]],
  build(mb, rnd, lod, v) {
    const g = RS(10, v), H = [1.05, 0.66, 0.95][v], R0 = [0.24, 0.3, 0.15][v], R1 = [0.47, 0.56, 0.52][v], N = [16, 19, 14][v], k1 = g() * 6, k2 = g() * 6;
    const rad = (t) => R0 + (R1 - R0) * (v === 2 ? Math.pow(t, 1.3) : Math.sin(Math.min(1, t * 1.12) * Math.PI * 0.6));
    const wall = [0.07, 0.08, 0.05][v];
    const prof = [];
    const rows = lod ? 5 : 15;
    for (let i = 0; i <= rows; i++) { const t = i / rows; prof.push([rad(t), -0.06 + t * (H + 0.06), Math.min(1, t * 4) * (1 - 0.3 * smooth(0.9, 1, t))]); }
    prof.push([rad(1) - wall * 0.45, H + 0.02, 0.35], [rad(1) - wall, H - 0.01, 0.2]);
    const deep = lod ? 2 : 4;
    for (let i = 1; i <= deep; i++) { const t = i / deep, y = H - 0.01 - t * H * 0.72; prof.push([Math.max(0.01, (rad(1 - t * 0.7) - wall) * (1 - 0.5 * t * t)), y, 0.15]); }
    // ridges: N wandering laminae round the wall, their crests broken into knobs; a far mesh keeps them shallower
    const amp = lod ? 0.07 : 0.12;
    const rfn = (a, y, w) => {
      const t = y / H, ph = a * N / 2 + 0.4 * Math.sin(t * 5 + k1) + 0.25 * Math.sin(a * 3 + k2);
      const crest = Math.pow(Math.abs(Math.cos(ph)), 2.5), knob = 0.72 + 0.28 * Math.cos(t * 24 + a * 2 + k1);
      return 1 + amp * w * (crest * knob - 0.35);
    };
    revolve(mb, prof, lod ? 30 : 96, rfn, (k) => { const inner = k > rows + 1; return AT(inner ? 0.55 : 0.95, inner ? 0.35 : 0, inner ? 0.45 : 1, 0, 0.05, 0, inner ? 0.6 + 0.4 * (k - rows - 2) / deep : 0, KR.sponge); });
    // grooves between the ridges hold the dark; rims of the crests catch the light
    for (let i = 0; i < mb.count; i++) {
      const x = mb.p[i * 3], y = mb.p[i * 3 + 1], z = mb.p[i * 3 + 2], r = Math.hypot(x, z), t = y / H;
      if (y > H || t < 0) continue;
      const r0 = rad(Math.max(0, Math.min(1, (y + 0.06) / (H + 0.06))));
      mb.c[i * 4 + 2] *= 0.55 + 0.45 * smooth(-0.04, 0.03, (r - r0) / Math.max(r0, 0.05) * 1.0);
    }
  },
});

// ---- tube sponges (Aplysina, Callyspongia): clusters of thin-walled tubes open at the top, often vivid ----
// kind 39 as the barrel. Variants: 0 a clump of long tubes, 1 a few fat ones, 2 slender leaning fingers.
Flora.def('tubesponge', {
  size: 'medium', sway: [0.012, 1.5, 0.4, 0], mat: [0.3, 0, 0, 0.3],
  pal: [[[0.58, 0.34, 0.72], [0.76, 0.52, 0.86]], [[0.95, 0.80, 0.28], [0.99, 0.90, 0.46]], [[0.96, 0.52, 0.24], [0.99, 0.70, 0.40]], [[0.44, 0.62, 0.94], [0.64, 0.80, 0.99]]],
  build(mb, rnd, lod, v) {
    const g = RS(17, v), n = [6, 3, 7][v];
    for (let i = 0; i < n; i++) {
      const a = i * 2.39996 + g() * 0.6, d = Math.sqrt((i + 0.3) / n) * [0.13, 0.08, 0.16][v];
      const H = R_(g, 0.3, 0.6) * [1, 0.8, 1.2][v] * (1 - 0.25 * i / n), r = R_(g, 0.035, 0.05) * [1, 1.7, 0.7][v], wl = r * 0.22;
      const lean = (v === 2 ? 0.35 : 0.12) * (0.5 + g()), lx = Math.cos(a) * lean, lz = Math.sin(a) * lean, ridged = v !== 1;
      const prof = [], rows = lod ? 2 : 7;
      for (let k = 0; k <= rows; k++) { const t = k / rows; prof.push([r * (0.85 + 0.25 * t + 0.06 * Math.sin(t * 9 + i)), -0.04 + t * (H + 0.04), 1]); }
      prof.push([r * 1.1 - wl * 0.5, H + 0.008, 0.3], [r * 1.1 - wl, H - 0.005, 0.2], [r * 0.8 - wl, H * 0.7, 0.1], [Math.max(0.005, r * 0.6 - wl), H * 0.35, 0.05]);
      const k1 = g() * 6;
      revolve(mb, prof, lod ? 5 : 14, ridged ? (an, y, w) => 1 + 0.06 * w * Math.cos(an * 9 + y * 6 + k1) : (an, y, w) => 1 + 0.03 * w * Math.sin(an * 5 + y * 23 + k1),
        (k) => { const inner = k > rows + 1; return AT(inner ? 0.5 : 0.92 + 0.08 * k / rows, inner ? 0.4 : 0.2 * k / rows, inner ? 0.35 : 1, Math.min(1, k / rows) * 0.7, 0.3, 0, inner ? 0.8 : 0.1 * k / rows, KR.sponge); },
        { ox: Math.cos(a) * d, oz: Math.sin(a) * d, lx, lz });
    }
    bakeAO(mb, 0, { res: lod ? 12 : 20, k: 0.6, lo: 0.3 });
  },
});

// ---- seagrass (Thalassia): shoots of two to five strap blades from the sand, browning tips, a film of epiphytes ----
// kind 40 (t along the blade; uv.x across it).
Flora.def('seagrass', {
  size: 'small', d1: 55, twoSided: true, shadow: false, sway: [0.22, 1.6, 1.0, 0.03], mat: [0.7, 0, 0, 0.3],
  pal: [[[0.28, 0.50, 0.20], [0.66, 0.66, 0.32]], [[0.34, 0.54, 0.22], [0.72, 0.70, 0.36]], [[0.26, 0.44, 0.22], [0.56, 0.56, 0.28]], [[0.38, 0.56, 0.24], [0.70, 0.62, 0.30]]],
  build(mb, rnd, lod, v) {
    const g = RS(13, v), shoots = lod ? 4 : 8, segs = lod ? 2 : 5;
    for (let i = 0; i < shoots; i++) {
      const a = i * 2.39996 + g() * 0.5, d = Math.sqrt((i + 0.5) / shoots) * 0.2, bx = Math.cos(a) * d, bz = Math.sin(a) * d, ba = g() * TAU;
      const nb = lod ? 2 : 2 + Math.floor(g() * 3);
      for (let j = 0; j < nb; j++) {
        const L = R_(g, 0.2, 0.42) * (1 - 0.25 * j / nb), wd = R_(g, 0.0045, 0.006) * (lod ? 1.3 : 1), lean = R_(g, 0.25, 0.7), fa = ba + (j - (nb - 1) / 2) * 0.3;
        const dx = Math.cos(fa), dz = Math.sin(fa), pts = [], sv = [];
        for (let k = 0; k <= segs; k++) { const t = k / segs; pts.push({ x: bx + dx * lean * t * t * L, y: t * L * (1 - 0.3 * t * lean), z: bz + dz * lean * t * t * L }); sv.push([-dz, 0, dx]); }
        mb.ribbon(pts, sv, (t) => wd * (t < 0.85 ? 1 : Math.sqrt(Math.max(0.05, 1 - ((t - 0.85) / 0.15) ** 2))), (t) => AT(0.95, 0, 0.55 + 0.45 * t, t, 0.7, 0, t, KR.blade));
      }
    }
  },
});

// ---- sea urchins: Diadema (long thin black spines), Echinometra (short and stout in its burrow), slate pencil ----
// kind 41 (t: 0 the test .. 1 a spine's tip).
Flora.def('urchin', {
  size: 'small', sway: [0, 1, 0, 0], mat: [0.1, 0, 0, 0.12],
  pal: [[[0.05, 0.045, 0.06], [0.16, 0.48, 0.9]], [[0.28, 0.07, 0.13], [0.62, 0.22, 0.32]], [[0.09, 0.06, 0.12], [0.92, 0.52, 0.16]], [[0.42, 0.16, 0.10], [0.74, 0.44, 0.30]]],
  build(mb, rnd, lod, v) {
    const g = RS(14, v), R = [0.05, 0.042, 0.048][v];
    hemi(mb, lod ? 1 : 2, (x, y, z) => [x * R, R * 0.7 + y * R * 0.78, z * R], (d) => AT(0.9, 0, 0.6 + 0.4 * smooth(-0.5, 0.8, d[1]), 0, 0.05, 0, 0, KR.urchin), -0.75);
    const n = lod ? [55, 45, 16][v] : [170, 120, 30][v];
    for (let i = 0; i < n; i++) {
      const yy = 1 - (i + 0.5) / n * 1.55, rr = Math.sqrt(Math.max(0, 1 - yy * yy)), az = i * 2.39996 + g() * 0.3;
      const dx = Math.cos(az) * rr, dy = yy, dz = Math.sin(az) * rr;
      const L = [R_(g, 0.11, 0.24), R_(g, 0.03, 0.055), R_(g, 0.045, 0.075)][v] * (1 - 0.25 * Math.max(0, -yy));
      const x = dx * R * 0.92, y = R * 0.7 + dy * R * 0.78 * 0.92, z = dz * R * 0.92;
      const c0 = [0.9, 0, 0.75, 0], e0 = [0.05, 0, 0.1, KR.urchin], c1 = [1, 0, 1, 0], e1 = [0.15, 0, 1, KR.urchin];
      if (v === 2) { if (lod) spike(mb, x, y, z, dx, dy, dz, 0.007, L, 3, c0, e0, c1, e1, az); else twig(mb, x, y, z, dx, dy, dz, 0.0055, L, 5, c0, e0, c1, e1, az); }
      else spike(mb, x, y, z, dx, dy, dz, (v === 1 ? 0.0028 : 0.0017) * (lod ? 1.6 : 1), L, 3, c0, e0, c1, e1, az);
    }
  },
});

// ---- sea stars: Linckia (blue, smooth tubular arms), Protoreaster (stout, knobbed), Fromia (slender, red) ----
// kind 42 (t: 0 at the centre .. 1 at an arm's tip).
Flora.def('star', {
  size: 'small', sway: [0, 1, 0, 0], mat: [0.12, 0, 0, 0.12],
  pal: [[[0.20, 0.42, 0.90], [0.36, 0.60, 0.99]], [[0.88, 0.48, 0.24], [0.20, 0.11, 0.09]], [[0.86, 0.20, 0.15], [0.98, 0.62, 0.42]], [[0.92, 0.66, 0.30], [0.46, 0.22, 0.14]]],
  build(mb, rnd, lod, v) {
    const g = RS(15, v), R = [0.15, 0.11, 0.1][v], r0 = [0.014, 0.028, 0.011][v], segs = lod ? 2 : 5;
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * TAU + g() * 0.18, curl = (g() - 0.5) * 0.7, pts = [];
      for (let k = 0; k <= segs; k++) { const t = k / segs, an = a + curl * t * t, rr = r0 * 0.8 + t * R, r = r0 * (1 - 0.62 * t); pts.push({ x: Math.cos(an) * rr, y: r * 0.55 + 0.002, z: Math.sin(an) * rr, r }); }
      rtube(mb, pts, lod ? 3 : 6, (k, t) => AT(1, 0, 0.85 + 0.15 * t, 0, 0.12, 0, t, KR.star), { cap: 0.8, rmod: (k, an) => 1 - 0.42 * Math.max(0, -Math.cos(an)) });
    }
    hemi(mb, lod ? 0 : 2, (x, y, z) => [x * r0 * 1.9, 0.002 + Math.max(0, y) * r0 * (v === 1 ? 1.5 : 0.95), z * r0 * 1.9], () => AT(1, 0, 0.95, 0, 0.12, 0, 0, KR.star), -0.05);
  },
});

// ---- rubble: dead branch fragments and lumps of old reef rock, bleached, crusted pink with coralline algae, tufted ----
// kind 43 (t: how much crust).
Flora.def('rubble', {
  size: 'small', d1: 26, shadow: false, sway: [0, 1, 0, 0], mat: [0, 0, 0, 0],
  pal: [[[0.84, 0.80, 0.72], [0.80, 0.50, 0.62]], [[0.70, 0.66, 0.58], [0.66, 0.48, 0.58]], [[0.86, 0.78, 0.68], [0.86, 0.56, 0.66]], [[0.58, 0.56, 0.52], [0.70, 0.52, 0.60]]],
  build(mb, rnd, lod, v) {
    const g = RS(16, v), n = [6, 4, 7][v];
    for (let i = 0; i < n; i++) {
      const x0 = R_(g, -0.2, 0.2), z0 = R_(g, -0.2, 0.2), az = g() * TAU, crust = g();
      if (g() < 0.7) {
        const len = R_(g, 0.06, 0.15), r = R_(g, 0.008, 0.015), bend = (g() - 0.5) * 0.6, pts = [], segs = lod ? 1 : 3;
        for (let k = 0; k <= segs; k++) { const t = k / segs - 0.5, an = az + bend * t; pts.push({ x: x0 + Math.cos(an) * len * t, y: r * 0.4 + Math.abs(t) * 0.01, z: z0 + Math.sin(an) * len * t, r: r * (1 - 0.15 * Math.abs(t)) }); }
        rtube(mb, pts, lod ? 3 : 5, (k, t) => AT(0.92, 0, 0.75, 0, 0, 0, crust, KR.rubble), { cap: 0.6, round: false });
        const stub = g() < 0.6, side = g() < 0.5 ? 1 : -1, sl = R_(g, 0.025, 0.05);
        if (!lod && stub) { const p = pts[1], sa = az + 1.2 * side; twig(mb, p.x, p.y, p.z, Math.cos(sa) * 0.8, 0.5, Math.sin(sa) * 0.8, r * 0.7, sl, 4, [0.92, 0, 0.8, 0], [0, 0, crust, KR.rubble], [0.95, 0, 0.9, 0], [0, 0, crust, KR.rubble], az); }

  K.def('blackcoral', {

// ---- 64-species-deep.js ----
// Deep and mesophotic species: glass sponges, cold-water corals, sea pens, bamboo and bubblegum corals, vent life,

{

  // ---- Lophelia (Desmophyllum pertusum): bushes of zigzag corallites, each budding from the last, cup polyps at the tips;
  // the old base of the colony dull and dead, the living tips white or salmon ----
  K.def('lophelia', {

  K.def('seapen', {

  // ---- bamboo coral (Keratoisis, Isidella): a sparse white candelabra in one plane, its white joints parted by dark

  K.def('bamboo', {

  // ---- vent tube worms (Riftia): clusters of white tubes a metre or two long, blood-red plumes at their mouths ----
  K.def('tubeworm', {

    build(mb, rnd, lod) {

      for (let i = 0; i < n; i++) {
        const a = rnd() * TAU2, d = Math.sqrt(rnd()) * 0.2, bx = Math.cos(a) * d, bz = Math.sin(a) * d;

        const pts = []; for (let k = 0; k <= rings; k++) { const u = k / rings; pts.push(P3(P(u), r * (0.85 + 0.25 * u))); }

  // ---- feather stars (comatulid crinoids): a small cup on gripping cirri, ten feathery arms held up into the water ----
  K.def('crinoid', {

  // ---- mesophotic plate corals (Leptoseris, Pachyseris): thin plates in whorls, overlapping like shingles,
  // ridged parallel to their growing margins (kind 27) ----
  K.def('platecoral', {
    size: 'big', d0: 22, d1: 90, sway: [0, 1, 0, 0], mat: [0.06, 0, 0, 0.2],
    pal: [[[0.52, 0.40, 0.26], [0.88, 0.80, 0.62]], [[0.40, 0.42, 0.26], [0.78, 0.82, 0.60]], [[0.46, 0.32, 0.36], [0.84, 0.70, 0.74]], [[0.60, 0.50, 0.30], [0.94, 0.88, 0.64]]],
    build(mb, rnd, lod) {
      const tiers0 = 2 + Math.floor(rnd() * 2), tiers = tiers0, nu = lod ? 5 : 12, nv = lod ? 2 : 4, R0 = rr(rnd, 0.55, 0.75), T = 0.014;
      mb.lathe([[0.07, -0.05], [0.06, 0.03], [0.045, 0.03 + (tiers - 1) * 0.1]], lod ? 5 : 8, () => AT(0.6, 0.1, 0.5, 0, 0, 0, 0, 0));

        };
        for (const side of [1, -1]) {
          const b0 = mb.count;
          for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
            const u = i / nu, v = j / nv, p = S(u, v), n = sNormal(S, u, v, side < 0);
            mb.v(p[0], p[1] - (side < 0 ? T * (1 - 0.6 * v) : 0), p[2], n[0], n[1], n[2], side > 0 ? [0.95, 0.15 + 0.85 * Math.pow(v, 4), 0.8 + 0.2 * v, 0] : [0.62, 0.1, 0.45 + 0.35 * v, 0], [0.05, 0, 0, side > 0 ? 27 : 0], u, v);
          }
          for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) { const a = b0 + j * (nu + 1) + i; mb.quad(a, a + 1, a + nu + 2, a + nu + 1); }
        }
        // the margin: a thin pale strip joining top and bottom
        const b1 = mb.count;
        for (let i = 0; i <= nu; i++) {
          const u = i / nu, p = S(u, 1), q = S(u, 0.97), o = K.nrm([p[0] - q[0], 0, p[2] - q[2]]);
          mb.v(p[0], p[1], p[2], o[0], 0.3, o[2], [1, 1, 0.95, 0], [0.1, 0, 0, 0], u, 1);
          mb.v(p[0], p[1] - T * 0.4, p[2], o[0], -0.3, o[2], [0.8, 0.6, 0.7, 0], [0.1, 0, 0, 0], u, 1);
        }
        for (let i = 0; i < nu; i++) { const a = b1 + i * 2; mb.quad(a, a + 1, a + 3, a + 2); }
      };
      for (let k = 0; k < tiers; k++) {
        const n = 3 + Math.floor(rnd() * 3), y0 = 0.04 + k * rr(rnd, 0.1, 0.14), Rk = R0 * (1 - 0.22 * k), ph = rnd() * TAU2;
        for (let j = 0; j < n; j++) plate(ph + j / n * TAU2 + (rnd() - 0.5) * 0.4, Math.PI / n * rr(rnd, 1.05, 1.3), y0 + rr(rnd, -0.01, 0.03), 0.04 + k * 0.02, Rk * rr(rnd, 0.8, 1.05), rr(rnd, 0.06, 0.2), rnd() * 9);
      }
    },
  });

  // ---- sea whips (Ellisella, Junceella) and spiral wire coral (Cirrhipathes): long thin rods, bending in the current ----
  K.def('whip', {

  // ---- sea cucumbers of sandy shallows: warty sausages, dark or orange-brown, a paler sole ----

  // ---- sea pigs (Scotoplanes): plump translucent pink bodies walking the abyssal mud on tube-foot legs,
  // two pairs of long papillae raised like antennae ----
  K.def('seapig', {
    size: 'small', d0: 10, d1: 36, sway: [0.015, 1.6, 0.5, 0.003], mat: [0.85, 0.2, 0, 0.6], glow: [0.55, 0.32, 0.42],
    pal: [[[0.92, 0.46, 0.56], [0.98, 0.70, 0.76]], [[0.86, 0.40, 0.52], [0.96, 0.64, 0.72]], [[0.94, 0.56, 0.60], [1.0, 0.76, 0.78]], [[0.84, 0.46, 0.62], [0.95, 0.68, 0.80]]],
    build(mb, rnd, lod) {
      const L = rr(rnd, 0.075, 0.1), R = L * 0.48, a = rnd() * TAU2, ca = Math.cos(a), sa = Math.sin(a);
      const X = (s, h, w) => [ca * s - sa * w, h, sa * s + ca * w];   // along the body, up, across

    },
  });

  // ---- bubblegum coral (Paragorgia arborea): great fleshy trees of pink, red or white, the branch tips swollen ----
  K.def('bubblegum', {
    size: 'big', d0: 24, d1: 105, sway: [0.008, 2, 0.3, 0], mat: [0.35, 0, 0, 0.35],

    build(mb, rnd, lod) {

        for (let k = 1; k <= segs; k++) { dd = K.nrm([dd[0] + (rnd() - 0.5) * 0.25, dd[1] + 0.06, dd[2] + (rnd() - 0.5) * 0.15]); q = K.add3(q, dd, len / segs); if (!lod || k === segs) pts.push(P3(q, r * (1 - 0.2 * k / segs))); }

          mb.blob(q[0] + dd[0] * kr * 0.7, q[1] + dd[1] * kr * 0.7, q[2] + dd[2] * kr * 0.7, kr, kr * 1.25, kr, lod ? 0 : 1, (x, y, z) => 1 + 0.18 * Math.sin(x * 6 + k) * Math.sin(z * 5 + y * 4), () => AT(1, 1, 0.9, 0, 0.4, 0, 2 / 255, 25));

        }

      grow([0, -0.05, 0], [rr(rnd, -0.1, 0.1), 1, rr(rnd, -0.1, 0.1)], 0.05, rr(rnd, 0.26, 0.34), 0);
    },
  });

  // ---- stalked sea lilies (isocrinids): a jointed stalk ringed with cirri, a crown of feathery arms bent back
  // into a bowl against the current ----
  K.def('sealily', {
    size: 'medium', d0: 14, d1: 55, twoSided: true, alpha: true, sway: [0.05, 1.6, 0.4, 0.008], mat: [0.45, 0, 0, 0.4],
    pal: [[[0.88, 0.80, 0.56], [0.98, 0.92, 0.72]], [[0.92, 0.62, 0.30], [0.98, 0.80, 0.50]], [[0.90, 0.88, 0.82], [0.99, 0.97, 0.92]], [[0.76, 0.62, 0.44], [0.92, 0.82, 0.64]]],
    build(mb, rnd, lod) {
      const H = rr(rnd, 0.35, 0.7), bend = rr(rnd, 0.03, 0.1), segs = lod ? 4 : 10;
      const C = (u) => [bend * Math.sin(u * 2.2), u * H - 0.02, 0.02 * Math.sin(u * 5)];
      const pts = []; for (let k = 0; k <= segs; k++) pts.push(P3(C(k / segs), 0.006 * (1 - 0.3 * k / segs)));
      mb.tube(pts, lod ? 3 : 5, (t) => AT(0.85, 0.3 + 0.5 * t, 0.7 + 0.3 * t, 0.4 * t, 0.3, 0, 1 / 255, 25));
      if (!lod) for (let w = 1; w < 7; w++) {     // whorls of cirri
        const c = C(w / 7);
        for (let i = 0; i < 5; i++) { const a = i / 5 * TAU2 + w; K.spike(mb, c, [Math.cos(a), -0.35, Math.sin(a)], rr(rnd, 0.025, 0.04), 0.002, AT(0.85, 0.4, 0.8, 0.2, 0.3, 0, 0, 0)); }
      }
      const top = C(1);
      mb.blob(top[0], top[1] + 0.008, top[2], 0.013, 0.012, 0.013, lod ? 0 : 1, null, () => AT(0.85, 0.5, 0.8, 0.3, 0.3, 0, 0, 0));
      const na = lod ? 6 : 14, as = lod ? 3 : 7;
      for (let j = 0; j < na; j++) {
        const az = j / na * TAU2 + rnd() * 0.2, L = rr(rnd, 0.14, 0.22), P = [];
        let x = top[0], y = top[1] + 0.012, z = top[2], el = rr(rnd, 0.9, 1.2);

          P.push([x, y, z]);

// ---- 65-props-warm.js ----
// Props for the warm places (13-places-warm.js): wrecks, guns, anchors, amphorae, a fighter plane, a lost net, a mooring,
// and three hero corals (a giant Porites, foliose plate coral, an open giant clam). Built at load like the corals; each
// prop builds from its own seed per variant so both levels of detail have the same shape. 1 unit = 1 m at scale 1.
// Palettes are [bare, growth] pairs (sRGB); accent = growth. MB.build winds every triangle to face its normals, so a
// prop only has to get its normals right.
const WarmKit = (() => {
  const { min, max, abs, sin, cos, sqrt, hypot, PI } = Math;
  const n3 = (x, y, z) => World.n3(x, y, z);
  const cl = (x, a, b) => (x < a ? a : x > b ? b : x);
  // patchy growth: 0 bare .. 1 covered; more where the surface faces up
  const grow = (x, y, z, ny, k) => { const g = 0.3 + 1.1 * n3(x * 0.75 + k, y * 0.75, z * 0.75) + 0.5 * n3(x * 2.4, y * 2.4 + k, z * 2.4) + 0.45 * ny; return cl((g - 0.25) * 1.8, 0, 1); };
  // a sheet over (u, v): f(u, v) -> [x, y, z]; normals from the surface itself; front faces look along Pu x Pv
  // a(x, y, z, nx, ny, nz, u, v) -> {c, e}; o.flip turns it over; o.skip(i, j) leaves a quad out (holes)
  function sheet(mb, nu, nv, f, a, o = {}) {
    const base = mb.count, e = 1e-3;
    for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) {
      const u = i / nu, v = j / nv, P = f(u, v);
      const A = f(min(1, u + e), v), Bq = f(max(0, u - e), v), C = f(u, min(1, v + e)), D = f(u, max(0, v - e));
      const ux = A[0] - Bq[0], uy = A[1] - Bq[1], uz = A[2] - Bq[2], vx = C[0] - D[0], vy = C[1] - D[1], vz = C[2] - D[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx; const l = hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
      if (o.flip) { nx = -nx; ny = -ny; nz = -nz; }
      const at = a(P[0], P[1], P[2], nx, ny, nz, u, v);
      mb.v(P[0], P[1], P[2], nx, ny, nz, at.c, at.e, u, v);
    }
    for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
      if (o.skip && o.skip(i, j)) continue;
      const q = base + j * (nu + 1) + i;
      if (o.flip) mb.quad(q, q + nu + 1, q + nu + 2, q + 1); else mb.quad(q, q + 1, q + nu + 2, q + nu + 1);
    }
  }
  // axis-aligned box from six sheets (n subdivisions per face so growth can vary across it)
  function box(mb, x0, y0, z0, x1, y1, z1, a, n = 1) {
    const dx = x1 - x0, dy = y1 - y0, dz = z1 - z0;
    sheet(mb, n, n, (u, v) => [x1, y0 + dy * u, z0 + dz * v], a);
    sheet(mb, n, n, (u, v) => [x0, y0 + dy * v, z0 + dz * u], a);
    sheet(mb, n, n, (u, v) => [x0 + dx * v, y1, z0 + dz * u], a);
    sheet(mb, n, n, (u, v) => [x0 + dx * u, y0, z0 + dz * v], a);
    sheet(mb, n, n, (u, v) => [x0 + dx * u, y0 + dy * v, z1], a);
    sheet(mb, n, n, (u, v) => [x0 + dx * v, y0 + dy * u, z0], a);
  }
  // rotations (row-major 3x3) and appending a scratch builder transformed: p' = R p + t
  const RX = (a) => [1, 0, 0, 0, cos(a), -sin(a), 0, sin(a), cos(a)];
  const RY = (a) => [cos(a), 0, sin(a), 0, 1, 0, -sin(a), 0, cos(a)];
  const RZ = (a) => [cos(a), -sin(a), 0, sin(a), cos(a), 0, 0, 0, 1];
  const MM = (A, B) => { const r = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) r.push(A[i * 3] * B[j] + A[i * 3 + 1] * B[3 + j] + A[i * 3 + 2] * B[6 + j]); return r; };
  function put(mb, src, R, t) {
    const base = mb.count;
    for (let k = 0; k < src.count; k++) {
      const x = src.p[k * 3], y = src.p[k * 3 + 1], z = src.p[k * 3 + 2], nx = src.n[k * 3], ny = src.n[k * 3 + 1], nz = src.n[k * 3 + 2];
      mb.p.push(R[0] * x + R[1] * y + R[2] * z + t[0], R[3] * x + R[4] * y + R[5] * z + t[1], R[6] * x + R[7] * y + R[8] * z + t[2]);
      mb.n.push(R[0] * nx + R[1] * ny + R[2] * nz, R[3] * nx + R[4] * ny + R[5] * nz, R[6] * nx + R[7] * ny + R[8] * nz);
      for (let q = 0; q < 4; q++) { mb.c.push(src.c[k * 4 + q]); mb.e.push(src.e[k * 4 + q]); }
      mb.uv.push(src.uv[k * 2], src.uv[k * 2 + 1]);
    }
    for (const i of src.i) mb.i.push(base + i);
  }
  // growth over everything built since `from`: accent = growth, shade a little brighter where grown
  function encrust(mb, from, k, amt = 1, lift = 0.12) {
    for (let v = from; v < mb.count; v++) {
      const x = mb.p[v * 3], y = mb.p[v * 3 + 1], z = mb.p[v * 3 + 2], ny = mb.n[v * 3 + 1];
      const g = grow(x, y, z, ny, k) * amt;
      mb.c[v * 4 + 1] = g; mb.c[v * 4] = Math.min(1, mb.c[v * 4] * (1 - lift + lift * 2 * g));
    }
  }
  // a tube between two points
  const rod = (mb, a, b, r0, r1, sides, at, cap) => mb.tube([{ x: a[0], y: a[1], z: a[2], r: r0 }, { x: b[0], y: b[1], z: b[2], r: r1 }], sides, () => at, { capTip: cap });
  // a torus in the plane spanned by unit vectors U, V around centre C
  function ring(mb, C, U, V, R, r, seg, sides, at, stretch = 0) {
    const base = mb.count;
    for (let i = 0; i <= seg; i++) {
      const a = i / seg * PI * 2, ca = cos(a), sa = sin(a);
      const ox = ca * (R + (ca > 0 ? stretch : -stretch)), oy = sa * R;   // stretch makes a link longer than wide
      const cx = C[0] + U[0] * ox + V[0] * oy, cy = C[1] + U[1] * ox + V[1] * oy, cz = C[2] + U[2] * ox + V[2] * oy;
      const W = [U[1] * V[2] - U[2] * V[1], U[2] * V[0] - U[0] * V[2], U[0] * V[1] - U[1] * V[0]];
      for (let j = 0; j <= sides; j++) {
        const b = j / sides * PI * 2, cb = cos(b), sb = sin(b);
        const nx = (U[0] * ca + V[0] * sa) * cb + W[0] * sb, ny = (U[1] * ca + V[1] * sa) * cb + W[1] * sb, nz = (U[2] * ca + V[2] * sa) * cb + W[2] * sb;
        mb.v(cx + nx * r, cy + ny * r, cz + nz * r, nx, ny, nz, at.c, at.e, i / seg, j / sides);
      }
    }
    for (let i = 0; i < seg; i++) for (let j = 0; j < sides; j++) { const a = base + i * (sides + 1) + j; mb.quad(a, a + 1, a + sides + 2, a + sides + 1); }
  }
  return { grow, sheet, box, RX, RY, RZ, MM, put, encrust, rod, ring, cl, n3 };
})();

// ---- a wooden sailing ship's bones: keel, frames like ribs, some planking left on the side it lay on ----
// three sections of 9.6 m (variant 0 bow, 1 midships, 2 stern); the place lines them up along local x
Flora.def('shipribs', {
  size: 'big', d0: 34, d1: 115, twoSided: true, sway: [0, 1, 0, 0], mat: [0, 0, 0.05, 0.06],
  pal: [[[0.30, 0.23, 0.17], [0.62, 0.50, 0.47]], [[0.27, 0.22, 0.18], [0.56, 0.54, 0.40]], [[0.33, 0.25, 0.18], [0.66, 0.46, 0.48]], [[0.28, 0.24, 0.20], [0.58, 0.56, 0.50]]],
  build(mb, _r, lod, v) {
    const K = WarmKit, rnd = mulberry32(9101 + v * 31);
    const X0 = v === 0 ? 9.6 : v === 1 ? 0 : -9.6;
    const B = (X) => Math.max(0.4, 3.5 * (1 - Math.pow(Math.abs(X + 0.8) / 15.4, 2.4)));
    const sides = lod ? 3 : 6, np = lod ? 5 : 10;
    const wood = AT(0.9, 0, 0.9, 0, 0, 0, 0, 2);
    const hull = (X, s) => { const b = B(X); return [0.12 + b * (1 - Math.pow(1 - s, 2.3)), 0.42 + 3.5 * Math.pow(s, 1.5)]; };
    const from = mb.count;
    K.box(mb, -4.8, 0, -0.18, 4.8, 0.4, 0.18, () => wood, lod ? 1 : 3);
    K.box(mb, -4.8, 0.4, -0.13, 4.8, 0.66, 0.13, () => wood, lod ? 1 : 3);
    for (let xi = -4.5; xi <= 4.6; xi += 0.62) {

Flora.def('shipanchor', {

  build(mb, _r, lod, v) {

// ---- a steel freighter, about 36 m: 0 the bow with its forecastle, 1 a hold midships (hatch open, frames inside),
// 2 the stern with the deckhouse, funnel, rudder and screw. Keel at y = 0, main deck at y = 6, beam 9 m, along +x ----
Flora.def('freighter', {
  size: 'big', d0: 40, d1: 118, twoSided: true, sway: [0, 1, 0, 0], mat: [0, 0, 0.06, 0.05],
  pal: [[[0.34, 0.26, 0.21], [0.66, 0.48, 0.50]], [[0.30, 0.27, 0.24], [0.62, 0.58, 0.42]], [[0.37, 0.27, 0.20], [0.76, 0.50, 0.34]], [[0.29, 0.27, 0.27], [0.58, 0.52, 0.62]]],
  build(mb, _r, lod, v) {
    const K = WarmKit, from = mb.count, rnd = mulberry32(2207 + v * 13);
    const D = 6.0, Bm = 4.5, rb = 1.4;
    const st = AT(0.88, 0, 0.9, 0, 0, 0, 0, 2), dk = AT(0.6, 0, 0.55, 0, 0, 0, 0, 2), hole = AT(0.12, 0, 0.25, 0, 0, 0, 0, 0);
    const nu = lod ? 6 : 16, nv = lod ? 6 : 14, sides = lod ? 3 : 6;
    // half beam and keel height along the section (bow narrows to the stem, stern to a rounded counter)
    const B = (x) => v === 0 ? Bm * Math.sqrt(Math.max(0.0004, 1 - Math.pow(Math.max(0, x + 6) / 12, 3))) : v === 2 ? Math.max(1.3, Bm * Math.pow(Math.max(0, 1 - Math.pow(Math.max(0, -x - 0.5) / 6.2, 2.6)), 0.45)) : Bm;
    const Y0 = (x) => v === 0 ? 2.4 * Math.pow(Math.max(0, (x - 1.5) / 4.5), 2) : v === 2 ? 2.8 * Math.pow(Math.max(0, (-x - 1.5) / 4.5), 1.6) : 0;
    const rake = (x, y) => v === 0 ? 1.1 * Math.max(0, (x - 1) / 5) * (y / (D + 2)) : v === 2 ? -0.8 * Math.max(0, (-x - 3) / 3) * (y / D) : 0;
    const top = (x) => (v === 0 && x > 0.6 ? D + 2.2 : D) + 1.0;     // bulwark top: forecastle in the bow
    // a point on the hull side: s runs along the girth from the keel (0) to the bulwark top (1)
    const hullPt = (x, s, side) => {
      const b = B(x), y0 = Y0(x), r = Math.min(rb, b * 0.8), H = top(x) - y0;
      const L1 = Math.max(0, b - r), L2 = Math.PI * r / 2, L3 = Math.max(0.01, H - r), Lt = L1 + L2 + L3;
      let g = s * Lt, z, y;
      if (g < L1) { z = g; y = 0; } else if (g < L1 + L2) { const a = (g - L1) / r; z = L1 + r * Math.sin(a); y = r - r * Math.cos(a); } else { z = b; y = r + (g - L1 - L2); }
      y += y0;
      return [x + rake(x, y), y, side * z];
    };
    // the two sides of the hull
    for (const side of [1, -1]) K.sheet(mb, nu, nv, (u, w) => hullPt(-6 + 12 * u, w, side), () => st, { flip: side < 0 });
    // the main deck (the hold's hatch open in the midships section)
    const deckY = (x) => (v === 0 && x > 0.6 ? D + 2.2 : D);
    const hx = 4.0, hz = 2.8;
    K.sheet(mb, nu, lod ? 4 : 8, (u, w) => { const x = -6 + 12 * u, b = B(x) * 0.999; return [x + rake(x, deckY(x)), deckY(x) - 0.02, (w - 0.5) * 2 * b]; }, () => st, {
      flip: true,
      skip: (i, j) => { if (v !== 1) return false; const x = -6 + 12 * (i + 0.5) / nu, z = ((j + 0.5) / (lod ? 4 : 8) - 0.5) * 2 * Bm; return Math.abs(x) < hx && Math.abs(z) < hz; },
    });
    if (v === 0) {   // the step up to the forecastle, the windlass, a hawse pipe
      K.sheet(mb, 1, 4, (u, w) => [0.6, D + 2.2 * u, (w - 0.5) * 2 * B(0.6)], () => st);
      for (const sz of [-1, 1]) { K.rod(mb, [3.0, D + 2.2 + 0.45, sz * 0.4], [3.0, D + 2.2 + 0.45, sz * 1.5], 0.42, 0.42, lod ? 6 : 12, st, true); }
      K.box(mb, 2.5, D + 2.2, -0.35, 3.5, D + 2.85, 0.35, () => st);
      for (const sz of [-1, 1]) { const p = hullPt(4.6, 0.86, sz); K.ring(mb, [p[0], p[1], p[2] + sz * 0.02], [1, 0, 0], [0, 1, 0], 0.32, 0.08, lod ? 8 : 14, 4, dk); }
    }
    if (v === 1) {   // hatch coamings, a fallen hatch beam, frames inside the hold, its floor
      const c0 = D, c1 = D + 0.9;
      K.box(mb, -hx, c0, hz - 0.08, hx, c1, hz + 0.08, () => st, 2); K.box(mb, -hx, c0, -hz - 0.08, hx, c1, -hz + 0.08, () => st, 2);
      K.box(mb, hx - 0.08, c0, -hz, hx + 0.08, c1, hz, () => st); K.box(mb, -hx - 0.08, c0, -hz, -hx + 0.08, c1, hz, () => st);
      K.box(mb, -1.4, c0 + 0.6, -hz, -1.1, c0 + 0.9, hz, () => st);
      const t = new MB(); K.box(t, -0.15, -0.15, -hz, 0.15, 0.15, hz, () => st); K.put(mb, t, K.MM(K.RY(0.5), K.RX(0.4)), [1.6, 2.0, 0.3]);
      K.sheet(mb, 4, 4, (u, w) => [-6 + 12 * u, 1.2, (w - 0.5) * 2 * (Bm - 0.3)], () => dk);
      if (!lod) for (let x = -5.4; x <= 5.5; x += 0.8) for (const sd of [-1, 1]) K.box(mb, x - 0.05, 1.3, sd * (Bm - 0.28) - 0.08, x + 0.05, D - 0.1, sd * (Bm - 0.28) + 0.08, () => dk);
      // two cowl ventilators by the hatch
      for (const [vx, vz] of [[-5.0, 2.6], [4.8, -2.6]]) {
        mb.tube([{ x: vx, y: D, z: vz, r: 0.32 }, { x: vx, y: D + 1.6, z: vz, r: 0.3 }, { x: vx + 0.22, y: D + 2.1, z: vz, r: 0.34 }, { x: vx + 0.55, y: D + 2.25, z: vz, r: 0.46 }], lod ? 6 : 12, () => st);
      }
    }
    if (v === 2) {   // deckhouse in two tiers with window holes, the funnel, boat davits, the rudder and the screw
      const tier = (x0, x1, z, y0, y1) => {
        const nx = lod ? 2 : 8, ny = lod ? 1 : 3;
        const win = (i, j) => !lod && j === ny - 2 && i % 2 === 1;
        K.sheet(mb, nx, ny, (u, w) => [x0 + (x1 - x0) * u, y0 + (y1 - y0) * w, z], () => st, { skip: win });
        K.sheet(mb, nx, ny, (u, w) => [x0 + (x1 - x0) * u, y0 + (y1 - y0) * w, -z], () => st, { skip: win, flip: true });
        K.sheet(mb, lod ? 2 : 6, ny, (u, w) => [x1, y0 + (y1 - y0) * w, -z + 2 * z * u], () => st, { skip: (i, j) => !lod && j === ny - 2 && i % 2 === 1, flip: true });
        K.sheet(mb, 2, ny, (u, w) => [x0, y0 + (y1 - y0) * w, -z + 2 * z * u], () => st);
        K.sheet(mb, 3, 3, (u, w) => [x0 + (x1 - x0) * u, y1, -z + 2 * z * w], () => st, { flip: true });
      };
      tier(-5.2, 1.2, 3.7, D, D + 2.6);
      tier(-3.6, 0.6, 3.0, D + 2.6, D + 5.0);
      // the funnel, raked aft
      mb.tube([{ x: -2.0, y: D + 4.9, z: 0, r: 1.0 }, { x: -2.35, y: D + 6.4, z: 0, r: 0.98 }, { x: -2.7, y: D + 7.9, z: 0, r: 0.96 }], lod ? 8 : 16, () => st);
      mb.tube([{ x: -2.7, y: D + 7.9, z: 0, r: 0.9 }, { x: -2.55, y: D + 6.5, z: 0, r: 0.88 }], lod ? 8 : 16, () => hole);
      // boat davits along the deckhouse, empty (the boats went)
      for (const sd of [-1, 1]) for (const dx of [-4.3, -1.8]) mb.tube([{ x: dx, y: D + 2.6, z: sd * 3.4, r: 0.09 }, { x: dx, y: D + 4.2, z: sd * 3.6, r: 0.085 }, { x: dx, y: D + 4.6, z: sd * 4.3, r: 0.08 }, { x: dx, y: D + 4.0, z: sd * 4.7, r: 0.075 }], sides, () => st, { capTip: true });
      // bridge wing rails
      if (!lod) for (const sd of [-1, 1]) { for (let x = -3.4; x <= 0.6; x += 0.8) K.rod(mb, [x, D + 5.0, sd * 2.95], [x, D + 6.0, sd * 2.95], 0.035, 0.035, 3, st, false); K.rod(mb, [-3.5, D + 6.0, sd * 2.95], [0.7, D + 6.0, sd * 2.95], 0.04, 0.04, 3, st, false); }
      // skeg, rudder and a four-bladed screw under the counter
      K.sheet(mb, 3, 2, (u, w) => { const x = -1.5 - 4.0 * u; return [x, Y0(x) * w, 0]; }, () => st);
      K.box(mb, -6.9, 0.25, -0.12, -5.9, 3.6, 0.12, () => st, lod ? 1 : 2);
      mb.blob(-5.3, 1.65, 0, 0.42, 0.42, 0.42, lod ? 1 : 2, null, () => st);
      for (let b = 0; b < 4; b++) {
        const a = b * Math.PI / 2 + 0.3, cy = Math.cos(a), cz = Math.sin(a);
        K.sheet(mb, lod ? 2 : 5, 2, (u, w) => {
          const rr = 0.35 + 1.45 * u, ch = 0.55 * Math.sin(Math.min(1, u * 1.1) * Math.PI) + 0.12, t = (w - 0.5) * ch;
          return [-5.3 + t * 0.6, 1.65 + cy * rr - cz * t * 0.8, cz * rr + cy * t * 0.8];
        }, () => st);
      }
    }
    if (v === 2) {   // the transom closes the stern above the screw
      const xe = -6;
      K.sheet(mb, lod ? 3 : 8, lod ? 2 : 5, (u, w) => { const y = Y0(xe) + (top(xe) - Y0(xe)) * w, b = B(xe) * (0.82 + 0.18 * Math.sqrt(w)); return [xe + rake(xe, y), y, (u - 0.5) * 2 * b]; }, () => st);
    }
    K.encrust(mb, from, 9.1 + v, 1, 0.14);
  },
});

// ---- a cargo mast: 0 standing with its crosstree and two derricks, 1 fallen on the sand, 2 a broken stump ----

  },
});

// ---- oil drums: 0 standing, 1 lying along +x, 2 crushed ----

// ---- a single-engine fighter of the war, on its belly: 0 whole, 1 its left outer wing torn away and the screw bent
// back by the ditching, 2 that wing lying on its own. Nose toward +x, about 10 m long ----
Flora.def('warplane', {
  size: 'big', d0: 30, d1: 105, twoSided: true, sway: [0, 1, 0, 0], mat: [0, 0, 0.12, 0.05],
  pal: [[[0.40, 0.43, 0.38], [0.78, 0.50, 0.52]], [[0.36, 0.39, 0.32], [0.62, 0.62, 0.36]], [[0.46, 0.46, 0.44], [0.84, 0.52, 0.32]], [[0.34, 0.37, 0.35], [0.66, 0.56, 0.70]]],
  build(mb, _r, lod, v) {
    const K = WarmKit, from = mb.count, al = AT(0.9, 0, 0.9, 0, 0, 0, 0, 2), dark = AT(0.2, 0, 0.3, 0, 0, 0, 0, 0);
    const nu = lod ? 4 : 10, nv = lod ? 3 : 6;
    // a wing panel from span z0..z1 (positive = right), with chord and thickness tapering; f gives the point
    const wing = (z0, z1, side, rootC, tipC, rootT, tipT, x0, y0) => {
      for (const s of [1, -1]) K.sheet(mb, nu, nv, (u, w) => {
        const span = z0 + (z1 - z0) * u, k = (Math.abs(span) - 0.6) / 5.2;
        const c = rootC + (tipC - rootC) * Math.min(1, k) - (k > 0.85 ? (k - 0.85) * 4 * tipC * 0.5 : 0);
        const th = rootT + (tipT - rootT) * Math.min(1, k);
        const xc = x0 - 0.25 * k;
        const ww = w;   // 0 leading edge .. 1 trailing edge
        const camber = Math.sin(Math.PI * Math.pow(ww, 0.7)) * th * (s > 0 ? 0.62 : -0.38);
        return [xc + c * 0.3 - c * ww, y0 + 0.09 * Math.abs(span) + camber, side * Math.abs(span)];
      }, () => al, { flip: (s > 0) === (side > 0) });
    };
    if (v === 2) {   // a torn wing panel lying flat, a dropped fuel tank beside it
      wing(0.0, 3.2, 1, 1.7, 1.15, 0.2, 0.08, 0.4, 0.12);
      const t = new MB();
      t.lathe([[0.001, 0], [0.12, 0.15], [0.26, 0.6], [0.28, 1.2], [0.24, 1.8], [0.12, 2.25], [0.001, 2.4]], lod ? 8 : 14, () => al);
      K.put(mb, t, K.MM(K.RY(0.7), K.RZ(-Math.PI / 2)), [-1.8, 0.26, -1.6]);
      K.encrust(mb, from, 6.1, 0.9);
      return;
    }
    // fuselage: an oval tube from the spinner back to the tail
    const prof = [[5.15, 0.04, 0], [5.0, 0.22, 0], [4.75, 0.5, 0], [4.45, 0.66, 0], [3.6, 0.7, 0], [2.4, 0.66, 0], [1.0, 0.64, 0.05], [-1.0, 0.52, 0.12], [-3.0, 0.34, 0.24], [-4.6, 0.18, 0.34], [-5.0, 0.1, 0.36]];
    mb.tube(prof.map(([x, r, dy]) => ({ x, y: 0.72 + dy, z: 0, r })), lod ? 8 : 18, (t, k) => (k === 3 ? AT(0.6, 0, 0.7, 0, 0, 0, 0, 2) : al), { capTip: false, rmod: (t, a) => 1 + 0.12 * Math.sin(a) * Math.sin(a) });
    // cockpit: the opening, the canopy frame slid back
    K.sheet(mb, 2, 2, (u, w) => [1.6 - 1.4 * u, 1.37, (w - 0.5) * 0.7], () => dark);
    if (!lod) for (const k of [0, 1, 2]) { const x = -0.2 - k * 0.45; mb.tube([{ x, y: 1.3, z: -0.36, r: 0.025 }, { x: x + 0.05, y: 1.62, z: -0.2, r: 0.025 }, { x: x + 0.06, y: 1.7, z: 0, r: 0.025 }, { x: x + 0.05, y: 1.62, z: 0.2, r: 0.025 }, { x, y: 1.3, z: 0.36, r: 0.025 }], 3, () => al); }
    // wings, low on the fuselage
    wing(0.4, 5.8, 1, 2.3, 1.15, 0.28, 0.09, 1.9, 0.38);
    wing(0.4, v === 1 ? 2.6 : 5.8, -1, 2.3, 1.15, 0.28, 0.09, 1.9, 0.38);
    // tail: stabilisers and fin
    for (const sd of [1, -1]) K.sheet(mb, lod ? 2 : 4, lod ? 2 : 3, (u, w) => { const zz = sd * (0.2 + 1.9 * u), c = 1.1 - 0.5 * u; return [-4.1 - c * w, 1.02 + 0.05 * u, zz]; }, () => al, { flip: sd < 0 });
    K.sheet(mb, lod ? 2 : 3, lod ? 2 : 4, (u, w) => { const yy = 1.02 + 1.55 * w, c = 1.35 - 0.6 * w; return [-3.75 - c * u - 0.3 * w, yy, 0]; }, () => al);
    // the engine face and a three-bladed screw (bent back on the wreck)
    mb.blob(5.15, 0.72, 0, 0.2, 0.2, 0.2, lod ? 1 : 2, null, () => al);
    for (let b = 0; b < 3; b++) {
      const a = b * Math.PI * 2 / 3 + 0.4, cy = Math.cos(a), cz = Math.sin(a), bend = v === 1 ? 0.9 : 0.12;
      K.sheet(mb, lod ? 3 : 6, 1, (u, w) => {
        const rr = 0.18 + 1.55 * u, back = bend * u * u, t = (w - 0.5) * 0.24 * (1 - 0.5 * u);
        return [5.2 - back - t * 0.3, 0.72 + cy * rr * (1 - back * 0.3) - cz * t, cz * rr * (1 - back * 0.3) + cy * t];
      }, () => al);
    }
    K.encrust(mb, from, 6.1 + v, 1);
  },
});

// ---- a lost gill net: 0 snagged at its foot and billowing up downstream (+x) on its floats, 1 draped in a low heap,
// 2 a torn tangle with a float line trailing. The netting is the woven-grid material (kind 9) ----
Flora.def('ghostnet', {
  size: 'big', d0: 26, d1: 80, twoSided: true, alpha: true, shadow: true, sway: [0.05, 1.3, 0.35, 0.01], mat: [0.35, 0, 0, 0.25],
  pal: [[[0.60, 0.66, 0.58], [0.90, 0.48, 0.16]], [[0.56, 0.62, 0.50], [0.92, 0.88, 0.80]], [[0.64, 0.62, 0.50], [0.95, 0.78, 0.20]], [[0.55, 0.62, 0.64], [0.85, 0.28, 0.18]]],
  build(mb, _r, lod, v) {
    const K = WarmKit, rnd = mulberry32(5501 + v);
    const net = (t) => AT(0.9, 0, 0.9, t, 0.35, 0, t, 9);
    const nu = lod ? 8 : 22, nv = lod ? 6 : 14;
    // the woven-grid material draws 26 x 14 meshes per 0..1 of uv: the net is laid in tiles so its meshes come out a
    // hand's width, like a real gill net
    const tiles = (P, TU, TV, at) => { for (let i = 0; i < TU; i++) for (let j = 0; j < TV; j++) K.sheet(mb, Math.max(2, Math.round(nu / TU)), Math.max(2, Math.round(nv / TV)), (u, w) => P((i + u) / TU, (j + w) / TV), at); };
    const floats = [];
    if (v === 0) {
      const W = 6.5, H = 4.4;
      const P = (u, w) => { const z = (u - 0.5) * W, sag = 0.35 * Math.sin(u * Math.PI); return [1.6 * w * w + 0.5 * Math.sin(u * 5 + w * 3) * w + 0.4 * Math.sin(z * 0.9) * w, H * w * (1 - 0.12 * Math.sin(u * Math.PI * 2.4) * w) - sag * w + 0.1, z * (1 - 0.18 * w)]; };
      tiles(P, 3, 3, (x, y, z) => net(Math.min(1, y / H * 0.9 + 0.1)));
      for (let i = 0; i <= 10; i++) floats.push(P(i / 10, 1));
      mb.tube(Array.from({ length: 9 }, (_, i) => { const p = P(i / 8, 0); return { x: p[0], y: p[1] + 0.02, z: p[2], r: 0.035 }; }), 4, () => AT(0.6, 0, 0.7, 0, 0, 0, 0, 0));
      mb.tube(Array.from({ length: 11 }, (_, i) => { const p = P(i / 10, 1); return { x: p[0], y: p[1], z: p[2], r: 0.018 }; }), 3, () => AT(0.8, 0, 0.8, 0.8, 0, 0, 1, 0));
    } else if (v === 1) {
      const Wd = 5.5, Dp = 4.0;
      const bumps = Array.from({ length: 5 }, () => [(rnd() - 0.5) * Wd * 0.8, (rnd() - 0.5) * Dp * 0.8, 0.5 + rnd() * 0.9, 0.7 + rnd() * 0.8]);
      const P = (u, w) => { const x = (w - 0.5) * Dp, z = (u - 0.5) * Wd; let y = 0.06; for (const b of bumps) y += b[2] * Math.exp(-((x - b[1]) ** 2 + (z - b[0]) ** 2) / (b[3] * b[3])); y += 0.12 * Math.sin(x * 3.1 + z * 1.7); return [x, y, z]; };
      tiles(P, 3, 2, (x, y, z) => net(Math.min(1, y * 0.4)));
      for (let i = 0; i <= 8; i++) { const p = P(i / 8, 1); floats.push([p[0], p[1] + 0.05, p[2]]); }
    } else {
      for (let k = 0; k < 3; k++) {
        const ox = (rnd() - 0.5) * 1.5, oz = (rnd() - 0.5) * 1.5, a = rnd() * 6, h = 0.8 + rnd() * 0.8;
        tiles((u, w) => { const r = 0.4 + 1.6 * w, th = a + u * 2.6; return [ox + Math.cos(th) * r, h * (1 - w) * (0.6 + 0.4 * Math.sin(u * 7)) + 0.05, oz + Math.sin(th) * r * 0.7]; }, 2, 2, (x, y) => net(Math.min(1, y * 0.6)));
      }
      const P = []; for (let i = 0; i <= 12; i++) { const t = i / 12; P.push({ x: 0.5 + t * 5.5, y: 0.08 + 0.6 * t + 0.3 * Math.sin(t * 7), z: Math.sin(t * 4) * 0.9, r: 0.018 }); if (i % 2 === 0 && i > 1) floats.push([P[i].x, P[i].y, P[i].z]); }
      mb.tube(P, 3, () => AT(0.8, 0, 0.8, 0.6, 0, 0, 1, 0));
    }
    // floats: small hard cylinders, coloured (accent 1)
    for (const f of floats) mb.blob(f[0], f[1], f[2], 0.09, 0.07, 0.09, lod ? 0 : 1, null, () => AT(0.95, 1, 0.95, 0.4, 0.1, 0, 1, 0));
  },
});

// ---- a mooring line: chain and rope from the block's eye to a buoy just under the surface; drawn with the kelp
// shader, which stretches the line from its origin up to the surface and lets it swing with the surge ----
Flora.def('mooringline', {
  size: 'big', d0: 40, d1: 120, kelp: true, twoSided: true, sway: [0, 1, 0, 0], mat: [0.1, 0, 0.1, 0.1],
  pal: [[[0.55, 0.50, 0.40], [0.92, 0.88, 0.82]], [[0.52, 0.48, 0.38], [0.95, 0.55, 0.15]], [[0.58, 0.52, 0.42], [0.92, 0.88, 0.82]], [[0.50, 0.46, 0.38], [0.88, 0.30, 0.18]]],
  build(mb, _r, lod, v) {
    const n = lod ? 12 : 40, ss = lod ? 3 : 5;
    // rope: positions are offsets from the axis; ext.t is the height fraction the shader stretches
    const base = mb.count;
    for (let k = 0; k <= n; k++) for (let q = 0; q <= ss; q++) {
      const a = q / ss * Math.PI * 2, t = k / n, r = t < 0.06 ? 0.05 : 0.028;
      mb.v(Math.cos(a) * r, 0, Math.sin(a) * r, Math.cos(a), 0, Math.sin(a), [0.85, 0, 0.85, 0], [0.1, 0, t, 0]);
    }
    for (let k = 0; k < n; k++) for (let q = 0; q < ss; q++) { const a = base + k * (ss + 1) + q; mb.quad(a, a + 1, a + ss + 2, a + ss + 1); }
    // the buoy: every vertex at the top of the line
    const b0 = mb.count;
    mb.blob(0, -0.05, 0, 0.42, 0.36, 0.42, lod ? 1 : 2, null, () => AT(0.95, 1, 0.95, 0, 0.05, 0, 1, 0));
    for (let k = b0; k < mb.count; k++) mb.e[k * 4 + 2] = 1;
    if (!lod) { const r0 = mb.count; WarmKit.ring(mb, [0, -0.47, 0], [1, 0, 0], [0, 1, 0], 0.08, 0.02, 10, 4, AT(0.6, 0, 0.7, 0, 0, 0, 1, 0)); for (let k = r0; k < mb.count; k++) mb.e[k * 4 + 2] = 1; }
  },
});
