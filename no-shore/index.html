      if (total <= 0) continue;
      const area = VOX * VOX * 1.15;
      const h = hash3(Math.floor(x * 8), Math.floor(y * 8), Math.floor(z * 8));

      const h2 = hash3(Math.floor(x * 13), Math.floor(z * 13), Math.floor(y * 13) + s);

// ---- 12-places.js ----
// The catalogue of hand-made places. Each template sculpts terrain (density), changes the planting near it (plant),
// and names the animals that live there (the main thread reads `fauna`). Runs in the workers too: self-contained.
function PLACES(W) {
  'use strict';

  function archD(cx, cy, cz, lx, ly, lz, R, r, rough) {
    const qx = sqrt(lx * lx + ly * ly) - R;
    const ang = Math.atan2(ly, lx);
    const rr = r * (0.8 + 0.35 * sin(ang * 3.1 + rough * 9) + 0.15 * sin(ang * 7.3 + rough * 3)) * (1 - 0.25 * sm(0.3, 1.4, abs(ang - PI / 2)) * 0);
    const s = sqrt(qx * qx + lz * lz) - rr;
    const nz = n3(cx / 3.1, cy / 2.7, cz / 3.1) * 0.9 + n3(cx / 1.2, cy / 1.1, cz / 1.2) * 0.3;
    return -(s + nz) * (ly > -2 ? 1 : 1);
  }
  // a tower of rock (coral bommie / pinnacle / chimney): radius function of height
  function towerD(dist, y, base, H, r0, r1, flare, x, z) {
    const t = clamp((y - base) / H, 0, 1);
    let r = mix(r0, r1, t) + flare * sm(0.7, 1, t) * (1 - sm(0.97, 1.05, t));
    r *= 0.85 + 0.25 * n3(x / 2.7, y / 2.2, z / 2.7) + 0.1 * n3(x / 0.9, y / 0.9, z / 0.9);
    const side = r - dist;
    const top = base + H - y;
    return min(side, top + 0.5 * n3(x / 1.6, y, z / 1.6));
  }

  // ---------- the opening: a sunlit sand basin with an arch, a bommie and a garden ----------
  def('opening', {
    r: 75, w: 0,
    init(p, R) { p.yaw = 0.0; p.base = -11.5; p.yMin = -24; p.yMax = -1; },

      const ringY = -6.5 + 1.6 * n2(x / 19 + 3, z / 19) + 1.2 * n2(x / 7, z / 7);
      const target = mix(bowlY, ringY, sm(rim - 3, rim + 9, r));
      const blend = 1 - sm(48, 72, r);
      let dd = mix(d, target - y + (y > target - 6 && r > rim ? n3(x / 6, y / 4, z / 6) * 1.6 : 0), blend);
      // the arch on the far side of the bowl, a swim-through out of it
      const ax = lx - 0, az = lz + 17, ay = y - (p.base - 1.5);
      dd = smax(dd, archD(x, y, z, ax, ay, az, 9.5, 2.3, 0.37), 1.2);
      // a coral tower to one side
      const bx = lx - 10, bz = lz + 3;
      const bd = sqrt(bx * bx + bz * bz);
      if (bd < 9) dd = smax(dd, towerD(bd, y, p.base - 1, 7.5, 3.2, 2.2, 1.8, x, z), 1.0);

    },
    rel(p, x, z, dx, dz, rel) {
      const r = sqrt(dx * dx + dz * dz);
      return mix(rel, -1.5 + 4.5 * sm(9, 15, r), 1 - sm(45, 65, r));
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny, sky) {
      const [lx, lz] = rot(p, dx, dz);
      const r = sqrt(lx * lx + lz * lz);
      let t = 0;
      if (r < 10) { for (let i = 0; i < rates.length; i++) rates[i] *= 0.12; rates[S.seagrass] = sand > 0.5 ? 0.05 * sm(5, 10, r) : 0; rates[S.clam] = sand > 0.5 ? 0 : 0.02; }
      else if (r < 45) {  // dense rich reef around the bowl
        const k = sm(10, 14, r);
        rates[S.staghorn] *= 1 + 1.2 * k; rates[S.table] *= 1 + 1.5 * k; rates[S.softcoral] *= 1 + 2.0 * k; rates[S.anemone] *= 1 + 2.0 * k; rates[S.fan] *= 1 + 1.5 * k; rates[S.brain] *= 1 + 0.8 * k; rates[S.tubesponge] *= 1 + k; rates[S.boulder] *= 1 + 0.5 * k;
      }
      for (let i = 0; i < rates.length; i++) t += rates[i];
      return t;
    },
    fauna: ['turtle', 'anthiasCloud', 'reefMix', 'school:fusilier', 'manta?'],
  });

  // ---------- cavern with a skylight: a dome of rock, hollow inside, a beam coming down through its roof ----------
  def('cavern', {
    r: 40, w: 1.0, biomes: { karst: 2, reef: 0.5, volcanic: 1.2, kelp: 0.5, polar: 0.3, meso: 0.6 }, maxD: 60,

    density(p, x, y, z, d, dx, dz) {
      const [lx, lz] = rot(p, dx, dz);
      const base = p.floor - 1;
      // the dome
      const ex = lx / p.R, ey = (y - base) / p.H, ez = lz / p.R;
      const dome = (1 - sqrt(ex * ex + ey * ey + ez * ez)) * p.R * 0.8 + n3(x / 5, y / 4, z / 5) * 1.8 + n3(x / 1.7, y / 1.5, z / 1.7) * 0.5;

  // ---------- sand bowl ringed by coral heads (garden eels live in the sand) ----------

  // ---------- lava tube: a long tunnel through black rock with holes in its roof ----------
  def('lavatube', {
    r: 55, w: 1.6, biomes: { volcanic: 2.5 }, maxD: 50,
    init(p, R) { p.yaw = R() * PI * 2; p.L = 40 + 12 * R(); p.yMin = p.floor - 4; p.yMax = p.floor + 12; },
    density(p, x, y, z, d, dx, dz) {
      const [lx, lz] = rot(p, dx, dz);
      if (abs(lx) > p.L + 12) return d;
      const along = 1 - sm(p.L, p.L + 10, abs(lx));
      const wig = 3 * sin(lx * 0.09 + p.seed * 7);
      const cy = p.floor + 3.5;
      // the mound the tube runs through
      const mound = (p.floor + 8.5 - y) - 0.02 * (lz - wig) * (lz - wig) * 0.5 + n3(x / 4, y / 3, z / 4) * 1.4;
      let dd = smax(d, mound * along - (1 - along) * 30, 2);
      const tube = sqrt((y - cy) ** 2 * 1.2 + (lz - wig) ** 2) - (3.4 + 0.6 * n3(x / 3, y / 3, z / 3));

      // skylights

// More hand-made places for the warm biomes (reef, lagoon, karst, volcanic, meso). Runs in the workers: self-contained.
// Each one should read as its own picture from a distance and vary with its seed. Human things are real ones that lie

  const mulR = (r, k) => { for (let i = 0; i < r.length; i++) r[i] *= k; };

  const SEEDS = [0, 1, 2].map((v) => [0, 1, 2, 3].map((k) => {

  // =====================================================================================================================
  // CORAL CATHEDRAL: a hollow reef mound, its roof holed in several places; light falls through onto a sand floor inside
  def('cathedral', {
    r: 40, w: 1.1, biomes: { reef: 0.9, karst: 1.4, volcanic: 0.3, lagoon: 0.4 }, minD: 10, maxD: 32,
    init(p, R) {

  // =====================================================================================================================

  def('pinnacles', {

    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(p.r - 18, p.r - 4, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {

  // =====================================================================================================================

  const spurAt = (p, lx, lz) => {

  // =====================================================================================================================
  // TIERS OF TABLES: a stepped knoll, every terrace lip lined with table corals overhanging the one below
  const tierH = (p, dx, dz) => {

  def('tabletiers', {
    r: 34, w: 1.2, biomes: { reef: 1.8, karst: 0.3 }, maxD: 24,
    init(p, R) {

    },
    inst: emitter((p, E, R) => {
      for (let gx = -p.R; gx <= p.R; gx += 2.6) for (let gz = -p.R; gz <= p.R; gz += 2.6) {
        const dx = gx + (R() - 0.5) * 2.2, dz = gz + (R() - 0.5) * 2.2, [, f, k, hs] = tierH(p, dx, dz);
        if (hs < 0.5 || f > 0.34 || R() > 0.85) continue;
        const out = hypot(dx, dz) || 1, x = p.x + dx, z = p.z + dz, y = groundY(x, z, p.yMax, p.floor - 3);
        if (!(y === y)) continue;
        E('table', x, y - 0.12, z, 1.3 + 1.3 * R() * (1 - 0.15 * k), R() * TAU, [dx / out * 0.2, 1, dz / out * 0.2]);
      }
    }),
    fauna: ['chromisCloud', 'anthiasCloud', 'reefMix', 'school:fusilier', 'turtle?'],
  });

  // =====================================================================================================================
  // GRAZING HALO: a lone coral head in a seagrass meadow, ringed by bare sand where the fish that shelter in it graze
  def('halo', {
    r: 30, w: 1.4, biomes: { lagoon: 2, reef: 0.5 }, maxD: 20,
    init(p, R) { p.hr = 10 + 6 * R(); p.br = 2.8 + 1.6 * R(); p.bh = min(-p.floor - 3, 2.4 + 1.8 * R()); p.r = p.hr + 14; p.yMin = p.floor - 3; p.yMax = p.floor + p.bh + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const dd = flatTo(p, d, x, y, z, hypot(dx, dz), p.r - 10, p.r - 2);
      const ex = dx / p.br, ez = dz / p.br, ey = (y - p.floor + 0.6) / p.bh, q = sqrt(ex * ex + ey * ey + ez * ez);
      if (q > 1.6) return dd;
      return smax(dd, (1 - q) * p.br * 0.8 + n3(x / 1.4, y / 1.2, z / 1.4) * 0.35 + n3(x / 0.6, y / 0.6, z / 0.6) * 0.1, 0.9);
    },
    rel(p, x, z, dx, dz, rel) { const dist = hypot(dx, dz); return dist < p.br * 1.15 ? 3 : mix(-1.6, rel, sm(p.r - 6, p.r, dist)); },
    plant(p, x, y, z, dx, dz, rates, S, sand) {
      const dist = hypot(dx, dz) * (1 + 0.1 * n2(dx / 5, dz / 5));
      if (dist < p.br * 1.25 && y > p.floor + 0.2) { rates[S.brain] = 0.2; rates[S.boulder] = 0.16; rates[S.staghorn] = 0.3; rates[S.softcoral] = 0.14; rates[S.anemone] = 0.1; rates[S.seagrass] = 0; return sumR(rates); }
      const g = sm(p.hr - 1, p.hr + 2.5, dist);
      mulR(rates, g * 0.3);
      rates[S.seagrass] = sand > 0.3 ? 3.2 * g : 0;
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      const n = 9 + floor(R() * 6);
      for (let i = 0; i < n; i++) {
        const a = R() * TAU, rr = sqrt(R()) * p.br * 0.95, x = p.x + cos(a) * rr, z = p.z + sin(a) * rr;
        const pick = R(), name = i === 0 ? 'anemone' : pick < 0.3 ? 'brain' : pick < 0.55 ? 'staghorn' : pick < 0.72 ? 'softcoral' : pick < 0.86 ? 'boulder' : 'fan';
        onGround(E, name, x, z, p.yMax, p.floor - 2, name === 'anemone' ? 1.3 : 0.8 + 0.7 * R(), 0.5, R() * TAU);
      }
      for (let i = 0; i < 4; i++) { const a = R() * TAU, rr = p.br * 1.6 + R() * (p.hr - p.br * 1.6); onGround(E, 'star', p.x + cos(a) * rr, p.z + sin(a) * rr, p.floor + 3, p.floor - 3, 1.1 + 0.4 * R(), 0.2, R() * TAU); }
    }),
    fauna: ['turtle', 'stingray', 'reefMix', 'school:snapper?', 'clownfish'],
  });

  // =====================================================================================================================
  // RIBBON-GRASS MEADOW: tall Enhalus seagrass waist-high to a turtle, a white sand channel winding through it
  const chanAt = (p, lx, lz) => abs(lz - p.A * sin(lx * p.kk + p.ph) - 0.4 * p.A * sin(lx * p.kk * 2.7 + 1)) / p.cw;
  def('meadow', {
    r: 40, w: 1.2, biomes: { lagoon: 2.2, reef: 0.25 }, maxD: 16,
    init(p, R) { p.yaw = R() * TAU; p.A = 5 + 5 * R(); p.kk = 0.05 + 0.04 * R(); p.ph = R() * TAU; p.cw = 1.7 + 1.3 * R(); p.yMin = p.floor - 4; p.yMax = p.floor + 4; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const dist = hypot(dx, dz), dd = flatTo(p, d, x, y, z, dist, p.r - 12, p.r - 2);
      const [lx, lz] = rot(p, dx, dz), c = chanAt(p, lx, lz);
      return c > 1.6 ? dd : dd - 0.4 * (1 - sm(0.6, 1.6, c)) * (1 - sm(p.r - 10, p.r, dist));
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(p.r - 8, p.r, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S, sand) {
      const [lx, lz] = rot(p, dx, dz), c = chanAt(p, lx, lz), g = sm(0.9, 1.5, c) * (1 - sm(p.r - 8, p.r, hypot(dx, dz)));
      mulR(rates, 1 - 0.9 * g); if (c < 1) mulR(rates, 0.1);
      rates[S.seagrass] = sand > 0.3 ? mix(rates[S.seagrass], 3.2, g) : 0;
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      for (let gx = -p.r; gx <= p.r; gx += 1.5) for (let gz = -p.r; gz <= p.r; gz += 1.5) {
        const lx = gx + (R() - 0.5) * 1.4, lz = gz + (R() - 0.5) * 1.4, rr = hypot(lx, lz);
        if (rr > p.r - 6 || chanAt(p, lx, lz) < 1.3 || R() > 0.75 * (1 - sm(p.r - 16, p.r - 6, rr)) + 0.05) continue;
        const [x, z] = toW(p, lx, lz), y = groundY(x, z, p.floor + 4, p.floor - 4);
        if (y === y) E('seagrass', x, y - 0.05, z, 1.9 + 0.9 * R(), R() * TAU, null);
      }
      for (let i = 0; i < 5; i++) { const lx = (R() - 0.5) * p.r, lz = p.A * sin(lx * p.kk + p.ph) + 0.4 * p.A * sin(lx * p.kk * 2.7 + 1) + (R() - 0.5) * p.cw, [x, z] = toW(p, lx, lz); onGround(E, 'star', x, z, p.floor + 4, p.floor - 4, 1.2, 0.2, R() * TAU); }
    }),
    fauna: ['turtle', 'stingray', 'reefMix', 'seahorses', 'cuttlefish'],
  });

  // =====================================================================================================================
  // CENOTE: a drowned cave under a limestone table; one round shaft lets a single beam down onto a cone of fallen
  // rubble; stalactites from the dry ages hang from its roof
  def('cenote', {
    r: 46, w: 1.3, biomes: { karst: 2.4, reef: 0.2 }, minD: 10, maxD: 34,
    init(p, R) {
      p.yaw = R() * TAU; p.Rp = 25 + 8 * R(); p.Hp = min(-p.floor - 4, 10 + 6 * R());
      p.Hc = (p.Hp - 3.6) / 1.05; p.Rc = p.Rp * (0.62 + 0.08 * R());
      const a = R() * TAU, rr = R() * 0.3 * p.Rc; p.sx = cos(a) * rr; p.sz = sin(a) * rr; p.sr = 2.6 + 2 * R();
      p.ea = R() * TAU; p.ew = 4.5 + 2 * R(); p.eh = min(p.Hc * 0.6, 3.5 + 1.5 * R()); p.k = floor(R() * 1000);
      p.r = p.Rp + 12; p.yMin = p.floor - 3; p.yMax = p.floor + p.Hp + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz), dist = hypot(lx, lz * 1.12);
      if (dist > p.Rp + 10) return d;
      const top = p.floor + p.Hp + 0.7 * n2(x / 9, z / 9) + 0.4 * n2(x / 3, z / 3);
      const cliff = (p.Rp - dist) + n3(x / 5, y / 6, z / 5) * 2.4 + n3(x / 1.8, y / 2, z / 1.8) * 0.6 - 1.5 * sm(p.floor + 1, p.floor + 4, y) * (1 - sm(p.floor + 4, p.floor + 7, y));
      let dd = smax(d, min(cliff, top - y), 2.0);
      // the chamber
      const cy = p.floor - 0.4, ex = lx / p.Rc, ez = lz / (p.Rc * 0.9), ey = (y - cy) / p.Hc, q = sqrt(ex * ex + ey * ey + ez * ez);
      const sd = hypot(lx - p.sx, lz - p.sz);
      if (q < 1.5) {
        let ch = (q - 1) * min(p.Rc, p.Hc) * 0.75;
        if (ch > -3 && ch < 3) ch += n3(x / 3.5, y / 2.5, z / 3.5) * 1.1 + n3(x / 1.3, y / 1.2, z / 1.3) * 0.3;
        ch = max(ch, (p.floor - 0.6) - y);
        // stalactites and stalagmites, one per cell of a 2.6 m grid
        const e2 = ex * ex + ez * ez;
        if (e2 < 0.8 && sd > p.sr + 1.2) {
          const cs = 2.6, gi = floor(lx / cs), gj = floor(lz / cs), h1 = hash3(gi, gj, p.k);
          if (h1 < 0.6) {
            const h2 = hash3(gi, gj, p.k + 1), h3 = hash3(gi, gj, p.k + 2);
            const sx = (gi + 0.3 + 0.4 * h2) * cs, sz = (gj + 0.3 + 0.4 * h3) * cs, pd = hypot(lx - sx, lz - sz);
            if (pd < 1.2) {
              const ce = max(0, 1 - (sx / p.Rc) ** 2 - (sz / (p.Rc * 0.9)) ** 2), ceil = cy + p.Hc * sqrt(ce);
              const L = 0.8 + 3.4 * h2 * h2, r0 = 0.3 + 0.45 * h3, t = (ceil + 0.6 - y) / L;
              if (t > 0 && t < 1) ch = smax(ch, r0 * Math.pow(1 - t, 1.4) - pd, 0.25);
              if (h1 < 0.28) { const Lm = 0.5 + 1.6 * h3, tm = (y - (p.floor - 0.6)) / Lm; if (tm > 0 && tm < 1) ch = smax(ch, (r0 + 0.15) * Math.pow(1 - tm, 1.1) - pd, 0.25); }
            }
          }
        }
        dd = smin(dd, ch, 1.2);
      }
      // the shaft
      if (sd < p.sr + 4 && y > cy + p.Hc * 0.5) {
        const sh = sd - p.sr * (1 + 0.18 * n3(x / 2, y / 2.5, z / 2)) - 0.35 * max(0, y - (top - 2.5));
        dd = smin(dd, max(sh, cy + p.Hc * 0.5 - y), 1.0);
      }
      // the mouth, low on one side
      const ca = cos(p.ea), sa = sin(p.ea), al = lx * ca + lz * sa;
      if (al > 0) {
        const pe = -lx * sa + lz * ca;
        if (abs(pe) < p.ew + 3) {
          const tun = (sqrt((pe / p.ew) ** 2 + ((y - p.floor + 0.4) / p.eh) ** 2) - 1) * min(p.ew, p.eh) + n3(x / 2.4, y / 2.4, z / 2.4) * 0.7;
          dd = smin(dd, max(tun, (p.floor - 0.6) - y, al - p.Rp - 6), 1.0);
        }
      }
      // the rubble cone under the shaft
      if (sd < 8 && y < p.floor + 3) dd = smax(dd, (p.floor - 0.6 + 2.0 * (1 - sd / 8) ** 2) - y + n3(x / 1.1, y / 1.1, z / 1.1) * 0.25, 0.8);
      return dd;
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny, sky) {
      if (sky < 0.4) { mulR(rates, 0); rates[S.tubesponge] = 0.05 * (1 - sand); rates[S.softcoral] = ny > -0.2 ? 0.04 * (1 - sand) : 0; return sumR(rates); }
      if (y > p.floor + p.Hp - 2) { rates[S.fan] *= 2; rates[S.softcoral] *= 2; rates[S.table] *= 1.6; rates[S.staghorn] *= 1.4; }
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      const [sx, sz] = toW(p, p.sx, p.sz);
      for (let i = 0; i < 14; i++) { const a = R() * TAU, rr = R() * 5.5; onGround(E, 'rubble', sx + cos(a) * rr, sz + sin(a) * rr, p.floor + 3, p.floor - 2, 1.5 + 1.5 * R(), 0.3, R() * TAU); }
      for (let i = 0; i < 7; i++) {   // fans on the rim of the shaft, leaning over it
        const a = (i + R() * 0.6) / 7 * TAU, rr = p.sr + 0.6 + R(), x = sx + cos(a) * rr, z = sz + sin(a) * rr;
        const y = groundY(x, z, p.yMax, p.floor + p.Hp * 0.5); if (!(y === y)) continue;
        E('fan', x, y - 0.05, z, 1.1 + 0.8 * R(), a, [-cos(a) * 0.45, 0.89, -sin(a) * 0.45], seedOf(floor(R() * 3), i % 4));
      }
    }),
    fauna: ['school:glassy', 'caveFish', 'grouper', 'turtle?', 'lobster', 'moray'],
  });

  // =====================================================================================================================
  // DROWNED TOWER KARST: limestone towers, fluted by old rain, each with the notch an old sea level cut into it
  def('towers', {
    r: 50, w: 1.3, biomes: { karst: 2.2, volcanic: 0.15 }, minD: 15, maxD: 45,
    init(p, R) {
      const depth = -p.floor; p.tw = [];
      const n = 3 + floor(R() * 4);
      for (let i = 0; i < n * 5 && p.tw.length < n; i++) {
        const first = !p.tw.length, a = R() * TAU, rr = first ? R() * 5 : 8 + 30 * sqrt(R());
        const x = cos(a) * rr, z = sin(a) * rr, R0 = 2.6 + 3.6 * R();
        if (!p.tw.every((t) => hypot(t.x - x, t.z - z) > t.R0 + R0 + 5)) continue;
        const H = (depth - 3.4) * (first ? 0.95 : 0.55 + 0.4 * R());
        p.tw.push({ x, z, R0, H, k: 6 + floor(R() * 8), ph: R() * TAU, fl: 0.06 + 0.07 * R(), nh: H * (0.5 + 0.3 * R()), nd: R0 * (0.22 + 0.14 * R()), win: R() < 0.45 ? R() * TAU : null, wh: max(2.5, H * (0.2 + 0.3 * R())) });
      }
      let top = p.floor; for (const t of p.tw) top = max(top, p.floor + t.H);
      p.yMin = p.floor - 3; p.yMax = top + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      let dd = d;
      const h = y - p.floor;
      for (const t of p.tw) {
        const ox = dx - t.x, oz = dz - t.z, hd = hypot(ox, oz);
        if (hd > t.R0 * 1.5 + 3) continue;
        const u = clamp(h / t.H, 0, 1), a = atan2(oz, ox);
        let r = t.R0 * (1.18 - 0.3 * u + 0.25 * (1 - sm(0, 2.5, h))) * (1 + t.fl * sin(a * t.k + t.ph) + t.fl * 0.5 * sin(a * t.k * 2.3 + 1.7));
        r -= t.nd * Math.exp(-(((h - t.nh) / 1.4) ** 2));
        const top = p.floor + t.H - y - 0.06 * hd * hd / t.R0;
        if (r - hd < -3 || top < -2.5) continue;   // well outside: nothing of it here
        r += n3(x / 3.2, y / 7, z / 3.2) * 1.0 + n3(x / 1.3, y / 2.5, z / 1.3) * 0.3;
        let s = min(r - hd, top + n2(x / 2.5, z / 2.5) * 0.5);
        if (t.win !== null && abs(h - t.wh) < 3 + 0.22 * t.R0) {
          const pe = -ox * sin(t.win) + oz * cos(t.win);
          s = smin(s, sqrt(pe * pe + ((h - t.wh) * 1.15) ** 2) - (1.4 + 0.22 * t.R0) + n3(x / 1.5, y / 1.5, z / 1.5) * 0.4, 0.5);
        }
        dd = smax(dd, s, 1.6);
      }
      return dd;
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (y < p.floor + 1.5) return sumR(rates);
      if (ny > 0.6) { rates[S.staghorn] *= 1.5; rates[S.table] *= 2; rates[S.brain] *= 1.4; rates[S.anemone] *= 1.4; }
      else if (ny > -0.1) { rates[S.fan] = max(rates[S.fan], 0.12); rates[S.softcoral] = max(rates[S.softcoral], 0.15); }
      return sumR(rates);
    },
    fauna: ['school:jack', 'napoleon', 'reefMix', 'school:barracuda?', 'eagleRay?'],
  });

  // =====================================================================================================================
  // SWEEPER CAVE: a reef wall with an overhanging brow and a cave in its foot, dark and full of glassy sweepers
  def('sweepercave', {
    r: 42, w: 1.0, biomes: { karst: 1.2, reef: 0.7, volcanic: 0.6, meso: 0.5 }, minD: 10, maxD: 80,
    init(p, R) {
      p.yaw = R() * TAU; p.L = 24 + 8 * R(); p.H = min(-p.floor - 4, 12 + 9 * R());
      p.cx = (R() - 0.5) * p.L * 0.5; p.cw = 6 + 3 * R(); p.ch = min(p.H * 0.6, 5.5 + 3 * R()); p.cd = 13 + 6 * R(); p.k = R() * 9;
      p.r = p.L + 16; p.yMin = p.floor - 3; p.yMax = p.floor + p.H + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz);
      if (abs(lx) > p.L + 10 || lz < -12) return d;
      const fz = 3.5 * sin(lx * 0.09 + p.k) + 1.5 * sin(lx * 0.23 + p.k * 2), h = y - p.floor;
      const face = (lz - fz + 2.2 * sm(p.H - 5, p.H - 1, h)) + n3(x / 4.5, y / 5.5, z / 4.5) * 1.8 + n3(x / 1.6, y / 1.8, z / 1.6) * 0.5;
      const top = p.floor + p.H + n2(x / 8, z / 8) * 1.2 - 0.85 * max(0, lz - fz - 8);
      const along = 1 - sm(p.L * 0.75, p.L + 6, abs(lx));
      let dd = smax(d, min(face, top - y) * along - (1 - along) * 12, 2.0);
      const ox = (lx - p.cx) / p.cw, oz = (lz - fz - p.cd * 0.45) / (p.cd * 0.55), oy = (h + 0.3) / p.ch, q = sqrt(ox * ox + oy * oy + oz * oz);
      if (q < 1.6) dd = smin(dd, max((q - 1) * min(p.cw, p.ch) * 0.8 + n3(x / 2.4, y / 2.2, z / 2.4) * 0.8, -0.6 - h), 1.0);
      return dd;
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny, sky) {
      if (sky < 0.4) { mulR(rates, 0); rates[S.tubesponge] = 0.08 * (1 - sand); rates[S.softcoral] = ny > -0.2 ? 0.05 * (1 - sand) : 0; return sumR(rates); }
      if (ny < 0.5 && ny > -0.1 && y > p.floor + 1) { rates[S.fan] = max(rates[S.fan], 0.3); rates[S.softcoral] = max(rates[S.softcoral], 0.2); rates[S.tubesponge] = max(rates[S.tubesponge], 0.08); }
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {   // soft corals hang from the cave's lip
      for (let i = 0; i < 9; i++) {
        const lx = p.cx + (R() - 0.5) * p.cw * 1.6, fz = 3.5 * sin(lx * 0.09 + p.k) + 1.5 * sin(lx * 0.23 + p.k * 2), [x, z] = toW(p, lx, fz + 0.5 + R() * 3);
        const y = ceilY(x, z, p.floor + 0.8, p.floor + p.ch + 3); if (!(y === y)) continue;
        E(R() < 0.6 ? 'softcoral' : 'fan', x, y + 0.05, z, 0.9 + 0.7 * R(), -p.yaw + (R() - 0.5) * 0.6, [0, -1, 0], seedOf(floor(R() * 3), R() < 0.5 ? 0 : 3));
      }
    }),
    fauna: ['school:glassy', 'caveFish', 'grouper', 'reefMix', 'school:jack?', 'lobster', 'moray'],
  });

  // =====================================================================================================================
  // RED FAN OVERHANG: a long ledge whose roof juts out over the sand; red and orange fans hang from its underside
  def('overhang', {
    r: 34, w: 1.7, biomes: { reef: 1.0, karst: 1.2, volcanic: 0.9 }, minD: 7, maxD: 35,
    init(p, R) {
      p.yaw = R() * TAU; p.L = 15 + 8 * R(); p.H = min(-p.floor - 3.5, 5.5 + 3 * R()); p.th = 1.5 + 0.9 * R(); p.ov = 4.5 + 2.5 * R(); p.k = R() * 9;
      p.r = p.L + 20; p.yMin = p.floor - 3; p.yMax = p.floor + p.H + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz);
      if (abs(lx) > p.L + 12) return d;
      const f = lz - 2.5 * sin(lx * 0.11 + p.k);
      // a sand apron in front, worn smooth: the long dark recess is what you see coming in
      d = mix(d, p.floor - 0.4 - y + 0.25 * n2(x / 6, z / 6), 0.9 * (1 - sm(p.L * 0.8, p.L + 10, abs(lx))) * (1 - sm(-16, -24, f)) * (1 - sm(-1, 2, f)));
      if (lz < -p.ov - 8) return d;
      const nz = n3(x / 3.5, y / 3, z / 3.5) * 1.2 + n3(x / 1.4, y / 1.4, z / 1.4) * 0.35;
      const top = p.floor + p.H - 0.6 * max(0, f - 6);
      const wall = min(f + nz, top - y);
      const lip = p.ov * (0.8 + 0.3 * n2(lx / 5, p.k));
      const roof = min(f + lip + nz * 0.8, top - y, y - (top - p.th) + nz * 0.5);
      const along = 1 - sm(p.L * 0.7, p.L + 4, abs(lx));
      return smax(d, max(wall, roof) * along - (1 - along) * 10, 1.4);
    },
    rel(p, x, z, dx, dz, rel) { const [lx, lz] = rot(p, dx, dz), f = lz - 2.5 * sin(lx * 0.11 + p.k); return f < -1 ? mix(rel, -1.6, (1 - sm(p.L * 0.8, p.L + 10, abs(lx))) * (1 - sm(-16, -24, f))) : rel; },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny, sky) {
      if (sky < 0.45 && ny > -0.2) { rates[S.softcoral] = max(rates[S.softcoral], 0.12 * (1 - sand)); rates[S.tubesponge] = max(rates[S.tubesponge], 0.06 * (1 - sand)); }
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      for (let lx = -p.L * 0.72; lx < p.L * 0.72; lx += 0.9 + R() * 1.1) {
        const lip = p.ov * (0.8 + 0.3 * n2(lx / 5, p.k)), [x, z] = toW(p, lx, 2.5 * sin(lx * 0.11 + p.k) - lip * (0.2 + 0.65 * R()));
        const y = ceilY(x, z, p.floor + 0.6, p.floor + p.H + 1); if (!(y === y) || y > p.floor + p.H) continue;
        const fan = R() < 0.72;
        E(fan ? 'fan' : 'softcoral', x, y + 0.06, z, fan ? 1.0 + 0.9 * R() : 0.8 + 0.6 * R(), -p.yaw + (R() - 0.5) * 0.5, [0, -1, 0], seedOf(floor(R() * 3), fan ? (R() < 0.7 ? 1 : 2) : (R() < 0.5 ? 0 : 3)));
      }
    }),
    fauna: ['turtle', 'school:glassy', 'reefMix', 'grouper?', 'lobster', 'sweetlips'],
  });

  // =====================================================================================================================
  // SOFT CORAL POINT: a ridge running out into the current, its crest smothered in soft coral
  const ridgeAt = (p, lx, lz) => {
    const t = clamp((lx + p.L) / (2 * p.L), 0, 1), hw = p.W0 * (1 - 0.7 * t) * (1 + 0.15 * n2(lx / 7, p.k));
    const w = (lz - 1.5 * sin(lx * 0.12 + p.k)) / hw;
    const env = sm(-p.L - 6, -p.L + 8, lx) * (1 - sm(p.L - 4, p.L + 3, lx));
    const h = p.H * (1 - 0.35 * t) * env * Math.pow(max(0, 1 - w * w), 0.6);
    return h + 0.7 * sm(0.3, 0.7, fract(h / 2.6)) * sm(0.5, 2, h);
  };
  def('softpoint', {
    r: 38, w: 1.1, biomes: { reef: 0.8, karst: 1.0, meso: 1.0, volcanic: 0.5 }, minD: 12, maxD: 80,
    init(p, R) { p.yaw = R() * TAU; p.L = 20 + 8 * R(); p.H = min(-p.floor - 4.5, 6 + 4 * R()); p.W0 = 7 + 4 * R(); p.k = R() * 9; p.r = p.L + 12; p.yMin = p.floor - 3; p.yMax = p.floor + p.H + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz);
      return d + ridgeAt(p, lx, lz) * (1 - sm(p.r - 8, p.r, hypot(dx, dz)));
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      const [lx, lz] = rot(p, dx, dz), h = ridgeAt(p, lx, lz);
      if (h > 0.8 && ny > -0.2) { rates[S.softcoral] = 1.1; rates[S.fan] = ny < 0.6 ? 0.25 : 0.04; rates[S.tubesponge] = 0.08; rates[S.anemone] = ny > 0.6 ? 0.06 : 0; rates[S.staghorn] *= 0.4; rates[S.table] *= 0.5; }
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      for (let lx = -p.L * 0.85; lx < p.L * 0.95; lx += 0.8 + R() * 1.0) {
        const t = clamp((lx + p.L) / (2 * p.L), 0, 1), hw = p.W0 * (1 - 0.7 * t);
        for (let k = 0; k < 2; k++) {
          const lz = 1.5 * sin(lx * 0.12 + p.k) + (R() - 0.5) * hw * 1.3, [x, z] = toW(p, lx, lz);
          onGround(E, 'softcoral', x, z, p.yMax, p.floor - 2, 1.6 + 1.8 * R(), 0.55, R() * TAU, seedOf(floor(R() * 3), floor(R() * 4)));
        }
      }
      for (let i = 0; i < 4; i++) { const [x, z] = toW(p, p.L * (0.75 + 0.2 * R()), (R() - 0.5) * 4); onGround(E, 'fan', x, z, p.yMax, p.floor - 2, 2.0 + 0.8 * R(), 0.7, p.yaw + PI / 2 + (R() - 0.5) * 0.4); }
    }),
    fauna: ['anthiasCloud', 'school:fusilier', 'reefMix', 'school:jack?', 'turtle?'],
  });

  // =====================================================================================================================
  // BLACK SAND SLOPE: a smooth slope of volcanic sand, bare but for scattered islands of coral, each its own crowd
  def('blackslope', {
    r: 40, w: 1.4, biomes: { volcanic: 2.2 }, minD: 8, maxD: 45,
    init(p, R) {
      p.yaw = R() * TAU; p.sl = 0.08 + 0.08 * R(); p.isl = [];
      const n = 10 + floor(R() * 10);
      for (let i = 0; i < n * 3 && p.isl.length < n; i++) { const a = R() * TAU, rr = 4 + 25 * sqrt(R()), c = [cos(a) * rr, sin(a) * rr, 1.3 + 1.5 * R(), 0.6 + 1.0 * R()]; if (p.isl.every((q) => hypot(q[0] - c[0], q[1] - c[1]) > q[2] + c[2] + 3)) p.isl.push(c); }
      p.yMin = p.floor - 9; p.yMax = p.floor + 9;
    },
    density(p, x, y, z, d, dx, dz) {
      const w = 1 - sm(p.r * 0.5, p.r * 0.95, hypot(dx, dz)); if (w <= 0) return d;
      const [lx, lz] = rot(p, dx, dz);
      let dd = mix(d, p.floor - p.sl * lz + 0.3 * n2(x / 11, z / 11) + 0.1 * n2(x / 3, z / 3) - y, w);
      for (const c of p.isl) { const hd = hypot(lx - c[0], lz - c[1]); if (hd < c[2] + 1.5) dd = smax(dd, min(c[2] - hd, p.floor - p.sl * c[1] + c[3] - y - 0.3 * hd) + n3(x / 0.9, y / 0.9, z / 0.9) * 0.25, 0.5); }
      return dd;
    },
    rel(p, x, z, dx, dz, rel) {
      const [lx, lz] = rot(p, dx, dz);
      for (const c of p.isl) if (hypot(lx - c[0], lz - c[1]) < c[2] * 1.1) return 3;
      return mix(-1.6, rel, sm(p.r * 0.6, p.r, hypot(dx, dz)));
    },
    plant(p, x, y, z, dx, dz, rates, S, sand) {
      const [lx, lz] = rot(p, dx, dz);
      for (const c of p.isl) if (hypot(lx - c[0], lz - c[1]) < c[2] * 1.2) { rates[S.brain] = 0.3; rates[S.softcoral] = 0.2; rates[S.anemone] = 0.12; rates[S.staghorn] = 0.25; rates[S.urchin] = 0.05; return sumR(rates); }
      mulR(rates, 1 - 0.97 * (1 - sm(p.r * 0.55, p.r * 0.95, hypot(dx, dz))));
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      for (const c of p.isl) {
        const n = 4 + floor(R() * 4);
        for (let i = 0; i < n; i++) {
          const a = R() * TAU, rr = R() * c[2] * 0.8, [x, z] = toW(p, c[0] + cos(a) * rr, c[1] + sin(a) * rr), k = R();
          onGround(E, k < 0.35 ? 'staghorn' : k < 0.55 ? 'anemone' : k < 0.75 ? 'softcoral' : k < 0.9 ? 'brain' : 'tubesponge', x, z, p.yMax, p.yMin, 1.0 + 0.7 * R(), 0.5, R() * TAU);
        }
      }
      for (let i = 0; i < 10; i++) { const a = R() * TAU, rr = 5 + 22 * R(); onGround(E, R() < 0.5 ? 'star' : 'urchin', p.x + cos(a) * rr, p.z + sin(a) * rr, p.yMax, p.yMin, 1.1, 0.2, R() * TAU); }
    }),
    fauna: ['gardenEels', 'reefMix', 'stingray?', 'octopus', 'cuttlefish'],
  });

  // =====================================================================================================================
  // BASALT COLUMNS: hexagonal columns where a lava flow cooled, standing in steps, one side a sheer organ-pipe face
  const hexCell = (p, lx, lz) => {
    const a = p.a, qf = (0.57735027 * lx - 0.33333333 * lz) / a, rf = (0.66666667 * lz) / a, cf = -qf - rf;
    let rx = round(qf), rz = round(rf), ry = round(cf);
    const ex = abs(rx - qf), ez = abs(rz - rf), ey = abs(ry - cf);
    if (ex > ey && ex > ez) rx = -ry - rz; else if (ez > ey) rz = -rx - ry;
    const hx = a * 1.7320508 * (rx + rz / 2), hz = a * 1.5 * rz;
    return [rx, rz, hx, hz];
  };
  const colTop = (p, rx, rz, hx, hz) => {
    const cd = hypot(hx, hz) / p.R, h1 = hash3(rx, rz, p.k), h2 = hash3(rx + 7, rz - 3, p.k);
    let t = p.Hc * (1 - sm(0.3, 1.0, cd + 0.15 * n2(hx / 9, hz / 9)));
    if (p.cliff) t *= mix(1, 0.15, sm(p.R * 0.18, p.R * 0.26, hx));
    return t + (h1 - 0.5) * 1.2 + (h2 < 0.1 ? -1.8 : 0);
  };
  def('basalt', {
    r: 40, w: 1.6, biomes: { volcanic: 2.2 }, maxD: 50,
    init(p, R) {
      p.yaw = R() * TAU; p.a = 1.5 + 0.35 * R(); p.Hc = min(-p.floor - 4, 4.5 + 5.5 * R()); p.R = 22 + 10 * R(); p.k = floor(R() * 1000); p.cliff = R() < 0.65;
      p.r = p.R + 6; p.yMin = p.floor - 3; p.yMax = p.floor + p.Hc + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const w = 1 - sm(p.R * 0.85, p.R + 4, hypot(dx, dz)); if (w <= 0) return d;
      const [lx, lz] = rot(p, dx, dz), [rx, rz, hx, hz] = hexCell(p, lx, lz), px = lx - hx, pz = lz - hz;
      const hexd = max(abs(px), abs(0.5 * px + 0.8660254 * pz), abs(-0.5 * px + 0.8660254 * pz)) - p.a * 0.8660254;
      const top = p.floor + max(-0.4, colTop(p, rx, rz, hx, hz));
      const col = min(-hexd - 0.24, top - y + 0.08 * n2(lx * 1.3, lz * 1.3));
      const base = mix(d, (p.floor - 0.6) - y + 0.3 * n2(x / 4, z / 4), w);
      return max(base, col * w - (1 - w) * 5);
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (ny > 0.8 && y > p.floor + 0.6) { mulR(rates, 0.5); rates[S.anemone] = 0.04; rates[S.brain] = 0.05; rates[S.urchin] = 0.06; rates[S.softcoral] *= 2; }
      else if (ny < 0.5) { mulR(rates, 0.3); rates[S.fan] = ny > -0.1 ? 0.03 : 0; }
      return sumR(rates);
    },
    fauna: ['turtle', 'reefMix', 'school:jack?', 'octopus'],
  });

  // =====================================================================================================================
  // PILLOW LAVA: mounds of rounded lava lobes, stacked like sacks, each lobe split from the next by a crease
  def('pillows', {
    r: 36, w: 1.4, biomes: { volcanic: 2.0 }, maxD: 60,
    init(p, R) {
      // each mound is a low dome skinned with pillows: a cellular field of rounded sacks a metre or two across, split by
      // deep creases
      p.mounds = []; const nm = 2 + floor(R() * 2);
      for (let m = 0; m < nm; m++) {
        const a = R() * TAU, rr = m ? 11 + 12 * R() : 0;
        p.mounds.push([cos(a) * rr, sin(a) * rr, 6 + 5 * R(), min(-p.floor - 6, 2 + 2.5 * R())]);
      }
      p.cs = 2.8 + 0.8 * R(); p.k = floor(R() * 1e5); p.A = 1.25 + 0.4 * R();   // big enough to survive 0.5 m voxels
      p.yMin = p.floor - 3; p.yMax = p.floor + 10;
    },
    // the height of the mounds above the floor at (dx, dz): the dome, and on it the pillow under that point
    height(p, dx, dz) {
      let h = -9, m0 = null;
      for (const m of p.mounds) { const q = ((dx - m[0]) ** 2 + (dz - m[1]) ** 2) / (m[2] * m[2]); if (q < 1.4) { const hh = m[3] * sqrt(max(0, 1 - q)) - 0.6; if (hh > h) { h = hh; m0 = m; } } }
      if (!m0) return h;
      const cs = p.cs, gx = dx / cs, gz = dz / cs, ix = floor(gx), iz = floor(gz);
      let f1 = 9, f2 = 9, hc = 0;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
        const cx = ix + i, cz = iz + j, px = cx + 0.15 + 0.7 * hash3(cx, cz, p.k), pz = cz + 0.15 + 0.7 * hash3(cx, cz, p.k + 1);
        const dd = hypot(gx - px, gz - pz);
        if (dd < f1) { f2 = f1; f1 = dd; hc = hash3(cx, cz, p.k + 2); } else if (dd < f2) f2 = dd;
      }
      // a rounded sack between creases: f2 - f1 is about twice the distance to the crease (in cells)
      const t = clamp((f2 - f1) / 0.8, 0, 1), on = sm(-0.6, 0.3, h);   // fades out where the dome meets the sand
      return max(h, -0.6) + p.A * (0.7 + 0.5 * hc) * (1 - (1 - t) * (1 - t)) * on;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      d = flatTo(p, d, x, y, z, hypot(dx, dz), p.r - 12, p.r - 2, 0.9, 0.3);   // a floor of black sand between the mounds
      if (x !== p._hx || z !== p._hz) { p._hx = x; p._hz = z; p._hh = this.height(p, dx, dz); }   // the chunk walks a column at a time
      const h = p._hh; if (h < -8) return d;
      const s = p.floor + h - y;
      return smax(d, s > -1.5 && s < 1.5 ? s + n3(x / 1.2, y / 1.2, z / 1.2) * 0.1 : s, 0.3);
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(p.r - 10, p.r - 2, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (y > p.floor + 0.8) { mulR(rates, 0.35); rates[S.urchin] = 0.05; rates[S.star] = 0.015; if (ny > 0.7) { rates[S.anemone] = 0.02; rates[S.brain] = 0.03; } }
      else mulR(rates, 0.1 + 0.9 * sm(p.r - 12, p.r - 2, hypot(dx, dz)));
      return sumR(rates);
    },
    fauna: ['turtle', 'reefMix', 'stingray?', 'octopus'],
  });

  // =====================================================================================================================
  // BOULDER GARDEN: house-sized rounded boulders tumbled together, light falling between them, ways through
  def('boulders', {
    r: 36, w: 1.4, biomes: { volcanic: 1.3, karst: 0.8 }, minD: 7, maxD: 30,
    init(p, R) {
      p.b = []; const n = 6 + floor(R() * 6);
      for (let i = 0; i < n * 5 && p.b.length < n; i++) {
        const first = !p.b.length, a = R() * TAU, rr = first ? 0 : 3 + 14 * sqrt(R()), s = min(3.6 + 3.6 * R(), -p.floor * 0.42);
        const x = cos(a) * rr, z = sin(a) * rr;
        if (!p.b.every((b) => hypot(b[0] - x, b[2] - z) > (b[3] + s) * 0.8)) continue;
        p.b.push([x, p.floor + s * 0.5, z, s, s * (0.72 + 0.2 * R()), s * (0.85 + 0.3 * R()), R() * TAU]);
      }
      // a few resting on two below them
      const base = p.b.length;
      for (let i = 0; i < base && p.b.length < base + 3; i++) for (let j = i + 1; j < base; j++) {
        const A = p.b[i], B = p.b[j], dd = hypot(A[0] - B[0], A[2] - B[2]);
        if (dd > (A[3] + B[3]) * 1.15 || R() > 0.5) continue;
        const s = min(A[3], B[3]) * (0.65 + 0.2 * R()), y = max(A[1] + A[4], B[1] + B[4]) + s * 0.25;
        if (y + s * 0.75 > -3.2) continue;
        p.b.push([(A[0] + B[0]) / 2, y, (A[2] + B[2]) / 2, s, s * 0.78, s * 0.95, R() * TAU]); break;
      }
      let top = p.floor; for (const b of p.b) top = max(top, b[1] + b[4]);
      p.yMin = p.floor - 3; p.yMax = top + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      let u = -1e9;
      for (const b of p.b) {
        const ox = dx - b[0], oz = dz - b[2]; if (abs(ox) > b[3] * 1.3 + 1 || abs(oz) > b[3] * 1.3 + 1) continue;
        const c = cos(b[6]), s = sin(b[6]), ax = (c * ox + s * oz) / b[3], az = (-s * ox + c * oz) / b[5], ay = (y - b[1]) / b[4];
        u = max(u, (1 - sqrt(ax * ax + ay * ay + az * az)) * b[4]);
      }
      const dd = flatTo(p, d, x, y, z, hypot(dx, dz), p.r - 14, p.r - 3);
      if (u < -4) return dd;
      return smax(dd, u + n3(x / 3.3, y / 3.3, z / 3.3) * 0.45 + n3(x / 0.9, y / 0.9, z / 0.9) * 0.08, 0.6);
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(p.r - 12, p.r - 2, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (y > p.floor + 1) { mulR(rates, 0.25); if (ny > 0.75) { rates[S.anemone] = 0.02; rates[S.brain] = 0.02; } else if (ny > -0.1 && ny < 0.5) { rates[S.fan] = 0.03; rates[S.softcoral] = 0.03; } }
      else mulR(rates, 0.1 + 0.9 * sm(p.r - 14, p.r - 3, hypot(dx, dz)));
      return sumR(rates);
    },
    fauna: ['turtle', 'school:glassy', 'reefMix', 'school:snapper?', 'moray'],
  });

  // =====================================================================================================================
  // MICROATOLLS: a shallow flat of round coral heads whose tops all stopped at the same level: living rims, dead
  // dished centres, growth rings like a cut tree
  def('microatolls', {
    r: 38, w: 2.2, biomes: { lagoon: 2.2, reef: 0.7 }, minD: 4, maxD: 7.5,
    init(p, R) {
      p.top = min(-2.4 - 0.4 * R(), p.floor + 1.4); p.at = []; const cs = 8.5;
      for (let gj = -5; gj <= 5; gj++) for (let gi = -5; gi <= 5; gi++) {
        if (R() > 0.72) continue;
        const x = (gi + 0.15 + 0.7 * R()) * cs, z = (gj + 0.15 + 0.7 * R()) * cs; if (hypot(x, z) > p.r - 6) continue;
        p.at.push([x, z, 1.3 + 2.6 * R(), p.top + (R() - 0.5) * 0.3, R() * 9]);
      }
      p.yMin = p.floor - 3; p.yMax = p.top + 2;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      let dd = flatTo(p, d, x, y, z, hypot(dx, dz), p.r - 10, p.r - 2, 0.9, 0.2);
      for (const a of p.at) {
        const ox = dx - a[0], oz = dz - a[1]; if (abs(ox) > a[2] + 1.5 || abs(oz) > a[2] + 1.5) continue;
        const hd = hypot(ox, oz) * (1 + 0.06 * sin(atan2(oz, ox) * 5 + a[4]));
        const side = a[2] * (1 + 0.12 * (1 - sm(0, 1.5, y - p.floor))) - hd;
        const top = a[3] - 0.42 * (1 - sm(a[2] * 0.35, a[2] * 0.8, hd)) + 0.07 * sin(hd * 5.5 + a[4]) - y;
        dd = smax(dd, min(side, top) + n3(x / 0.8, y / 0.8, z / 0.8) * 0.1 + n3(x / 2.5, y / 2.5, z / 2.5) * 0.18, 0.4);
      }
      return dd;
    },
    rel(p, x, z, dx, dz, rel) {
      for (const a of p.at) { const hd = hypot(dx - a[0], dz - a[1]); if (hd < a[2] * 1.1) return hd < a[2] * 0.45 ? -1 : 3; }
      return mix(-1.6, rel, sm(p.r - 8, p.r - 1, hypot(dx, dz)));
    },
    plant(p, x, y, z, dx, dz, rates, S, sand) {
      if (y > p.floor + 0.6) { mulR(rates, 0.3); rates[S.brain] = 0.04; rates[S.staghorn] = 0.05; rates[S.clam] = 0.03; rates[S.anemone] = 0.015; }
      else { const k = sm(p.r - 10, p.r - 2, hypot(dx, dz)); mulR(rates, 0.08 + 0.92 * k); rates[S.seagrass] = sand > 0.3 ? mix(0.9, rates[S.seagrass], k) : 0; }
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {   // giant clams set into the living rims
      for (const a of p.at) if (R() < 0.35) { const ang = R() * TAU, rr = a[2] * 0.72; onGround(E, 'tridacna', p.x + a[0] + cos(ang) * rr, p.z + a[1] + sin(ang) * rr, p.yMax, p.floor - 2, 0.65 + 0.5 * R(), 0.7, R() * TAU, seedOf(floor(R() * 3), floor(R() * 4)), 0.14); }
    }),
    fauna: ['reefShark', 'stingray', 'reefMix', 'turtle?'],
  });

  // =====================================================================================================================
  // GIANT BARRELS: a slope standing with barrel sponges as tall as a man, some taller, hundreds of years old
  def('barrels', {
    r: 34, w: 1.3, biomes: { meso: 1.6, karst: 0.8, reef: 0.5, volcanic: 0.4 }, minD: 16, maxD: 95,
    init(p, R) { p.n = 14 + floor(R() * 14); p.yMin = p.floor - 6; p.yMax = p.floor + 8; },
    plant(p, x, y, z, dx, dz, rates, S) { rates[S.whip] *= 2; rates[S.fan] *= 1.6; rates[S.barrel] *= 0.3; rates[S.staghorn] *= 0.5; return sumR(rates); },
    inst: emitter((p, E, R) => {
      const pts = [];
      for (let i = 0; i < p.n * 4 && pts.length < p.n; i++) {
        const a = R() * TAU, rr = pts.length ? 3 + 26 * sqrt(R()) : 0, x = cos(a) * rr, z = sin(a) * rr, s = pts.length ? 1.2 + 1.6 * R() * (1 - rr / 40) : 3.0 + 0.4 * R();
        if (!pts.every((q) => hypot(q[0] - x, q[1] - z) > (q[2] + s) * 0.62)) continue;
        pts.push([x, z, s]);
        onGround(E, 'barrel', p.x + x, p.z + z, p.yMax, p.yMin, s, 0.8, R() * TAU, undefined, 0.15);
      }
    }),
    fauna: ['turtle', 'school:snapper', 'grouper', 'reefMix'],
  });

  // =====================================================================================================================
  // PLATE TERRACES: mesophotic steps, every lip and riser stacked with whorls of plate coral reaching for the last light
  const stepH = (p, lx, lz) => {
    const z = lz + 1.6 * sin(lx * 0.13 + p.k) + 0.8 * sin(lx * 0.31);
    let h = 0; for (const s of p.st) h += s[1] * (1 - sm(s[0] - 0.55, s[0] + 0.55, z));
    return h * sm(-p.Wd - 4, -p.Wd + 8, lx) * (1 - sm(p.Wd - 8, p.Wd + 4, lx)) * sm(-p.r + 2, -p.r + 14, lz);
  };
  def('terraces', {
    r: 44, w: 1.6, biomes: { meso: 2.2, karst: 0.25 }, minD: 36, maxD: 100,
    init(p, R) {
      p.yaw = R() * TAU; p.st = []; let z = -16 - 6 * R();
      const n = 4 + floor(R() * 3);
      for (let i = 0; i < n; i++) { p.st.push([z, 2.2 + 2 * R()]); z += 5.5 + 3 * R(); }
      p.Wd = 26 + 8 * R(); p.k = R() * 9;
      const Ht = p.st.reduce((s, a) => s + a[1], 0); p.yMin = p.floor - 3; p.yMax = p.floor + Ht + 4;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz);
      return d + stepH(p, lx, lz) * (1 - sm(p.r - 6, p.r, hypot(dx, dz)));
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) { rates[S.platecoral] *= 2.5; rates[S.whip] *= 1.5; rates[S.fan] *= 1.3; rates[S.barrel] *= 0.12; rates[S.tubesponge] *= 0.5; return sumR(rates); },
    inst: emitter((p, E, R) => {
      for (const s of p.st) for (let lx = -p.Wd + 6; lx < p.Wd - 6; lx += 0.9 + R() * 1.0) {
        const zl = s[0] - 1.6 * sin(lx * 0.13 + p.k) - 0.8 * sin(lx * 0.31);
        // on the lip, overhanging the step below
        let [x, z] = toW(p, lx, zl - 0.7 - R() * 0.9);
        let y = groundY(x, z, p.yMax, p.yMin);
        if (y === y) E('leafcoral', x, y - 0.1, z, 1.2 + 1.3 * R(), R() * TAU, [0, 1, 0], seedOf(floor(R() * 3), floor(R() * 4)));
        if (R() < 0.35) { [x, z] = toW(p, lx + 0.5, zl - 2.5 - R() * 2.5); y = groundY(x, z, p.yMax, p.yMin); if (y === y) E('leafcoral', x, y - 0.1, z, 0.8 + 0.8 * R(), R() * TAU, [0, 1, 0], seedOf(floor(R() * 3), floor(R() * 4))); }
        // and stacked on the riser below the lip, sticking straight out like shelves
        if (R() < 0.6) {
          [x, z] = toW(p, lx, zl + 1.6); const yl = groundY(x, z, p.yMax, p.yMin); if (!(yl === yl)) continue;
          const yq = yl + s[1] * (0.25 + 0.45 * R());
          for (let t = 1.6; t > -1.2; t -= 0.15) {   // march back to the face of the riser
            const [wx, wz] = toW(p, lx, zl + t);
            if (W.density(wx, yq, wz) > 0) { const n = normalAt(wx, yq, wz); E('leafcoral', wx, yq, wz, 0.7 + 0.8 * R(), R() * TAU, upish(n, 0.72), seedOf(floor(R() * 3), floor(R() * 4))); break; }
          }
        }
      }
    }),
    fauna: ['reefMix', 'anthiasCloud', 'school:snapper?', 'hammerheads?'],
  });

  // =====================================================================================================================
  // THE OLD ONE: a single Porites colony the size of a house, older than any ship, scarred pale where parrotfish bite
  def('porites', {
    r: 26, w: 0.35, biomes: { reef: 1.0, lagoon: 1.3 }, minD: 7, maxD: 22,
    init(p, R) { p.s = min(0.85 + 0.5 * R(), (-p.floor - 3) / 5.6); p.yaw = R() * TAU; p.yMin = p.floor - 3; p.yMax = p.floor + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const w = 1 - sm(8 * p.s, 15 * p.s, hypot(dx, dz)); if (w <= 0) return d;
      return mix(d, p.floor - y + 0.15 * n2(x / 3, z / 3), w * 0.85);
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(10 * p.s, 18 * p.s, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S) { const k = sm(6 * p.s, 14 * p.s, hypot(dx, dz)); mulR(rates, k); rates[S.rubble] += 0.08 * (1 - k); return sumR(rates); },
    inst: emitter((p, E, R) => {
      const y = groundY(p.x, p.z, p.floor + 3, p.floor - 3);
      E('porites', p.x, y - 0.45 * p.s, p.z, p.s, p.yaw, null, seedOf(floor(R() * 3), floor(R() * 4)));
      for (let i = 0; i < 4; i++) { const a = R() * TAU, rr = (7 + 4 * R()) * p.s; onGround(E, 'porites', p.x + cos(a) * rr, p.z + sin(a) * rr, p.floor + 3, p.floor - 3, p.s * (0.12 + 0.16 * R()), 0.6, R() * TAU, seedOf(floor(R() * 3), floor(R() * 4)), 0.3); }
      for (let i = 0; i < 6; i++) { const a = R() * TAU, rr = (6 + 6 * R()) * p.s; onGround(E, R() < 0.5 ? 'brain' : 'anemone', p.x + cos(a) * rr, p.z + sin(a) * rr, p.floor + 3, p.floor - 3, 0.9 + 0.5 * R(), 0.5, R() * TAU); }
    }),
    fauna: ['napoleon', 'reefMix', 'school:fusilier', 'turtle?', 'parrotfish'],
  });

  // =====================================================================================================================
  // THE CANYON: a gorge 120 m long cut down through the shelf, walls stepped with ledges, a river of sand at the
  // bottom, sometimes a natural bridge across it
  def('canyon', {
    r: 85, w: 0.8, biomes: { reef: 0.7, karst: 1.1, volcanic: 0.6, meso: 0.5 }, minD: 6, maxD: 60,
    init(p, R) {
      p.yaw = R() * TAU; p.L = 58 + 12 * R(); p.D = 14 + 10 * R(); p.w0 = 3 + 3 * R(); p.fl = 0.25 + 0.3 * R(); p.A = 5 + 7 * R(); p.kk = 0.05 + 0.04 * R(); p.ph = R() * TAU;
      p.ax = (R() - 0.5) * p.L * 0.8; p.arch = R() < 0.6; p.r = p.L + 14; p.yMin = p.floor - p.D - 4; p.yMax = p.floor + 6;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.floor + 8) return d;
      const [lx, lz] = rot(p, dx, dz);
      if (abs(lx) > p.L + 6) return d;
      const c = p.A * sin(lx * p.kk + p.ph) + 0.4 * p.A * sin(lx * p.kk * 2.3);
      const per = (lz - c) / sqrt(1 + (p.A * p.kk * cos(lx * p.kk + p.ph)) ** 2);
      const env = 1 - sm(p.L * 0.55, p.L, abs(lx));
      const bottom = p.floor - p.D * env * (0.8 + 0.2 * n2(lx / 30, p.ph)) + 0.4 * n2(x / 6, z / 6);
      if (y < bottom - 3) return d;
      const hgt = y - bottom;
      let hw = p.w0 * (0.6 + 0.4 * env) + max(0, hgt) * p.fl + 0.9 * sm(0.5, 0.65, fract(hgt / 3.4)) + n3(x / 4, y / 3, z / 4) * 1.6 + n3(x / 1.5, y / 1.5, z / 1.5) * 0.4;
      let dd = smin(d, max(abs(per) - hw, bottom - y), 1.6);
      if (p.arch && abs(lx - p.ax) < 6) {
        const bA = p.floor - p.D * (1 - sm(p.L * 0.55, p.L, abs(p.ax))) * 0.9, wA = p.w0 + p.D * 0.45 * p.fl + 2;
        dd = smax(dd, W.shape.archD(x, y, z, per, y - (bA + p.D * 0.25), lx - p.ax, wA + 1.5, 1.7, p.ph), 1.2);
      }
      return dd;
    },
    rel(p, x, z, dx, dz, rel) {
      const [lx, lz] = rot(p, dx, dz); if (abs(lx) > p.L) return rel;
      const c = p.A * sin(lx * p.kk + p.ph) + 0.4 * p.A * sin(lx * p.kk * 2.3);
      return abs(lz - c) < p.w0 * 1.2 ? -2 : rel;
    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (y < p.floor - 2 && ny < 0.55 && ny > -0.1) { rates[S.fan] = max(rates[S.fan], 0.12); rates[S.softcoral] = max(rates[S.softcoral], 0.14); rates[S.tubesponge] = max(rates[S.tubesponge], 0.05); }
      return sumR(rates);
    },
    fauna: ['school:jack', 'reefMix', 'school:barracuda?', 'eagleRay?', 'hammerheads?'],
  });

  // =====================================================================================================================
  // COLONNADE: a thin fin of limestone pierced by a row of windows of every size, each one a way through
  def('colonnade', {
    r: 40, w: 1.1, biomes: { karst: 1.8, reef: 0.4, volcanic: 0.4 }, minD: 9, maxD: 40,
    init(p, R) {
      p.yaw = R() * TAU; p.L = 20 + 9 * R(); p.H = min(-p.floor - 3.5, 11 + 6 * R()); p.T = 1.9 + 1.1 * R(); p.k = R() * 9;
      p.win = []; const n = 3 + floor(R() * 3);
      for (let i = 0; i < n; i++) { const wx = -p.L * 0.7 + (i + 0.5) / n * p.L * 1.4 + (R() - 0.5) * 2, ry = (0.26 + 0.18 * R()) * p.H; p.win.push([wx, p.floor + ry * (0.55 + 0.6 * R()), min(p.L * 1.4 / n * 0.4, 2.4 + 2.4 * R()), ry]); }
      p.r = p.L + 12; p.yMin = p.floor - 3; p.yMax = p.floor + p.H + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz);
      d = flatTo(p, d, x, y, z, hypot(lx / (p.L + 8), lz / 16) * p.r, p.r * 0.7, p.r, 0.9, 0.3);   // it stands alone on sand
      if (abs(lx) > p.L + 6 || abs(lz) > 14) return d;
      const u = clamp((y - p.floor) / p.H, 0, 1), side = abs(lz - 2.2 * sin(lx * 0.1 + p.k));
      if (side > p.T * 1.35 + 4.5) return d;
      const th = p.T * (1.35 - 0.6 * u) + n3(x / 3, y / 3, z / 3) * 0.9 + n3(x / 1.2, y / 1.2, z / 1.2) * 0.25;
      const topY = p.floor + p.H * (1 - (lx / (p.L + 2)) ** 4) + n2(x / 5, z / 5) * 1.0;
      let fin = min(th - side, topY - y);
      if (fin > -2.5) for (const w of p.win) {
        const ex = (lx - w[0]) / w[2], ey = (y - w[1]) / w[3], q = sqrt(ex * ex + ey * ey);
        if (q < 1.8) fin = smin(fin, (q - 1) * min(w[2], w[3]) + n3(x / 1.6, y / 1.6, z / 1.6) * 0.45, 0.6);
      }
      return smax(d, fin, 1.3);
    },
    rel(p, x, z, dx, dz, rel) { const [lx, lz] = rot(p, dx, dz); return mix(-1.6, rel, sm(p.r * 0.7, p.r, hypot(lx / (p.L + 8), lz / 16) * p.r)); },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      if (y > p.floor + 1.5) { if (ny > 0.6) { rates[S.staghorn] *= 1.4; rates[S.table] *= 1.8; } else { mulR(rates, 0.3); if (ny > -0.1) rates[S.fan] = 0.06; } }
      else { const [lx, lz] = rot(p, dx, dz); mulR(rates, 0.12 + 0.88 * sm(p.r * 0.7, p.r, hypot(lx / (p.L + 8), lz / 16) * p.r)); }
      return sumR(rates);
    },
    fauna: ['reefMix', 'school:fusilier', 'eagleRay?', 'manta?'],
  });

  // =====================================================================================================================
  // MANTA CLEANING STATION: a flat-topped coral head on a sandy plateau, its crown of rubble where the cleaner wrasse
  // wait; the mantas come in and hang over it
  def('mantastation', {
    r: 30, w: 1.0, biomes: { reef: 0.9, lagoon: 0.9, karst: 0.3 }, minD: 8, maxD: 28,
    init(p, R) { p.R = 5 + 2.5 * R(); p.H = min(-p.floor - 4, 2 + 1.6 * R()); p.k = R() * 9; p.yMin = p.floor - 3; p.yMax = p.floor + p.H + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const dist = hypot(dx, dz), w = 1 - sm(p.r - 10, p.r - 2, dist);
      let dd = mix(d, p.floor - y + 0.2 * n2(x / 6, z / 6), w * 0.9);
      if (dist < p.R + 3) { const rr = p.R * (1 + 0.12 * sin(atan2(dz, dx) * 4 + p.k)); dd = smax(dd, min(rr - dist, p.floor + p.H - y + 0.1 * n2(x, z)) + n3(x / 1.5, y / 1.5, z / 1.5) * 0.4, 1.2); }
      return dd;
    },
    rel(p, x, z, dx, dz, rel) { return hypot(dx, dz) < p.R * 1.1 ? 3 : mix(-1.6, rel, sm(p.r - 8, p.r, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      const dist = hypot(dx, dz);
      if (dist < p.R * 1.05) { if (ny > 0.75) { mulR(rates, 0.1); rates[S.rubble] = 0.5; } else { rates[S.brain] = 0.15; rates[S.staghorn] = 0.2; rates[S.softcoral] = 0.1; rates[S.fan] = 0.05; } }
      else mulR(rates, 0.15 + 0.85 * sm(p.R * 2, p.r - 4, dist));
      return sumR(rates);
    },
    inst: emitter((p, E, R) => {
      for (let i = 0; i < 26; i++) { const a = R() * TAU, rr = sqrt(R()) * p.R * 0.85; onGround(E, 'rubble', p.x + cos(a) * rr, p.z + sin(a) * rr, p.yMax, p.floor - 2, 1.2 + 1.6 * R(), 0.3, R() * TAU); }
      for (let i = 0; i < 5; i++) { const a = R() * TAU, rr = p.R * (0.9 + 0.15 * R()); onGround(E, R() < 0.5 ? 'brain' : 'anemone', p.x + cos(a) * rr, p.z + sin(a) * rr, p.yMax, p.floor - 2, 0.9 + 0.5 * R(), 0.5, R() * TAU); }
    }),
    fauna: ['manta', 'manta?', 'reefMix', 'school:fusilier?', 'cleanerStation'],
  });

  // =====================================================================================================================
  // SHARK SANDBAR: a wide bright flat of rippled sand with almost nothing on it, where reef sharks lie and rays feed
  def('sandbar', {
    r: 46, w: 1.0, biomes: { lagoon: 1.6, reef: 0.7 }, maxD: 20,
    init(p, R) { p.yaw = R() * TAU; p.lam = 3 + 2 * R(); p.amp = 0.22 + 0.15 * R(); p.heads = []; for (let i = 0; i < 5; i++) { const a = R() * TAU, rr = 26 + 12 * R(); p.heads.push([cos(a) * rr, sin(a) * rr]); } p.yMin = p.floor - 3; p.yMax = p.floor + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const dist = hypot(dx, dz), w = 1 - sm(p.r - 14, p.r - 2, dist); if (w <= 0) return d;
      const [lx, lz] = rot(p, dx, dz), ph = lz / p.lam * TAU + 2.2 * n2(lx / 23, lz / 23) + 0.6 * n2(lx / 7, lz / 9);
      const rip = p.amp * (sin(ph) * 0.8 + 0.25 * sin(ph * 2 + 1)) * (0.6 + 0.4 * n2(lx / 15, lz / 15));
      return mix(d, p.floor - y + 0.4 * n2(x / 17, z / 17) + rip, w * 0.92);
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.8, rel, sm(p.r - 12, p.r, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S) { const k = 0.03 + 0.97 * sm(p.r - 14, p.r - 2, hypot(dx, dz)); mulR(rates, k); return sumR(rates); },
    inst: emitter((p, E, R) => {
      for (const [hx, hz] of p.heads) { const [x, z] = toW(p, hx, hz); onGround(E, 'boulder', x, z, p.yMax, p.yMin, 1.6 + 1.0 * R(), 0.5, R() * TAU); onGround(E, 'staghorn', x + 1.2, z + 0.5, p.yMax, p.yMin, 1.2, 0.6, R() * TAU); }
    }),
    fauna: ['stingray', 'reefShark', 'gardenEels', 'eagleRay?'],
  });

  // =====================================================================================================================
  // GIANT CLAM NURSERY: giant clams set out in rows on clean sand by the people of the islands, stakes at the row ends
  def('clamfarm', {
    r: 26, w: 1.3, biomes: { lagoon: 1.6, reef: 0.5 }, minD: 3, maxD: 14,
    init(p, R) { p.yaw = R() * TAU; p.nr = 4 + floor(R() * 3); p.nc = 6 + floor(R() * 5); p.sp = 2.0 + 0.6 * R(); p.yMin = p.floor - 3; p.yMax = p.floor + 3; },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      const w = 1 - sm(p.r - 10, p.r - 2, hypot(dx, dz)); if (w <= 0) return d;
      return mix(d, p.floor - y + 0.1 * n2(x / 4, z / 4), w * 0.9);
    },
    rel(p, x, z, dx, dz, rel) { return mix(-1.6, rel, sm(p.r - 8, p.r, hypot(dx, dz))); },
    plant(p, x, y, z, dx, dz, rates, S) { const k = sm(p.r - 12, p.r - 2, hypot(dx, dz)); mulR(rates, 0.04 + 0.96 * k); return sumR(rates); },
    inst: emitter((p, E, R) => {
      const W0 = (p.nc - 1) * p.sp / 2, H0 = (p.nr - 1) * p.sp * 1.2 / 2;
      for (let r = 0; r < p.nr; r++) {
        for (let c = 0; c < p.nc; c++) {
          if (R() < 0.13) continue;   // one gone here and there
          const lx = -W0 + c * p.sp + (R() - 0.5) * 0.3, lz = -H0 + r * p.sp * 1.2 + (R() - 0.5) * 0.3, [x, z] = toW(p, lx, lz);
          const young = R() < 0.25;
          onGround(E, 'tridacna', x, z, p.floor + 3, p.floor - 3, young ? 0.5 + 0.15 * R() : 0.95 + 0.35 * R(), 0.8, p.yaw + (R() - 0.5) * 0.4, seedOf(floor(R() * 3), floor(R() * 4)), 0.12);
        }
        for (const sd of [-1, 1]) { const [x, z] = toW(p, sd * (W0 + p.sp * 0.8), -H0 + r * p.sp * 1.2); onGround(E, 'mooringblock', x, z, p.floor + 3, p.floor - 3, 1, 0.97, R() * TAU, seedOf(2, floor(R() * 4)), 0); }
      }
      for (let i = 0; i < 3; i++) { const [x, z] = toW(p, (R() - 0.5) * W0 * 2.4, H0 + p.sp * (1 + R())); onGround(E, 'mooringblock', x, z, p.floor + 3, p.floor - 3, 1, 0.9, R() * TAU, seedOf(1, floor(R() * 4)), 0); }
    }),
    fauna: ['reefMix', 'stingray?', 'school:snapper?', 'turtle?'],
  });

  // =====================================================================================================================
  // THE TRADER'S BONES: a wooden ship's keel and frames half-sunk in sand, ballast heaped where her hold was, and a
  // trail up toward the reef of the guns and an anchor she threw over trying to get off it
  def('woodwreck', {
    r: 60, w: 1.0, biomes: { reef: 1.0, lagoon: 0.8, karst: 0.8, volcanic: 0.4 }, minD: 9, maxD: 32,
    init(p, R) {
      p.yaw = R() * TAU; p.ta = p.yaw + PI * (0.25 + 0.5 * R()) * (R() < 0.5 ? 1 : -1); p.tl = 26 + 14 * R();
      p.yMin = p.floor - 4; p.yMax = p.floor + 6;
    },
    density(p, x, y, z, d, dx, dz) {   // the sand has filled her: a low mound inside the frames
      if (y > p.yMax) return d;
      const [lx, lz] = rot(p, dx, dz), q = (lx / 15) ** 2 + (lz / 3.2) ** 2;
      return q > 1 ? d : d + 0.75 * (1 - q) ** 0.7;
    },
    rel(p, x, z, dx, dz, rel) { const [lx, lz] = rot(p, dx, dz); return (lx / 18) ** 2 + (lz / 6) ** 2 < 1 ? -1.6 : rel; },
    plant(p, x, y, z, dx, dz, rates, S) { const [lx, lz] = rot(p, dx, dz); if ((lx / 17) ** 2 + (lz / 5) ** 2 < 1) mulR(rates, 0.08); return sumR(rates); },
    inst: emitter((p, E, R) => {
      const pal = floor(R() * 4), g = (lx, lz) => toW(p, lx, lz);
      for (let v = 0; v < 3; v++) {   // the hull sections, bow toward +x, a little out of line where she broke
        const off = (1 - v) * 9.6, [x, z] = g(off + (R() - 0.5) * 0.4, (R() - 0.5) * 0.6);

  // ---------- a steel trawler, listing in the sand, its net still hanging off the gantry ----------
  const TR = {   // the hull in its own frame (same as the mesh): x aft..bow -12..12.3, keel y -1.9 at midships

  // ---------- a spill of shipping containers: tumbled, stacked, one burst open with its tyres across the sand ----------

  // ======================================================================================================

  const polarOK = (p) => bwAt(p, 'polar') > 0.3;    // ice only where the water is polar

  // ---------- an iceberg wall: a tabular berg two hundred metres long, floating, room to swim under its keel ----------
  def('icebergwall', {
    r: 125, w: 1.4, biomes: { polar: 2.2 }, minD: 22, maxD: 75,
    init(p, R) { if (handOff(p, R)) return;
      frame(p, R() * TAU); p.ice = polarOK(p);

    iceD(p, x, y, z, dx, dz) {
      if (!p.ice || y < p.keel - 9 || y > 7) return -9;

      // sheer walls fluted by melt runnels and banded by old waterlines; a ragged keel hanging in the dark
      const along = qx ** 4 > qz ** 4 ? lz : lx;
      const wall = (1 - pe) * min(p.hx, p.hz) + 1.4 * n2(along / 2.6, y / 14) + 0.9 * n3(x / 11, y / 6, z / 11) + 0.5 * sm(0.6, 0.95, abs(sin(y * 0.45 + n2(along / 30, 1) * 2)));
      const under = y - (p.keel - 4 * sm(-0.2, 0.6, n2(x / 28, z / 28)) - 1.8 * n2(x / 9, z / 9) + 2.5 * sm(0.6, 1, pe));

  // ---------- an ice cave: a grounded berg hollowed into a blue chamber, icicles of brine, a chimney of light ----------
  def('icecave', {
    r: 52, w: 1.3, biomes: { polar: 2 }, minD: 14, maxD: 60,
    init(p, R) { if (handOff(p, R)) return;
      frame(p, R() * TAU); p.ice = polarOK(p);
      p.Rb = 30 + 10 * R(); p.r = p.Rb * 1.35;
      // the chamber's floor is the sea bed, so it is dark and the chimney's light falls on it

      p.ic = []; for (let i = 0; i < 16; i++) { const a = R() * TAU, d = sqrt(R()) * p.cr * 0.8; p.ic.push([cos(a) * d, sin(a) * d, 1.5 + 3.5 * R(), 0.35 + 0.5 * R()]); }

    iceD(p, x, y, z, dx, dz) {

      const rr = hypot(lx, lz);
      if (rr > p.Rb * 1.3) return -9;
      const fy = y > 0 ? y / 7 : 0;
      let ice = p.Rb * (1 - 0.5 * fy * fy) * (0.86 + 0.16 * n3(x / 14, y / 9, z / 14)) - rr + 0.5 * n3(x / 3.5, y / 3, z / 3.5);
      // the chamber, its entrance tunnel on the +x side, and a chimney to the surface
      const ey = (y - p.cy) / p.ch, chamber = 1 - hypot(lx / p.cr, ey, lz / p.cr) + 0.06 * n3(x / 2.5, y / 2.5, z / 2.5);

  // ---------- a sea-ice ceiling: the whole sky is ice, cracked by leads that let the light down in blades ----------
  def('seaice', {

      p.ridges = []; for (let i = 0; i < 2; i++) { const a = R() * PI; p.ridges.push([cos(a), sin(a), (R() - 0.5) * 120, 3.5 + 4 * R()]); }

  // ---------- a brinicle: a finger of ice grown down from the sea ice to the floor, freezing a web across it ----------
  def('brinicle', {
    r: 34, w: 1, biomes: { polar: 2 }, minD: 7, maxD: 30,

  // ---------- an iceberg scour: a trench ploughed through the floor, the berg that did it still aground at its end ----------
  def('icescour', {
    r: 100, w: 1.1, biomes: { polar: 2 }, minD: 14, maxD: 70,

    density(p, x, y, z, d, dx, dz) {

      if (lx < -92 || lx > p.end + 26 || abs(lz) > p.w + 9) return d;

      const wig = 2.5 * sin(lx * 0.025 + p.seed * 6);
      const q = abs(lz - wig), fade = sm(-92, -70, lx) * (1 - sm(p.end + 4, p.end + 14, lx));
      // the trench, its floor scored lengthwise, berms of ploughed mud along both sides, a push mound in front of the berg
      const trench = -p.dep * (1 - sm(p.w - 2, p.w + 1, q)) * (1 + 0.12 * sin(lz * 2.1)) + 1.3 * Math.exp(-((q - p.w - 2) ** 2) / 4);

    iceD(p, x, y, z, dx, dz) {

      return tot(rates);

  });

  // ---------- Antarctic sponge garden: giant white volcano sponges on mud strewn with glacial dropstones ----------

  // ---------- a glass-sponge reef: mounds built of pale cloud sponges, rockfish hanging over them ----------

  // ---------- a seamount crown: rock pinnacles standing up out of the deep toward the light ----------
  def('seamountspires', {
    r: 58, w: 1.1, biomes: { sponge: 1, twilight: 1.3, coldreef: 1.1 }, minD: 65, maxD: 260,
    init(p, R) {
      p.pk = []; const n = 3 + floor(R() * 4);

        const a = R() * TAU, d = i === 0 ? 0 : 14 + 22 * R(), H = (i === 0 ? 30 : 14) + 16 * R();
        p.pk.push([cos(a) * d, sin(a) * d, (i === 0 ? 9 : 5) + 4 * R(), min(-14, p.floor + H), R() * TAU]);
      }
      p.yMin = p.floor - 3; p.yMax = Math.max(...p.pk.map((k) => k[3])) + 3;
    },
    density(p, x, y, z, d, dx, dz) {
      if (y > p.yMax) return d;
      let dd = d;
      for (const k of p.pk) {
        const hx = dx - k[0], hz = dz - k[1], hr = hypot(hx, hz); if (hr > k[2] * 1.8 + 3) continue;
        const t = clamp((y - p.floor) / (k[3] - p.floor), 0, 1);
        let r = k[2] * (1.25 - 0.75 * t) * (1 + 0.18 * sin(atan2(hz, hx) * 3 + k[4])) + 1.1 * sm(0.4, 0.9, sin(y * 0.55 + k[4]) * 0.5 + 0.5);

    },
    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {
      const hi = y - p.floor;

  // ---------- the canyon (Alex's reference): stepped walls, a roof with a hole that lets a shaft of light in, fans on every ledge ----------
  def('deepcanyon', {
    r: 130, w: 1.4, biomes: { sponge: 1.2, twilight: 1.4, coldreef: 1, meso: 0.3 }, minD: 40, maxD: 210,

    plant(p, x, y, z, dx, dz, rates, S, sand, ny) {

  // ---------- a nodule field: the plain paved with black manganese lumps, crossed by tracks a mining machine left decades ago ----------

  // ---------- a whale fall: a skeleton on the plain, its bones furred red with bone-eating worms, white mats round it ----------
  def('whalefall', {
    r: 36, w: 1.3, biomes: { abyss: 1.4, twilight: 1.1, coldreef: 0.3 }, minD: 140,

  // ---------- black smokers: one great flanged spire and a stand of thin chimneys on a sulphide mound ----------
  def('blacksmokers', {

  // ---------- a Lost City: white carbonate towers grown by cool alkaline vents, ghostly in the torch ----------
  def('lostcity', {

// Background workers build terrain chunks; this keeps the ones near the camera loaded and drops the far ones.
const World = {};
// world modules, always run in this order (main thread and workers): SPECIES_MORE (11), PLACES (12), PLACES_WARM (13), PLACES_COLD (14)
const PLACE_MODULES = [typeof SPECIES_MORE === 'function' ? SPECIES_MORE : null, typeof SPECIES_REEF === 'function' ? SPECIES_REEF : null, PLACES, typeof PLACES_WARM === 'function' ? PLACES_WARM : null, typeof PLACES_COLD === 'function' ? PLACES_COLD : null].filter(Boolean);
WORLDLIB(World); for (const m of PLACE_MODULES) m(World);

function workerMain(W) {
  self.onmessage = (ev) => {
    const m = ev.data;
    if (m.type !== 'chunk') return;
    const t0 = performance.now();
    let r = null;
    try { r = W.buildChunk(m.cx, m.cy, m.cz); } catch (e) { postMessage({ type: 'error', msg: String((e && e.stack) || e) }); }
    if (!r) { postMessage({ type: 'chunk', key: m.key, empty: true, ms: performance.now() - t0 }); return; }
    const tr = [r.vbuf, r.ibuf.buffer];
    for (const s in r.inst) { tr.push(r.inst[s].d.buffer); tr.push(r.inst[s].off.buffer); }
    postMessage({ type: 'chunk', key: m.key, vbuf: r.vbuf, ibuf: r.ibuf, nv: r.nv, ni: r.ni, inst: r.inst, ms: performance.now() - t0 }, tr);
  };
}
const WORKER_SRC = WORLDLIB.toString() + '\n' + PLACE_MODULES.map((m) => m.toString()).join('\n') +
  '\nconst W = {}; WORLDLIB(W); ' + PLACE_MODULES.map((m) => m.name + '(W);').join(' ') + '\n(' + workerMain.toString() + ')(W);';

const Stream = {
  R: 112,               // load radius (metres); the water hides what is beyond
  workers: [], inflight: [], chunks: new Map(), ranges: new Map(), stats: { built: 0, ms: 0, empty: 0 },
  init() {
    const n = clamp((navigator.hardwareConcurrency || 8) - 3, 2, 8);
    const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    for (let i = 0; i < n; i++) {
      const w = new Worker(url);
      w.onmessage = (ev) => this.onMsg(i, ev.data);
      w.onerror = (e) => showErr('worker: ' + (e.message || e));
      this.workers.push(w); this.inflight.push(0);
    }
  },
  key(cx, cy, cz) { return cx + ',' + cy + ',' + cz; },
  range(cx, cz) {
    const k = cx + ',' + cz;
    let r = this.ranges.get(k);
    if (!r) { r = World.chunkRange(cx, cz); this.ranges.set(k, r); if (this.ranges.size > 6000) this.ranges.clear(); }
    return r;
  },
  // pending work, nearest first
  update(cam) {
    const CH = World.CH, R = this.R;
    const ccx = Math.floor(cam[0] / CH), ccz = Math.floor(cam[2] / CH), rc = Math.ceil(R / CH) + 1;
    const want = [];
    for (let dz = -rc; dz <= rc; dz++) for (let dx = -rc; dx <= rc; dx++) {
      const cx = ccx + dx, cz = ccz + dz;
      const nx = clamp(cam[0], cx * CH, cx * CH + CH), nz = clamp(cam[2], cz * CH, cz * CH + CH);
      const hd = Math.hypot(nx - cam[0], nz - cam[2]);
      if (hd > R) continue;
      const [lo, hi] = this.range(cx, cz);
      for (let cy = lo; cy <= hi; cy++) {
        const ny = clamp(cam[1], cy * CH, cy * CH + CH);
        const d = Math.hypot(hd, ny - cam[1]);
        if (d > R) continue;
        const k = this.key(cx, cy, cz);
        const c = this.chunks.get(k);
        if (c) { c.seen = Render.frame; continue; }
        want.push([d, cx, cy, cz, k]);
      }
    }
    want.sort((a, b) => a[0] - b[0]);
    for (const w of want) {
      let best = -1, bl = 3;
      for (let i = 0; i < this.workers.length; i++) if (this.inflight[i] < bl) { bl = this.inflight[i]; best = i; }
      if (best < 0) break;
      const [, cx, cy, cz, k] = w;
      this.chunks.set(k, { cx, cy, cz, key: k, state: 'pending', seen: Render.frame, worker: best });
      this.inflight[best]++;
      this.workers[best].postMessage({ type: 'chunk', cx, cy, cz, key: k });
    }
    // drop far chunks
    if (Render.frame % 30 === 0) {
      for (const [k, c] of this.chunks) {
        if (c.state === 'pending') continue;
        const mx = c.cx * CH + CH / 2, my = c.cy * CH + CH / 2, mz = c.cz * CH + CH / 2;
        if (Math.hypot(mx - cam[0], my - cam[1], mz - cam[2]) > R + 60) { Render.freeChunk(c); this.chunks.delete(k); }
      }
    }
    this.pending = want.length;
  },
  onMsg(wi, m) {
    if (m.type === 'error') { showErr(m.msg); return; }
    this.inflight[wi]--;
    const c = this.chunks.get(m.key);
    if (!c) return;
    this.stats.built++; this.stats.ms += m.ms || 0;
    if (m.empty) { c.state = 'empty'; this.stats.empty++; return; }
    const t0 = performance.now();
    Render.uploadChunk(c, m);
    c.state = 'ready';
    Flora.addChunk(c, m.inst);
    if (this.uploadMs) { const d = performance.now() - t0; this.uploadMs.sum += d; if (d > this.uploadMs.max) this.uploadMs.max = d; }
  },
  // fraction of the nearby world that is loaded (for the opening veil)
  readyFrac(cam) {
    let tot = 0, ok = 0;
    for (const c of this.chunks.values()) {
      const mx = c.cx * World.CH + 16, my = c.cy * World.CH + 16, mz = c.cz * World.CH + 16;
      if (Math.hypot(mx - cam[0], my - cam[1], mz - cam[2]) > 70) continue;
      tot++; if (c.state !== 'pending') ok++;
    }
    return tot ? ok / tot : 0;
  },
};

// the water's own flow at a point: strong only in narrow winding rivers, which follow the zero lines of a noise
function flowAt(x, y, z, out) {
  const s = 420, e = 2.0;
  const n = World.n2(x / s + 7.3, z / s - 3.1);
  const band = 1 - smooth(0.0, 0.085, Math.abs(n));
  out[0] = 0; out[1] = 0; out[2] = 0;
  if (band <= 0) return out;
  const on = smooth(0.1, 0.35, World.n2(x / 1900 - 41, z / 1900 + 13));     // only some rivers run
  if (on <= 0) return out;
  const gx = World.n2((x + e) / s + 7.3, z / s - 3.1) - World.n2((x - e) / s + 7.3, z / s - 3.1);
  const gz = World.n2(x / s + 7.3, (z + e) / s - 3.1) - World.n2(x / s + 7.3, (z - e) / s - 3.1);

  out[0] = -gz / gl2 * v; out[2] = gx / gl2 * v;

}

  current: [0, 0, 0], surge: 0, torch: 0, torchDir: [0, 0, 1], glow: 0, green: 0,
  flow: [0, 0, 0], flowT: [0, 0, 0], drift: [0, 0, 0], player: [0, 0, 0], speed: 0, floorDepth: 20, floorCol: [0.5, 0.6, 0.6],

  bw: new Float32Array(World.NB), bwS: null,
  update(dt, cam, look, t) {
    if (!this.bwS) { this.bwS = new Float32Array(World.NB); World.biomeAt(cam[0], cam[2], this.bwS); }
    if (Render.frame % 6 === 0) World.biomeAt(cam[0], cam[2], this.bw);
    const k = 1 - Math.exp(-dt / 4.0);
    for (let i = 0; i < World.NB; i++) this.bwS[i] += (this.bw[i] - this.bwS[i]) * k;
    const ta = [0, 0, 0], ts = [0, 0, 0]; let tg = 0, tc = 0, tt = 0, sw = 0;
    for (let i = 0; i < World.NB; i++) {
      const w = this.bwS[i]; if (w < 1e-3) continue;
      const p = WATER[World.BIOMES[i]];
      for (let c = 0; c < 3; c++) { ta[c] += p.a[c] * w; ts[c] += p.s[c] * w; }

    const f = ((this.dayStart + (Q.has('tod') ? +Q.get('tod') - this.dayStart : t / this.DAY)) % 1 + 1) % 1;

    const sh = Math.exp(-depth / 14);
    this.surge = Math.sin(t * 0.55) * 0.55 * sh + Math.sin(t * 0.93 + 1.3) * 0.2 * sh;
    this.current[0] = 0.12 + this.surge * 0.8; this.current[1] = 0; this.current[2] = 0.05 + this.surge * 0.45;
    if (Render.frame % 4 === 0) flowAt(cam[0], cam[1], cam[2], this.flowT);
    const kf = 1 - Math.exp(-dt * 1.5);
    for (let c = 0; c < 3; c++) { this.flow[c] += (this.flowT[c] - this.flow[c]) * kf; this.drift[c] += (this.flow[c] + this.current[c] * 0.6) * dt; }

    // is there open water above, or rock and ice? (caves, tunnels, overhangs, under bergs)
    if (Render.frame % 12 === 0) {
      const dirs = [[0, 1, 0], [0.45, 0.89, 0], [-0.45, 0.89, 0], [0, 0.89, 0.45], [0, 0.89, -0.45]];

      for (const d of dirs) {
        let free = 1;
        for (const dist of [1.5, 4, 8, 15]) {
          const x = cam[0] + d[0] * dist, y = cam[1] + d[1] * dist, z = cam[2] + d[2] * dist;

    const ambient = (this.sky[1] * Math.exp(-this.kd[1] * depth) + this.sun[1] * Math.exp(-(this.abs[1] + this.scat[1]) * depth / 0.9) * 0.3) * dd * (0.12 + 0.88 * this.open);
    const redGone = smooth(28, 48, depth);
    const want = Math.max(ambient < 0.08 ? 1 : ambient < 0.5 ? (0.5 - ambient) / 0.42 : 0, redGone * 0.85);
    const target = Input.torchOff ? 0 : want * 18;
    this.torch += (target - this.torch) * (1 - Math.exp(-dt * 2.5));
    this.torchDir[0] = look[0]; this.torchDir[1] = look[1]; this.torchDir[2] = look[2];
    this.glow = Math.max(clamp((depth - 80) / 200, 0, 1), this.night * 0.7);
    this.expMax = 7.0 - 4.4 * Math.max(smooth(25, 160, depth), this.night * 0.75);
    this.dark = clamp((0.3 - ambient) / 0.25, 0, 1);

    if (Render.frame % 10 === 0) { const fy = World.floorAt(cam[0], cam[2]); this.floorY = fy; this.floorTarget = Math.max(1, -fy); }
    this.floorDepth += ((this.floorTarget || 20) - this.floorDepth) * (1 - Math.exp(-dt * 2));
    const fdp = this.floorDepth;
    for (let c = 0; c < 3; c++) {
      const ext = this.abs[c] + this.scat[c];
      const lit = this.sun[c] * Math.exp(-ext * fdp / 0.92) * 0.9 + this.sky[c] * Math.exp(-this.kd[c] * fdp) * 0.8;
      this.floorCol[c] = lit * [0.62, 0.58, 0.48][c] * 0.6;
    }
    this.player[0] = cam[0]; this.player[1] = cam[1]; this.player[2] = cam[2];
  },
};

// Shaders. The look of the water lives here.
const GL_FRAME = `
layout(std140) uniform Frame {
  mat4 uView; mat4 uProj; mat4 uViewProj; mat4 uInvViewProj; mat4 uShadowVP; mat4 uPrevViewProj;
  vec4 uCam;        // xyz camera, w time
  vec4 uSunDir;     // xyz direction to the sun under water (refracted), w sun elevation factor
  vec4 uSunCol;     // sun just under the surface (HDR)
  vec4 uSkyCol;     // downwelling diffuse just under the surface

  vec4 uScat;       // scattering per metre (rgb), w: in-scatter gain
  vec4 uKd;         // diffuse attenuation per metre (rgb), w: caustic strength
  vec4 uRes;        // xy size, zw 1/size
  vec4 uCurrent;    // xyz steady current + surge (m/s), w surge phase
  vec4 uTorch;      // xyz torch direction, w torch power
  vec4 uParams;     // x frame, y deep glow amount, z biome green, w seconds since start
  vec4 uSunAir;     // xyz sun direction in air, w sky brightness
  vec4 uPlayer;     // xyz player position, w player speed
  vec4 uFloor;      // x water depth below the swimmer, yzw lit floor colour seen from above

const GL_COMMON = GL_FRAME + `

float n3t(vec3 p) { return texture(uNoise, p).r; }

vec3 extinction() { return uAbs.rgb + uScat.rgb; }

// below 40 m the light falls away faster than the water's colour alone would say: the deep is dark
float deepDark(vec3 p) { return exp(-max(depthOf(p) - 40.0, 0.0) * 0.024); }
vec3 sunAt(vec3 p) { return uSunCol.rgb * exp(-extinction() * depthOf(p) / max(uSunDir.y, 0.25)) * deepDark(p); }

vec2 entryXZ(vec3 p) { return p.xz + uSunDir.xz / max(uSunDir.y, 0.25) * depthOf(p); }

vec3 causticAt(vec3 p) {

  sum += texture(uShadow, vec3(c.xy + vec2(-0.3, 0.8) * r, c.z));

vec3 torchAt(vec3 p, vec3 n) {

// light arriving at a surface point (no view-path fog)
vec3 lightAtG(vec3 P, vec3 N, vec3 Ng, float ao, float sky, float trans, out vec3 sunPart) {

`;

// 3-D noise texture, rendered one layer at a time. Four tileable channels: gradient noise at 3 periods + cells.
const FS_NOISE3D = `
in vec2 vUv; out vec4 o;
uniform float uZ;
vec3 hash33(vec3 p) { p = vec3(dot(p, vec3(127.1, 311.7, 74.7)), dot(p, vec3(269.5, 183.3, 246.1)), dot(p, vec3(113.5, 271.9, 124.6))); return -1.0 + 2.0 * fract(sin(p) * 43758.5453123); }

  float r = 0.0;
  #define G(o) dot(hash33(mod(i + o, P)), f - o)
  float a = G(vec3(0,0,0)), b = G(vec3(1,0,0)), c = G(vec3(0,1,0)), d = G(vec3(1,1,0));
  float e = G(vec3(0,0,1)), f1 = G(vec3(1,0,1)), g = G(vec3(0,1,1)), h = G(vec3(1,1,1));
  return mix(mix(mix(a, b, u.x), mix(c, d, u.x), u.y), mix(mix(e, f1, u.x), mix(g, h, u.x), u.y), u.z);

    vec3 h = hash33(mod(i + o, P)) * 0.5 + 0.5;
    vec3 d = o + h - f; m = min(m, dot(d, d));

  return sqrt(m);
}

  vec3 p = vec3(vUv, uZ);
  float a = gnoise(p * 4.0, 4.0) * 0.5 + gnoise(p * 8.0, 8.0) * 0.25 + gnoise(p * 16.0, 16.0) * 0.125;
  float b = gnoise(p * 16.0 + 3.1, 16.0) * 0.6 + gnoise(p * 32.0, 32.0) * 0.3;
  float c = gnoise(p * 32.0 + 7.7, 32.0) * 0.7 + gnoise(p * 64.0, 64.0) * 0.3;

`;

// caustic pattern (R) and the softer pattern that makes the light shafts (G); tileable, animated
const FS_CAUSTIC = `
in vec2 vUv; out vec4 o;
uniform float uT;
float caus(vec2 uv, float time, float inten) {
  vec2 p = mod(uv * 6.28318530718, 6.28318530718) - 250.0;
  vec2 i = p; float c = 1.0;

  float s = 0.0;
  for (int i = 0; i < 15; i++) {

    vec2 c = fract(vec2(fract(sin(fi * 12.9898) * 43758.5453), fract(sin(fi * 78.233 + 1.0) * 43758.5453)) + vec2(sin(uT * 0.045 + fi), cos(uT * 0.037 + fi * 1.7)) * 0.05);
